version: 1.0.0
contract: D21
status: VALIDATION-BLOCKED
purpose: Cross-validate the canonical machine contract, state registry, event registry, permission registry and API capability map before implementation.
checks:
  canonical_event_set:
    status: PASS
    evidence:
      - machine contract event registry reconciled with event registry
      - creative.review_started registered
      - billing.suspicious registered
      - billing.invalidated registered
  capability_set:
    status: PASS
    evidence:
      - billing mutation capabilities exist separately from billing.read
      - dispute mutation capabilities are explicitly registered
  api_capability_mapping:
    status: PASS
    evidence:
      - OpenAPI operationIds have declared D21 capability mappings
      - forbidden direct D15 settlement class declared
  state_machine:
    status: BLOCKED
    findings:
      - creative machine previously declared REJECTED terminal while also allowing REJECTED -> DRAFT recovery; terminal semantics require reconciliation
      - reconciliation machine previously declared active states as terminal while transitions existed; terminal semantics require reconciliation
      - billing machine terminal declarations previously conflicted with FINALIZED -> ADJUSTED and INVALID/REVERSED -> ADJUSTED transitions
  permission_integrity:
    status: PASS
    evidence:
      - read capabilities cannot authorize mutation
      - billing.finalize is restricted to privileged platform/service profiles
      - external adapters cannot finalize billing
  event_envelope:
    status: PASS
    evidence:
      - schema_version and privacy_classification are mandatory
      - request_id, trace_id, tenant_id and idempotency_key are mandatory
  green_gate:
    status: BLOCKED
    reason: state-machine terminal/recovery semantics have not yet produced executable CI evidence
required_next_actions:
  - reconcile d21-state-machine-registry-v1.0.yaml terminal states and recovery transitions
  - verify reconciliation RESOLVED state is canonical across machine contract and state registry
  - execute automated YAML/JSON/OpenAPI parsing
  - execute registry set equality checks
  - execute permission mutation escalation checks
  - execute illegal-transition and terminal-transition tests
  - record workflow run and commit SHA as evidence
rule: BLOCKED is not GREEN; no implementation phase may consume this contract as GREEN until all checks PASS.
