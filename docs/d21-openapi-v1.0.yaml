openapi: 3.1.0
info:
  title: Luckread Advertising API
  version: 1.0.0
  description: Contract-first D21 advertising management and delivery API. Billing facts remain separate from payment settlement.
servers:
  - url: /v1
security:
  - bearerAuth: []
tags:
  - name: Advertising Accounts
  - name: Campaigns
  - name: Ad Groups
  - name: Creatives
  - name: Audiences
  - name: Inventory
  - name: Placements
  - name: Delivery
  - name: Reports
  - name: Billing
  - name: Disputes
paths:
  /advertising/accounts:
    get:
      tags: [Advertising Accounts]
      operationId: listAdvertisingAccounts
      responses:
        '200': { $ref: '#/components/responses/AdvertisingAccountList' }
    post:
      tags: [Advertising Accounts]
      operationId: createAdvertisingAccount
      requestBody: { $ref: '#/components/requestBodies/AdvertisingAccountCreate' }
      responses:
        '201': { $ref: '#/components/responses/AdvertisingAccount' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /advertising/accounts/{accountId}:
    parameters: [{ $ref: '#/components/parameters/accountId' }]
    get:
      tags: [Advertising Accounts]
      operationId: getAdvertisingAccount
      responses:
        '200': { $ref: '#/components/responses/AdvertisingAccount' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Advertising Accounts]
      operationId: updateAdvertisingAccount
      requestBody: { $ref: '#/components/requestBodies/AdvertisingAccountUpdate' }
      responses:
        '200': { $ref: '#/components/responses/AdvertisingAccount' }
        '403': { $ref: '#/components/responses/Error' }
  /advertising/campaigns:
    get:
      tags: [Campaigns]
      operationId: listCampaigns
      responses:
        '200': { $ref: '#/components/responses/CampaignList' }
    post:
      tags: [Campaigns]
      operationId: createCampaign
      requestBody: { $ref: '#/components/requestBodies/CampaignCreate' }
      responses:
        '201': { $ref: '#/components/responses/Campaign' }
        '400': { $ref: '#/components/responses/Error' }
  /advertising/campaigns/{campaignId}:
    parameters: [{ $ref: '#/components/parameters/campaignId' }]
    get:
      tags: [Campaigns]
      operationId: getCampaign
      responses:
        '200': { $ref: '#/components/responses/Campaign' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Campaigns]
      operationId: updateCampaign
      requestBody: { $ref: '#/components/requestBodies/CampaignUpdate' }
      responses:
        '200': { $ref: '#/components/responses/Campaign' }
        '409': { $ref: '#/components/responses/Error' }
  /advertising/campaigns/{campaignId}/submit:
    post:
      tags: [Campaigns]
      operationId: submitCampaign
      responses: { '202': { $ref: '#/components/responses/Accepted' }, '409': { $ref: '#/components/responses/Error' } }
  /advertising/campaigns/{campaignId}/pause:
    post:
      tags: [Campaigns]
      operationId: pauseCampaign
      responses: { '202': { $ref: '#/components/responses/Accepted' }, '409': { $ref: '#/components/responses/Error' } }
  /advertising/campaigns/{campaignId}/resume:
    post:
      tags: [Campaigns]
      operationId: resumeCampaign
      responses: { '202': { $ref: '#/components/responses/Accepted' }, '409': { $ref: '#/components/responses/Error' } }
  /advertising/campaigns/{campaignId}/cancel:
    post:
      tags: [Campaigns]
      operationId: cancelCampaign
      responses: { '202': { $ref: '#/components/responses/Accepted' }, '409': { $ref: '#/components/responses/Error' } }
  /advertising/ad-groups:
    get:
      tags: [Ad Groups]
      operationId: listAdGroups
      responses: { '200': { $ref: '#/components/responses/AdGroupList' } }
    post:
      tags: [Ad Groups]
      operationId: createAdGroup
      requestBody: { $ref: '#/components/requestBodies/AdGroupCreate' }
      responses: { '201': { $ref: '#/components/responses/AdGroup' } }
  /advertising/ad-groups/{adGroupId}:
    parameters: [{ $ref: '#/components/parameters/adGroupId' }]
    get:
      tags: [Ad Groups]
      operationId: getAdGroup
      responses: { '200': { $ref: '#/components/responses/AdGroup' } }
    patch:
      tags: [Ad Groups]
      operationId: updateAdGroup
      requestBody: { $ref: '#/components/requestBodies/AdGroupUpdate' }
      responses: { '200': { $ref: '#/components/responses/AdGroup' }, '409': { $ref: '#/components/responses/Error' } }
  /advertising/creatives:
    get:
      tags: [Creatives]
      operationId: listCreatives
      responses: { '200': { $ref: '#/components/responses/CreativeList' } }
    post:
      tags: [Creatives]
      operationId: createCreative
      requestBody: { $ref: '#/components/requestBodies/CreativeCreate' }
      responses: { '201': { $ref: '#/components/responses/Creative' } }
  /advertising/creatives/{creativeId}:
    parameters: [{ $ref: '#/components/parameters/creativeId' }]
    get:
      tags: [Creatives]
      operationId: getCreative
      responses: { '200': { $ref: '#/components/responses/Creative' } }
    patch:
      tags: [Creatives]
      operationId: updateCreative
      requestBody: { $ref: '#/components/requestBodies/CreativeUpdate' }
      responses: { '200': { $ref: '#/components/responses/Creative' }, '409': { $ref: '#/components/responses/Error' } }
  /advertising/creatives/{creativeId}/submit:
    post:
      tags: [Creatives]
      operationId: submitCreative
      responses: { '202': { $ref: '#/components/responses/Accepted' }, '409': { $ref: '#/components/responses/Error' } }
  /advertising/audiences:
    get:
      tags: [Audiences]
      operationId: listAudiences
      responses: { '200': { $ref: '#/components/responses/AudienceList' } }
    post:
      tags: [Audiences]
      operationId: createAudience
      requestBody: { $ref: '#/components/requestBodies/AudienceCreate' }
      responses: { '201': { $ref: '#/components/responses/Audience' } }
  /advertising/audiences/{audienceId}:
    parameters: [{ $ref: '#/components/parameters/audienceId' }]
    get:
      tags: [Audiences]
      operationId: getAudience
      responses: { '200': { $ref: '#/components/responses/Audience' } }
    patch:
      tags: [Audiences]
      operationId: updateAudience
      requestBody: { $ref: '#/components/requestBodies/AudienceUpdate' }
      responses: { '200': { $ref: '#/components/responses/Audience' }, '409': { $ref: '#/components/responses/Error' } }
  /advertising/inventory:
    get:
      tags: [Inventory]
      operationId: listInventory
      responses: { '200': { $ref: '#/components/responses/InventoryList' } }
  /advertising/inventory/{inventoryId}:
    parameters: [{ $ref: '#/components/parameters/inventoryId' }]
    get:
      tags: [Inventory]
      operationId: getInventory
      responses: { '200': { $ref: '#/components/responses/Inventory' } }
  /advertising/placements:
    get:
      tags: [Placements]
      operationId: listPlacements
      responses: { '200': { $ref: '#/components/responses/PlacementList' } }
  /advertising/placements/{placementId}:
    parameters: [{ $ref: '#/components/parameters/placementId' }]
    get:
      tags: [Placements]
      operationId: getPlacement
      responses: { '200': { $ref: '#/components/responses/Placement' } }
  /advertising/delivery/request:
    post:
      tags: [Delivery]
      operationId: requestAdDelivery
      security: []
      requestBody: { $ref: '#/components/requestBodies/DeliveryRequest' }
      responses:
        '200': { $ref: '#/components/responses/DeliveryDecision' }
        '204': { description: No fill; clients should use a typed no-fill response in implementation. }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /advertising/events/impression:
    post:
      tags: [Delivery]
      operationId: recordImpression
      security: []
      requestBody: { $ref: '#/components/requestBodies/AdEvent' }
      responses: { '202': { $ref: '#/components/responses/Accepted' }, '409': { $ref: '#/components/responses/Error' } }
  /advertising/events/click:
    post:
      tags: [Delivery]
      operationId: recordClick
      security: []
      requestBody: { $ref: '#/components/requestBodies/AdEvent' }
      responses: { '202': { $ref: '#/components/responses/Accepted' }, '409': { $ref: '#/components/responses/Error' } }
  /advertising/events/conversion:
    post:
      tags: [Delivery]
      operationId: recordConversion
      security: []
      requestBody: { $ref: '#/components/requestBodies/AdEvent' }
      responses: { '202': { $ref: '#/components/responses/Accepted' }, '409': { $ref: '#/components/responses/Error' } }
  /advertising/reports:
    get:
      tags: [Reports]
      operationId: getAdvertisingReport
      responses: { '200': { $ref: '#/components/responses/Report' } }
  /advertising/billing/ledger:
    get:
      tags: [Billing]
      operationId: listAdvertisingBillingLedger
      responses: { '200': { $ref: '#/components/responses/BillingLedgerList' } }
  /advertising/disputes:
    get:
      tags: [Disputes]
      operationId: listAdvertisingDisputes
      responses: { '200': { $ref: '#/components/responses/DisputeList' } }
    post:
      tags: [Disputes]
      operationId: createAdvertisingDispute
      requestBody: { $ref: '#/components/requestBodies/DisputeCreate' }
      responses: { '201': { $ref: '#/components/responses/Dispute' } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    accountId: { name: accountId, in: path, required: true, schema: { type: string } }
    campaignId: { name: campaignId, in: path, required: true, schema: { type: string } }
    adGroupId: { name: adGroupId, in: path, required: true, schema: { type: string } }
    creativeId: { name: creativeId, in: path, required: true, schema: { type: string } }
    audienceId: { name: audienceId, in: path, required: true, schema: { type: string } }
    inventoryId: { name: inventoryId, in: path, required: true, schema: { type: string } }
    placementId: { name: placementId, in: path, required: true, schema: { type: string } }
  requestBodies:
    AdvertisingAccountCreate: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdvertisingAccountCreate' } } } }
    AdvertisingAccountUpdate: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdvertisingAccountUpdate' } } } }
    CampaignCreate: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CampaignCreate' } } } }
    CampaignUpdate: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CampaignUpdate' } } } }
    AdGroupCreate: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdGroupCreate' } } } }
    AdGroupUpdate: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdGroupUpdate' } } } }
    CreativeCreate: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreativeCreate' } } } }
    CreativeUpdate: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreativeUpdate' } } } }
    AudienceCreate: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AudienceCreate' } } } }
    AudienceUpdate: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AudienceUpdate' } } } }
    DeliveryRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeliveryRequest' } } } }
    AdEvent: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdEvent' } } } }
    DisputeCreate: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DisputeCreate' } } } }
  responses:
    Accepted: { description: Accepted for asynchronous processing. }
    Error: { description: Typed platform error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    AdvertisingAccount: { description: Advertising account, content: { application/json: { schema: { $ref: '#/components/schemas/AdvertisingAccount' } } } }
    AdvertisingAccountList: { description: Advertising account list, content: { application/json: { schema: { $ref: '#/components/schemas/PageAdvertisingAccount' } } } }
    Campaign: { description: Campaign, content: { application/json: { schema: { $ref: '#/components/schemas/Campaign' } } } }
    CampaignList: { description: Campaign list, content: { application/json: { schema: { $ref: '#/components/schemas/PageCampaign' } } } }
    AdGroup: { description: Ad group, content: { application/json: { schema: { $ref: '#/components/schemas/AdGroup' } } } }
    AdGroupList: { description: Ad group list, content: { application/json: { schema: { $ref: '#/components/schemas/PageAdGroup' } } } }
    Creative: { description: Creative, content: { application/json: { schema: { $ref: '#/components/schemas/Creative' } } } }
    CreativeList: { description: Creative list, content: { application/json: { schema: { $ref: '#/components/schemas/PageCreative' } } } }
    Audience: { description: Audience, content: { application/json: { schema: { $ref: '#/components/schemas/Audience' } } } }
    AudienceList: { description: Audience list, content: { application/json: { schema: { $ref: '#/components/schemas/PageAudience' } } } }
    Inventory: { description: Inventory, content: { application/json: { schema: { $ref: '#/components/schemas/Inventory' } } } }
    InventoryList: { description: Inventory list, content: { application/json: { schema: { $ref: '#/components/schemas/PageInventory' } } } }
    Placement: { description: Placement, content: { application/json: { schema: { $ref: '#/components/schemas/Placement' } } } }
    PlacementList: { description: Placement list, content: { application/json: { schema: { $ref: '#/components/schemas/PagePlacement' } } } }
    DeliveryDecision: { description: Advertising delivery decision, content: { application/json: { schema: { $ref: '#/components/schemas/DeliveryDecision' } } } }
    Report: { description: Advertising report, content: { application/json: { schema: { $ref: '#/components/schemas/Report' } } } }
    BillingLedgerList: { description: Advertising billing ledger, content: { application/json: { schema: { $ref: '#/components/schemas/PageBillingLedgerEntry' } } } }
    Dispute: { description: Advertising dispute, content: { application/json: { schema: { $ref: '#/components/schemas/Dispute' } } } }
    DisputeList: { description: Advertising dispute list, content: { application/json: { schema: { $ref: '#/components/schemas/PageDispute' } } } }
  schemas:
    Id: { type: string, minLength: 1 }
    Version: { type: integer, minimum: 1 }
    Timestamp: { type: string, format: date-time }
    Error:
      type: object
      required: [code, message, request_id, retryable]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string }
        trace_id: { type: string }
        retryable: { type: boolean }
        details: { type: object, additionalProperties: true }
    PageMeta:
      type: object
      required: [has_more]
      properties:
        next_cursor: { type: string }
        has_more: { type: boolean }
        snapshot_id: { type: string }
    AdvertisingAccountCreate:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        type: { type: string, enum: [PERSONAL, CREATOR, ORGANIZATION, ENTERPRISE, AGENCY, PARTNER] }
        organization_id: { $ref: '#/components/schemas/Id' }
    AdvertisingAccountUpdate:
      type: object
      properties: { name: { type: string, maxLength: 200 } }
    AdvertisingAccount:
      type: object
      required: [id, name, type, state, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        type: { type: string }
        state: { type: string, enum: [CREATING, ACTIVE, MONITORING, RESTRICTED, SUSPENDED, CLOSED] }
        version: { $ref: '#/components/schemas/Version' }
    CampaignCreate:
      type: object
      required: [advertiser_id, name, objective]
      properties:
        advertiser_id: { $ref: '#/components/schemas/Id' }
        name: { type: string, minLength: 1, maxLength: 200 }
        objective: { type: string }
        budget: { type: number, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
    CampaignUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        objective: { type: string }
        expected_version: { type: integer, minimum: 1 }
    Campaign:
      type: object
      required: [id, advertiser_id, name, state, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        advertiser_id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        objective: { type: string }
        state: { type: string, enum: [DRAFT, SUBMITTED, REVIEWING, APPROVED, ACTIVE, PAUSED, COMPLETED, REJECTED, SUSPENDED, CANCELLED, EXPIRED] }
        version: { $ref: '#/components/schemas/Version' }
    AdGroupCreate:
      type: object
      required: [campaign_id, name]
      properties: { campaign_id: { $ref: '#/components/schemas/Id' }, name: { type: string, maxLength: 200 } }
    AdGroupUpdate:
      type: object
      properties: { name: { type: string, maxLength: 200 }, expected_version: { type: integer, minimum: 1 } }
    AdGroup:
      type: object
      required: [id, campaign_id, name, state, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        campaign_id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        state: { type: string, enum: [DRAFT, ACTIVE, PAUSED, SUSPENDED, ARCHIVED] }
        version: { $ref: '#/components/schemas/Version' }
    CreativeCreate:
      type: object
      required: [ad_group_id, media_id, format]
      properties:
        ad_group_id: { $ref: '#/components/schemas/Id' }
        media_id: { $ref: '#/components/schemas/Id' }
        format: { type: string, enum: [BANNER, NATIVE, VIDEO, REWARDED_VIDEO, INTERSTITIAL, SEARCH_AD, SPONSORED_CONTENT, SPONSORED_CREATOR, LIVE_AD, GAME_AD, MINI_APP_AD] }
    CreativeUpdate:
      type: object
      properties: { media_id: { $ref: '#/components/schemas/Id' }, expected_version: { type: integer, minimum: 1 } }
    Creative:
      type: object
      required: [id, ad_group_id, media_id, format, state, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        ad_group_id: { $ref: '#/components/schemas/Id' }
        media_id: { $ref: '#/components/schemas/Id' }
        format: { type: string }
        state: { type: string, enum: [DRAFT, SUBMITTED, REVIEWING, APPROVED, ACTIVE, REJECTED, SUSPENDED, ARCHIVED] }
        version: { $ref: '#/components/schemas/Version' }
    AudienceCreate:
      type: object
      required: [name, type]
      properties:
        name: { type: string, maxLength: 200 }
        type: { type: string, enum: [ALL_USERS, CUSTOM_AUDIENCE, LOOKALIKE_AUDIENCE, CREATOR_AUDIENCE, INTEREST_AUDIENCE, CONTENT_AUDIENCE, RETARGETING] }
        definition: { type: object, additionalProperties: true }
    AudienceUpdate:
      type: object
      properties: { definition: { type: object, additionalProperties: true }, expected_version: { type: integer, minimum: 1 } }
    Audience:
      type: object
      required: [id, name, type, state, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        type: { type: string }
        state: { type: string, enum: [DRAFT, ACTIVE, SUSPENDED, EXPIRED] }
        version: { $ref: '#/components/schemas/Version' }
    Inventory:
      type: object
      required: [id, type, state]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        type: { type: string }
        state: { type: string, enum: [ACTIVE, PAUSED, BLOCKED, ARCHIVED] }
        allowed_formats: { type: array, items: { type: string } }
    Placement:
      type: object
      required: [id, inventory_id, name, state]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        inventory_id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        state: { type: string, enum: [ACTIVE, PAUSED, BLOCKED, ARCHIVED] }
        allowed_formats: { type: array, items: { type: string } }
    DeliveryRequest:
      type: object
      required: [inventory_id, placement_id, client_type, client_version, request_id]
      properties:
        inventory_id: { $ref: '#/components/schemas/Id' }
        placement_id: { $ref: '#/components/schemas/Id' }
        client_type: { type: string, enum: [WEB, H5, ANDROID, IOS, MINI_APP, GAME] }
        client_version: { type: string }
        request_id: { type: string }
        context: { type: object, additionalProperties: true }
    DeliveryDecision:
      type: object
      required: [request_id, decision_id, result, disclosure]
      properties:
        request_id: { type: string }
        decision_id: { type: string }
        result: { type: string, enum: [FILLED, NO_FILL] }
        advertiser_id: { $ref: '#/components/schemas/Id' }
        campaign_id: { $ref: '#/components/schemas/Id' }
        creative_id: { $ref: '#/components/schemas/Id' }
        disclosure:
          type: object
          required: [is_sponsored]
          properties:
            is_sponsored: { type: boolean }
            label: { type: string }
        no_fill_reason: { type: string }
    AdEvent:
      type: object
      required: [event_id, event_type, request_id, decision_id, occurred_at, idempotency_key]
      properties:
        event_id: { $ref: '#/components/schemas/Id' }
        event_type: { type: string, enum: [impression, click, conversion] }
        request_id: { type: string }
        decision_id: { type: string }
        advertiser_id: { $ref: '#/components/schemas/Id' }
        campaign_id: { $ref: '#/components/schemas/Id' }
        creative_id: { $ref: '#/components/schemas/Id' }
        placement_id: { $ref: '#/components/schemas/Id' }
        occurred_at: { $ref: '#/components/schemas/Timestamp' }
        idempotency_key: { type: string }
        metadata: { type: object, additionalProperties: true }
    Report:
      type: object
      properties:
        report_version: { type: string }
        period: { type: object, additionalProperties: true }
        metrics: { type: object, additionalProperties: true }
        breakdowns: { type: array, items: { type: object, additionalProperties: true } }
    BillingLedgerEntry:
      type: object
      required: [id, state, amount, currency, event_id]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        state: { type: string, enum: [PENDING, VALID, BILLABLE, FINALIZED, INVALID, SUSPICIOUS, REVERSED, ADJUSTED] }
        amount: { type: number }
        currency: { type: string }
        event_id: { $ref: '#/components/schemas/Id' }
        evidence_id: { $ref: '#/components/schemas/Id' }
    DisputeCreate:
      type: object
      required: [category, subject_id, description]
      properties:
        category: { type: string, enum: [BILLING, TRAFFIC, ATTRIBUTION, MODERATION, DELIVERY, ACCOUNT] }
        subject_id: { $ref: '#/components/schemas/Id' }
        description: { type: string, maxLength: 5000 }
    Dispute:
      type: object
      required: [id, category, state]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        category: { type: string }
        state: { type: string, enum: [OPEN, UNDER_REVIEW, EVIDENCE_REQUIRED, RESOLVED, REJECTED, ESCALATED] }
        subject_id: { $ref: '#/components/schemas/Id' }
    PageAdvertisingAccount: { type: object, required: [data, meta], properties: { data: { type: array, items: { $ref: '#/components/schemas/AdvertisingAccount' } }, meta: { $ref: '#/components/schemas/PageMeta' } } }
