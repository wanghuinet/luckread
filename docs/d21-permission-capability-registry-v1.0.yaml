version: 1.0.1
contract: D21
status: CONTRACT-FROZEN
source_of_truth: docs/21-D21-ADVERTISING-PERMISSION-MATRIX-v1.0.md
authorization_source: D02
rules:
  - every capability is evaluated through D02
  - read capabilities MUST NOT authorize mutation
  - SYSTEM capabilities are never ordinary user permissions
  - tenant and resource scope are mandatory
  - privileged operations require audit evidence

capability_index:
  - advertising.read
  - advertising.create
  - advertising.update
  - advertising.delete
  - campaign.read
  - campaign.create
  - campaign.update
  - campaign.publish
  - campaign.pause
  - campaign.cancel
  - ad_group.read
  - ad_group.create
  - ad_group.update
  - ad_group.delete
  - creative.read
  - creative.create
  - creative.update
  - creative.submit
  - creative.appeal
  - audience.read
  - audience.create
  - audience.update
  - inventory.read
  - inventory.manage
  - placement.read
  - placement.manage
  - delivery.request
  - auction.execute
  - traffic.record
  - traffic.validate
  - attribution.read
  - attribution.execute
  - billing.read
  - billing.export
  - billing.make_billable
  - billing.finalize
  - billing.reverse
  - billing.adjust
  - report.read
  - report.export
  - dispute.create
  - dispute.read
  - dispute.appeal
  - dispute.review
  - dispute.request_evidence
  - dispute.resolve
  - dispute.escalate
  - external_adapter.connect
  - external_adapter.read
  - external_adapter.sync
  - external_adapter.reconcile
  - evidence.read
  - operations.kill_switch

capabilities:
  billing.make_billable:
    mutation: true
    allowed_profiles: [PLATFORM_AD_OPERATOR, SYSTEM_SERVICE]
    scope: [GLOBAL_RESTRICTED, SERVICE_SCOPE_ONLY]
  billing.finalize:
    mutation: true
    allowed_profiles: [PLATFORM_AD_OPERATOR, SYSTEM_SERVICE]
    scope: [GLOBAL_RESTRICTED, SERVICE_SCOPE_ONLY]
  billing.reverse:
    mutation: true
    allowed_profiles: [PLATFORM_AD_OPERATOR, PLATFORM_RISK_OPERATOR, SYSTEM_SERVICE]
    scope: [GLOBAL_RESTRICTED, SERVICE_SCOPE_ONLY]
  billing.adjust:
    mutation: true
    allowed_profiles: [PLATFORM_AD_OPERATOR, SYSTEM_SERVICE]
    scope: [GLOBAL_RESTRICTED, SERVICE_SCOPE_ONLY]
  dispute.review:
    mutation: true
    allowed_profiles: [DISPUTE_MANAGER, PLATFORM_AD_OPERATOR, SYSTEM_SERVICE]
    scope: [OWN, ORGANIZATION, GLOBAL_RESTRICTED, SERVICE_SCOPE_ONLY]
  dispute.request_evidence:
    mutation: true
    allowed_profiles: [DISPUTE_MANAGER, PLATFORM_AD_OPERATOR, SYSTEM_SERVICE]
    scope: [OWN, ORGANIZATION, GLOBAL_RESTRICTED, SERVICE_SCOPE_ONLY]
  dispute.resolve:
    mutation: true
    allowed_profiles: [DISPUTE_MANAGER, PLATFORM_AD_OPERATOR, SYSTEM_SERVICE]
    scope: [OWN, ORGANIZATION, GLOBAL_RESTRICTED, SERVICE_SCOPE_ONLY]
  dispute.escalate:
    mutation: true
    allowed_profiles: [DISPUTE_MANAGER, PLATFORM_AD_OPERATOR, SYSTEM_SERVICE]
    scope: [OWN, ORGANIZATION, GLOBAL_RESTRICTED, SERVICE_SCOPE_ONLY]

forbidden_authorizations:
  - billing.read -> billing.make_billable
  - billing.read -> billing.finalize
  - billing.read -> billing.reverse
  - billing.read -> billing.adjust
  - dispute.read -> dispute.review
  - dispute.read -> dispute.request_evidence
  - dispute.read -> dispute.resolve
  - dispute.read -> dispute.escalate
  - advertiser_role -> traffic.validate
  - advertiser_role -> billing.finalize
  - external_adapter -> billing.finalize

evidence:
  - capability_exists_in_machine_contract
  - capability_exists_in_D02_permission_registry
  - capability_has_scope
  - capability_has_profile_mapping
  - read_to_mutation_escalation_test
  - cross_tenant_denial_test
