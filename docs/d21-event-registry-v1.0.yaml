version: 1.0.1
contract: D21
status: CONTRACT-FROZEN
source_of_truth: docs/21-D21-ADVERTISING-PLATFORM-CONTRACT-v1.0.md
event_namespace: advertising
rules:
  delivery: at_least_once
  consumer_requirement: idempotent
  ordering: per_aggregate_when_required
  replay: supported
  schema_versioning: mandatory
  unknown_event_policy: quarantine
  unknown_version_policy: reject_or_quarantine
  billing_events: append_only
  raw_events: immutable
  traceability: request_id_and_trace_id_required
  tenant_isolation: mandatory
  authorization: D02
  risk_boundary: D13
  payment_boundary: D15
  analytics_boundary: D14
envelope:
  required: [event_id, event_type, event_version, schema_version, occurred_at, producer, request_id, trace_id, tenant_id, subject_id, idempotency_key, privacy_classification, payload]
  fields:
    event_id: string
    event_type: string
    event_version: integer
    schema_version: string
    occurred_at: datetime
    producer: string
    request_id: string
    trace_id: string
    tenant_id: string
    organization_id: string|null
    actor_id: string|null
    subject_id: string
    idempotency_key: string
    correlation_id: string|null
    causation_id: string|null
    privacy_classification: [PUBLIC, INTERNAL, CONFIDENT, RESTRICTED]
    payload: object
    forbidden_payloads: [password, access_token, refresh_token, payment_card_data, secret]
