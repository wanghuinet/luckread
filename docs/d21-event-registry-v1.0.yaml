consumer_rules:
  - every consumer must deduplicate by event_id or producer-defined idempotency_key
  - consumers must tolerate duplicate delivery
  - consumers must not infer billing finality from impression or click alone
  - consumers must not mutate raw ad events
  - analytics consumers may derive metrics but cannot rewrite D21 billing facts
  - notification consumers cannot authorize delivery
  - feed consumers must preserve sponsored disclosure
  - risk consumers may change traffic validity only through registered D21 transition
  - D15 consumes finalized billing facts for payment/settlement and cannot rewrite them
  - replay must preserve original event_id and append replay metadata
ordering:
  campaign: [created, submitted, review_started, approved, activated, paused, resumed, suspended, cancelled, completed, expired]
  creative: [created, submitted, review_started, approved, activated, suspended, archived]
  traffic: [pending, validated, suspicious, invalidated, reversed]
  billing: [pending, validated, billable, finalized, reversed, adjusted]
idempotency:
  key_scope: [producer, event_type, idempotency_key]
  duplicate_policy: return_original_result
  conflicting_reuse_policy: reject
replay:
  supported: true
  preserves_event_id: true
  creates_replay_id: true
  billing_safety: replay_never_creates_duplicate_final_charge
dead_letter:
  required: true
  reasons: [schema_invalid, unknown_event, unknown_version, authorization_failure, tenant_violation, poison_message, retry_exhausted]
  replay_requires: [operator_authorization, evidence, idempotency_check]
evidence_requirements: [event_schema_validation, producer_contract_validation, consumer_idempotency_tests, duplicate_delivery_tests, ordering_tests, out_of_order_tests, replay_tests, dead_letter_tests, tenant_isolation_tests, billing_replay_safety_tests, cross_domain_boundary_tests]
