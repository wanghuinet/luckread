version: 1.0.0
contract: D21
status: CONTRACT-FROZEN
source_of_truth: docs/d21-openapi-v1.0.yaml
rules:
  - every OpenAPI operationId maps to exactly one declared D21 capability
  - mutation operations require idempotency when their contract marks them retryable
  - public delivery/event endpoints still require D21 request authenticity and abuse controls
  - no operation may invoke D15 payment settlement directly
operations:
  listAdvertisingAccounts: advertising.read
  createAdvertisingAccount: advertising.create
  getAdvertisingAccount: advertising.read
  updateAdvertisingAccount: advertising.update
  listCampaigns: campaign.read
  createCampaign: campaign.create
  getCampaign: campaign.read
  updateCampaign: campaign.update
  submitCampaign: campaign.publish
  pauseCampaign: campaign.pause
  resumeCampaign: campaign.publish
  cancelCampaign: campaign.cancel
  listAdGroups: ad_group.read
  createAdGroup: ad_group.create
  getAdGroup: ad_group.read
  updateAdGroup: ad_group.update
  listCreatives: creative.read
  createCreative: creative.create
  getCreative: creative.read
  updateCreative: creative.update
  submitCreative: creative.submit
  listAudiences: audience.read
  createAudience: audience.create
  getAudience: audience.read
  updateAudience: audience.update
  listInventory: inventory.read
  getInventory: inventory.read
  listPlacements: placement.read
  getPlacement: placement.read
  requestAdDelivery: delivery.request
  recordImpression: traffic.record
  recordClick: traffic.record
  recordConversion: traffic.record
  getAdvertisingReport: report.read
  listAdvertisingBillingLedger: billing.read
  listAdvertisingDisputes: dispute.read
  createAdvertisingDispute: dispute.create
forbidden_operation_classes:
  - direct_D15_payment_settlement
  - advertiser_traffic_validation
  - advertiser_billing_finalization
  - local_authorization_bypass
