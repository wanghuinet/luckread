name: W01 plugin lock refresh

on:
  push:
    branches:
      - fix/1.1-public-cache-boundary-hardening-20261007

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message != 'chore(1.1): refresh W01 plugin lockfile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --lockfile-only --ignore-scripts
        working-directory: workers/W01-payload
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/W01-payload/pnpm-lock.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(1.1): refresh W01 plugin lockfile"
          git push
