name: AUTH-002 Orphan Probe User Cleanup

on:
  workflow_dispatch:
    inputs:
      target_run_id:
        description: "Exact failed AUTH-002 remote runtime evidence run that left the synthetic user"
        required: true
        default: "36127160884"
        type: string
      database_name:
        description: "Controlled D1 database name"
        required: true
        default: "luckread"
        type: string
      confirm:
        description: "Type CLEANUP_AUTH002_ORPHAN_USER"
        required: true
        default: "CLEANUP_AUTH002_ORPHAN_USER"
        type: string

permissions:
  contents: read

env:
  WRANGLER_VERSION: 4.116.0
  TARGET_RUN_ID: ${{ inputs.target_run_id }}

jobs:
  cleanup-orphan-probe-user:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate cleanup admission
        env:
          CONFIRM: ${{ inputs.confirm }}
          DATABASE_NAME: ${{ inputs.database_name }}
        run: |
          set -euo pipefail
          test "$DATABASE_NAME" = "luckread"
          test "$CONFIRM" = "CLEANUP_AUTH002_ORPHAN_USER"
          test "$TARGET_RUN_ID" = "36127160884"

      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.34.5 --activate

      - name: Configure Cloudflare access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Preflight exact synthetic residue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_NAME: ${{ inputs.database_name }}
        working-directory: workers/W01-payload
        run: |
          set -euo pipefail
          mkdir -p ../../artifacts/evidence/auth-002/orphan-cleanup

          npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "$DATABASE_NAME" --remote --json --config wrangler.jsonc --command 'SELECT COUNT(*) AS user_count FROM users;' > ../../artifacts/evidence/auth-002/orphan-cleanup/preflight-user-count.json
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "$DATABASE_NAME" --remote --json --config wrangler.jsonc --command "SELECT id,email,created_at FROM users ORDER BY created_at DESC LIMIT 10;" > ../../artifacts/evidence/auth-002/orphan-cleanup/candidates.json
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "$DATABASE_NAME" --remote --json --config wrangler.jsonc --command 'SELECT id,name,batch FROM payload_migrations ORDER BY id;' > ../../artifacts/evidence/auth-002/orphan-cleanup/migrations.json

          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFileSync, writeFileSync } from 'node:fs'

          const rows = (file) => {
            const root = JSON.parse(readFileSync(file, 'utf8'))
            const out = []
            const walk = (value) => {
              if (Array.isArray(value)) { for (const item of value) walk(item); return }
              if (!value || typeof value !== 'object') return
              if (Array.isArray(value.results)) out.push(...value.results)
              if (Array.isArray(value.result)) out.push(...value.result)
              if (value.result && Array.isArray(value.result.results)) out.push(...value.result.results)
              for (const child of Object.values(value)) walk(child)
            }
            walk(root)
            return [...new Map(out.map((row) => [JSON.stringify(row), row])).values()]
          }

          const countRows = rows('../../artifacts/evidence/auth-002/orphan-cleanup/preflight-user-count.json')
          const candidates = rows('../../artifacts/evidence/auth-002/orphan-cleanup/candidates.json')
          const migrations = rows('../../artifacts/evidence/auth-002/orphan-cleanup/migrations.json')

          const userCount = Number(countRows[0]?.user_count ?? -1)
          const migrationNames = migrations.map((row) => String(row.name)).filter(Boolean)
          const candidate = candidates[0]
          const email = String(candidate?.email ?? '')
          const createdAt = String(candidate?.created_at ?? '')
          const createdMs = Date.parse(createdAt)
          const windowStart = Date.parse('2026-09-25T11:01:47Z')
          const windowEnd = Date.parse('2026-09-25T11:02:45Z')
          const emailMatches = /^auth002-primary-[^@]+@example\.com$/.test(email)
          const timeMatches = Number.isFinite(createdMs) && createdMs >= windowStart && createdMs <= windowEnd
          const historyMatches = JSON.stringify(migrationNames) === JSON.stringify([
            '20250929_111647',
            '20260921_003203_MIG_AUTH_002_SESSION_V1',
          ])

          if (userCount !== 1) throw new Error(`cleanup blocked: expected exactly one users row, got ${userCount}`)
          if (candidates.length !== 1) throw new Error(`cleanup blocked: expected exactly one AUTH-002 primary candidate, got ${candidates.length}`)
          if (!candidate?.id) throw new Error('cleanup blocked: candidate id missing')
          if (!emailMatches) throw new Error('cleanup blocked: candidate email does not match AUTH-002 synthetic pattern')
          if (!timeMatches) throw new Error(`cleanup blocked: candidate created_at is outside failed-run window: ${createdAt}`)
          if (!historyMatches) throw new Error(`cleanup blocked: migration history mismatch: ${JSON.stringify(migrationNames)}`)

          const summary = {
            targetRunId: Number(process.env.TARGET_RUN_ID),
            databaseName: process.env.DATABASE_NAME,
            sourceSha: process.env.GITHUB_SHA,
            userCountBefore: userCount,
            candidateCount: candidates.length,
            candidateIdRedacted: createHash('sha256').update(String(candidate.id)).digest('hex'),
            candidateEmailRedacted: createHash('sha256').update(email).digest('hex'),
            candidateCreatedAt: createdAt,
            migrationHistory: migrationNames,
            preflight: 'PASS',
          }
          writeFileSync('../../artifacts/evidence/auth-002/orphan-cleanup/cleanup-summary.json', JSON.stringify(summary, null, 2) + '\n')
          console.log(JSON.stringify(summary, null, 2))
          NODE

      - name: Execute targeted synthetic residue cleanup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_NAME: ${{ inputs.database_name }}
        working-directory: workers/W01-payload
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { readFileSync } from 'node:fs'

          const parseRows = (file) => {
            const root = JSON.parse(readFileSync(file, 'utf8'))
            const out = []
            const walk = (value) => {
              if (Array.isArray(value)) { for (const item of value) walk(item); return }
              if (!value || typeof value !== 'object') return
              if (Array.isArray(value.results)) out.push(...value.results)
              if (Array.isArray(value.result)) out.push(...value.result)
              if (value.result && Array.isArray(value.result.results)) out.push(...value.result.results)
              for (const child of Object.values(value)) walk(child)
            }
            walk(root)
            return [...new Map(out.map((row) => [JSON.stringify(row), row])).values()]
          }

          const shell = (sql) => {
            const raw = execFileSync(
              'npx',
              ['--yes', `wrangler@${process.env.WRANGLER_VERSION}`, 'd1', 'execute', process.env.DATABASE_NAME, '--remote', '--json', '--config', 'wrangler.jsonc', '--command', sql],
              { encoding: 'utf8', env: process.env },
            )
            return raw
          }

          const candidate = parseRows('../../artifacts/evidence/auth-002/orphan-cleanup/candidates.json')[0]
          const userId = String(candidate.id).replace(/'/g, "''")

          shell(`DELETE FROM auth_session_state WHERE user_id='${userId}'`)
          shell(`DELETE FROM users_sessions WHERE CAST(_parent_id AS TEXT)='${userId}'`)
          shell(`DELETE FROM users WHERE CAST(id AS TEXT)='${userId}'`)
          console.log('AUTH-002_ORPHAN_CLEANUP_MUTATION=PASS')
          NODE

      - name: Verify cleanup result
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_NAME: ${{ inputs.database_name }}
        working-directory: workers/W01-payload
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "$DATABASE_NAME" --remote --json --config wrangler.jsonc --command 'SELECT COUNT(*) AS user_count FROM users;' > ../../artifacts/evidence/auth-002/orphan-cleanup/post-user-count.json
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "$DATABASE_NAME" --remote --json --config wrangler.jsonc --command "SELECT COUNT(*) AS synthetic_candidate_count FROM users WHERE email LIKE 'auth002-primary-%@example.com';" > ../../artifacts/evidence/auth-002/orphan-cleanup/post-candidate-count.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const readCount = (file) => {
            const root = JSON.parse(readFileSync(file, 'utf8'))
            const rows = []
            const walk = (value) => {
              if (Array.isArray(value)) { for (const item of value) walk(item); return }
              if (!value || typeof value !== 'object') return
              if (Array.isArray(value.results)) rows.push(...value.results)
              if (Array.isArray(value.result)) rows.push(...value.result)
              if (value.result && Array.isArray(value.result.results)) rows.push(...value.result.results)
              for (const child of Object.values(value)) walk(child)
            }
            walk(root)
            return Number(rows[0]?.user_count ?? rows[0]?.synthetic_candidate_count ?? -1)
          }
          const userCount = readCount('../../artifacts/evidence/auth-002/orphan-cleanup/post-user-count.json')
          const candidateCount = readCount('../../artifacts/evidence/auth-002/orphan-cleanup/post-candidate-count.json')
          if (userCount !== 0) throw new Error(`cleanup verification failed: users count is ${userCount}`)
          if (candidateCount !== 0) throw new Error(`cleanup verification failed: synthetic candidate count is ${candidateCount}`)
          const path='../../artifacts/evidence/auth-002/orphan-cleanup/cleanup-summary.json'
          const summary=JSON.parse(readFileSync(path,'utf8'))
          summary.cleanup='PASS'
          summary.userCountAfter=userCount
          summary.candidateCountAfter=candidateCount
          summary.verifiedAt=new Date().toISOString()
          const {writeFileSync}=await import('node:fs')
          writeFileSync(path, JSON.stringify(summary,null,2)+'\n')
          console.log(JSON.stringify(summary,null,2))
          NODE

      - name: Upload cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-002-orphan-cleanup-${{ github.run_id }}
          path: artifacts/evidence/auth-002/orphan-cleanup/
          if-no-files-found: error
          retention-days: 30
