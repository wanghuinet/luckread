name: AUTH-013 Lifecycle Matrix Runtime Evidence
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Source ref for the admitted AUTH-013 transition kernel; default is current main
        required: true
        default: main
        type: string
      database_name:
        description: Current Cloudflare display name for D1-01
        required: true
        default: luckread
        type: string
      confirm:
        description: Type RUN to execute the controlled remote lifecycle evidence
        required: true
        default: RUN
        type: string
permissions:
  contents: read
jobs:
  lifecycle-matrix:
    if: ${{ inputs.confirm == 'RUN' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      D1_01_ID: "2f80471e-3756-49f9-8db1-7707a433ad64"
      DATABASE_NAME: ${{ inputs.database_name }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout exact current source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify exact evidence admission inputs
        env:
          SOURCE_REF: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')"
          test -n "$MAIN_SHA"
          test "$CHECKED_OUT_SHA" = "$MAIN_SHA"
          test "$DATABASE_NAME" = "luckread"
          test -f workers/W02-identity/src/account/account-state-transition.ts
          test -f contracts/state-machines/account.json
          test -f contracts/events/identity-account-state-changed.v1.json
          test -z "$(git status --short)"
      - name: Validate Cloudflare credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Prepare ephemeral remote D1 lifecycle harness
        run: |
          set -euo pipefail
          cat > .auth-013-lifecycle.wrangler.jsonc <<EOF
          {
            "\$schema": "./node_modules/wrangler/config-schema.json",
            "name": "luckread-auth013-lifecycle-evidence-harness",
            "main": ".auth-013-lifecycle-harness.ts",
            "compatibility_date": "2025-08-15",
            "d1_databases": [
              {
                "binding": "D1_01",
                "database_name": "$DATABASE_NAME",
                "database_id": "$D1_01_ID",
                "remote": true
              }
            ]
          }
          EOF
          node - <<'NODE'
          const fs=require('node:fs')
          const contract=JSON.parse(fs.readFileSync('contracts/state-machines/account.json','utf8'))
          const transitions=contract['x-transitions']
          if(!Array.isArray(transitions) || transitions.length!==26) throw new Error('canonical account transition count changed')
          fs.writeFileSync('.auth-013-lifecycle-rules.ts', 'export const canonicalTransitions = '+JSON.stringify(transitions)+' as const')
          NODE
          cat > .auth-013-lifecycle-harness.ts <<'EOF'
          // CI-only ephemeral harness. Synthetic User/session/journal rows are cleaned.
          // This exercises every canonical account-state transition against remote D1.
          // @ts-nocheck
          import { applyAccountStateTransition } from './workers/W02-identity/src/account/account-state-transition.ts'
          import { canonicalTransitions } from './.auth-013-lifecycle-rules.ts'

          const json = (body, status=200) =>
            new Response(JSON.stringify(body, null, 2), {status, headers:{'content-type':'application/json'}})

          const transition = async (db, input) => {
            try { return {ok:true, result:await applyAccountStateTransition(db,input)} }
            catch (e) { return {ok:false, error:{code:e?.code??'UNKNOWN', message:String(e?.message??e)}} }
          }

          const actorFor = (rule, uid) => {
            if (rule.actor === 'user') return { id:String(uid), type:'user' }
            if (rule.actor === 'operator') return { id:'auth013-operator', type:'operator' }
            if (rule.actor === 'admin') return { id:'auth013-admin', type:'admin' }
            return { id:'auth013-system', type:'job' }
          }

          const permissionFor = (rule) => rule.permission ?? null
          const approvalFor = (rule) =>
            rule.requiresApproval ? (rule.requiresApproval === true ? 'L7' : rule.requiresApproval) : null

          export default {
            async fetch(request, env) {
              const pathname = new URL(request.url).pathname
              if (request.method === 'GET' && pathname === '/__auth013_lifecycle_ready')
                return new Response(null,{status:204})
              if (request.method !== 'POST' || pathname !== '/__auth013_lifecycle_probe')
                return new Response(null,{status:404})

              const db=env.D1_01
              const baseUid=910013000+(Date.now()%100000)
              const created=[]
              const now='2026-10-04T13:30:00.000Z'
              const results=[]

              try {
                if (canonicalTransitions.length !== 26) throw new Error('expected 26 canonical transitions')

                for (let i=0;i<canonicalTransitions.length;i++) {
                  const rule=canonicalTransitions[i]
                  const uid=baseUid+i
                  const sid='auth013-full-matrix-session-'+uid
                  const email='auth013-full-matrix-'+uid+'@invalid.local'
                  const username='auth013-full-matrix-'+uid
                  const correlationId='auth013-full-matrix-'+i+'-'+uid

                  await db.prepare(
                    'INSERT INTO users (id,email,username,account_state,account_state_version) VALUES (?,?,?,?,?)'
                  ).bind(uid,email,username,rule.from,1).run()
                  created.push({uid:String(uid),sid})

                  await db.prepare(
                    'INSERT INTO auth_session_state (session_id,user_id,device_id,token_version,refresh_credential_hash,revoked_at,last_seen_at) VALUES (?,?,?,?,?,NULL,?)'
                  ).bind(
                    sid,String(uid),'auth013-full-matrix-device-'+uid,1,
                    'synthetic-refresh-'+uid,now
                  ).run()

                  const input={
                    userId:String(uid),
                    expectedVersion:1,
                    to:rule.to,
                    reason:'AUTH-013 canonical 26-transition remote matrix',
                    now,
                    correlationId,
                    causationId:correlationId,
                    actor:actorFor(rule,uid),
                    permission:permissionFor(rule),
                    approvalLevel:approvalFor(rule),
                    preconditionSatisfied:rule.precondition ? true : undefined
                  }

                  const out=await transition(db,input)
                  const after=await db.prepare(
                    'SELECT account_state,account_state_version FROM users WHERE id=?'
                  ).bind(uid).first()
                  const session=await db.prepare(
                    'SELECT revoked_at FROM auth_session_state WHERE session_id=?'
                  ).bind(sid).first()
                  const journal=await db.prepare(
                    'SELECT event_type,source_version FROM auth_013_publication_journal WHERE resource_id=? ORDER BY source_version'
                  ).bind(String(uid)).all()

                  const observed={
                    index:i+1,
                    from:rule.from,
                    to:rule.to,
                    actor:rule.actor,
                    permission:rule.permission,
                    precondition:rule.precondition ?? null,
                    requiresApproval:rule.requiresApproval ?? false,
                    ok:out.ok,
                    error:out.ok ? null : out.error?.code ?? 'UNKNOWN',
                    finalState:after?.account_state ?? null,
                    finalVersion:Number(after?.account_state_version ?? -1),
                    revokedAt:session?.revoked_at ?? null,
                    journalVersions:(journal.results??[]).map(x=>Number(x.source_version)),
                    journalTypes:(journal.results??[]).map(x=>x.event_type)
                  }

                  const expectedRevocation=['SUSPENDED','BANNED','DELETION_PENDING','DELETED'].includes(rule.to)
                  const checks={
                    transitionSucceeded:out.ok,
                    targetState:after?.account_state===rule.to,
                    versionIncrement:Number(after?.account_state_version)===2,
                    journalExactlyOnce:(journal.results??[]).length===1,
                    journalVersion:Number(journal.results?.[0]?.source_version??-1)===2,
                    canonicalEvent:journal.results?.[0]?.event_type==='identity.account_state_changed',
                    targetStateRevokesSession:!expectedRevocation || typeof session?.revoked_at==='string'
                  }

                  for(const [k,v] of Object.entries(checks))
                    if(!v) throw new Error('AUTH-013 full lifecycle assertion failed: transition '+(i+1)+' '+rule.from+'->'+rule.to+' '+k)

                  results.push({rule, observed, checks})
                }

                const negUid=baseUid+1000
                const negSid='auth013-full-matrix-negative-session-'+negUid
                await db.prepare(
                  'INSERT INTO users (id,email,username,account_state,account_state_version) VALUES (?,?,?,?,?)'
                ).bind(negUid,'auth013-negative-'+negUid+'@invalid.local','auth013-negative-'+negUid,'ACTIVE',1).run()
                created.push({uid:String(negUid),sid:negSid})
                await db.prepare(
                  'INSERT INTO auth_session_state (session_id,user_id,device_id,token_version,refresh_credential_hash,revoked_at,last_seen_at) VALUES (?,?,?,?,?,NULL,?)'
                ).bind(
                  negSid,String(negUid),'auth013-negative-device-'+negUid,1,
                  'synthetic-negative-refresh-'+negUid,now
                ).run()
                const negative=await transition(db,{
                  userId:String(negUid),
                  expectedVersion:1,
                  to:'BANNED',
                  reason:'AUTH-013 negative approval assertion',
                  now,
                  correlationId:'auth013-full-matrix-negative-'+negUid,
                  causationId:'auth013-full-matrix-negative-'+negUid,
                  actor:{id:'auth013-admin',type:'admin'},
                  permission:'user.ban'
                })
                const negRow=await db.prepare(
                  'SELECT account_state,account_state_version FROM users WHERE id=?'
                ).bind(negUid).first()
                if(negative.ok || negRow?.account_state!=='ACTIVE' || Number(negRow?.account_state_version)!==1)
                  throw new Error('AUTH-013 negative approval assertion failed')

                return json({
                  status:'PASS',
                  environment:'CONTROLLED_REMOTE_D1_CANONICAL_26_TRANSITION_MATRIX',
                  transitionCount:canonicalTransitions.length,
                  results,
                  negativeApproval:{
                    status:'PASS',
                    code:negative.ok ? null : negative.error?.code ?? 'UNKNOWN',
                    state:negRow?.account_state,
                    version:Number(negRow?.account_state_version)
                  }
                })
              } catch(e) {
                return json({
                  status:'RUNTIME_EXCEPTION',
                  transitionCount:canonicalTransitions.length,
                  completedTransitions:results.length,
                  error:{message:String(e?.message??e),code:String(e?.code??'')}
                },500)
              } finally {
                for(const item of created) {
                  await db.prepare('DELETE FROM auth_session_state WHERE session_id=?').bind(item.sid).run()
                  await db.prepare('DELETE FROM auth_013_publication_journal WHERE resource_id=?').bind(item.uid).run()
                  await db.prepare('DELETE FROM users WHERE id=?').bind(Number(item.uid)).run()
                }
                for(const item of created) {
                  const cu=await db.prepare('SELECT COUNT(*) count FROM users WHERE id=?').bind(Number(item.uid)).first()
                  const cs=await db.prepare('SELECT COUNT(*) count FROM auth_session_state WHERE session_id=?').bind(item.sid).first()
                  const cj=await db.prepare('SELECT COUNT(*) count FROM auth_013_publication_journal WHERE resource_id=?').bind(item.uid).first()
                  if(Number(cu?.count??-1)!==0||Number(cs?.count??-1)!==0||Number(cj?.count??-1)!==0)
                    throw new Error('AUTH-013 canonical matrix cleanup failed for '+item.uid)
                }
              }
            }
          }
          EOF
      - name: Start and execute ephemeral remote Worker canonical 26-transition harness
        run: |
          set -euo pipefail
          mkdir -p artifacts/mapping-0/auth-013-lifecycle
          npx --yes wrangler@4.116.0 dev --remote --config .auth-013-lifecycle.wrangler.jsonc --ip 127.0.0.1 --port 8788 > auth-013-lifecycle-harness.log 2>&1 &
          echo $! > auth-013-lifecycle-harness.pid
          ready=0
          for _ in $(seq 1 120); do
            if ! kill -0 "$(cat auth-013-lifecycle-harness.pid)" 2>/dev/null; then
              cat auth-013-lifecycle-harness.log
              exit 1
            fi
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:8788/__auth013_lifecycle_ready || true)
            if [ "$code" = "204" ]; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat auth-013-lifecycle-harness.log
            exit 1
          fi

          set +e
          http_code=$(curl -sS -o artifacts/mapping-0/auth-013-lifecycle/runtime-result.json -w '%{http_code}' -X POST --max-time 180 http://127.0.0.1:8788/__auth013_lifecycle_probe)
          curl_exit=$?
          set -e
          echo "AUTH_013_LIFECYCLE_HTTP_STATUS=$http_code"
          echo "AUTH_013_LIFECYCLE_CURL_EXIT=$curl_exit"
          cat artifacts/mapping-0/auth-013-lifecycle/runtime-result.json || true
          cat auth-013-lifecycle-harness.log || true
          test "$curl_exit" = "0"
          test "$http_code" = "200"

          node - <<'NODE'
          const fs=require('node:fs')
          const r=JSON.parse(fs.readFileSync('artifacts/mapping-0/auth-013-lifecycle/runtime-result.json','utf8'))
          if(r.status!=='PASS') throw new Error('AUTH-013 canonical 26-transition matrix did not PASS')
          if(r.transitionCount!==26) throw new Error('AUTH-013 canonical transition count mismatch')
          if((r.results||[]).length!==26) throw new Error('AUTH-013 remote transition coverage incomplete')
          for(const item of r.results) {
            for(const [k,v] of Object.entries(item.checks||{})) if(!v) throw new Error('AUTH-013 transition assertion failed: '+item.observed.from+' -> '+item.observed.to+' '+k)
          }
          if(r.negativeApproval?.status!=='PASS') throw new Error('AUTH-013 negative approval assertion failed')
          console.log('AUTH_013_LIFECYCLE_MATRIX=PASS')
          NODE
      - name: Capture provenance
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git ls-remote origin refs/heads/main | awk 'NR==1 {print $1}')"
          cat > artifacts/mapping-0/auth-013-lifecycle/provenance.txt <<EOF
          workflow=AUTH-013 Lifecycle Matrix Runtime Evidence
          source_ref=${{ inputs.source_sha }}
          source_sha=$CHECKED_OUT_SHA
          main_sha=$MAIN_SHA
          database_name=$DATABASE_NAME
          database_id=$D1_01_ID
          environment=CONTROLLED_REMOTE_D1_CANONICAL_26_TRANSITION_MATRIX
          canonical_transition_count=26
          synthetic_data_cleanup=true
          EOF
          cat auth-013-lifecycle-harness.log >> artifacts/mapping-0/auth-013-lifecycle/wrangler-harness.log
      - name: Upload lifecycle evidence
        uses: actions/upload-artifact@v4
        with:
          name: auth-013-lifecycle-matrix-evidence-${{ github.run_id }}
          path: artifacts/mapping-0/auth-013-lifecycle/
          if-no-files-found: error
          retention-days: 14
      - name: Cleanup ephemeral runtime
        if: ${{ always() }}
        run: |
          if [ -f auth-013-lifecycle-harness.pid ]; then kill "$(cat auth-013-lifecycle-harness.pid)" 2>/dev/null || true; fi
          rm -f .auth-013-lifecycle-harness.ts .auth-013-lifecycle-rules.ts .auth-013-lifecycle.wrangler.jsonc
