      - 'docs/110-MEMBERSHIP-DATA-CONTRACT-v1.0.md'
      - 'docs/111-MEMBERSHIP-API-CONTRACT-v1.0.md'

permissions:
  contents: read

jobs:
  subscription-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify renewal execution remains disabled until async contract admission
        run: node --test workers/W07-subscription-commerce/scripts/verify-renewal-activation-gate.test.mjs
      - name: Enable Corepack
        run: corepack enable
      - name: Install W01 test dependencies from committed lockfile
        working-directory: workers/W01-payload
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test D1-04 binding preflight
        working-directory: workers/W01-payload
        run: node --test ../../workers/W07-subscription-commerce/scripts/verify-d1-04-binding.test.mjs ../../workers/W07-subscription-commerce/scripts/report-d1-04-live-name.test.mjs ../../workers/W07-subscription-commerce/scripts/report-d1-04-schema-snapshot.test.mjs ../../workers/W07-subscription-commerce/scripts/verify-d1-04-order-migration.test.mjs
      - name: Install repository typecheck dependencies from lockfile
        run: npm ci --ignore-scripts --no-audit --fund=false
      - name: Typecheck PAY-002 order modules
        run: npx tsc --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --lib ES2022,DOM --types @cloudflare/workers-types workers/W07-subscription-commerce/src/order-item-resolution.ts workers/W07-subscription-commerce/src/order-persistence.ts workers/W07-subscription-commerce/src/order-http-runtime.ts workers/W07-subscription-commerce/src/billing-persistence.ts workers/W07-subscription-commerce/src/billing-read-http-runtime.ts workers/W07-subscription-commerce/src/demo-tax-pricing.ts workers/W07-subscription-commerce/src/taxjar-sandbox-pricing.ts workers/W07-subscription-commerce/src/payment-persistence.ts workers/W07-subscription-commerce/src/refund-persistence.ts workers/W07-subscription-commerce/src/refund-webhook-persistence.ts workers/W07-subscription-commerce/src/refund-http-runtime.ts workers/W07-subscription-commerce/src/payment-intent-http-runtime.ts workers/W07-subscription-commerce/src/renewal-runtime.ts workers/W07-subscription-commerce/src/scheduled-subscription-plan-change.ts workers/W07-subscription-commerce/src/subscription-renewal-outcome.ts workers/W07-subscription-commerce/src/payment-webhook-http-runtime.ts workers/W07-subscription-commerce/src/paid-membership-order-fulfillment.ts workers/W07-subscription-commerce/src/membership-store-product-binding.ts workers/W07-subscription-commerce/src/revenuecat-webhook-signature.ts workers/W07-subscription-commerce/src/revenuecat-subscriber-api.ts workers/W07-subscription-commerce/src/revenuecat-webhook-persistence.ts workers/W07-subscription-commerce/src/provider-webhook-body.ts workers/W07-subscription-commerce/src/revenuecat-webhook-http-runtime.ts workers/W07-subscription-commerce/src/revenuecat-subscriber-identity.ts workers/W07-subscription-commerce/src/revenuecat-subscriber-reconciliation.ts workers/W07-subscription-commerce/src/revenuecat-subscriber-reconciliation-runtime.ts workers/W07-subscription-commerce/src/revenuecat-subscriber-reconciliation-runtime.test.ts workers/W07-subscription-commerce/src/index.ts
      - name: Run W07 subscription-commerce unit tests
        working-directory: workers/W01-payload
        run: LUCKREAD_VITEST_SCOPE=w07-unit pnpm exec vitest run --config workers/W01-payload/vitest.config.mts --root ../..
      - name: Run W01 commerce/subscription/payment adapter integration tests
        working-directory: workers/W01-payload
        run: pnpm exec vitest run --config ./vitest.config.mts tests/int/subscription-v1-adapter.int.spec.ts tests/int/commerce-order-v1-adapter.int.spec.ts tests/int/payments-intent-v1-adapter.int.spec.ts tests/int/hyperswitch-webhook-v1-adapter.int.spec.ts tests/int/revenuecat-webhook-v1-adapter.int.spec.ts tests/int/provider-webhook-body.int.spec.ts tests/int/payments-refund-v1-adapter.int.spec.ts tests/int/billing-history-v1-adapter.int.spec.ts
      - name: Verify Subscription migration shape
        run: |
          set -euo pipefail
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(':memory:')
          db.execute('PRAGMA foreign_keys = ON')
          migration_1 = Path('workers/W07-subscription-commerce/migrations/0001_membership_subscriptions.sql').read_text()
          migration_2 = Path('workers/W07-subscription-commerce/migrations/0002_subscription_version_cas.sql').read_text()
          migration_3 = Path('workers/W07-subscription-commerce/migrations/0003_membership_plans.sql').read_text()
          migration_4 = Path('workers/W07-subscription-commerce/migrations/0004_revenuecat_membership_product_bindings.sql').read_text()
          migration_5 = Path('workers/W07-subscription-commerce/migrations/0005_subscription_plan_changes.sql').read_text()
          migration_6 = Path('workers/W07-subscription-commerce/migrations/0006_immediate_subscription_upgrades.sql').read_text()
          db.executescript(migration_1)
          db.execute("""INSERT INTO membership_subscriptions (subscription_id, subscriber_id, plan_id, plan_version, creator_id, status, started_at, current_period_start, current_period_end, cancel_at, entitlement_snapshot_ref, created_at, updated_at) VALUES ('sub_migration_probe', 'user_migration_probe', 'plan_test', 1, NULL, 'PENDING', '2026-10-27T00:00:00.000Z', '2026-10-27T00:00:00.000Z', '2026-10-27T00:00:00.000Z', NULL, NULL, '2026-10-27T00:00:00.000Z', '2026-10-27T00:00:00.000Z')""")
          db.executescript(migration_2)
          db.executescript(migration_3)
          db.executescript(migration_4)
          db.executescript(migration_5)
          db.executescript(migration_6)
          cols = db.execute('PRAGMA table_info("membership_subscriptions")').fetchall()
          expected = {
            'subscription_id':('TEXT',1,1),'subscriber_id':('TEXT',1,0),'plan_id':('TEXT',1,0),'plan_version':('INTEGER',1,0),
            'creator_id':('TEXT',0,0),'status':('TEXT',1,0),'started_at':('TEXT',1,0),'current_period_start':('TEXT',1,0),
            'current_period_end':('TEXT',1,0),'cancel_at':('TEXT',0,0),'entitlement_snapshot_ref':('TEXT',0,0),
            'created_at':('TEXT',1,0),'updated_at':('TEXT',1,0),'version':('INTEGER',1,0),
          }
          got = {r[1]:(r[2],r[3],r[5]) for r in cols}
          if got != expected: raise SystemExit(f'unexpected schema: {got!r}')
          version_column = next((r for r in cols if r[1] == 'version'), None)
          if version_column is None or version_column[4] != '1': raise SystemExit(f'version default must backfill existing records to 1, got {None if version_column is None else version_column[4]!r}')
          if db.execute('SELECT version FROM membership_subscriptions WHERE subscription_id = ?', ('sub_migration_probe',)).fetchone() != (1,): raise SystemExit('pre-existing subscriptions were not backfilled to version 1')
          names = {r[1]: r[2] for r in db.execute('PRAGMA index_list("membership_subscriptions")').fetchall()}
          for name in ('ix_membership_subscriptions_subscriber_status_period','ix_membership_subscriptions_plan_version','ix_membership_subscriptions_creator_status','ix_membership_subscriptions_updated_at'):
            if name not in names: raise SystemExit(f'missing index: {name}')
          if db.execute('PRAGMA foreign_key_list("membership_subscriptions")').fetchall(): raise SystemExit('physical foreign key is forbidden')
          plan_cols = {r[1]:(r[2],r[3],r[5]) for r in db.execute('PRAGMA table_info("membership_plans")').fetchall()}
          expected_plan = {
            'plan_id':('TEXT',1,1),'owner_type':('TEXT',1,0),'owner_id':('TEXT',1,0),
            'current_version':('INTEGER',1,0),'status':('TEXT',1,0),'visibility':('TEXT',1,0),
            'version':('INTEGER',1,0),'created_at':('TEXT',1,0),'updated_at':('TEXT',1,0),
          }
          if plan_cols != expected_plan: raise SystemExit(f'unexpected membership_plans schema: {plan_cols!r}')
          version_cols = {r[1]:(r[2],r[3],r[5]) for r in db.execute('PRAGMA table_info("membership_plan_versions")').fetchall()}
          expected_versions = {
            'plan_id':('TEXT',1,1),'plan_version':('INTEGER',1,2),'name':('TEXT',1,0),'tier':('TEXT',1,0),
            'billing_interval':('TEXT',1,0),'price_minor':('INTEGER',1,0),'currency':('TEXT',1,0),
            'benefits_json':('TEXT',1,0),'created_at':('TEXT',1,0),
          }
          if version_cols != expected_versions: raise SystemExit(f'unexpected membership_plan_versions schema: {version_cols!r}')
          plan_indexes = {r[1] for r in db.execute('PRAGMA index_list("membership_plans")').fetchall()}
          if not {'ix_membership_plans_owner_status_updated','ix_membership_plans_status_visibility_updated'}.issubset(plan_indexes): raise SystemExit(f'missing plan indexes: {plan_indexes!r}')
          version_indexes = {r[1] for r in db.execute('PRAGMA index_list("membership_plan_versions")').fetchall()}
          if 'ix_membership_plan_versions_created' not in version_indexes: raise SystemExit(f'missing plan-version index: {version_indexes!r}')
          db.execute("INSERT INTO membership_plans(plan_id,owner_type,owner_id,current_version,status,visibility,version,created_at,updated_at) VALUES ('plan_probe','CREATOR','creator_probe',1,'ACTIVE','PUBLIC',1,'2026-10-27T00:00:00.000Z','2026-10-27T00:00:00.000Z')")
          db.execute("INSERT INTO membership_plan_versions(plan_id,plan_version,name,tier,billing_interval,price_minor,currency,benefits_json,created_at) VALUES ('plan_probe',1,'Probe','basic','MONTHLY',100,'USD','[]','2026-10-27T00:00:00.000Z')")
          try:
            db.execute("UPDATE membership_plan_versions SET price_minor = 200 WHERE plan_id = 'plan_probe' AND plan_version = 1")
            raise SystemExit('membership plan version mutation was not blocked')
          except sqlite3.IntegrityError:
            pass
          try:
            db.execute("DELETE FROM membership_plan_versions WHERE plan_id = 'plan_probe' AND plan_version = 1")
            raise SystemExit('membership plan version deletion was not blocked')
          except sqlite3.IntegrityError:
            pass
          if db.execute("SELECT price_minor FROM membership_plan_versions WHERE plan_id = 'plan_probe' AND plan_version = 1").fetchone() != (100,): raise SystemExit('plan version was unexpectedly changed')
          try:
            db.execute("UPDATE membership_plans SET owner_id = 'creator_other' WHERE plan_id = 'plan_probe'")
            raise SystemExit('membership plan owner identity was not immutable')
          except sqlite3.IntegrityError:
            pass
          try:
            db.execute("UPDATE membership_plans SET plan_id = 'plan_probe_renamed' WHERE plan_id = 'plan_probe'")
            raise SystemExit('membership plan ID was not immutable')
          except sqlite3.IntegrityError:
            pass
          try:
            db.execute("UPDATE membership_plans SET current_version = 2 WHERE plan_id = 'plan_probe'")
            raise SystemExit('membership plan current version advanced to a missing version')
          except sqlite3.IntegrityError:
            pass
          invalid_versions = [
            (2, 'Basic', 'MONTHLY', 100, 'USD', '[]'),
            (3, 'basic', 'DAILY', 100, 'USD', '[]'),
            (4, 'basic', 'MONTHLY', 12.5, 'USD', '[]'),
            (5, 'basic', 'MONTHLY', 100, 'usd', '[]'),
            (6, 'basic', 'MONTHLY', 100, 'USD', '{}'),
          ]
          for plan_version, tier, interval, price, currency, benefits in invalid_versions:
            try:
              db.execute(
                "INSERT INTO membership_plan_versions(plan_id,plan_version,name,tier,billing_interval,price_minor,currency,benefits_json,created_at) VALUES ('plan_probe',?,?,?,?,?,?,?,?)",
                (plan_version, 'Probe', tier, interval, price, currency, benefits, '2026-10-27T00:00:00.000Z'),
              )
              raise SystemExit(f'invalid membership plan version was accepted: {plan_version}')
            except sqlite3.IntegrityError:
              pass
          binding_cols = {r[1]:(r[2],r[3],r[5]) for r in db.execute('PRAGMA table_info("membership_revenuecat_product_bindings")').fetchall()}
          expected_bindings = {
            'revenuecat_app_id':('TEXT',1,1),'store':('TEXT',1,2),'product_id':('TEXT',1,3),
            'plan_id':('TEXT',1,0),'plan_version':('INTEGER',1,0),'status':('TEXT',1,0),
            'created_at':('TEXT',1,0),'retired_at':('TEXT',0,0),
          }
          if binding_cols != expected_bindings: raise SystemExit(f'unexpected RevenueCat binding schema: {binding_cols!r}')
          binding_indexes = {r[1] for r in db.execute('PRAGMA index_list("membership_revenuecat_product_bindings")').fetchall()}
          if 'ix_membership_revenuecat_bindings_plan_version' not in binding_indexes: raise SystemExit(f'missing RevenueCat binding index: {binding_indexes!r}')
          binding_fks = db.execute('PRAGMA foreign_key_list("membership_revenuecat_product_bindings")').fetchall()
          if not any(r[2] == 'membership_plan_versions' and r[3] == 'plan_id' and r[4] == 'plan_id' for r in binding_fks): raise SystemExit('RevenueCat binding plan-version FK missing')
          db.execute("INSERT INTO membership_revenuecat_product_bindings(revenuecat_app_id,store,product_id,plan_id,plan_version,status,created_at,retired_at) VALUES ('app_probe','PLAY_STORE','creator.gold:monthly-v1','plan_probe',1,'ACTIVE','2026-10-30T00:00:00.000Z',NULL)")
          if db.execute("SELECT product_id FROM membership_revenuecat_product_bindings WHERE revenuecat_app_id='app_probe'").fetchone() != ('creator.gold:monthly-v1',): raise SystemExit('raw RevenueCat product identifier was not preserved')
          try:
            db.execute("INSERT INTO membership_revenuecat_product_bindings(revenuecat_app_id,store,product_id,plan_id,plan_version,status,created_at,retired_at) VALUES ('app_probe','PLAY_STORE','creator.gold:monthly-v1','plan_probe',1,'ACTIVE','2026-10-30T00:00:00.000Z',NULL)")
            raise SystemExit('duplicate RevenueCat product binding was accepted')
          except sqlite3.IntegrityError:
            pass
          try:
            db.execute("INSERT INTO membership_revenuecat_product_bindings(revenuecat_app_id,store,product_id,plan_id,plan_version,status,created_at,retired_at) VALUES ('app_probe','APP_STORE','missing-product','plan_probe',99,'ACTIVE','2026-10-30T00:00:00.000Z',NULL)")
            raise SystemExit('RevenueCat binding to a missing plan version was accepted')
          except sqlite3.IntegrityError:
            pass
          try:
            db.execute("UPDATE membership_revenuecat_product_bindings SET plan_version=2 WHERE revenuecat_app_id='app_probe'")
            raise SystemExit('RevenueCat binding version reassignment was accepted')
          except sqlite3.IntegrityError:
            pass
          db.execute("UPDATE membership_revenuecat_product_bindings SET status='RETIRED', retired_at='2026-10-30T01:00:00.000Z' WHERE revenuecat_app_id='app_probe'")
          try:
            db.execute("UPDATE membership_revenuecat_product_bindings SET status='ACTIVE', retired_at=NULL WHERE revenuecat_app_id='app_probe'")
            raise SystemExit('retired RevenueCat product binding was reactivated')
          except sqlite3.IntegrityError:
            pass
          try:
            db.execute("DELETE FROM membership_revenuecat_product_bindings WHERE revenuecat_app_id='app_probe'")
            raise SystemExit('RevenueCat binding history was deletable')
          except sqlite3.IntegrityError:
            pass
          # Scheduled plan-change schema is D1-01 authority. A direct plan switch
          # is rejected; failed renewal preserves the schedule; only the paid
          # period-boundary CAS applies it. Pause/cancel cancels pending changes.
          change_cols = {r[1]:(r[2],r[3],r[5]) for r in db.execute('PRAGMA table_info("membership_subscription_plan_changes")').fetchall()}
          expected_change_cols = {
            'change_id':('TEXT',1,1),'subscription_id':('TEXT',1,0),'subscriber_id':('TEXT',1,0),
            'source_plan_id':('TEXT',1,0),'source_plan_version':('INTEGER',1,0),
            'target_plan_id':('TEXT',1,0),'target_plan_version':('INTEGER',1,0),
            'change_type':('TEXT',1,0),'effective_at':('TEXT',1,0),'status':('TEXT',1,0),
            'request_hash':('TEXT',1,0),'version':('INTEGER',1,0),'created_at':('TEXT',1,0),'updated_at':('TEXT',1,0),
          }
          if change_cols != expected_change_cols: raise SystemExit(f'unexpected scheduled plan-change schema: {change_cols!r}')
          change_indexes = {r[1] for r in db.execute('PRAGMA index_list("membership_subscription_plan_changes")').fetchall()}
