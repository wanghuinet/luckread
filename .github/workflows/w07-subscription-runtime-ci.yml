name: W07 Subscription Runtime CI

on:
  pull_request:
    paths:
      - 'workers/W07-subscription-commerce/**'
      - 'workers/W01-payload/src/subscription/**'
      - 'workers/W01-payload/src/app/api/v1/memberships/**'
      - 'workers/W01-payload/tests/int/subscription-v1-adapter.int.spec.ts'
      - 'workers/W01-payload/wrangler.jsonc'
      - '.github/workflows/w07-subscription-runtime-ci.yml'
      - 'contracts/alignment/cross-system-mapping.v1.json'
      - 'contracts/alignment/mapping-batches/B13-B15-creator-membership-commerce.v1.json'
      - 'contracts/alignment/code-evidence-inventory.v1.json'
      - 'contracts/alignment/five-way-reconciliation.v1.json'
      - 'contracts/entity/SUBSCRIPTION-ENTITY-CONTRACT.v1.json'
      - 'contracts/entity/entity-field-contract.v1.json'
      - 'contracts/entity/entity-implementation-evidence.v1.json'
      - 'contracts/persistence/SUBSCRIPTION-D1-01-persistence.v1.json'
      - 'contracts/state-machines/subscription.json'
      - 'contracts/openapi/v1/openapi.yaml'
      - 'contracts/api/rc-04-06-share-subscription-entitlement.v1.json'
      - 'contracts/authz/permissions.json'
      - 'docs/110-MEMBERSHIP-DATA-CONTRACT-v1.0.md'
      - 'docs/111-MEMBERSHIP-API-CONTRACT-v1.0.md'
  push:
    branches: [main]
    paths:
      - 'workers/W07-subscription-commerce/**'
      - 'workers/W01-payload/src/subscription/**'
      - 'workers/W01-payload/src/app/api/v1/memberships/**'
      - 'workers/W01-payload/tests/int/subscription-v1-adapter.int.spec.ts'
      - 'workers/W01-payload/wrangler.jsonc'
      - '.github/workflows/w07-subscription-runtime-ci.yml'
      - 'contracts/alignment/cross-system-mapping.v1.json'
      - 'contracts/alignment/mapping-batches/B13-B15-creator-membership-commerce.v1.json'
      - 'contracts/alignment/code-evidence-inventory.v1.json'
      - 'contracts/alignment/five-way-reconciliation.v1.json'
      - 'contracts/entity/SUBSCRIPTION-ENTITY-CONTRACT.v1.json'
      - 'contracts/entity/entity-field-contract.v1.json'
      - 'contracts/entity/entity-implementation-evidence.v1.json'
      - 'contracts/persistence/SUBSCRIPTION-D1-01-persistence.v1.json'
      - 'contracts/state-machines/subscription.json'
      - 'contracts/openapi/v1/openapi.yaml'
      - 'contracts/api/rc-04-06-share-subscription-entitlement.v1.json'
      - 'contracts/authz/permissions.json'
      - 'docs/110-MEMBERSHIP-DATA-CONTRACT-v1.0.md'
      - 'docs/111-MEMBERSHIP-API-CONTRACT-v1.0.md'

permissions:
  contents: read

jobs:
  subscription-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install W01 test dependencies from committed lockfile
        working-directory: workers/W01-payload
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test D1-04 binding preflight
        working-directory: workers/W01-payload
        run: node --test ../../workers/W07-subscription-commerce/scripts/verify-d1-04-binding.test.mjs
      - name: Run Subscription runtime and adapter tests
        working-directory: workers/W01-payload
        run: pnpm exec vitest run --config ./vitest.config.mts ../../workers/W07-subscription-commerce/src/subscription-runtime.test.ts ../../workers/W07-subscription-commerce/src/d1-traffic-guard.test.ts tests/int/subscription-v1-adapter.int.spec.ts
      - name: Verify Subscription migration shape
        run: |
          set -euo pipefail
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(':memory:')
          migration_1 = Path('workers/W07-subscription-commerce/migrations/0001_membership_subscriptions.sql').read_text()
          migration_2 = Path('workers/W07-subscription-commerce/migrations/0002_subscription_version_cas.sql').read_text()
          db.executescript(migration_1)
          db.execute("""INSERT INTO membership_subscriptions (subscription_id, subscriber_id, plan_id, plan_version, creator_id, status, started_at, current_period_start, current_period_end, cancel_at, entitlement_snapshot_ref, created_at, updated_at) VALUES ('sub_migration_probe', 'user_migration_probe', 'plan_test', 1, NULL, 'PENDING', '2026-10-27T00:00:00.000Z', '2026-10-27T00:00:00.000Z', '2026-10-27T00:00:00.000Z', NULL, NULL, '2026-10-27T00:00:00.000Z', '2026-10-27T00:00:00.000Z')""")
          db.executescript(migration_2)
          cols = db.execute('PRAGMA table_info("membership_subscriptions")').fetchall()
          expected = {
            'subscription_id':('TEXT',1,1),'subscriber_id':('TEXT',1,0),'plan_id':('TEXT',1,0),'plan_version':('INTEGER',1,0),
            'creator_id':('TEXT',0,0),'status':('TEXT',1,0),'started_at':('TEXT',1,0),'current_period_start':('TEXT',1,0),
            'current_period_end':('TEXT',1,0),'cancel_at':('TEXT',0,0),'entitlement_snapshot_ref':('TEXT',0,0),
            'created_at':('TEXT',1,0),'updated_at':('TEXT',1,0),'version':('INTEGER',1,0),
          }
          got = {r[1]:(r[2],r[3],r[5]) for r in cols}
          if got != expected: raise SystemExit(f'unexpected schema: {got!r}')
          version_column = next((r for r in cols if r[1] == 'version'), None)
          if version_column is None or version_column[4] != '1': raise SystemExit(f'version default must backfill existing records to 1, got {None if version_column is None else version_column[4]!r}')
          if db.execute('SELECT version FROM membership_subscriptions WHERE subscription_id = ?', ('sub_migration_probe',)).fetchone() != (1,): raise SystemExit('pre-existing subscriptions were not backfilled to version 1')
          names = {r[1]: r[2] for r in db.execute('PRAGMA index_list("membership_subscriptions")').fetchall()}
          for name in ('ix_membership_subscriptions_subscriber_status_period','ix_membership_subscriptions_plan_version','ix_membership_subscriptions_creator_status','ix_membership_subscriptions_updated_at'):
            if name not in names: raise SystemExit(f'missing index: {name}')
          if db.execute('PRAGMA foreign_key_list("membership_subscriptions")').fetchall(): raise SystemExit('physical foreign key is forbidden')
          print('SUBSCRIPTION_D1_01_MIGRATION_AND_VERSION_CAS_STATIC=PASS')
          PY
