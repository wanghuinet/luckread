name: W06 AuditEvent D1-03 Evidence

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit containing the admitted W06 AuditEvent migration
        required: true
        type: string
      database_name:
        description: Cloudflare D1-03 display name bound by W06 wrangler.jsonc
        required: true
        type: string

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify W06 D1-03 binding
        working-directory: workers/W06-governance
        env:
          EXPECTED_DB_NAME: ${{ inputs.database_name }}
          EXPECTED_DB_ID: bda1d247-a371-4244-91ae-aef96034db7f
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs')
          const c = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'))
          const d = c.d1_databases?.find((x) => x.binding === 'D1_03')
          if (!d) throw new Error('D1_03 binding missing')
          if (d.database_name !== process.env.EXPECTED_DB_NAME) throw new Error('database name mismatch')
          if (d.database_id !== process.env.EXPECTED_DB_ID) throw new Error('database UUID mismatch')
          console.log(JSON.stringify(d, null, 2))
          NODE

      - name: Capture remote D1-03 evidence
        working-directory: workers/W06-governance
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/artifacts/mapping-0/w06-audit-event-evidence"
          npx --yes wrangler@4.116.0 d1 execute "${{ inputs.database_name }}" --remote --json --config wrangler.jsonc --command 'PRAGMA table_info("audit_events");' > "${GITHUB_WORKSPACE}/artifacts/mapping-0/w06-audit-event-evidence/table.json"
          npx --yes wrangler@4.116.0 d1 execute "${{ inputs.database_name }}" --remote --json --config wrangler.jsonc --command 'PRAGMA index_list("audit_events");' > "${GITHUB_WORKSPACE}/artifacts/mapping-0/w06-audit-event-evidence/indexes.json"
          npx --yes wrangler@4.116.0 d1 execute "${{ inputs.database_name }}" --remote --json --config wrangler.jsonc --command "SELECT name, type FROM sqlite_master WHERE name LIKE 'audit_events_immutable_%' ORDER BY name;" > "${GITHUB_WORKSPACE}/artifacts/mapping-0/w06-audit-event-evidence/triggers.json"
          npx --yes wrangler@4.116.0 d1 execute "${{ inputs.database_name }}" --remote --json --config wrangler.jsonc --command 'SELECT COUNT(*) AS audit_events_count FROM audit_events;' > "${GITHUB_WORKSPACE}/artifacts/mapping-0/w06-audit-event-evidence/count.json"
          npx --yes wrangler@4.116.0 d1 execute "${{ inputs.database_name }}" --remote --json --config wrangler.jsonc --command 'SELECT id,name,batch FROM d1_migrations ORDER BY id;' > "${GITHUB_WORKSPACE}/artifacts/mapping-0/w06-audit-event-evidence/d1-migrations.json"

      - name: Validate remote evidence
        working-directory: workers/W06-governance
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs')
          const path = 'artifacts/mapping-0/w06-audit-event-evidence'
          const read = (f) => JSON.parse(fs.readFileSync(path + '/' + f, 'utf8'))
          const schema = read('table.json')?.[0]?.results ?? []
          const required = [
            'event_id','request_id','trace_id','actor_json','action','target_type','target_id',
            'before_json','after_json','reason','ip','user_agent','occurred_at'
          ]
          const names = new Set(schema.map((r) => r.name))
          for (const name of required) if (!names.has(name)) throw new Error('missing column: ' + name)
          const count = read('count.json')?.[0]?.results?.[0]?.audit_events_count
          if (Number(count) !== 0) throw new Error('unexpected audit_events row count: ' + count)
          const triggers = read('triggers')?.[0]?.results ?? []
          if (!triggers.some((r) => r.name === 'audit_events_immutable_update')) throw new Error('missing immutable UPDATE trigger')
          if (!triggers.some((r) => r.name === 'audit_events_immutable_delete')) throw new Error('missing immutable DELETE trigger')
          const migrations = read('d1-migrations')?.[0]?.results ?? []
          if (!migrations.some((r) => r.name === '0001_audit_event.sql')) throw new Error('migration history missing 0001_audit_event.sql')
          console.log(JSON.stringify({
            W06_AUDIT_EVENT_D1_03_EVIDENCE: 'PASS',
            auditEventsCount: Number(count),
            columns: [...names],
            triggers: triggers.map((r) => r.name),
            migrationApplied: '0001_audit_event.sql'
          }, null, 2))
          NODE

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: w06-audit-event-d1-03-evidence-${{ github.run_id }}
          path: artifacts/mapping-0/w06-audit-event-evidence/
          if-no-files-found: error
          retention-days: 14
