name: W06 AuditEvent D1-03 Evidence

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit containing the admitted W06 AuditEvent migration
        required: true
        type: string
      database_name:
        description: Cloudflare D1-03 display name bound by W06 wrangler.jsonc
        required: true
        type: string

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify W06 D1-03 binding
        working-directory: workers/W06-governance
        env:
          EXPECTED_DB_NAME: ${{ inputs.database_name }}
          EXPECTED_DB_ID: bda1d247-a371-4244-91ae-aef96034db7f
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs')
          const c = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'))
          const d = c.d1_databases?.find((x) => x.binding === 'D1_03')
          if (!d) throw new Error('D1_03 binding missing')
          if (d.database_name !== process.env.EXPECTED_DB_NAME) throw new Error('database name mismatch')
          if (d.database_id !== process.env.EXPECTED_DB_ID) throw new Error('database UUID mismatch')
          console.log(JSON.stringify(d, null, 2))
          NODE

      - name: Capture remote D1-03 evidence
        working-directory: workers/W06-governance
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECTED_DB_ID: bda1d247-a371-4244-91ae-aef96034db7f
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/artifacts/mapping-0/w06-audit-event-evidence"
          node - <<'NODE'
          const fs = require('node:fs')
          const path = `${process.env.GITHUB_WORKSPACE}/artifacts/mapping-0/w06-audit-event-evidence/d1-query.json`
          const endpoint =
            `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/d1/database/${process.env.EXPECTED_DB_ID}/query`
          const queries = [
            'PRAGMA table_info("audit_events");',
            'PRAGMA index_list("audit_events");',
            "SELECT name, type FROM sqlite_master WHERE name LIKE 'audit_events_immutable_%' ORDER BY name;",
            'SELECT COUNT(*) AS audit_events_count FROM audit_events;',
            'SELECT id,name,batch FROM d1_migrations ORDER BY id;',
          ]
          ;(async () => {
          const results = []
          for (const sql of queries) {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ sql }),
            })
            const body = await response.json()
            if (!response.ok) {
              throw new Error(`Cloudflare D1 HTTP ${response.status}: ${JSON.stringify(body.errors ?? body)}`)
            }
            if (!body.success || !Array.isArray(body.result) || body.result.length !== 1) {
              throw new Error(`Cloudflare D1 query failed: ${JSON.stringify(body.errors ?? body)}`)
            }
            results.push(body.result[0])
          }
          const evidence = {
            success: true,
            result: results,
            errors: [],
            messages: [],
          }
          fs.writeFileSync(path, JSON.stringify(evidence, null, 2) + '\\n')
          console.log(JSON.stringify({
            endpoint,
            databaseId: process.env.EXPECTED_DB_ID,
            queryCount: queries.length,
            success: true,
          }, null, 2))
          })().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE

      - name: Validate remote evidence
        working-directory: workers/W06-governance
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs')
          const path = `${process.env.GITHUB_WORKSPACE}/artifacts/mapping-0/w06-audit-event-evidence`
          const read = (f) => JSON.parse(fs.readFileSync(path + '/' + f, 'utf8'))
          const body = read('d1-query.json')
          const results = body?.result ?? []
          if (results.length !== 5) throw new Error('unexpected evidence result count: ' + results.length)
          for (const [index, result] of results.entries()) {
            if (result?.success !== true) throw new Error('D1 evidence query failed at index ' + index)
          }

          const schema = results[0]?.results ?? []
          const required = [
            'event_id','request_id','trace_id','actor_json','action','target_type','target_id',
            'before_json','after_json','reason','ip','user_agent','occurred_at'
          ]
          const names = new Set(schema.map((r) => r.name))
          for (const name of required) if (!names.has(name)) throw new Error('missing column: ' + name)

          const indexes = results[1]?.results ?? []
          if (!indexes.some((r) => r.name === 'idx_audit_events_action_occurred_at')) {
            throw new Error('missing action/occurred_at index')
          }
          if (!indexes.some((r) => r.name === 'idx_audit_events_target_occurred_at')) {
            throw new Error('missing target/occurred_at index')
          }

          const triggers = results[2]?.results ?? []
          if (!triggers.some((r) => r.name === 'audit_events_immutable_update')) {
            throw new Error('missing immutable UPDATE trigger')
          }
          if (!triggers.some((r) => r.name === 'audit_events_immutable_delete')) {
            throw new Error('missing immutable DELETE trigger')
          }

          const count = results[3]?.results?.[0]?.audit_events_count
          if (Number(count) !== 0) throw new Error('unexpected audit_events row count: ' + count)

          const migrations = results[4]?.results ?? []
          if (!migrations.some((r) => r.name === '0001_audit_event.sql')) {
            throw new Error('migration history missing 0001_audit_event.sql')
          }

          console.log(JSON.stringify({
            W06_AUDIT_EVENT_D1_03_EVIDENCE: 'PASS',
            auditEventsCount: Number(count),
            columns: [...names],
            indexes: indexes.map((r) => r.name),
            triggers: triggers.map((r) => r.name),
            migrationApplied: '0001_audit_event.sql'
          }, null, 2))
          NODE

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: w06-audit-event-d1-03-evidence-${{ github.run_id }}
          path: artifacts/mapping-0/w06-audit-event-evidence/
          if-no-files-found: error
          retention-days: 14
