name: W07 Subscription Runtime Deploy

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact W07 source commit to deploy
        required: true
        type: string
      confirm:
        description: Type DEPLOY_W07_SUBSCRIPTION to permit W07 deployment
        required: true
        type: string
      migration_confirm:
        description: Type APPLY_W07_SUBSCRIPTION_MIGRATION to permit D1-01 migration
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirm == 'DEPLOY_W07_SUBSCRIPTION' && inputs.migration_confirm == 'APPLY_W07_SUBSCRIPTION_MIGRATION' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed main history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate explicit deployment source and confirmations
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          DEPLOY_CONFIRM: ${{ inputs.confirm }}
          MIGRATION_CONFIRM: ${{ inputs.migration_confirm }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOY_CONFIRM" == "DEPLOY_W07_SUBSCRIPTION" ]]
          [[ "$MIGRATION_CONFIRM" == "APPLY_W07_SUBSCRIPTION_MIGRATION" ]]
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          echo "Validated source SHA is an ancestor of reviewed main."
      - name: Checkout validated source commit
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: git checkout --detach "$SOURCE_SHA"
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install repository dependencies
        run: npm ci
      - name: Verify W07 physical binding and migration source
        working-directory: workers/W07-subscription-commerce
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs')
          const c = JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'))
          if (c.name !== 'luckread-w07') throw new Error('W07 worker name mismatch')
          if (c.main !== 'src/index.ts') throw new Error('W07 entrypoint mismatch')
          const d1 = (c.d1_databases || []).find(x => x.binding === 'D1_01')
          if (!d1 || d1.database_id !== '2f80471e-3756-49f9-8db1-7707a433ad64' || d1.database_name !== 'luckread') throw new Error('D1-01 physical binding mismatch')
          console.log(JSON.stringify({worker:c.name, main:c.main, d1Binding:d1}))
          NODE
          test -f migrations/0001_membership_subscriptions.sql
          test -f migrations/0002_subscription_version_cas.sql
          test -f src/index.ts
          test -f src/subscription-runtime.ts
      - name: Typecheck W07
        run: npx tsc --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --lib ES2022,DOM --types @cloudflare/workers-types workers/W07-subscription-commerce/src/subscription-runtime.ts workers/W07-subscription-commerce/src/index.ts
      - name: Run W07 tests
        run: npx vitest@3.2.4 run workers/W07-subscription-commerce/src/subscription-runtime.test.ts
      - name: Verify W07 traffic guard bindings
        working-directory: workers/W07-subscription-commerce
        run: |
          node - <<'NODE'
          const fs=require('fs')
          const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'))
          const required=['SUBSCRIPTION_ORIGIN_GLOBAL_LIMITER','SUBSCRIPTION_READ_LIMITER','SUBSCRIPTION_WRITE_LIMITER']
          const names=new Set((c.ratelimits||[]).map(x=>x.name))
          for(const name of required) if(!names.has(name)) throw new Error('missing rate limiter: '+name)
          console.log(JSON.stringify({rateLimitBindings:[...names].sort()}))
          NODE

      - name: Read-only D1-01 migration and schema preflight
        id: d1_preflight
        working-directory: workers/W07-subscription-commerce
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.116.0 d1 list --json --config wrangler.jsonc > /tmp/w07-d1-list.json
          npx --yes wrangler@4.116.0 d1 execute luckread --remote --config wrangler.jsonc --command="SELECT name FROM d1_migrations WHERE name IN ('0001_membership_subscriptions','0002_subscription_version_cas') ORDER BY name" --json > /tmp/w07-d1-migrations.json
          npx --yes wrangler@4.116.0 d1 execute luckread --remote --config wrangler.jsonc --command='PRAGMA table_info("membership_subscriptions")' --json > /tmp/w07-subscription-schema.json
          npx --yes wrangler@4.116.0 d1 execute luckread --remote --config wrangler.jsonc --command='PRAGMA index_list("membership_subscriptions")' --json > /tmp/w07-subscription-indexes.json
          node - <<'NODE'
          const fs = require('node:fs')
          const read = (file) => JSON.parse(fs.readFileSync(file, 'utf8'))
          const objects = (value, out = []) => {
            if (Array.isArray(value)) for (const item of value) objects(item, out)
            else if (value && typeof value === 'object') {
              out.push(value)
              for (const item of Object.values(value)) objects(item, out)
            }
            return out
          }
          const databaseId = '2f80471e-3756-49f9-8db1-7707a433ad64'
          const databases = objects(read('/tmp/w07-d1-list.json'))
          if (!databases.some((item) => item.name === 'luckread' && (item.uuid === databaseId || item.database_id === databaseId))) {
            throw new Error('READ_ONLY_PREFLIGHT_FAILED: exact D1-01 database UUID/name not found')
          }
          const migrationObjects = objects(read('/tmp/w07-d1-migrations.json'))
          const applied = [...new Set(migrationObjects
            .filter((item) => item.name === '0001_membership_subscriptions' || item.name === '0002_subscription_version_cas')
            .map((item) => item.name))].sort()
          const schemaObjects = objects(read('/tmp/w07-subscription-schema.json'))
          const columns = schemaObjects.filter((item) =>
            Number.isInteger(item.cid) && typeof item.name === 'string' && typeof item.type === 'string' &&
            Object.prototype.hasOwnProperty.call(item, 'notnull') && Object.prototype.hasOwnProperty.call(item, 'pk'))
            .sort((a, b) => a.cid - b.cid)
          const indexObjects = objects(read('/tmp/w07-subscription-indexes.json'))
          const indexNames = new Set(indexObjects
            .filter((item) => Number.isInteger(item.seq) && typeof item.name === 'string')
            .map((item) => item.name))
          const expectedIndexes = [
            'ix_membership_subscriptions_subscriber_status_period',
            'ix_membership_subscriptions_plan_version',
            'ix_membership_subscriptions_creator_status',
            'ix_membership_subscriptions_updated_at'
          ]
          for (const name of expectedIndexes) if (!indexNames.has(name)) {
            throw new Error('READ_ONLY_PREFLIGHT_FAILED: missing expected index ' + name)
          }
          const legacy = [
            ['subscription_id','TEXT',1,1], ['subscriber_id','TEXT',1,0], ['plan_id','TEXT',1,0],
            ['plan_version','INTEGER',1,0], ['creator_id','TEXT',0,0], ['status','TEXT',1,0],
            ['started_at','TEXT',1,0], ['current_period_start','TEXT',1,0], ['current_period_end','TEXT',1,0],
            ['cancel_at','TEXT',0,0], ['entitlement_snapshot_ref','TEXT',0,0],
            ['created_at','TEXT',1,0], ['updated_at','TEXT',1,0]
          ]
          const current = [...legacy, ['version','INTEGER',1,0]]
          const shape = columns.map((column) => [column.name, column.type, Number(column.notnull), Number(column.pk)])
          const equals = (left, right) => JSON.stringify(left) === JSON.stringify(right)
          if (!applied.includes('0001_membership_subscriptions')) {
            throw new Error('READ_ONLY_PREFLIGHT_FAILED: baseline migration 0001 is not recorded as applied')
          }
          let migrationAction
          if (equals(applied, ['0001_membership_subscriptions']) && equals(shape, legacy)) {
            migrationAction = 'apply'
          } else if (equals(applied, ['0001_membership_subscriptions','0002_subscription_version_cas']) && equals(shape, current)) {
            migrationAction = 'skip'
          } else {
            throw new Error('READ_ONLY_PREFLIGHT_FAILED: migration history/schema combination is unexpected; refusing migration and deploy')
          }
          const outputPath = process.env.GITHUB_OUTPUT
          if (!outputPath) throw new Error('GITHUB_OUTPUT is unavailable')
          fs.appendFileSync(outputPath, 'migration_action=' + migrationAction + '\n')
          console.log(JSON.stringify({
            readOnlyPreflight: 'PASS',
            targetDatabase: 'luckread',
            databaseUuid: databaseId,
            appliedSubscriptionMigrations: applied,
            subscriptionColumns: shape.map((column) => column[0]),
            expectedIndexes: [...expectedIndexes],
            migrationAction
          }))
          NODE

      - name: Apply D1-01 Subscription migration
        if: steps.d1_preflight.outputs.migration_action == 'apply'
        working-directory: workers/W07-subscription-commerce
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.116.0 d1 migrations apply luckread --remote --config wrangler.jsonc
      - name: Deploy W07
        working-directory: workers/W07-subscription-commerce
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.116.0 deploy --config wrangler.jsonc
      - name: Write deployment provenance
        run: |
          set -euo pipefail
          mkdir -p artifacts/w07-subscription
          cat > artifacts/w07-subscription/provenance.json <<EOF
          {
            "workflow": "W07 Subscription Runtime Deploy",
            "runId": "$GITHUB_RUN_ID",
            "runAttempt": "$GITHUB_RUN_ATTEMPT",
            "sourceSha": "${{ inputs.source_sha }}",
            "worker": "luckread-w07",
            "databaseUuid": "2f80471e-3756-49f9-8db1-7707a433ad64",
            "databaseName": "luckread",
            "migrations": ["0001_membership_subscriptions", "0002_subscription_version_cas"],
            "migrationAction": "${{ steps.d1_preflight.outputs.migration_action }}",
            "remoteMigration": ${{ steps.d1_preflight.outputs.migration_action == 'apply' }},
            "confirmation": "DEPLOY_W07_SUBSCRIPTION",
            "migrationConfirmation": "APPLY_W07_SUBSCRIPTION_MIGRATION"
          }
          EOF
          cat artifacts/w07-subscription/provenance.json
      - name: Upload deployment provenance
        uses: actions/upload-artifact@v4
        with:
          name: w07-subscription-deployment-${{ inputs.source_sha }}
          path: artifacts/w07-subscription/provenance.json
          if-no-files-found: error
