name: AUTH-004 Native Local Evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false
      - name: Install W01 dependencies
        working-directory: workers/W01-payload
        run: pnpm install --frozen-lockfile
      - name: Run native AUTH-004 Local API lifecycle probe
        working-directory: workers/W01-payload
        env:
          PAYLOAD_SECRET: ignore
        run: node --import=tsx/esm scripts/auth-004-native-local-probe.mjs
