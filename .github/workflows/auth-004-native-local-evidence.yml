name: AUTH-004 Native Local Evidence
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/auth-004-native-local-evidence.yml"
      - "workers/W01-payload/scripts/auth-004-native-local-probe.mjs"
      - "workers/W01-payload/package.json"
      - "workers/W01-payload/pnpm-lock.yaml"
      - "workers/W01-payload/src/migrations/index.ts"
      - "workers/W01-payload/src/migrations/20260928_104842_MIG_PAYLOAD_3902_NATIVE_SCHEMA_V1.ts"
      - "workers/W01-payload/src/migrations/20260928_104842_MIG_PAYLOAD_3902_NATIVE_SCHEMA_V1.json"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false
      - name: Install W01 dependencies
        working-directory: workers/W01-payload
        run: pnpm install --frozen-lockfile
      - name: Initialize local Payload D1 schema
        working-directory: workers/W01-payload
        env:
          NODE_ENV: development
          PAYLOAD_SECRET: ignore
        run: pnpm payload migrate
      - name: Run native AUTH-004 Local API lifecycle probe
        working-directory: workers/W01-payload
        env:
          NODE_ENV: development
          PAYLOAD_SECRET: ignore
        run: |
          set +e
          node --import=tsx/esm scripts/auth-004-native-local-probe.mjs 2>&1 | tee auth004-native-local-probe.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "{\"probeExitCode\":${status}}" > auth004-native-local-probe-status.json
          exit ${status}
      - name: Upload AUTH-004 local probe diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-004-native-local-diagnostics
          path: |
            workers/W01-payload/auth004-native-local-probe.log
            workers/W01-payload/auth004-native-local-probe-status.json
          if-no-files-found: error
