name: Contract Admission CI

on:
  push:
    branches: [main, 'contract/**']
    paths: ['package.json','package-lock.json','contracts/**','docs/**','scripts/**','.github/workflows/contract-admission-ci.yml']
  pull_request:
    paths: ['package.json','package-lock.json','contracts/**','docs/**','scripts/**','.github/workflows/contract-admission-ci.yml']
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: 'Exact commit SHA to validate'
        required: false
        type: string
      admission_mode:
        description: 'DEVELOPMENT = contract/structural admission; FULL = include Five-Way + R4/Evidence/R5 downstream audit'
        required: true
        type: choice
        options:
          - DEVELOPMENT
          - FULL
        default: DEVELOPMENT

permissions:
  contents: read

env:
  CHECKOUT_REF: ${{ github.event.inputs.checkout_ref || github.sha }}
  ADMISSION_MODE: ${{ github.event.inputs.admission_mode || 'DEVELOPMENT' }}

jobs:
  contract:
    name: Contract Admission Gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        domain: [common, enums, state-machines, authz, events, openapi]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: node scripts/contract-ci.mjs ${{ matrix.domain }}

  contract-semantic:
    name: Semantic Cross-Contract Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: node scripts/contract-semantic-ci.mjs

  feature-inventory:
    name: Blueprint Feature Inventory Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: node scripts/build-feature-inventory.mjs
      - run: test -f contracts/alignment/feature-inventory.v1.json
      - run: git diff --exit-code -- contracts/alignment/feature-inventory.v1.json
      - run: test -z "$(git status --porcelain --untracked-files=all)"

  payload-reconciliation:
    name: Payload Contract Reconciliation Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: node scripts/payload-native-inventory.mjs
      - run: git diff --exit-code -- contracts/payload/payload-native-inventory.v1.json
      - run: node scripts/payload-contract-reconciliation-check.mjs

  capability-graph:
    name: Capability Contract Graph Gate
    runs-on: ubuntu-latest
    needs: [contract, contract-semantic, feature-inventory, payload-reconciliation]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: node scripts/build-capability-contract-graph.mjs
      - run: node scripts/capability-contract-graph-check.mjs
      - name: Audit historical L1-L4 reconciliation (non-blocking)
        continue-on-error: true
        run: node scripts/l1-l4-reconciliation-baseline-check.mjs
      - run: node scripts/entity-catalog-check.mjs
      - run: node scripts/entity-implementation-evidence-check.mjs
      - run: node scripts/entity-field-contract-check.mjs
      - run: node scripts/entity-field-schema-contract-check.mjs

  capability-graph-strict-downstream:
    name: Strict Downstream R4/Evidence/R5 Gate
    if: ${{ inputs.admission_mode == 'FULL' }}
    runs-on: ubuntu-latest
    needs: [capability-graph]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - name: Generate R4 evidence gap report
        run: node scripts/mapping-0-r4-evidence-gap-report.mjs
      - run: node scripts/feature-entity-persistence-registry-check.mjs
      - name: Validate canonical Mapping 0 Evidence Registry
        if: ${{ always() }}
        run: node scripts/mapping-0-evidence-registry-final-check.mjs
      - name: Upload R4 evidence gap report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mapping-0-r4-evidence-gap-${{ github.run_id }}
          path: artifacts/mapping-0/r4-evidence-gap-report.json
          if-no-files-found: error
          retention-days: 14
      - run: node scripts/r5-foundation-contract-check.mjs

  alignment:
    name: Five-Way Alignment Admission Gate
    if: ${{ env.ADMISSION_MODE == 'FULL' }}
    runs-on: ubuntu-latest
    needs: [contract, contract-semantic, feature-inventory, payload-reconciliation]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: node scripts/materialize-canonical-mapping.mjs
      - run: node scripts/alignment-ci.mjs
      - run: git diff --exit-code -- contracts/alignment/cross-system-mapping.v1.json contracts/alignment/feature-inventory.v1.json contracts/alignment/api-inventory.v1.json contracts/alignment/payload-inventory.v1.json contracts/alignment/code-evidence-inventory.v1.json contracts/alignment/five-way-reconciliation.v1.json contracts/alignment/change-impact.v1.json

  mapping-zero-final:
    name: Mapping 0 Structural/Contract Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - name: Generate Mapping 0 closure status snapshot
        if: ${{ always() }}
        run: node scripts/mapping-0-status-report.mjs
      - name: Publish Mapping 0 closure status snapshot
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mapping-0-status-${{ github.run_id }}
          path: artifacts/mapping-0/mapping-0-status-report.json
          if-no-files-found: error
          retention-days: 14
      - run: npm run mapping:0:verify

  contract-full:
    name: Contract Admission Gate (full)
    runs-on: ubuntu-latest
    needs:
      - contract
      - contract-semantic
      - feature-inventory
      - payload-reconciliation
      - capability-graph
      - capability-graph-strict-downstream
      - alignment
      - mapping-zero-final
    if: ${{ always() && needs.contract.result == 'success' && needs['contract-semantic'].result == 'success' && needs.feature-inventory.result == 'success' && needs.payload-reconciliation.result == 'success' && needs['capability-graph'].result == 'success' && needs['mapping-zero-final'].result == 'success' && (inputs.admission_mode != 'FULL' || (needs['capability-graph-strict-downstream'].result == 'success' && needs.alignment.result == 'success')) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: node scripts/contract-ci.mjs
      - name: Report admission mode
        run: echo "Contract admission mode = ${{ env.ADMISSION_MODE }}"

  openapi-lint:
    name: OpenAPI Lint
    runs-on: ubuntu-latest
    needs: contract-full
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npx --yes @redocly/cli@1.34.2 lint contracts/openapi/v1/openapi.yaml
