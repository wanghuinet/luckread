name: Provision Neon Hyperdrive resources
run-name: Provision D1-01 Hyperdrive @ ${{ github.sha }}

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/neon-d1-01-hyperdrive-provision.yml'
      - 'scripts/cloudflare/create-neon-hyperdrive.mjs'
      - 'scripts/cloudflare/create-neon-hyperdrive.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/neon-d1-01-hyperdrive-provision.yml'
      - 'scripts/cloudflare/create-neon-hyperdrive.mjs'
      - 'scripts/cloudflare/create-neon-hyperdrive.test.mjs'
  workflow_dispatch:
    inputs:
      confirm_target:
        description: Create or reuse the dedicated Hyperdrive configuration for D1-01 (luckread) or all five Neon databases; no Worker binding, deployment, data import, or cutover.
        required: true
        type: choice
        options:
          - CREATE_D1_01_NEON_HYPERDRIVE
          - CREATE_ALL_FIVE_NEON_HYPERDRIVE

permissions:
  contents: read

concurrency:
  group: neon-d1-01-hyperdrive-provision
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    name: Validate target guards and idempotent provisioning logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check script syntax and run unit tests (no Cloudflare credentials)
        run: |
          set -euo pipefail
          node --check scripts/cloudflare/create-neon-hyperdrive.mjs
          node --check scripts/cloudflare/create-neon-hyperdrive.test.mjs
          node --test scripts/cloudflare/create-neon-hyperdrive.test.mjs

  provision:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.confirm_target == 'CREATE_D1_01_NEON_HYPERDRIVE' || inputs.confirm_target == 'CREATE_ALL_FIVE_NEON_HYPERDRIVE') }}
    name: Create or reuse Cloudflare Hyperdrive for selected Neon targets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Guard exact main ref and explicit D1-01 confirmation
        shell: bash
        env:
          CONFIRM_TARGET: ${{ inputs.confirm_target }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          case "${CONFIRM_TARGET}" in
            CREATE_D1_01_NEON_HYPERDRIVE|CREATE_ALL_FIVE_NEON_HYPERDRIVE) ;;
            *) echo "Unsupported Hyperdrive target" >&2; exit 1 ;;
          esac

      - name: Checkout dispatched main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Provision the selected Neon Hyperdrive resources
        id: provision
        env:
          GITHUB_ACTIONS: 'true'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          CONFIRM_TARGET: ${{ inputs.confirm_target }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_HYPERDRIVE_API_TOKEN }}
          NEON_DATABASE_URL_LUCKREAD: ${{ secrets.NEON_DATABASE_URL_LUCKREAD }}
          NEON_DATABASE_URL_LUCKREADPRO: ${{ inputs.confirm_target == 'CREATE_ALL_FIVE_NEON_HYPERDRIVE' && secrets.NEON_DATABASE_URL_LUCKREADPRO || '' }}
          NEON_DATABASE_URL_GOVERNANCE: ${{ inputs.confirm_target == 'CREATE_ALL_FIVE_NEON_HYPERDRIVE' && secrets.NEON_DATABASE_URL_GOVERNANCE || '' }}
          NEON_DATABASE_URL_FINANCE: ${{ inputs.confirm_target == 'CREATE_ALL_FIVE_NEON_HYPERDRIVE' && secrets.NEON_DATABASE_URL_FINANCE || '' }}
          NEON_DATABASE_URL_ALLLUCK: ${{ inputs.confirm_target == 'CREATE_ALL_FIVE_NEON_HYPERDRIVE' && secrets.NEON_DATABASE_URL_ALLLUCK || '' }}
        run: node scripts/cloudflare/create-neon-hyperdrive.mjs

      - name: Publish sanitized provisioning summary
        shell: bash
        env:
          HYPERDRIVE_SUMMARY: ${{ steps.provision.outputs.hyperdrive_summary }}
        run: |
          set -euo pipefail
          {
            echo "## Neon Hyperdrive provisioning"
            echo
            echo "### Resource results"
            echo
            echo "$HYPERDRIVE_SUMMARY"
            echo "- Worker binding changed: **No**"
            echo "- Worker deployed: **No**"
            echo "- Production database cutover: **No**"
          } >> "$GITHUB_STEP_SUMMARY"
