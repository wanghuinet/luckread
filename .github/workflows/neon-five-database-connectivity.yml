name: Neon Five Database Connectivity and Empty Schema Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-five-database-empty-schema-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify connections and empty PostgreSQL targets (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pinned PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/neon-preflight"
          npm install \
            --prefix "$RUNNER_TEMP/neon-preflight" \
            --no-save \
            --no-audit \
            --no-fund \
            --ignore-scripts \
            pg@8.16.3

      - name: Inspect all five Neon targets without changing schemas or data
        shell: bash
        env:
          NEON_DATABASE_URL_LUCKREAD: ${{ secrets.NEON_DATABASE_URL_LUCKREAD }}
          NEON_DATABASE_URL_LUCKREADPRO: ${{ secrets.NEON_DATABASE_URL_LUCKREADPRO }}
          NEON_DATABASE_URL_GOVERNANCE: ${{ secrets.NEON_DATABASE_URL_GOVERNANCE }}
          NEON_DATABASE_URL_FINANCE: ${{ secrets.NEON_DATABASE_URL_FINANCE }}
          NEON_DATABASE_URL_ALLLUCK: ${{ secrets.NEON_DATABASE_URL_ALLLUCK }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/neon-preflight"
          node <<'NODE'
          const fs = require('node:fs')
          const { Client } = require('pg')

          const databases = [
            { expected: 'luckread', secret: 'NEON_DATABASE_URL_LUCKREAD', domain: 'D1-01 Identity / Account / Access' },
            { expected: 'luckreadpro', secret: 'NEON_DATABASE_URL_LUCKREADPRO', domain: 'D1-02 Content / Community' },
            { expected: 'luckread_governance', secret: 'NEON_DATABASE_URL_GOVERNANCE', domain: 'D1-03 Governance / Platform Runtime' },
            { expected: 'luckread_finance', secret: 'NEON_DATABASE_URL_FINANCE', domain: 'D1-04 Commerce / Financial Authority' },
            { expected: 'allluck', secret: 'NEON_DATABASE_URL_ALLLUCK', domain: 'D1-05 Analytics-only / W11' },
          ]

          async function main() {
            const results = []
            let failed = false

            for (const database of databases) {
              const connectionString = process.env[database.secret]

              if (!connectionString) {
                results.push({
                  name: database.expected,
                  domain: database.domain,
                  status: 'FAIL',
                  detail: 'Missing required Actions secret: ' + database.secret,
                })
                failed = true
                continue
              }

              let parsed
              try {
                parsed = new URL(connectionString)
              } catch {
                results.push({
                  name: database.expected,
                  domain: database.domain,
                  status: 'FAIL',
                  detail: 'Connection string is not a valid PostgreSQL URL.',
                })
                failed = true
                continue
              }

              if (!['postgres:', 'postgresql:'].includes(parsed.protocol)) {
                results.push({
                  name: database.expected,
                  domain: database.domain,
                  status: 'FAIL',
                  detail: 'Connection string must use the PostgreSQL protocol.',
                })
                failed = true
                continue
              }

              const sslmode = parsed.searchParams.get('sslmode')
              const channelBinding = parsed.searchParams.get('channel_binding')
              if (!['require', 'verify-ca', 'verify-full'].includes(sslmode)) {
                results.push({
                  name: database.expected,
                  domain: database.domain,
                  status: 'FAIL',
                  detail: 'TLS must be required by the connection string.',
                })
                failed = true
                continue
              }
              if (channelBinding !== 'require') {
                results.push({
                  name: database.expected,
                  domain: database.domain,
                  status: 'FAIL',
                  detail: 'Connection string must require channel binding.',
                })
                failed = true
                continue
              }

              const client = new Client({
                connectionString,
                connectionTimeoutMillis: 15000,
                query_timeout: 15000,
                enableChannelBinding: true,
              })

              let connected = false
              let transactionOpen = false
              try {
                await client.connect()
                connected = true

                const tlsSocket = client.connection?.stream
                if (tlsSocket?.encrypted !== true || tlsSocket?.authorized !== true) {
                  throw Object.assign(new Error('Client TLS verification failed.'), {
                    code: 'TLS_VERIFICATION_FAILED',
                  })
                }

                await client.query('BEGIN READ ONLY')
                transactionOpen = true

                const identity = await client.query(
                  'SELECT current_database() AS database_name, ' +
                  "current_setting('server_version') AS server_version"
                )
                const actualDatabase = identity.rows[0]?.database_name
                if (actualDatabase !== database.expected) {
                  throw Object.assign(new Error('Connected database name did not match.'), {
                    code: 'DATABASE_NAME_MISMATCH',
                  })
                }

                const schemas = await client.query(
                  'SELECT nspname AS schema_name FROM pg_namespace ' +
                  "WHERE nspname NOT IN ('pg_catalog', 'information_schema') " +
                  "AND nspname NOT LIKE 'pg_toast%' AND nspname NOT LIKE 'pg_temp_%' " +
                  'ORDER BY nspname'
                )
                const extraSchemas = schemas.rows
                  .map((row) => row.schema_name)
                  .filter((name) => name !== 'public')

                const relations = await client.query(
                  'SELECT n.nspname AS schema_name, c.relname AS object_name, c.relkind AS object_kind ' +
                  'FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace ' +
                  "WHERE n.nspname NOT IN ('pg_catalog', 'information_schema') " +
                  "AND n.nspname NOT LIKE 'pg_toast%' AND n.nspname NOT LIKE 'pg_temp_%' " +
                  "AND c.relkind IN ('r', 'p', 'v', 'm', 'S', 'f') " +
                  'ORDER BY n.nspname, c.relname LIMIT 51'
                )

                const customTypes = await client.query(
                  'SELECT n.nspname AS schema_name, t.typname AS type_name ' +
                  'FROM pg_type t JOIN pg_namespace n ON n.oid = t.typnamespace ' +
                  "WHERE n.nspname NOT IN ('pg_catalog', 'information_schema') " +
                  "AND n.nspname NOT LIKE 'pg_toast%' AND n.nspname NOT LIKE 'pg_temp_%' " +
                  'ORDER BY n.nspname, t.typname LIMIT 51'
                )

                const routines = await client.query(
                  'SELECT n.nspname AS schema_name, p.proname AS object_name, ' +
                  "'routine' AS object_kind FROM pg_proc p " +
                  'JOIN pg_namespace n ON n.oid = p.pronamespace ' +
                  "WHERE n.nspname NOT IN ('pg_catalog', 'information_schema') " +
                  "AND n.nspname NOT LIKE 'pg_toast%' AND n.nspname NOT LIKE 'pg_temp_%' " +
                  'ORDER BY n.nspname, p.proname LIMIT 51'
                )

                const otherObjects = await client.query(
                  'SELECT n.nspname AS schema_name, o.oprname AS object_name, ' +
                  "'operator' AS object_kind FROM pg_operator o " +
                  'JOIN pg_namespace n ON n.oid = o.oprnamespace ' +
                  "WHERE n.nspname NOT IN ('pg_catalog', 'information_schema') " +
                  "AND n.nspname NOT LIKE 'pg_toast%' AND n.nspname NOT LIKE 'pg_temp_%' " +
                  'UNION ALL ' +
                  'SELECT n.nspname, c.collname, \'collation\' FROM pg_collation c ' +
                  'JOIN pg_namespace n ON n.oid = c.collnamespace ' +
                  "WHERE n.nspname NOT IN ('pg_catalog', 'information_schema') " +
                  "AND n.nspname NOT LIKE 'pg_toast%' AND n.nspname NOT LIKE 'pg_temp_%' " +
                  'UNION ALL ' +
                  'SELECT n.nspname, c.conname, \'conversion\' FROM pg_conversion c ' +
                  'JOIN pg_namespace n ON n.oid = c.connamespace ' +
                  "WHERE n.nspname NOT IN ('pg_catalog', 'information_schema') " +
                  "AND n.nspname NOT LIKE 'pg_toast%' AND n.nspname NOT LIKE 'pg_temp_%' " +
                  'UNION ALL ' +
                  'SELECT n.nspname, t.cfgname, \'text_search_config\' FROM pg_ts_config t ' +
                  'JOIN pg_namespace n ON n.oid = t.cfgnamespace ' +
                  "WHERE n.nspname NOT IN ('pg_catalog', 'information_schema') " +
                  "AND n.nspname NOT LIKE 'pg_toast%' AND n.nspname NOT LIKE 'pg_temp_%' " +
                  'UNION ALL ' +
                  'SELECT n.nspname, t.dictname, \'text_search_dictionary\' FROM pg_ts_dict t ' +
                  'JOIN pg_namespace n ON n.oid = t.dictnamespace ' +
                  "WHERE n.nspname NOT IN ('pg_catalog', 'information_schema') " +
                  "AND n.nspname NOT LIKE 'pg_toast%' AND n.nspname NOT LIKE 'pg_temp_%' " +
                  'UNION ALL ' +
                  'SELECT n.nspname, t.prsname, \'text_search_parser\' FROM pg_ts_parser t ' +
                  'JOIN pg_namespace n ON n.oid = t.prsnamespace ' +
                  "WHERE n.nspname NOT IN ('pg_catalog', 'information_schema') " +
                  "AND n.nspname NOT LIKE 'pg_toast%' AND n.nspname NOT LIKE 'pg_temp_%' " +
                  'UNION ALL ' +
                  'SELECT n.nspname, t.tmplname, \'text_search_template\' FROM pg_ts_template t ' +
                  'JOIN pg_namespace n ON n.oid = t.tmplnamespace ' +
                  "WHERE n.nspname NOT IN ('pg_catalog', 'information_schema') " +
                  "AND n.nspname NOT LIKE 'pg_toast%' AND n.nspname NOT LIKE 'pg_temp_%' " +
                  'ORDER BY 1, 2 LIMIT 51'
                )

                const extensions = await client.query(
                  "SELECT extname FROM pg_extension WHERE extname <> 'plpgsql' ORDER BY extname"
                )

                const relationNames = relations.rows.map(
                  (row) => row.schema_name + '.' + row.object_name,
                )
                const customTypeNames = customTypes.rows.map(
                  (row) => row.schema_name + '.' + row.type_name,
                )
                const routineNames = routines.rows.map(
                  (row) => row.schema_name + '.' + row.object_name,
                )
                const otherObjectNames = otherObjects.rows.map(
                  (row) => row.schema_name + '.' + row.object_name,
                )
                const extensionNames = extensions.rows.map((row) => row.extname)
                const clean =
                  extraSchemas.length === 0 &&
                  relations.rows.length === 0 &&
                  customTypes.rows.length === 0 &&
                  routines.rows.length === 0 &&
                  otherObjects.rows.length === 0 &&
                  extensionNames.length === 0

                await client.query('ROLLBACK')
                transactionOpen = false

                if (!clean) {
                  results.push({
                    name: database.expected,
                    domain: database.domain,
                    status: 'BLOCKED_NOT_EMPTY',
                    detail:
                      'Existing non-system objects found; inspect before initialization. ' +
                      'Extra schemas=' + JSON.stringify(extraSchemas) +
                      '; relations=' + JSON.stringify(relationNames) +
                      '; custom types=' + JSON.stringify(customTypeNames) +
                      '; routines=' + JSON.stringify(routineNames) +
                      '; other schema objects=' + JSON.stringify(otherObjectNames) +
                      '; non-default extensions=' + JSON.stringify(extensionNames),
                  })
                  failed = true
                } else {
                  results.push({
                    name: database.expected,
                    domain: database.domain,
                    status: 'PASS_EMPTY',
                    detail:
                      'Verified TLS; PostgreSQL ' + identity.rows[0].server_version +
                      '; only the default public schema exists; no user relations, user-defined types, routines, operators, collations, conversions, text-search objects, or non-default extensions.',
                  })
                }
              } catch (error) {
                const code =
                  typeof error?.code === 'string' ? error.code : 'PREFLIGHT_ERROR'
                results.push({
                  name: database.expected,
                  domain: database.domain,
                  status: 'FAIL',
                  detail: 'Read-only preflight failed. Safe error code: ' + code,
                })
                failed = true
                if (transactionOpen) {
                  try {
                    await client.query('ROLLBACK')
                  } catch {
                    // Never emit raw driver or connection details.
                  }
                }
              } finally {
                if (connected) {
                  try {
                    await client.end()
                  } catch {
                    // Never emit raw driver or connection details.
                  }
                }
              }
            }

            const lines = [
              '# Neon five-database empty-schema preflight',
              '',
              '| Database | Domain | Result | Details |',
              '|---|---|---|---|',
              ...results.map((result) =>
                '| ' + result.name + ' | ' + result.domain + ' | **' +
                result.status + '** | ' + result.detail.replaceAll('|', '\\|') + ' |'
              ),
              '',
              'This workflow is read-only. It opens a READ ONLY transaction and rolls it back. It does not create schemas, tables, extensions, migration ledgers, or rows.',
              '',
              'PASS_EMPTY confirms there are no non-system schemas beyond public, user relations, user-defined types, routines, operators, collations, conversions, text-search objects, or non-default extensions. A non-empty target is blocked for manual review and is never overwritten.',
              '',
              'This is a target-readiness check only. It does not authorize D1 replacement, Worker/Hyperdrive binding changes, Payload adapter changes, schema application, or production traffic cutover.',
              '',
              'Connection strings, usernames, passwords, and query result data are never printed.',
            ]

            const summary = lines.join('\n') + '\n'
            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary)
            }

            for (const result of results) {
              console.log(result.name + ': ' + result.status + ' — ' + result.detail)
            }

            if (failed) {
              console.error('One or more Neon targets are not ready for empty initialization.')
              process.exitCode = 1
            } else {
              console.log('All five Neon targets passed empty-schema preflight.')
            }
          }

          main().catch((error) => {
            const code =
              typeof error?.code === 'string' ? error.code : 'PREFLIGHT_ERROR'
            console.error('Preflight stopped. Safe error code: ' + code)
            process.exitCode = 1
          })
          NODE
