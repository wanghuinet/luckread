name: Neon Five Database Read-only Target Preflight

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/neon-five-database-connectivity.yml'
      - 'scripts/neon/five-database-readonly-preflight.mjs'
      - 'scripts/neon/five-database-readonly-preflight.test.mjs'
  workflow_dispatch:
    inputs:
      confirm_target:
        description: Confirm a read-only catalog check of all five configured Neon databases.
        required: true
        type: choice
        options:
          - READ_ONLY_PREFLIGHT_FIVE_NEON_DATABASES

permissions:
  contents: read
  statuses: write

concurrency:
  group: neon-five-database-readonly-target-preflight
  cancel-in-progress: false

jobs:
  validate-script:
    if: ${{ github.event_name == 'pull_request' }}
    name: Validate read-only preflight guards without database secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check syntax and run unit tests (no Neon credentials available)
        run: |
          set -euo pipefail
          node --check scripts/neon/five-database-readonly-preflight.mjs
          node --check scripts/neon/five-database-readonly-preflight.test.mjs
          node --test scripts/neon/five-database-readonly-preflight.test.mjs

  preflight:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_target == 'READ_ONLY_PREFLIGHT_FIVE_NEON_DATABASES' }}
    name: Verify all five Neon target identities and empty schema state (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Guard exact main ref and explicit read-only confirmation
        shell: bash
        env:
          CONFIRM_TARGET: ${{ inputs.confirm_target }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${CONFIRM_TARGET}" = "READ_ONLY_PREFLIGHT_FIVE_NEON_DATABASES"

      - name: Checkout reviewed main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pinned PostgreSQL driver
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/neon-five-db-preflight"
          npm install \
            --prefix "$RUNNER_TEMP/neon-five-db-preflight" \
            --no-save \
            --no-audit \
            --no-fund \
            --ignore-scripts \
            pg@8.20.0

      - name: Inspect all five Neon targets in read-only transactions
        id: inspect
        shell: bash
        env:
          NEON_PG_MODULE_ROOT: ${{ runner.temp }}/neon-five-db-preflight/node_modules
          NEON_PREFLIGHT_REPORT: ${{ runner.temp }}/neon-five-db-preflight/report.json
          NEON_DATABASE_URL_LUCKREAD: ${{ secrets.NEON_DATABASE_URL_LUCKREAD }}
          NEON_DATABASE_URL_LUCKREADPRO: ${{ secrets.NEON_DATABASE_URL_LUCKREADPRO }}
          NEON_DATABASE_URL_GOVERNANCE: ${{ secrets.NEON_DATABASE_URL_GOVERNANCE }}
          NEON_DATABASE_URL_FINANCE: ${{ secrets.NEON_DATABASE_URL_FINANCE }}
          NEON_DATABASE_URL_ALLLUCK: ${{ secrets.NEON_DATABASE_URL_ALLLUCK }}
        run: node scripts/neon/five-database-readonly-preflight.mjs

      - name: Upload sanitized catalog evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-five-database-readonly-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/neon-five-db-preflight/report.json
          if-no-files-found: warn
          retention-days: 90

      - name: Publish read-only preflight commit status
        if: always() && github.ref == 'refs/heads/main' && inputs.confirm_target == 'READ_ONLY_PREFLIGHT_FIVE_NEON_DATABASES'
        uses: actions/github-script@v7
        env:
          PREFLIGHT_OUTCOME: ${{ steps.inspect.outcome }}
          PASS_EMPTY_COUNT: ${{ steps.inspect.outputs.pass_empty_count }}
          BLOCKED_COUNT: ${{ steps.inspect.outputs.blocked_count }}
          FAILED_COUNT: ${{ steps.inspect.outputs.failed_count }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const passed = Number(process.env.PASS_EMPTY_COUNT || 0)
            const blocked = Number(process.env.BLOCKED_COUNT || 0)
            const failed = Number(process.env.FAILED_COUNT || 0)
            const success = process.env.PREFLIGHT_OUTCOME === 'success' && passed === 5
            const description = success
              ? 'PASS_EMPTY 5/5; PG18, TLS, channel binding and absent ledgers verified'
              : 'PASS_EMPTY ' + passed + '/5; blocked ' + blocked + '; failed ' + failed
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'Neon Five DB Read-only Target Preflight',
              description: description.slice(0, 140),
              target_url: context.serverUrl + '/' + context.repo.owner + '/' +
                context.repo.repo + '/actions/runs/' + context.runId,
            })
