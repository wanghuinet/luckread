name: AUTH-004 Payload 3.90.2 Native Migration Generator

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/auth-004-payload-3902-migration-generator.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false
      - name: Install W01 dependencies
        working-directory: workers/W01-payload
        run: pnpm install --frozen-lockfile --ignore-workspace
      - name: Generate native Payload 3.90.2 migration
        working-directory: workers/W01-payload
        env:
          NODE_ENV: development
          PAYLOAD_SECRET: ignore
        run: pnpm exec payload migrate:create MIG-AUTH-004-PAYLOAD-3902-NATIVE-V1 --skip-empty
      - name: Review generated artifact shape
        working-directory: workers/W01-payload
        run: |
          set -euo pipefail
          files=(src/migrations/*)
          printf '%s\n' "${files[@]}"
          grep -Rni "reset_password_requested_at" src/migrations
          grep -RniE "CREATE TABLE.*(users|users_sessions|media|payload_migrations|payload_locked_documents|payload_preferences)" src/migrations && exit 1 || true
      - name: Upload generated migration
        uses: actions/upload-artifact@v4
        with:
          name: auth-004-payload-3902-native-migration-${{ github.run_id }}
          path: workers/W01-payload/src/migrations/
          if-no-files-found: error
          retention-days: 14
