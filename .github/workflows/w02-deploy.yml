name: W02 Identity Authorization Deploy

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact implementation commit to deploy
        required: true
        type: string
      confirm:
        description: Type DEPLOY to permit this controlled deployment
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact implementation commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install W02 runtime dependencies
        working-directory: workers/W02-identity
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify Better Auth package
        working-directory: workers/W02-identity
        run: node --input-type=module -e "import('better-auth').then(() => console.log('better-auth 1.7.7 import: OK'))"
      - name: Verify RoleAssignment migration artifacts
        run: |
          node scripts/generate-role-assignment-migration.mjs
          node scripts/generate-role-version-migration.mjs
      - name: Assert generated migrations are committed
        run: |
          git diff --exit-code -- workers/W02-identity/migrations/0001_role_assignments.sql
          git diff --exit-code -- workers/W02-identity/migrations/0003_role_authorization_versions.sql
      - name: Apply pending W02 D1 migrations
        working-directory: workers/W02-identity
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.116.0 d1 migrations apply D1_01 --remote --config wrangler.jsonc
      - name: Deploy W02 with pinned Wrangler
        working-directory: workers/W02-identity
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.116.0 deploy --config wrangler.jsonc

# Workflow dispatch index refresh: no runtime or architecture change.
