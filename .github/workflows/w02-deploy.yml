name: W02 Identity Authorization Deploy

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact implementation commit to deploy
        required: true
        type: string
      confirm:
        description: Type DEPLOY to permit this controlled deployment
        required: true
        type: string

permissions:
  actions: read
  contents: read
  deployments: read
  pull-requests: read

jobs:
  deploy:
    if: ${{ inputs.confirm == 'DEPLOY' && github.ref == 'refs/heads/main' && github.ref_protected == true }}
    runs-on: ubuntu-latest
    environment: auth-mfa-rollout
    timeout-minutes: 15
    steps:
      - name: Checkout protected main for source validation
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate immutable source SHA is committed to main
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if ! [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_sha must be a full 40-character commit SHA"
            exit 1
          fi
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main || {
            echo "source_sha must be an immutable commit already contained in protected main"
            exit 1
          }
      - name: Checkout exact implementation commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install W02 runtime dependencies
        working-directory: workers/W02-identity
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Require imported business data and explicit Neon production cutover approval
        run: node scripts/neon/assert-production-cutover-authorized.mjs D1-01

      - name: Verify Better Auth 1.7.8 package and runtime import
        working-directory: workers/W02-identity
        run: |
          node --input-type=module -e "import { readFile } from 'node:fs/promises'; const pkg = JSON.parse(await readFile('./node_modules/better-auth/package.json', 'utf8')); if (pkg.version !== '1.7.8') throw new Error('Expected better-auth 1.7.8, got ' + pkg.version); await import('better-auth'); console.log('better-auth ' + pkg.version + ' import: OK')"
      - name: Verify W02 Neon-only production config and historical D1 migration source
        working-directory: workers/W02-identity
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const source = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'))
          const config = JSON.parse(fs.readFileSync('wrangler.neon.jsonc', 'utf8'))
          const hyperdrive = (config.hyperdrive || []).find((item) => item.binding === 'HYPERDRIVE')
          if (source.name !== 'luckread-w02' || (source.d1_databases || []).length !== 0) {
            throw new Error('W02 base Worker config must be Neon-only with no D1 bindings')
          }
          if (!fs.existsSync('migrations/0005_better_auth_identity_core.sql')) {
            throw new Error('W02 Better Auth migration source is missing')
          }
          if (config.name !== 'luckread-w02' || config.main !== 'src/index.ts') throw new Error('W02 production Worker identity/entrypoint mismatch')
          if ((config.d1_databases || []).length !== 0) throw new Error('W02 production Neon config must not bind Cloudflare D1')
          if (config.vars?.W02_DATABASE_DRIVER !== 'neon') throw new Error('W02 production must select Neon')
          if (!hyperdrive || hyperdrive.id !== '0c53a1bb9bc0484bac146e8ae2d3158b') throw new Error('W02 Neon Hyperdrive target mismatch')
          if (!(config.compatibility_flags || []).includes('nodejs_compat')) throw new Error('W02 PostgreSQL runtime requires nodejs_compat')
          if (!(config.queues?.producers || []).some((item) => item.binding === 'AUTH013_QUEUE' && item.queue === 'luckread-auth013-account-state')) throw new Error('W02 AUTH013_QUEUE producer mismatch')
          if (!(config.queues?.producers || []).some((item) => item.binding === 'AUTH013_PROJECTION_QUEUE' && item.queue === 'luckread-auth013-account-state-projection')) throw new Error('W02 AUTH013_PROJECTION_QUEUE producer mismatch')
          console.log('W02_PRODUCTION_DATABASE=NEON_D1_01; PRODUCTION_D1_BINDINGS=NONE; HYPERDRIVE=VERIFIED')
          NODE
      - name: Verify RoleAssignment migration artifacts
        run: |
          node scripts/generate-role-assignment-migration.mjs
          node scripts/generate-role-version-migration.mjs
      - name: Assert generated migrations are committed
        run: |
          git diff --exit-code -- workers/W02-identity/migrations/0001_role_assignments.sql
          git diff --exit-code -- workers/W02-identity/migrations/0003_role_authorization_versions.sql
      - name: Verify protected AUTH-007 rollout admission before W02 deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
          AUTH007_ROLLOUT_ENVIRONMENT: auth-mfa-rollout
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: node scripts/verify-auth-007-rollout-admission.mjs

      - name: Verify applied Neon D1-01 schema evidence before runtime deployment
        working-directory: workers/W02-identity
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const bootstrap = JSON.parse(fs.readFileSync('../../contracts/database/neon-five-domain-schema-bootstrap.v1.json', 'utf8'))
          const domain = (bootstrap.domains || []).find((item) => item.domainId === 'D1-01')
          const owners = domain?.completedSchemaOwners || []
          const expectedOwners = ['W01-Payload', 'W02-Better-Auth-and-custom-identity', 'W07-D1-01-subscriptions', 'W08-Creator']
          if (domain?.databaseName !== 'luckread' || domain?.remoteSchemaApplied !== true ||
              domain?.status !== 'D1_01_SCHEMA_ONLY_REMOTE_APPLIED_ALL_OWNER_POSTFLIGHT_PASSED_RUNTIME_CUTOVER_PENDING') {
            throw new Error('W02 deployment requires the already applied Neon D1-01 shared schema')
          }
          for (const owner of expectedOwners) if (!owners.includes(owner)) {
            throw new Error('Neon D1-01 schema owner postflight is missing: ' + owner)
          }
          if (domain?.ownerPostflight?.W02?.status !== 'BETTER_AUTH_CORE_AND_ALL_CUSTOM_POSTFLIGHTS_PASS') {
            throw new Error('W02 Better Auth and custom PostgreSQL schema postflight must already pass')
          }
          const config = JSON.parse(fs.readFileSync('wrangler.neon.jsonc', 'utf8'))
          if ((config.d1_databases || []).length !== 0 || config.vars?.W02_DATABASE_DRIVER !== 'neon') {
            throw new Error('W02 runtime config must be Neon-only before deployment')
          }
          console.log('W02_NEON_D1_01_SCHEMA_EVIDENCE=PASS; CLOUDFLARE_D1_CONNECTIONS=NONE')
          NODE

      - name: Deploy W02 with pinned Wrangler
        working-directory: workers/W02-identity
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.116.0 deploy --config wrangler.neon.jsonc

# Workflow dispatch index refresh: no runtime or architecture change.
