name: W02 Identity Authorization Deploy

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact implementation commit to deploy
        required: true
        type: string
      confirm:
        description: Type DEPLOY to permit this controlled deployment
        required: true
        type: string

permissions:
  actions: read
  contents: read
  deployments: read
  pull-requests: read

jobs:
  deploy:
    if: ${{ inputs.confirm == 'DEPLOY' && github.ref == 'refs/heads/main' && github.ref_protected == true }}
    runs-on: ubuntu-latest
    environment: auth-mfa-rollout
    timeout-minutes: 15
    steps:
      - name: Checkout protected main for source validation
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate immutable source SHA is committed to main
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if ! [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_sha must be a full 40-character commit SHA"
            exit 1
          fi
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main || {
            echo "source_sha must be an immutable commit already contained in protected main"
            exit 1
          }
      - name: Checkout exact implementation commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install W02 runtime dependencies
        working-directory: workers/W02-identity
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify Better Auth 1.7.8 package and runtime import
        working-directory: workers/W02-identity
        run: |
          node --input-type=module -e "import { readFile } from 'node:fs/promises'; const pkg = JSON.parse(await readFile('./node_modules/better-auth/package.json', 'utf8')); if (pkg.version !== '1.7.8') throw new Error('Expected better-auth 1.7.8, got ' + pkg.version); await import('better-auth'); console.log('better-auth ' + pkg.version + ' import: OK')"
      - name: Verify RoleAssignment migration artifacts
        run: |
          node scripts/generate-role-assignment-migration.mjs
          node scripts/generate-role-version-migration.mjs
      - name: Assert generated migrations are committed
        run: |
          git diff --exit-code -- workers/W02-identity/migrations/0001_role_assignments.sql
          git diff --exit-code -- workers/W02-identity/migrations/0003_role_authorization_versions.sql
      - name: Verify protected AUTH-007 rollout admission before W02 deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
          AUTH007_ROLLOUT_ENVIRONMENT: auth-mfa-rollout
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: node scripts/verify-auth-007-rollout-admission.mjs

      - name: Verify AUTH-007 operation-receipt schema before runtime deployment (read-only)
        working-directory: workers/W02-identity
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_NAME: luckread
          EXPECTED_D1_01_ID: "2f80471e-3756-49f9-8db1-7707a433ad64"
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'))
          const target = config.d1_databases?.find((item) => item.binding === 'D1_01')
          if (!target) throw new Error('D1_01 binding missing; deployment stopped')
          if (target.database_name !== process.env.DATABASE_NAME) throw new Error('D1_01 database name mismatch; deployment stopped')
          if (target.database_id !== process.env.EXPECTED_D1_01_ID) throw new Error('D1_01 database UUID mismatch; deployment stopped')
          console.log(JSON.stringify({ binding: target.binding, database_name: target.database_name, database_id: target.database_id, mode: 'READONLY_PREDEPLOY' }))
          NODE
          npx --yes wrangler@4.116.0 d1 execute "$DATABASE_NAME" --remote --config wrangler.jsonc \
            --command "SELECT name FROM d1_migrations WHERE name LIKE '%0009_auth_007_mfa_operation_receipts.sql' OR name LIKE '%0010_auth_username_change_state.sql';" \
            > /tmp/auth007-mfa-receipt-migration-ledger.txt
          grep -q '0009_auth_007_mfa_operation_receipts.sql' /tmp/auth007-mfa-receipt-migration-ledger.txt && grep -q '0010_auth_username_change_state.sql' /tmp/auth007-mfa-receipt-migration-ledger.txt || {
            echo "Required D1-01 migrations 0009 and 0010 are not recorded; refusing to deploy W02 runtime."
            exit 1
          }
          npx --yes wrangler@4.116.0 d1 execute "$DATABASE_NAME" --remote --config wrangler.jsonc \
            --command "SELECT type, name, sql FROM sqlite_master WHERE name IN ('auth_007_mfa_operation_receipts', 'auth_007_mfa_operation_receipts_status_next_attempt_idx', 'auth_username_change_state', 'auth_username_change_state_previous_name_idx', 'auth_username_change_state_last_changed_idx', 'auth_user_username_normalized_lookup_idx', 'auth_username_identity_projection_sync', 'auth_user_previous_username_reservation_guard_insert', 'auth_user_previous_username_reservation_guard_update') ORDER BY type, name;" \
            > /tmp/auth007-mfa-receipt-schema.txt
          for expected in auth_007_mfa_operation_receipts auth_007_mfa_operation_receipts_status_next_attempt_idx auth_username_change_state auth_username_change_state_previous_name_idx auth_username_change_state_last_changed_idx auth_user_username_normalized_lookup_idx auth_username_identity_projection_sync auth_user_previous_username_reservation_guard_insert auth_user_previous_username_reservation_guard_update; do
            grep -q "$expected" /tmp/auth007-mfa-receipt-schema.txt || {
              echo "Required D1-01 schema object $expected is missing; refusing to deploy W02 runtime."
              exit 1
            }
          done

      - name: Deploy W02 with pinned Wrangler
        working-directory: workers/W02-identity
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.116.0 deploy --config wrangler.jsonc

# Workflow dispatch index refresh: no runtime or architecture change.
