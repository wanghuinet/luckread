name: W02 Identity Authorization Deploy

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact implementation commit to deploy
        required: true
        type: string
      confirm:
        description: Type DEPLOY to permit this controlled deployment
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact implementation commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install W02 dependencies
        working-directory: workers/W02-identity
        run: npm install --ignore-scripts --no-package-lock

      - name: Verify Better Auth W02 source
        run: |
          set -euo pipefail
          test -s workers/W02-identity/src/auth/better-auth.ts
          test -s workers/W02-identity/src/auth/registration.ts
          test -s workers/W02-identity/migrations/0002_better_auth_core.sql
          npm --prefix workers/W02-identity ls better-auth --depth=0

      - name: Verify Better Auth production secret is configured
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.116.0 secret list --name luckread-w02 | grep -q '"name":"BETTER_AUTH_SECRET"'

      - name: Verify RoleAssignment migration artifacts
        run: |
          node scripts/generate-role-assignment-migration.mjs
          node scripts/generate-role-version-migration.mjs
      - name: Assert generated migrations are committed
        run: |
          git diff --exit-code -- workers/W02-identity/migrations/0001_role_assignments.sql
          git diff --exit-code -- workers/W02-identity/migrations/0003_role_authorization_versions.sql
      - name: Deploy W02 with pinned Wrangler
        working-directory: workers/W02-identity
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.116.0 deploy --config wrangler.jsonc
