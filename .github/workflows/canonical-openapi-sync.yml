name: Canonical OpenAPI RC Sync

# Contract CI runs from the exact canonical ref produced by this workflow.
on:
  push:
    paths:
      - 'contracts/api/**'
      - 'contracts/openapi/v1/operation-policy.json'
      - 'scripts/sync-rc-openapi.mjs'
      - '.github/workflows/canonical-openapi-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      validated_ref: ${{ steps.resolve-ref.outputs.validated_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Synchronize canonical API surface
        run: node scripts/sync-rc-openapi.mjs

      - name: Commit canonical API surface when changed
        run: |
          files="contracts/api/api-inventory.v1.json contracts/openapi/v1/openapi.yaml contracts/openapi/v1/operation-policy.json"
          if git diff --quiet -- $files; then
            echo "No canonical API surface change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $files
          git commit -m "chore(api): synchronize canonical API surface"
          git push

      - name: Resolve canonical validation ref
        id: resolve-ref
        run: echo "validated_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  contract-validation:
    name: Contract Validation on Canonical Ref
    needs: sync
    uses: ./.github/workflows/contract-ci.yml
    with:
      checkout_ref: ${{ needs.sync.outputs.validated_ref }}
    permissions:
      contents: read
