name: Neon W01 Payload PostgreSQL Schema Bootstrap

on:
  pull_request:
    paths:
      - 'workers/W01-payload/package.json'
      - 'workers/W01-payload/pnpm-lock.yaml'
      - 'workers/W01-payload/src/neon-postgres-schema.config.ts'
      - 'workers/W01-payload/src/neon-postgres-migrations/**'
      - 'workers/W01-payload/scripts/neon/**'
      - 'workers/W01-payload/README-neon-postgres-schema.md'
      - '.github/workflows/neon-w01-payload-postgres-schema.yml'

permissions:
  contents: write

concurrency:
  group: neon-w01-payload-schema-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  postgres-schema:
    name: Generate and verify W01 Payload schema on PostgreSQL 18
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: luckread_schema
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d luckread_schema"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm 11
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Regenerate W01 frozen lockfile from pinned package versions
        working-directory: workers/W01-payload
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Install exact W01 dependency graph
        working-directory: workers/W01-payload
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Payload PostgreSQL migration when not yet committed
        working-directory: workers/W01-payload
        env:
          NODE_ENV: development
          PAYLOAD_SECRET: schema-generation-only-not-a-runtime-secret
          PAYLOAD_SCHEMA_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/luckread_schema
          PAYLOAD_CONFIG_PATH: src/neon-postgres-schema.config.ts
        run: |
          set -euo pipefail
          if [ ! -f src/neon-postgres-migrations/index.ts ]; then
            pnpm run neon:schema:generate
          else
            echo "Committed PostgreSQL migration history found; reuse it without regenerating."
          fi

      - name: Apply W01 PostgreSQL migration to disposable CI database
        working-directory: workers/W01-payload
        env:
          NODE_ENV: development
          PAYLOAD_SECRET: schema-generation-only-not-a-runtime-secret
          PAYLOAD_SCHEMA_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/luckread_schema
          PAYLOAD_CONFIG_PATH: src/neon-postgres-schema.config.ts
        run: pnpm run neon:schema:apply

      - name: Verify Payload schema, key fields, indexes, and empty business tables
        working-directory: workers/W01-payload
        env:
          PAYLOAD_SCHEMA_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/luckread_schema
          PAYLOAD_SCHEMA_REPORT: artifacts/neon/w01-payload-postgres-schema.json
        run: pnpm run neon:schema:verify

      - name: Upload generated SQL and schema evidence
        uses: actions/upload-artifact@v4
        with:
          name: neon-w01-payload-postgres-schema-${{ github.sha }}
          path: |
            workers/W01-payload/src/neon-postgres-migrations/
            workers/W01-payload/artifacts/neon/w01-payload-postgres-schema.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit generated migration and lockfile to the same-repository PR branch
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/W01-payload/pnpm-lock.yaml workers/W01-payload/src/neon-postgres-migrations/
          if git diff --cached --quiet; then
            echo "No generated migration or lockfile changes to commit."
          else
            git commit -m "chore(w01): commit verified PostgreSQL Payload baseline"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
