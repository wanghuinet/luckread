name: _tmp refresh root npm lockfile

on:
  push:
    branches:
      - fix/1.1-public-cache-boundary-hardening-20261007

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1.1-public-cache-boundary-hardening-20261007
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh root package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit root lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "ROOT_LOCKFILE_CHANGED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(root): refresh npm lockfile"
          git push origin HEAD:fix/1.1-public-cache-boundary-hardening-20261007
