name: W02 AUTH-001 Registration Materializer Remote Evidence

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'workers/W02-content/src/account/registration-materializer.ts'
      - 'workers/W02-content/src/credentials/credential-add.ts'
      - 'workers/W02-content/src/credentials/credential-hash-key.ts'
      - '.auth001-materializer-runtime-harness.ts'
      - '.github/workflows/w02-auth-001-materializer-remote-evidence.yml'

permissions:
  contents: read

jobs:
  evidence:
    if: ${{ github.event.pull_request.head.ref == 'evidence/auth001-w02-materializer-runtime-20260928' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.event.pull_request.base.sha }}
      D1_01_ID: "2f80471e-3756-49f9-8db1-7707a433ad64"
      DATABASE_NAME: luckread
      RUN_ID: ${{ github.run_id }}
      PROBE_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
      AUTH003_EVIDENCE_KEY: auth001-evidence-${{ github.run_id }}-${{ github.run_attempt }}-credential-hash-key-material

    steps:
      - name: Checkout exact base source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore evidence harness from PR head
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.head.sha }}"
          git show "${{ github.event.pull_request.head.sha }}:.auth001-materializer-runtime-harness.ts" > .auth001-materializer-runtime-harness.ts
          test -s .auth001-materializer-runtime-harness.ts

      - name: Validate source and install
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          npm ci

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Prepare remote harness
        run: |
          set -euo pipefail
          cat > .auth001-materializer-runtime.wrangler.jsonc <<EOF
          {
            "name": "luckread-w02-auth001-materializer-evidence-harness",
            "main": ".auth001-materializer-runtime-harness.ts",
            "compatibility_date": "2025-08-15",
            "d1_databases": [
              {
                "binding": "D1_01",
                "database_name": "$DATABASE_NAME",
                "database_id": "$D1_01_ID",
                "remote": true
              }
            ],
            "vars": {
              "PROBE_TOKEN": "$PROBE_TOKEN",
              "RUN_ID": "$RUN_ID",
              "SOURCE_SHA": "$SOURCE_SHA",
              "AUTH003_CREDENTIAL_HASH_KEY": "$AUTH003_EVIDENCE_KEY"
            }
          }
          EOF

      - name: Start ephemeral remote Worker runtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.116.0 dev --remote --config .auth001-materializer-runtime.wrangler.jsonc --ip 127.0.0.1 --port 8791 > auth001-materializer-runtime.log 2>&1 &
          echo $! > auth001-materializer-runtime.pid
          ready=0
          for _ in $(seq 1 90); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:8791/probe || true)
            if [ "$code" != "000" ]; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat auth001-materializer-runtime.log; exit 1; fi

      - name: Execute controlled remote materializer probe
        env:
          PROBE_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/mapping-0/w02-auth001-materializer-runtime
          set +e
          http_code=$(curl -sS -o artifacts/mapping-0/w02-auth001-materializer-runtime/runtime-result.json -w '%{http_code}'             -X POST             -H "x-auth001-probe-token: $PROBE_TOKEN"             http://127.0.0.1:8791/probe)
          curl_exit=$?
          set -e
          cat artifacts/mapping-0/w02-auth001-materializer-runtime/runtime-result.json
          if [ "$curl_exit" -ne 0 ] || [ "$http_code" != "200" ]; then
            cat auth001-materializer-runtime.log || true
            exit 1
          fi
          node - <<'NODE'
          const fs = require('node:fs')
          const result = JSON.parse(fs.readFileSync('artifacts/mapping-0/w02-auth001-materializer-runtime/runtime-result.json', 'utf8'))
          if (result.status !== 'PASS') throw new Error('AUTH-001 materializer runtime evidence did not PASS')
          for (const [name, ok] of Object.entries(result.checks || {})) {
            if (!ok) throw new Error('AUTH-001 materializer assertion failed: ' + name)
          }
          console.log(JSON.stringify({
            status: result.status,
            environment: result.environment,
            provenance: result.provenance,
            checks: result.checks,
            results: result.results,
          }, null, 2))
          NODE

      - name: Capture provenance and upload evidence
        run: |
          set -euo pipefail
          cat > artifacts/mapping-0/w02-auth001-materializer-runtime/provenance.txt <<EOF
          workflow=W02 AUTH-001 Registration Materializer Remote Evidence
          github_run_id=$RUN_ID
          tested_source_sha=$SOURCE_SHA
          database_name=$DATABASE_NAME
          database_id=$D1_01_ID
          binding=D1_01
          environment=CONTROLLED_REMOTE_D1_AUTH001_MATERIALIZER
          production_worker_deployed=false
          synthetic_rows_cleaned=true
          EOF
          cp auth001-materializer-runtime.log artifacts/mapping-0/w02-auth001-materializer-runtime/harness.log

      - name: Upload controlled remote runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: w02-auth001-materializer-runtime-evidence-${{ github.run_id }}
          path: artifacts/mapping-0/w02-auth001-materializer-runtime/
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup ephemeral harness
        if: ${{ always() }}
        run: |
          if [ -f auth001-materializer-runtime.pid ]; then
            kill "$(cat auth001-materializer-runtime.pid)" 2>/dev/null || true
          fi
          rm -f .auth001-materializer-runtime.wrangler.jsonc auth001-materializer-runtime.pid
