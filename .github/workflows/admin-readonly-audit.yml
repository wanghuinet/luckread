name: Admin Readonly Audit

on:
  push:
    branches: [main]
    paths:
      - docs/release/ADMIN-READONLY-AUDIT-2026-09-30-R2.md

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Wrangler
        run: npm install --no-save wrangler@4.116.0

      - name: Verify audit marker
        run: |
          test -f docs/release/ADMIN-READONLY-AUDIT-2026-09-30-R3.md
          grep -q "ADMIN_READONLY_AUDIT_R3=AUTHORIZED_BY_MAIN_MERGE" docs/release/ADMIN-READONLY-AUDIT-2026-09-30-R3.md

      - name: Read production admin roles
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/admin-audit
          npx wrangler@4.116.0 d1 execute luckread --remote --json --command "SELECT CAST(u.id AS TEXT) AS user_id, u.email, u.username, u.account_state, ra.role_id, ra.scope_type, ra.status, ra.valid_from, ra.valid_until FROM users u LEFT JOIN role_assignments ra ON CAST(ra.subject_id AS TEXT)=CAST(u.id AS TEXT) ORDER BY u.id, ra.status, ra.role_id;" > artifacts/admin-audit/all-roles.json
          cp artifacts/admin-audit/all-roles.json artifacts/admin-audit/admin-roles.json
          npx wrangler@4.116.0 d1 execute luckread --remote --json --command "SELECT COUNT(*) AS user_count FROM users;" > artifacts/admin-audit/user-count.json
          cat artifacts/admin-audit/admin-roles.json
          cat artifacts/admin-audit/user-count.json

      - name: Validate read-only result
        run: |
          node - <<'NODE'
          const fs=require('node:fs')
          const rows=JSON.parse(fs.readFileSync('artifacts/admin-audit/admin-roles.json','utf8'))
          const count=JSON.parse(fs.readFileSync('artifacts/admin-audit/user-count.json','utf8'))
          console.log(JSON.stringify({adminRows:rows,userCount:count},null,2))
          NODE

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: admin-readonly-audit-${{ github.sha }}
          path: artifacts/admin-audit/
          if-no-files-found: error
