name: W02 Remote D1 Readonly Evidence

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit to audit
        required: true
        type: string
      database_name:
        description: Cloudflare display name for D1-01
        required: true
        type: string
      confirm:
        description: Type READONLY to permit remote read-only verification
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: ${{ inputs.confirm == 'READONLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Verify D1-01 binding identity
        working-directory: workers/W02-content
        run: >-
          node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          const d=c.d1_databases?.find(x=>x.binding==='D1_01');
          if(!d) throw new Error('D1_01 binding missing');
          console.log(JSON.stringify({binding:d.binding,database_name:d.database_name,database_id:d.database_id},null,2))"

      - name: Validate controlled D1 target identity
        working-directory: workers/W02-content
        env:
          D1_01_ID: "2f80471e-3756-49f9-8db1-7707a433ad64"
          DATABASE_NAME: ${{ inputs.database_name }}
        run: |
          set -euo pipefail
          node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')); const d=c.d1_databases?.find(x=>x.binding==='D1_01'); if(!d) throw new Error('D1_01 binding missing'); if(d.database_name !== process.env.DATABASE_NAME) throw new Error('database_name mismatch'); if(d.database_id !== process.env.D1_01_ID) throw new Error('D1_01 database_id mismatch'); console.log(JSON.stringify({binding:d.binding,database_name:d.database_name,database_id:d.database_id},null,2))"

      - name: Read and persist remote schema snapshot
        working-directory: workers/W02-content
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ../../artifacts/mapping-0/auth-003-d1-schema
          npx --yes wrangler@4.116.0 d1 execute "${{ inputs.database_name }}" --remote \
            --config wrangler.jsonc \
            --command "SELECT name, type, tbl_name, sql FROM sqlite_master WHERE type IN ('table','index','trigger') ORDER BY type, name;" \
            > ../../artifacts/mapping-0/auth-003-d1-schema/sqlite_master.txt
          npx --yes wrangler@4.116.0 d1 execute "${{ inputs.database_name }}" --remote \
            --config wrangler.jsonc \
            --command "PRAGMA table_list;" \
            > ../../artifacts/mapping-0/auth-003-d1-schema/table_list.txt

      - name: Read and persist remote migration ledger
        working-directory: workers/W02-content
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.116.0 d1 execute "${{ inputs.database_name }}" --remote \
            --config wrangler.jsonc \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name='d1_migrations';" \
            > ../../artifacts/mapping-0/auth-003-d1-schema/d1_migrations_presence.txt
          npx --yes wrangler@4.116.0 d1 execute "${{ inputs.database_name }}" --remote \
            --config wrangler.jsonc \
            --command "SELECT * FROM d1_migrations ORDER BY id;" \
            > ../../artifacts/mapping-0/auth-003-d1-schema/d1_migrations.txt
      - name: Write provenance
        run: |
          mkdir -p artifacts/mapping-0/auth-003-d1-schema
          printf '%s\n' \
            'AUTH-003 D1-01 Readonly Schema Evidence' \
            'workflow=W02 Remote D1 Readonly Evidence' \
            'source_sha=${{ inputs.source_sha }}' \
            'database_name=${{ inputs.database_name }}' \
            'database_id=2f80471e-3756-49f9-8db1-7707a433ad64' \
            'binding=D1_01' \
            'environment=CONTROLLED_REMOTE_D1_READONLY' \
            'workflow_mode=READONLY' \
            'no_remote_ddl=true' \
            'no_remote_dml=true' > artifacts/mapping-0/auth-003-d1-schema/provenance.txt

      - name: Validate captured evidence files
        run: |
          set -euo pipefail
          test -s artifacts/mapping-0/auth-003-d1-schema/sqlite_master.txt
          test -s artifacts/mapping-0/auth-003-d1-schema/table_list.txt
          test -s artifacts/mapping-0/auth-003-d1-schema/d1_migrations_presence.txt
          test -s artifacts/mapping-0/auth-003-d1-schema/d1_migrations.txt
          test -s artifacts/mapping-0/auth-003-d1-schema/provenance.txt
          grep -F "source_sha=${{ inputs.source_sha }}" artifacts/mapping-0/auth-003-d1-schema/provenance.txt
          grep -F "database_name=${{ inputs.database_name }}" artifacts/mapping-0/auth-003-d1-schema/provenance.txt
          grep -F "database_id=2f80471e-3756-49f9-8db1-7707a433ad64" artifacts/mapping-0/auth-003-d1-schema/provenance.txt
          grep -F "no_remote_ddl=true" artifacts/mapping-0/auth-003-d1-schema/provenance.txt
          grep -F "no_remote_dml=true" artifacts/mapping-0/auth-003-d1-schema/provenance.txt

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: auth-003-d1-readonly-schema-evidence-${{ inputs.source_sha }}
          path: artifacts/mapping-0/auth-003-d1-schema/
          if-no-files-found: error
          retention-days: 30
     - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: w02-remote-d1-readonly-evidence-${{ inputs.source_sha }}
          path: artifacts/mapping-0/w02-remote-d1-readonly-provenance.txt
