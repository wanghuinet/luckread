name: Neon Runtime Cutover Deploy — W07 D1-01 Membership and D1-04 Finance

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY_W07_NEON_ONLY to deploy the D1-free W07 Neon production config
        required: true
        type: choice
        options:
          - DEPLOY_W07_NEON_ONLY

permissions:
  contents: read

concurrency:
  group: neon-runtime-cutover-w07
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && github.ref_protected == true && github.event_name == 'workflow_dispatch' && inputs.confirm == 'DEPLOY_W07_NEON_ONLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact main deployment source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Require imported business data and explicit Neon production cutover approval
        run: node scripts/neon/assert-production-cutover-authorized.mjs D1-01 D1-04

      - name: Validate both Neon domains and historical D1 source identities
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const boundary = JSON.parse(fs.readFileSync('contracts/transport/worker-d1-access-boundary.v1.json', 'utf8'))
          const financeSource = JSON.parse(fs.readFileSync('contracts/database/neon-d1-04-w07-order-payment-schema.v1.json', 'utf8'))
          const config = JSON.parse(fs.readFileSync('workers/W07-subscription-commerce/wrangler.neon.jsonc', 'utf8'))
          const bootstrap = JSON.parse(fs.readFileSync('contracts/database/neon-five-domain-schema-bootstrap.v1.json', 'utf8'))
          const d101SourceUuid = boundary.physicalD1Registry?.['D1-01']
          const d104SourceUuid = financeSource.target?.cloudflareD1DatabaseUuid
          const financeSources = financeSource.scope?.includedSourceMigrations || []
          const h101 = (config.hyperdrive || []).find(x => x.binding === 'HYPERDRIVE_MEMBERSHIP_DB')
          const h104 = (config.hyperdrive || []).find(x => x.binding === 'HYPERDRIVE_FINANCE_DB')
          const domain101 = (bootstrap.domains || []).find(x => x.domainId === 'D1-01')
          const domain104 = (bootstrap.domains || []).find(x => x.domainId === 'D1-04')
          const governance = (config.services || []).find(x => x.binding === 'W06_GOVERNANCE')
          if (config.name !== 'luckread-w07' || config.main !== 'src/index.ts' || config.workers_dev !== false) {
            throw new Error('W07 Worker identity, entrypoint or public exposure boundary changed')
          }
          if (config.vars?.W07_MEMBERSHIP_DATABASE_DRIVER !== 'neon' ||
              config.vars?.W07_DATABASE_DRIVER !== 'neon' ||
              config.vars?.MEMBERSHIP_RENEWAL_ENABLED !== 'false') {
            throw new Error('W07 Neon selectors or disabled-renewal safety gate drifted')
          }
          if (d101SourceUuid !== '2f80471e-3756-49f9-8db1-7707a433ad64' ||
              financeSource.target?.binding !== 'D1_04' ||
              d104SourceUuid !== '9bfb89a5-fbb5-45b1-a2ee-eab674b0d736' ||
              financeSource.target?.cloudflareD1DatabaseName !== 'unimportant' ||
              financeSource.target?.databaseName !== 'luckread_finance' ||
              financeSources.length !== 7 ||
              financeSources.some(source => !fs.existsSync(source))) {
            throw new Error('W07 historical D1-01/D1-04 schema source contracts or seven source migrations drifted')
          }
          if ((config.d1_databases || []).length !== 0) {
            throw new Error('W07 production Neon config must not declare Cloudflare D1 bindings')
          }
          if (!h101 || h101.id !== '0c53a1bb9bc0484bac146e8ae2d3158b' ||
              !h104 || h104.id !== '3ae15e6dfb5e4b44979eee30e1d5ede4') {
            throw new Error('W07 must use the existing D1-01 and D1-04 Hyperdrive resources')
          }
          if (domain101?.databaseName !== 'luckread' || domain101?.remoteSchemaApplied !== true ||
              domain104?.databaseName !== 'luckread_finance' || domain104?.remoteSchemaApplied !== true) {
            throw new Error('W07 cannot select Neon before both owned remote schemas are recorded')
          }
          if (!governance || governance.service !== 'luckread-w06') {
            throw new Error('Existing W07 to W06 governance Service Binding must be preserved')
          }
          console.log('W07_NEON_ONLY_D1_01_D1_04_RUNTIME_CUTOVER_CONFIG=PASS')
          NODE

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install W07 PostgreSQL runtime dependency from committed lockfile
        run: npm ci --prefix workers/W07-subscription-commerce --ignore-scripts --no-audit --fund=false

      - name: Deploy W07 membership and finance runtimes on existing Neon databases
        working-directory: workers/W07-subscription-commerce
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.156.0 deploy --config wrangler.neon.jsonc 2>&1 | tee "$RUNNER_TEMP/w07-neon-deploy.log"
          version_id="$(sed -n 's/.*Current Version ID: //p' "$RUNNER_TEMP/w07-neon-deploy.log" | tail -n 1)"
          if [ -z "$version_id" ]; then
            echo "Wrangler did not return a W07 Worker Version ID; refusing to report a deployment."
            exit 1
          fi
          echo "W07_UPLOADED_VERSION_ID=$version_id"
          npx --yes wrangler@4.156.0 versions deploy "$version_id@100%" --name luckread-w07 --config wrangler.neon.jsonc --yes
          npx --yes wrangler@4.156.0 deployments list --name luckread-w07 --config wrangler.neon.jsonc
