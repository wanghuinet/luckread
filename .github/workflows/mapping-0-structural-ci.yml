name: Mapping 0 Structural Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mapping-0-structural:
    name: Mapping 0 structural/contract verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Deliberately checks current main so bot-generated reconciliation commits
      # are validated on the next human/automation push rather than relying on
      # a non-recursive GITHUB_TOKEN-triggered workflow.
      - name: Verify Mapping 0
        run: node scripts/mapping-0-verify.mjs

      - name: Report canonical closure edge metrics
        run: node scripts/mapping-closure-metrics.mjs

      - name: Report evidence freshness metrics
        run: node scripts/evidence-freshness-metrics.mjs

      - name: Report Batch G orphan/duplicate sweep
        run: node scripts/mapping-0-batch-g-final-sweep.mjs


  auth-002-remote-evidence:
    name: AUTH-002 controlled remote D1 evidence
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'evidence(auth-002): capture controlled remote schema' }}
    needs: mapping-0-structural
    uses: ./.github/workflows/auth-session-schema-evidence.yml
    with:
      database_name: luckread
      environment_class: CONTROLLED_REMOTE_D1
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
