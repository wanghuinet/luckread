name: Mapping 0 Structural Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mapping-0-structural:
    name: Mapping 0 structural/contract verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Materialize missing canonical Mapping 0 records
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: node scripts/materialize-canonical-mapping.mjs

      - name: Commit canonical Mapping 0 materialization
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          if git diff --quiet -- contracts/alignment/cross-system-mapping.v1.json; then
            echo 'No Mapping 0 materialization changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contracts/alignment/cross-system-mapping.v1.json
          git commit -m 'chore(mapping): materialize canonical Mapping 0 records'
          git push origin HEAD:main

      - name: Verify Mapping 0
        run: node scripts/mapping-0-verify.mjs
