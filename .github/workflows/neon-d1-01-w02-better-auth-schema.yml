name: Neon D1-01 W02 Better Auth PostgreSQL Schema

on:
  pull_request:
    paths:
      - '.github/workflows/neon-d1-01-w02-better-auth-schema.yml'
      - 'contracts/entity/AUTHZ-role-assignment-authority.v1.json'
      - 'contracts/entity/AUTH-003-identity-field-contract.v1.json'
      - 'contracts/entity/AUTH-003-credential-field-contract.v1.json'
      - 'contracts/api/AUTH-003-credential-management-contract.v1.json'
      - 'contracts/migration/AUTH-013-publication-journal.v1.json'
      - 'contracts/events/identity-account-state-changed.v1.json'
      - 'contracts/migration/AUTH-010-session-revocation-journal.v1.json'
      - 'contracts/events/AUTH-010-session-revoked-binding.v1.json'
      - 'contracts/persistence/AUTH-015-account-lifecycle-window-persistence-contract.v1.json'
      - 'docs/change-control/CC-AUTH-015-W02-LIFECYCLE-WINDOW-PERSISTENCE-2026-11-06.md'
      - 'contracts/authz/layers.json'
      - 'workers/W02-identity/package.json'
      - 'workers/W02-identity/src/auth/better-auth.ts'
      - 'workers/W02-identity/src/auth/neon-postgres-schema.config.ts'
      - 'workers/W02-identity/src/neon-postgres-migrations/**'
      - 'workers/W02-identity/scripts/neon/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-and-verify:
    name: Generate W02 identity schema and verify on disposable PostgreSQL 18
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: schema_generator
          POSTGRES_PASSWORD: schema_generator_local_only
          POSTGRES_DB: luckread_schema
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schema_generator -d luckread_schema"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pinned W02 toolchain
        working-directory: workers/W02-identity
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify Better Auth and CLI versions are pinned together
        working-directory: workers/W02-identity
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'
          const pkg = JSON.parse(await readFile('./package.json', 'utf8'))
          const auth = JSON.parse(await readFile('./node_modules/better-auth/package.json', 'utf8'))
          const cli = JSON.parse(await readFile('./node_modules/auth/package.json', 'utf8'))
          if (pkg.dependencies['better-auth'] !== '1.7.8' || auth.version !== '1.7.8') {
            throw new Error('W02 Better Auth runtime must remain pinned to 1.7.8')
          }
          if (pkg.devDependencies.auth !== '1.7.8' || cli.version !== '1.7.8') {
            throw new Error('W02 Better Auth schema CLI must match runtime version 1.7.8')
          }
          if (pkg.devDependencies.pg !== '8.20.0') {
            throw new Error('W02 schema-generation PostgreSQL driver pin drifted')
          }
          console.log('Better Auth runtime, schema CLI, and PostgreSQL driver pins: PASS')
          NODE

      - name: Generate PostgreSQL DDL from the canonical W02 Better Auth configuration
        working-directory: workers/W02-identity
        env:
          W02_SCHEMA_PGHOST: 127.0.0.1
          W02_SCHEMA_PGPORT: '5432'
          W02_SCHEMA_PGUSER: schema_generator
          W02_SCHEMA_PGPASSWORD: schema_generator_local_only
          W02_SCHEMA_PGDATABASE: luckread_schema
        run: |
          set -euo pipefail
          mkdir -p artifacts/neon
          npm run neon:schema:generate

      - name: Generate W02 custom PostgreSQL migrations from canonical contracts
        working-directory: workers/W02-identity
        run: |
          set -euo pipefail
          npm run neon:role-assignment:generate
          npm run neon:auth003:generate
          npm run neon:auth013-journal:generate
          npm run neon:auth015:generate
          npm run neon:auth010:generate
          node ../../scripts/auth-010-session-revocation-journal-static-audit.mjs
          git diff --exit-code -- \
            src/neon-postgres-migrations/0001_role_assignments.sql \
            src/neon-postgres-migrations/0002_role_authorization_versions.sql \
            src/neon-postgres-migrations/0003_auth_003_credentials.sql \
            src/neon-postgres-migrations/0004_auth_013_publication_journal.sql \
            src/neon-postgres-migrations/0005_auth_015_lifecycle_windows.sql \
            src/neon-postgres-migrations/0006_auth_010_session_revocation_journal.sql

      - name: Confirm all generated DDL is PostgreSQL-native
        working-directory: workers/W02-identity
        run: |
          set -euo pipefail
          files=(
            artifacts/neon/w02-better-auth-postgres-schema.sql
            src/neon-postgres-migrations/0001_role_assignments.sql
            src/neon-postgres-migrations/0002_role_authorization_versions.sql
            src/neon-postgres-migrations/0003_auth_003_credentials.sql
            src/neon-postgres-migrations/0004_auth_013_publication_journal.sql
            src/neon-postgres-migrations/0005_auth_015_lifecycle_windows.sql
            src/neon-postgres-migrations/0006_auth_010_session_revocation_journal.sql
          )
          for file in "${files[@]}"; do
            test -s "$file"
            if grep -Eiq '(^|[^[:alnum:]_])(PRAGMA|AUTOINCREMENT|strftime|julianday|GLOB|RAISE[[:space:]]*\([[:space:]]*ABORT)([^[:alnum:]_]|$)' "$file"; then
              echo "Generated PostgreSQL schema contains SQLite-only SQL: $file"
              exit 1
            fi
          done

      - name: Apply generated Better Auth DDL to disposable PostgreSQL 18
        working-directory: workers/W02-identity
        env:
          PGPASSWORD: schema_generator_local_only
        run: |
          psql --host 127.0.0.1 --port 5432 --username schema_generator \
            --dbname luckread_schema --set ON_ERROR_STOP=1 \
            --file artifacts/neon/w02-better-auth-postgres-schema.sql

      - name: Run the official Better Auth schema check against disposable PostgreSQL
        working-directory: workers/W02-identity
        env:
          W02_SCHEMA_PGHOST: 127.0.0.1
          W02_SCHEMA_PGPORT: '5432'
          W02_SCHEMA_PGUSER: schema_generator
          W02_SCHEMA_PGPASSWORD: schema_generator_local_only
          W02_SCHEMA_PGDATABASE: luckread_schema
        run: npm run neon:schema:check

      - name: Apply generated RoleAssignment PostgreSQL migrations
        working-directory: workers/W02-identity
        env:
          PGPASSWORD: schema_generator_local_only
        run: |
          set -euo pipefail
          for file in \
            src/neon-postgres-migrations/0001_role_assignments.sql \
            src/neon-postgres-migrations/0002_role_authorization_versions.sql; do
            psql --host 127.0.0.1 --port 5432 --username schema_generator \
              --dbname luckread_schema --set ON_ERROR_STOP=1 --file "$file"
          done

      - name: Apply generated AUTH-003 identity and credential PostgreSQL migration
        working-directory: workers/W02-identity
        env:
          PGPASSWORD: schema_generator_local_only
        run: |
          psql --host 127.0.0.1 --port 5432 --username schema_generator \
            --dbname luckread_schema --set ON_ERROR_STOP=1 \
            --file src/neon-postgres-migrations/0003_auth_003_credentials.sql

      - name: Apply generated AUTH-013 durable publication journal PostgreSQL migration
        working-directory: workers/W02-identity
        env:
          PGPASSWORD: schema_generator_local_only
        run: |
          psql --host 127.0.0.1 --port 5432 --username schema_generator \
            --dbname luckread_schema --set ON_ERROR_STOP=1 \
            --file src/neon-postgres-migrations/0004_auth_013_publication_journal.sql

      - name: Apply generated AUTH-015 lifecycle window PostgreSQL migration
        working-directory: workers/W02-identity
        env:
          PGPASSWORD: schema_generator_local_only
        run: |
          psql --host 127.0.0.1 --port 5432 --username schema_generator \
            --dbname luckread_schema --set ON_ERROR_STOP=1 \
            --file src/neon-postgres-migrations/0005_auth_015_lifecycle_windows.sql

      - name: Apply generated AUTH-010 session revocation journal PostgreSQL migration
        working-directory: workers/W02-identity
        env:
          PGPASSWORD: schema_generator_local_only
        run: |
          psql --host 127.0.0.1 --port 5432 --username schema_generator \
            --dbname luckread_schema --set ON_ERROR_STOP=1 \
            --file src/neon-postgres-migrations/0006_auth_010_session_revocation_journal.sql

      - name: Verify Better Auth core tables and empty business rows
        working-directory: workers/W02-identity
        env:
          W02_SCHEMA_DATABASE_URL: postgresql://schema_generator:schema_generator_local_only@127.0.0.1:5432/luckread_schema
        run: node scripts/neon/verify-better-auth-core-schema.mjs > artifacts/neon/w02-better-auth-postgres-schema-postflight.json

      - name: Verify RoleAssignment constraints, temporal overlap, concurrency, and versioning
        working-directory: workers/W02-identity
        env:
          W02_SCHEMA_DATABASE_URL: postgresql://schema_generator:schema_generator_local_only@127.0.0.1:5432/luckread_schema
        run: npm run neon:role-assignment:verify > artifacts/neon/w02-role-assignment-postgres-schema-postflight.json

      - name: Verify AUTH-003 identity/credential constraints, FK, and uniqueness semantics
        working-directory: workers/W02-identity
        env:
          W02_SCHEMA_DATABASE_URL: postgresql://schema_generator:schema_generator_local_only@127.0.0.1:5432/luckread_schema
        run: npm run neon:auth003:verify > artifacts/neon/w02-auth003-postgres-schema-postflight.json

      - name: Verify AUTH-013 journal contract, retry state, and uniqueness semantics
        working-directory: workers/W02-identity
        env:
          W02_SCHEMA_DATABASE_URL: postgresql://schema_generator:schema_generator_local_only@127.0.0.1:5432/luckread_schema
        run: npm run neon:auth013-journal:verify > artifacts/neon/w02-auth013-publication-journal-postgres-schema-postflight.json

      - name: Verify AUTH-015 nullable lifecycle timestamps and empty user table
        working-directory: workers/W02-identity
        env:
          W02_SCHEMA_DATABASE_URL: postgresql://schema_generator:schema_generator_local_only@127.0.0.1:5432/luckread_schema
        run: npm run neon:auth015:verify > artifacts/neon/w02-auth015-lifecycle-windows-postgres-schema-postflight.json

      - name: Verify AUTH-010 secret-free session revocation journal and retry constraints
        working-directory: workers/W02-identity
        env:
          W02_SCHEMA_DATABASE_URL: postgresql://schema_generator:schema_generator_local_only@127.0.0.1:5432/luckread_schema
        run: npm run neon:auth010:verify > artifacts/neon/w02-auth010-session-revocation-postgres-schema-postflight.json

      - name: Upload generated schema and postflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w02-better-auth-postgres-schema-${{ github.run_id }}
          path: |
            workers/W02-identity/artifacts/neon/w02-better-auth-postgres-schema.sql
            workers/W02-identity/artifacts/neon/w02-better-auth-postgres-schema-postflight.json
            workers/W02-identity/artifacts/neon/w02-role-assignment-postgres-schema-postflight.json
            workers/W02-identity/src/neon-postgres-migrations/0001_role_assignments.sql
            workers/W02-identity/src/neon-postgres-migrations/0002_role_authorization_versions.sql
            workers/W02-identity/src/neon-postgres-migrations/0003_auth_003_credentials.sql
            workers/W02-identity/src/neon-postgres-migrations/0004_auth_013_publication_journal.sql
            workers/W02-identity/src/neon-postgres-migrations/0005_auth_015_lifecycle_windows.sql
            workers/W02-identity/src/neon-postgres-migrations/0006_auth_010_session_revocation_journal.sql
            workers/W02-identity/artifacts/neon/w02-auth010-session-revocation-postgres-schema-postflight.json
            workers/W02-identity/artifacts/neon/w02-auth003-postgres-schema-postflight.json
            workers/W02-identity/artifacts/neon/w02-auth013-publication-journal-postgres-schema-postflight.json
            workers/W02-identity/artifacts/neon/w02-auth015-lifecycle-windows-postgres-schema-postflight.json
          if-no-files-found: error
          retention-days: 30
