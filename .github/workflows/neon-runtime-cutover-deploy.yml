name: Neon Runtime Cutover Deploy — W05 Social

on:
  push:
    branches:
      - main
    paths:
      - 'workers/W05-social/wrangler.jsonc'

permissions:
  contents: read

concurrency:
  group: neon-runtime-cutover-w05
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact main deployment source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validate W05 Neon D1-02 runtime and preserve D1 rollback bindings
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const w05 = JSON.parse(fs.readFileSync('workers/W05-social/wrangler.jsonc', 'utf8'))
          const bootstrap = JSON.parse(fs.readFileSync('contracts/database/neon-five-domain-schema-bootstrap.v1.json', 'utf8'))
          const d1 = (w05.d1_databases || []).find(x => x.binding === 'DB')
          const d103 = (w05.d1_databases || []).find(x => x.binding === 'D1_03')
          const hyperdrive = (w05.hyperdrive || []).find(x => x.binding === 'HYPERDRIVE_D1_02')
          const domain = (bootstrap.domains || []).find(x => x.domainId === 'D1-02')
          if (w05.vars?.W05_DATABASE_DRIVER !== 'neon' ||
              w05.vars?.PUSH_DELIVERY_ENABLED !== 'false' ||
              !d1 || d1.database_id !== '6c342634-97f6-4248-9f4a-85772af4f22c' ||
              !d103 || d103.database_id !== 'bda1d247-a371-4244-91ae-aef96034db7f' ||
              !hyperdrive || hyperdrive.id !== 'c55183e1cc3446409c9c1075832c6615' ||
              domain?.databaseName !== 'luckreadpro' ||
              domain?.remoteSchemaApplied !== true) {
            throw new Error('W05 Neon selector, D1 rollback bindings or D1-02 schema admission drifted')
          }
          console.log('W05_NEON_RUNTIME_CUTOVER_CONFIG=PASS')
          NODE

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install W05 runtime dependencies
        working-directory: workers/W05-social
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Deploy W05 Social on Neon D1-02
        working-directory: workers/W05-social
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.116.0 deploy --config wrangler.jsonc
