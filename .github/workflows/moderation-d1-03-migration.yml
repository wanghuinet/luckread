name: Moderation D1-03 Migration

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact main commit containing the admitted Moderation D1-03 migration
        required: true
        type: string
        default: 81986b7510efb20a5dd44f9971ca40794989ddff
      database_name:
        description: D1-03 display name bound by W06 wrangler.jsonc
        required: true
        type: string
        default: secondary
      mode:
        description: APPLY when the target is expected to be unmigrated; VERIFY_ONLY when migration is already present
        required: true
        type: choice
        options:
          - VERIFY_ONLY
          - APPLY
        default: VERIFY_ONLY
      confirm:
        description: Type APPLY to permit remote D1 mutation
        required: true
        type: string
        default: APPLY

permissions:
  contents: read
  actions: read

jobs:
  migrate:
    if: ${{ inputs.confirm == 'APPLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact migration source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify moderation source CI
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          conclusion="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow moderation-runtime-source-ci.yml --commit "$SOURCE_SHA" --limit 1 --json conclusion --jq '.[0].conclusion // empty')"
          test "$conclusion" = success || {
            echo "Moderation source CI is not SUCCESS for $SOURCE_SHA (observed: \${conclusion:-none})"
            exit 1
          }

      - name: Verify controlled D1-03 binding
        working-directory: workers/luck04-commerce
        env:
          EXPECTED_DB_NAME: ${{ inputs.database_name }}
          EXPECTED_DB_ID: bda1d247-a371-4244-91ae-aef96034db7f
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          const d = config.d1_databases?.find(x => x.binding === 'D1_03');
          if (!d) throw new Error('D1_03 binding missing');
          if (d.database_name !== process.env.EXPECTED_DB_NAME) throw new Error('database_name input mismatch');
          if (d.database_id !== process.env.EXPECTED_DB_ID) throw new Error('D1-03 UUID mismatch');
          if (config.services?.find(x => x.binding === 'W03_CONTENT_MODERATION')?.service !== 'luckread-w03') throw new Error('W06→W03 binding mismatch');
          console.log(JSON.stringify(d,null,2));
          NODE
          test -f governance/migrations/0002_moderation_queue_foundation.sql
          test -z "$(git status --short)"

      - name: Local migration syntax and schema invariant check
        working-directory: workers/luck04-commerce
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y sqlite3
          rm -f /tmp/luckread-moderation.sqlite
          sqlite3 /tmp/luckread-moderation.sqlite < governance/migrations/0001_audit_event.sql
          sqlite3 /tmp/luckread-moderation.sqlite < governance/migrations/0002_moderation_queue_foundation.sql
          for table in moderation_cases moderation_decisions moderation_decision_idempotency moderation_txn_guard moderation_enforcement_outbox; do
            sqlite3 -cmd '.mode json' /tmp/luckread-moderation.sqlite "PRAGMA table_info(\"$table\");" > "/tmp/$table.json"
            test "$(node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('/tmp/$table.json')); console.log(r.length)")" -gt 0
          done
          echo MODERATION_D1_03_MIGRATION_STATIC=PASS

      - name: Preflight remote target
        working-directory: workers/luck04-commerce
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts/mapping-0/moderation-d1-03-migration"
          npx --yes wrangler@4.116.0 d1 execute "${{ inputs.database_name }}" --remote --json --config wrangler.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('moderation_cases','moderation_decisions','moderation_decision_idempotency','moderation_txn_guard','moderation_enforcement_outbox') ORDER BY name;" > "$GITHUB_WORKSPACE/artifacts/mapping-0/moderation-d1-03-migration/preflight.json"
          node - <<'NODE'
          const fs=require('fs');
          const path=process.env.GITHUB_WORKSPACE+'/artifacts/mapping-0/moderation-d1-03-migration/preflight.json';
          const data=JSON.parse(fs.readFileSync(path,'utf8'));
          const rows=data?.[0]?.results ?? data?.results ?? data?.[0]?.result?.results ?? data?.result?.results ?? [];
          const names=new Set(rows.map(x=>x.name));
          const expected=['moderation_cases','moderation_decisions','moderation_decision_idempotency','moderation_txn_guard','moderation_enforcement_outbox'];
          const complete=expected.every(x=>names.has(x));
          if(process.env.MODE==='APPLY' && rows.length) throw new Error('Fail-closed APPLY: moderation tables already exist; use VERIFY_ONLY');
          if(process.env.MODE==='VERIFY_ONLY' && !complete) throw new Error('VERIFY_ONLY requires the complete moderation schema to already exist');
          console.log(process.env.MODE==='APPLY' ? 'MODERATION_TARGET_EMPTY=PASS' : 'MODERATION_TARGET_ALREADY_MIGRATED=PASS');
          NODE

      - name: Apply D1-03 moderation migration
        if: ${{ inputs.mode == 'APPLY' }}
        working-directory: workers/luck04-commerce
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.116.0 d1 migrations apply "${{ inputs.database_name }}" --remote --config wrangler.jsonc

      - name: Capture remote D1-03 evidence
        working-directory: workers/luck04-commerce
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/artifacts/mapping-0/moderation-d1-03-migration"
          npx --yes wrangler@4.116.0 d1 execute "${{ inputs.database_name }}" --remote --json --config wrangler.jsonc --command "SELECT type,name,tbl_name,sql FROM sqlite_master WHERE type IN ('table','index') AND (name IN ('moderation_cases','moderation_decisions','moderation_decision_idempotency','moderation_txn_guard','moderation_enforcement_outbox') OR tbl_name IN ('moderation_cases','moderation_decisions','moderation_decision_idempotency','moderation_txn_guard','moderation_enforcement_outbox')) ORDER BY type,name;" > "$out/schema.json"
          npx --yes wrangler@4.116.0 d1 execute "${{ inputs.database_name }}" --remote --json --config wrangler.jsonc --command 'SELECT * FROM d1_migrations ORDER BY id;' > "$out/d1-migrations.json"
          node - <<'NODE'
          const fs=require('fs');
          const dir=process.env.GITHUB_WORKSPACE+'/artifacts/mapping-0/moderation-d1-03-migration';
          const data=JSON.parse(fs.readFileSync(dir+'/schema.json','utf8'));
          const rows=data?.[0]?.results ?? data?.results ?? data?.[0]?.result?.results ?? data?.result?.results ?? [];
          const expected=['moderation_cases','moderation_decisions','moderation_decision_idempotency','moderation_txn_guard','moderation_enforcement_outbox'];
          const names=new Set(rows.filter(x=>x.type==='table').map(x=>x.name));
          for(const name of expected) if(!names.has(name)) throw new Error('Missing remote table '+name);
          console.log('MODERATION_D1_03_REMOTE_SCHEMA=PASS');
          console.log('MODERATION_D1_03_MIGRATION_RECORD_CAPTURED=PASS');
          NODE

      - name: Upload D1-03 migration evidence
        uses: actions/upload-artifact@v4
        with:
          name: moderation-d1-03-migration-${{ github.run_id }}
          path: ${{ github.workspace }}/artifacts/mapping-0/moderation-d1-03-migration/
          if-no-files-found: error
          retention-days: 14
