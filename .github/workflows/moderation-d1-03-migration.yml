name: Moderation D1-03 Migration

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact main commit containing the admitted Moderation D1-03 migration
        required: true
        type: string
        default: 81986b7510efb20a5dd44f9971ca40794989ddff
      database_name:
        description: D1-03 display name bound by W06 wrangler.jsonc
        required: true
        type: string
        default: secondary
      confirm:
        description: Type APPLY to permit remote D1 mutation
        required: true
        type: string
        default: APPLY

permissions:
  contents: read
  actions: read

jobs:
  migrate:
    if: ${{ inputs.confirm == 'APPLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact migration source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify moderation source CI
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          conclusion="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow moderation-runtime-source-ci.yml --commit "$SOURCE_SHA" --limit 1 --json conclusion --jq '.[0].conclusion // empty')"
          test "$conclusion" = success || {
            echo "Moderation source CI is not SUCCESS for $SOURCE_SHA (observed: \${conclusion:-none})"
            exit 1
          }

      - name: Verify controlled D1-03 binding
        working-directory: workers/W06-governance
        env:
          EXPECTED_DB_NAME: ${{ inputs.database_name }}
          EXPECTED_DB_ID: bda1d247-a371-4244-91ae-aef96034db7f
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          const d = config.d1_databases?.find(x => x.binding === 'D1_03');
          if (!d) throw new Error('D1_03 binding missing');
          if (d.database_name !== process.env.EXPECTED_DB_NAME) throw new Error('database_name input mismatch');
          if (d.database_id !== process.env.EXPECTED_DB_ID) throw new Error('D1-03 UUID mismatch');
          if (config.services?.find(x => x.binding === 'W03_CONTENT_MODERATION')?.service !== 'luckread-w03') throw new Error('W06→W03 binding mismatch');
          console.log(JSON.stringify(d,null,2));
          NODE
          test -f migrations/0002_moderation_queue_foundation.sql
          test -z "$(git status --short)"

      - name: Local migration syntax and schema invariant check
        working-directory: workers/W06-governance
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y sqlite3
          rm -f /tmp/luckread-moderation.sqlite
          sqlite3 /tmp/luckread-moderation.sqlite < migrations/0001_audit_event.sql
          sqlite3 /tmp/luckread-moderation.sqlite < migrations/0002_moderation_queue_foundation.sql
          for table in moderation_cases moderation_decisions moderation_decision_idempotency moderation_txn_guard moderation_enforcement_outbox; do
            sqlite3 -cmd '.mode json' /tmp/luckread-moderation.sqlite "PRAGMA table_info(\"$table\");" > "/tmp/$table.json"
            test "$(node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('/tmp/$table.json')); console.log(r.length)")" -gt 0
          done
          echo MODERATION_D1_03_MIGRATION_STATIC=PASS

      - name: Preflight remote target
        working-directory: workers/W06-governance
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts/mapping-0/moderation-d1-03-migration"
          npx --yes wrangler@4.116.0 d1 execute "${{ inputs.database_name }}" --remote --json --config wrangler.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('moderation_cases','moderation_decisions','moderation_decision_idempotency','moderation_txn_guard') ORDER BY name;" > "$GITHUB_WORKSPACE/artifacts/mapping-0/moderation-d1-03-migration/preflight.json"
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync(process.env.GITHUB_WORKSPACE+'/artifacts/mapping-0/moderation-d1-03-migration/preflight.json','utf8'));
          const rows=data?.[0]?.results??[];
          if(rows.length) throw new Error('Fail-closed: one or more moderation tables already exist');
          console.log('MODERATION_TARGET_EMPTY=PASS');
          NODE

      - name: Apply D1-03 moderation migration
        working-directory: workers/W06-governance
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.116.0 d1 migrations apply "${{ inputs.database_name }}" --remote --config wrangler.jsonc

      - name: Capture remote D1-03 evidence
        working-directory: workers/W06-governance
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/artifacts/mapping-0/moderation-d1-03-migration"
          for table in moderation_cases moderation_decisions moderation_decision_idempotency moderation_txn_guard moderation_enforcement_outbox; do
            npx --yes wrangler@4.116.0 d1 execute "${{ inputs.database_name }}" --remote --json --config wrangler.jsonc --command "PRAGMA table_info(\"$table\");" > "$out/$table-schema.json"
            npx --yes wrangler@4.116.0 d1 execute "${{ inputs.database_name }}" --remote --json --config wrangler.jsonc --command "PRAGMA index_list(\"$table\");" > "$out/$table-indexes.json"
          done
          npx --yes wrangler@4.116.0 d1 execute "${{ inputs.database_name }}" --remote --json --config wrangler.jsonc --command 'SELECT id,name,batch FROM d1_migrations ORDER BY id;' > "$out/d1-migrations.json"
          node - <<'NODE'
          const fs=require('fs');
          const dir=process.env.GITHUB_WORKSPACE+'/artifacts/mapping-0/moderation-d1-03-migration';
          for(const table of ['moderation_cases','moderation_decisions','moderation_decision_idempotency','moderation_txn_guard','moderation_enforcement_outbox']){
            const rows=JSON.parse(fs.readFileSync(dir+'/'+table+'-schema.json'))?.[0]?.results??[];
            if(!rows.length) throw new Error('Missing remote table '+table);
          }
          console.log('MODERATION_D1_03_REMOTE_SCHEMA=PASS');
          NODE

      - name: Upload D1-03 migration evidence
        uses: actions/upload-artifact@v4
        with:
          name: moderation-d1-03-migration-${{ github.run_id }}
          path: ${{ github.workspace }}/artifacts/mapping-0/moderation-d1-03-migration/
          if-no-files-found: error
          retention-days: 14
