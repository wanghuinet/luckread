name: Neon D1-03 W10 Async Execution PostgreSQL 18 Local Rehearsal

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/neon-d1-03-w10-execution-postgres-rehearsal.yml'
      - 'contracts/database/neon-d1-03-w10-execution-schema.v1.json'
      - 'contracts/transport/d1-03-entity-owner-boundary.v1.json'
      - 'docs/163-EVENT-SEMANTICS-DELIVERY-ORDERING-REPLAY-DLQ-CONTRACT-v1.0.md'
      - 'docs/165-UNIFIED-ASYNC-OPERATION-CONTRACT-v1.0.md'
      - 'workers/W09-platform/wrangler.d1-03-migrations.jsonc'
      - 'workers/W09-platform/migrations-d1-03/0002_w10_async_execution_state.sql'
      - 'workers/W10-async/wrangler.jsonc'
      - 'workers/W10-async/README.md'
      - 'workers/W10-async/src/event-envelope.ts'
      - 'workers/W10-async/src/retry-policy.ts'
      - 'workers/W10-async/src/canonical-json-idempotency.ts'
      - 'workers/W10-async/scripts/neon/**'
      - 'workers/W10-async/src/neon-postgres-migrations/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/neon-d1-03-w10-execution-postgres-rehearsal.yml'
      - 'contracts/database/neon-d1-03-w10-execution-schema.v1.json'
      - 'contracts/transport/d1-03-entity-owner-boundary.v1.json'
      - 'docs/163-EVENT-SEMANTICS-DELIVERY-ORDERING-REPLAY-DLQ-CONTRACT-v1.0.md'
      - 'docs/165-UNIFIED-ASYNC-OPERATION-CONTRACT-v1.0.md'
      - 'workers/W09-platform/wrangler.d1-03-migrations.jsonc'
      - 'workers/W09-platform/migrations-d1-03/0002_w10_async_execution_state.sql'
      - 'workers/W10-async/wrangler.jsonc'
      - 'workers/W10-async/README.md'
      - 'workers/W10-async/src/event-envelope.ts'
      - 'workers/W10-async/src/retry-policy.ts'
      - 'workers/W10-async/src/canonical-json-idempotency.ts'
      - 'workers/W10-async/scripts/neon/**'
      - 'workers/W10-async/src/neon-postgres-migrations/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-d1-03-w10-execution-postgres18-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  w10-execution-local-rehearsal:
    name: Rehearse W10 execution schema on disposable PostgreSQL 18
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_local_only
          POSTGRES_DB: luckread_d1_03_w10_rehearsal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d luckread_d1_03_w10_rehearsal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check deterministic generator and source admission
        run: |
          set -euo pipefail
          node --check workers/W10-async/scripts/neon/generate-d1-03-w10-postgres-migration.mjs
          node --test workers/W10-async/scripts/neon/generate-d1-03-w10-postgres-migration.test.mjs
          node workers/W10-async/scripts/neon/generate-d1-03-w10-postgres-migration.mjs
          git diff --exit-code -- workers/W10-async/src/neon-postgres-migrations/0001_w10_d1_03_async_execution.sql

      - name: Apply W10 execution schema to disposable PostgreSQL 18
        env:
          D1_03_W10_LOCAL_DATABASE_URL: postgresql://postgres:postgres_local_only@127.0.0.1:5432/luckread_d1_03_w10_rehearsal
        run: |
          set -euo pipefail
          mkdir -p artifacts/neon
          psql "$D1_03_W10_LOCAL_DATABASE_URL" \
            --set ON_ERROR_STOP=1 --no-psqlrc --single-transaction \
            --file workers/W10-async/src/neon-postgres-migrations/0001_w10_d1_03_async_execution.sql

      - name: Verify catalog, same-owner references, dedupe and rollback
        env:
          D1_03_W10_LOCAL_DATABASE_URL: postgresql://postgres:postgres_local_only@127.0.0.1:5432/luckread_d1_03_w10_rehearsal
        run: |
          set -euo pipefail
          psql "$D1_03_W10_LOCAL_DATABASE_URL" \
            --set ON_ERROR_STOP=1 --no-psqlrc \
            --file workers/W10-async/scripts/neon/verify-d1-03-w10-postgres-schema.sql \
            | tee artifacts/neon/d1-03-w10-execution-postflight.txt

      - name: Upload W10 D1-03 PostgreSQL 18 rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-d1-03-w10-execution-postgres18-${{ github.sha }}
          path: artifacts/neon/d1-03-w10-execution-postflight.txt
          if-no-files-found: error
          retention-days: 90
