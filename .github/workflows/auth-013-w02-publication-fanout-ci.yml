name: AUTH-013 W02 Publication Fanout CI

on:
  push:
    branches: [main]
    paths:
      - "workers/W02-content/src/account/publication-journal-publisher.ts"
      - "workers/W02-content/src/account/publication-journal-publisher.test.ts"
      - "workers/W02-content/wrangler.jsonc"
      - ".github/workflows/auth-013-w02-publication-fanout-ci.yml"
  pull_request:
    paths:
      - "workers/W02-content/src/account/publication-journal-publisher.ts"
      - "workers/W02-content/src/account/publication-journal-publisher.test.ts"
      - "workers/W02-content/wrangler.jsonc"
      - ".github/workflows/auth-013-w02-publication-fanout-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-fanout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused publisher tests
        run: npx vitest@3.2.4 run workers/W02-content/src/account/publication-journal-publisher.test.ts

      - name: Validate W02 projection queue binding
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs')
          const c = JSON.parse(fs.readFileSync('workers/W02-content/wrangler.jsonc','utf8'))
          const producers = c.queues?.producers ?? []
          const audit = producers.find(x => x.binding === 'AUTH013_QUEUE')
          const projection = producers.find(x => x.binding === 'AUTH013_PROJECTION_QUEUE')
          if (!audit || audit.queue !== 'luckread-auth013-account-state') throw new Error('Audit queue binding mismatch')
          if (!projection || projection.queue !== 'luckread-auth013-account-state-projection') throw new Error('Projection queue binding mismatch')
          console.log(JSON.stringify({audit, projection}, null, 2))
          NODE
