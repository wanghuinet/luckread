name: AUTH-013 W02 Publication Fanout CI

on:
  push:
    branches: [main]
    paths:
      - "workers/W02-identity/src/neon/account-state-publication-journal-publisher-postgres.ts"
      - "workers/W02-identity/src/index.ts"
      - "workers/W02-identity/wrangler.neon.jsonc"
      - ".github/workflows/auth-013-w02-publication-fanout-ci.yml"
  pull_request:
    paths:
      - "workers/W02-identity/src/account/publication-journal-publisher.ts"
      - "workers/W02-identity/src/account/publication-journal-publisher.test.ts"
      - "workers/W02-identity/wrangler.jsonc"
      - ".github/workflows/auth-013-w02-publication-fanout-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-fanout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify PostgreSQL publisher is wired to the Neon Worker
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const entry = fs.readFileSync('workers/W02-identity/src/index.ts', 'utf8')
          const publisher = fs.readFileSync('workers/W02-identity/src/neon/account-state-publication-journal-publisher-postgres.ts', 'utf8')
          const config = JSON.parse(fs.readFileSync('workers/W02-identity/wrangler.neon.jsonc', 'utf8'))
          if (!entry.includes('publishPendingAccountStateEventsPostgres')) throw new Error('Neon account-state publisher is not wired to the Worker')
          if (!publisher.includes('FOR UPDATE SKIP LOCKED')) throw new Error('PostgreSQL publisher must retain concurrent-safe row claiming')
          if (config.vars?.W02_DATABASE_DRIVER !== 'neon' || (config.d1_databases ?? []).length !== 0) throw new Error('W02 production config must remain Neon-only')
          console.log('W02 Neon PostgreSQL publication runtime contract: PASS')
          NODE

      - name: Validate W02 projection queue binding
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs')
          const c = JSON.parse(fs.readFileSync('workers/W02-identity/wrangler.jsonc','utf8'))
          const producers = c.queues?.producers ?? []
          const audit = producers.find(x => x.binding === 'AUTH013_QUEUE')
          const projection = producers.find(x => x.binding === 'AUTH013_PROJECTION_QUEUE')
          if (!audit || audit.queue !== 'luckread-auth013-account-state') throw new Error('Audit queue binding mismatch')
          if (!projection || projection.queue !== 'luckread-auth013-account-state-projection') throw new Error('Projection queue binding mismatch')
          console.log(JSON.stringify({audit, projection}, null, 2))
          NODE
