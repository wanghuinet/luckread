name: AUTH-002 Migration Generation

on:
  workflow_dispatch:
    inputs:
      migration_name:
        description: 'Stable AUTH-002 migration name'
        required: true
        default: MIG-AUTH-002-SESSION-V1
        type: string
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/payload.config.ts'
      - 'src/collections/Users.ts'
      - 'src/db/auth-session-state.ts'
      - 'scripts/auth-002-migration-generation-admission.mjs'
      - 'scripts/auth-002-migration-static-audit.mjs'
      - '.github/workflows/auth-session-migration-generation.yml'

permissions:
  contents: read

env:
  DEFAULT_MIGRATION_NAME: MIG-AUTH-002-SESSION-V1

jobs:
  generate:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck schema registration
        run: npm run typecheck

      - name: Validate migration generation prerequisites
        id: admission
        run: |
          set +e
          node scripts/auth-002-migration-generation-admission.mjs
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'artifact_present=true' >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 2 ]; then
            echo 'artifact_present=false' >> "$GITHUB_OUTPUT"
            echo 'Pre-artifact admission is expected; continuing to generator.'
          else
            exit "$status"
          fi

      - name: Select stable migration name
        id: migration-name
        env:
          INPUT_MIGRATION_NAME: ${{ inputs.migration_name }}
          DEFAULT_MIGRATION_NAME: ${{ env.DEFAULT_MIGRATION_NAME }}
        run: |
          set -euo pipefail
          migration_name="${INPUT_MIGRATION_NAME:-$DEFAULT_MIGRATION_NAME}"
          test "$migration_name" = "$DEFAULT_MIGRATION_NAME"
          printf 'migration_name=%s\n' "$migration_name" >> "$GITHUB_OUTPUT"

      - name: Generate Payload migration only
        env:
          MIGRATION_NAME: ${{ steps.migration-name.outputs.migration_name }}
        run: |
          set -euo pipefail
          test ! -d src/migrations
          npm run payload -- migrate:create "$MIGRATION_NAME"

      - name: Audit generated migration
        run: node scripts/auth-002-migration-static-audit.mjs

      - name: Enforce generation-only change boundary
        run: |
          set -euo pipefail
          changed=$(git status --short)
          printf '%s\n' "$changed"
          printf '%s\n' "$changed" | grep -Eq '^\?\? src/migrations/'
          unexpected=$(printf '%s\n' "$changed" | grep -Ev '^\?\? src/migrations/' || true)
          test -z "$unexpected"
          test "$(find src/migrations -maxdepth 1 -type f \\( -name '*.ts' -o -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \\) | wc -l)" -ge 1

      - name: Upload generated migration for review
        uses: actions/upload-artifact@v4
        with:
          name: auth-002-migration-${{ github.run_id }}
          path: src/migrations/
          if-no-files-found: error
          retention-days: 14
