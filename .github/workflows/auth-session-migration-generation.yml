name: AUTH-002 W01 Migration Source Audit

on:
  push:
    branches: [main]
    paths:
      - 'workers/W01-payload/package.json'
      - 'workers/W01-payload/pnpm-lock.yaml'
      - 'workers/W01-payload/src/payload.config.ts'
      - 'workers/W01-payload/src/collections/Users.ts'
      - 'workers/W01-payload/src/db/**'
      - 'workers/W01-payload/src/migrations/**'
      - 'scripts/auth-002-migration-generation-admission.mjs'
      - 'scripts/auth-002-migration-static-audit.mjs'
      - '.github/workflows/auth-session-migration-generation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.34.5 --activate

      - name: Install W01 locked dependencies
        working-directory: workers/W01-payload
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Typecheck W01 source
        working-directory: workers/W01-payload
        run: pnpm exec tsc --noEmit

      - name: Validate W01 migration admission
        run: node scripts/auth-002-migration-generation-admission.mjs

      - name: Audit existing W01 migration sources
        run: node scripts/auth-002-migration-static-audit.mjs

      - name: Upload W01 migration audit sources
        uses: actions/upload-artifact@v4
        with:
          name: auth-002-w01-migration-sources-${{ github.run_id }}
          path: workers/W01-payload/src/migrations/
          if-no-files-found: error
          retention-days: 14
