name: Worker Core Dependency Lockfile Reconciliation

on:
  pull_request:
    paths:
      - '.github/workflows/postgres-driver-lockfile-reconciliation.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'workers/W03-content/package.json'
      - 'workers/W02-identity/package.json'
      - 'workers/W02-identity/package-lock.json'
      - 'workers/W05-social/package.json'
      - 'workers/W05-social/package-lock.json'
      - 'workers/W07-subscription-commerce/package.json'
      - 'workers/W07-subscription-commerce/package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: worker-core-lockfiles-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  regenerate-and-verify:
    name: Regenerate and verify Worker core dependency lockfiles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Setup patched Node.js 24 LTS
        uses: actions/setup-node@v5
        with:
          node-version: '24.22.3'

      - name: Regenerate root repository lockfile for pinned Workers runtime types
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install root dependency graph from regenerated lockfile
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Audit root repository dependency graph
        run: npm audit --audit-level=high

      - name: Verify root and W03 Workers runtime type pins
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const root = JSON.parse(readFileSync('package.json', 'utf8'))
          const rootLock = JSON.parse(readFileSync('package-lock.json', 'utf8'))
          const w03 = JSON.parse(readFileSync('workers/W03-content/package.json', 'utf8'))
          const version = rootLock.packages?.['node_modules/@cloudflare/workers-types']?.version
          if (root.devDependencies?.['@cloudflare/workers-types'] !== '5.20261119.1' || version !== '5.20261119.1') {
            throw new Error(`Root Workers Types manifest/lock mismatch: manifest=${root.devDependencies?.['@cloudflare/workers-types']}, lock=${version}`)
          }
          if (w03.devDependencies?.['@cloudflare/workers-types'] !== '5.20261119.1') {
            throw new Error('W03 Workers Types pin must match the Wrangler 4.166.0 workerd generation')
          }
          console.log(`Root/W03 @cloudflare/workers-types=${version}`)
          NODE

      - name: Regenerate W02 identity lockfile from the exact manifest
        working-directory: workers/W02-identity
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install W02 identity dependency graph from the regenerated lockfile
        working-directory: workers/W02-identity
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Audit W02 identity dependency graph
        working-directory: workers/W02-identity
        run: npm audit --audit-level=high

      - name: Regenerate W05 social lockfile from the exact manifest
        working-directory: workers/W05-social
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install W05 social dependency graph from the regenerated lockfile
        working-directory: workers/W05-social
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Audit W05 social dependency graph
        working-directory: workers/W05-social
        run: npm audit --audit-level=high

      - name: Verify W05 Workers runtime type package
        working-directory: workers/W05-social
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'))
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'))
          const version = lock.packages?.['node_modules/@cloudflare/workers-types']?.version
          if (manifest.devDependencies?.['@cloudflare/workers-types'] !== '5.20261119.1' || version !== '5.20261119.1') {
            throw new Error(`W05 Workers Types manifest/lock mismatch: manifest=${manifest.devDependencies?.['@cloudflare/workers-types']}, lock=${version}`)
          }
          console.log(`W05 @cloudflare/workers-types=${version}`)
          NODE

      - name: Regenerate W07 subscription lockfile from the exact manifest
        working-directory: workers/W07-subscription-commerce
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install W07 subscription dependency graph from the regenerated lockfile
        working-directory: workers/W07-subscription-commerce
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Audit W07 subscription dependency graph
        working-directory: workers/W07-subscription-commerce
        run: npm audit --audit-level=high

      - name: Verify exact pg and @types/pg lockfile versions
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const workers = [
            ['W02', 'workers/W02-identity', true],
            ['W05', 'workers/W05-social', true],
            ['W07', 'workers/W07-subscription-commerce', true],
          ]
          for (const [name, dir, expectsTypes] of workers) {
            const manifest = JSON.parse(readFileSync(`${dir}/package.json`, 'utf8'))
            const lock = JSON.parse(readFileSync(`${dir}/package-lock.json`, 'utf8'))
            const pg = lock.packages?.['node_modules/pg']?.version
            if (manifest.dependencies?.pg !== '8.23.1' || pg !== '8.23.1') {
              throw new Error(`${name}: pg manifest/lock mismatch: manifest=${manifest.dependencies?.pg}, lock=${pg}`)
            }
            if (expectsTypes && manifest.devDependencies?.['@types/pg']) {
              const types = lock.packages?.['node_modules/@types/pg']?.version
              if (manifest.devDependencies['@types/pg'] !== '8.23.1' || types !== '8.23.1') {
                throw new Error(`${name}: @types/pg manifest/lock mismatch: manifest=${manifest.devDependencies['@types/pg']}, lock=${types}`)
              }
            }
            console.log(`${name}: pg=${pg}; @types/pg=${lock.packages?.['node_modules/@types/pg']?.version ?? 'not declared'}`)
          }
          NODE

      - name: Commit verified package lockfiles to the same-repository PR branch
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -n "$PR_BRANCH"
          test -n "$PR_HEAD_SHA"
          git fetch origin "$PR_HEAD_SHA"
          git checkout --detach "$PR_HEAD_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json workers/W02-identity/package-lock.json workers/W05-social/package-lock.json workers/W07-subscription-commerce/package-lock.json
          if git diff --cached --quiet; then
            echo "All Worker core dependency lockfiles are already current."
            exit 0
          fi
          git commit -m "chore(workers): update core dependency lockfiles"
          git push origin "HEAD:refs/heads/$PR_BRANCH"
