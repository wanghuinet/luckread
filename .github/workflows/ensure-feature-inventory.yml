name: Ensure Feature Inventory

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ensure-feature-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate canonical feature inventory when absent
        run: |
          if test -f contracts/alignment/feature-inventory.v1.json; then
            echo "Canonical feature inventory already exists."
            exit 0
          fi
          node scripts/build-feature-inventory.mjs
          test -f contracts/alignment/feature-inventory.v1.json

      - name: Validate generated inventory is non-empty and deterministic
        run: |
          test -s contracts/alignment/feature-inventory.v1.json
          cp contracts/alignment/feature-inventory.v1.json /tmp/feature-inventory.v1.json
          node scripts/build-feature-inventory.mjs
          cmp -s contracts/alignment/feature-inventory.v1.json /tmp/feature-inventory.v1.json

      - name: Commit generated inventory
        run: |
          if git diff --quiet -- contracts/alignment/feature-inventory.v1.json && git ls-files --error-unmatch contracts/alignment/feature-inventory.v1.json >/dev/null 2>&1; then
            echo "No inventory commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/alignment/feature-inventory.v1.json
          git commit -m "contract: materialize canonical feature inventory"
          git push
