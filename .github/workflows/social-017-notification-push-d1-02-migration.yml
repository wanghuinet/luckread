name: W05 Notification Push D1-02 Migration

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact merged main SHA containing NOTIFY-003
        required: true
        type: string
      confirm:
        description: Type APPLY_SOCIAL_017_PUSH_DELIVERY_MIGRATION to permit remote D1 mutation
        required: true
        type: string

permissions:
  contents: read

env:
  WRANGLER_VERSION: 4.116.0
  EXPECTED_WORKER: luckread-w05
  EXPECTED_DB_ID: 6c342634-97f6-4248-9f4a-85772af4f22c
  EXPECTED_DB_NAME: luckreadpro
  EXPECTED_MIGRATION: 20261104_017_notification_push_delivery_v1

jobs:
  migrate:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'APPLY_SOCIAL_017_PUSH_DELIVERY_MIGRATION' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate exact source SHA
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$SOURCE_SHA" = "$WORKFLOW_SHA"

      - name: Checkout exact merged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1

      - name: Verify exact source, W05 binding and workflow default
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
          python - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('workers/W05-social/wrangler.jsonc').read_text())
          assert c['name'] == 'luckread-w05'
          dbs = {item['binding']: item for item in c['d1_databases']}
          assert set(dbs) == {'DB', 'D1_03'}
          assert dbs['DB']['database_id'] == '6c342634-97f6-4248-9f4a-85772af4f22c'
          assert dbs['DB']['database_name'] == 'luckreadpro'
          assert dbs['DB']['migrations_dir'] == 'migrations'
          assert dbs['D1_03']['database_id'] == 'bda1d247-a371-4244-91ae-aef96034db7f'
          assert dbs['D1_03']['database_name'] == 'secondary'
          assert c.get('vars', {}).get('PUSH_DELIVERY_ENABLED') == 'false'
          workflows = c.get('workflows', [])
          assert len(workflows) == 1
          assert workflows[0]['binding'] == 'NOTIFICATION_PUSH_WORKFLOW'
          assert workflows[0]['class_name'] == 'NotificationPushWorkflow'
          print('NOTIFY_003_SOURCE_BOUNDARY=PASS')
          PY

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install committed W05 Expo SDK dependency
        working-directory: workers/W05-social
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Verify migration source and SQLite schema
        run: |
          set -euo pipefail
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          root = Path('workers/W05-social/migrations')
          db = sqlite3.connect(':memory:')
          for name in [
              '20261002_002_social_003_like_v1.sql',
              '20261002_005_social_005_comment_likes_v1.sql',
              '20261008_011_social_closure_v1.sql',
              '20261104_017_notification_push_delivery_v1.sql',
          ]:
              file = root / name
              if not file.is_file():
                  raise SystemExit(f'missing migration: {file}')
              db.executescript(file.read_text())
          tables = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          required_tables = {'social_notifications','social_notification_push_outbox','social_notification_push_deliveries'}
          if not required_tables.issubset(tables):
              raise SystemExit(f'missing tables: {sorted(required_tables - tables)}')
          objects = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type IN ('index','trigger')")}
          required_objects = {
              'trg_social_notifications_push_outbox_insert',
              'ix_social_notification_push_outbox_status_created',
              'ix_social_notification_push_deliveries_due',
              'ix_social_notification_push_deliveries_endpoint',
              'uq_social_notification_push_ticket',
          }
          if not required_objects.issubset(objects):
              raise SystemExit(f'missing schema objects: {sorted(required_objects - objects)}')
          db.execute(
              'INSERT INTO social_notifications '
              '(notification_id,recipient_user_id,actor_user_id,notification_type,target_type,target_id,dedupe_key,payload_json,created_at) '
              'VALUES (?,?,?,?,?,?,?,?,?)',
              ('migration-check-1','recipient-1','actor-1','FOLLOW','user','recipient-1','migration-check-key-1','{}','2026-11-04T00:00:00.000Z'),
          )
          outbox = db.execute(
              'SELECT notification_id,recipient_user_id,status FROM social_notification_push_outbox WHERE notification_id = ?',
              ('migration-check-1',),
          ).fetchone()
          assert outbox == ('migration-check-1','recipient-1','PENDING'), outbox
          print('NOTIFY_003_SQLITE_AND_ATOMIC_OUTBOX=PASS')
          PY

      - name: Check remote D1-02 migration ledger and reject unrelated pending migrations
        working-directory: workers/W05-social
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_MIGRATION: ${{ env.EXPECTED_MIGRATION }}
        run: |
          set -euo pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" d1 execute "$EXPECTED_DB_NAME" --remote --json --config wrangler.jsonc --command 'SELECT name FROM d1_migrations ORDER BY name;' > /tmp/notify-003-applied.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.load(open('/tmp/notify-003-applied.json'))
          rows = [r for item in data for r in item.get('results', [])] if isinstance(data, list) else data.get('results', [])
          applied = {str(row.get('name', '')).removesuffix('.sql') for row in rows if isinstance(row, dict) and row.get('name')}
          local = sorted(p.stem for p in Path('migrations').glob('*.sql'))
          target = '20261104_017_notification_push_delivery_v1'
          if target not in local:
              raise SystemExit('NOTIFY-003 migration missing from checked-out source')
          pending = [name for name in local if name not in applied]
          if pending not in ([], [target]):
              raise SystemExit(f'Refusing unrelated pending W05 D1-02 migrations: {pending}')
          print('NOTIFY_003_PENDING_MIGRATIONS=' + repr(pending))
          PY

      - name: Apply NOTIFY-003 to W05 D1-02
        working-directory: workers/W05-social
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes "wrangler@$WRANGLER_VERSION" d1 migrations apply "$EXPECTED_DB_NAME" --remote --config wrangler.jsonc

      - name: Verify live NOTIFY-003 schema and migration ledger
        working-directory: workers/W05-social
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" d1 execute "$EXPECTED_DB_NAME" --remote --json --config wrangler.jsonc --command 'SELECT name FROM sqlite_master WHERE type IN ("table","trigger","index") AND name IN ("social_notification_push_outbox","social_notification_push_deliveries","trg_social_notifications_push_outbox_insert","uq_social_notification_push_ticket") ORDER BY name;' > /tmp/notify-003-schema.json
          npx --yes "wrangler@$WRANGLER_VERSION" d1 execute "$EXPECTED_DB_NAME" --remote --json --config wrangler.jsonc --command "SELECT name FROM d1_migrations WHERE name IN ('20261104_017_notification_push_delivery_v1.sql','20261104_017_notification_push_delivery_v1');" > /tmp/notify-003-ledger.json
          python - <<'PY'
          import json
          def rows(path):
              data = json.load(open(path))
              return [r for item in data for r in item.get('results', [])] if isinstance(data, list) else data.get('results', [])
          names = {str(r.get('name')) for r in rows('/tmp/notify-003-schema.json')}
          required = {'social_notification_push_outbox','social_notification_push_deliveries','trg_social_notifications_push_outbox_insert','uq_social_notification_push_ticket'}
          if not required.issubset(names):
              raise SystemExit(f'remote D1-02 schema incomplete: {sorted(required - names)}')
          if len(rows('/tmp/notify-003-ledger.json')) != 1:
              raise SystemExit('NOTIFY-003 migration ledger entry not confirmed')
          print('NOTIFY_003_REMOTE_SCHEMA_AND_LEDGER=PASS')
          PY

      - name: Upload exact-SHA migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w05-notify-003-d1-02-migration-${{ github.run_id }}
          path: |
            /tmp/notify-003-applied.json
            /tmp/notify-003-schema.json
            /tmp/notify-003-ledger.json
          if-no-files-found: ignore
          retention-days: 30
