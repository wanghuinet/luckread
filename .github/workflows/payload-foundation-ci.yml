name: Payload Foundation CI

on:
  push:
    paths:
      - 'workers/W01-payload/**'
      - 'contracts/payload/**'
      - 'scripts/payload-native-inventory.mjs'
      - 'scripts/payload-contract-reconciliation-check.mjs'
      - 'scripts/payload-implementation-admission-check.mjs'
      - 'scripts/w01-remote-migration-admission.mjs'
      - '.github/workflows/payload-foundation-ci.yml'
  pull_request:
    paths:
      - 'workers/W01-payload/**'
      - 'contracts/payload/**'
      - 'scripts/payload-native-inventory.mjs'
      - 'scripts/payload-contract-reconciliation-check.mjs'
      - 'scripts/payload-implementation-admission-check.mjs'
      - '.github/workflows/payload-foundation-ci.yml'
  workflow_dispatch:

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm 11 for the committed W01 lockfile
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Install W01 dependencies from committed lockfile
        working-directory: workers/W01-payload
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck W01
        working-directory: workers/W01-payload
        run: pnpm exec tsc --noEmit

      - name: Security unit tests
        working-directory: workers/W01-payload
        run: pnpm exec vitest run --passWithNoTests --config ./vitest.config.mts

      - name: W01 lint
        working-directory: workers/W01-payload
        run: pnpm run lint

      - name: W01 production build
        working-directory: workers/W01-payload
        run: pnpm run build


      - name: Verify remote migration admission state
        working-directory: workers/W01-payload
        run: node ../../scripts/w01-remote-migration-admission.mjs --check-state

      - name: Generate local-only username redirect migration candidate
        if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.number == 1481) || (github.event_name == 'push' && github.ref == 'refs/heads/feature/unified-username-301-redirects') }}
        working-directory: workers/W01-payload
        env:
          NODE_ENV: development
          PAYLOAD_SECRET: migration-generation-only
          CI: "true"
        run: |
          set -euo pipefail
          artifact_dir="../../artifacts/evidence/w01-username-redirect-migration-generation"
          mkdir -p "$artifact_dir"
          find src/migrations -maxdepth 1 -type f -printf '%f\n' | sort > "$artifact_dir/before-files.txt"

          # Reconcile the historical Payload snapshot with exact, committed manual
          # migration evidence. Drizzle must not interpret auth_session_state as a
          # candidate rename to redirects or repeat existing users/media DDL.
          latest_snapshot="$(find src/migrations -maxdepth 1 -type f -name '*.json' | sort | tail -n 1)"
          test "$latest_snapshot" = "src/migrations/20260928_104842_MIG_PAYLOAD_3902_NATIVE_SCHEMA_V1.json"
          cp "$latest_snapshot" "$RUNNER_TEMP/w01-username-redirect-baseline.snapshot.json"
          restore_snapshot() {
            cp "$RUNNER_TEMP/w01-username-redirect-baseline.snapshot.json" "$latest_snapshot"
          }
          trap restore_snapshot EXIT
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const path = 'src/migrations/20260928_104842_MIG_PAYLOAD_3902_NATIVE_SCHEMA_V1.json'
          const snapshot = JSON.parse(readFileSync(path, 'utf8'))
          const readMigration = (name) => readFileSync('src/migrations/' + name, 'utf8')
          const projectionMigration = readMigration('20261006_202000_MIG_BETTER_AUTH_PROFILE_PROJECTION_V1.ts')
          const mediaOwnerMigration = readMigration('20261002_120000_media_owner.ts')
          const mediaIdempotencyMigration = readMigration('20261022_120000_MIG_MEDIA_UPLOAD_IDEMPOTENCY_V1.ts')
          const authSessionMigration = readMigration('20260921_003203_MIG_AUTH_002_SESSION_V1.ts')
          const provenExistingDDL = [
            [projectionMigration, ['ALTER TABLE', 'identity_id', 'users_identity_id_idx']],
            [mediaOwnerMigration, ['ALTER TABLE', 'owner_user_id']],
            [mediaIdempotencyMigration, ['ALTER TABLE', 'upload_idempotency_key', 'upload_fingerprint', 'media_upload_idempotency_key_idx']],
            [authSessionMigration, ['CREATE TABLE', 'auth_session_state', 'auth_session_state_user_id_idx']],
          ]
          for (const [source, identifiers] of provenExistingDDL) {
            if (identifiers.some((identifier) => !source.includes(identifier))) {
              throw new Error('Committed migration source is missing expected prior schema evidence: ' + identifiers.join(','))
            }
          }
          const users = snapshot.tables?.users
          const media = snapshot.tables?.media
          if (!users || !media || !snapshot.tables?.auth_session_state) {
            throw new Error('Unexpected baseline snapshot shape; refusing reconciliation')
          }
          const column = (name) => ({
            name, type: 'text', primaryKey: false, notNull: false, autoincrement: false,
          })
          const index = (name, columns) => ({ name, columns, isUnique: true })
          if (users.columns.identity_id || media.columns.owner_user_id ||
              media.columns.upload_idempotency_key || media.columns.upload_fingerprint ||
              users.indexes.users_identity_id_idx || media.indexes.media_upload_idempotency_key_idx) {
            throw new Error('Baseline snapshot already contains one or more manually migrated fields')
          }
          users.columns.identity_id = column('identity_id')
          media.columns.owner_user_id = column('owner_user_id')
          media.columns.upload_idempotency_key = column('upload_idempotency_key')
          media.columns.upload_fingerprint = column('upload_fingerprint')
          users.indexes.users_identity_id_idx = index('users_identity_id_idx', ['identity_id'])
          media.indexes.media_upload_idempotency_key_idx = index('media_upload_idempotency_key_idx', ['upload_idempotency_key'])

          // This is a historical W01 session-extension table created by an
          // already-committed migration. It is no longer in the current Payload
          // config, but the migration history owns it; preserve it physically and
          // exclude it from this new collection's schema diff.
          delete snapshot.tables.auth_session_state
          writeFileSync(path, JSON.stringify(snapshot, null, 2) + '\n')
          writeFileSync('../../artifacts/evidence/w01-username-redirect-migration-generation/baseline-reconciliation.json', JSON.stringify({
            baselineSnapshot: path,
            retainedHistoricalTable: 'auth_session_state',
            historicalTableMigration: '20260921_003203_MIG_AUTH_002_SESSION_V1.ts',
            excludedFromPayloadSchemaDiff: ['auth_session_state'],
            priorMigrationSources: [
              '20260921_003203_MIG_AUTH_002_SESSION_V1.ts',
              '20261006_202000_MIG_BETTER_AUTH_PROFILE_PROJECTION_V1.ts',
              '20261002_120000_media_owner.ts',
              '20261022_120000_MIG_MEDIA_UPLOAD_IDEMPOTENCY_V1.ts',
            ],
            reconciledFields: {
              users: ['identity_id'],
              media: ['owner_user_id', 'upload_idempotency_key', 'upload_fingerprint'],
            },
            reconciledIndexes: ['users_identity_id_idx', 'media_upload_idempotency_key_idx'],
            productionD1Access: false,
          }, null, 2) + '\n')
          NODE

          echo "Starting local-only Payload migration generation (no migrate command is executed)"
          set +e
          timeout 240s pnpm exec payload migrate:create username_redirects --force-accept-warning --json 2>&1 | tee "$artifact_dir/generation.log"
          generation_status=${PIPESTATUS[0]}
          set -e
          if [ "$generation_status" -ne 0 ]; then
            echo "Payload migration generation failed or exceeded 240 seconds (exit=$generation_status)"
            exit "$generation_status"
          fi
          find src/migrations -maxdepth 1 -type f -printf '%f\n' | sort > "$artifact_dir/after-files.txt"
          comm -13 "$artifact_dir/before-files.txt" "$artifact_dir/after-files.txt" > "$artifact_dir/generated-files.txt"
          if [ ! -s "$artifact_dir/generated-files.txt" ]; then
            echo "Payload did not produce a migration candidate"
            exit 1
          fi
          while IFS= read -r file; do
            cp "src/migrations/$file" "$artifact_dir/$file"
          done < "$artifact_dir/generated-files.txt"

          candidate_ts="$(find "$artifact_dir" -maxdepth 1 -type f -name '*.ts' | head -n 1)"
          test -n "$candidate_ts"
          if grep -Eiq 'DROP TABLE|DROP COLUMN|RENAME TABLE|RENAME COLUMN|auth_session_state|ALTER TABLE .?(users|media)' "$candidate_ts"; then
            echo "Generated migration includes destructive, legacy-table, or duplicate manual-migration DDL"
            cat "$candidate_ts"
            exit 1
          fi
          if ! grep -Eiq 'CREATE TABLE.*redirects' "$candidate_ts"; then
            echo "Generated migration does not create the official redirects collection"
            cat "$candidate_ts"
            exit 1
          fi
          cp src/migrations/index.ts "$artifact_dir/index.ts"
          git status --short -- src/migrations > "$artifact_dir/worktree-status.txt"

      - name: Upload local-only username redirect migration candidate
        if: ${{ always() && ((github.event_name == 'pull_request' && github.event.pull_request.number == 1481) || (github.event_name == 'push' && github.ref == 'refs/heads/feature/unified-username-301-redirects')) }}
        uses: actions/upload-artifact@v4
        with:
          name: w01-username-redirect-migration-candidate-${{ github.run_id }}
          path: artifacts/evidence/w01-username-redirect-migration-generation/
          if-no-files-found: error
          retention-days: 14
      - name: Payload implementation admission gate
        run: node scripts/payload-implementation-admission-check.mjs
