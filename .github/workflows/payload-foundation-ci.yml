name: Payload Foundation CI

on:
  push:
    paths:
      - 'workers/W01-payload/**'
      - 'contracts/payload/**'
      - 'scripts/payload-native-inventory.mjs'
      - 'scripts/payload-contract-reconciliation-check.mjs'
      - 'scripts/payload-implementation-admission-check.mjs'
      - 'scripts/w01-remote-migration-admission.mjs'
      - '.github/workflows/payload-foundation-ci.yml'
  pull_request:
    paths:
      - 'workers/W01-payload/**'
      - 'contracts/payload/**'
      - 'scripts/payload-native-inventory.mjs'
      - 'scripts/payload-contract-reconciliation-check.mjs'
      - 'scripts/payload-implementation-admission-check.mjs'
      - '.github/workflows/payload-foundation-ci.yml'
  workflow_dispatch:

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm 11 for the committed W01 lockfile
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Install W01 dependencies from committed lockfile
        working-directory: workers/W01-payload
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck W01
        working-directory: workers/W01-payload
        run: pnpm exec tsc --noEmit

      - name: Security unit tests
        working-directory: workers/W01-payload
        run: pnpm exec vitest run --passWithNoTests --config ./vitest.config.mts

      - name: W01 lint
        working-directory: workers/W01-payload
        run: pnpm run lint

      - name: W01 production build
        working-directory: workers/W01-payload
        run: pnpm run build


      - name: Verify remote migration admission state
        working-directory: workers/W01-payload
        run: node ../../scripts/w01-remote-migration-admission.mjs --check-state

      - name: Generate local-only username redirect migration candidate
        if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.number == 1481) || (github.event_name == 'push' && github.ref == 'refs/heads/feature/unified-username-301-redirects') }}
        working-directory: workers/W01-payload
        env:
          NODE_ENV: development
          PAYLOAD_SECRET: migration-generation-only
          CI: "true"
        run: |
          set -euo pipefail
          artifact_dir="../../artifacts/evidence/w01-username-redirect-migration-generation"
          mkdir -p "$artifact_dir"
          find src/migrations -maxdepth 1 -type f -printf '%f\n' | sort > "$artifact_dir/before-files.txt"
          echo "Starting local-only Payload migration generation (no migrate command is executed)"
          set +e
          timeout 240s pnpm exec payload migrate:create username_redirects --force-accept-warning --json 2>&1 | tee "$artifact_dir/generation.log"
          generation_status=${PIPESTATUS[0]}
          set -e
          if [ "$generation_status" -ne 0 ]; then
            echo "Payload migration generation failed or exceeded 240 seconds (exit=$generation_status)"
            exit "$generation_status"
          fi
          find src/migrations -maxdepth 1 -type f -printf '%f\n' | sort > "$artifact_dir/after-files.txt"
          comm -13 "$artifact_dir/before-files.txt" "$artifact_dir/after-files.txt" > "$artifact_dir/generated-files.txt"
          if [ ! -s "$artifact_dir/generated-files.txt" ]; then
            echo "Payload did not produce a migration candidate"
            exit 1
          fi
          while IFS= read -r file; do
            cp "src/migrations/$file" "$artifact_dir/$file"
          done < "$artifact_dir/generated-files.txt"
          cp src/migrations/index.ts "$artifact_dir/index.ts"
          git status --short -- src/migrations > "$artifact_dir/worktree-status.txt"

      - name: Upload local-only username redirect migration candidate
        if: ${{ always() && ((github.event_name == 'pull_request' && github.event.pull_request.number == 1481) || (github.event_name == 'push' && github.ref == 'refs/heads/feature/unified-username-301-redirects')) }}
        uses: actions/upload-artifact@v4
        with:
          name: w01-username-redirect-migration-candidate-${{ github.run_id }}
          path: artifacts/evidence/w01-username-redirect-migration-generation/
          if-no-files-found: error
          retention-days: 14
      - name: Payload implementation admission gate
        run: node scripts/payload-implementation-admission-check.mjs
