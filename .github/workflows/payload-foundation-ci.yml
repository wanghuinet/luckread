name: Payload Foundation CI

on:
  push:
    paths:
      - 'workers/W01-payload/**'
      - 'contracts/payload/**'
      - 'scripts/payload-native-inventory.mjs'
      - 'scripts/payload-contract-reconciliation-check.mjs'
      - 'scripts/payload-implementation-admission-check.mjs'
      - 'scripts/w01-remote-migration-admission.mjs'
      - '.github/workflows/payload-foundation-ci.yml'
  pull_request:
    paths:
      - 'workers/W01-payload/**'
      - 'contracts/payload/**'
      - 'scripts/payload-native-inventory.mjs'
      - 'scripts/payload-contract-reconciliation-check.mjs'
      - 'scripts/payload-implementation-admission-check.mjs'
      - '.github/workflows/payload-foundation-ci.yml'
  workflow_dispatch:

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install W01 dependencies from committed lockfile
        working-directory: workers/W01-payload
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck W01
        working-directory: workers/W01-payload
        run: pnpm exec tsc --noEmit

      - name: Security unit tests
        working-directory: workers/W01-payload
        run: pnpm exec vitest run --passWithNoTests --config ./vitest.config.mts

      - name: W01 lint
        working-directory: workers/W01-payload
        run: pnpm run lint

      - name: W01 production build
        working-directory: workers/W01-payload
        run: pnpm run build


      - name: Verify remote migration admission state
        working-directory: workers/W01-payload
        run: node ../../scripts/w01-remote-migration-admission.mjs --check-state

      - name: Payload implementation admission gate
        run: node scripts/payload-implementation-admission-check.mjs
