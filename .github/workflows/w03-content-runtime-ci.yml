name: W03 Content Runtime CI

on:
  pull_request:
    paths:
      - "workers/W03-content/**"
      - "workers/W03-content/package.json"
      - "scripts/neon/assert-production-cutover-authorized.*"
      - "contracts/database/neon-five-domain-schema-bootstrap.v1.json"
      - "contracts/database/neon-five-database-remote-schema-evidence.v1.json"
      - ".github/workflows/w03-content-runtime-ci.yml"
      - ".github/workflows/neon-runtime-cutover-w03.yml"
      - ".github/workflows/w03-content-runtime-deploy.yml"
      - "contracts/persistence/CONTENT-ARTICLE-d1-02-persistence.v1.json"
      - "contracts/transport/W01-W03-content-http-binding.v1.json"
      - "contracts/transport/W05-W03-owned-post-context-http-binding.v1.json"
      - "contracts/openapi/v1/openapi.yaml"
  push:
    branches: ["main"]
    paths:
      - "workers/W03-content/**"
      - "scripts/neon/assert-production-cutover-authorized.*"
      - "contracts/database/neon-five-domain-schema-bootstrap.v1.json"
      - "contracts/database/neon-five-database-remote-schema-evidence.v1.json"

permissions:
  contents: read

jobs:
  content-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      W03_POSTGRES_TEST_URL: postgresql://postgres:postgres@localhost:5432/luckread_w03_test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: luckread_w03_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d luckread_w03_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify W03 Neon deployment is gated by data import and cutover approval
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const workflows = [
            '.github/workflows/neon-runtime-cutover-w03.yml',
            '.github/workflows/w03-content-runtime-deploy.yml',
          ]
          for (const path of workflows) {
            const source = fs.readFileSync(path, 'utf8')
            if (!source.includes('scripts/neon/assert-production-cutover-authorized.mjs D1-02')) {
              throw new Error(path + ' is missing the shared D1-02 data-import and cutover admission guard')
            }
          }
          console.log('W03_NEON_DEPLOYMENT_DATA_ADMISSION=PASS')
          NODE

      - name: Install locked dependencies
        run: npm ci

      - name: Test shared Neon production cutover admission guard
        run: node --test scripts/neon/assert-production-cutover-authorized.test.mjs

      - name: Verify W03 migrations and nullable media warning constraints
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          root = Path('workers/W03-content/migrations')
          database = sqlite3.connect(':memory:')
          migrations = sorted(root.glob('*.sql'))
          if not migrations:
              raise SystemExit('W03 migrations were not found')
          for migration in migrations:
              database.executescript(migration.read_text())
          expected_tables = {
              'contents': 'media_warning',
              'content_revisions': 'media_warning',
          }
          for table, column in expected_tables.items():
              names = {row[1] for row in database.execute(f'PRAGMA table_info("{table}")')}
              if column not in names:
                  raise SystemExit(f'{table}.{column} was not added by W03 migrations')
              sql = database.execute(
                  "SELECT sql FROM sqlite_master WHERE type='table' AND name=?",
                  (table,),
              ).fetchone()[0]
              for category in ["'NUDITY'", "'VIOLENCE'", "'SENSITIVE'"]:
                  if category not in sql:
                      raise SystemExit(f'{table} is missing warning constraint for {category}')
          print('W03_MEDIA_WARNING_MIGRATION_SQLITE=PASS')
          PY

      - name: Verify W03 migrations and media warning constraints with SQLite
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          migration_dir = Path('workers/W03-content/migrations')
          migrations = sorted(migration_dir.glob('*.sql'))
          if not migrations:
              raise SystemExit('W03 migrations directory is empty')
          database = sqlite3.connect(':memory:')
          for migration in migrations:
              database.executescript(migration.read_text())
          for table in ('contents', 'content_revisions'):
              columns = {row[1] for row in database.execute(f'PRAGMA table_info("{table}")')}
              if 'media_warning' not in columns:
                  raise SystemExit(f'{table}.media_warning is missing')
              table_sql = database.execute(
                  "SELECT sql FROM sqlite_master WHERE type='table' AND name=?",
                  (table,),
              ).fetchone()[0]
              for category in ("'NUDITY'", "'VIOLENCE'", "'SENSITIVE'"):
                  if category not in table_sql:
                      raise SystemExit(f'{table} missing warning check {category}')
          print('W03_MEDIA_WARNING_MIGRATION_SQLITE=PASS')
          PY

      - name: Install W03 PostgreSQL Worker runtime dependency
        working-directory: workers/W03-content
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Bundle W03 Worker with Hyperdrive PostgreSQL runtime dependency
        working-directory: workers/W03-content
        run: npx --yes wrangler@4.166.0 deploy --dry-run --config wrangler.jsonc

      - name: Run W03 content unit tests
        run: npx --yes vitest@3.2.4 run workers/W03-content/src/content-runtime.test.ts workers/W03-content/src/content-create-postgres.test.ts workers/W03-content/src/content-create-postgres.integration.test.ts workers/W03-content/src/content-mutation-postgres.test.ts workers/W03-content/src/content-relationship-mutation-store-postgres.test.ts workers/W03-content/src/creator-contents-read-store-postgres.test.ts workers/W03-content/src/public-content-list-read-store-postgres.test.ts workers/W03-content/src/content-revision-read-store-postgres.test.ts workers/W03-content/src/neon/runtime.test.ts workers/W03-content/src/published-media-reference-read-store.test.ts workers/W03-content/src/published-contents-by-ids-read-store-postgres.test.ts workers/W03-content/src/content-relationships.test.ts workers/W03-content/src/content-snowflake-id.test.ts workers/W03-content/src/publish-preflight.test.ts workers/W03-content/src/content-traffic-guard.test.ts workers/W03-content/src/content-series.test.ts workers/W03-content/src/content-collections.test.ts workers/W03-content/src/content-series-members.test.ts workers/W03-content/src/content-collection-members.test.ts workers/W03-content/src/following-feed.test.ts workers/W03-content/src/following-owner-contents-read-store-postgres.test.ts workers/W03-content/src/post-thread-read-store-postgres.test.ts workers/W03-content/src/content-context-read-store-postgres.test.ts workers/W03-content/src/content-context-read-routes.test.ts workers/W03-content/src/content-collections-create-postgres.test.ts workers/W03-content/src/content-collections-update-postgres.test.ts workers/W03-content/src/content-collections-delete-postgres.test.ts workers/W03-content/src/content-collection-member-attach-postgres.test.ts workers/W03-content/src/content-collection-member-remove-postgres.test.ts workers/W03-content/src/content-collection-member-reorder-postgres.test.ts workers/W03-content/src/content-series-create-postgres.test.ts workers/W03-content/src/content-series-update-postgres.test.ts workers/W03-content/src/content-series-delete-postgres.test.ts workers/W03-content/src/content-series-member-attach-postgres.test.ts workers/W03-content/src/content-series-member-remove-postgres.test.ts workers/W03-content/src/content-series-member-reorder-postgres.test.ts workers/W03-content/src/content-search.test.ts workers/W03-content/src/content-series-read-store-postgres.test.ts workers/W03-content/src/content-collections-read-store-postgres.test.ts workers/W03-content/src/content-members-read-store-postgres.test.ts

      - name: Typecheck W03 content runtime
        run: >
          npx --no-install tsc --noEmit --ignoreConfig --strict --skipLibCheck
          --target ES2022 --module ESNext --moduleResolution Bundler
          --lib ES2022,DOM --types @cloudflare/workers-types,node
          workers/W03-content/src/content-runtime.ts
          workers/W03-content/src/content-runtime.test.ts
          workers/W03-content/src/content-series.ts
          workers/W03-content/src/content-series.test.ts
          workers/W03-content/src/content-collections.ts
          workers/W03-content/src/content-collections.test.ts
          workers/W03-content/src/content-series-members.ts
          workers/W03-content/src/content-series-members.test.ts
          workers/W03-content/src/content-collection-members.ts
          workers/W03-content/src/content-collection-members.test.ts
          workers/W03-content/src/content-relationships.ts
          workers/W03-content/src/content-relationships.test.ts
          workers/W03-content/src/content-traffic-guard.test.ts
          workers/W03-content/src/following-feed.test.ts
          workers/W03-content/src/content-search.test.ts
          workers/W03-content/src/index.ts
          workers/W03-content/src/content-create-store-postgres.ts
          workers/W03-content/src/content-create-postgres.test.ts
