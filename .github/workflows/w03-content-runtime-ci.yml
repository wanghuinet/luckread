name: W03 Content Runtime CI

on:
  pull_request:
    paths:
      - "workers/W03-content/**"
      - ".github/workflows/w03-content-runtime-ci.yml"
      - "contracts/persistence/CONTENT-ARTICLE-d1-02-persistence.v1.json"
      - "contracts/transport/W01-W03-content-http-binding.v1.json"
      - "contracts/transport/W05-W03-owned-post-context-http-binding.v1.json"
      - "contracts/openapi/v1/openapi.yaml"
  push:
    branches: ["main"]
    paths:
      - "workers/W03-content/**"

permissions:
  contents: read

jobs:
  content-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: npm ci

      - name: Verify W03 migrations and nullable media warning constraints
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          root = Path('workers/W03-content/migrations')
          database = sqlite3.connect(':memory:')
          migrations = sorted(root.glob('*.sql'))
          if not migrations:
              raise SystemExit('W03 migrations were not found')
          for migration in migrations:
              database.executescript(migration.read_text())
          expected_tables = {
              'contents': 'media_warning',
              'content_revisions': 'media_warning',
          }
          for table, column in expected_tables.items():
              names = {row[1] for row in database.execute(f'PRAGMA table_info("{table}")')}
              if column not in names:
                  raise SystemExit(f'{table}.{column} was not added by W03 migrations')
              sql = database.execute(
                  "SELECT sql FROM sqlite_master WHERE type='table' AND name=?",
                  (table,),
              ).fetchone()[0]
              for category in ["'NUDITY'", "'VIOLENCE'", "'SENSITIVE'"]:
                  if category not in sql:
                      raise SystemExit(f'{table} is missing warning constraint for {category}')
          print('W03_MEDIA_WARNING_MIGRATION_SQLITE=PASS')
          PY

      - name: Verify W03 migrations and media warning constraints with SQLite
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          migration_dir = Path('workers/W03-content/migrations')
          migrations = sorted(migration_dir.glob('*.sql'))
          if not migrations:
              raise SystemExit('W03 migrations directory is empty')
          database = sqlite3.connect(':memory:')
          for migration in migrations:
              database.executescript(migration.read_text())
          for table in ('contents', 'content_revisions'):
              columns = {row[1] for row in database.execute(f'PRAGMA table_info("{table}")')}
              if 'media_warning' not in columns:
                  raise SystemExit(f'{table}.media_warning is missing')
              table_sql = database.execute(
                  "SELECT sql FROM sqlite_master WHERE type='table' AND name=?",
                  (table,),
              ).fetchone()[0]
              for category in ("'NUDITY'", "'VIOLENCE'", "'SENSITIVE'"):
                  if category not in table_sql:
                      raise SystemExit(f'{table} missing warning check {category}')
          print('W03_MEDIA_WARNING_MIGRATION_SQLITE=PASS')
          PY

      - name: Run W03 content unit tests
        run: npx --yes vitest@3.2.4 run workers/W03-content/src/content-runtime.test.ts workers/W03-content/src/published-media-reference-read-store.test.ts workers/W03-content/src/content-relationships.test.ts workers/W03-content/src/content-snowflake-id.test.ts workers/W03-content/src/publish-preflight.test.ts workers/W03-content/src/d1-traffic-guard.test.ts workers/W03-content/src/following-feed.test.ts workers/W03-content/src/content-search.test.ts

      - name: Typecheck W03 content runtime
        run: >
          npx --no-install tsc --noEmit --strict --skipLibCheck
          --target ES2022 --module ESNext --moduleResolution Bundler
          --lib ES2022,DOM --types @cloudflare/workers-types
          workers/W03-content/src/content-runtime.ts
          workers/W03-content/src/published-media-reference-read-store.ts
          workers/W03-content/src/published-media-reference-read-store-postgres.ts
          workers/W03-content/src/published-media-reference-read-store.test.ts
          workers/W03-content/src/publish-preflight.ts
          workers/W03-content/src/index.ts
