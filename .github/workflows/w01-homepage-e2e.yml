name: W01 Homepage E2E

on:
  push:
    branches:
      - 'feat/homepage-*'
    paths:
      - 'workers/W01-payload/**'
      - '.github/workflows/w01-homepage-e2e.yml'
  pull_request:
    paths:
      - 'workers/W01-payload/**'
      - '.github/workflows/w01-homepage-e2e.yml'
  workflow_dispatch:

jobs:
  homepage-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install W01 dependencies
        working-directory: workers/W01-payload
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Chromium
        working-directory: workers/W01-payload
        run: pnpm exec playwright install --with-deps chromium

      - name: Run homepage E2E
        working-directory: workers/W01-payload
        env:
          NODE_OPTIONS: --no-deprecation
        run: pnpm exec playwright test tests/e2e/homepage.spec.ts --config=playwright.config.ts
