name: LuckRead Android Beta Release APK

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/app-android-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luckread-android-beta-release-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPO_NO_TELEMETRY: "1"
  CI: "1"

jobs:
  android-release-apk:
    name: Build signed standalone Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22.13.1"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.38"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools not found under $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;26.1.10909125"

      - name: Install Expo dependencies
        run: bun install

      - name: Generate one-run beta signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/luckread-beta-signing.jks"
          STORE_PASSWORD="$(openssl rand -hex 24)"
          KEY_PASSWORD="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt -v \
            -storetype JKS \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias luckread-beta \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=LuckRead Beta, OU=QA, O=LuckRead, L=Test, ST=Test, C=US"
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=luckread-beta"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Generate standalone Android project
        run: bunx expo prebuild --platform android --clean --no-install

      - name: Verify Release signing is configured
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'signingConfig signingConfigs.release' android/app/build.gradle
          test -f "$ANDROID_KEYSTORE_PATH"

      - name: Compile standalone Release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Generate APK checksum
        shell: bash
        run: sha256sum android/app/build/outputs/apk/release/app-release.apk > android/app/build/outputs/apk/release/app-release.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: luckread-android-beta-release-apk
          path: |
            app/android/app/build/outputs/apk/release/app-release.apk
            app/android/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14
