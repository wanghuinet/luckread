name: L8 Genesis Bootstrap (Single Protected Environment Approval)
run-name: L8 genesis bootstrap - request PR #${{ inputs.request_pr_number }}

on:
  workflow_dispatch:
    inputs:
      request_pr_number:
        description: "Merged PR number containing docs/change-control/l8-genesis-bootstrap-request.json"
        required: true
        type: number

permissions:
  actions: read
  contents: read
  pull-requests: read
  id-token: write

concurrency:
  group: l8-genesis-bootstrap
  cancel-in-progress: false

jobs:
  protected-main-admission:
    name: Require protected main before any bootstrap gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Reject dispatch outside protected main
        env:
          DISPATCH_REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          if [[ "$DISPATCH_REF" != "refs/heads/main" ]]; then
            echo "::error::L8 genesis bootstrap must be dispatched from refs/heads/main."
            exit 1
          fi
          if [[ "$REF_PROTECTED" != "true" ]]; then
            echo "::error::L8 genesis bootstrap requires GitHub to report main as protected."
            echo "::error::Enable branch protection for main before retrying; no environment approval or production call was attempted."
            exit 1
          fi
          echo "Protected main admission: PASS"

  bootstrap:
    needs: protected-main-admission
    if: github.ref == 'refs/heads/main' && github.ref_protected == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Configure this GitHub Environment with one required reviewer: the sole
    # current repo admin/maintainer, and set prevent_self_review=true. Dispatch
    # must be initiated by a separate authorized collaborator; otherwise remain
    # blocked. W02 reads back and verifies the environment rules.
    environment: l8-genesis-bootstrap
    steps:
      - name: Checkout protected main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enforce AUTH-007 and L8 bootstrap readiness evidence
        run: node scripts/verify-admin-account-bootstrap-readiness.mjs

      - name: Verify readiness and perform the one-time grant through W01/W02
        env:
          REQUEST_PR_NUMBER: ${{ inputs.request_pr_number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/execute-l8-genesis-bootstrap.mjs
