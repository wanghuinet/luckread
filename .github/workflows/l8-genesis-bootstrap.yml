name: L8 Genesis Bootstrap (Single Protected Environment Approval)
run-name: L8 genesis bootstrap - request PR #${{ inputs.request_pr_number }}

on:
  workflow_dispatch:
    inputs:
      request_pr_number:
        description: "Merged PR number containing docs/change-control/l8-genesis-bootstrap-request.json"
        required: true
        type: number

permissions:
  actions: read
  contents: read
  pull-requests: read
  id-token: write

concurrency:
  group: l8-genesis-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Configure this GitHub Environment with exactly one required reviewer:
    # the sole current repo admin/maintainer. The W02 verifier also reads back
    # and checks the environment rules before accepting the OIDC token.
    environment: l8-genesis-bootstrap
    steps:
      - name: Checkout protected main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enforce AUTH-007 and L8 bootstrap readiness evidence
        run: node scripts/verify-admin-account-bootstrap-readiness.mjs

      - name: Verify readiness and perform the one-time grant through W01/W02
        env:
          REQUEST_PR_NUMBER: ${{ inputs.request_pr_number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/execute-l8-genesis-bootstrap.mjs
