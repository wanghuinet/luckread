name: Sync verified native Bun lockfile

on:
  push:
    branches:
      - fix/sync-native-bun-lockfile
    paths:
      - .github/workflows/sync-native-bun-lockfile.yml

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the one-time sync branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Download the lockfile produced by main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verified-bun-lock"
          gh run download 41738461317 \
            --repo "$GITHUB_REPOSITORY" \
            --name luckread-native-bun-lockfile \
            --dir "$RUNNER_TEMP/verified-bun-lock"
          test -s "$RUNNER_TEMP/verified-bun-lock/bun.lockb"
          strings "$RUNNER_TEMP/verified-bun-lock/bun.lockb" | grep -q 'expo-camera'
          strings "$RUNNER_TEMP/verified-bun-lock/bun.lockb" | grep -q 'expo-image-manipulator'
          cp "$RUNNER_TEMP/verified-bun-lock/bun.lockb" app/bun.lockb
          sha256sum app/bun.lockb

      - name: Commit only the generated lockfile and remove this temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sync-native-bun-lockfile.yml
          git add app/bun.lockb
          git diff --cached --check
          git commit -m "fix(native): sync Bun lockfile with Expo SDK 58 media dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Open a focused pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$GITHUB_REF_NAME" \
            --title "fix(native): sync Bun lockfile for camera and image uploads" \
            --body "## Scope\n\nUpdates only app/bun.lockb using the lockfile generated by the successful dependency-install step in main CI run 41738461317 for commit eb0b7b0d2919595ee2f297b86eaec6334da8e911. The temporary workflow is removed in the same commit.\n\n## Validation\n\nThe artifact is checked to contain both expo-camera and expo-image-manipulator before it is committed. Standard APP CI will validate the resulting PR."
