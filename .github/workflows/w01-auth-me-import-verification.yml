name: W01 Auth Me Import Verification

on:
  push:
    branches:
      - 'fix/w01-auth-me-imports-*'
    paths:
      - 'workers/luck02-content/src/app/(payload)/api/users/me/route.ts'
      - 'workers/luck02-content/tests/int/users-me-route-import.int.spec.ts'
      - '.github/workflows/w01-auth-me-import-verification.yml'
  pull_request:
    paths:
      - 'workers/luck02-content/src/app/(payload)/api/users/me/route.ts'
      - 'workers/luck02-content/tests/int/users-me-route-import.int.spec.ts'
      - '.github/workflows/w01-auth-me-import-verification.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install W01 dependencies
        working-directory: workers/luck02-content
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck W01
        working-directory: workers/luck02-content
        env:
          PAYLOAD_SECRET: luckread-auth-me-e2e-secret
        run: pnpm exec tsc --noEmit
      - name: Verify auth me route imports
        working-directory: workers/luck02-content
        run: pnpm exec vitest run tests/int/users-me-route-import.int.spec.ts --config ./vitest.config.mts
      - name: Production build
        working-directory: workers/luck02-content
        env:
          PAYLOAD_SECRET: luckread-auth-me-e2e-secret
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm run build