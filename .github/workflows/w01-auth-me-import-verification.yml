name: W01 Better Auth Boundary Verification

on:
  push:
    branches:
      - main
    paths:
      - 'workers/W01-payload/src/app/(payload)/api/users/me/route.ts'
      - 'workers/W01-payload/src/app/auth/**'
      - 'workers/W01-payload/src/app/api/v1/auth/**'
      - 'workers/W01-payload/tests/int/users-me-route-import.int.spec.ts'
      - 'workers/W01-payload/tests/int/auth-better-auth-boundary.int.spec.ts'
      - 'workers/W01-payload/tests/int/login-frontend-v1.int.spec.ts'
      - 'contracts/openapi/v1/openapi.yaml'
      - 'contracts/api/auth-operation-policy.v1.json'
      - 'contracts/dto/auth-dto-contract.v1.json'
      - 'contracts/api/api-inventory.v1.json'
      - '.github/workflows/w01-auth-me-import-verification.yml'
  pull_request:
    paths:
      - 'workers/W01-payload/src/app/(payload)/api/users/me/route.ts'
      - 'workers/W01-payload/src/app/auth/**'
      - 'workers/W01-payload/src/app/api/v1/auth/**'
      - 'workers/W01-payload/tests/int/users-me-route-import.int.spec.ts'
      - 'workers/W01-payload/tests/int/auth-better-auth-boundary.int.spec.ts'
      - 'workers/W01-payload/tests/int/login-frontend-v1.int.spec.ts'
      - 'contracts/openapi/v1/openapi.yaml'
      - 'contracts/api/auth-operation-policy.v1.json'
      - 'contracts/dto/auth-dto-contract.v1.json'
      - 'contracts/api/api-inventory.v1.json'
      - '.github/workflows/w01-auth-me-import-verification.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install W01 dependencies
        working-directory: workers/W01-payload
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck W01
        working-directory: workers/W01-payload
        env:
          PAYLOAD_SECRET: luckread-auth-me-e2e-secret
        run: pnpm exec tsc --noEmit
      - name: Verify W02 Better Auth boundary
        working-directory: workers/W01-payload
        run: pnpm exec vitest run tests/int/users-me-route-import.int.spec.ts tests/int/auth-better-auth-boundary.int.spec.ts tests/int/login-frontend-v1.int.spec.ts --config ./vitest.config.mts
      - name: Production build
        working-directory: workers/W01-payload
        env:
          PAYLOAD_SECRET: luckread-auth-me-e2e-secret
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm run build