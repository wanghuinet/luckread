name: AUTH-013 W04 Projection Queue Provision

on:
  push:
    branches:
      - main
    paths:
      - "artifacts/mapping-0/w04-projection-queue-provisioning-authorized-2026-09-29.json"

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate provisioning authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -f artifacts/mapping-0/w04-projection-queue-provisioning-authorized-2026-09-29.json
          node - <<'NODE'
          const fs = require('fs')
          const a = JSON.parse(fs.readFileSync('artifacts/mapping-0/w04-projection-queue-provisioning-authorized-2026-09-29.json','utf8'))
          if (a.status !== 'AUTHORIZED_FOR_CONTROLLED_PROVISIONING') throw new Error('Invalid status')
          if (a.queue !== 'luckread-auth013-account-state-projection') throw new Error('Queue mismatch')
          if (a.dlq !== 'luckread-auth013-account-state-projection-dlq') throw new Error('DLQ mismatch')
          if (a.consumerWorker !== 'luckread-w04') throw new Error('Consumer mismatch')
          console.log(JSON.stringify(a,null,2))
          NODE

      - name: Inspect and provision queue resources idempotently
        shell: bash
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_TOKEN"
          QUEUE="luckread-auth013-account-state-projection"
          DLQ="luckread-auth013-account-state-projection-dlq"
          npx --yes wrangler@4.116.0 queues list > /tmp/queues-before.txt
          if grep -Fqx "$QUEUE" /tmp/queues-before.txt; then
            echo "VERIFY_PRESENT $QUEUE"
            queue_action="preexisting"
          else
            echo "CREATE $QUEUE"
            npx --yes wrangler@4.116.0 queues create "$QUEUE"
            queue_action="created"
          fi
          if grep -Fqx "$DLQ" /tmp/queues-before.txt; then
            echo "VERIFY_PRESENT $DLQ"
            dlq_action="preexisting"
          else
            echo "CREATE $DLQ"
            npx --yes wrangler@4.116.0 queues create "$DLQ"
            dlq_action="created"
          fi
          npx --yes wrangler@4.116.0 queues list > /tmp/queues-after.txt
          grep -Fq "$QUEUE" /tmp/queues-after.txt
          grep -Fq "$DLQ" /tmp/queues-after.txt
          node - <<'NODE'
          const fs=require('fs')
          fs.writeFileSync(
            'w04-projection-queue-provisioning-result.json',
            JSON.stringify({
              schemaVersion:1,
              queue:'luckread-auth013-account-state-projection',
              dlq:'luckread-auth013-account-state-projection-dlq',
              consumerWorker:'luckread-w04',
              queueAction:process.env.queue_action,
              dlqAction:process.env.dlq_action,
              verified:true
            },null,2)+'\n'
          )
          NODE
        env:
          queue_action: created
          dlq_action: created

      - name: Upload queue provisioning evidence
        uses: actions/upload-artifact@v4
        with:
          name: auth-013-w04-projection-queue-provisioning-evidence
          path: w04-projection-queue-provisioning-result.json
