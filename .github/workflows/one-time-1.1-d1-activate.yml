name: one-time 1.1 D1 activate

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type ACTIVATE_1_1_D1 to activate Social D1-03 and Commerce/Governance D1-04
        required: true
        type: choice
        options:
          - CANCEL
          - ACTIVATE_1_1_D1
        default: CANCEL

permissions:
  contents: write

env:
  WRANGLER_VERSION: "4.116.0"
  SOCIAL_DB: "secondary"
  COMMERCE_DB: "unimportant"

jobs:
  activate:
    if: ${{ inputs.confirm == 'ACTIVATE_1_1_D1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current six-worker branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install repository dependencies
        run: npm ci

      - name: Verify target data before activation
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          compare() {
            local db="$1"
            local table="$2"
            local output
            output="$(npx --yes wrangler@${WRANGLER_VERSION} d1 execute "$db" --remote --json --command "SELECT COUNT(*) AS count FROM \"$table\";")"
            node - "$output" "$db" "$table" <<'NODE'
          const raw = process.argv[2]
          const db = process.argv[3]
          const table = process.argv[4]
          const r = JSON.parse(raw)
          const count = Number(r?.[0]?.results?.[0]?.count ?? -1)
          if (count < 0) throw new Error(`Unable to read ${db}.${table}`)
          console.log(`${db}.${table}=${count}`)
          NODE
          }

          for table in social_follow_relationships interaction_likes social_comments interaction_favorites social_share_links social_user_interactions; do compare "$SOCIAL_DB" "$table"; done
          for table in membership_subscriptions audit_events moderation_cases moderation_decisions moderation_decision_idempotency moderation_txn_guard moderation_enforcement_outbox moderation_reports moderation_report_idempotency; do compare "$COMMERCE_DB" "$table"; done

      - name: Switch Social and Commerce/Governance configs to new D1s
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          social = Path('workers/luck03-social/wrangler.jsonc')
          s = json.loads(social.read_text())
          s['d1_databases'] = [{
            'binding': 'DB',
            'database_id': 'bda1d247-a371-4244-91ae-aef96034db7f',
            'database_name': 'secondary',
          }]
          s['vars'] = {'LUCKREAD_D1_MODE': 'new'}
          social.write_text(json.dumps(s, indent=2) + '\n')

          commerce = Path('workers/luck04-commerce/wrangler.jsonc')
          c = json.loads(commerce.read_text())
          c['d1_databases'] = [{
            'binding': 'D1_04_TARGET',
            'database_name': 'unimportant',
            'database_id': '9bfb89a5-fbb5-45b1-a2ee-eab674b0d736',
          }]
          c['vars'] = {'LUCKREAD_D1_MODE': 'new'}
          commerce.write_text(json.dumps(c, indent=2) + '\n')
          PY

      - name: Typecheck cutover Workers
        run: |
          set -euo pipefail
          npx tsc --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --lib ES2022,DOM --types @cloudflare/workers-types workers/luck03-social/src/index.ts
          npx tsc --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --lib ES2022,DOM --types @cloudflare/workers-types workers/luck04-commerce/src/index.ts workers/luck04-commerce/src/commerce/index.ts workers/luck04-commerce/src/governance/index.ts

      - name: Deploy Social with D1-03
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --config workers/luck03-social/wrangler.jsonc

      - name: Deploy Commerce Governance with D1-04
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --config workers/luck04-commerce/wrangler.jsonc

      - name: Persist activated configuration to branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workers/luck03-social/wrangler.jsonc workers/luck04-commerce/wrangler.jsonc
          git commit -m 'refactor(1.1): activate final Social and Commerce D1 bindings [skip ci]'
          git push origin "HEAD:${{ github.ref_name }}"
