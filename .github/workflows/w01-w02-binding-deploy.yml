name: W01 W02 Auth Binding Deploy

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit containing both W01 and W02 implementations
        required: true
        type: string
      confirm:
        description: Type DEPLOY_BINDING to permit W02 and W01 application deployment
        required: true
        type: string
        default: DEPLOY_BINDING
      confirm_creator:
        description: Type DEPLOY_W08_CREATOR only when source_sha includes W08 Creator qualification
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirm == 'DEPLOY_BINDING' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Gate optional W08 Creator deployment before any production mutation
        env:
          CONFIRM_CREATOR: ${{ inputs.confirm_creator }}
        run: |
          set -euo pipefail
          if [ -f workers/W08-creator/wrangler.jsonc ]; then
            if [ "$CONFIRM_CREATOR" != "DEPLOY_W08_CREATOR" ]; then
              echo "This source includes W08 Creator. Set confirm_creator=DEPLOY_W08_CREATOR to enable the W08 migration/deploy; no production changes have run."
              exit 1
            fi
            node --input-type=module - <<'NODE'
            import fs from 'node:fs'
            const w01 = JSON.parse(fs.readFileSync('workers/W01-payload/wrangler.jsonc', 'utf8'))
            const w08 = JSON.parse(fs.readFileSync('workers/W08-creator/wrangler.jsonc', 'utf8'))
            const binding = (w08.d1_databases || []).find((x) => x.binding === 'D1_01')
            const ingress = (w01.services || []).find((x) => x.binding === 'W08_CREATOR')
            if (w08.name !== 'luckread-w08-creator') throw new Error('W08 worker identity mismatch')
            if (!binding || binding.database_name !== 'luckread' || binding.database_id !== '2f80471e-3756-49f9-8db1-7707a433ad64') throw new Error('W08 must reuse existing D1-01')
            if (!ingress || ingress.service !== 'luckread-w08-creator') throw new Error('W01 W08_CREATOR binding mismatch')
            if (!fs.existsSync('workers/W08-creator/migrations/0001_creator_authorization.sql')) throw new Error('W08 migration missing')
            console.log('W08_D1_01_REUSE=PASS')
            console.log('W01_W08_BINDING=PASS')
            NODE
          elif [ -n "$CONFIRM_CREATOR" ]; then
            echo "confirm_creator was supplied, but source_sha does not contain W08 Creator files."
            exit 1
          else
            echo "Source SHA has no W08 Creator Worker; creator migration/deploy skipped."
          fi

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install root toolchain for creator preflight
        if: ${{ inputs.confirm_creator == 'DEPLOY_W08_CREATOR' }}
        run: npm ci

      - name: Run creator authorization runtime and UI contract tests before production changes
        if: ${{ inputs.confirm_creator == 'DEPLOY_W08_CREATOR' }}
        run: npx --no-install vitest run workers/W02-identity/src/authz/role-assignment-command.test.ts workers/W08-creator/src/policy.test.ts workers/W08-creator/src/index.runtime.test.ts workers/W01-payload/tests/int/creator-application-page.int.spec.ts

      - name: Typecheck W08 Creator Worker before production changes
        if: ${{ inputs.confirm_creator == 'DEPLOY_W08_CREATOR' }}
        run: npx --no-install tsc --noEmit -p workers/W08-creator/tsconfig.json

      - name: Install and typecheck W02 creator grant path before production changes
        if: ${{ inputs.confirm_creator == 'DEPLOY_W08_CREATOR' }}
        working-directory: workers/W02-identity
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node --input-type=module -e "import('better-auth').then(() => console.log('better-auth runtime import: OK'))"
          npx --no-install tsc --noEmit -p tsconfig.json

      - name: Validate post-deploy session E2E harness before production changes
        run: node --check scripts/auth-session-live-e2e.mjs

      - name: Require verified QA credentials before production deployment
        env:
          LUCKREAD_APP_AUTH_SMOKE_EMAIL: ${{ secrets.LUCKREAD_APP_AUTH_SMOKE_EMAIL }}
          LUCKREAD_APP_AUTH_SMOKE_PASSWORD: ${{ secrets.LUCKREAD_APP_AUTH_SMOKE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$LUCKREAD_APP_AUTH_SMOKE_EMAIL" ] || [ -z "$LUCKREAD_APP_AUTH_SMOKE_PASSWORD" ]; then
            echo "Configure LUCKREAD_APP_AUTH_SMOKE_EMAIL and LUCKREAD_APP_AUTH_SMOKE_PASSWORD repository Actions secrets before deploying; the post-deploy login/session acceptance is mandatory."
            exit 1
          fi
          echo "Verified QA credential secret names are present; values were not printed."

      - name: Setup pnpm 11
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.0
          run_install: false

      - name: Install locked W01 dependencies
        working-directory: workers/W01-payload
        run: pnpm install --frozen-lockfile

      - name: Typecheck W01 API and creator routes before production changes
        if: ${{ inputs.confirm_creator == 'DEPLOY_W08_CREATOR' }}
        working-directory: workers/W01-payload
        run: pnpm exec tsc --noEmit

      - name: Verify W01 W02_AUTH binding
        working-directory: workers/W01-payload
        run: |
          node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')); const b=(c.services||[]).find(x=>x.binding==='W02_AUTH'); if(!b || b.service!=='luckread-w02') throw new Error('W02_AUTH binding mismatch'); console.log(JSON.stringify(b));"

      - name: Verify W01 traffic guard bindings
        working-directory: workers/W01-payload
        run: |
          node - <<'NODE'
          const fs=require('fs')
          const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'))
          const required=['PUBLIC_ORIGIN_GLOBAL_LIMITER','PUBLIC_READ_LIMITER','AUTH_ORIGIN_GLOBAL_LIMITER','AUTH_REGISTER_LIMITER','AUTH_LOGIN_LIMITER','AUTH_REFRESH_LIMITER']
          const names=new Set((c.ratelimits||[]).map(x=>x.name))
          for(const name of required) if(!names.has(name)) throw new Error('missing rate limiter: '+name)
          console.log(JSON.stringify({rateLimitBindings:[...names].sort()}))
          NODE

      - name: Ensure W01 PAYLOAD_SECRET runtime secret
        working-directory: workers/W01-payload
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ../../artifacts/mapping-0
          secret_list="$(npx --yes wrangler@4.116.0 secret list --name luckread-w01-payload --format json)"
          has_payload_secret="$(printf '%s' "$secret_list" | node --input-type=module -e 'let data=""; process.stdin.on("data", c => data += c); process.stdin.on("end", () => { const parsed=JSON.parse(data); const names=new Set(Array.isArray(parsed) ? parsed.map(item => item?.name) : []); process.stdout.write(names.has("PAYLOAD_SECRET") ? "true" : "false"); })')"
          if [ "$has_payload_secret" != "true" ]; then
            openssl rand -hex 32 | npx --yes wrangler@4.116.0 secret put PAYLOAD_SECRET --name luckread-w01-payload >/dev/null
            action="generated_and_put"
          else
            action="already_present"
          fi
          verify_list="$(npx --yes wrangler@4.116.0 secret list --name luckread-w01-payload --format json)"
          verified="$(printf '%s' "$verify_list" | node --input-type=module -e 'let data=""; process.stdin.on("data", c => data += c); process.stdin.on("end", () => { const parsed=JSON.parse(data); const names=new Set(Array.isArray(parsed) ? parsed.map(item => item?.name) : []); process.stdout.write(names.has("PAYLOAD_SECRET") ? "true" : "false"); })')"
          test "$verified" = "true"
          ACTION="$action" node -e "const fs=require('fs'); fs.writeFileSync('../../artifacts/mapping-0/w01-payload-secret-provenance.json', JSON.stringify({worker:'luckread-w01-payload',secretName:'PAYLOAD_SECRET',action:process.env.ACTION,verified:true,secretValueExposed:false}, null, 2)+'\\n')"
          cat ../../artifacts/mapping-0/w01-payload-secret-provenance.json

      - name: Build W01 application without database migration
        working-directory: workers/W01-payload
        run: pnpm exec opennextjs-cloudflare build

      - name: Verify W02 migration artifacts are committed
        run: |
          node scripts/generate-role-assignment-migration.mjs
          node scripts/generate-role-version-migration.mjs
          git diff --exit-code -- workers/W02-identity/migrations/0001_role_assignments.sql
          git diff --exit-code -- workers/W02-identity/migrations/0003_role_authorization_versions.sql

      - name: Apply W08 additive migration on existing D1-01
        if: ${{ inputs.confirm_creator == 'DEPLOY_W08_CREATOR' }}
        working-directory: workers/W08-creator
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.116.0 d1 migrations apply "luckread" --remote --config wrangler.jsonc

      - name: Deploy W02 first with pinned Wrangler
        working-directory: workers/W02-identity
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          mkdir -p ../../artifacts/mapping-0
          set -o pipefail
          npx --yes wrangler@4.116.0 deploy --config wrangler.jsonc 2>&1 | tee ../../artifacts/mapping-0/w02-email-auth-deploy.log

      - name: Deploy W08 Creator Worker
        if: ${{ inputs.confirm_creator == 'DEPLOY_W08_CREATOR' }}
        working-directory: workers/W08-creator
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          mkdir -p ../../artifacts/mapping-0
          set -o pipefail
          npx --yes wrangler@4.116.0 deploy --config wrangler.jsonc 2>&1 | tee ../../artifacts/mapping-0/w08-creator-deploy.log

      - name: Deploy W01 application with Service Binding
        working-directory: workers/W01-payload
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          mkdir -p ../../artifacts/mapping-0
          set -o pipefail
          npx --yes wrangler@4.116.0 deploy --config wrangler.jsonc 2>&1 | tee ../../artifacts/mapping-0/w01-w02-binding-deploy.log

      - name: Write deployment provenance
        env:
          CONFIRM_CREATOR: ${{ inputs.confirm_creator }}
        run: |
          workers="luckread-w02,luckread-w01-payload"
          deployment_order="W02 then W01"
          database_mutation=false
          creator_migration="not_applied"
          if [ "$CONFIRM_CREATOR" = "DEPLOY_W08_CREATOR" ]; then
            workers="luckread-w02,luckread-w08-creator,luckread-w01-payload"
            deployment_order="W08 additive migration, W02 then W08 then W01"
            database_mutation=true
            creator_migration="workers/W08-creator/migrations/0001_creator_authorization.sql"
          fi
          cat > artifacts/mapping-0/w01-w02-binding-deploy-provenance.txt <<EOF
          workflow=W01 W02 Auth Binding Deploy
          source_sha=${{ inputs.source_sha }}
          confirmation=DEPLOY_BINDING
          creator_confirmation=${CONFIRM_CREATOR:-not_requested}
          workers=$workers
          deployment_order=$deployment_order
          binding=W02_AUTH
          creator_binding=W08_CREATOR
          target=luckread-w02
          database_mutation=$database_mutation
          creator_migration=$creator_migration
          new_worker=false
          new_database=false
          EOF
          cat artifacts/mapping-0/w01-w02-binding-deploy-provenance.txt

      - name: Upload deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: w01-w02-binding-deployment-${{ inputs.source_sha }}
          path: |
            artifacts/mapping-0/w02-email-auth-deploy.log
            artifacts/mapping-0/w08-creator-deploy.log
            artifacts/mapping-0/w01-w02-binding-deploy.log
            artifacts/mapping-0/w01-w02-binding-deploy-provenance.txt

      - name: Verify real APP login and session behavior after deployment
        env:
          LUCKREAD_API_BASE_URL: https://luckread.com
          LUCKREAD_SOURCE_SHA: ${{ inputs.source_sha }}
          LUCKREAD_APP_AUTH_SMOKE_EMAIL: ${{ secrets.LUCKREAD_APP_AUTH_SMOKE_EMAIL }}
          LUCKREAD_APP_AUTH_SMOKE_PASSWORD: ${{ secrets.LUCKREAD_APP_AUTH_SMOKE_PASSWORD }}
        run: node scripts/auth-session-live-e2e.mjs

      - name: Upload sanitized APP session acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-auth-session-live-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/api-auth-session-live-e2e/*.json
          if-no-files-found: warn
          retention-days: 30
