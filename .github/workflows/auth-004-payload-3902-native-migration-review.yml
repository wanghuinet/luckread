name: AUTH-004 Payload 3.90.2 Native Migration Review

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/auth-004-payload-3902-native-migration-review.yml"
      - "docs/change-control/CC-AUTH-004-PAYLOAD-VERSION-ALIGNMENT-2026-09-28.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false
      - name: Install W01 dependencies
        working-directory: workers/W01-payload
        run: pnpm install --frozen-lockfile
      - name: Generate AUTH-004 native additive migration
        working-directory: workers/W01-payload
        env:
          NODE_ENV: development
          PAYLOAD_SECRET: ignore
        run: pnpm exec payload migrate:create MIG-PAYLOAD-3902-NATIVE-SCHEMA-V1 --skip-empty
      - name: Review generated delta against authoritative baseline snapshot
        working-directory: workers/W01-payload
        shell: bash
        run: |
          set +e
          ts=$(find src/migrations -maxdepth 1 -type f -name '*MIG_PAYLOAD_3902_NATIVE_SCHEMA_V1.ts' | head -n 1)
          json=$(find src/migrations -maxdepth 1 -type f -name '*MIG_PAYLOAD_3902_NATIVE_SCHEMA_V1.json' | head -n 1)
          review=0
          [ -n "$ts" ] || review=1
          [ -n "$json" ] || review=1
          printf '%s\n' "=== generated SQL ==="
          [ -n "$ts" ] && sed -n '1,240p' "$ts" || true
          printf '%s\n' "=== schema diff ==="
          node - "$json" <<'NODE'
          const fs = require('node:fs')
          const path = process.argv[2]
          const baseline = JSON.parse(fs.readFileSync('src/migrations/20250929_111647.json', 'utf8'))
          const generated = path ? JSON.parse(fs.readFileSync(path, 'utf8')) : {}
          const stable = (v) => JSON.parse(JSON.stringify(v))
          const tables = { baseline: Object.keys(baseline.tables || {}).sort(), generated: Object.keys(generated.tables || {}).sort() }
          const userBase = Object.keys(baseline.tables?.users?.columns || {}).sort()
          const userGen = Object.keys(generated.tables?.users?.columns || {}).sort()
          const added = userGen.filter((name) => !userBase.includes(name))
          const removed = userBase.filter((name) => !userGen.includes(name))
          const baseCopy = stable(baseline)
          const genCopy = stable(generated)
          if (baseCopy.tables?.users?.columns?.reset_password_requested_at) delete baseCopy.tables.users.columns.reset_password_requested_at
          if (genCopy.tables?.users?.columns?.reset_password_requested_at) delete genCopy.tables.users.columns.reset_password_requested_at
          console.log(JSON.stringify({
            tables,
            users: { added, removed },
            equalOutsideExpectedField: JSON.stringify(baseCopy) === JSON.stringify(genCopy)
          }, null, 2))
          NODE
          printf '%s\n' "=== gate checks ==="
          if [ -z "$ts" ]; then echo "missing_ts=1"; review=1; else echo "missing_ts=0"; fi
          if [ -z "$json" ]; then echo "missing_json=1"; review=1; fi
          if [ -n "$ts" ]; then
            grep -q 'ALTER TABLE `users` ADD `reset_password_requested_at`' "$ts" || review=1
            grep -q 'ALTER TABLE `media` ADD `_objectkey`' "$ts" || review=1
            ! grep -Eq 'CREATE TABLE.*(users|users_sessions|media|payload_kv|payload_migrations|payload_locked_documents|payload_preferences|auth_session_state)' "$ts" || review=1
          fi
          if [ -n "$json" ]; then
            node - "$json" <<'NODE'
          const fs = require('node:fs')
          const path = process.argv[2]
          const baseline = JSON.parse(fs.readFileSync('src/migrations/20250929_111647.json', 'utf8'))
          const generated = JSON.parse(fs.readFileSync(path, 'utf8'))
          const stable = (v) => JSON.parse(JSON.stringify(v))
          const baseColumns = Object.keys(baseline.tables.users.columns).sort()
          const generatedColumns = Object.keys(generated.tables.users.columns).sort()
          const added = generatedColumns.filter((name) => !baseColumns.includes(name))
          const removed = baseColumns.filter((name) => !generatedColumns.includes(name))
          const baseCopy = stable(baseline)
          const genCopy = stable(generated)
          delete baseCopy.tables.users.columns.reset_password_requested_at
          delete genCopy.tables.users.columns.reset_password_requested_at
          const mediaBase = Object.keys(baseline.tables.media.columns).sort()
          const mediaGen = Object.keys(generated.tables.media.columns).sort()
          const mediaAdded = mediaGen.filter((name) => !mediaBase.includes(name))
          const mediaRemoved = mediaBase.filter((name) => !mediaGen.includes(name))
          delete baseCopy.tables.media.columns._objectkey
          delete genCopy.tables.media.columns._objectkey
          const exact = JSON.stringify(baseCopy) === JSON.stringify(genCopy)
          if (!(removed.length === 0 && added.length === 1 && added[0] === 'reset_password_requested_at' && mediaRemoved.length === 0 && mediaAdded.length === 1 && mediaAdded[0] === '_objectkey' && exact)) process.exit(1)
          NODE
            [ "$?" -eq 0 ] || review=1
          fi
          printf '%s\n' "{\"reviewPassed\":$([ "$review" -eq 0 ] && echo true || echo false)}" > auth004-native-migration-review.json
          exit "$review"
      - name: Upload reviewed migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payload-3902-native-schema-diagnostics-${{ github.run_id }}
          path: |
            workers/W01-payload/src/migrations/*MIG_PAYLOAD_3902_NATIVE_SCHEMA_V1.ts
            workers/W01-payload/src/migrations/*MIG_PAYLOAD_3902_NATIVE_SCHEMA_V1.json
            workers/W01-payload/src/migrations/index.ts
            workers/W01-payload/auth004-native-migration-review.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit reviewed Payload native schema migration
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          rm -f .github/workflows/auth-004-payload-3902-native-migration-review.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "build(payload): add 3.90.2 native schema alignment migration"
          git push origin HEAD:main

      - name: Upload reviewed migration artifacts
        uses: actions/upload-artifact@v4
        with:
          name: payload-3902-native-schema-migration-${{ github.run_id }}
          path: |
            workers/W01-payload/src/migrations/*MIG_PAYLOAD_3902_NATIVE_SCHEMA_V1.ts
            workers/W01-payload/src/migrations/*MIG_PAYLOAD_3902_NATIVE_SCHEMA_V1.json
            workers/W01-payload/src/migrations/index.ts
          if-no-files-found: error
          retention-days: 14
