name: AUTH-004 Payload 3.90.2 Native Migration Review

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/auth-004-payload-3902-native-migration-review.yml"
      - "docs/change-control/CC-AUTH-004-PAYLOAD-VERSION-ALIGNMENT-2026-09-28.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false
      - name: Install W01 dependencies
        working-directory: workers/W01-payload
        run: pnpm install --frozen-lockfile
      - name: Generate AUTH-004 native additive migration
        working-directory: workers/W01-payload
        env:
          NODE_ENV: development
          PAYLOAD_SECRET: ignore
        run: pnpm exec payload migrate:create MIG-AUTH-004-PAYLOAD-3902-NATIVE-V1 --skip-empty
      - name: Review generated delta against authoritative baseline snapshot
        working-directory: workers/W01-payload
        shell: bash
        run: |
          set -euo pipefail
          ts=$(find src/migrations -maxdepth 1 -type f -name '*MIG_AUTH_004_PAYLOAD_3902_NATIVE_V1.ts' | head -n 1)
          json=$(find src/migrations -maxdepth 1 -type f -name '*MIG_AUTH_004_PAYLOAD_3902_NATIVE_V1.json' | head -n 1)
          test -n "$ts"
          test -n "$json"
          grep -q 'ALTER TABLE `users` ADD `reset_password_requested_at`' "$ts"
          grep -q 'DROP COLUMN `reset_password_requested_at`' "$ts"
          ! grep -Eq 'CREATE TABLE.*(users|users_sessions|media|payload_migrations|payload_locked_documents|payload_preferences|auth_session_state)' "$ts"
          node - "$json" <<'NODE'
          const fs = require('node:fs');
          const path = process.argv[2];
          const baseline = JSON.parse(fs.readFileSync('src/migrations/20250929_111647.json', 'utf8'));
          const generated = JSON.parse(fs.readFileSync(path, 'utf8'));
          const stable = (value) => JSON.parse(JSON.stringify(value));
          const tables = Object.keys(baseline.tables);
          if (tables.sort().join('|') !== Object.keys(generated.tables).sort().join('|')) throw new Error('generated snapshot changes table set');
          const baseColumns = Object.keys(baseline.tables.users.columns).sort();
          const generatedColumns = Object.keys(generated.tables.users.columns).sort();
          const added = generatedColumns.filter((name) => !baseColumns.includes(name));
          const removed = baseColumns.filter((name) => !generatedColumns.includes(name));
          if (removed.length !== 0 || added.length !== 1 || added[0] !== 'reset_password_requested_at') throw new Error(`unexpected users column delta: added=${added.join(',')} removed=${removed.join(',')}`);
          const copyBase = stable(baseline);
          const copyGenerated = stable(generated);
          delete copyBase.tables.users.columns.reset_password_requested_at;
          delete copyGenerated.tables.users.columns.reset_password_requested_at;
          if (JSON.stringify(copyBase) !== JSON.stringify(copyGenerated)) throw new Error('generated schema snapshot differs from baseline outside reset_password_requested_at');
          console.log(JSON.stringify({acceptedDelta:['users.reset_password_requested_at'],baseline:'20250929_111647.json'},null,2));
          NODE
      - name: Upload reviewed migration artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auth-004-payload-3902-native-migration-${{ github.run_id }}
          path: |
            workers/W01-payload/src/migrations/*MIG_AUTH_004_PAYLOAD_3902_NATIVE_V1.ts
            workers/W01-payload/src/migrations/*MIG_AUTH_004_PAYLOAD_3902_NATIVE_V1.json
            workers/W01-payload/src/migrations/index.ts
          if-no-files-found: error
          retention-days: 14
