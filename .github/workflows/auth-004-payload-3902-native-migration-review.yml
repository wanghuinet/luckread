name: AUTH-004 Payload 3.90.2 Native Migration Review

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/auth-004-payload-3902-native-migration-review.yml"
      - "docs/change-control/CC-AUTH-004-PAYLOAD-VERSION-ALIGNMENT-2026-09-28.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false
      - name: Install W01 dependencies
        working-directory: workers/W01-payload
        run: pnpm install --frozen-lockfile
      - name: Generate AUTH-004 native additive migration
        working-directory: workers/W01-payload
        env:
          NODE_ENV: development
          PAYLOAD_SECRET: ignore
        run: pnpm exec payload migrate:create MIG-PAYLOAD-3902-NATIVE-SCHEMA-V1 --skip-empty
      - name: Review generated native schema delta
        working-directory: workers/W01-payload
        shell: bash
        run: |
          set -euo pipefail
          ts=$(find src/migrations -maxdepth 1 -type f -name '*MIG_PAYLOAD_3902_NATIVE_SCHEMA_V1.ts' | head -n 1)
          json=$(find src/migrations -maxdepth 1 -type f -name '*MIG_PAYLOAD_3902_NATIVE_SCHEMA_V1.json' | head -n 1)
          test -n "$ts"
          test -n "$json"
          grep -q 'ALTER TABLE \`users\` ADD \`reset_password_requested_at\` text;' "$ts"
          grep -q 'ALTER TABLE \`media\` ADD \`_objectkey\` text;' "$ts"
          grep -q 'ALTER TABLE \`users\` DROP COLUMN \`reset_password_requested_at\`;' "$ts"
          grep -q 'ALTER TABLE \`media\` DROP COLUMN \`_objectkey\`;' "$ts"
          ! grep -Eq 'CREATE TABLE|DROP TABLE|CREATE INDEX|DROP INDEX' "$ts"
          test "$(grep -c 'ALTER TABLE' "$ts")" -eq 4
          grep -q 'MIG_PAYLOAD_3902_NATIVE_SCHEMA_V1' src/migrations/index.ts
          node - "$json" <<'NODE'
          const fs = require('node:fs')
          const d = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          const users = d.tables?.users?.columns || {}
          const media = d.tables?.media?.columns || {}
          if (!users.reset_password_requested_at) throw new Error('missing users.reset_password_requested_at in generated snapshot')
          if (!media._objectkey) throw new Error('missing media._objectkey in generated snapshot')
          if (!d.tables?.auth_session_state || !d.tables?.users_sessions) throw new Error('native session tables missing from generated snapshot')
          console.log(JSON.stringify({generatedNativeDelta:['users.reset_password_requested_at','media._objectkey']},null,2))
          NODE
      - name: Upload reviewed migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payload-3902-native-schema-diagnostics-${{ github.run_id }}
          path: |
            workers/W01-payload/src/migrations/*MIG_PAYLOAD_3902_NATIVE_SCHEMA_V1.ts
            workers/W01-payload/src/migrations/*MIG_PAYLOAD_3902_NATIVE_SCHEMA_V1.json
            workers/W01-payload/src/migrations/index.ts
            workers/W01-payload/auth004-native-migration-review.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit reviewed Payload native schema migration
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          rm -f .github/workflows/auth-004-payload-3902-native-migration-review.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "build(payload): add 3.90.2 native schema alignment migration"
          git push origin HEAD:main

      - name: Upload reviewed migration artifacts
        uses: actions/upload-artifact@v4
        with:
          name: payload-3902-native-schema-migration-${{ github.run_id }}
          path: |
            workers/W01-payload/src/migrations/*MIG_PAYLOAD_3902_NATIVE_SCHEMA_V1.ts
            workers/W01-payload/src/migrations/*MIG_PAYLOAD_3902_NATIVE_SCHEMA_V1.json
            workers/W01-payload/src/migrations/index.ts
          if-no-files-found: error
          retention-days: 14
