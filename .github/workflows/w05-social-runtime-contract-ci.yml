name: W05 Social Runtime Contract CI
on:
  pull_request:
    paths:
      - 'workers/W05-social/**'
      - 'workers/W01-payload/src/content/w05-social-client.ts'
      - 'workers/W01-payload/wrangler.jsonc'
      - 'contracts/transport/W01-W05-social-follow-trusted-transport.v1.json'
      - 'contracts/api/social-relationship-read-operation-policy.v1.json'
      - 'contracts/dto/social-relationship-read.v1.json'
      - 'contracts/openapi/v1/openapi.yaml'
      - 'contracts/entity/SOCIAL-003-like-relationship-contract.v1.json'
      - 'contracts/persistence/SOCIAL-003-like-d1-02-persistence.v1.json'
      - 'contracts/api/social-comment-operation-policy.v1.json'
      - 'contracts/dto/social-comment.v1.json'
      - 'contracts/entity/SOCIAL-004-comment-reply-contract.v1.json'
      - 'contracts/entity/entity-field-contract-social-004-comment.v1.json'
      - 'contracts/persistence/SOCIAL-004-comment-d1-02-persistence.v1.json'
      - 'contracts/admission/SOCIAL-004-comment-runtime-admission.v1.json'
      - 'docs/change-control/CC-MAPPING-0-SOCIAL-004-COMMENT-RUNTIME-ADMISSION-2026-10-01.md'
  push:
    branches: [main]
    paths:
      - 'workers/W05-social/**'
      - 'workers/W01-payload/src/content/w05-social-client.ts'
      - 'workers/W01-payload/wrangler.jsonc'
      - 'contracts/transport/W01-W05-social-follow-trusted-transport.v1.json'
      - 'contracts/api/social-relationship-read-operation-policy.v1.json'
      - 'contracts/dto/social-relationship-read.v1.json'
      - 'contracts/openapi/v1/openapi.yaml'
      - 'contracts/entity/SOCIAL-003-like-relationship-contract.v1.json'
      - 'contracts/persistence/SOCIAL-003-like-d1-02-persistence.v1.json'
      - 'contracts/api/social-comment-operation-policy.v1.json'
      - 'contracts/dto/social-comment.v1.json'
      - 'contracts/entity/SOCIAL-004-comment-reply-contract.v1.json'
      - 'contracts/entity/entity-field-contract-social-004-comment.v1.json'
      - 'contracts/persistence/SOCIAL-004-comment-d1-02-persistence.v1.json'
      - 'contracts/admission/SOCIAL-004-comment-runtime-admission.v1.json'
      - 'docs/change-control/CC-MAPPING-0-SOCIAL-004-COMMENT-RUNTIME-ADMISSION-2026-10-01.md'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run workers/W05-social/src/follow-runtime.test.ts workers/W05-social/src/like-runtime.test.ts workers/W05-social/src/follow-read-runtime.test.ts
