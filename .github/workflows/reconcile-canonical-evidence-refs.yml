name: Reconcile Canonical Feature Evidence Refs

on:
  push:
    branches: [main]
    paths:
      - 'scripts/reconcile-canonical-evidence-refs.mjs'
      - 'contracts/alignment/mapping-batches/**.md'
      - '.github/workflows/reconcile-canonical-evidence-refs.yml'
  workflow_dispatch:

concurrency:
  group: canonical-feature-evidence-refs-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Reconcile explicit Feature evidence refs
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          node scripts/reconcile-canonical-evidence-refs.mjs

      - name: Commit and push reconciled mapping
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            if git diff --quiet -- contracts/alignment/cross-system-mapping.v1.json; then
              echo 'No canonical feature evidence-reference changes required.'
              exit 0
            fi

            git add contracts/alignment/cross-system-mapping.v1.json
            git commit -m 'chore(mapping): reconcile feature evidence refs'

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push race detected on attempt ${attempt}; recomputing against latest main."
            git fetch origin main
            git reset --hard origin/main
            node scripts/reconcile-canonical-evidence-refs.mjs
          done

          echo 'Unable to push canonical feature evidence refs after 3 attempts.'
          exit 1
