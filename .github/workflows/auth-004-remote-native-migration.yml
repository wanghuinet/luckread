name: AUTH-004 Payload 3.90.2 Native Migration Execution

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact main source commit containing the approved Payload 3.90.2 native migration
        required: true
        type: string
      database_name:
        description: Controlled D1 database name
        required: true
        default: luckread
        type: string
      confirm:
        description: Type EXECUTE_AUTH_004_NATIVE to permit the controlled migration step
        required: true
        type: string

permissions:
  contents: read

env:
  WRANGLER_VERSION: 4.116.0
  MIGRATION_NAME: 20260928_104842_MIG_PAYLOAD_3902_NATIVE_SCHEMA_V1

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate execution trigger
        run: test "${{ github.event_name }}" = "workflow_dispatch"
      - name: Validate confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
          DATABASE_NAME: ${{ inputs.database_name }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = "EXECUTE_AUTH_004_NATIVE"
          test "$DATABASE_NAME" = "luckread"
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup pnpm 11
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false
      - name: Install locked W01 dependencies
        working-directory: workers/W01-payload
        run: pnpm install --frozen-lockfile
      - name: Validate source and migration admission
        working-directory: workers/W01-payload
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const p = JSON.parse(readFileSync('package.json','utf8'))
          if (p.dependencies?.payload !== '3.90.2' || p.dependencies?.['@payloadcms/db-d1-sqlite'] !== '3.90.2') throw new Error('Payload 3.90.2 dependency admission failed')
          NODE
          test -f "src/migrations/${MIGRATION_NAME}.ts"
          grep -Fq "name: '${MIGRATION_NAME}'" src/migrations/index.ts
      - name: Preflight controlled remote target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_NAME: ${{ inputs.database_name }}
        working-directory: workers/W01-payload
        run: |
          set -euo pipefail
          mkdir -p ../../artifacts/evidence/auth-004/remote-migration
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "$DATABASE_NAME" --remote --json --config wrangler.jsonc --command "SELECT id,name,batch FROM payload_migrations WHERE name='${MIGRATION_NAME}';" > ../../artifacts/evidence/auth-004/remote-migration/preflight-migration.json
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "$DATABASE_NAME" --remote --json --config wrangler.jsonc --command 'PRAGMA table_info("users");' > ../../artifacts/evidence/auth-004/remote-migration/preflight-users.json
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "$DATABASE_NAME" --remote --json --config wrangler.jsonc --command 'PRAGMA table_info("media");' > ../../artifacts/evidence/auth-004/remote-migration/preflight-media.json
          node - <<'NODE'
          const fs=require('node:fs')
          const read=(p)=>JSON.parse(fs.readFileSync(p,'utf8'))
          const collect=(v,out=[])=>{ if(Array.isArray(v)){for(const x of v)collect(x,out)} else if(v&&typeof v==='object'){ if(Array.isArray(v.results))out.push(...v.results); if(Array.isArray(v.result))out.push(...v.result); for(const x of Object.values(v))collect(x,out)} return out }
          const rows=(p)=>[...new Map(collect(read(p)).map(r=>[JSON.stringify(r),r])).values()]
          const migrationRows=rows('../../artifacts/evidence/auth-004/remote-migration/preflight-migration.json')
          const users=rows('../../artifacts/evidence/auth-004/remote-migration/preflight-users.json')
          const media=rows('../../artifacts/evidence/auth-004/remote-migration/preflight-media.json')
          if(migrationRows.length!==0) throw new Error('AUTH-004 native migration already recorded; refusing duplicate execution')
          if(users.some(r=>String(r.name)==='reset_password_requested_at')) throw new Error('users.reset_password_requested_at already exists; refusing duplicate execution')
          if(media.some(r=>String(r.name)==='_objectkey')) throw new Error('media._objectkey already exists; refusing duplicate execution')
          fs.writeFileSync('../../artifacts/evidence/auth-004/remote-migration/preflight-summary.json',JSON.stringify({migrationAlreadyRecorded:false,newUsersFieldPresent:false,newMediaFieldPresent:false,result:'PASS'},null,2)+'\n')
          NODE
      - name: Execute Payload native migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NODE_ENV: production
          PAYLOAD_SECRET: ignore
          CLOUDFLARE_ENV: production
          PAYLOAD_MIGRATION_REMOTE: 'true'
        working-directory: workers/W01-payload
        run: pnpm exec payload migrate
      - name: Validate post-migration evidence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_NAME: ${{ inputs.database_name }}
        working-directory: workers/W01-payload
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "$DATABASE_NAME" --remote --json --config wrangler.jsonc --command "SELECT id,name,batch FROM payload_migrations WHERE name='${MIGRATION_NAME}';" > ../../artifacts/evidence/auth-004/remote-migration/post-migration.json
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "$DATABASE_NAME" --remote --json --config wrangler.jsonc --command 'PRAGMA table_info("users");' > ../../artifacts/evidence/auth-004/remote-migration/post-users.json
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "$DATABASE_NAME" --remote --json --config wrangler.jsonc --command 'PRAGMA table_info("media");' > ../../artifacts/evidence/auth-004/remote-migration/post-media.json
          node - <<'NODE'
          const fs=require('node:fs')
          const read=(p)=>JSON.parse(fs.readFileSync(p,'utf8'))
          const collect=(v,out=[])=>{ if(Array.isArray(v)){for(const x of v)collect(x,out)} else if(v&&typeof v==='object'){ if(Array.isArray(v.results))out.push(...v.results); if(Array.isArray(v.result))out.push(...v.result); for(const x of Object.values(v))collect(x,out)} return out }
          const rows=(p)=>[...new Map(collect(read(p)).map(r=>[JSON.stringify(r),r])).values()]
          const migrationRows=rows('../../artifacts/evidence/auth-004/remote-migration/post-migration.json')
          const users=rows('../../artifacts/evidence/auth-004/remote-migration/post-users.json')
          const media=rows('../../artifacts/evidence/auth-004/remote-migration/post-media.json')
          if(migrationRows.length!==1 || String(migrationRows[0]?.name)!==process.env.MIGRATION_NAME) throw new Error('AUTH-004 native migration history is not exactly one new record')
          if(!users.some(r=>String(r.name)==='reset_password_requested_at')) throw new Error('users.reset_password_requested_at missing after migration')
          if(!media.some(r=>String(r.name)==='_objectkey')) throw new Error('media._objectkey missing after migration')
          fs.writeFileSync('../../artifacts/evidence/auth-004/remote-migration/post-validation-summary.json',JSON.stringify({migration:migrationRows[0],usersNativeFieldPresent:true,mediaNativeFieldPresent:true,result:'PASS'},null,2)+'\n')
          NODE
      - name: Write provenance
        if: always()
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          DATABASE_NAME: ${{ inputs.database_name }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/evidence/auth-004/remote-migration
          node - <<'NODE'
          const fs=require('node:fs')
          fs.writeFileSync('artifacts/evidence/auth-004/remote-migration/provenance.json',JSON.stringify({repository:process.env.GITHUB_REPOSITORY,workflow:process.env.GITHUB_WORKFLOW,runId:Number(process.env.GITHUB_RUN_ID),requestedSourceSha:process.env.REQUESTED_SOURCE_SHA,databaseName:process.env.DATABASE_NAME,migration:process.env.MIGRATION_NAME,environment:'CONTROLLED_REMOTE_D1'},null,2)+'\n')
          NODE
      - name: Upload AUTH-004 remote migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-004-remote-migration-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence/auth-004/remote-migration/
          if-no-files-found: error
          retention-days: 30
