name: Contract Single Job Smoke

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # trigger-only diagnostic revision
  smoke:
    name: Contract Common Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node scripts/contract-ci.mjs common
