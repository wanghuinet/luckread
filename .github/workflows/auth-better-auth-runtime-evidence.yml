name: Better Auth Core Runtime Evidence

on:
  pull_request:
    paths:
      - 'workers/W01-payload/src/auth/**'
      - 'workers/W01-payload/src/app/auth/**'
      - 'workers/W01-payload/src/app/api/auth/**'
      - 'workers/W01-payload/src/app/api/v1/auth/**'
      - 'workers/W01-payload/src/app/(payload)/api/users/me/**'
      - 'workers/W01-payload/src/app/(frontend)/me/followers/**'
      - 'workers/W01-payload/src/app/(frontend)/me/following/**'
      - 'workers/W01-payload/src/collections/Users.ts'
      - 'workers/W01-payload/src/migrations/**'
      - 'workers/W01-payload/scripts/auth-better-auth-runtime-evidence.mjs'
      - 'workers/W01-payload/package.json'
      - 'workers/W01-payload/pnpm-lock.yaml'
      - 'workers/W01-payload/payload.config.ts'
      - 'workers/W01-payload/wrangler.jsonc'
      - 'artifacts/mapping-0/priv004-approved-policy-instance-2026-09-27.json'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source SHA to test
        required: true
        type: string

permissions:
  contents: read

jobs:
  runtime-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_ENV: development
      CLOUDFLARE_ENV: development
      PAYLOAD_SECRET: local-runtime-${{ github.run_id }}-${{ github.run_attempt }}
      BETTER_AUTH_SECRET: local-runtime-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Resolve exact source SHA
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          DISPATCH_SHA: ${{ inputs.source_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "sha=$DISPATCH_SHA" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            echo "sha=$PR_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout exact tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 1

      - name: Validate exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.source.outputs.sha }}"
          test -s workers/W01-payload/scripts/auth-better-auth-runtime-evidence.mjs
          test -s workers/W01-payload/src/migrations/20261005_MIG_BETTER_AUTH_CORE_V1.ts
          test -z "$(git status --short)"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install W01 dependencies
        working-directory: workers/W01-payload
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Apply exact local Payload migration set
        working-directory: workers/W01-payload
        run: pnpm payload migrate

      - name: Capture local D1 Better Auth schema
        working-directory: workers/W01-payload
        run: |
          set -euo pipefail
          mkdir -p ../../artifacts/evidence/auth-better-auth