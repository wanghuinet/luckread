          W05_FOLLOWING_AUTHOR_IDS_POSTGRES_DATABASE_URL: postgresql://postgres:postgres_local_only@127.0.0.1:5432/luckread_w05_d1_02_schema
          W05_FOLLOWING_AUTHOR_IDS_POSTGRES_REPORT: ../../artifacts/neon/w05-following-author-ids-postgres-runtime-postflight.json
        run: node --import=tsx/esm ../../workers/W05-social/scripts/neon/rehearse-following-author-ids-postgres-runtime.mjs

      - name: Rehearse W05 Block/Mute list reads against PostgreSQL 18
        working-directory: workers/W02-identity
        env:
          W05_BLOCK_MUTE_LIST_POSTGRES_DATABASE_URL: postgresql://postgres:postgres_local_only@127.0.0.1:5432/luckread_w05_d1_02_schema
          W05_BLOCK_MUTE_LIST_POSTGRES_REPORT: ../../artifacts/neon/w05-block-mute-list-postgres-runtime-postflight.json
        run: node --import=tsx/esm ../../workers/W05-social/scripts/neon/rehearse-block-mute-list-postgres-runtime.mjs

      - name: Rehearse W05 Block/Mute writes against PostgreSQL 18
        working-directory: workers/W02-identity
        env:
          W05_BLOCK_MUTE_RELATION_POSTGRES_DATABASE_URL: postgresql://postgres:postgres_local_only@127.0.0.1:5432/luckread_w05_d1_02_schema
          W05_BLOCK_MUTE_RELATION_POSTGRES_REPORT: ../../artifacts/neon/w05-block-mute-relation-postgres-runtime-postflight.json
        run: node --import=tsx/esm ../../workers/W05-social/scripts/neon/rehearse-block-mute-relation-postgres-runtime.mjs

      - name: Rehearse W05 content liker reads against PostgreSQL 18
        working-directory: workers/W02-identity
        env:
          W05_CONTENT_LIKERS_POSTGRES_DATABASE_URL: postgresql://postgres:postgres_local_only@127.0.0.1:5432/luckread_w05_d1_02_schema
          W05_CONTENT_LIKERS_POSTGRES_REPORT: ../../artifacts/neon/w05-content-likers-postgres-runtime-postflight.json
        run: node --import=tsx/esm ../../workers/W05-social/scripts/neon/rehearse-content-likers-postgres-runtime.mjs

      - name: Rehearse W05 favorite list reads against PostgreSQL 18
        working-directory: workers/W02-identity
        env:
          W05_FAVORITE_LIST_POSTGRES_DATABASE_URL: postgresql://postgres:postgres_local_only@127.0.0.1:5432/luckread_w05_d1_02_schema
          W05_FAVORITE_LIST_POSTGRES_REPORT: ../../artifacts/neon/w05-favorite-list-postgres-runtime-postflight.json
        run: node --import=tsx/esm ../../workers/W05-social/scripts/neon/rehearse-favorite-list-postgres-runtime.mjs
      - name: Rehearse W05 like status reads against PostgreSQL 18
        working-directory: workers/W02-identity
        env:
          W05_LIKE_STATUS_POSTGRES_DATABASE_URL: postgresql://postgres:postgres_local_only@127.0.0.1:5432/luckread_w05_d1_02_schema
          W05_LIKE_STATUS_POSTGRES_REPORT: ../../artifacts/neon/w05-like-status-postgres-runtime-postflight.json
        run: node --import=tsx/esm ../../workers/W05-social/scripts/neon/rehearse-like-status-postgres-runtime.mjs

      - name: Rehearse W05 like and unlike writes against PostgreSQL 18
        working-directory: workers/W02-identity
        env:
          W05_LIKE_MUTATION_POSTGRES_DATABASE_URL: postgresql://postgres:postgres_local_only@127.0.0.1:5432/luckread_w05_d1_02_schema
          W05_LIKE_MUTATION_POSTGRES_REPORT: ../../artifacts/neon/w05-like-mutation-postgres-runtime-postflight.json
        run: node --import=tsx/esm ../../workers/W05-social/scripts/neon/rehearse-like-mutation-postgres-runtime.mjs

      - name: Rehearse W05 social targets against PostgreSQL 18
        working-directory: workers/W02-identity
        env:
          W05_SOCIAL_TARGETS_POSTGRES_DATABASE_URL: postgresql://postgres:postgres_local_only@127.0.0.1:5432/luckread_w05_d1_02_schema
          W05_SOCIAL_TARGETS_POSTGRES_REPORT: ../../artifacts/neon/w05-social-targets-postgres-runtime-postflight.json
        run: node --import=tsx/esm ../../workers/W05-social/scripts/neon/rehearse-social-targets-read-postgres-runtime.mjs

      - name: Rehearse W05 social closure topic, notification inbox and content summary reads against PostgreSQL 18
        working-directory: workers/W02-identity
        env:
          W05_SOCIAL_CLOSURE_READ_POSTGRES_DATABASE_URL: postgresql://postgres:postgres_local_only@127.0.0.1:5432/luckread_w05_d1_02_schema
