name: LuckRead W02 Auth Hotfix One-Time Deploy

on:
  push:
    branches: [main]
    paths:
      - docs/release/AUTH-L1-HOTFIX-2026-09-30.md

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install repository dependencies
        run: npm ci

      - name: Verify hotfix marker
        run: |
          test -f docs/release/AUTH-L1-HOTFIX-2026-09-30.md
          grep -q "AUTH_L1_HOTFIX=AUTHORIZED_BY_MAIN_MERGE" docs/release/AUTH-L1-HOTFIX-2026-09-30.md

      - name: Typecheck W02
        run: |
          npx --no-install tsc --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --lib ES2022,DOM --types @cloudflare/workers-types workers/W02-content/src/index.ts

      - name: Test W02 auth/session runtime
        run: |
          npx --yes vitest@3.2.4 run             workers/W02-content/src/authz/role-assignment.test.ts             workers/W02-content/src/session/session-runtime.test.ts             workers/W02-content/src/session/session-management.test.ts

      - name: Deploy W02
        working-directory: workers/W02-content
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@4.116.0 deploy --config wrangler.jsonc

      - name: Smoke page
        run: |
          set -euo pipefail
          code="$(curl -L -sS -o /tmp/login-page -w '%{http_code}' https://mp.luckread.cn/login)"
          echo "https://mp.luckread.cn/login -> $code"
          test "$code" = 200

      - name: Write provenance
        run: |
          mkdir -p artifacts/auth
          cat > artifacts/auth/w02-auth-hotfix.txt <<EOF
          commit=${GITHUB_SHA}
          worker=luckread-w02
          auth_l1_pending_verification=true
          deployment=true
          login_page_smoke=true
          EOF
          cat artifacts/auth/w02-auth-hotfix.txt

      - name: Upload provenance
        uses: actions/upload-artifact@v4
        with:
          name: w02-auth-hotfix-${{ github.sha }}
          path: artifacts/auth/w02-auth-hotfix.txt
