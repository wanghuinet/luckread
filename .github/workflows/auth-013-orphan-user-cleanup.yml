name: AUTH-013 Orphan Positive-Run User Cleanup

on:
  workflow_dispatch:
    inputs:
      target_run_id:
        description: "Exact failed AUTH-013 positive runtime run that left the synthetic user"
        required: true
        default: "36082802465"
        type: string
      confirm:
        description: "Type CLEANUP_AUTH013_ORPHAN_USER"
        required: true
        default: "CLEANUP_AUTH013_ORPHAN_USER"
        type: string

permissions:
  contents: read

env:
  EXPECTED_RUN_ID: "36082802465"
  D1_01_ID: "2f80471e-3756-49f9-8db1-7707a433ad64"
  D1_03_ID: "bda1d247-a371-4244-91ae-aef96034db7f"
  DATABASE_NAME: "luckread"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate cleanup admission
        env:
          INPUT_RUN_ID: ${{ inputs.target_run_id }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test "$INPUT_RUN_ID" = "$EXPECTED_RUN_ID"
          test "$CONFIRM" = "CLEANUP_AUTH013_ORPHAN_USER"

      - name: Configure Cloudflare access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Preflight exact synthetic residue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs'

          const runId = Number(process.env.TARGET_RUN_ID || '36082802465')
          const expectedUserId = 910000000 + (runId % 50000000)
          const expectedEmail = `auth013-positive-${runId}@invalid.local`
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID
          const token = process.env.CLOUDFLARE_API_TOKEN
          const dbId = process.env.D1_01_ID

          async function queryD1(dbId, sql) {
            const response = await fetch(
              `https://api.cloudflare.com/client/v4/accounts/${accountId}/d1/database/${dbId}/query`,
              {
                method: 'POST',
                headers: {
                  Authorization: `Bearer ${token}`,
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({ sql }),
              },
            )
            const body = await response.json()
            if (!response.ok || body.success !== true) {
              throw new Error(`D1 query failed: ${response.status} ${JSON.stringify(body)}`)
            }
            return body.result?.[0]?.results ?? []
          }

          const users = await queryD1(
            process.env.D1_01_ID,
            `SELECT id,email,created_at,account_state,account_state_version
             FROM users
             WHERE id = ${expectedUserId}
             LIMIT 2`,
          )
          if (users.length !== 1) {
            throw new Error(`cleanup blocked: expected exactly one target user row, got ${users.length}`)
          }

          const user = users[0]
          if (String(user.email) !== expectedEmail) {
            throw new Error(`cleanup blocked: target email mismatch`)
          }

          const journalRows = await queryD1(
            process.env.D1_01_ID,
            `SELECT journal_id,event_id,event_type,resource_id,status,attempt
             FROM auth_013_publication_journal
             WHERE resource_id = '${expectedUserId}'
             LIMIT 2`,
          )
          if (journalRows.length !== 1) {
            throw new Error(`cleanup blocked: expected exactly one AUTH-013 journal row for target user, got ${journalRows.length}`)
          }

          const auditRows = await queryD1(
            process.env.D1_03_ID,
            `SELECT COUNT(*) AS count
             FROM audit_events
             WHERE target_id = '${expectedUserId}'
             AND action = 'identity.account_state_changed'`,
          )
          const retainedAuditEventCount = Number(auditRows[0]?.count ?? 0)
          if (retainedAuditEventCount < 1) {
            throw new Error(`cleanup blocked: expected at least one immutable D1-03 audit event, got ${retainedAuditEventCount}`)
          }

          fs.writeFileSync(
            'cleanup-preflight.json',
            JSON.stringify(
              {
                targetRunId: runId,
                expectedUserId,
                expectedEmail,
                user,
                journal: journalRows[0],
                retainedAuditEventCount,
                preflight: 'PASS',
              },
              null,
              2,
            ) + '\\n',
          )
          NODE

      - name: Execute targeted cleanup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs'

          const preflight = JSON.parse(fs.readFileSync('cleanup-preflight.json', 'utf8'))
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID
          const token = process.env.CLOUDFLARE_API_TOKEN
          const dbId = process.env.D1_01_ID
          const userId = Number(preflight.expectedUserId)
          const journalId = String(preflight.journal.journal_id).replace(/'/g, "''")

          async function execute(sql) {
            const response = await fetch(
              `https://api.cloudflare.com/client/v4/accounts/${accountId}/d1/database/${dbId}/query`,
              {
                method: 'POST',
                headers: {
                  Authorization: `Bearer ${token}`,
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({ sql }),
              },
            )
            const body = await response.json()
            if (!response.ok || body.success !== true) {
              throw new Error(`D1 mutation failed: ${response.status} ${JSON.stringify(body)}`)
            }
          }

          await execute(
            `DELETE FROM auth_013_publication_journal
             WHERE journal_id = '${journalId}'`,
          )
          await execute(
            `DELETE FROM users
             WHERE id = ${userId}
             AND email = '${String(preflight.expectedEmail).replace(/'/g, "''")}'`,
          )

          console.log(
            JSON.stringify(
              {
                AUTH_013_ORPHAN_CLEANUP: 'MUTATION_PASS',
                targetRunId: preflight.targetRunId,
                userId: preflight.expectedUserId,
                journalId: preflight.journal.journal_id,
                auditEventsRetained: true,
              },
              null,
              2,
            ),
          )
          NODE

      - name: Verify cleanup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs'

          const preflight = JSON.parse(fs.readFileSync('cleanup-preflight.json', 'utf8'))
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID
          const token = process.env.CLOUDFLARE_API_TOKEN
          const dbId = process.env.D1_01_ID
          const userId = Number(preflight.expectedUserId)
          const journalId = String(preflight.journal.journal_id).replace(/'/g, "''")

          async function query(sql) {
            const response = await fetch(
              `https://api.cloudflare.com/client/v4/accounts/${accountId}/d1/database/${dbId}/query`,
              {
                method: 'POST',
                headers: {
                  Authorization: `Bearer ${token}`,
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({ sql }),
              },
            )
            const body = await response.json()
            if (!response.ok || body.success !== true) {
              throw new Error(`D1 query failed: ${response.status} ${JSON.stringify(body)}`)
            }
            return body.result?.[0]?.results ?? []
          }

          const userRows = await queryD1(
            process.env.D1_01_ID,
            `SELECT COUNT(*) AS count FROM users WHERE id = ${userId}`,
          )
          const journalRows = await queryD1(
            process.env.D1_01_ID,
            `SELECT COUNT(*) AS count FROM auth_013_publication_journal WHERE journal_id = '${journalId}'`,
          )
          const auditRows = await queryD1(
            process.env.D1_03_ID,
            `SELECT COUNT(*) AS count
             FROM audit_events
             WHERE target_id = '${userId}'
             AND action = 'identity.account_state_changed'`,
          )

          if (Number(userRows[0]?.count ?? -1) !== 0) throw new Error('cleanup verification failed: target user still exists')
          if (Number(journalRows[0]?.count ?? -1) !== 0) throw new Error('cleanup verification failed: target journal still exists')
          if (Number(auditRows[0]?.count ?? 0) < 1) throw new Error('cleanup verification failed: immutable AuditEvent was not retained')

          fs.writeFileSync(
            'cleanup-result.json',
            JSON.stringify(
              {
                targetRunId: preflight.targetRunId,
                userCountAfter: Number(userRows[0]?.count ?? -1),
                journalCountAfter: Number(journalRows[0]?.count ?? -1),
                retainedAuditEventCount: Number(auditRows[0]?.count ?? 0),
                cleanup: 'PASS',
              },
              null,
              2,
            ) + '\\n',
          )
          console.log(fs.readFileSync('cleanup-result.json', 'utf8'))
          NODE

      - name: Upload cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-013-orphan-cleanup-${{ github.run_id }}
          path: |
            cleanup-preflight.json
            cleanup-result.json
          if-no-files-found: ignore
          retention-days: 30
