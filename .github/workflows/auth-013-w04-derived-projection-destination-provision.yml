name: AUTH-013 W04 Derived Projection Destination Verify

on:
  push:
    branches:
      - main
    paths:
      - "artifacts/mapping-0/auth013-w04-derived-projection-destination-authorized-2026-09-29.json"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate Change Control adoption
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          node - <<'NODE'
          const fs=require('fs')
          const a=JSON.parse(fs.readFileSync('artifacts/mapping-0/auth013-w04-derived-projection-destination-authorized-2026-09-29.json','utf8'))
          if(a.status!=='AUTHORIZED_FOR_CONTROLLED_ADOPTION') throw new Error('Invalid authorization')
          if(a.destination.type!=='cloudflare_kv') throw new Error('Destination type mismatch')
          if(a.destination.title!=='globe') throw new Error('Unexpected KV title')
          if(a.destination.namespaceId!=='32f7e407128a43d59720d5d46736e084') throw new Error('Unexpected KV namespace ID')
          if(a.destination.authority!=='NONE') throw new Error('Projection destination cannot be authority')
          if(a.constraints.newD1 || a.constraints.newWorker || a.constraints.newKv || a.constraints.additionalProjectionDestination) throw new Error('Topology expansion')
          console.log(JSON.stringify(a,null,2))
          NODE

      - name: Verify the single adopted KV destination
        shell: bash
        run: |
          set -euo pipefail
          AUTH=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          body="$(curl -fsS --retry 3 --retry-all-errors "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" "${AUTH[@]}")"
          jq -e --arg id "32f7e407128a43d59720d5d46736e084" --arg title "globe"             '.result[]? | select(.id==$id and .title==$title)' <<<"$body" >/tmp/auth013-w04-kv.json
          jq . /tmp/auth013-w04-kv.json
          node - <<'NODE'
          const fs=require('fs')
          const v=JSON.parse(fs.readFileSync('/tmp/auth013-w04-kv.json','utf8'))
          fs.writeFileSync('w04-derived-projection-destination-cloudflare-result.json',JSON.stringify({
            schemaVersion:1, auth:'AUTH-013', worker:'W04', type:'cloudflare_kv',
            name:v.title, namespaceId:v.id, adoption:'EXISTING_RESOURCE',
            authority:'NONE', verified:true
          },null,2)+'\n')
          NODE

      - name: Upload destination verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: auth-013-w04-derived-projection-destination-evidence
          path: w04-derived-projection-destination-cloudflare-result.json
