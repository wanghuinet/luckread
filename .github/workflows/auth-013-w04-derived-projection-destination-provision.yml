name: AUTH-013 W04 Derived Projection Destination Provision

on:
  push:
    branches:
      - main
    paths:
      - "artifacts/mapping-0/auth013-w04-derived-projection-destination-authorized-2026-09-29.json"

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate Change Control admission
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          node - <<'NODE'
          const fs=require('fs')
          const a=JSON.parse(fs.readFileSync('artifacts/mapping-0/auth013-w04-derived-projection-destination-authorized-2026-09-29.json','utf8'))
          if(a.status!=='AUTHORIZED_FOR_CONTROLLED_PROVISIONING') throw new Error('Invalid authorization')
          if(a.destination.type!=='cloudflare_kv') throw new Error('Destination type mismatch')
          if(a.destination.authority!=='NONE') throw new Error('Projection destination cannot be authority')
          if(a.constraints.newD1 || a.constraints.newWorker || a.constraints.additionalProjectionDestination) throw new Error('Topology expansion')
          console.log(JSON.stringify(a,null,2))
          NODE

      - name: Inspect and provision the single KV destination idempotently
        shell: bash
        run: |
          set -euo pipefail
          NAME="luckread-w04-auth013-projection"
          AUTH=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          body="$(curl -fsS --retry 3 --retry-all-errors "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" "${AUTH[@]}")"
          match="$(jq -c --arg name "$NAME" '.result[]? | select(.title==$name)' <<<"$body" | head -n 1 || true)"
          if [ -n "$match" ]; then
            action="preexisting"
            id="$(jq -r '.id' <<<"$match")"
          else
            echo "CREATE $NAME"
            created="$(curl -fsS --retry 3 --retry-all-errors -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" "${AUTH[@]}" --data "{"title":"$NAME"}")"
            jq -e '.success == true' <<<"$created" >/dev/null
            id="$(jq -r '.result.id' <<<"$created")"
            action="created"
          fi
          test -n "$id"
          cat > w04-derived-projection-destination-cloudflare-result.json <<JSON
          {
            "schemaVersion": 1,
            "auth": "AUTH-013",
            "worker": "W04",
            "type": "cloudflare_kv",
            "name": "$NAME",
            "namespaceId": "$id",
            "action": "$action",
            "authority": "NONE",
            "verified": true
          }
          JSON
          jq . w04-derived-projection-destination-cloudflare-result.json

      - name: Upload destination provisioning evidence
        uses: actions/upload-artifact@v4
        with:
          name: auth-013-w04-derived-projection-destination-evidence
          path: w04-derived-projection-destination-cloudflare-result.json
