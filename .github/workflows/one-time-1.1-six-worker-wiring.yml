name: one-time 1.1 six-worker wiring

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    if: github.head_ref == 'migration/1.1-six-worker-20261005'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.head_ref }}"
          fetch-depth: 0

      - name: Wire six workers without rewriting business runtimes
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')

          # Flatten merged runtime source trees.
          content_nested = root / 'workers/luck02-content/src/content-domain/src'
          content_dst = root / 'workers/luck02-content/src/content-domain'
          if content_nested.is_dir():
              for p in list(content_nested.iterdir()): p.rename(content_dst / p.name)
              content_nested.rmdir()

          projection_nested = root / 'workers/luck03-social/src/projection/src'
          projection_dst = root / 'workers/luck03-social/src/projection'
          if projection_nested.is_dir():
              for p in list(projection_nested.iterdir()): p.rename(projection_dst / p.name)
              projection_nested.rmdir()

          governance_nested = root / 'workers/luck04-commerce/src/governance/src'
          governance_dst = root / 'workers/luck04-commerce/src/governance'
          if governance_nested.is_dir():
              for p in list(governance_nested.iterdir()): p.rename(governance_dst / p.name)
              governance_nested.rmdir()

          # The copied W07 index becomes the Commerce sub-entrypoint.
          commerce_root = root / 'workers/luck04-commerce/src/index.ts'
          commerce_entry = root / 'workers/luck04-commerce/src/commerce/index.ts'
          commerce_entry.parent.mkdir(parents=True, exist_ok=True)
          if commerce_root.exists(): commerce_root.rename(commerce_entry)

          # Combine Social fetch + existing projection queue consumer.
          social_index = root / 'workers/luck03-social/src/index.ts'
          projection_index = projection_dst / 'index.ts'
          social_text = social_index.read_text()
          projection_text = projection_index.read_text() if projection_index.exists() else ''
          social_text = social_text.replace("export default {", "const socialHandler = {").replace("\nexport default {\n", "\n")
          # Rebuild from the original exported object by extracting its final object safely.
          if 'const socialHandler = {' not in social_text:
              raise SystemExit('unable to locate Social handler export')
          social_text = social_text.replace("const socialHandler = {", "const socialHandler = {", 1)
          queue_impl = '''\n\n  async queue(batch: MessageBatchLike, env: Env & { AUTH013_W04_DERIVED_PROJECTION: ProjectionKV }): Promise<void> {\n    if (!projectionHandler.queue) return\n    await projectionHandler.queue(batch, env)\n  },\n'''.strip('\n')
          # Insert queue support before the final handler close, then export composed handler.
          if 'const projectionHandler' not in social_text:
              header = "import projectionHandler from './projection/index.js'\n\ninterface ProjectionKV { get(key: string, type: 'json'): Promise<unknown>; put(key: string, value: string): Promise<void> }\ninterface QueueMessage { body: unknown; ack(): void; retry(): void }\ninterface MessageBatchLike { messages: QueueMessage[] }\n"
              social_text = header + social_text
          marker = "\n}\n"
          idx = social_text.rfind(marker)
          if idx == -1: raise SystemExit('unable to close Social handler')
          social_text = social_text[:idx] + queue_impl + social_text[idx:]
          social_text += "\n\nexport default socialHandler\n"
          social_index.write_text(social_text)

          # Compose Commerce + Governance at one Worker entrypoint.
          governance_entry = governance_dst / 'index.ts'
          root_index = root / 'workers/luck04-commerce/src/index.ts'
          root_index.write_text('''/// <reference types="@cloudflare/workers-types" />\n\nimport commerceHandler from './commerce/index.js'\nimport governanceHandler from './governance/index.js'\n\ntype CommonEnv = Record<string, unknown>\n\nexport default {\n  async fetch(request: Request, env: CommonEnv, ctx: ExecutionContext): Promise<Response> {\n    const path = new URL(request.url).pathname\n    if (path.startsWith('/internal/governance/') || path.startsWith('/internal/moderation/')) {\n      return governanceHandler.fetch(request, env as never, ctx)\n    }\n    return commerceHandler.fetch(request, env as never, ctx)\n  },\n  async queue(batch: MessageBatch<unknown>, env: CommonEnv, ctx: ExecutionContext): Promise<void> {\n    if (typeof (governanceHandler as { queue?: unknown }).queue === 'function') {\n      await (governanceHandler as unknown as { queue: (b: MessageBatch<unknown>, e: CommonEnv, c: ExecutionContext) => Promise<void> }).queue(batch, env, ctx)\n    }\n  },\n}\n''')

          # Minimal new shells for currently non-runtime Creator / Async directories.
          for spec in 'luck05-creator:Creator' 'luck06-async:Async'; do
            name="${spec%%:*}"; role="${spec##*:}"
            d=root / f'workers/{name}'
            (d/'src').mkdir(parents=True, exist_ok=True)
            (d/'src/index.ts').write_text(f'''export default {{\n  fetch(request: Request): Response {{\n    const path = new URL(request.url).pathname\n    if (request.method === 'GET' && path == '/health') return Response.json({{ service: '{name}', status: 'ok', role: '{role}' }})\n    return new Response(null, {{ status: 404 }})\n  }},\n}}\n''')
            (d/'wrangler.jsonc').write_text('{\n  "$schema": "../../node_modules/wrangler/config-schema.json",\n  "name": "'+name+'",\n  "main": "src/index.ts",\n  "compatibility_date": "2026-10-05",\n  "workers_dev": false\n}\n')

          # Update new Worker names and transitional bindings.
          configs = {
            'workers/luck01-identity/wrangler.jsonc': {'name': 'luck01-identity'},
            'workers/luck02-content/wrangler.jsonc': {'name': 'luck02-content'},
            'workers/luck03-social/wrangler.jsonc': {'name': 'luck03-social'},
            'workers/luck04-commerce/wrangler.jsonc': {'name': 'luck04-commerce'},
          }
          for rel, vals in configs.items():
              p=root/rel; c=json.loads(p.read_text()) if p.suffix=='.json' else None
              s=p.read_text()
              import re
              s=re.sub(r'("name"\s*:\s*)"[^"]+"', r'\1"'+vals['name']+'"', s, count=1)
              p.write_text(s)

          # Content keeps the existing Payload D1 during migration and gains the Content D1 binding.
          p=root/'workers/luck02-content/wrangler.jsonc'
          s=p.read_text()
          s=s.replace('''      "binding": "W02_AUTH",\n      "service": "luckread-w02"''','''      "binding": "W02_AUTH",\n      "service": "luck01-identity"''')
          s=s.replace('''    {\n      "binding": "W03_CONTENT",\n      "service": "luckread-w03"\n    },\n''','')
          s=s.replace('''      "binding": "W05_SOCIAL",\n      "service": "luckread-w05"''','''      "binding": "W05_SOCIAL",\n      "service": "luck03-social"''')
          s=s.replace('''      "binding": "W06_MODERATION",\n      "service": "luckread-w06"''','''      "binding": "W06_MODERATION",\n      "service": "luck04-commerce"''')
          s=s.replace('''      "binding": "W07_SUBSCRIPTION",\n      "service": "luckread-w07"''','''      "binding": "W07_SUBSCRIPTION",\n      "service": "luck04-commerce"''')
          needle='''      "database_name": "luckread",\n      "remote": true\n    }'''
          if '"binding": "D1_02"' not in s:
              s=s.replace(needle, needle+',\n    {\n      "binding": "D1_02",\n      "database_id": "6c342634-97f6-4248-9f4a-85772af4f22c",\n      "database_name": "luckreadpro",\n      "migrations_dir": "src/content-domain/migrations"\n    }')
          p.write_text(s)

          # Social gets the already-existing projection KV + queue consumer, but remains one Worker.
          p=root/'workers/luck03-social/wrangler.jsonc'
          s=p.read_text()
          insertion='''  "kv_namespaces": [\n    {\n      "binding": "AUTH013_W04_DERIVED_PROJECTION",\n      "id": "32f7e407128a43d59720d5d46736e084"\n    }\n  ],\n  "queues": {\n    "consumers": [\n      {\n        "queue": "luckread-auth013-account-state-projection",\n        "max_batch_size": 10,\n        "max_batch_timeout": 5,\n        "max_retries": 5,\n        "dead_letter_queue": "luckread-auth013-account-state-projection-dlq"\n      }\n    ]\n  },\n'''
          if 'AUTH013_W04_DERIVED_PROJECTION' not in s:
              s=s.replace('''  "d1_databases": [\n''', insertion+'  "d1_databases": [\n')
          p.write_text(s)

          # Commerce uses its existing D1 for compatibility and governance keeps its current D1 until 4-D1 consolidation.
          p=root/'workers/luck04-commerce/wrangler.jsonc'
          s=p.read_text()
          s=s.replace('''      "binding": "D1_01",''','''      "binding": "D1_01",''')
          if '"binding": "D1_03"' not in s:
              s=s.replace('''  "ratelimits": [''','''  "services": [\n    { "binding": "W03_CONTENT_MODERATION", "service": "luck02-content" }\n  ],\n  "d1_databases": [\n    { "binding": "D1_01", "database_name": "luckread", "database_id": "2f80471e-3756-49f9-8db1-7707a433ad64" },\n    { "binding": "D1_03", "database_name": "secondary", "database_id": "bda1d247-a371-4244-91ae-aef96034db7f", "migrations_dir": "governance/migrations" }\n  ],\n  "ratelimits": [''')
              # Remove the old single D1 block inserted by the copied commerce config if duplicate.
              import re
              s=re.sub(r'\n  "d1_databases": \[\n    \{\n      "binding": "D1_01",\n      "database_name": "luckread",\n      "database_id": "2f80471e-3756-49f9-8db1-7707a433ad64",\n      "migrations_dir": "migrations"\n    \}\n  \],', '', s, count=1)
          p.write_text(s)

          # Local Content client: keep auth compatibility, eliminate Content Worker RPC.
          p=root/'workers/luck02-content/src/content/w03-content-client.ts'
          s=p.read_text()
          if "../content-domain/index.js" not in s:
              s=s.replace("import { getPayload } from 'payload'\n", "import { getPayload } from 'payload'\nimport contentHandler from '../content-domain/index.js'\n")
          start=s.index('async function getW03Service(): Promise<W03ContentService> {')
          end=s.index('\n}\n\nconst getPayloadCookieToken', start)+3
          s=s[:start]+s[end:]
          old='''  const service = await getW03Service()\n'''
          s=s.replace(old, '''  const context = await getCloudflareContext({ async: true })\n  const env = context.env as unknown as { D1_02: D1Database }\n''')
          call='''  const response = await service.fetch(\n    new Request(`https://luckread-w03.internal${input.pathname}`, {\n      method: input.method,\n      headers,\n      body,\n    }),\n  )\n'''
          repl='''  headers.set('X-LuckRead-Correlation-Id', headers.get('X-LuckRead-Correlation-Id') ?? crypto.randomUUID())\n  const response = await contentHandler.fetch(\n    new Request(`https://luckread-content.internal${input.pathname}`, {\n      method: input.method,\n      headers,\n      body,\n    }),\n    env,\n  )\n'''
          if call in s: s=s.replace(call,repl)
          s=s.replace('''type W03ContentService = {\n  fetch(input: RequestInfo | URL, init?: RequestInit): Promise<Response>\n}\n\n''','')
          p.write_text(s)

          # CI/scripts: update physical paths, not locked docs and not old1.0 archive.
          path_map={
            'workers/W01-payload':'workers/luck02-content',
            'workers/W02-identity':'workers/luck01-identity',
            'workers/W03-content':'workers/luck02-content',
            'workers/W04-feed-search':'workers/luck03-social',
            'workers/W05-social':'workers/luck03-social',
            'workers/W06-governance':'workers/luck04-commerce',
            'workers/W07-subscription-commerce':'workers/luck04-commerce',
            'workers/W08-creator':'workers/luck05-creator',
            'workers/W10-async':'workers/luck06-async',
          }
          for base in [root/'.github/workflows', root/'scripts']:
              for p in base.rglob('*'):
                  if not p.is_file(): continue
                  try: t=p.read_text()
                  except UnicodeDecodeError: continue
                  if 'old1.0' in str(p): continue
                  nt=t
                  for a,b in path_map.items(): nt=nt.replace(a,b)
                  if nt!=t: p.write_text(nt)

          PY

          # Remove one-time migration runners after their own work is committed.
          rm -f .github/workflows/one-time-1.1-six-worker-migration.yml .github/workflows/one-time-1.1-six-worker-wiring.yml

          git add workers .github/workflows scripts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(1.1): wire six-worker runtime boundaries [skip ci]'
          git push origin "HEAD:${{ github.head_ref }}"
