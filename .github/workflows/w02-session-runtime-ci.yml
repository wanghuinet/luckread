  workflow_dispatch:

permissions:
  contents: read

jobs:
  better-auth-principal:
    name: W02 Better Auth Principal Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify session rate-limit bindings reuse established namespaces
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const config = JSON.parse(fs.readFileSync('workers/W02-identity/wrangler.jsonc', 'utf8'))
          const actual = new Map((config.ratelimits ?? []).map(binding => [binding.name, binding]))
          const expected = [
            ['AUTH_SESSION_READ_LIMITER', '2026100312', 300],
            ['AUTH_SESSION_WRITE_LIMITER', '2026100320', 60],
          ]
          for (const [name, namespaceId, limit] of expected) {
            const binding = actual.get(name)
            if (!binding || binding.namespace_id !== namespaceId ||
                binding.simple?.limit !== limit || binding.simple?.period !== 60) {
              throw new Error('invalid session rate-limit binding: ' + name)
            }
          }
          console.log(JSON.stringify({ sessionRateLimitBindings: expected.map(([name]) => name) }))
          NODE
      - name: Validate AUTH-010 remote evidence probe syntax
        run: node --check scripts/auth-010-session-runtime-e2e.mjs
      - name: Install W02 runtime dependencies for MFA tests
        working-directory: workers/W02-identity
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Run W02 username change authority tests
        run: npx vitest@3.2.4 run workers/W02-identity/src/auth/username-change.test.ts
      - name: Audit W02 username history migration with local SQLite only
        run: node scripts/w02-username-change-migration-static-audit.mjs
      - name: Run W02 principal, Resend, session-list and session-revoke tests
        run: npx vitest@3.2.4 run workers/W02-identity/src/auth/principal.test.ts workers/W02-identity/src/auth/resend-email.test.ts workers/W02-identity/src/auth/session-list.test.ts workers/W02-identity/src/auth/session-rate-limit.test.ts workers/W02-identity/src/auth/session-revoke.test.ts
      - name: Run W02 AUTH-007 MFA lifecycle and replay tests
        run: npx vitest@3.2.4 run workers/W02-identity/src/auth/mfa-status.test.ts workers/W02-identity/src/auth/mfa-enrollment-start.test.ts workers/W02-identity/src/auth/mfa-enrollment-confirm.test.ts workers/W02-identity/src/auth/totp-replay-guard.test.ts workers/W02-identity/src/auth/mfa-challenge-account-state.test.ts workers/W02-identity/src/auth/mfa-challenge-verification.test.ts workers/W02-identity/src/auth/mfa-lifecycle-contract.test.ts
      - name: Run W02 AUTH-007 durable receipt and scheduled-publication tests
        run: npx vitest@3.2.4 run workers/W02-identity/src/auth/mfa-audit-receipts.test.ts workers/W02-identity/src/auth/scheduled-publication.test.ts
      - name: Audit AUTH-007 receipt migration constraints with local SQLite only
        run: node scripts/auth-007-mfa-operation-receipts-static-audit.mjs
      - name: Test AUTH-007 publication timestamps and exact MFA audit eventId reconciliation
        run: |
          node --check scripts/auth-007-mfa-audit-delivery-e2e.mjs
          node --test scripts/auth-007-mfa-audit-evidence.test.mjs
      - name: Verify W02 read-only Cron, Tail and Observability probes
        run: |
          node --check scripts/auth-007-probe-w02-cron-schedule.mjs
          node --test scripts/auth-007-probe-w02-cron-schedule.test.mjs
          node --check scripts/auth-007-probe-w02-tail-access.mjs
          node --test scripts/auth-007-probe-w02-tail-access.test.mjs
          node --check scripts/auth-007-probe-w02-observability.mjs
          node --test scripts/auth-007-probe-w02-observability.test.mjs
          node --check scripts/auth-007-probe-w02-scheduled-analytics.mjs
          node --test scripts/auth-007-probe-w02-scheduled-analytics.test.mjs

      - name: Verify AUTH-007 rollout admission code without production access
        run: node scripts/verify-auth-007-rollout-admission.mjs --static-only

  account-state-boundary:
    name: W02 Account State Boundary Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run W02 account-state tests
        run: npx vitest@3.2.4 run workers/W02-identity/src/account/account-state-transition.test.ts
