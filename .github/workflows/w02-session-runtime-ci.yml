name: W02 Better Auth Boundary CI

on:
  push:
    branches: [main]
    paths:
      - 'workers/W02-identity/src/auth/**'
      - 'workers/W02-identity/src/authz/**'
      - 'workers/W02-identity/src/account/**'
      - 'workers/W02-identity/src/index.ts'
      - '.github/workflows/w02-session-runtime-ci.yml'
  pull_request:
    paths:
      - 'workers/W02-identity/src/auth/**'
      - 'workers/W02-identity/src/authz/**'
      - 'workers/W02-identity/src/account/**'
      - 'workers/W02-identity/src/index.ts'
      - '.github/workflows/w02-session-runtime-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  better-auth-principal:
    name: W02 Better Auth Principal Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run W02 principal and Resend delivery tests
        run: npx vitest@3.2.4 run workers/W02-identity/src/auth/principal.test.ts workers/W02-identity/src/auth/resend-email.test.ts

  account-state-boundary:
    name: W02 Account State Boundary Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run W02 account-state tests
        run: npx vitest@3.2.4 run workers/W02-identity/src/account/account-state-transition.test.ts
