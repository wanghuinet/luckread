name: W09 D1-03 Push Endpoint Migration

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact merged main SHA containing the W09 D1-03 push endpoint migration
        required: true
        type: string
      confirm:
        description: Type APPLY_W09_D1_03_PUSH_ENDPOINT_MIGRATION to permit remote D1 mutation
        required: true
        type: string

permissions:
  contents: read

env:
  WRANGLER_VERSION: 4.116.0
  EXPECTED_WORKER: luckread-w09
  EXPECTED_DB_ID: bda1d247-a371-4244-91ae-aef96034db7f
  EXPECTED_DB_NAME: secondary

jobs:
  migrate:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'APPLY_W09_D1_03_PUSH_ENDPOINT_MIGRATION' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate exact source SHA
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'

      - name: Checkout exact merged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Verify main ancestry and exact D1 target
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('workers/W09-platform/wrangler.d1-03-migrations.jsonc').read_text())
          assert config['name'] == 'luckread-w09'
          bindings = config['d1_databases']
          assert len(bindings) == 1
          target = bindings[0]
          assert target['binding'] == 'D1_03'
          assert target['database_name'] == 'secondary'
          assert target['database_id'] == 'bda1d247-a371-4244-91ae-aef96034db7f'
          assert target['migrations_dir'] == 'migrations-d1-03'
          migration = Path('workers/W09-platform/migrations-d1-03/0001_notification_push_endpoints.sql')
          assert migration.is_file()
          assert 'MIG-NOTIFY-002-PUSH-ENDPOINTS-V1' in migration.read_text()
          assert not list(Path('workers/W09-platform/migrations-d1-03').glob('*.sql')) == []
          print('W09_D1_03_PUSH_ENDPOINT_SOURCE=PASS')
          PY

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify migration statically against SQLite
        run: |
          set -euo pipefail
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          path = Path('workers/W09-platform/migrations-d1-03/0001_notification_push_endpoints.sql')
          db = sqlite3.connect(':memory:')
          db.executescript(path.read_text())
          columns = [r[1] for r in db.execute('PRAGMA table_info("notification_push_endpoints")')]
          expected = ['endpoint_id','installation_id','owner_user_id','provider','platform','push_token','permission_status','app_version','created_at','updated_at','last_seen_at']
          if columns != expected:
              raise SystemExit(f'unexpected push endpoint schema: {columns}')
          indexes = {r[1] for r in db.execute('PRAGMA index_list("notification_push_endpoints")')}
          required = {'sqlite_autoindex_notification_push_endpoints_1','uq_notification_push_endpoints_provider_token','ix_notification_push_endpoints_owner_status'}
          if not required.issubset(indexes):
              raise SystemExit(f'missing push endpoint indexes: {required - indexes}')
          db.execute(
              'INSERT INTO notification_push_endpoints VALUES (?,?,?,?,?,?,?,?,?,?,?)',
              ('ep1','6b6d9f5a-4e61-4c50-9d17-9e97f36e6e3c','user1','expo','ios','ExponentPushToken[abcdefghijklmnop_1234567890]','granted','1.0.0','now','now','now'),
          )
          db.execute(
              'INSERT INTO notification_push_endpoints VALUES (?,?,?,?,?,?,?,?,?,?,?)',
              ('ep2','6b6d9f5a-4e61-4c50-9d17-9e97f36e6e3d','user2','expo','android',None,'denied',None,'now','now','now'),
          )
          try:
              db.execute(
                  'INSERT INTO notification_push_endpoints VALUES (?,?,?,?,?,?,?,?,?,?,?)',
                  ('ep3','6b6d9f5a-4e61-4c50-9d17-9e97f36e6e3e','user3','expo','ios','ExponentPushToken[abcdefghijklmnop_1234567890]','granted',None,'now','now','now'),
              )
          except sqlite3.IntegrityError:
              pass
          else:
              raise SystemExit('duplicate Expo token was accepted')
          try:
              db.execute(
                  'INSERT INTO notification_push_endpoints VALUES (?,?,?,?,?,?,?,?,?,?,?)',
                  ('ep4','6b6d9f5a-4e61-4c50-9d17-9e97f36e6e3f','user4','expo','ios','ExponentPushToken[abcdefghijklmnop_1234567890]','denied',None,'now','now','now'),
              )
          except sqlite3.IntegrityError:
              pass
          else:
              raise SystemExit('denied permission retained a push token')
          print('W09_D1_03_PUSH_ENDPOINT_SQLITE=PASS')
          PY

      - name: Apply only the D1-03 migration directory remotely
        working-directory: workers/W09-platform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" d1 migrations apply "$EXPECTED_DB_NAME" --remote --config wrangler.d1-03-migrations.jsonc

      - name: Verify remote migration ledger, schema and indexes
        working-directory: workers/W09-platform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" d1 execute "$EXPECTED_DB_NAME" --remote --json --config wrangler.d1-03-migrations.jsonc --command "SELECT name FROM d1_migrations WHERE name IN ('0001_notification_push_endpoints.sql','0001_notification_push_endpoints');" > /tmp/w09-push-migrations.json
          npx --yes "wrangler@$WRANGLER_VERSION" d1 execute "$EXPECTED_DB_NAME" --remote --json --config wrangler.d1-03-migrations.jsonc --command 'PRAGMA table_info("notification_push_endpoints");' > /tmp/w09-push-schema.json
          npx --yes "wrangler@$WRANGLER_VERSION" d1 execute "$EXPECTED_DB_NAME" --remote --json --config wrangler.d1-03-migrations.jsonc --command 'PRAGMA index_list("notification_push_endpoints");' > /tmp/w09-push-indexes.json
          python - <<'PY'
          import json
          def rows(path):
              value = json.load(open(path))
              return [r for item in value for r in item.get('results', [])] if isinstance(value, list) else value.get('results', [])
          migrations = rows('/tmp/w09-push-migrations.json')
          schema = rows('/tmp/w09-push-schema.json')
          indexes = {r.get('name') for r in rows('/tmp/w09-push-indexes.json')}
          expected_columns = ['endpoint_id','installation_id','owner_user_id','provider','platform','push_token','permission_status','app_version','created_at','updated_at','last_seen_at']
          if len(migrations) != 1:
              raise SystemExit(f'expected one applied migration record, got {len(migrations)}')
          if [r.get('name') for r in schema] != expected_columns:
              raise SystemExit('remote push endpoint schema does not match the contract')
          if not {'uq_notification_push_endpoints_provider_token','ix_notification_push_endpoints_owner_status'}.issubset(indexes):
              raise SystemExit('remote push endpoint indexes are incomplete')
          print('W09_D1_03_PUSH_ENDPOINT_REMOTE_SCHEMA=PASS')
          PY

      - name: Upload exact-SHA migration provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w05-d1-03-push-endpoint-migration-${{ github.run_id }}
          path: /tmp/w09-push-*.json
          if-no-files-found: ignore
          retention-days: 30
