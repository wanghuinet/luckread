name: W02 Identity Security D1-01 Migration (RoleAssignment + MFA + L8 Bootstrap)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact implementation commit containing the approved migration
        required: true
        type: string
      database_name:
        description: Current Cloudflare display name for the D1-01 UUID bound in wrangler.jsonc
        required: true
        type: string
      confirm:
        description: Type APPLY to permit remote D1 mutation
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    if: ${{ inputs.confirm == 'APPLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout protected main for source validation
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate immutable source SHA is committed to main
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if ! [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_sha must be a full 40-character commit SHA"
            exit 1
          fi
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main || {
            echo "source_sha must be an immutable commit already contained in protected main"
            exit 1
          }

      - name: Checkout exact implementation commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify D1-01 target binding
        working-directory: workers/W02-identity
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')); const d=c.d1_databases?.find(x=>x.binding==='D1_01'); if(!d) throw new Error('D1_01 binding missing'); if(d.database_name !== process.env.EXPECTED_DB_NAME) throw new Error('database_name input must equal configured D1_01 database_name'); if(d.database_id !== process.env.EXPECTED_DB_ID) throw new Error('D1_01 database_id does not match controlled target'); console.log(JSON.stringify(d,null,2))" 
        env:
          EXPECTED_DB_NAME: ${{ inputs.database_name }}
          EXPECTED_DB_ID: 2f80471e-3756-49f9-8db1-7707a433ad64

      - name: Verify RoleAssignment migration artifact
        run: node scripts/generate-role-assignment-migration.mjs
      - name: Assert generated RoleAssignment migration is committed
        run: git diff --exit-code -- workers/W02-identity/migrations/0001_role_assignments.sql
      - name: Verify role_version migration artifact
        run: node scripts/generate-role-version-migration.mjs
      - name: Assert generated role_version migration is committed
        run: git diff --exit-code -- workers/W02-identity/migrations/0003_role_authorization_versions.sql

      - name: Verify reviewed MFA and one-time L8 migration artifacts
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          const mfa = fs.readFileSync('workers/W02-identity/migrations/0006_better_auth_two_factor.sql', 'utf8')
          const bootstrap = fs.readFileSync('workers/W02-identity/migrations/0007_l8_genesis_bootstrap_audit.sql', 'utf8')
          for (const field of ['two_factor_enabled', 'mfa_enrolled_at', 'CREATE TABLE "twoFactor"', 'verified', 'failedVerificationCount', 'lockedUntil', 'user_mfa_enable_revoke_sessions', 'user_mfa_disable_clear_enrollment']) {
            if (!mfa.includes(field)) throw new Error('MFA migration missing required schema/lifecycle element: ' + field)
          }
          for (const field of ['CREATE TABLE l8_genesis_bootstrap_audit', "bootstrap_key = 'first-l8'", 'nonce_sha256', 'request_merge_sha', 'approved_reviewers_json', 'workflow_run_id']) {
            if (!bootstrap.includes(field)) throw new Error('L8 audit migration missing required guard/provenance element: ' + field)
          }
          console.log('W02 MFA/L8 migration artifacts: PASS')
          NODE

      - name: Apply D1-01 migration remotely
        working-directory: workers/W02-identity
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_NAME: ${{ inputs.database_name }}
        run: npx --yes wrangler@4.116.0 d1 migrations apply "$DATABASE_NAME" --remote --config wrangler.jsonc

      - name: Verify W02 identity/MFA/L8 persistence remotely
        working-directory: workers/W02-identity
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_NAME: ${{ inputs.database_name }}
        run: |
          mkdir -p ../../artifacts/mapping-0
          npx --yes wrangler@4.116.0 d1 execute "$DATABASE_NAME" --remote --config wrangler.jsonc \
            --command "SELECT type, name, sql FROM sqlite_master WHERE name = 'role_assignments' OR name LIKE 'role_assignments_%' OR name = 'role_authorization_versions' OR name LIKE 'role_authorization_versions_%' OR name IN ('twoFactor', 'l8_genesis_bootstrap_audit', 'user_mfa_enable_revoke_sessions', 'user_mfa_disable_clear_enrollment') OR name = 'user' ORDER BY type, name;" \
            > ../../artifacts/mapping-0/w02-role-assignment-remote-schema.txt
          npx --yes wrangler@4.116.0 d1 execute "$DATABASE_NAME" --remote --config wrangler.jsonc \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name='d1_migrations';" \
            > ../../artifacts/mapping-0/w02-role-assignment-remote-ledger-check.txt
          npx --yes wrangler@4.116.0 d1 execute "$DATABASE_NAME" --remote --config wrangler.jsonc \
            --command "SELECT * FROM d1_migrations ORDER BY id;" \
            > ../../artifacts/mapping-0/w02-role-assignment-remote-ledger.txt
          npx --yes wrangler@4.116.0 d1 execute "$DATABASE_NAME" --remote --config wrangler.jsonc \
            --command "SELECT name FROM d1_migrations WHERE name LIKE '%0006_better_auth_two_factor.sql' OR name LIKE '%0007_l8_genesis_bootstrap_audit.sql' ORDER BY name;" \
            > ../../artifacts/mapping-0/w02-mfa-l8-migration-ledger-check.txt
          npx --yes wrangler@4.116.0 d1 execute "$DATABASE_NAME" --remote --config wrangler.jsonc \
            --command "SELECT name FROM sqlite_master WHERE type = 'trigger' AND name IN ('user_mfa_enable_revoke_sessions', 'user_mfa_disable_clear_enrollment') ORDER BY name;" \
            > ../../artifacts/mapping-0/w02-mfa-lifecycle-trigger-readback.txt
          npx --yes wrangler@4.116.0 d1 execute "$DATABASE_NAME" --remote --config wrangler.jsonc \
            --command "SELECT COUNT(*) AS role_assignment_rows FROM role_assignments;" \
            > ../../artifacts/mapping-0/w02-role-assignment-remote-row-count.txt

          npx --yes wrangler@4.116.0 d1 execute "$DATABASE_NAME" --remote --config wrangler.jsonc \
            --command "SELECT COUNT(*) AS role_version_rows, MIN(role_version) AS min_role_version, MAX(role_version) AS max_role_version FROM role_authorization_versions;" \
            > ../../artifacts/mapping-0/w02-role-version-remote-row-count.txt

          for expected in twoFactor l8_genesis_bootstrap_audit user_mfa_enable_revoke_sessions user_mfa_disable_clear_enrollment; do
            grep -q "$expected" ../../artifacts/mapping-0/w02-role-assignment-remote-schema.txt || { echo "Missing deployed schema object: $expected"; exit 1; }
          done
          for expected in 0006_better_auth_two_factor.sql 0007_l8_genesis_bootstrap_audit.sql; do
            grep -q "$expected" ../../artifacts/mapping-0/w02-mfa-l8-migration-ledger-check.txt || { echo "Migration not present in D1 ledger: $expected"; exit 1; }
          done
          for expected in user_mfa_enable_revoke_sessions user_mfa_disable_clear_enrollment; do
            grep -q "$expected" ../../artifacts/mapping-0/w02-mfa-lifecycle-trigger-readback.txt || { echo "Missing deployed MFA lifecycle trigger: $expected"; exit 1; }
          done

      - name: Write controlled provenance
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          DATABASE_NAME: ${{ inputs.database_name }}
        run: |
          cat > artifacts/mapping-0/w02-role-assignment-remote-provenance.txt <<'EOF'
          workflow=W02 Identity Security D1-01 Migration
          source_sha=$SOURCE_SHA
          database_name=$DATABASE_NAME
          binding=D1_01
          database_id=2f80471e-3756-49f9-8db1-7707a433ad64
          remote_mutation=true
          post_migration_remote_readback=true
          verification_scope=RoleAssignment, MFA/TOTP, L8 audit and MFA lifecycle-trigger schema, D1 migration ledger, row-count
          EOF

      - name: Upload controlled remote evidence
        uses: actions/upload-artifact@v4
        with:
          name: w02-role-assignment-d1-01-remote-evidence-${{ inputs.source_sha }}
          path: |
            artifacts/mapping-0/w02-role-assignment-remote-*
            artifacts/mapping-0/w02-mfa-l8-migration-ledger-check.txt
            artifacts/mapping-0/w02-mfa-lifecycle-trigger-readback.txt
