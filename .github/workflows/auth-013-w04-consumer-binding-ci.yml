name: AUTH-013 W04 Consumer Binding CI

on:
  pull_request:
    paths:
      - "workers/W04-feed-search/**"
      - "artifacts/mapping-0/auth013-w04-derived-projection-destination-authorized-2026-09-29.json"
      - "contracts/events/identity-account-state-changed.v1.json"
  push:
    branches: [main]
    paths:
      - "workers/W04-feed-search/**"
      - "artifacts/mapping-0/auth013-w04-derived-projection-destination-authorized-2026-09-29.json"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run workers/W04-feed-search/src/auth-013-projection.test.ts
      - run: npx tsc --noEmit
      - name: Validate fixed topology and binding declarations
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs')
          const w=fs.readFileSync('workers/W04-feed-search/wrangler.jsonc','utf8')
          if(!w.includes('"name": "luckread-w04"')) throw new Error('W04 identity mismatch')
          if(!w.includes('"binding": "AUTH013_W04_DERIVED_PROJECTION"')) throw new Error('KV binding missing')
          if(!w.includes('"id": "32f7e407128a43d59720d5d46736e084"')) throw new Error('KV namespace mismatch')
          if(!w.includes('"queue": "luckread-auth013-account-state-projection"')) throw new Error('Queue consumer missing')
          if(!w.includes('"dead_letter_queue": "luckread-auth013-account-state-projection-dlq"')) throw new Error('DLQ binding missing')
          if(w.includes('d1_databases')) throw new Error('W04 must not gain D1')
          NODE

  deploy-and-verify:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy W04 with admitted bindings
        working-directory: workers/W04-feed-search
        run: npx --yes wrangler@4.116.0 deploy
      - name: Verify live W04 consumer and binding
        shell: bash
        run: |
          set -euo pipefail
          AUTH=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          queues="$(curl -fsS --retry 3 --retry-all-errors "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues?per_page=100" "${AUTH[@]}")"
          jq -e --arg q "luckread-auth013-account-state-projection" '.result[]? | select(.queue_name==$q) | .consumers[]? | select(.script_name=="luckread-w04" and .type=="worker" and .dead_letter_queue=="luckread-auth013-account-state-projection-dlq")' <<<"$queues"
          jq -e --arg q "luckread-auth013-account-state-projection" '.result[]? | select(.queue_name==$q) | .consumers_total_count == 1' <<<"$queues"
          echo "W04 live queue consumer and DLQ binding verified"
