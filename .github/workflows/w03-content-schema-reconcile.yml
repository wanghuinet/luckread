name: W03 Content Schema Reconciliation

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit containing W03 migrations 0001-0013 (leave blank to use this workflow revision)
        required: false
        default: ""
        type: string
      confirm:
        description: Explicitly authorize the controlled remote D1-02 migration
        required: true
        default: STOP
        type: choice
        options:
          - STOP
          - APPLY_W03_CONTENT_SCHEMA

permissions:
  contents: read

env:
  WRANGLER_VERSION: 4.116.0
  EXPECTED_DB_ID: 6c342634-97f6-4248-9f4a-85772af4f22c
  EXPECTED_DB_NAME: luckreadpro
  EXPECTED_WORKER: luckread-w03
  EXPECTED_BINDING: D1_02

jobs:
  reconcile:
    if: ${{ inputs.confirm == 'APPLY_W03_CONTENT_SCHEMA' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate source SHA
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'

      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact source and target physical binding
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('workers/W03-content/wrangler.jsonc', 'utf8'));
          if (config.name !== process.env.EXPECTED_WORKER) throw new Error('Unexpected W03 worker name');
          if (config.main !== 'src/index.ts') throw new Error('Unexpected W03 entrypoint');
          const bindings = (config.d1_databases ?? []).filter((x) => x.binding === process.env.EXPECTED_BINDING);
          if (bindings.length !== 1 || bindings[0].database_name !== process.env.EXPECTED_DB_NAME ||
              bindings[0].database_id !== process.env.EXPECTED_DB_ID) {
            throw new Error('W03 D1_02 physical binding does not match the authorized production target');
          }
          const expected = [
            '0001_content_core.sql',
            '0002_content_2_0_types_media.sql',
            '0003_creator_list_pagination_index.sql',
            '0004_content_revision_history.sql',
            '0005_content_stable_slug.sql',
            '0006_content_relationships.sql',
            '0007_content_series.sql',
            '0008_series_membership_ordering.sql',
            '0009_content_collections.sql',
            '0010_collection_membership_ordering.sql',
            '0011_content_scheduled_publish.sql',
            '0012_content_snowflake_id_allocator.sql',
            '0013_content_access_mode.sql',
          ];
          const actual = fs.readdirSync('workers/W03-content/migrations')
            .filter((name) => /^\d{4}_.+\.sql$/.test(name))
            .sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error('W03 migration chain differs from the reviewed 0001-0013 sequence: ' + JSON.stringify(actual));
          }
          console.log(JSON.stringify({
            sourceSha: process.env.SOURCE_SHA,
            worker: config.name,
            d1Binding: process.env.EXPECTED_BINDING,
            databaseName: process.env.EXPECTED_DB_NAME,
            databaseId: process.env.EXPECTED_DB_ID,
            migrationCount: actual.length,
          }));
          NODE

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify static migration chain in SQLite
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          migration_dir = Path('workers/W03-content/migrations')
          files = sorted(migration_dir.glob('[0-9][0-9][0-9][0-9]_*.sql'))
          db = sqlite3.connect(':memory:')
          db.execute('PRAGMA foreign_keys = ON')
          for path in files:
              db.executescript(path.read_text())
          required = {
              'contents': {'id', 'content_type', 'owner_user_id', 'creator_id', 'ip_id', 'state',
                  'version', 'revision', 'slug', 'scheduled_at', 'title', 'body_ref',
                  'media_refs_json', 'cover_ref', 'etag', 'created_at', 'updated_at', 'access_mode'},
              'content_revisions': {'id', 'content_id', 'revision', 'content_version', 'actor_user_id',
                  'operation', 'state', 'slug', 'title', 'body_ref', 'media_refs_json',
                  'cover_ref', 'etag', 'correlation_id', 'created_at', 'access_mode'},
              'content_relationships': {'relationship_id', 'relation_type', 'position'},
              'content_series': {'id', 'owner_user_id', 'state'},
              'content_collections': {'id', 'owner_user_id', 'state'},
              'content_id_snowflake_state': {'id', 'last_timestamp_ms', 'sequence'},
          }
          for table, columns in required.items():
              present = {row[1] for row in db.execute(f'PRAGMA table_info("{table}")')}
              missing = columns - present
              if missing:
                  raise SystemExit(f'{table} missing columns after full migration chain: {sorted(missing)}')
          allocator = db.execute('SELECT id, last_timestamp_ms, sequence FROM content_id_snowflake_state').fetchall()
          if allocator != [(1, -1, 4095)]:
              raise SystemExit(f'unexpected initial Snowflake allocator state: {allocator!r}')
          print('W03_MIGRATIONS_0001_0013_STATIC=PASS')
          PY

      - name: Capture remote migration history and schema
        working-directory: workers/W03-content
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          # Keep successful JSON output machine-readable, but print bounded CLI diagnostics
          # when Wrangler sends an error to stdout (which the original redirect hid).
          run_d1_query() {
            local output_file="$1"
            local label="$2"
            local sql="$3"
            local stderr_file
            local rc
            stderr_file="$(mktemp)"
            set +e
            npx --yes "wrangler@$WRANGLER_VERSION" d1 execute "$EXPECTED_DB_NAME" --remote --json --config wrangler.jsonc \
              --command "$sql" > "$output_file" 2> "$stderr_file"
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "::error title=Remote D1 inspection failed::$label exited with code $rc"
              echo "Wrangler stderr (last 80 lines):"
              sed -E 's/(Bearer )[[:alnum:]_.-]+/\1[REDACTED]/g; s/(api[_ -]?token[=: ]+)[^[:space:]]+/\1[REDACTED]/Ig' "$stderr_file" | tail -n 80
              echo "Wrangler stdout (last 80 lines):"
              sed -E 's/(Bearer )[[:alnum:]_.-]+/\1[REDACTED]/g; s/(api[_ -]?token[=: ]+)[^[:space:]]+/\1[REDACTED]/Ig' "$output_file" | tail -n 80
              rm -f "$stderr_file"
              exit "$rc"
            fi
            rm -f "$stderr_file"
          }

          run_d1_query /tmp/w03-migration-history.json "Read d1_migrations ledger" \
            "SELECT name FROM d1_migrations ORDER BY name;"
          # D1 rejects long compound SELECT statements. Read each table's columns
          # separately and capture object metadata with one non-compound query.
          for table in contents content_revisions content_relationships content_series content_collections content_id_snowflake_state; do
            run_d1_query "/tmp/w03-schema-before-${table}.json" "Inspect columns for ${table}" \
              "SELECT '${table}' AS table_name, name AS column_name FROM pragma_table_info('${table}');"
          done
          run_d1_query /tmp/w03-schema-before-objects.json "Inspect W03 tables and triggers" \
            "SELECT name AS table_name,
                    CASE WHEN type='table' THEN '__TABLE__' ELSE '__TRIGGER__' END AS column_name
             FROM sqlite_master
             WHERE (type='table' AND name IN ('contents','content_revisions','content_relationships','content_series','content_collections','content_mutation_idempotency','content_outbox_events','content_txn_guard','content_id_snowflake_state'))
                OR (type='trigger' AND name IN ('contents_after_insert_outbox','contents_after_update_outbox'));"

      - name: Gate remote drift before any migration
        id: gate_remote_drift
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const expected = [
            '0001_content_core.sql',
            '0002_content_2_0_types_media.sql',
            '0003_creator_list_pagination_index.sql',
            '0004_content_revision_history.sql',
            '0005_content_stable_slug.sql',
            '0006_content_relationships.sql',
            '0007_content_series.sql',
            '0008_series_membership_ordering.sql',
            '0009_content_collections.sql',
            '0010_collection_membership_ordering.sql',
            '0011_content_scheduled_publish.sql',
            '0012_content_snowflake_id_allocator.sql',
            '0013_content_access_mode.sql',
          ];
          function rowsFrom(file) {
            const root = JSON.parse(fs.readFileSync(file, 'utf8'));
            const rows = [];
            function visit(value) {
              if (Array.isArray(value)) { for (const item of value) visit(item); return; }
              if (!value || typeof value !== 'object') return;
              if (Array.isArray(value.results)) {
                for (const row of value.results) if (row && typeof row === 'object') rows.push(row);
              }
              for (const [key, child] of Object.entries(value)) if (key !== 'results') visit(child);
            }
            visit(root);
            return rows;
          }
          const appliedAll = rowsFrom('/tmp/w03-migration-history.json')
            .map((row) => row.name).filter((name) => typeof name === 'string').sort();
          if (new Set(appliedAll).size !== appliedAll.length) throw new Error('Remote d1_migrations has duplicate names');
          // D1-02 is shared by several LuckRead subsystems. Do not mistake their
          // timestamped social migrations for W03 migrations: only compare the
          // exact W03 migration identities and require their own order to be a prefix.
          const appliedSet = new Set(appliedAll);
          const applied = appliedAll.filter((name) => expected.includes(name));
          if (JSON.stringify(applied) !== JSON.stringify(expected.slice(0, applied.length))) {
            throw new Error('W03 migration history is not a prefix of the reviewed chain: ' + JSON.stringify(applied));
          }
          const schemaRows = [
            'contents', 'content_revisions', 'content_relationships', 'content_series', 'content_collections', 'content_id_snowflake_state',
          ].flatMap((table) => rowsFrom('/tmp/w03-schema-before-' + table + '.json'))
            .concat(rowsFrom('/tmp/w03-schema-before-objects.json'));
          const tables = new Set(schemaRows.filter((row) => row.column_name === '__TABLE__').map((row) => row.table_name));
          const triggers = new Set(schemaRows.filter((row) => row.column_name === '__TRIGGER__').map((row) => row.table_name));
          const columns = (table) => new Set(schemaRows.filter((row) => row.table_name === table && !String(row.column_name).startsWith('__')).map((row) => row.column_name));
          const hasAccessMode = columns('contents').has('access_mode') || columns('content_revisions').has('access_mode');
          const alreadyFullyMigrated = applied.length === expected.length;
          if (alreadyFullyMigrated) {
            const needed = {
              contents: ['id','content_type','owner_user_id','creator_id','ip_id','state','version','revision',
                'slug','scheduled_at','title','body_ref','media_refs_json','cover_ref','etag','created_at','updated_at','access_mode'],
              content_revisions: ['id','content_id','revision','content_version','actor_user_id','operation','state',
                'slug','title','body_ref','media_refs_json','cover_ref','etag','correlation_id','created_at','access_mode'],
              content_relationships: ['relationship_id', 'relation_type', 'position'],
              content_series: ['id', 'owner_user_id'],
              content_collections: ['id', 'owner_user_id'],
              content_id_snowflake_state: ['id', 'last_timestamp_ms', 'sequence'],
            };
            const missing = Object.entries(needed).flatMap(([table, names]) =>
              !tables.has(table) ? [table + ' table'] : names.filter((name) => !columns(table).has(name)).map((name) => table + '.' + name));
            if (missing.length) throw new Error('All migrations are recorded but the live schema is still inconsistent: ' + JSON.stringify(missing));
            fs.appendFileSync(process.env.GITHUB_ENV, 'W03_MIGRATION_ACTION=none\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'action=none\n');
          } else if (applied.length === 11) {
            // Production D1-02 has the reviewed W03 0001-0011 prefix. Admit
            // migrations 0012-0013 only when the post-0011 schema is exact.
            const needed = {
              contents: ['id','content_type','owner_user_id','creator_id','ip_id','state','version','revision','slug','scheduled_at','title','body_ref','media_refs_json','cover_ref','etag','created_at','updated_at'],
              content_revisions: ['id','content_id','revision','content_version','actor_user_id','operation','state','slug','title','body_ref','media_refs_json','etag','correlation_id','created_at'],
              content_relationships: ['relationship_id','source_id','target_id','relation_type','position','status'],
              content_series: ['id','owner_user_id','creator_id','state'],
              content_collections: ['id','owner_user_id','creator_id','state'],
            };
            const missing = Object.entries(needed).flatMap(([table, names]) =>
              !tables.has(table) ? [table + ' table'] : names.filter((name) => !columns(table).has(name)).map((name) => table + '.' + name));
            const missingBaselineTables = ['contents','content_mutation_idempotency','content_outbox_events','content_txn_guard'].filter((table) => !tables.has(table));
            const missingBaselineTriggers = ['contents_after_insert_outbox','contents_after_update_outbox'].filter((trigger) => !triggers.has(trigger));
            if (missing.length || missingBaselineTables.length || missingBaselineTriggers.length ||
                tables.has('content_id_snowflake_state') || hasAccessMode) {
              throw new Error('Refusing remote mutation because live schema does not match the reviewed post-0011 state: ' +
                JSON.stringify({missing,missingBaselineTables,missingBaselineTriggers,
                  unrecordedAllocatorTable:tables.has('content_id_snowflake_state'),hasAccessMode}));
            }
            fs.appendFileSync(process.env.GITHUB_ENV, 'W03_MIGRATION_ACTION=apply\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'action=apply\n');
          } else if (applied.length === 12) {
            // The remote schema is at the reviewed post-0012 state. Migration
            // 0013 adds default-PUBLIC access mode to contents and revisions.
            const needed = {
              contents: ['id','content_type','owner_user_id','creator_id','ip_id','state','version','revision',
                'slug','scheduled_at','title','body_ref','media_refs_json','cover_ref','etag','created_at','updated_at'],
              content_revisions: ['id','content_id','revision','content_version','actor_user_id','operation','state',
                'slug','title','body_ref','media_refs_json','cover_ref','etag','correlation_id','created_at'],
              content_relationships: ['relationship_id','source_id','target_id','relation_type','position','status'],
              content_series: ['id','owner_user_id','creator_id','state'],
              content_collections: ['id','owner_user_id','creator_id','state'],
              content_id_snowflake_state: ['id','last_timestamp_ms','sequence'],
            };
            const missing = Object.entries(needed).flatMap(([table, names]) =>
              !tables.has(table) ? [table + ' table'] : names.filter((name) => !columns(table).has(name)).map((name) => table + '.' + name));
            const missingBaselineTables = ['contents','content_mutation_idempotency','content_outbox_events','content_txn_guard'].filter((table) => !tables.has(table));
            const missingBaselineTriggers = ['contents_after_insert_outbox','contents_after_update_outbox'].filter((trigger) => !triggers.has(trigger));
            if (missing.length || missingBaselineTables.length || missingBaselineTriggers.length || hasAccessMode) {
              throw new Error('Refusing remote mutation because live schema does not match the reviewed post-0012 state: ' +
                JSON.stringify({missing,missingBaselineTables,missingBaselineTriggers,hasAccessMode}));
            }
            fs.appendFileSync(process.env.GITHUB_ENV, 'W03_MIGRATION_ACTION=apply\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'action=apply\n');
          } else {
            // Retain the previously reviewed pre-0004 states for environments
            // whose W03 migration history is 0001-0002 or 0001-0003 only.
            // Any other partial/out-of-order history fails closed.
            if (![2, 3].includes(applied.length)) {
              throw new Error('Refusing remote mutation: only reviewed W03 migration prefixes 0001-0002, 0001-0003, 0001-0011, 0001-0012, or 0001-0013 are admitted; current W03 history=' + JSON.stringify(applied));
            }
            const missingTables = ['content_revisions','content_relationships','content_series','content_collections','content_id_snowflake_state'].filter((table) => tables.has(table));
            const contentCols = columns('contents');
            const unexpectedColumns = ['slug','scheduled_at','access_mode'].filter((name) => contentCols.has(name));
            if (!tables.has('contents') || !tables.has('content_mutation_idempotency') ||
                !tables.has('content_outbox_events') || !tables.has('content_txn_guard') ||
                !triggers.has('contents_after_insert_outbox') || !triggers.has('contents_after_update_outbox') ||
                missingTables.length || unexpectedColumns.length || hasAccessMode) {
              throw new Error('Refusing remote mutation because live schema does not match the observed pre-0004 state: ' +
                JSON.stringify({missingBaselineTables:['contents','content_mutation_idempotency','content_outbox_events','content_txn_guard'].filter((table) => !tables.has(table)),
                  missingBaselineTriggers:['contents_after_insert_outbox','contents_after_update_outbox'].filter((trigger) => !triggers.has(trigger)),
                  unexpectedlyPresentTables:missingTables, unexpectedlyPresentColumns:unexpectedColumns}));
            }
            fs.appendFileSync(process.env.GITHUB_ENV, 'W03_MIGRATION_ACTION=apply\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'action=apply\n');
          }
          console.log(JSON.stringify({
            sourceSha: process.env.SOURCE_SHA,
            appliedMigrations: applied,
            allAppliedMigrationCount: appliedAll.length,
            appliedW03Migrations: applied,
            pendingMigrations: alreadyFullyMigrated ? [] : expected.slice(applied.length),
            action: alreadyFullyMigrated ? 'NO_OP_SCHEMA_ALREADY_CURRENT' : 'APPLY_REVIEWED_PENDING_MIGRATIONS',
          }));
          NODE

      - name: Apply admitted pending W03 D1-02 migrations
        if: steps.gate_remote_drift.outputs.action == 'apply'
        working-directory: workers/W03-content
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" d1 migrations apply "$EXPECTED_DB_NAME" --remote --config wrangler.jsonc

      - name: Verify remote migration ledger, schema, and revision backfill
        working-directory: workers/W03-content
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" d1 execute "$EXPECTED_DB_NAME" --remote --json --config wrangler.jsonc \
            --command "SELECT name FROM d1_migrations ORDER BY name;" > /tmp/w03-migration-history-after.json
          # Read each table's columns independently to stay within D1's
          # compound-SELECT limits and produce clear per-query failures.
          for table in contents content_revisions content_relationships content_series content_collections content_id_snowflake_state; do
            npx --yes "wrangler@$WRANGLER_VERSION" d1 execute "$EXPECTED_DB_NAME" --remote --json --config wrangler.jsonc \
              --command "SELECT '${table}' AS table_name, name AS column_name FROM pragma_table_info('${table}');" \
              > "/tmp/w03-schema-after-${table}.json"
          done
          npx --yes "wrangler@$WRANGLER_VERSION" d1 execute "$EXPECTED_DB_NAME" --remote --json --config wrangler.jsonc \
            --command "SELECT name AS table_name, '__TABLE__' AS column_name FROM sqlite_master
              WHERE type='table' AND name IN ('contents','content_revisions','content_relationships','content_series','content_collections','content_mutation_idempotency','content_outbox_events','content_txn_guard','content_id_snowflake_state');" \
            > /tmp/w03-schema-after-objects.json
          npx --yes "wrangler@$WRANGLER_VERSION" d1 execute "$EXPECTED_DB_NAME" --remote --json --config wrangler.jsonc \
            --command "SELECT
              (SELECT COUNT(*) FROM contents WHERE slug IS NULL OR slug = '') AS contents_without_slug,
              (SELECT COUNT(*) FROM contents c WHERE NOT EXISTS (
                SELECT 1 FROM content_revisions r WHERE r.content_id = c.id AND r.revision = c.revision
              )) AS contents_without_current_revision_snapshot,
              (SELECT COUNT(*) FROM content_id_snowflake_state WHERE id = 1) AS snowflake_allocator_rows;" > /tmp/w03-schema-integrity.json
          node <<'NODE'
          const fs = require('node:fs');
          const expected = [
            '0001_content_core.sql',
            '0002_content_2_0_types_media.sql',
            '0003_creator_list_pagination_index.sql',
            '0004_content_revision_history.sql',
            '0005_content_stable_slug.sql',
            '0006_content_relationships.sql',
            '0007_content_series.sql',
            '0008_series_membership_ordering.sql',
            '0009_content_collections.sql',
            '0010_collection_membership_ordering.sql',
            '0011_content_scheduled_publish.sql',
            '0012_content_snowflake_id_allocator.sql',
            '0013_content_access_mode.sql',
          ];
          function rowsFrom(file) {
            const root = JSON.parse(fs.readFileSync(file, 'utf8'));
            const rows = [];
            function visit(value) {
              if (Array.isArray(value)) { for (const item of value) visit(item); return; }
              if (!value || typeof value !== 'object') return;
              if (Array.isArray(value.results)) for (const row of value.results) if (row && typeof row === 'object') rows.push(row);
              for (const [key, child] of Object.entries(value)) if (key !== 'results') visit(child);
            }
            visit(root);
            return rows;
          }
          // d1_migrations is a shared database-wide ledger. Verify the complete W03
          // chain without treating other subsystems' migration rows as W03 entries.
          const appliedAll = rowsFrom('/tmp/w03-migration-history-after.json')
            .map((row) => row.name).filter((name) => typeof name === 'string').sort();
          const applied = appliedAll.filter((name) => expected.includes(name));
          if (JSON.stringify(applied) !== JSON.stringify(expected)) {
            throw new Error('W03 migration ledger is not fully reconciled: ' + JSON.stringify(applied));
          }
          const rows = [
            'contents', 'content_revisions', 'content_relationships', 'content_series', 'content_collections', 'content_id_snowflake_state',
          ].flatMap((table) => rowsFrom('/tmp/w03-schema-after-' + table + '.json'))
            .concat(rowsFrom('/tmp/w03-schema-after-objects.json'));
          const tables = new Set(rows.filter((row) => row.column_name === '__TABLE__').map((row) => row.table_name));
          const columns = (table) => new Set(rows.filter((row) => row.table_name === table && !String(row.column_name).startsWith('__')).map((row) => row.column_name));
          const requirements = {
            contents: ['id','content_type','owner_user_id','creator_id','ip_id','state','version','revision',
              'slug','scheduled_at','title','body_ref','media_refs_json','cover_ref','etag','created_at','updated_at','access_mode'],
            content_revisions: ['id','content_id','revision','content_version','actor_user_id','operation','state',
              'slug','title','body_ref','media_refs_json','cover_ref','etag','correlation_id','created_at','access_mode'],
            content_relationships: ['relationship_id','source_id','target_id','relation_type','position','status'],
            content_series: ['id','owner_user_id','creator_id','state'],
            content_collections: ['id','owner_user_id','creator_id','state'],
          };
          const missing = Object.entries(requirements).flatMap(([table, names]) =>
            !tables.has(table) ? [table + ' table'] : names.filter((name) => !columns(table).has(name)).map((name) => table + '.' + name));
          if (missing.length) throw new Error('W03 schema still missing expected structures: ' + JSON.stringify(missing));
          const integrityRows = rowsFrom('/tmp/w03-schema-integrity.json');
          const integrity = integrityRows.find((row) => row.contents_without_slug !== undefined);
          if (!integrity || Number(integrity.contents_without_slug) !== 0 || Number(integrity.contents_without_current_revision_snapshot) !== 0 || Number(integrity.snowflake_allocator_rows) !== 1) {
            throw new Error('W03 data backfill verification failed: ' + JSON.stringify(integrity ?? integrityRows));
          }
          console.log(JSON.stringify({
            sourceSha: process.env.SOURCE_SHA,
            databaseName: process.env.EXPECTED_DB_NAME,
            databaseId: process.env.EXPECTED_DB_ID,
            migrationCount: applied.length,
            migrationLedger: 'PASS',
            schema: 'PASS',
            slugBackfill: 'PASS',
            revisionSnapshotBackfill: 'PASS',
          }));
          NODE

      - name: Capture W03 schema reconciliation provenance
        if: always()
        run: |
          mkdir -p artifacts/mapping-0/w03-content-schema-reconcile
          cat > artifacts/mapping-0/w03-content-schema-reconcile/provenance.txt <<EOF
          workflow=W03 Content Schema Reconciliation
          run_id=$GITHUB_RUN_ID
          run_attempt=$GITHUB_RUN_ATTEMPT
          source_sha=${{ inputs.source_sha || github.sha }}
          worker=$EXPECTED_WORKER
          d1_binding=$EXPECTED_BINDING
          database_name=$EXPECTED_DB_NAME
          database_id=$EXPECTED_DB_ID
          confirmation=${{ inputs.confirm }}
          migration_action=${W03_MIGRATION_ACTION:-not-reached}
          migration_execution=confirmed-only
          deployment_execution=false
          EOF

      - name: Upload W03 schema reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w03-content-schema-reconcile-${{ github.run_id }}
          path: artifacts/mapping-0/w03-content-schema-reconcile/
          if-no-files-found: error
          retention-days: 30
