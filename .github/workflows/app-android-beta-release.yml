name: LuckRead Android Beta Release

on:
  # APK builds are intentionally manual to avoid long Release builds on ordinary PRs and pushes.
  workflow_dispatch:
    inputs:
      version_name:
        description: Android versionName (AUTO uses 1.0.0-beta.<Actions run number>)
        required: true
        type: string
        default: "AUTO"
      version_code:
        description: Android versionCode (0 uses the Actions run number; published releases must exceed every prior Beta code)
        required: true
        type: number
        default: 0
      publish_release:
        description: Publish the signed APK to GitHub Releases
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Manual Beta builds stay serialized for each target ref.
  group: luckread-android-beta-release-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPO_NO_TELEMETRY: "1"
  CI: "1"

jobs:
  android-beta-release:
    name: Build and verify standalone Android Beta APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Temporary phone-test APKs must stay on preview; only explicitly published releases use production.
    environment: ${{ inputs.publish_release == true && 'production' || 'preview' }}
    env:
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID || secrets.EXPO_PROJECT_ID }}
      EXPO_UPDATE_CHANNEL: ${{ inputs.publish_release == true && 'production' || 'preview' }}
      LUCKREAD_REQUIRE_OTA_CONFIG: ${{ github.event_name == 'pull_request' && '0' || '1' }}
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Prepare stable or temporary test signing keystore
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          SIGNING_DIR="${RUNNER_TEMP}/luckread-android-signing"
          mkdir -p "$SIGNING_DIR"
          if [ "$PUBLISH_RELEASE" = "true" ] && [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD_SECRET" ] && [ -n "$ANDROID_KEY_ALIAS_SECRET" ] && [ -n "$ANDROID_KEY_PASSWORD_SECRET" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$SIGNING_DIR/luckread-release.keystore"
            chmod 600 "$SIGNING_DIR/luckread-release.keystore"
            {
              echo "ANDROID_KEYSTORE_PATH=$SIGNING_DIR/luckread-release.keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD_SECRET"
              echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS_SECRET"
              echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD_SECRET"
              echo "LUCKREAD_STABLE_SIGNING=true"
              echo "stable_signing=true" >> "$GITHUB_OUTPUT"
            } >> "$GITHUB_ENV"
            echo "Using repository-configured stable Android signing key."
          else
            if [ "$PUBLISH_RELEASE" = "true" ]; then
              echo "::error::Publishing to GitHub Releases requires the stable Android signing secrets. Disable publish_release to create a temporary phone-test APK."
              exit 1
            fi
            STORE_PASSWORD="$(openssl rand -hex 16)"
            KEY_PASSWORD="$(openssl rand -hex 16)"
            # Ensure generated one-run passwords never appear in subsequent step logs.
            echo "::add-mask::$STORE_PASSWORD"
            echo "::add-mask::$KEY_PASSWORD"
            KEY_ALIAS="luckread-beta-test"
            KEYSTORE_PATH="$SIGNING_DIR/luckread-test.keystore"
            keytool -genkeypair -noprompt -v \
              -keystore "$KEYSTORE_PATH" \
              -storetype JKS \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -dname "CN=LuckRead Beta Test, OU=Mobile, O=LuckRead, L=NA, ST=NA, C=US"
            chmod 600 "$KEYSTORE_PATH"
            {
              echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH"
              echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
              echo "LUCKREAD_STABLE_SIGNING=false"
              echo "stable_signing=false" >> "$GITHUB_OUTPUT"
            } >> "$GITHUB_ENV"
            echo "::warning::Generated a temporary signing key. This APK is for device testing only and will not be published to GitHub Releases."
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.13.1"

      # The PostHog Expo plugin invokes posthog-cli from the Gradle bundle task.
      # Pin a CLI that supports event-mode Hermes uploads (>= 0.16.0).
      - name: Install and verify PostHog CLI
        run: |
          npm install --global @posthog/cli@0.19.0
          POSTHOG_CLI_BIN="$(command -v posthog-cli)"
          test -n "$POSTHOG_CLI_BIN"
          "$POSTHOG_CLI_BIN" --version

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.38"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools not found under $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "cmake;3.22.1" "ndk;27.1.12297006"

      - name: Install Expo app dependencies
        run: bun install
      - name: Apply and verify Hyperswitch React Native 0.88 compatibility
        run: |
          node scripts/apply-hyperswitch-rn88-compat.mjs
          bun run test:hyperswitch-compat

      - name: Set requested app version and Android versionCode
        id: version
        env:
          BETA_VERSION_NAME: ${{ inputs.version_name && inputs.version_name != 'AUTO' && inputs.version_name || format('1.0.0-beta.{0}', github.run_number) }}
          BETA_VERSION_CODE: ${{ inputs.version_code > 0 && inputs.version_code || github.run_number }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const version = process.env.BETA_VERSION_NAME ?? "";
          const versionCode = Number(process.env.BETA_VERSION_CODE);
          if (!/^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(version)) {
            throw new Error("version_name must look like 1.0.0 or 1.0.0-beta.1");
          }
          if (!Number.isSafeInteger(versionCode) || versionCode < 1) {
            throw new Error("version_code must be a positive integer");
          }
          const config = JSON.parse(fs.readFileSync("app.json", "utf8"));
          config.expo.version = version;
          config.expo.android = { ...config.expo.android, versionCode };
          fs.writeFileSync("app.json", JSON.stringify(config, null, 2) + "\n");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "version_name=" + version + "\nversion_code=" + versionCode + "\n");
          console.log("Building LuckRead Android " + version + " (versionCode " + versionCode + ")");
          NODE
          bunx expo config --type public --json > "$RUNNER_TEMP/luckread-expo-build-config.json"
          node - "$RUNNER_TEMP/luckread-expo-build-config.json" <<'NODE'
          const fs = require("node:fs");
          const config = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const projectId = String(config.extra?.eas?.projectId ?? process.env.EXPO_PROJECT_ID ?? "").trim();
          const channel = process.env.EXPO_UPDATE_CHANNEL;
          const enabled = config.updates?.enabled === true;
          if (process.env.LUCKREAD_REQUIRE_OTA_CONFIG === "1" && !enabled) {
            throw new Error("Production APK builds must have EAS Update enabled.");
          }
          if (config.runtimeVersion?.policy !== "appVersion" || config.version !== process.env.BETA_VERSION_NAME) {
            throw new Error("Resolved OTA runtime must use the exact APK versionName.");
          }
          if (enabled && (
            !projectId ||
            config.updates?.url !== "https://u.expo.dev/" + projectId ||
            config.updates?.requestHeaders?.["expo-channel-name"] !== channel
          )) {
            throw new Error("Resolved EAS project URL/channel does not match the APK build environment.");
          }
          const environment = [
            "LUCKREAD_OTA_CONFIG_ENABLED=" + String(enabled),
            "LUCKREAD_OTA_CONFIG_URL=" + String(config.updates?.url ?? ""),
            "LUCKREAD_OTA_CONFIG_CHANNEL=" + String(config.updates?.requestHeaders?.["expo-channel-name"] ?? ""),
            "LUCKREAD_OTA_RUNTIME_POLICY=" + String(config.runtimeVersion?.policy ?? ""),
            "LUCKREAD_OTA_PROJECT_ID=" + projectId,
          ];
          fs.appendFileSync(process.env.GITHUB_ENV, environment.join("\n") + "\n");
          console.log("Verified Expo runtime and OTA channel configuration.");
          NODE

      - name: Guard published Beta version monotonicity
        if: ${{ inputs.publish_release == true }}
        env:
          RELEASE_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const versionName = process.env.RELEASE_VERSION_NAME ?? "";
          const versionCode = Number(process.env.RELEASE_VERSION_CODE);
          const expectedTag = "luckread-android-beta-v" + versionName + "-code" + versionCode;
          // Fail closed when the remote tag query cannot be completed.
          const refs = execFileSync("git", ["ls-remote", "--refs", "--tags", "origin"], { encoding: "utf8" });
          const existing = [];
          for (const line of refs.split(/\r?\n/)) {
            const ref = line.trim().split(/\s+/)[1] ?? "";
            const match = /^refs\/tags\/luckread-android-beta-v(.+)-code(\d+)$/.exec(ref);
            if (match) existing.push({ tag: ref.slice("refs/tags/".length), code: Number(match[2]) });
          }
          if (existing.some((release) => release.tag === expectedTag)) {
            throw new Error("Beta release tag already exists: " + expectedTag);
          }
          const highestCode = existing.reduce((highest, release) => Math.max(highest, release.code), 0);
          if (versionCode <= highestCode) {
            throw new Error("version_code " + versionCode + " must exceed the latest published Beta versionCode " + highestCode + "; choose a new code or use 0 for the Actions run number.");
          }
          console.log(JSON.stringify({ expectedTag, versionCode, previousHighestVersionCode: highestCode }));
          NODE

      - name: Generate Android native project
        env:
          EXPO_PUBLIC_POSTHOG_API_KEY: ${{ vars.EXPO_PUBLIC_POSTHOG_API_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: "https://us.i.posthog.com"
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: "715723"
          POSTHOG_CLI_HOST: "https://us.posthog.com"
        run: bunx expo prebuild --platform android --clean --no-install

      - name: Generate and verify Hyperswitch React Native Codegen specs
        run: |
          test -f android/gradle.properties
          grep -Fxq "newArchEnabled=true" android/gradle.properties
          chmod +x android/gradlew
          cd android
          ./gradlew generateCodegenArtifactsFromSchema --no-daemon
          cd ..
          SPEC_ROOT="node_modules/@juspay-tech/react-native-hyperswitch/android/build/generated/source/codegen"
          MODULE_SPEC="$(find "$SPEC_ROOT" -type f -name 'NativeHyperswitchModuleSpec.java' -print -quit)"
          HEADLESS_SPEC="$(find "$SPEC_ROOT" -type f -name 'NativeHyperHeadlessSpec.java' -print -quit)"
          test -n "$MODULE_SPEC" || { echo "Hyperswitch NativeHyperswitchModuleSpec was not generated" >&2; exit 1; }
          test -n "$HEADLESS_SPEC" || { echo "Hyperswitch NativeHyperHeadlessSpec was not generated" >&2; exit 1; }
          echo "Verified generated Hyperswitch specs:"
          echo "$MODULE_SPEC"
          echo "$HEADLESS_SPEC"
      - name: Compile signed Release APK with embedded JavaScript bundle
        # Keep the values selected by the preceding step (stable or temporary key).
        # Re-declaring these from repository secrets would blank them in test-key mode.
        env:
          EXPO_PUBLIC_POSTHOG_API_KEY: ${{ vars.EXPO_PUBLIC_POSTHOG_API_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: "https://us.i.posthog.com"
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: "715723"
          POSTHOG_CLI_HOST: "https://us.posthog.com"
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease --no-daemon

      - name: Verify APK bundle, native version, signing and OTA provenance
        env:
          RELEASE_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || { echo "Release APK was not created" >&2; exit 1; }
          if ! unzip -l "$APK" | grep -Eq 'assets/index\.android\.bundle'; then
            echo "Release APK is missing assets/index.android.bundle; refusing to publish a Metro-dependent build." >&2
            exit 1
          fi
          AAPT="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          test -n "$AAPT" || { echo "Android aapt was not found" >&2; exit 1; }
          BADGING="$("$AAPT" dump badging "$APK")"
          ACTUAL_VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -n 1)"
          ACTUAL_VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -n 1)"
          ACTUAL_PACKAGE="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          test "$ACTUAL_PACKAGE" = "com.luckread.app" || { echo "Unexpected Android application ID: $ACTUAL_PACKAGE" >&2; exit 1; }
          test "$ACTUAL_VERSION_NAME" = "$RELEASE_VERSION_NAME" || { echo "APK versionName does not match the requested build version." >&2; exit 1; }
          test "$ACTUAL_VERSION_CODE" = "$RELEASE_VERSION_CODE" || { echo "APK versionCode does not match the requested build version code." >&2; exit 1; }
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$APKSIGNER" || { echo "Android apksigner was not found" >&2; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          VERSION_NAME="$RELEASE_VERSION_NAME"
          VERSION_CODE="$RELEASE_VERSION_CODE"
          SIGNING_KIND="test"
          if [ "$LUCKREAD_STABLE_SIGNING" = "true" ]; then SIGNING_KIND="signed"; fi
          APK_NAME="LuckRead-Android-Beta-$VERSION_NAME-$SIGNING_KIND-code$VERSION_CODE.apk"
          cp "$APK" "$GITHUB_WORKSPACE/dist/$APK_NAME"
          APK_SHA256="$(sha256sum "$GITHUB_WORKSPACE/dist/$APK_NAME" | awk '{print $1}')"
          (cd "$GITHUB_WORKSPACE/dist" && sha256sum "$APK_NAME" > "$APK_NAME.sha256")
          export APK_NAME APK_SHA256 ACTUAL_VERSION_NAME ACTUAL_VERSION_CODE
          node - "$GITHUB_WORKSPACE/dist/ota-build-metadata.json" <<'NODE'
          const fs = require("node:fs");
          const metadata = {
            workflowName: "LuckRead Android Beta Release",
            workflowRunId: process.env.GITHUB_RUN_ID,
            sourceSha: (() => {
              if (process.env.GITHUB_EVENT_NAME !== "pull_request") return process.env.GITHUB_SHA;
              const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
              const headSha = event.pull_request?.head?.sha;
              if (typeof headSha !== "string" || !/^[0-9a-f]{40}$/i.test(headSha)) {
                throw new Error("Pull request event did not provide a valid head commit SHA.");
              }
              return headSha;
            })(),
            sourceBranch: process.env.GITHUB_HEAD_REF || process.env.GITHUB_REF_NAME,
            eventName: process.env.GITHUB_EVENT_NAME,
            channel: process.env.EXPO_UPDATE_CHANNEL,
            runtimeVersion: process.env.RELEASE_VERSION_NAME,
            versionName: process.env.ACTUAL_VERSION_NAME,
            androidVersionCode: Number(process.env.ACTUAL_VERSION_CODE),
            otaEnabled: process.env.LUCKREAD_OTA_CONFIG_ENABLED === "true",
            projectId: process.env.LUCKREAD_OTA_PROJECT_ID || null,
            updateUrl: process.env.LUCKREAD_OTA_CONFIG_URL || null,
            updateChannel: process.env.LUCKREAD_OTA_CONFIG_CHANNEL || null,
            runtimeVersionPolicy: process.env.LUCKREAD_OTA_RUNTIME_POLICY || null,
            apkFile: process.env.APK_NAME,
            apkSha256: process.env.APK_SHA256,
          };
          fs.writeFileSync(process.argv[2], JSON.stringify(metadata, null, 2) + "\n");
          NODE
          echo "Verified APK versionName=$ACTUAL_VERSION_NAME versionCode=$ACTUAL_VERSION_CODE OTA=$LUCKREAD_OTA_CONFIG_ENABLED"
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Upload downloadable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: luckread-android-beta-${{ steps.version.outputs.version_name }}-code-${{ steps.version.outputs.version_code }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK to GitHub Releases
        if: ${{ inputs.publish_release && steps.signing.outputs.stable_signing == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: luckread-android-beta-v${{ steps.version.outputs.version_name }}-code${{ steps.version.outputs.version_code }}
          target_commitish: ${{ github.sha }}
          name: LuckRead Android Beta ${{ steps.version.outputs.version_name }} (code ${{ steps.version.outputs.version_code }})
          prerelease: true
          draft: false
          make_latest: false
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/LuckRead-Android-Beta-${{ steps.version.outputs.version_name }}-signed-code${{ steps.version.outputs.version_code }}.apk
            dist/LuckRead-Android-Beta-${{ steps.version.outputs.version_name }}-signed-code${{ steps.version.outputs.version_code }}.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
