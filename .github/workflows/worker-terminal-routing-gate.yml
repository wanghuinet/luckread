name: Worker Terminal Routing Gate

on:
  push:
    branches: [main]
    paths:
      - 'workers/luck01-identity/**'
      - 'workers/luck02-content/**'
      - 'workers/luck03-social/**'
      - 'workers/luck04-commerce/**'
      - 'workers/luck05-creator/**'
      - 'workers/luck06-async/**'
      - 'scripts/verify-1.1-worker-terminal-routing.mjs'
  pull_request:
    paths:
      - 'workers/luck01-identity/**'
      - 'workers/luck02-content/**'
      - 'workers/luck03-social/**'
      - 'workers/luck04-commerce/**'
      - 'workers/luck05-creator/**'
      - 'workers/luck06-async/**'
      - 'scripts/verify-1.1-worker-terminal-routing.mjs'
      - '.github/workflows/worker-terminal-routing-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify terminal Worker boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify 1.1 six-worker terminal routing
        run: node scripts/verify-1.1-worker-terminal-routing.mjs
