name: Public Content 404 Read-only Diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/public-content-404-readonly-diagnostic.yml
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional immutable commit SHA already contained in protected main
        required: false
        type: string
      content_id:
        description: Published content ID to inspect
        required: false
        default: '2116861177622433792'
        type: string
      username:
        description: Expected public author handle
        required: false
        default: huihui
        type: string

permissions:
  contents: read

concurrency:
  group: public-content-404-readonly-diagnostic-v2
  cancel-in-progress: false

jobs:
  diagnose:
    if: ${{ github.ref == 'refs/heads/main' && github.ref_protected == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout protected main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate immutable source and diagnostic target
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          CONTENT_ID: ${{ inputs.content_id || '2116861177622433792' }}
          EXPECTED_USERNAME: ${{ inputs.username || 'huihui' }}
        run: |
          set -euo pipefail
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          printf '%s' "$CONTENT_ID" | grep -Eq '^[0-9]{18,20}$'
          printf '%s' "$EXPECTED_USERNAME" | grep -Eq '^[A-Za-z0-9_]{1,30}$'
          test "$(git rev-parse HEAD)" = "$(git rev-parse main)"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm 11 for W01 runtime probe
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Install locked W01 runtime dependencies
        working-directory: workers/W01-payload
        run: pnpm install --frozen-lockfile

      - name: Run read-only W03 D1 and public-route diagnostic
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONTENT_ID: ${{ inputs.content_id || '2116861177622433792' }}
          EXPECTED_USERNAME: ${{ inputs.username || 'huihui' }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/public-content-404-diagnostic
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync, writeFileSync } from 'node:fs';

          const contentId = process.env.CONTENT_ID;
          const expectedUsername = process.env.EXPECTED_USERNAME.replace(/^@+/, '').toLowerCase();
          if (!/^[0-9]{18,20}$/.test(contentId ?? '')) throw new Error('Invalid content ID');
          if (!/^[a-z0-9_]{1,30}$/i.test(expectedUsername)) throw new Error('Invalid expected username');

          const config = JSON.parse(readFileSync('workers/W03-content/wrangler.jsonc', 'utf8'));
          const binding = (config.d1_databases ?? []).filter((entry) => entry.binding === 'D1_02');
          if (config.name !== 'luckread-w03' || binding.length !== 1 ||
              binding[0].database_name !== 'luckreadpro' ||
              binding[0].database_id !== '6c342634-97f6-4248-9f4a-85772af4f22c') {
            throw new Error('W03 D1_02 target does not match the reviewed production binding');
          }

          const sql = "SELECT id, slug, content_type, state, access_mode, owner_user_id, creator_id, created_at " +
            "FROM contents WHERE id = '" + contentId + "' OR slug = '" + contentId + "' LIMIT 1;";
          let rawD1;
          try {
            const output = execFileSync('npx', [
              '--yes', 'wrangler@4.116.0', 'd1', 'execute', 'luckreadpro',
              '--remote', '--json', '--config', 'workers/W03-content/wrangler.jsonc',
              '--command', sql,
            ], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'], maxBuffer: 8 * 1024 * 1024 });
            rawD1 = JSON.parse(output);
          } catch (error) {
            const stderr = String(error?.stderr ?? '').replace(/Bearer\s+[A-Za-z0-9._-]+/gi, 'Bearer [REDACTED]');
            throw new Error('Read-only W03 D1 query failed: ' + stderr.slice(-1200));
          }

          const rows = [];
          function collectRows(value) {
            if (Array.isArray(value)) {
              for (const child of value) collectRows(child);
              return;
            }
            if (!value || typeof value !== 'object') return;
            if (Array.isArray(value.results)) {
              for (const row of value.results) if (row && typeof row === 'object') rows.push(row);
            }
            for (const [key, child] of Object.entries(value)) {
              if (key !== 'results') collectRows(child);
            }
          }
          collectRows(rawD1);
          const row = rows.find((candidate) => String(candidate.id ?? '') === contentId) ??
            rows.find((candidate) => String(candidate.slug ?? '') === contentId) ?? null;

          const report = {
            result: 'DIAGNOSTIC_COMPLETE',
            sourceSha: process.env.SOURCE_SHA,
            contentId,
            expectedUsername,
            readOnly: true,
            database: { worker: config.name, binding: 'D1_02', databaseName: 'luckreadpro' },
            d1: row ? {
              found: true,
              idMatches: String(row.id ?? '') === contentId,
              slugMatches: String(row.slug ?? '') === contentId,
              contentType: typeof row.content_type === 'string' ? row.content_type : null,
              state: typeof row.state === 'string' ? row.state : null,
              accessMode: typeof row.access_mode === 'string' ? row.access_mode : null,
              hasOwnerUserId: typeof row.owner_user_id === 'string' && row.owner_user_id.length > 0,
              hasCreatorId: typeof row.creator_id === 'string' && row.creator_id.length > 0,
              createdAt: typeof row.created_at === 'string' ? row.created_at : null,
            } : { found: false },
            publicApi: { status: null, state: null, contentType: null, idMatches: false, errorCode: null },
            authorByOwnerId: { status: null, usernameMatches: false, hasUsername: false },
            authorByCreatorId: { status: null, usernameMatches: false, hasUsername: false },
            authorByUsername: { status: null, usernameMatches: false },
            canonicalPage: { status: null, finalPath: null, contentType: null, canonicalTarget: 'NONE', metadataTitleKind: 'MISSING', hasNextDocument: false, hasNextFlightPayload: false, hasNotFoundMarker: false, htmlBytes: 0 },
            legacyPage: { status: null, finalPath: null, contentType: null, canonicalTarget: 'NONE', metadataTitleKind: 'MISSING', hasNextDocument: false, hasNextFlightPayload: false, hasNotFoundMarker: false, htmlBytes: 0 },
          };

          const jsonRequest = async (url) => {
            try {
              const response = await fetch(url, {
                headers: { accept: 'application/json', 'cache-control': 'no-cache' },
                signal: AbortSignal.timeout(12000),
              });
              const payload = await response.json().catch(() => null);
              return { response, payload };
            } catch (error) {
              return { response: null, payload: null, error: error instanceof Error ? error.name : 'FETCH_FAILED' };
            }
          };

          const contentUrl = 'https://api.luckread.com/v1/contents/' + encodeURIComponent(contentId);
          const contentResult = await jsonRequest(contentUrl);
          if (contentResult.response) {
            const payload = contentResult.payload && typeof contentResult.payload === 'object' ? contentResult.payload : {};
            const content = typeof payload.id === 'string' ? payload :
              payload.data && typeof payload.data === 'object' ? payload.data : {};
            report.publicApi = {
              status: contentResult.response.status,
              state: typeof content.state === 'string' ? content.state : null,
              contentType: typeof content.contentType === 'string' ? content.contentType : null,
              idMatches: String(content.id ?? '') === contentId,
              errorCode: typeof payload.error?.code === 'string' ? payload.error.code : null,
            };
          } else {
            report.publicApi.error = contentResult.error ?? 'FETCH_FAILED';
          }

          const probeAuthor = async (value) => {
            if (typeof value !== 'string' || !value.trim()) {
              return { status: null, usernameMatches: false, hasUsername: false };
            }
            const result = await jsonRequest(
              'https://api.luckread.com/v1/users/' + encodeURIComponent(value.trim()),
            );
            const user = result.payload && typeof result.payload === 'object' ? result.payload : {};
            return {
              status: result.response?.status ?? null,
              usernameMatches: typeof user.username === 'string' &&
                user.username.replace(/^@+/, '').toLowerCase() === expectedUsername,
              hasUsername: typeof user.username === 'string' && user.username.length > 0,
            };
          };

          // W01 resolves the public page author using W03 owner_user_id only.
          // creator_id is recorded separately and must never satisfy this check.
          report.authorByOwnerId = await probeAuthor(row?.owner_user_id);
          report.authorByCreatorId = await probeAuthor(row?.creator_id);

          const usernameResult = await jsonRequest(
            'https://api.luckread.com/v1/users/by-username/' + encodeURIComponent(expectedUsername),
          );
          const usernamePayload = usernameResult.payload && typeof usernameResult.payload === 'object'
            ? usernameResult.payload : {};
          report.authorByUsername = {
            status: usernameResult.response?.status ?? null,
            usernameMatches: typeof usernamePayload.username === 'string' &&
              usernamePayload.username.replace(/^@+/, '').toLowerCase() === expectedUsername,
          };

          const readHtmlAttribute = (tag, name) => {
            const pattern = new RegExp('(?:^|\\s)' + name + '\\s*=\\s*(?:"([^"]*)"|\\x27([^\\x27]*)\\x27|([^\\s>]+))', 'i');
            const match = pattern.exec(tag);
            return match?.[1] ?? match?.[2] ?? match?.[3] ?? null;
          };

          const fetchPage = async (url) => {
            try {
              const response = await fetch(url, {
                redirect: 'follow',
                headers: { accept: 'text/html', 'cache-control': 'no-cache' },
                signal: AbortSignal.timeout(15000),
              });
              const contentType = (response.headers.get('content-type') ?? '').split(';')[0].trim().toLowerCase() || null;
              const isHtml = contentType === 'text/html' || contentType === 'application/xhtml+xml';
              const html = isHtml ? await response.text() : '';
              const linkTags = [...html.matchAll(/<link\b[^>]*>/gi)].map((match) => match[0]);
              const canonicalTag = linkTags.find((tag) => {
                const rel = readHtmlAttribute(tag, 'rel') ?? '';
                return rel.toLowerCase().split(/\s+/).includes('canonical');
              });
              const canonicalHref = canonicalTag ? readHtmlAttribute(canonicalTag, 'href') : null;
              let canonicalPath = null;
              if (canonicalHref) {
                try { canonicalPath = new URL(canonicalHref, url).pathname; } catch { /* no raw URL is retained */ }
              }
              const expectedPath = '/@' + encodeURIComponent(expectedUsername) + '/post/' + encodeURIComponent(contentId);
              const legacyPath = '/content/' + encodeURIComponent(contentId);
              const canonicalTarget = canonicalPath === expectedPath
                ? 'EXPECTED_CANONICAL'
                : canonicalPath === legacyPath
                  ? 'LEGACY_CONTENT_FALLBACK'
                  : canonicalPath
                    ? 'OTHER'
                    : 'NONE';
              const rawTitle = /<title\b[^>]*>([\s\S]*?)<\/title>/i.exec(html)?.[1] ?? '';
              const metadataTitleKind = rawTitle.includes('内容不存在')
                ? 'NOT_FOUND'
                : rawTitle.includes('LuckRead')
                  ? 'CONTENT'
                  : rawTitle.trim()
                    ? 'OTHER'
                    : 'MISSING';
              return {
                status: response.status,
                finalPath: new URL(response.url).pathname,
                contentType,
                canonicalTarget,
                metadataTitleKind,
                hasNextDocument: /<!doctype html|<html\b/i.test(html),
                hasNextFlightPayload: /__next_f\.push|self\.__next_f/i.test(html),
                hasNotFoundMarker: html.includes('NEXT_HTTP_ERROR_FALLBACK;404'),
                htmlBytes: new TextEncoder().encode(html).byteLength,
              };
            } catch (error) {
              return { status: null, error: error instanceof Error ? error.name : 'FETCH_FAILED' };
            }
          };
          report.canonicalPage = await fetchPage(
            'https://www.luckread.com/@' + encodeURIComponent(expectedUsername) + '/post/' + encodeURIComponent(contentId),
          );
          report.legacyPage = await fetchPage(
            'https://www.luckread.com/content/' + encodeURIComponent(contentId),
          );

          const ownerAuthorMatches = report.authorByOwnerId.usernameMatches;
          const d1State = report.d1.found ? report.d1.state : null;
          if (!report.d1.found) report.classification = 'CONTENT_ROW_NOT_FOUND_IN_W03_D1_02';
          else if (d1State !== 'PUBLISHED') report.classification = 'CONTENT_NOT_PUBLIC_STATE_' + String(d1State ?? 'UNKNOWN');
          else if (report.publicApi.status !== 200) report.classification = 'W03_PUBLIC_API_READ_MISMATCH';
          else if (!ownerAuthorMatches && report.authorByOwnerId.status === 404) report.classification = 'W03_OWNER_USER_ID_NOT_FOUND_IN_PAYLOAD_PROJECTION';
          else if (!ownerAuthorMatches && report.authorByOwnerId.status === 200) report.classification = 'W03_OWNER_USER_ID_USERNAME_MISMATCH';
          else if (!ownerAuthorMatches) report.classification = 'W03_OWNER_USER_ID_PROFILE_LOOKUP_FAILED';
          else if (report.canonicalPage.status !== 200 && report.canonicalPage.canonicalTarget === 'EXPECTED_CANONICAL') report.classification = 'SSR_ROUTE_FAILURE_AFTER_AUTHOR_RESOLUTION';
          else if (report.canonicalPage.status !== 200 && report.canonicalPage.canonicalTarget === 'LEGACY_CONTENT_FALLBACK') report.classification = 'SSR_AUTHOR_CONTEXT_OR_PROFILE_PROJECTION_MISMATCH';
          else if (report.canonicalPage.status !== 200 && report.canonicalPage.metadataTitleKind === 'NOT_FOUND') report.classification = 'SSR_CONTENT_LOOKUP_MISMATCH';
          else if (report.canonicalPage.status !== 200) report.classification = 'CANONICAL_PAGE_ROUTE_FAILURE';
          else report.classification = 'PUBLIC_CONTENT_LINK_OK';

          const outputPath = 'artifacts/public-content-404-diagnostic/report.json';
          writeFileSync(outputPath, JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report, null, 2));
          NODE

      - name: Probe W01-to-W03 author-context Service Binding (read-only)
        timeout-minutes: 4
        working-directory: workers/W01-payload
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONTENT_ID: ${{ inputs.content_id || '2116861177622433792' }}
          EXPECTED_USERNAME: ${{ inputs.username || 'huihui' }}
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM --kill-after=10s 120s node --input-type=module <<'NODE'
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { getPlatformProxy } from 'wrangler';

          const contentId = process.env.CONTENT_ID;
          const expectedUsername = (process.env.EXPECTED_USERNAME ?? '').replace(/^@+/, '').toLowerCase();
          const reportPath = '../../artifacts/public-content-404-diagnostic/report.json';
          const report = JSON.parse(readFileSync(reportPath, 'utf8'));
          const probe = {
            status: null,
            contentIdMatches: false,
            ownerUserIdPresent: false,
            ownerProfileStatus: null,
            ownerUsernameMatches: false,
            classification: 'W01_W03_BINDING_PROBE_NOT_RUN',
          };

          let platform;
          try {
            const wrangler = JSON.parse(readFileSync('wrangler.jsonc', 'utf8'));
            const binding = (wrangler.services ?? []).filter((entry) => entry.binding === 'W03_CONTENT');
            if (binding.length !== 1 || binding[0].service !== 'luckread-w03') {
              probe.classification = 'W01_W03_SERVICE_BINDING_CONFIG_MISMATCH';
            } else {
              // Local-only Worker identity. The binding target remains the
              // exact deployed W03 service configured in production W01.
              mkdirSync('.wrangler', { recursive: true });
              writeFileSync('.wrangler/public-content-404-probe-worker.mjs',
                'export default { async fetch() { return new Response("read-only probe"); } };\n');
              const probeConfig = {
                name: 'luckread-w01-readonly-binding-probe',
                main: 'public-content-404-probe-worker.mjs',
                compatibility_date: wrangler.compatibility_date ?? '2025-08-15',
                compatibility_flags: wrangler.compatibility_flags ?? [],
                services: [{
                  binding: 'W03_CONTENT',
                  service: binding[0].service,
                  remote: true,
                }],
              };
              if (typeof wrangler.account_id === 'string' && wrangler.account_id) {
                probeConfig.account_id = wrangler.account_id;
              }
              writeFileSync('.wrangler/public-content-404-probe.jsonc',
                JSON.stringify(probeConfig, null, 2) + '\n');

              console.log('PROBE_STAGE=GET_PLATFORM_PROXY_START');
              platform = await getPlatformProxy({
                configPath: '.wrangler/public-content-404-probe.jsonc',
                remoteBindings: true,
                persist: false,
              });
              console.log('PROBE_STAGE=GET_PLATFORM_PROXY_READY');

              const service = platform.env?.W03_CONTENT;
              if (!service || typeof service.fetch !== 'function') {
                probe.classification = 'W01_W03_SERVICE_BINDING_MISSING';
              } else {
                console.log('PROBE_STAGE=W03_AUTHOR_CONTEXT_REQUEST_START');
                const response = await service.fetch(new Request(
                  'https://luckread-w03.internal/internal/content/contents/' +
                    encodeURIComponent(contentId) + '/public-author-context',
                  {
                    method: 'GET',
                    signal: AbortSignal.timeout(12000),
                    headers: {
                      accept: 'application/json',
                      'X-LuckRead-Caller': 'W01',
                      'X-LuckRead-Transport-Version': '1.0',
                      'X-LuckRead-Correlation-Id': 'public-content-404-readonly-diagnostic',
                    },
                  },
                ));
                probe.status = response.status;
                const envelope = await response.json().catch(() => null);
                const data = envelope && typeof envelope === 'object' && !Array.isArray(envelope)
                  ? envelope.data
                  : null;
                if (response.status !== 200) {
                  probe.classification = response.status === 404
                    ? 'W03_INTERNAL_AUTHOR_CONTEXT_NOT_FOUND'
                    : 'W03_INTERNAL_AUTHOR_CONTEXT_NON_200';
                } else if (!data || typeof data !== 'object' || Array.isArray(data) ||
                           data.contentId !== contentId ||
                           typeof data.ownerUserId !== 'string' || !data.ownerUserId.trim()) {
                  probe.classification = 'W03_INTERNAL_AUTHOR_CONTEXT_RESPONSE_INVALID';
                } else {
                  probe.contentIdMatches = true;
                  probe.ownerUserIdPresent = true;
                  console.log('PROBE_STAGE=OWNER_PROFILE_LOOKUP_START');
                  const profileResponse = await fetch(
                    'https://api.luckread.com/v1/users/' + encodeURIComponent(data.ownerUserId),
                    {
                      headers: { accept: 'application/json', 'cache-control': 'no-cache' },
                      signal: AbortSignal.timeout(12000),
                    },
                  );
                  probe.ownerProfileStatus = profileResponse.status;
                  const profile = await profileResponse.json().catch(() => null);
                  probe.ownerUsernameMatches = !!profile &&
                    typeof profile === 'object' &&
                    typeof profile.username === 'string' &&
                    profile.username.replace(/^@+/, '').toLowerCase() === expectedUsername;
                  if (probe.ownerProfileStatus === 404) {
                    probe.classification = 'W03_OWNER_ID_NOT_FOUND_IN_W01_PROFILE_PROJECTION';
                  } else if (probe.ownerProfileStatus !== 200) {
                    probe.classification = 'W01_OWNER_PROFILE_NON_200';
                  } else if (!probe.ownerUsernameMatches) {
                    probe.classification = 'W01_OWNER_PROFILE_USERNAME_MISMATCH';
                  } else {
                    probe.classification = 'W01_W03_BINDING_AND_OWNER_PROFILE_OK';
                  }
                }
              }
            }
          } catch (error) {
            const code = error && typeof error === 'object' && typeof error.code === 'string'
              ? error.code
              : error instanceof Error ? error.name : 'UNKNOWN';
            probe.classification = code === 'Error'
              ? 'W01_W03_BINDING_PROBE_FAILED'
              : 'W01_W03_BINDING_PROBE_' + code.replace(/[^A-Z0-9_]/gi, '_').slice(0, 48).toUpperCase();
            console.log('PROBE_STAGE=ERROR', probe.classification);
          } finally {
            if (platform?.dispose) {
              await platform.dispose().catch(() => {});
            }
          }

          report.w01W03AuthorContext = probe;
          if (probe.classification !== 'W01_W03_BINDING_AND_OWNER_PROFILE_OK') {
            report.classification = probe.classification;
          } else if (report.canonicalPage?.status !== 200) {
            report.classification = 'NEXTJS_ROUTE_404_AFTER_W01_W03_AUTHOR_RESOLUTION';
          }
          writeFileSync(reportPath, JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(probe, null, 2));
          NODE
          probe_exit=$?
          set -e
          if [ "$probe_exit" -eq 124 ] || [ "$probe_exit" -eq 137 ] || [ "$probe_exit" -eq 143 ]; then
            PROBE_CLASSIFICATION="W01_W03_BINDING_PROBE_TIMEOUT" node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const path = "../../artifacts/public-content-404-diagnostic/report.json";
            const report = JSON.parse(readFileSync(path, "utf8"));
            const classification = process.env.PROBE_CLASSIFICATION;
            report.w01W03AuthorContext = {
              status: null,
              contentIdMatches: false,
              ownerUserIdPresent: false,
              ownerProfileStatus: null,
              ownerUsernameMatches: false,
              classification,
            };
            report.classification = classification;
            writeFileSync(path, JSON.stringify(report, null, 2) + "\\n");
            '
          elif [ "$probe_exit" -ne 0 ]; then
            PROBE_CLASSIFICATION="W01_W03_BINDING_PROBE_PROCESS_EXIT_$probe_exit" node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const path = "../../artifacts/public-content-404-diagnostic/report.json";
            const report = JSON.parse(readFileSync(path, "utf8"));
            const classification = process.env.PROBE_CLASSIFICATION;
            report.w01W03AuthorContext = {
              status: null,
              contentIdMatches: false,
              ownerUserIdPresent: false,
              ownerProfileStatus: null,
              ownerUsernameMatches: false,
              classification,
            };
            report.classification = classification;
            writeFileSync(path, JSON.stringify(report, null, 2) + "\\n");
            '
          fi
      - name: Upload sanitized diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-content-404-diagnostic-${{ github.run_id }}
          path: artifacts/public-content-404-diagnostic/report.json
          if-no-files-found: warn
          retention-days: 7
