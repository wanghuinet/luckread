name: W07 Subscription Version D1-01 Migration

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit containing the admitted migration
        required: true
        type: string
        default: 32bbde19db6ec071efd780b915255a1d7f59549d
      database_name:
        description: Current Cloudflare display name for the D1-01 database
        required: true
        type: string
        default: luckread
      confirm:
        description: Type APPLY_W07_SUBSCRIPTION_MIGRATION to permit remote D1 mutation
        required: true
        type: string
        default: APPLY_W07_SUBSCRIPTION_MIGRATION

permissions:
  contents: read

jobs:
  migrate:
    if: \${{ inputs.confirm == 'APPLY_W07_SUBSCRIPTION_MIGRATION' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact migration source
        uses: actions/checkout@v4
        with:
          ref: \${{ inputs.source_sha }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify W07 D1-01 binding
        working-directory: workers/W07-subscription-commerce
        env:
          EXPECTED_DB_NAME: \${{ inputs.database_name }}
          EXPECTED_DB_ID: 2f80471e-3756-49f9-8db1-7707a433ad64
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const c = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const d = c.d1_databases?.find((x) => x.binding === 'D1_01');
          if (!d) throw new Error('D1_01 binding missing');
          if (d.database_name !== process.env.EXPECTED_DB_NAME) throw new Error('database_name input does not match W07 D1-01 binding');
          if (d.database_id !== process.env.EXPECTED_DB_ID) throw new Error('W07 D1-01 binding does not match controlled target UUID');
          console.log(JSON.stringify(d, null, 2));
          NODE

      - name: Verify migration source and artifact hash
        run: |
          set -euo pipefail
          test -f workers/W07-subscription-commerce/migrations/0001_membership_subscriptions.sql
          test -f workers/W07-subscription-commerce/migrations/0002_subscription_version.sql
          test "$(sha256sum workers/W07-subscription-commerce/migrations/0002_subscription_version.sql | awk '{print $1}')" = "ce1673415eec33c110e01bff201394ae0ed7ac73970ec840379fdaf24590ad8a"
          test -z "$(git status --short)"

      - name: Preflight controlled target
        working-directory: workers/W07-subscription-commerce
        env:
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts/w07-subscription-version-migration"
          npx --yes wrangler@4.116.0 d1 execute "\${{ inputs.database_name }}" --remote --json --config wrangler.jsonc --command 'SELECT COUNT(*) AS subscription_count FROM membership_subscriptions;' > "$GITHUB_WORKSPACE/artifacts/w07-subscription-version-migration/preflight-count.json" || true
          npx --yes wrangler@4.116.0 d1 execute "\${{ inputs.database_name }}" --remote --json --config wrangler.jsonc --command 'PRAGMA table_info("membership_subscriptions");' > "$GITHUB_WORKSPACE/artifacts/w07-subscription-version-migration/preflight-schema.json"
          node - <<'NODE'
          const fs = require('node:fs');
          const root = process.env.GITHUB_WORKSPACE + '/artifacts/w07-subscription-version-migration';
          const count = JSON.parse(fs.readFileSync(root + '/preflight-count.json', 'utf8'));
          const schema = JSON.parse(fs.readFileSync(root + '/preflight-schema.json', 'utf8'));
          const n = Number(count?.[0]?.results?.[0]?.subscription_count);
          const columns = schema?.[0]?.results ?? [];
          if (!Number.isFinite(n) || n !== 0) throw new Error('FAIL_CLOSED: membership_subscriptions must be empty before version initialization');
          if (columns.some((row) => row.name === 'version')) throw new Error('version already exists; stop rather than replaying migration');
          console.log(JSON.stringify({subscriptionCount:n,versionColumnPresent:false,columns:columns.map((row)=>row.name)}));
          NODE

      - name: Apply W07 Subscription migrations remotely
        working-directory: workers/W07-subscription-commerce
        env:
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.116.0 d1 migrations apply "\${{ inputs.database_name }}" --remote --config wrangler.jsonc

      - name: Capture post-migration schema
        working-directory: workers/W07-subscription-commerce
        env:
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.116.0 d1 execute "\${{ inputs.database_name }}" --remote --json --config wrangler.jsonc --command 'PRAGMA table_info("membership_subscriptions");' > "$GITHUB_WORKSPACE/artifacts/w07-subscription-version-migration/post-schema.json"
          npx --yes wrangler@4.116.0 d1 execute "\${{ inputs.database_name }}" --remote --json --config wrangler.jsonc --command 'SELECT COUNT(*) AS subscription_count FROM membership_subscriptions;' > "$GITHUB_WORKSPACE/artifacts/w07-subscription-version-migration/post-count.json"
          npx --yes wrangler@4.116.0 d1 execute "\${{ inputs.database_name }}" --remote --json --config wrangler.jsonc --command 'SELECT * FROM d1_migrations ORDER BY id;' > "$GITHUB_WORKSPACE/artifacts/w07-subscription-version-migration/d1-migrations.json"
          node - <<'NODE'
          const fs = require('node:fs');
          const root = process.env.GITHUB_WORKSPACE + '/artifacts/w07-subscription-version-migration';
          const schema = JSON.parse(fs.readFileSync(root + '/post-schema.json', 'utf8'));
          const count = JSON.parse(fs.readFileSync(root + '/post-count.json', 'utf8'));
          const rows = schema?.[0]?.results ?? [];
          const version = rows.find((r) => r.name === 'version');
          const n = Number(count?.[0]?.results?.[0]?.subscription_count);
          if (rows.length !== 14) throw new Error('Expected 14 Subscription columns after migration');
          if (!version || version.type !== 'INTEGER' || version.notnull !== 1 || version.dflt_value !== '1') throw new Error('Subscription version post-schema verification failed');
          if (n !== 0) throw new Error('Unexpected Subscription rows after zero-row migration');
          console.log(JSON.stringify({migration:'MIG-MON-SUBSCRIPTION-VERSION-V1',subscriptionCount:n,version,columns:rows.map((r)=>r.name)}));
          NODE

      - name: Capture migration provenance
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/w07-subscription-version-migration"
          cat > "$GITHUB_WORKSPACE/artifacts/w07-subscription-version-migration/provenance.txt" <<'EOF'
          workflow=W07 Subscription Version D1-01 Migration
          source_sha=\${{ inputs.source_sha }}
          database_name=\${{ inputs.database_name }}
          database_id=2f80471e-3756-49f9-8db1-7707a433ad64
          migration=0002_subscription_version.sql
          migration_sha256=ce1673415eec33c110e01bff201394ae0ed7ac73970ec840379fdaf24590ad8a
          remote_mutation=true
          scope=CONTROLLED_REMOTE_D1_ZERO_ROW_TARGET_ONLY
          EOF

      - name: Upload controlled migration evidence
        uses: actions/upload-artifact@v4
        with:
          name: w07-subscription-version-migration-\${{ github.run_id }}
          path: \${{ github.workspace }}/artifacts/w07-subscription-version-migration/
          if-no-files-found: error
          retention-days: 14