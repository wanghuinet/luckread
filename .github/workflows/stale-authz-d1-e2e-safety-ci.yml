name: Stale Authz D1 E2E Safety CI

on:
  pull_request:
    paths:
      - '.github/workflows/authz-l1-l2-live-e2e.yml'
      - '.github/workflows/stale-authz-d1-e2e-safety-ci.yml'
      - 'scripts/cloudflare/verify-stale-authz-d1-e2e-disabled.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/authz-l1-l2-live-e2e.yml'
      - '.github/workflows/stale-authz-d1-e2e-safety-ci.yml'
      - 'scripts/cloudflare/verify-stale-authz-d1-e2e-disabled.test.mjs'
permissions:
  contents: read
jobs:
  safety-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/cloudflare/verify-stale-authz-d1-e2e-disabled.test.mjs
