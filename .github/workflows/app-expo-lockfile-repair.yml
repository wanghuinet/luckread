name: Repair Expo SDK dependency lockfile (PR 2324)

on:
  push:
    branches:
      - fix/app-feed-card-interaction-isolation
    paths:
      - ".github/workflows/app-expo-lockfile-repair.yml"

permissions:
  contents: write

concurrency:
  group: app-expo-lockfile-repair-pr-2324
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/app-feed-card-interaction-isolation
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22.13.1"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.38"
      - name: Install the committed dependency baseline
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Align the 11 Expo SDK packages without rewriting dynamic app config
        working-directory: app
        run: >-
          bun add
          expo@~58.1.0
          expo-image@~58.0.19
          expo-router@~58.0.33
          @sentry/react-native@~8.28.1
          expo-updates@~58.0.23
          expo-dev-client@~58.0.22
          expo-splash-screen@~58.0.15
          expo-network@~58.0.6
          expo-notifications@~58.1.10
          @expo/ui@~58.0.30
          expo-file-system@~58.0.15
      - name: Regenerate the committed Bun lockfile
        working-directory: app
        run: bun install
      - name: Verify Expo dependency compatibility
        working-directory: app
        run: bunx expo install --check
      - name: Verify Expo project health
        working-directory: app
        run: bunx expo-doctor@latest
      - name: Commit only dependency manifest and lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/package.json app/bun.lockb
          if git diff --cached --quiet; then
            echo "Expo SDK dependency manifest and lockfile are already aligned."
            exit 0
          fi
          git commit -m "fix(app): align Expo SDK dependencies and lockfile"
          git push origin HEAD:fix/app-feed-card-interaction-isolation
