name: W07 D1-04 Order and Payment Migrations (Explicit Manual Gate)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current main commit SHA containing the reviewed migration
        required: true
        type: string
      target_database_name:
        description: Exact live D1-04 database name from read-only inventory
        required: true
        type: string
      confirm:
        description: Type APPLY_W07_D1_04_COMMERCE_MIGRATIONS to permit the reviewed D1-04 commerce migrations
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate-d1-04-orders:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate exact source, target, and explicit mutation confirmation
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          TARGET_DATABASE_NAME: ${{ inputs.target_database_name }}
          APPLY_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SHA" == "$GITHUB_SHA" ]]
          [[ "$TARGET_DATABASE_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$ ]]
          [[ "$APPLY_CONFIRM" == "APPLY_W07_D1_04_COMMERCE_MIGRATIONS" ]]
          MAIN_SHA="$(git rev-parse origin/main)"
          if [[ "$SOURCE_SHA" != "$MAIN_SHA" ]]; then
            echo "::error::source_sha must equal the current main HEAD ($MAIN_SHA); refusing to migrate from an older workflow snapshot."
            exit 1
          fi
          git cat-file -e "$SOURCE_SHA^{commit}"
          echo "Validated exact current main source SHA and explicit migration confirmation."

      - name: Checkout validated source commit
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: git checkout --detach "$SOURCE_SHA"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify source migration and isolated D1 binding
        working-directory: workers/W07-subscription-commerce
        run: |
          set -euo pipefail
          test -f migrations-d1-04/0001_order_commerce.sql
          test -f migrations-d1-04/0002_payment_provider_events.sql
          test -f migrations-d1-04/0003_saved_payment_methods_mandates.sql
          test -f migrations-d1-04/0004_subscription_renewal_cycles.sql
          test -f migrations-d1-04/0005_revenuecat_webhook_inbox.sql
          test -f migrations-d1-04/0006_refunds_billing_documents.sql
          test -f migrations-d1-04/0007_payment_method_revocation_requests.sql
          python scripts/test_order_d1_04_migration.py
          test -f scripts/verify-d1-04-order-migration.mjs
          node - <<'NODE'
          const fs = require('node:fs')
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'))
          const registry = JSON.parse(fs.readFileSync('../../contracts/transport/worker-d1-access-boundary.v1.json', 'utf8'))
          const d1 = (config.d1_databases || []).find((entry) => entry.binding === 'D1_04')
          const d101 = (config.d1_databases || []).find((entry) => entry.binding === 'D1_01')
          if (!d1 || d1.database_id !== '9bfb89a5-fbb5-45b1-a2ee-eab674b0d736') throw new Error('D1_04 UUID mismatch')
          if (registry.physicalD1Registry?.['D1-04'] !== d1.database_id) throw new Error('D1_04 registry mismatch')
          if (d1.migrations_dir !== 'migrations-d1-04') throw new Error('D1_04 migration directory mismatch')
          if (!d101 || d101.migrations_dir !== 'migrations' || d101.database_id === d1.database_id) throw new Error('D1_01 migration boundary changed')
          console.log(JSON.stringify({binding:'D1_04',databaseUuid:d1.database_id,migrationsDir:d1.migrations_dir,d1_01_migrationsDir:d101.migrations_dir}))
          NODE

      - name: Verify live D1-04 identity using read-only inventory
        id: binding
        working-directory: workers/W07-subscription-commerce
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TARGET_DATABASE_NAME: ${{ inputs.target_database_name }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler@4.116.0 d1 list --json --config wrangler.jsonc > /tmp/w07-d1-04-inventory.json
          node scripts/report-d1-04-live-name.mjs /tmp/w07-d1-04-inventory.json /tmp/w07-d1-04-live-name-report.json
          D1_04_NAME="$(node --input-type=commonjs - <<'NODE'
          const report = require('/tmp/w07-d1-04-live-name-report.json')
          const expected = process.env.TARGET_DATABASE_NAME
          if (report.result !== 'LIVE_NAME_IDENTIFIED' ||
              report.binding !== 'D1_04' ||
              report.databaseUuid !== '9bfb89a5-fbb5-45b1-a2ee-eab674b0d736' ||
              report.readOnly !== true ||
              report.displayNameMatches !== true ||
              report.liveDatabaseName !== expected ||
              report.configuredDatabaseName !== expected) {
            throw new Error('D1-04 live UUID/name does not match the explicit target and Wrangler binding')
          }
          process.stdout.write(report.liveDatabaseName)
          NODE
          )"
          echo "database_name=$D1_04_NAME" >> "$GITHUB_OUTPUT"

      - name: Capture read-only D1-04 schema before candidate migrations
        id: schema_preflight
        working-directory: workers/W07-subscription-commerce
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_04_NAME: ${{ steps.binding.outputs.database_name }}
        run: |
          set -euo pipefail
          test -n "$D1_04_NAME"
          npx --yes wrangler@4.116.0 d1 execute "$D1_04_NAME" --remote --config wrangler.jsonc --command="SELECT type, name, tbl_name, sql FROM sqlite_master WHERE type IN ('table', 'view', 'index', 'trigger') AND name NOT LIKE 'sqlite_%' ORDER BY type, name" --json > /tmp/w07-d1-04-preflight-schema.json
          HAS_MIGRATION_TABLE="$(node scripts/verify-d1-04-order-migration.mjs has-migration-table /tmp/w07-d1-04-preflight-schema.json)"
          if [[ "$HAS_MIGRATION_TABLE" == "true" ]]; then
            npx --yes wrangler@4.116.0 d1 execute "$D1_04_NAME" --remote --config wrangler.jsonc --command="SELECT name FROM d1_migrations ORDER BY name" --json > /tmp/w07-d1-04-preflight-migrations.json
          else
            printf '{"querySkipped":"d1_migrations table not present in read-only preflight"}\n' > /tmp/w07-d1-04-preflight-migrations.json
          fi
          node scripts/verify-d1-04-order-migration.mjs preflight \
            /tmp/w07-d1-04-preflight-schema.json \
            /tmp/w07-d1-04-preflight-migrations.json \
            /tmp/w07-d1-04-preflight-report.json
          ACTION="$(node -p "require('/tmp/w07-d1-04-preflight-report.json').action")"
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "migration_action=$ACTION"
          echo "No D1 writes were performed in this step."

      - name: Apply only pending isolated D1-04 order and payment migrations
        if: steps.schema_preflight.outputs.action == 'APPLY'
        working-directory: workers/W07-subscription-commerce
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_04_NAME: ${{ steps.binding.outputs.database_name }}
        run: |
          set -euo pipefail
          test -n "$D1_04_NAME"
          npx --yes wrangler@4.116.0 d1 migrations apply "$D1_04_NAME" --remote --config wrangler.jsonc

      - name: Capture read-only D1-04 schema after candidate migrations
        working-directory: workers/W07-subscription-commerce
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_04_NAME: ${{ steps.binding.outputs.database_name }}
        run: |
          set -euo pipefail
          test -n "$D1_04_NAME"
          npx --yes wrangler@4.116.0 d1 execute "$D1_04_NAME" --remote --config wrangler.jsonc --command="SELECT type, name, tbl_name, sql FROM sqlite_master WHERE type IN ('table', 'view', 'index', 'trigger') AND name NOT LIKE 'sqlite_%' ORDER BY type, name" --json > /tmp/w07-d1-04-postflight-schema.json
          npx --yes wrangler@4.116.0 d1 execute "$D1_04_NAME" --remote --config wrangler.jsonc --command="SELECT name FROM d1_migrations ORDER BY name" --json > /tmp/w07-d1-04-postflight-migrations.json
          npx --yes wrangler@4.116.0 d1 execute "$D1_04_NAME" --remote --config wrangler.jsonc --command='PRAGMA table_info("orders")' --json > /tmp/w07-d1-04-orders-columns.json
          npx --yes wrangler@4.116.0 d1 execute "$D1_04_NAME" --remote --config wrangler.jsonc --command='PRAGMA table_info("order_lines")' --json > /tmp/w07-d1-04-order-lines-columns.json
          npx --yes wrangler@4.116.0 d1 execute "$D1_04_NAME" --remote --config wrangler.jsonc --command='PRAGMA table_info("order_create_idempotency")' --json > /tmp/w07-d1-04-idempotency-columns.json
          npx --yes wrangler@4.116.0 d1 execute "$D1_04_NAME" --remote --config wrangler.jsonc --command='PRAGMA table_info("payments")' --json > /tmp/w07-d1-04-payments-columns.json
          npx --yes wrangler@4.116.0 d1 execute "$D1_04_NAME" --remote --config wrangler.jsonc --command='PRAGMA table_info("payment_provider_events")' --json > /tmp/w07-d1-04-payment-provider-events-columns.json
          npx --yes wrangler@4.116.0 d1 execute "$D1_04_NAME" --remote --config wrangler.jsonc --command='PRAGMA table_info("payment_provider_event_conflicts")' --json > /tmp/w07-d1-04-payment-provider-event-conflicts-columns.json
          npx --yes wrangler@4.116.0 d1 execute "$D1_04_NAME" --remote --config wrangler.jsonc --command='PRAGMA table_info("saved_payment_methods")' --json > /tmp/w07-d1-04-saved-payment-methods-columns.json
          npx --yes wrangler@4.116.0 d1 execute "$D1_04_NAME" --remote --config wrangler.jsonc --command='PRAGMA table_info("payment_mandates")' --json > /tmp/w07-d1-04-payment-mandates-columns.json
          npx --yes wrangler@4.116.0 d1 execute "$D1_04_NAME" --remote --config wrangler.jsonc --command='PRAGMA table_info("subscription_renewal_cycles")' --json > /tmp/w07-d1-04-renewal-cycles-columns.json
          npx --yes wrangler@4.116.0 d1 execute "$D1_04_NAME" --remote --config wrangler.jsonc --command='PRAGMA table_info("subscription_renewal_scheduler_state")' --json > /tmp/w07-d1-04-renewal-scheduler-state-columns.json
          npx --yes wrangler@4.116.0 d1 execute "$D1_04_NAME" --remote --config wrangler.jsonc --command='PRAGMA table_info("revenuecat_webhook_events")' --json > /tmp/w07-d1-04-revenuecat-webhook-events-columns.json
          npx --yes wrangler@4.116.0 d1 execute "$D1_04_NAME" --remote --config wrangler.jsonc --command='PRAGMA table_info("revenuecat_webhook_event_conflicts")' --json > /tmp/w07-d1-04-revenuecat-webhook-conflicts-columns.json
          npx --yes wrangler@4.116.0 d1 execute "$D1_04_NAME" --remote --config wrangler.jsonc --command='PRAGMA table_info("refunds")' --json > /tmp/w07-d1-04-refunds-columns.json
          npx --yes wrangler@4.116.0 d1 execute "$D1_04_NAME" --remote --config wrangler.jsonc --command='PRAGMA table_info("billing_documents")' --json > /tmp/w07-d1-04-billing-documents-columns.json
          npx --yes wrangler@4.116.0 d1 execute "$D1_04_NAME" --remote --config wrangler.jsonc --command='PRAGMA table_info("payment_method_revocation_requests")' --json > /tmp/w07-d1-04-payment-method-revocation-requests-columns.json
          node scripts/verify-d1-04-order-migration.mjs postflight \
            /tmp/w07-d1-04-preflight-schema.json \
            /tmp/w07-d1-04-postflight-schema.json \
            /tmp/w07-d1-04-postflight-migrations.json \
            /tmp/w07-d1-04-orders-columns.json \
            /tmp/w07-d1-04-order-lines-columns.json \
            /tmp/w07-d1-04-idempotency-columns.json \
            /tmp/w07-d1-04-payments-columns.json \
            /tmp/w07-d1-04-payment-provider-events-columns.json \
            /tmp/w07-d1-04-payment-provider-event-conflicts-columns.json \
            /tmp/w07-d1-04-saved-payment-methods-columns.json \
            /tmp/w07-d1-04-payment-mandates-columns.json \
            /tmp/w07-d1-04-renewal-cycles-columns.json \
            /tmp/w07-d1-04-renewal-scheduler-state-columns.json \
            /tmp/w07-d1-04-revenuecat-webhook-events-columns.json \
            /tmp/w07-d1-04-revenuecat-webhook-conflicts-columns.json \
            /tmp/w07-d1-04-refunds-columns.json \
            /tmp/w07-d1-04-billing-documents-columns.json \
            /tmp/w07-d1-04-payment-method-revocation-requests-columns.json \
            /tmp/w07-d1-04-postflight-report.json

      - name: Summarize migration and schema verification
        if: always()
        run: |
          set -euo pipefail
          {
            echo '# W07 D1-04 Order and Payment Migrations'
            echo
            echo '- Source SHA: ${{ inputs.source_sha }}'
            echo '- Expected database name: ${{ inputs.target_database_name }}'
            echo '- Explicit confirmation supplied: yes'
            if [[ -f /tmp/w07-d1-04-preflight-report.json ]]; then
              echo '- Preflight:'
              node -e "const r=require('/tmp/w07-d1-04-preflight-report.json'); console.log('- Result: '+r.result); console.log('- Action: '+r.action); console.log('- D1 UUID: '+r.databaseUuid);"
            fi
            if [[ -f /tmp/w07-d1-04-postflight-report.json ]]; then
              echo '- Postflight:'
              node -e "const r=require('/tmp/w07-d1-04-postflight-report.json'); console.log('- Result: '+r.result); console.log('- Tables: '+r.verifiedTables.join(', ')); console.log('- Indexes verified: '+r.verifiedIndexes.length); console.log('- Triggers verified: '+r.verifiedTriggers.length); console.log('- Existing schema preserved: '+r.baselineSchemaPreserved);"
            else
              echo '- Postflight: not completed; inspect the failed step before any retry.'
            fi
            echo '- Worker deployment: not performed by this workflow.'
            echo '- Recurring renewal scheduling requires the existing W10 queue runtime and an admitted pricing/tax authority; this migration alone does not enable live charges.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w07-d1-04-order-migration-${{ inputs.source_sha }}
          path: /tmp/w07-d1-04-*.json
          if-no-files-found: warn
          retention-days: 90
