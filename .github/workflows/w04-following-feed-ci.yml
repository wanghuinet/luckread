name: W04 Following Feed CI

on:
  pull_request:
    paths:
      - "workers/W04-feed-search/**"
      - "workers/W01-payload/src/feed/w04-feed-client.ts"
      - "workers/W01-payload/src/app/api/v1/search/trending/**"
      - "workers/W01-payload/tests/int/search-v1-adapter.int.spec.ts"
      - "workers/W01-payload/src/app/(twitter-clone)/search/**"
      - "workers/W01-payload/src/app/(twitter-clone)/TwitterCloneSecondaryPageLayout.tsx"
      - "contracts/openapi/v1/openapi.yaml"
      - "workers/W01-payload/tests/int/following-feed-v1-adapter.int.spec.ts"
      - ".github/workflows/w04-following-feed-ci.yml"
  push:
    branches: ["main"]
    paths:
      - "workers/W04-feed-search/**"
      - "workers/W01-payload/src/feed/w04-feed-client.ts"
      - "workers/W01-payload/src/app/api/v1/search/trending/**"
      - "workers/W01-payload/tests/int/search-v1-adapter.int.spec.ts"
      - "contracts/openapi/v1/openapi.yaml"
      - ".github/workflows/w04-following-feed-ci.yml"

permissions:
  contents: read

jobs:
  following-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked repository dependencies
        run: npm ci

      - name: Run W04 Following and AUTH-013 tests
        run: >-
          npx --no-install vitest run
          workers/W04-feed-search/src/auth-013-projection.test.ts
          workers/W04-feed-search/src/following-feed.test.ts workers/W04-feed-search/src/content-search.test.ts
          workers/W04-feed-search/src/search-trends.test.ts

      - name: Typecheck W04 feed runtime
        run: >-
          npx --no-install tsc --noEmit --strict --skipLibCheck
          --target ES2022 --module ESNext --moduleResolution Bundler
          --lib ES2022,DOM,DOM.Iterable --types @cloudflare/workers-types
          workers/W04-feed-search/src/auth-013-projection.ts
          workers/W04-feed-search/src/index.ts
          workers/W04-feed-search/src/search-trends.ts

      - name: Install locked W01 adapter test dependencies
        working-directory: workers/W01-payload
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Run W01 public search adapter tests
        working-directory: workers/W01-payload
        run: pnpm exec vitest run --config ./vitest.config.mts tests/int/search-v1-adapter.int.spec.ts
