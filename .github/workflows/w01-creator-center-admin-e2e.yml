name: W01 Creator Center Admin E2E

on:
  push:
    branches:
      - 'feat/creator-center-*'
    paths:
      - 'workers/W01-payload/**'
      - '.github/workflows/w01-creator-center-admin-e2e.yml'
  pull_request:
    paths:
      - 'workers/W01-payload/**'
      - '.github/workflows/w01-creator-center-admin-e2e.yml'
  workflow_dispatch:

jobs:
  creator-center-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install W01 dependencies
        working-directory: workers/W01-payload
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Payload import map
        working-directory: workers/W01-payload
        env:
          NODE_OPTIONS: --no-deprecation
          PAYLOAD_SECRET: luckread-creator-center-e2e-secret
        run: pnpm run generate:importmap

      - name: Show generated admin import map diff
        run: git diff -- workers/W01-payload/src/app/'(payload)'/admin/importMap.js

      - name: Typecheck W01
        working-directory: workers/W01-payload
        env:
          NODE_OPTIONS: --no-deprecation
          PAYLOAD_SECRET: luckread-creator-center-e2e-secret
        run: pnpm exec tsc --noEmit

      - name: Production build
        working-directory: workers/W01-payload
        env:
          NODE_OPTIONS: --no-deprecation
          PAYLOAD_SECRET: luckread-creator-center-e2e-secret
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm run build

      - name: Install Chromium
        working-directory: workers/W01-payload
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Creator Center E2E
        working-directory: workers/W01-payload
        env:
          NODE_OPTIONS: --no-deprecation
          PAYLOAD_SECRET: luckread-creator-center-e2e-secret
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec playwright test tests/e2e/creator-center-admin.spec.ts --config=playwright.config.ts
