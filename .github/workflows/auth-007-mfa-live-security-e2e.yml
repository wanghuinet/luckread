name: AUTH-007 MFA Live Security E2E

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact implementation commit already contained in protected main
        required: true
        type: string
      confirm:
        description: Type RUN_MFA_E2E to mutate only the dedicated MFA QA account
        required: true
        type: string
        default: NO

permissions:
  actions: read
  contents: read
  deployments: read
  pull-requests: read

concurrency:
  group: auth-007-mfa-live-security-e2e
  cancel-in-progress: false

jobs:
  live-security-e2e:
    if: ${{ inputs.confirm == 'RUN_MFA_E2E' && github.ref == 'refs/heads/main' && github.ref_protected == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: auth-mfa-rollout
    steps:
      - name: Checkout protected main for source validation
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable source SHA is committed to protected main
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::source_sha must be a full 40-character commit SHA"
            exit 1
          fi
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main || {
            echo "::error::source_sha must already be committed to protected main"
            exit 1
          }

      - name: Checkout exact tested source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify protected AUTH-007 rollout admission before live MFA checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
          AUTH007_ROLLOUT_ENVIRONMENT: auth-mfa-rollout
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: node scripts/verify-auth-007-rollout-admission.mjs

      - name: Check MFA E2E harness syntax
        run: node --check scripts/auth-007-mfa-live-security-e2e.mjs

      - name: Run production MFA enrollment, invalid-code, replay and disable acceptance
        env:
          LUCKREAD_API_BASE_URL: https://api.luckread.com
          LUCKREAD_BROWSER_ORIGIN: https://luckread.com
          LUCKREAD_SOURCE_SHA: ${{ inputs.source_sha }}
          LUCKREAD_AUTH007_MFA_E2E_EMAIL: ${{ secrets.LUCKREAD_AUTH007_MFA_E2E_EMAIL }}
          LUCKREAD_AUTH007_MFA_E2E_PASSWORD: ${{ secrets.LUCKREAD_AUTH007_MFA_E2E_PASSWORD }}
        run: node scripts/auth-007-mfa-live-security-e2e.mjs

      - name: Upload sanitized MFA security E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-007-mfa-live-security-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mapping-0/auth-007-mfa-live-security-e2e/*.json
          if-no-files-found: warn
          retention-days: 30
