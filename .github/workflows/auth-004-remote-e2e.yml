name: AUTH-004 Remote HTTP E2E Evidence

on:
  workflow_run:
    workflows:
      - W01 W02 Auth Binding Deploy
    types: [completed]
  workflow_dispatch:
    inputs:
      tested_commit:
        description: Exact W01 source commit deployed by W01 W02 Auth Binding Deploy
        required: true
        type: string
      w01_base_url:
        description: Controlled W01 public URL
        required: true
        default: https://luckread-w01-payload.wanghui-79b.workers.dev
        type: string
      database_name:
        description: Controlled D1 database name
        required: true
        default: luckread
        type: string
      deployment_run_id:
        description: Optional successful W01 W02 Auth Binding Deploy run ID
        required: false
        type: string

permissions:
  contents: read
  actions: read

env:
  WRANGLER_VERSION: 4.116.0
  W01_BASE_URL: ${{ github.event_name == 'workflow_run' && 'https://luckread-w01-payload.wanghui-79b.workers.dev' || inputs.w01_base_url }}
  DATABASE_NAME: ${{ github.event_name == 'workflow_run' && 'luckread' || inputs.database_name }}
  DEPLOYMENT_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.deployment_run_id }}
  DEPLOYMENT_HEAD_SHA: ${{ github.event_name == 'workflow_run' && '' || inputs.tested_commit }}

jobs:
  remote-e2e:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve exact deployed source SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "workflow_run" ]; then
            test -n "${DEPLOYMENT_HEAD_SHA}"
            exit 0
          fi
          test -n "${DEPLOYMENT_RUN_ID}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${DEPLOYMENT_RUN_ID}" > /tmp/deploy.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${DEPLOYMENT_RUN_ID}/artifacts?per_page=100" > /tmp/deploy-artifacts.json
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'
          const run = JSON.parse(readFileSync('/tmp/deploy.json','utf8'))
          const artifacts = JSON.parse(readFileSync('/tmp/deploy-artifacts.json','utf8'))
          if (run.name !== 'W01 W02 Auth Binding Deploy' || run.conclusion !== 'success' || run.head_branch !== 'main') throw new Error('invalid deployment provenance')
          const matches = (artifacts.artifacts ?? [])
            .filter((a) => typeof a?.name === 'string' && a.name.startsWith('w01-w02-binding-deployment-') && !a.expired)
            .sort((a, b) => String(b.created_at ?? '').localeCompare(String(a.created_at ?? '')))
          if (matches.length < 1) throw new Error('expected a live W01 deployment artifact, found none')
          const shas = [...new Set(matches.map((a) => a.name.slice('w01-w02-binding-deployment-'.length)).filter((sha) => /^[0-9a-f]{40}$/.test(sha)))]
          if (shas.length !== 1) throw new Error(`deployment artifacts contain ambiguous source SHAs: ${shas.join(',') || 'none'}`)
          const sha = shas[0]
          appendFileSync(process.env.GITHUB_ENV, `DEPLOYMENT_HEAD_SHA=${sha}\n`)
          console.log(`Accepted W01 deployment run ${run.id}; exact deployed source SHA=${sha}; artifactId=${matches[0].id}; duplicateLiveArtifactsIgnored=${matches.length - 1}; workflowHeadSHA=${run.head_sha}`)
          NODE
      - name: Checkout exact deployed source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOYMENT_HEAD_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false
      - name: Install locked W01 dependencies
        working-directory: workers/W01-payload
        run: pnpm install --frozen-lockfile
      - name: Verify deployed source and current Payload baseline
        working-directory: workers/W01-payload
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${DEPLOYMENT_HEAD_SHA}"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const p=JSON.parse(readFileSync('package.json','utf8'))
          if (p.dependencies?.payload !== '3.90.2' || p.dependencies?.['@payloadcms/db-d1-sqlite'] !== '3.90.2') throw new Error('Payload 3.90.2 source admission failed')
          NODE
      - name: Materialize exact deployed-source AUTH-004 remote probe
        working-directory: workers/W01-payload
        env:
          DEPLOYED_SHA: ${{ env.DEPLOYMENT_HEAD_SHA }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOYED_SHA"
          mkdir -p ../../scripts
          git show "$DEPLOYED_SHA:scripts/auth-004-remote-e2e.mjs" > ../../scripts/auth-004-remote-e2e.mjs
          test -s ../../scripts/auth-004-remote-e2e.mjs
      - name: Verify controlled remote Payload migration precondition
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "$DATABASE_NAME" --remote --json --config workers/W01-payload/wrangler.jsonc \
            --command "SELECT id,name,batch FROM payload_migrations WHERE name='20260928_104842_MIG_PAYLOAD_3902_NATIVE_SCHEMA_V1';" > /tmp/auth004-migration.json
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "$DATABASE_NAME" --remote --json --config workers/W01-payload/wrangler.jsonc \
            --command 'PRAGMA table_info("users");' > /tmp/auth004-users.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const collect=(v,out=[])=>{if(Array.isArray(v)){for(const x of v)collect(x,out)}else if(v&&typeof v==='object'){if(Array.isArray(v.results))out.push(...v.results);if(Array.isArray(v.result))out.push(...v.result);for(const x of Object.values(v))collect(x,out)}return out}
          const read=(p)=>JSON.parse(readFileSync(p,'utf8'))
          const rows=(p)=>[...new Map(collect(read(p)).map(x=>[JSON.stringify(x),x])).values()]
          const migration=rows('/tmp/auth004-migration.json')
          const users=rows('/tmp/auth004-users.json')
          if(migration.length!==1 || String(migration[0]?.name)!=='20260928_104842_MIG_PAYLOAD_3902_NATIVE_SCHEMA_V1') throw new Error('AUTH-004 remote migration precondition failed')
          if(!users.some((r)=>String(r.name)==='reset_password_requested_at')) throw new Error('AUTH-004 reset-requested-at schema precondition failed')
          console.log('AUTH-004 remote migration precondition PASS')
          NODE
      - name: Start controlled W01 runtime tail
        working-directory: workers/W01-payload
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ../../artifacts/evidence/auth-004/remote-e2e
          nohup npx --yes "wrangler@${WRANGLER_VERSION}" tail luckread-w01-payload --format json --method POST --once > ../../artifacts/evidence/auth-004/remote-e2e/w01-runtime-tail.jsonl 2>&1 &
          echo $! > /tmp/auth004-w01-tail.pid
          sleep 3

      - name: Run controlled AUTH-004 remote HTTP E2E
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          W01_BASE_URL: ${{ env.W01_BASE_URL }}
          DATABASE_NAME: ${{ env.DATABASE_NAME }}
          WRANGLER_VERSION: ${{ env.WRANGLER_VERSION }}
        run: node scripts/auth-004-remote-e2e.mjs

      - name: Stop controlled W01 runtime tail
        if: always()
        run: |
          set +e
          if [ -f /tmp/auth004-w01-tail.pid ]; then
            kill "$(cat /tmp/auth004-w01-tail.pid)" >/dev/null 2>&1 || true
            sleep 2
          fi
      - name: Upload AUTH-004 remote E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-004-remote-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence/auth-004/remote-e2e/
          if-no-files-found: error
          retention-days: 30
