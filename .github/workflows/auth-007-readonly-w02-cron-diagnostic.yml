name: AUTH-007 Read-only W02 Cron Diagnostic

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact diagnostic source commit already contained in protected main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: auth-007-readonly-w02-cron-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    if: ${{ github.ref == 'refs/heads/main' && github.ref_protected == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: auth-mfa-rollout
    steps:
      - name: Checkout protected main for source validation
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable diagnostic source SHA is committed to protected main
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::source_sha must be a full 40-character commit SHA"
            exit 1
          fi
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main || {
            echo "::error::source_sha must already be committed to protected main"
            exit 1
          }

      - name: Checkout exact diagnostic source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate read-only probes and regression tests
        run: |
          set -euo pipefail
          node --check scripts/auth-007-probe-w02-tail-access.mjs
          node --check scripts/auth-007-probe-w02-cron-schedule.mjs
          node --check scripts/auth-007-probe-w02-observability.mjs
          node --test scripts/auth-007-probe-w02-tail-access.test.mjs
          node --test scripts/auth-007-probe-w02-cron-schedule.test.mjs
          node --test scripts/auth-007-probe-w02-observability.test.mjs

      - name: Run read-only production W02 probes
        id: production_probes
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          tail_output="$(node scripts/auth-007-probe-w02-tail-access.mjs 2>&1)"
          tail_exit=$?
          printf '%s\n' "$tail_output"

          cron_output="$(node scripts/auth-007-probe-w02-cron-schedule.mjs 2>&1)"
          cron_exit=$?
          printf '%s\n' "$cron_output"

          observability_output="$(node scripts/auth-007-probe-w02-observability.mjs 2>&1)"
          observability_exit=$?
          printf '%s\n' "$observability_output"

          cron_status="$(printf '%s\n' "$cron_output" | sed -n 's/^W02_CRON_SCHEDULE_PREFLIGHT status=\([A-Z]*\).*/\1/p' | head -n 1)"
          observability_status="$(printf '%s\n' "$observability_output" | sed -n 's/^W02_OBSERVABILITY_CRON_DIAGNOSTIC status=\([A-Z]*\).*/\1/p' | head -n 1)"
          scheduled_observed="$(printf '%s\n' "$observability_output" | sed -n 's/.*scheduledExecutionObserved=\(true\|false\).*/\1/p' | tail -n 1)"

          printf 'W02_READ_ONLY_DIAGNOSTIC tail_exit=%s cron_exit=%s cron_status=%s observability_exit=%s observability_status=%s scheduled_observed=%s\n' \
            "$tail_exit" "$cron_exit" "${cron_status:-UNKNOWN}" "$observability_exit" "${observability_status:-UNKNOWN}" "${scheduled_observed:-false}"

          echo "tail_exit=$tail_exit" >> "$GITHUB_OUTPUT"
          echo "cron_exit=$cron_exit" >> "$GITHUB_OUTPUT"
          echo "cron_status=${cron_status:-UNKNOWN}" >> "$GITHUB_OUTPUT"
          echo "observability_exit=$observability_exit" >> "$GITHUB_OUTPUT"
          echo "observability_status=${observability_status:-UNKNOWN}" >> "$GITHUB_OUTPUT"
          echo "scheduled_observed=${scheduled_observed:-false}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Require valid schedule and observed scheduled execution
        env:
          CRON_EXIT: ${{ steps.production_probes.outputs.cron_exit }}
          CRON_STATUS: ${{ steps.production_probes.outputs.cron_status }}
          OBSERVABILITY_EXIT: ${{ steps.production_probes.outputs.observability_exit }}
          OBSERVABILITY_STATUS: ${{ steps.production_probes.outputs.observability_status }}
          SCHEDULED_OBSERVED: ${{ steps.production_probes.outputs.scheduled_observed }}
        run: |
          set -euo pipefail
          if [[ "$CRON_EXIT" != "0" || "$CRON_STATUS" != "PASS" ]]; then
            echo "::error::The deployed W02 Cron schedule could not be verified."
            exit 1
          fi
          if [[ "$OBSERVABILITY_EXIT" != "0" || "$OBSERVABILITY_STATUS" != "PASS" ]]; then
            echo "::error::W02 Observability query failed; production scheduled execution remains unverified."
            exit 1
          fi
          if [[ "$SCHEDULED_OBSERVED" != "true" ]]; then
            echo "::error::No recent W02 scheduled execution was observed. Do not rerun the mutating MFA E2E; investigate scheduler delivery or logging."
            exit 1
          fi
          echo "W02_READ_ONLY_DIAGNOSTIC_PASS=true"
          echo "Tail-list access is informational; this workflow makes no production mutations."
