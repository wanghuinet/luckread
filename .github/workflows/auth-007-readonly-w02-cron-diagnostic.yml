name: AUTH-007 Read-only W02 Cron Diagnostic

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source SHA for this protected-main dispatch; must equal the triggering commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: auth-007-readonly-w02-cron-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    if: ${{ github.ref == 'refs/heads/main' && github.ref_protected == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout protected main for source validation
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate diagnostic source SHA matches this protected-main dispatch
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::source_sha must be a full 40-character commit SHA"
            exit 1
          fi
          if [[ "$SOURCE_SHA" != "$TRIGGER_SHA" ]]; then
            echo "::error::source_sha must equal the protected-main commit that triggered this workflow"
            exit 1
          fi
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main || {
            echo "::error::source_sha must already be committed to protected main"
            exit 1
          }

      - name: Checkout exact diagnostic source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate read-only probes and regression tests
        run: |
          set -euo pipefail
          node --check scripts/auth-007-probe-w02-cron-schedule.mjs
          node --check scripts/auth-007-probe-w02-scheduled-analytics.mjs
          node --check scripts/auth-007-probe-w02-observability.mjs
          node --test scripts/auth-007-probe-w02-cron-schedule.test.mjs
          node --test scripts/auth-007-probe-w02-scheduled-analytics.test.mjs

      - name: Run least-privilege read-only production W02 probes
        id: production_probes
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_AUTH007_READONLY_ACCOUNT_ID }}
          CLOUDFLARE_AUTH007_READONLY_API_TOKEN: ${{ secrets.CLOUDFLARE_AUTH007_READONLY_API_TOKEN }}
        run: |
          set +e
          cron_output="$(node scripts/auth-007-probe-w02-cron-schedule.mjs 2>&1)"
          cron_exit=$?
          printf '%s\n' "$cron_output"

          analytics_output="$(node scripts/auth-007-probe-w02-scheduled-analytics.mjs 2>&1)"
          analytics_exit=$?
          printf '%s\n' "$analytics_output"

          cron_status="$(printf '%s\n' "$cron_output" | sed -n 's/^W02_CRON_SCHEDULE_PREFLIGHT status=\([A-Z]*\).*/\1/p' | head -n 1)"
          scheduled_observed="$(printf '%s\n' "$analytics_output" | sed -n 's/^W02_SCHEDULED_ANALYTICS_PREFLIGHT .*scheduled_execution_observed=\(true\|false\).*/\1/p' | tail -n 1)"

          printf 'W02_READ_ONLY_DIAGNOSTIC cron_exit=%s cron_status=%s analytics_exit=%s scheduled_observed=%s\n' \
            "$cron_exit" "${cron_status:-UNKNOWN}" "$analytics_exit" "${scheduled_observed:-false}"

          echo "cron_exit=$cron_exit" >> "$GITHUB_OUTPUT"
          echo "cron_status=${cron_status:-UNKNOWN}" >> "$GITHUB_OUTPUT"
          echo "analytics_exit=$analytics_exit" >> "$GITHUB_OUTPUT"
          echo "scheduled_observed=${scheduled_observed:-false}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Require valid schedule and recent observed execution
        env:
          CRON_EXIT: ${{ steps.production_probes.outputs.cron_exit }}
          CRON_STATUS: ${{ steps.production_probes.outputs.cron_status }}
          ANALYTICS_EXIT: ${{ steps.production_probes.outputs.analytics_exit }}
          SCHEDULED_OBSERVED: ${{ steps.production_probes.outputs.scheduled_observed }}
        run: |
          set -euo pipefail
          if [[ "$CRON_EXIT" != "0" || "$CRON_STATUS" != "PASS" ]]; then
            echo "::error::The deployed W02 Cron schedule could not be verified with the read-only credential."
            exit 1
          fi
          if [[ "$ANALYTICS_EXIT" != "0" || "$SCHEDULED_OBSERVED" != "true" ]]; then
            echo "::error::No recent W02 scheduled execution was proven by the independent Analytics dataset. Do not run mutating MFA E2E."
            exit 1
          fi
          echo "W02_READ_ONLY_DIAGNOSTIC_PASS=true"
          echo "productionMutationPerformed=false"
          echo "workerDeploymentPerformed=false"
