name: Better Auth lock bootstrap

on:
  push:
    branches:
      - superpowers/better-auth-adoption
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: superpowers/better-auth-adoption
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: workers/W01-payload/pnpm-lock.yaml
      - name: Regenerate W01 lockfile
        working-directory: workers/W01-payload
        run: pnpm install --lockfile-only
      - name: Commit lockfile
        run: |
          if git diff --quiet -- workers/W01-payload/pnpm-lock.yaml; then
            echo "LOCKFILE_CHANGED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/W01-payload/pnpm-lock.yaml
          git commit -m "chore: regenerate W01 pnpm lockfile for Better Auth"
          git push origin HEAD:superpowers/better-auth-adoption
          echo "LOCKFILE_CHANGED=true" >> "$GITHUB_ENV"
