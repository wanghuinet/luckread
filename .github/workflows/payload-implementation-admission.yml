name: Payload Implementation Admission

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'app/**'
      - 'collections/**'
      - 'payload/**'
      - 'lib/**'
      - 'server/**'
      - 'routes/**'
      - 'docs/16-P0-PAYLOAD-AUTHORIZATION-BOUNDARY-CONTRACT-v1.0.md'
      - 'docs/17-P0-AUTHORIZATION-IMPLEMENTATION-AUDIT-v1.0.md'
      - 'docs/18-P0-PAYLOAD-IMPLEMENTATION-ADMISSION-GATE-v1.0.md'
      - 'contracts/authz/**'
      - 'scripts/payload-implementation-admission-check.mjs'
      - '.github/workflows/payload-implementation-admission.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'app/**'
      - 'collections/**'
      - 'payload/**'
      - 'lib/**'
      - 'server/**'
      - 'routes/**'
      - 'docs/16-P0-PAYLOAD-AUTHORIZATION-BOUNDARY-CONTRACT-v1.0.md'
      - 'docs/17-P0-AUTHORIZATION-IMPLEMENTATION-AUDIT-v1.0.md'
      - 'docs/18-P0-PAYLOAD-IMPLEMENTATION-ADMISSION-GATE-v1.0.md'
      - 'contracts/authz/**'
      - 'scripts/payload-implementation-admission-check.mjs'
      - '.github/workflows/payload-implementation-admission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admission:
    name: Payload Implementation Admission
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run implementation admission gate
        run: node scripts/payload-implementation-admission-check.mjs
