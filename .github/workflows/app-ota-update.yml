name: LuckRead APP OTA Update

on:
  workflow_dispatch:
    inputs:
      runtime_version:
        description: Exact versionName embedded in the installed LuckRead APK (for example 1.0.0-beta.123)
        required: true
        type: string
      android_build_run_id:
        description: Successful Android Beta Release Actions run ID that produced the target APK (artifact retained for up to 90 days)
        required: true
        type: string
      channel:
        description: EAS Update channel embedded in the target APK
        required: true
        type: choice
        options:
          - preview
          - production
        default: preview
      environment:
        description: EAS environment used while bundling the update
        required: true
        type: choice
        options:
          - preview
          - production
        default: preview
      message:
        description: Short release note for this OTA update
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: luckread-app-ota-${{ inputs.channel }}
  cancel-in-progress: false

env:
  CI: "1"
  EXPO_NO_TELEMETRY: "1"

jobs:
  publish:
    name: Publish compatible APP update
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID || secrets.EXPO_PROJECT_ID }}
      EXPO_UPDATE_CHANNEL: ${{ inputs.channel }}
      LUCKREAD_RUNTIME_VERSION: ${{ inputs.runtime_version }}
      LUCKREAD_REQUIRE_OTA_CONFIG: "1"
      POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
      POSTHOG_CLI_PROJECT_ID: "715723"
      POSTHOG_CLI_HOST: "https://us.posthog.com"
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.13.1"

      - name: Install and verify PostHog CLI
        run: |
          test -n "$POSTHOG_CLI_API_KEY" || { echo "::error::POSTHOG_CLI_API_KEY is required to upload OTA Hermes source maps." >&2; exit 1; }
          npm install --global @posthog/cli@0.19.0
          posthog-cli --version

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.38"

      - name: Validate OTA credentials and target runtime
        env:
          OTA_RUNTIME_VERSION: ${{ inputs.runtime_version }}
          OTA_MESSAGE: ${{ inputs.message }}
          OTA_CHANNEL: ${{ inputs.channel }}
          OTA_ENVIRONMENT: ${{ inputs.environment }}
          OTA_BUILD_RUN_ID: ${{ inputs.android_build_run_id }}
        run: |
          test -n "$EXPO_TOKEN" || { echo "::error::GitHub secret EXPO_TOKEN is missing." >&2; exit 1; }
          test -n "$EXPO_PROJECT_ID" || { echo "::error::Set GitHub repository variable EXPO_PROJECT_ID (or secret EXPO_PROJECT_ID) to the EAS project UUID." >&2; exit 1; }
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::OTA publication must be dispatched from protected main." >&2; exit 1; }
          if ! [[ "$OTA_RUNTIME_VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::runtime_version must exactly match the target APK versionName." >&2
            exit 1
          fi
          if ! [[ "$OTA_BUILD_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::android_build_run_id must be a GitHub Actions run ID." >&2
            exit 1
          fi
          if [[ "$OTA_CHANNEL" != "$OTA_ENVIRONMENT" ]]; then
            echo "::error::The EAS channel and environment must match." >&2
            exit 1
          fi
          test -n "$OTA_MESSAGE" || { echo "::error::A release message is required." >&2; exit 1; }

      - name: Verify successful Android Beta build provenance
        id: target-build
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BUILD_RUN_ID: ${{ inputs.android_build_run_id }}
          EXPECTED_CHANNEL: ${{ inputs.channel }}
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_BUILD_RUN_ID" \
            -o "$RUNNER_TEMP/luckread-target-build-run.json"
          node - "$RUNNER_TEMP/luckread-target-build-run.json" <<'NODE'
          const fs = require("node:fs");
          const run = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const repository = process.env.GITHUB_REPOSITORY;
          const expectedPath = ".github/workflows/app-android-beta-release.yml";
          if (run.name !== "LuckRead Android Beta Release" || !String(run.path ?? "").startsWith(expectedPath)) {
            throw new Error("The selected run is not the LuckRead Android Beta Release workflow.");
          }
          if (run.repository?.full_name !== repository || run.status !== "completed" || run.conclusion !== "success") {
            throw new Error("The selected Android build must be a completed successful run in this repository.");
          }
          const channel = process.env.EXPECTED_CHANNEL;
          const isProductionBuild = channel === "production" &&
            run.head_branch === "main" &&
            ["push", "workflow_dispatch"].includes(run.event);
          const isPreviewBuild = channel === "preview" &&
            run.event === "pull_request" &&
            run.head_repository?.full_name === repository;
          if (!isProductionBuild && !isPreviewBuild) {
            throw new Error("The selected Android build event/branch does not match the requested EAS channel.");
          }
          if (!/^[0-9a-f]{40}$/i.test(String(run.head_sha ?? ""))) {
            throw new Error("The selected Android build has no valid source commit.");
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, [
            "source_sha=" + run.head_sha,
            "source_branch=" + run.head_branch,
            "event=" + run.event,
          ].join("\n") + "\n");
          console.log("Verified Android build run " + run.id + " from " + run.head_branch + " (" + run.conclusion + ").");
          NODE

      - name: Download APK and build provenance from the selected run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.android_build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/luckread-ota-target-build

      - name: Verify exact target APK, channel, runtime and checksum
        env:
          TARGET_BUILD_RUN_ID: ${{ inputs.android_build_run_id }}
          TARGET_BUILD_SOURCE_SHA: ${{ steps.target-build.outputs.source_sha }}
          TARGET_BUILD_SOURCE_BRANCH: ${{ steps.target-build.outputs.source_branch }}
          TARGET_BUILD_EVENT: ${{ steps.target-build.outputs.event }}
          OTA_RUNTIME_VERSION: ${{ inputs.runtime_version }}
          OTA_CHANNEL: ${{ inputs.channel }}
        run: |
          mapfile -t manifests < <(find "$RUNNER_TEMP/luckread-ota-target-build" -type f -name ota-build-metadata.json -print)
          if [ "${#manifests[@]}" -ne 1 ]; then
            echo "::error::The selected APK artifact must contain exactly one ota-build-metadata.json." >&2
            exit 1
          fi
          node scripts/verify-ota-build-provenance.mjs \
            "${manifests[0]}" \
            "$TARGET_BUILD_RUN_ID" \
            "$OTA_RUNTIME_VERSION" \
            "$OTA_CHANNEL" \
            "$EXPO_PROJECT_ID" \
            "$TARGET_BUILD_SOURCE_SHA" \
            "$TARGET_BUILD_SOURCE_BRANCH" \
            "$TARGET_BUILD_EVENT"

      - name: Install Expo app dependencies
        run: bun install

      - name: Verify resolved OTA config and run APP checks
        run: |
          bun test tests/ota-config.test.mjs
          bun test tests/ota-build-provenance.test.mjs
          bun run typecheck
          bunx expo config --type public --json > "$RUNNER_TEMP/luckread-expo-config.json"
          node - "$RUNNER_TEMP/luckread-expo-config.json" <<'NODE'
          const fs = require("node:fs");
          const config = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const expectedUrl = "https://u.expo.dev/" + process.env.EXPO_PROJECT_ID;
          if (config.updates?.enabled !== true || config.updates?.url !== expectedUrl) {
            throw new Error("EAS Update is not enabled for the configured Expo project.");
          }
          if (config.extra?.eas?.projectId !== process.env.EXPO_PROJECT_ID) {
            throw new Error("Resolved Expo project ID does not match EXPO_PROJECT_ID.");
          }
          if (config.updates?.requestHeaders?.["expo-channel-name"] !== process.env.EXPO_UPDATE_CHANNEL) {
            throw new Error("Configured channel does not match the requested channel.");
          }
          if (config.runtimeVersion?.policy !== "appVersion" || config.version !== process.env.LUCKREAD_RUNTIME_VERSION) {
            throw new Error("OTA runtime does not exactly match the target APK versionName.");
          }
          console.log("Verified EAS project, channel and runtime version.");
          NODE

      - name: Publish Android Expo Update
        env:
          OTA_MESSAGE: ${{ inputs.message }}
          OTA_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          mkdir -p "$RUNNER_TEMP/luckread-ota-publication"
          npx --yes eas-cli@latest update \
            --channel "$EXPO_UPDATE_CHANNEL" \
            --message "$OTA_MESSAGE" \
            --environment "$OTA_ENVIRONMENT" \
            --platform android \
            --emit-metadata \
            --json \
            > "$RUNNER_TEMP/luckread-eas-update-result.json"

      - name: Upload Expo Hermes source maps to PostHog Error Tracking
        run: |
          test -d dist || { echo "::error::EAS Update did not produce the expected dist/ source-map directory." >&2; exit 1; }
          MAP_COUNT="$(find dist -type f -name '*.map' | wc -l | tr -d ' ')"
          test "$MAP_COUNT" -gt 0 || { echo "::error::No Hermes/JavaScript source maps were found under dist/; refusing to report OTA diagnostics as symbolicated." >&2; exit 1; }
          posthog-cli hermes upload --directory dist

      - name: Record OTA publication provenance
        env:
          TARGET_BUILD_RUN_ID: ${{ inputs.android_build_run_id }}
          TARGET_BUILD_SOURCE_SHA: ${{ steps.target-build.outputs.source_sha }}
          TARGET_BUILD_SOURCE_BRANCH: ${{ steps.target-build.outputs.source_branch }}
          TARGET_BUILD_EVENT: ${{ steps.target-build.outputs.event }}
        run: |
          cp "$RUNNER_TEMP/luckread-eas-update-result.json" "$RUNNER_TEMP/luckread-ota-publication/eas-update-result.json"
          node - "$RUNNER_TEMP/luckread-ota-publication/ota-publication.json" <<'NODE'
          const fs = require("node:fs");
          const output = {
            workflow: "LuckRead APP OTA Update",
            workflowRunId: process.env.GITHUB_RUN_ID,
            otaSourceSha: process.env.GITHUB_SHA,
            otaSourceRef: process.env.GITHUB_REF,
            targetBuildRunId: process.env.TARGET_BUILD_RUN_ID,
            targetBuildSourceSha: process.env.TARGET_BUILD_SOURCE_SHA,
            targetBuildSourceBranch: process.env.TARGET_BUILD_SOURCE_BRANCH,
            targetBuildEvent: process.env.TARGET_BUILD_EVENT,
            runtimeVersion: process.env.LUCKREAD_RUNTIME_VERSION,
            channel: process.env.EXPO_UPDATE_CHANNEL,
            environment: process.env.OTA_ENVIRONMENT,
            platform: "android",
            projectId: process.env.EXPO_PROJECT_ID,
            easUpdateResultFile: "eas-update-result.json",
          };
          fs.writeFileSync(process.argv[2], JSON.stringify(output, null, 2) + "\n");
          NODE
          find . -type f -name eas-update-metadata.json -not -path './node_modules/*' -print -quit | while read -r metadata; do
            cp "$metadata" "$RUNNER_TEMP/luckread-ota-publication/eas-update-metadata.json"
          done

      - name: Upload OTA publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: luckread-ota-publication-${{ inputs.runtime_version }}-${{ github.run_id }}
          path: ${{ runner.temp }}/luckread-ota-publication/*
          if-no-files-found: error
          retention-days: 90
