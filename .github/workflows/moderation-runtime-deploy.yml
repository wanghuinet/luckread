name: Moderation Runtime Deploy

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit to deploy for the coordinated W01/W03/W06 moderation slice
        required: true
        type: string
        default: 81986b7510efb20a5dd44f9971ca40794989ddff
      confirm:
        description: Type DEPLOY_MODERATION to permit this controlled deployment
        required: true
        type: string
        default: DEPLOY_MODERATION

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: ${{ inputs.confirm == 'DEPLOY_MODERATION'  }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha  }}

      - name: Verify moderation source CI admission
        env:
          GH_TOKEN: ${{ github.token  }}
          SOURCE_SHA: ${{ inputs.source_sha  }}
        run: |
          set -euo pipefail
          conclusion="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow moderation-runtime-source-ci.yml --commit "$SOURCE_SHA" --limit 1 --json conclusion --jq '.[0].conclusion // empty')"
          test "$conclusion" = success || {
            echo "Moderation source CI is not SUCCESS for $SOURCE_SHA (observed: ${conclusion:-none})"
            exit 1
          }

      - name: Verify frozen topology and trusted bindings
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const w01=JSON.parse(fs.readFileSync('workers/W01-payload/wrangler.jsonc','utf8'));
          const w03=JSON.parse(fs.readFileSync('workers/W03-content/wrangler.jsonc','utf8'));
          const w06=JSON.parse(fs.readFileSync('workers/W06-governance/wrangler.jsonc','utf8'));
          if (w01.name!=='luckread-w01-payload') throw new Error('W01 identity mismatch');
          if (w03.name!=='luckread-w03') throw new Error('W03 identity mismatch');
          if (w06.name!=='luckread-w06') throw new Error('W06 identity mismatch');
          if (!(w01.services||[]).some(x=>x.binding==='W06_MODERATION'&&x.service==='luckread-w06')) throw new Error('W01→W06 binding missing');
          if (!(w06.services||[]).some(x=>x.binding==='W03_CONTENT_MODERATION'&&x.service==='luckread-w03')) throw new Error('W06→W03 binding missing');
          if (!(w06.d1_databases||[]).some(x=>x.binding==='D1_03'&&x.database_id==='bda1d247-a371-4244-91ae-aef96034db7f')) throw new Error('D1-03 mismatch');
          if ((w03.d1_databases||[]).some(x=>x.database_id==='bda1d247-a371-4244-91ae-aef96034db7f')) throw new Error('Direct W03→D1-03 access detected');
          console.log('MODERATION_BINDINGS=PASS');
          NODE

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm 11
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.0
          run_install: false

      - name: Install root dependencies
        run: npm ci

      - name: Deploy W03 content authority first
        working-directory: workers/W03-content
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID  }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN  }}
        run: npx --yes wrangler@4.116.0 deploy --config wrangler.jsonc

      - name: Record W03 deployment
        run: echo W03_DEPLOYMENT_COMPLETE

      - name: Deploy W06 moderation authority
        working-directory: workers/W06-governance
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID  }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN  }}
        run: npx --yes wrangler@4.116.0 deploy --config wrangler.jsonc

      - name: Verify W06 deployment record
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID  }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN  }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.116.0 deployments list --name luckread-w06 --json > /tmp/w06-deployments.json
          node -e "const r=require('/tmp/w06-deployments.json'); if(!Array.isArray(r)||!r.length) throw new Error('No W06 deployment returned'); console.log('W06_DEPLOYMENT_RECORD=PASS')"

      - name: Install W01 locked dependencies
        working-directory: workers/W01-payload
        run: pnpm install --frozen-lockfile

      - name: Build W01 OpenNext application
        working-directory: workers/W01-payload
        run: pnpm exec opennextjs-cloudflare build

      - name: Deploy W01 moderation gateway
        working-directory: workers/W01-payload
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID  }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN  }}
        run: npx --yes wrangler@4.116.0 deploy --config wrangler.jsonc

      - name: Capture coordinated deployment provenance
        run: |
          mkdir -p artifacts/mapping-0/moderation-runtime-deploy
          cat > artifacts/mapping-0/moderation-runtime-deploy/provenance.txt <<EOF
          workflow=Moderation Runtime Deploy
          source_sha=${{ inputs.source_sha  }}
          confirmation=DEPLOY_MODERATION
          workers=luckread-w03,luckread-w06,luckread-w01-payload
          new_workers=0
          new_d1=0
          d1_migration=false
          EOF

      - name: Upload deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: moderation-runtime-deployment-${{ inputs.source_sha  }}
          path: artifacts/mapping-0/moderation-runtime-deploy/
          if-no-files-found: error
          retention-days: 14
