name: Materialize Canonical Mapping 0

on:
  push:
    branches: [main]
    paths:
      - 'contracts/alignment/feature-inventory.v1.json'
      - 'contracts/alignment/cross-system-mapping.v1.json'
      - 'scripts/materialize-canonical-mapping.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    name: Materialize missing canonical mapping records
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Materialize canonical records
        run: node scripts/materialize-canonical-mapping.mjs

      - name: Commit materialized records
        run: |
          if git diff --quiet -- contracts/alignment/cross-system-mapping.v1.json; then
            echo 'No mapping materialization changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contracts/alignment/cross-system-mapping.v1.json
          git commit -m 'chore(mapping): materialize canonical Mapping 0 records'
          git push origin HEAD:main
