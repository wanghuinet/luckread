name: W02 AUTH-003 Credential Hash Key Boundary CI

on:
  pull_request:
    paths:
      - 'workers/W02-content/src/index.ts'
      - 'workers/W02-content/src/credentials/credential-hash-key.ts'
      - 'workers/W02-content/src/credentials/credential-hash-key.test.ts'
      - 'workers/W02-content/package.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/w02-credential-key-boundary-ci.yml'
  push:
    branches: [main]
    paths:
      - 'workers/W02-content/src/index.ts'
      - 'workers/W02-content/src/credentials/credential-hash-key.ts'
      - 'workers/W02-content/src/credentials/credential-hash-key.test.ts'
      - 'workers/W02-content/package.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/w02-credential-key-boundary-ci.yml'

permissions:
  contents: read

jobs:
  credential-key-boundary:
    name: W02 Credential Hash Key Boundary Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused boundary tests
        run: npx vitest@3.2.4 run workers/W02-content/src/credentials/credential-hash-key.test.ts
