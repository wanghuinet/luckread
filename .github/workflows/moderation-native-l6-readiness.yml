name: Moderation Native L6 Readiness

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/moderation-native-l6-readiness.yml
  workflow_dispatch:
    inputs:
      base_url:
        description: W01 public moderation base URL
        required: true
        type: string
        default: https://luckread.cn
      confirm:
        description: Type RUN_MODERATION_L6_READY
        required: true
        type: string
        default: RUN_MODERATION_L6_READY

permissions:
  contents: read

jobs:
  readiness:
    if: ${{ github.event_name == 'push' || inputs.confirm == 'RUN_MODERATION_L6_READY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODERATION_BASE_URL: ${{ inputs.base_url }}
      AUTH_BASE_URL: https://api.luckread.cn
      DATABASE_NAME_W01: luckread
      WRANGLER_VERSION: 4.116.0
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Start controlled W01 runtime tail
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/mapping-0/moderation-runtime-e2e
          nohup npx --yes "wrangler@${WRANGLER_VERSION}" tail luckread-w01-payload --format json --method POST --status error > artifacts/mapping-0/moderation-runtime-e2e/w01-runtime-tail.jsonl 2>&1 &
          echo $! > /tmp/moderation-l6-w01-tail.pid
          sleep 3

      - name: Run native L6 moderation authorization readiness
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/moderation-native-l6-readiness.mjs

      - name: Stop controlled W01 runtime tail
        if: always()
        run: |
          set +e
          if [ -f /tmp/moderation-l6-w01-tail.pid ]; then
            kill "$(cat /tmp/moderation-l6-w01-tail.pid)" >/dev/null 2>&1 || true
            sleep 2
          fi

      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moderation-native-l6-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mapping-0/moderation-runtime-e2e/
          if-no-files-found: ignore
          retention-days: 14
