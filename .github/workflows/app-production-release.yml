name: LuckRead Production App Release Builds

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: Build and verify the signed Android App Bundle
        required: true
        type: boolean
        default: false
      build_ios:
        description: Archive, export and verify the signed iOS IPA
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: luckread-production-release-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPO_NO_TELEMETRY: "1"
  CI: "1"
  EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
  EXPO_UPDATE_CHANNEL: production
  LUCKREAD_REQUIRE_OTA_CONFIG: "1"

jobs:
  android-release:
    name: Signed Android production AAB
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.13.1"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.38"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Validate production signing and OTA inputs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in EXPO_PROJECT_ID ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then echo "Missing required production configuration: $name" >&2; exit 1; fi
          done
      - name: Install locked app dependencies
        run: bun install --frozen-lockfile
      - name: Apply and test Hyperswitch React Native compatibility
        run: |
          node scripts/apply-hyperswitch-rn88-compat.mjs
          bun run test:hyperswitch-compat
      - name: Generate clean Android native project
        run: bunx expo prebuild --platform android --clean --no-install
      - name: Prepare protected production keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SIGNING_DIR="${RUNNER_TEMP}/luckread-production-signing"
          mkdir -p "$SIGNING_DIR"
          KEYSTORE_PATH="$SIGNING_DIR/luckread-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Compile signed production Android App Bundle
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease --no-daemon --console=plain
      - name: Verify AAB package, signature and signing certificate
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify -certs "$AAB"
          keytool -printcert -jarfile "$AAB" > "$RUNNER_TEMP/aab-certificate.txt"
          keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > "$RUNNER_TEMP/keystore-certificate.txt"
          AAB_CERT_SHA="$(awk '/SHA256:/{print $2; exit}' "$RUNNER_TEMP/aab-certificate.txt" | tr -d ':')"
          KEY_CERT_SHA="$(awk '/SHA256:/{print $2; exit}' "$RUNNER_TEMP/keystore-certificate.txt" | tr -d ':')"
          test -n "$AAB_CERT_SHA" && test "$AAB_CERT_SHA" = "$KEY_CERT_SHA" || { echo "AAB signer does not match configured production keystore" >&2; exit 1; }
          grep -Eq "applicationId[[:space:]]+['\\\"]com\\.luckread\\.app['\\\"]" android/app/build.gradle || { echo "Unexpected Android applicationId; expected com.luckread.app" >&2; exit 1; }
          sha256sum "$AAB" | tee "$RUNNER_TEMP/android-aab.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: luckread-android-production-aab
          path: |
            app/android/app/build/outputs/bundle/release/app-release.aab
            ${{ runner.temp }}/android-aab.sha256
            ${{ runner.temp }}/aab-certificate.txt
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary Android signing material
        if: always()
        run: rm -rf "${RUNNER_TEMP}/luckread-production-signing"

  ios-release:
    name: Signed iOS production IPA
    if: ${{ inputs.build_ios }}
    runs-on: macos-26
    timeout-minutes: 75
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.13.1"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.38"
      - name: Validate production signing and OTA inputs
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          for name in EXPO_PROJECT_ID IOS_CERTIFICATE_P12_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 IOS_TEAM_ID IOS_EXPORT_OPTIONS_PLIST_BASE64; do
            if [ -z "${!name:-}" ]; then echo "Missing required production configuration: $name" >&2; exit 1; fi
          done
          [[ "$IOS_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "IOS_TEAM_ID must be a 10-character Apple Team ID" >&2; exit 1; }
      - name: Install locked app dependencies
        run: bun install --frozen-lockfile
      - name: Apply and test Hyperswitch React Native compatibility
        run: |
          node scripts/apply-hyperswitch-rn88-compat.mjs
          bun run test:hyperswitch-compat
      - name: Generate clean iOS native project
        run: bunx expo prebuild --platform ios --clean --no-install
      - name: Install Apple distribution identity and provisioning profile
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          SIGNING_DIR="${RUNNER_TEMP}/luckread-ios-signing"
          mkdir -p "$SIGNING_DIR"
          CERT_PATH="$SIGNING_DIR/distribution.p12"
          PROFILE_PATH="$SIGNING_DIR/profile.mobileprovision"
          EXPORT_PATH="$SIGNING_DIR/ExportOptions.plist"
          KEYCHAIN_PATH="$SIGNING_DIR/release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          PROFILE_INSTALL_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_INSTALL_PATH=""
          {
            echo "IOS_KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "IOS_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD"
            echo "IOS_PROFILE_INSTALL_DIR=$PROFILE_INSTALL_DIR"
          } >> "$GITHUB_ENV"
          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          printf '%s' "$IOS_EXPORT_OPTIONS_PLIST_BASE64" | base64 --decode > "$EXPORT_PATH"
          chmod 600 "$CERT_PATH" "$PROFILE_PATH" "$EXPORT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          PROFILE_PLIST="$SIGNING_DIR/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_TEAM="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          PROFILE_INSTALL_PATH="$PROFILE_INSTALL_DIR/$PROFILE_UUID.mobileprovision"
          echo "IOS_PROFILE_INSTALL_PATH=$PROFILE_INSTALL_PATH" >> "$GITHUB_ENV"
          mkdir -p "$PROFILE_INSTALL_DIR"
          install -m 600 "$PROFILE_PATH" "$PROFILE_INSTALL_PATH"
          PROFILE_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")"
          [[ "$PROFILE_TEAM" == "$IOS_TEAM_ID" ]] || { echo "Provisioning profile Team ID mismatch" >&2; exit 1; }
          [[ "$PROFILE_APP_ID" == "$IOS_TEAM_ID.com.luckread.app" ]] || { echo "Provisioning profile must target $IOS_TEAM_ID.com.luckread.app" >&2; exit 1; }
          EXPORT_METHOD="$(/usr/libexec/PlistBuddy -c 'Print :method' "$EXPORT_PATH")"
          EXPORT_TEAM="$(/usr/libexec/PlistBuddy -c 'Print :teamID' "$EXPORT_PATH")"
          EXPORT_STYLE="$(/usr/libexec/PlistBuddy -c 'Print :signingStyle' "$EXPORT_PATH")"
          EXPORT_PROFILE="$(/usr/libexec/PlistBuddy -c 'Print :provisioningProfiles:com.luckread.app' "$EXPORT_PATH")"
          [[ "$EXPORT_METHOD" == "app-store-connect" && "$EXPORT_TEAM" == "$IOS_TEAM_ID" && "$EXPORT_STYLE" == "manual" && "$EXPORT_PROFILE" == "$PROFILE_NAME" ]] || { echo "ExportOptions.plist must use app-store-connect, manual signing, the configured Team ID and the matching com.luckread.app profile" >&2; exit 1; }
          {
            echo "IOS_PROFILE_NAME=$PROFILE_NAME"
            echo "IOS_EXPORT_OPTIONS_PATH=$EXPORT_PATH"
          } >> "$GITHUB_ENV"
      - name: Install CocoaPods dependencies
        run: cd ios && pod install
      - name: Archive signed iOS application
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          WORKSPACE_PATH="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$WORKSPACE_PATH"
          SCHEME="$(basename "$WORKSPACE_PATH" .xcworkspace)"
          xcodebuild archive             -workspace "$WORKSPACE_PATH"             -scheme "$SCHEME"             -configuration Release             -destination 'generic/platform=iOS'             -archivePath "$RUNNER_TEMP/LuckRead.xcarchive"             -derivedDataPath "$RUNNER_TEMP/luckread-derived"             CODE_SIGN_STYLE=Manual             CODE_SIGN_IDENTITY="Apple Distribution"             DEVELOPMENT_TEAM="$IOS_TEAM_ID"             PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME"
      - name: Export and verify signed IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild -exportArchive             -archivePath "$RUNNER_TEMP/LuckRead.xcarchive"             -exportPath "$RUNNER_TEMP/luckread-ipa"             -exportOptionsPlist "$IOS_EXPORT_OPTIONS_PATH"
          IPA="$(find "$RUNNER_TEMP/luckread-ipa" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA" && test -s "$IPA"
          mkdir "$RUNNER_TEMP/ipa-check"
          ditto -x -k "$IPA" "$RUNNER_TEMP/ipa-check"
          APP_PATH="$(find "$RUNNER_TEMP/ipa-check/Payload" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          [[ "$BUNDLE_ID" == "com.luckread.app" ]] || { echo "Unexpected iOS bundle ID: $BUNDLE_ID" >&2; exit 1; }
          codesign --verify --deep --strict "$APP_PATH"
          security cms -D -i "$APP_PATH/embedded.mobileprovision" > "$RUNNER_TEMP/embedded-profile.plist"
          PROFILE_TEAM="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/embedded-profile.plist")"
          [[ "$PROFILE_TEAM" == "$IOS_TEAM_ID" ]] || { echo "Embedded profile Team ID mismatch" >&2; exit 1; }
          shasum -a 256 "$IPA" | tee "$RUNNER_TEMP/ios-ipa.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: luckread-ios-production-ipa
          path: |
            ${{ runner.temp }}/luckread-ipa/*.ipa
            ${{ runner.temp }}/ios-ipa.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary Apple signing material
        if: always()
        run: |
          if [ -n "${IOS_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$IOS_KEYCHAIN_PATH" || true
          fi
          if [ -n "${IOS_PROFILE_INSTALL_PATH:-}" ]; then
            rm -f "$IOS_PROFILE_INSTALL_PATH"
          fi
          if [ -n "${IOS_PROFILE_INSTALL_DIR:-}" ] && [ -d "$IOS_PROFILE_INSTALL_DIR" ]; then
            rmdir "$IOS_PROFILE_INSTALL_DIR" 2>/dev/null || true
          fi
          rm -rf "${RUNNER_TEMP}/luckread-ios-signing"
