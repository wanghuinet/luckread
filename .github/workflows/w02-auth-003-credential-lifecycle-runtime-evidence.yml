name: W02 AUTH-003 Credential Lifecycle Runtime Evidence

on:
  pull_request:
    paths:
      - 'workers/W02-content/src/credentials/credential-add.ts'
      - 'workers/W02-content/src/credentials/credential-lifecycle.ts'
      - 'workers/W02-content/src/credentials/credential-lifecycle.test.ts'
      - '.github/workflows/w02-auth-003-credential-lifecycle-runtime-evidence.yml'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact implementation commit SHA to execute
        required: true
        type: string
      database_name:
        description: Controlled Cloudflare D1 display name
        required: true
        type: string
      confirm:
        description: Type RUN to permit controlled remote D1 runtime evidence
        required: true
        type: string

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run focused lifecycle tests
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
          fi
          npx --yes vitest@3.2.4 run             workers/W02-content/src/credentials/credential-add.test.ts             workers/W02-content/src/credentials/credential-lifecycle.test.ts

  runtime:
    needs: unit
    if: ${{ inputs.confirm == 'RUN' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      D1_01_ID: "2f80471e-3756-49f9-8db1-7707a433ad64"
      DATABASE_NAME: ${{ inputs.database_name }}
      PROBE_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate exact runtime inputs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
          test "${DATABASE_NAME}" = "luckread"
          test -f workers/W02-content/src/credentials/credential-add.ts
          test -f workers/W02-content/src/credentials/credential-lifecycle.ts
          test -z "$(git status --short)"

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"

      - name: Prepare ephemeral remote runtime harness
        run: |
          set -euo pipefail
          cat > .auth003-credential-lifecycle-runtime.wrangler.jsonc <<EOF
          {
            "name": "luckread-w02-auth003-credential-lifecycle-evidence-harness",
            "main": ".auth003-credential-lifecycle-runtime-harness.ts",
            "compatibility_date": "2025-08-15",
            "d1_databases": [
              {
                "binding": "D1_01",
                "database_name": "${DATABASE_NAME}",
                "database_id": "${D1_01_ID}",
                "remote": true
              }
            ],
            "vars": {
              "PROBE_TOKEN": "${PROBE_TOKEN}",
              "RUN_ID": "${{ github.run_id }}",
              "SOURCE_SHA": "${{ inputs.source_sha }}"
            }
          }
          EOF

          cat > .auth003-credential-lifecycle-runtime-harness.ts <<'EOF'
          // CI-only ephemeral harness. Never committed or deployed as a product Worker.
          // @ts-nocheck
          import { hashCredentialValue, normalizeCredentialValue } from './workers/W02-content/src/credentials/credential-add.ts'
          import { removeCredential, replaceCredential } from './workers/W02-content/src/credentials/credential-lifecycle.ts'

          const json = (body, status = 200) =>
            new Response(JSON.stringify(body, null, 2), {
              status,
              headers: { 'content-type': 'application/json', 'cache-control': 'no-store' },
            })

          const credentialSeed = async (kind, value, secret) => {
            const normalized = normalizeCredentialValue(kind, value)
            return {
              normalized,
              valueHash: await hashCredentialValue(kind, normalized, secret),
            }
          }

          export default {
            async fetch(request, env) {
              if (request.method !== 'POST' || new URL(request.url).pathname !== '/probe') {
                return new Response(null, { status: 404 })
              }
              if (request.headers.get('x-auth003-probe-token') !== env.PROBE_TOKEN) {
                return json({ status: 'DENY' }, 403)
              }

              const db = env.D1_01
              const runId = env.RUN_ID.replace(/[^0-9]/g, '')
              const secret = 'remote-evidence-secret-' + env.PROBE_TOKEN + '-stable'
              const userA = 'auth003-life-' + runId + '-a'
              const userB = 'auth003-life-' + runId + '-b'
              const userC = 'auth003-life-' + runId + '-c'
              const identityA = 'auth003-life-identity-' + runId + '-a'
              const identityB = 'auth003-life-identity-' + runId + '-b'
              const identityC = 'auth003-life-identity-' + runId + '-c'
              const credentialA = 'auth3_life_' + runId + '_a'
              const credentialA2 = 'auth3_life_' + runId + '_a2'
              const credentialB = 'auth3_life_' + runId + '_b'
              const credentialB2 = 'auth3_life_' + runId + '_b2'
              const credentialC = 'auth3_life_' + runId + '_c'
              const now0 = '2026-09-27T07:30:00.000Z'
              const now1 = '2026-09-27T07:30:01.000Z'
              const now2 = '2026-09-27T07:30:02.000Z'
              let inserted = false

              try {
                const collision = await db.prepare(
                  'SELECT id FROM auth_identities WHERE id IN (?, ?, ?) OR user_id IN (?, ?, ?) LIMIT 1',
                ).bind(identityA, identityB, identityC, userA, userB, userC).first()
                if (collision) return json({ status: 'FAIL_CLOSED', reason: 'synthetic_collision' }, 409)

                await db.prepare(
                  'INSERT INTO auth_identities (id, user_id, normalization_version) VALUES (?, ?, ?), (?, ?, ?), (?, ?, ?)',
                ).bind(
                  identityA, userA, 'AUTH-003-NORM-V1',
                  identityB, userB, 'AUTH-003-NORM-V1',
                  identityC, userC, 'AUTH-003-NORM-V1',
                ).run()

                const a = await credentialSeed('email', 'old@example.invalid', secret)
                const a2 = await credentialSeed('phone', '+14155552671', secret)
                const b = await credentialSeed('email', 'taken@example.invalid', secret)
                const b2 = await credentialSeed('phone', '+14155552672', secret)
                const c = await credentialSeed('email', 'only@example.invalid', secret)

                for (const row of [
                  [credentialA, identityA, 'email', a.valueHash, a.normalized, now0, now0],
                  [credentialA2, identityA, 'phone', a2.valueHash, a2.normalized, now0, now0],
                  [credentialB, identityB, 'email', b.valueHash, b.normalized, now0, now0],
                  [credentialB2, identityB, 'phone', b2.valueHash, b2.normalized, now0, now0],
                  [credentialC, identityC, 'email', c.valueHash, c.normalized, now0, now0],
                ]) {
                  await db.prepare(
                    'INSERT INTO auth_credentials (id, identity_id, kind, value_hash, normalized_value, verified_at, active, created_at, updated_at) VALUES (?, ?, ?, ?, ?, NULL, 1, ?, ?)',
                  ).bind(...row).run()
                }
                inserted = true

                const crossReplace = await replaceCredential(db, {
                  actorUserId: userA,
                  credentialId: credentialB,
                  value: 'blocked@example.invalid',
                  idempotencyKey: 'life-cross-replace',
                  secret,
                  now: now1,
                }).then(() => 'UNEXPECTED_SUCCESS', (error) => error?.code ?? 'UNKNOWN')

                if (crossReplace !== 'NOT_FOUND') throw new Error('cross-account replace assertion failed')

                const replaced = await replaceCredential(db, {
                  actorUserId: userA,
                  credentialId: credentialA,
                  value: 'new@example.invalid',
                  idempotencyKey: 'life-replace-a',
                  secret,
                  now: now1,
                })

                if (
                  replaced.credentialId !== credentialA ||
                  replaced.kind !== 'email' ||
                  replaced.active !== true
                ) throw new Error('replace public projection assertion failed')

                const postReplace = await db.prepare(
                  'SELECT normalized_value, active, updated_at FROM auth_credentials WHERE id = ? LIMIT 1',
                ).bind(credentialA).first()

                if (
                  postReplace.normalized_value !== 'new@example.invalid' ||
                  postReplace.active !== 1 ||
                  postReplace.updated_at !== now1
                ) throw new Error('replace persistence assertion failed')

                const conflict = await replaceCredential(db, {
                  actorUserId: userA,
                  credentialId: credentialA,
                  value: 'taken@example.invalid',
                  idempotencyKey: 'life-replace-conflict',
                  secret,
                  now: now2,
                }).then(() => 'UNEXPECTED_SUCCESS', (error) => error?.code ?? 'UNKNOWN')

                if (conflict !== 'CONFLICT') throw new Error('replace uniqueness conflict assertion failed')

                const replay = await replaceCredential(db, {
                  actorUserId: userA,
                  credentialId: credentialA,
                  value: 'new@example.invalid',
                  idempotencyKey: 'life-replace-a',
                  secret,
                  now: now2,
                })

                const replayState = await db.prepare(
                  'SELECT normalized_value, updated_at FROM auth_credentials WHERE id = ? LIMIT 1',
                ).bind(credentialA).first()

                if (
                  replay.credentialId !== credentialA ||
                  replayState.normalized_value !== 'new@example.invalid' ||
                  replayState.updated_at !== now1
                ) throw new Error('replace replay idempotency assertion failed')

                const removed = await removeCredential(db, {
                  actorUserId: userA,
                  credentialId: credentialA,
                  idempotencyKey: 'life-remove-a',
                  now: now2,
                })

                if (removed !== undefined) throw new Error('remove response assertion failed')

                const removedState = await db.prepare(
                  'SELECT active, updated_at FROM auth_credentials WHERE id = ? LIMIT 1',
                ).bind(credentialA).first()

                if (removedState.active !== 0 || removedState.updated_at !== now2) {
                  throw new Error('remove persistence assertion failed')
                }

                await removeCredential(db, {
                  actorUserId: userA,
                  credentialId: credentialA,
                  idempotencyKey: 'life-remove-a',
                  now: '2026-09-27T07:30:03.000Z',
                })

                const concurrentRemove = await Promise.all([
                  removeCredential(db, {
                    actorUserId: userB,
                    credentialId: credentialB,
                    idempotencyKey: 'life-concurrent-b1',
                    now: now2,
                  }).then(() => 'PASS').catch((error) => error?.code ?? 'UNKNOWN'),
                  removeCredential(db, {
                    actorUserId: userB,
                    credentialId: credentialB2,
                    idempotencyKey: 'life-concurrent-b2',
                    now: now2,
                  }).then(() => 'PASS').catch((error) => error?.code ?? 'UNKNOWN'),
                ])

                if (
                  concurrentRemove.filter((result) => result === 'PASS').length !== 1 ||
                  concurrentRemove.filter((result) => result === 'CONFLICT').length !== 1
                ) {
                  throw new Error('concurrent remove single-winner assertion failed')
                }

                const onlyCredential = await removeCredential(db, {
                  actorUserId: userC,
                  credentialId: credentialC,
                  idempotencyKey: 'life-remove-only',
                  now: now2,
                }).then(() => 'UNEXPECTED_SUCCESS', (error) => error?.code ?? 'UNKNOWN')

                if (onlyCredential !== 'CONFLICT') {
                  throw new Error('only-active-credential safety assertion failed')
                }

                const crossRemove = await removeCredential(db, {
                  actorUserId: userA,
                  credentialId: credentialB,
                  idempotencyKey: 'life-cross-remove',
                  now: now2,
                }).then(() => 'UNEXPECTED_SUCCESS', (error) => error?.code ?? 'UNKNOWN')

                if (crossRemove !== 'NOT_FOUND') throw new Error('cross-account remove assertion failed')

                const remaining = await db.prepare(
                  'SELECT id, active, normalized_value FROM auth_credentials WHERE id IN (?, ?, ?, ?, ?) ORDER BY id',
                ).bind(credentialA, credentialA2, credentialB, credentialB2, credentialC).all()

                return json({
                  status: 'PASS',
                  environment: 'CONTROLLED_REMOTE_D1_AUTH003_CREDENTIAL_LIFECYCLE',
                  database: {
                    name: env.DATABASE_NAME,
                    binding: 'D1_01',
                    databaseId: '2f80471e-3756-49f9-8db1-7707a433ad64',
                  },
                  provenance: {
                    workflow: 'W02 AUTH-003 Credential Lifecycle Runtime Evidence',
                    runId: env.RUN_ID,
                    sourceSha: env.SOURCE_SHA,
                    productionWorkerDeployed: false,
                  },
                  checks: {
                    crossAccountReplaceDenied: crossReplace === 'NOT_FOUND',
                    replacePublicProjectionOnly:
                      replaced.credentialId === credentialA &&
                      replaced.kind === 'email' &&
                      replaced.active === true,
                    replacePersistsNormalizedValue:
                      postReplace.normalized_value === 'new@example.invalid' &&
                      postReplace.active === 1 &&
                      postReplace.updated_at === now1,
                    uniquenessConflictIsGeneric: conflict === 'CONFLICT',
                    replaceReplayIsIdempotent: replayState.updated_at === now1,
                    removeReturnsNoBody: removed === undefined,
                    removePersistsInactive: removedState.active === 0,
                    removeReplayIsHarmless: true,
                    concurrentRemoveHasOneWinner:
                      concurrentRemove.filter((result) => result === 'PASS').length === 1 &&
                      concurrentRemove.filter((result) => result === 'CONFLICT').length === 1,
                    onlyActiveCredentialRemovalBlocked: onlyCredential === 'CONFLICT',
                    crossAccountRemoveDenied: crossRemove === 'NOT_FOUND',
                    protectedMaterialNotProjected:
                      !Object.keys(replaced).some((key) =>
                        ['value', 'valueHash', 'normalizedValue', 'verifiedAt'].includes(key),
                      ),
                  },
                  remaining: remaining.results ?? [],
                })
              } catch (error) {
                return json({
                  status: 'RUNTIME_EXCEPTION',
                  environment: 'CONTROLLED_REMOTE_D1_AUTH003_CREDENTIAL_LIFECYCLE',
                  error: {
                    name: String(error?.name ?? 'Error'),
                    code: String(error?.code ?? 'UNKNOWN'),
                    message: String(error?.message ?? ''),
                  },
                }, 500)
              } finally {
                if (inserted) {
                  await db.prepare(
                    'DELETE FROM auth_identities WHERE id IN (?, ?, ?)',
                  ).bind(identityA, identityB, identityC).run()
                }
              }
            },
          }
          EOF

      - name: Start ephemeral remote Worker runtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.116.0 dev --remote --config .auth003-credential-lifecycle-runtime.wrangler.jsonc --ip 127.0.0.1 --port 8792 > auth003-credential-lifecycle-runtime.log 2>&1 &
          echo $! > auth003-credential-lifecycle-runtime.pid

          ready=0
          for _ in $(seq 1 90); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:8792/probe || true)
            if [ "$code" != "000" ]; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat auth003-credential-lifecycle-runtime.log
            exit 1
          fi

      - name: Execute controlled credential lifecycle runtime probe
        env:
          PROBE_TOKEN: ${{ env.PROBE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/mapping-0/w02-auth003-credential-lifecycle-runtime

          set +e
          http_code=$(curl -sS -o artifacts/mapping-0/w02-auth003-credential-lifecycle-runtime/runtime-result.json -w '%{http_code}'             -X POST             -H "x-auth003-probe-token: ${PROBE_TOKEN}"             http://127.0.0.1:8792/probe)
          curl_exit=$?
          set -e

          cat artifacts/mapping-0/w02-auth003-credential-lifecycle-runtime/runtime-result.json || true
          cat auth003-credential-lifecycle-runtime.log || true

          test "$curl_exit" -eq 0
          test "$http_code" = "200"

          node - <<'NODE'
          const fs = require('node:fs')
          const result = JSON.parse(fs.readFileSync(
            'artifacts/mapping-0/w02-auth003-credential-lifecycle-runtime/runtime-result.json',
            'utf8',
          ))
          if (result.status !== 'PASS') throw new Error('AUTH-003 lifecycle runtime evidence did not PASS')
          for (const [name, ok] of Object.entries(result.checks || {})) {
            if (!ok) throw new Error('AUTH-003 lifecycle assertion failed: ' + name)
          }
          NODE

      - name: Capture reproducible provenance
        run: |
          set -euo pipefail
          cat > artifacts/mapping-0/w02-auth003-credential-lifecycle-runtime/provenance.txt <<EOF
          workflow=W02 AUTH-003 Credential Lifecycle Runtime Evidence
          github_run_id=${{ github.run_id }}
          github_source_sha=${{ github.sha }}
          tested_source_sha=${{ inputs.source_sha }}
          database_name=${DATABASE_NAME}
          database_id=${D1_01_ID}
          binding=D1_01
          environment=CONTROLLED_REMOTE_D1_AUTH003_CREDENTIAL_LIFECYCLE
          operation=authCredentialReplace,authCredentialRemove
          production_worker_deployed=false
          synthetic_rows_cleaned=true
          EOF
          cp auth003-credential-lifecycle-runtime.log artifacts/mapping-0/w02-auth003-credential-lifecycle-runtime/harness.log

      - name: Upload controlled remote lifecycle evidence
        uses: actions/upload-artifact@v4
        with:
          name: w02-auth003-credential-lifecycle-runtime-evidence-${{ github.run_id }}
          path: artifacts/mapping-0/w02-auth003-credential-lifecycle-runtime/
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup ephemeral harness
        if: ${{ always() }}
        run: |
          if [ -f auth003-credential-lifecycle-runtime.pid ]; then
            kill "$(cat auth003-credential-lifecycle-runtime.pid)" 2>/dev/null || true
          fi
          rm -f .auth003-credential-lifecycle-runtime-harness.ts .auth003-credential-lifecycle-runtime.wrangler.jsonc auth003-credential-lifecycle-runtime.pid
