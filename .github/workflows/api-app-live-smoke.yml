name: APP API live HTTP smoke evidence

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Run real public HTTP probes only after W01 /v1 routing has been deployed
        required: true
        type: choice
        options:
          - CANCEL
          - RUN_LIVE_SMOKE
        default: CANCEL
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/api-app-live-smoke.yml'
      - 'scripts/api-app-live-smoke.mjs'
      - 'workers/W01-payload/next.config.ts'
      - 'workers/W01-payload/src/lib/client-api.ts'
      - 'workers/W01-payload/src/lib/public-response-cache.ts'
      - 'workers/W01-payload/src/app/api/v1/contents/route.ts'
  push:
    branches:
      - main
      - 'audit/1.1-app-api-acceptance-*'
    paths:
      - '.github/workflows/api-app-live-smoke.yml'
      - 'scripts/api-app-live-smoke.mjs'
      - 'workers/W01-payload/next.config.ts'
      - 'workers/W01-payload/src/lib/client-api.ts'
      - 'workers/W01-payload/src/lib/public-response-cache.ts'
      - 'workers/W01-payload/src/app/api/v1/contents/route.ts'

permissions:
  contents: read

concurrency:
  group: app-api-live-smoke
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    name: Validate public smoke harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax-check live smoke script
        run: node --check scripts/api-app-live-smoke.mjs

  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm == 'RUN_LIVE_SMOKE' }}
    name: Safe public and unauthenticated API probes (post-deployment only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require main after W01 API routing deployment
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::Live API smoke may only run from main after the W01 /v1 rewrite is deployed."
            exit 1
          }

      - name: Checkout selected revision
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Probe public HTTP API contracts
        id: smoke
        run: node scripts/api-app-live-smoke.mjs

      - name: Upload sanitized HTTP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-api-live-http-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/api-app-live-smoke/*.json
          if-no-files-found: error
          retention-days: 30
