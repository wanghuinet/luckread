name: Mobile App Checks

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app-mobile-check.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app-mobile-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expo-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies and update local binary lock if required
        run: bun install
      - name: Expo dependency compatibility
        run: bunx expo install --check
      - name: TypeScript
        run: bunx tsc --noEmit -p tsconfig.integration.json
      - name: Lint integration files
        run: bunx eslint app/_layout.tsx app/login.tsx app/real-feed.tsx lib/luckread-api.ts
      - name: Bundle JavaScript for Android and iOS
        run: bunx expo export --platform android --platform ios
      - name: Android native prebuild
        run: bunx expo prebuild --platform android --no-install --clean
      - name: Build Android debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload Android native project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-project
          path: app/android
          if-no-files-found: ignore

  ios-prebuild:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: bun install
      - name: Expo dependency compatibility
        run: bunx expo install --check
      - name: iOS native prebuild
        run: bunx expo prebuild --platform ios --no-install --clean
      - name: Install CocoaPods
        run: cd ios && pod install
      - name: Build iOS simulator
        run: xcodebuild -workspace ios/luckread-mobile.xcworkspace -scheme luckread-mobile -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO
