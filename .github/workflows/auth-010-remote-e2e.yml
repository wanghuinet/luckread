name: AUTH-010 Remote Session E2E Evidence

on:
  workflow_run:
    workflows:
      - W01 W02 Auth Binding Deploy
    types: [completed]
  workflow_dispatch:
    inputs:
      tested_commit:
        description: Exact W01/W02 deployed source commit to test
        required: true
        type: string
      w01_base_url:
        description: Controlled W01 public URL
        required: true
        default: https://api.luckread.com
        type: string
      database_name:
        description: Controlled D1 database name
        required: true
        default: luckread
        type: string
      deployment_run_id:
        description: Optional successful W01/W02 deployment run ID
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: auth010-remote-session-e2e
  cancel-in-progress: false

env:
  WRANGLER_VERSION: 4.116.0
  W01_BASE_URL: ${{ github.event_name == 'workflow_run' && 'https://api.luckread.com' || inputs.w01_base_url }}
  DATABASE_NAME: ${{ github.event_name == 'workflow_run' && 'luckread' || inputs.database_name }}
  DEPLOYMENT_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.deployment_run_id }}
  DEPLOYMENT_HEAD_SHA: ${{ github.event_name == 'workflow_run' && '' || inputs.tested_commit }}

jobs:
  remote-e2e:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Resolve exact deployed source SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" != "workflow_run" ]; then
            test -n "${DEPLOYMENT_HEAD_SHA}"
            exit 0
          fi

          test -n "${DEPLOYMENT_RUN_ID}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${DEPLOYMENT_RUN_ID}" > /tmp/auth010-deploy.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${DEPLOYMENT_RUN_ID}/artifacts?per_page=100" > /tmp/auth010-deploy-artifacts.json

          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'

          const run = JSON.parse(readFileSync('/tmp/auth010-deploy.json', 'utf8'))
          const artifacts = JSON.parse(readFileSync('/tmp/auth010-deploy-artifacts.json', 'utf8'))

          if (
            run.name !== 'W01 W02 Auth Binding Deploy' ||
            run.conclusion !== 'success' ||
            run.head_branch !== 'main'
          ) {
            throw new Error('AUTH-010 evidence: invalid deployment provenance')
          }

          const matches = (artifacts.artifacts ?? [])
            .filter(
              (artifact) =>
                typeof artifact?.name === 'string' &&
                artifact.name.startsWith('w01-w02-binding-deployment-') &&
                artifact?.expired_at == null,
            )

          const shas = [
            ...new Set(
              matches
                .map((artifact) => artifact.name.slice('w01-w02-binding-deployment-'.length))
                .filter((sha) => /^[0-9a-f]{40}$/.test(sha)),
            ),
          ]

          if (shas.length !== 1) {
            throw new Error(
              `AUTH-010 evidence: deployment source SHA is ambiguous or absent: ${shas.join(',') || 'none'}`,
            )
          }

          appendFileSync(process.env.GITHUB_ENV, `DEPLOYMENT_HEAD_SHA=${shas[0]}\n`)
          console.log(
            `AUTH-010 evidence: accepted deployment run ${run.id}; exact source SHA=${shas[0]}; workflow head SHA=${run.head_sha}`,
          )
          NODE

          rm -f /tmp/auth010-deploy.json /tmp/auth010-deploy-artifacts.json

      - name: Checkout exact deployed source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOYMENT_HEAD_SHA }}
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm 11
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.0
          run_install: false

      - name: Install locked W01 dependencies
        working-directory: workers/W01-payload
        run: pnpm install --frozen-lockfile

      - name: Syntax-check AUTH-010 remote E2E script
        run: node --check scripts/auth-010-session-runtime-e2e.mjs

      - name: Verify evidence inputs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${DEPLOYMENT_HEAD_SHA}"
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          test -f scripts/auth-010-session-runtime-e2e.mjs
          test -f workers/W01-payload/wrangler.jsonc
          test -f workers/W01-payload/package.json

      - name: Execute AUTH-010 controlled remote E2E
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/auth-010-session-runtime-e2e.mjs

      - name: Upload AUTH-010 remote evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-010-remote-session-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence/auth-010/remote-e2e/
          if-no-files-found: error
          retention-days: 30
