name: Temporary Payload npm lockfile sync

on:
  push:
    branches:
      - chore/payload-version-align-3.90.2
    paths:
      - package.json
      - .github/workflows/temporary-payload-lock-sync.yml

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout alignment branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate npm lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --force
      - name: Commit generated lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync npm lockfile for Payload 3.90.2"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Validate frozen root dependency installation
        run: npm ci --ignore-scripts --no-audit --no-fund
