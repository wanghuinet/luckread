name: W05 Messaging Phase 1 PostgreSQL 18 Rehearsal

on:
  pull_request:
    paths:
      - '.github/workflows/w05-messaging-phase1-postgres18.yml'
      - 'workers/W05-social/src/neon-postgres-migrations/0002_w05_messaging_core.sql'
      - 'workers/W05-social/scripts/neon/rehearse-messaging-phase1-postgres.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/w05-messaging-phase1-postgres18.yml'
      - 'workers/W05-social/src/neon-postgres-migrations/0002_w05_messaging_core.sql'
      - 'workers/W05-social/scripts/neon/rehearse-messaging-phase1-postgres.mjs'

permissions:
  contents: read

jobs:
  postgres18:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: luckread_messaging_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d luckread_messaging_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Rehearse additive messaging schema on disposable PostgreSQL 18
        env:
          MESSAGING_TEST_DATABASE_URL: postgresql://postgres:local-test-only@127.0.0.1:5432/luckread_messaging_test
        run: node workers/W05-social/scripts/neon/rehearse-messaging-phase1-postgres.mjs
