name: Moderation Runtime Security E2E

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact W06 runtime source SHA under test
        required: true
        type: string
        default: 158a5221d87ce74123338bcf1f5a4a174ec55e33
      base_url:
        description: W01 public moderation base URL
        required: true
        type: string
        default: https://luckread.cn
      w03_source_sha:
        description: Exact W03 content runtime source required for moderation enforcement
        required: true
        type: string
        default: 386669f9f20d018523ff390d61c54e79b956224a
      w01_source_sha:
        description: Exact W01 deployed source SHA to verify
        required: true
        type: string
        default: 825fc273dc7f64bd9413f0493c55c9017ab27268
      w01_deploy_run_id:
        description: Successful W01 deployment run ID to verify
        required: true
        type: string
        default: "36804071530"
      w06_deploy_run_id:
        description: Successful W06 deployment run ID that deployed source_sha
        required: true
        type: string
        default: "36809834389"
      confirm:
        description: Type RUN_MODERATION_E2E to permit controlled remote fixture/test mutations
        required: true
        type: string
        default: RUN_MODERATION_E2E

permissions:
  contents: read
  actions: read

jobs:
  e2e:
    if: ${{ inputs.confirm == 'RUN_MODERATION_E2E' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: ${{ inputs.base_url }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      W01_SOURCE_SHA: ${{ inputs.w01_source_sha }}
      W01_DEPLOY_RUN_ID: ${{ inputs.w01_deploy_run_id }}
      DATABASE_NAME_W03: luckreadpro
      DATABASE_NAME_W06: secondary
      WRANGLER_VERSION: 4.116.0
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Verify exact W01 production deployment
        env:
          GH_TOKEN: ${{ github.token }}
          W01_DEPLOY_RUN_ID: ${{ inputs.w01_deploy_run_id }}
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$W01_DEPLOY_RUN_ID")"
          node -e "const r=JSON.parse(process.argv[1]); if(r.conclusion!==\"success\") throw new Error(\"W01 deployment run is not SUCCESS\"); if(r.head_sha!==process.env.W01_SOURCE_SHA) throw new Error(\"W01 deployment SHA mismatch: \"+r.head_sha+\" != \"+process.env.SOURCE_SHA); console.log(JSON.stringify({deploymentRun:r.id,headSha:r.head_sha,conclusion:r.conclusion,workflow:r.name}));" "$run_json"

      - name: Verify exact W06 deployment evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${{ inputs.w06_deploy_run_id }}" != "REPLACE_WITH_SUCCESSFUL_W06_DEPLOY_RUN_ID"
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${{ inputs.w06_deploy_run_id }}")"
          node -e "const r=JSON.parse(process.argv[1]); if(r.conclusion!==\"success\") throw new Error(\"W06 deployment run is not SUCCESS\"); if(r.name!==\"W06 Governance Deploy\") throw new Error(\"Unexpected W06 deployment workflow: \"+r.name); console.log(JSON.stringify({deploymentRun:r.id,headSha:r.head_sha,conclusion:r.conclusion,workflow:r.name}));" "$run_json"
          rm -rf /tmp/w06-deployment-evidence
          mkdir -p /tmp/w06-deployment-evidence
          gh run download "${{ inputs.w06_deploy_run_id }}" --repo "$GITHUB_REPOSITORY" --name "moderation-runtime-deployment-$SOURCE_SHA" --dir /tmp/w06-deployment-evidence
          grep -Fx "source_sha=$SOURCE_SHA" /tmp/w06-deployment-evidence/provenance.txt

      - name: Verify exact W03 deployment evidence
        env:
          GH_TOKEN: ${{ github.token }}
          W03_SOURCE_SHA: ${{ inputs.w03_source_sha }}
        run: |
          set -euo pipefail
          expected_artifact="w03-content-deployment-$W03_SOURCE_SHA"
          w03_run_id=""
          while IFS= read -r candidate_run_id; do
            test -n "$candidate_run_id" || continue
            artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id/artifacts?per_page=100" --jq ".artifacts[] | select(.name == \"w03-content-deployment-$W03_SOURCE_SHA\" and .expired == false) | .id" 2>/dev/null | head -n 1)" || true
            if [ -n "$artifact_id" ]; then
              w03_run_id="$candidate_run_id"
              break
            fi
          done < <(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/w03-content-runtime-deploy.yml/runs?status=success&per_page=50" --jq '.workflow_runs[].id')
          test -n "$w03_run_id" || { echo "No successful W03 deployment evidence found for $W03_SOURCE_SHA"; exit 1; }
          rm -rf /tmp/w03-deployment-evidence
          mkdir -p /tmp/w03-deployment-evidence
          gh run download "$w03_run_id" --repo "$GITHUB_REPOSITORY" --name "$expected_artifact" --dir /tmp/w03-deployment-evidence
          grep -Fx "run_id=$w03_run_id" /tmp/w03-deployment-evidence/w03-content-deploy-provenance.txt
          grep -Fx "source_sha=$W03_SOURCE_SHA" /tmp/w03-deployment-evidence/w03-content-deploy-provenance.txt
          grep -Fx "migration_execution=false" /tmp/w03-deployment-evidence/w03-content-deploy-provenance.txt
          echo "W03_DEPLOYMENT_EVIDENCE=PASS run_id=$w03_run_id source_sha=$W03_SOURCE_SHA"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup native L6 reviewer fixture
        env:
          AUTH_BASE_URL: https://api.luckread.cn
          DATABASE_NAME_W01: luckread
          WRANGLER_VERSION: 4.116.0
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/moderation-native-reviewer-fixture.mjs

      - name: Diagnose native login state after reviewer fixture
        if: always()
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${MODERATION_AUTH_USER_ID:-}" ]; then
            echo "NATIVE_LOGIN_STATE_DIAGNOSTIC=SKIPPED_NO_USER_ID"
            exit 0
          fi
          npx --yes wrangler@$WRANGLER_VERSION d1 execute luckread --remote --json --config workers/W01-payload/wrangler.jsonc --command "SELECT (SELECT COUNT(*) FROM users_sessions WHERE CAST(_parent_id AS TEXT)='$MODERATION_AUTH_USER_ID') AS native_session_count, (SELECT COUNT(*) FROM auth_session_state WHERE user_id='$MODERATION_AUTH_USER_ID') AS auth_session_state_count, (SELECT COUNT(*) FROM role_assignments WHERE subject_id='$MODERATION_AUTH_USER_ID' AND status='ACTIVE') AS active_role_assignment_count;" > /tmp/native-login-state.json
          node -e "const r=require('/tmp/native-login-state.json'); const row=r[0]?.results?.[0]; if(!row) throw new Error('native login state diagnostic row missing'); console.log('NATIVE_LOGIN_STATE_DIAGNOSTIC=' + JSON.stringify({nativeSessionCount:Number(row.native_session_count),authSessionStateCount:Number(row.auth_session_state_count),activeRoleAssignmentCount:Number(row.active_role_assignment_count)}));"

      - name: Diagnose W02 establish through ephemeral binding harness
        if: always()
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${MODERATION_TOKEN:-}" ] || [ -z "${MODERATION_AUTH_USER_ID:-}" ]; then
            echo "W02_ESTABLISH_BINDING_DIAGNOSTIC=SKIPPED"
            exit 0
          fi
          mkdir -p artifacts/mapping-0/moderation-runtime-e2e
          cat > .w02-binding-diagnostic.wrangler.jsonc <<EOF
          {
            "\$schema": "./node_modules/wrangler/config-schema.json",
            "name": "luckread-w02-binding-diagnostic-${GITHUB_RUN_ID}",
            "main": ".w02-binding-diagnostic.ts",
            "compatibility_date": "2025-08-15",
            "services": [{ "binding": "W02_AUTH", "service": "luckread-w02" }],
            "d1_databases": [{
              "binding": "D1_01",
              "database_name": "luckread",
              "database_id": "2f80471e-3756-49f9-8db1-7707a433ad64",
              "remote": true
            }],
            "vars": {
              "PROBE_TOKEN": "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}",
              "USER_ID": "${MODERATION_AUTH_USER_ID}",
              "RUN_ID": "${GITHUB_RUN_ID}"
            }
          }
          EOF
          cat > .w02-binding-diagnostic.ts <<'EOF'
          const json = (body: unknown, status = 200) => new Response(JSON.stringify(body), {
            status,
            headers: { 'content-type': 'application/json; charset=utf-8', 'cache-control': 'no-store' },
          })

          const safeBody = (value: any) => ({
            code: typeof value?.error?.code === 'string' ? value.error.code : undefined,
            message: typeof value?.error?.message === 'string' ? value.error.message : undefined,
            success: value?.error === undefined,
            layer: typeof value?.layer === 'string' ? value.layer : undefined,
            tokenVersion: typeof value?.tokenVersion === 'number' ? value.tokenVersion : undefined,
            nativeExpiresAtPresent: typeof value?.nativeExpiresAt === 'string',
            refreshTokenPresent: typeof value?.refreshToken === 'string',
          })

          export default {
            async fetch(request: Request, env: { D1_01: D1Database; W02_AUTH: Fetcher; PROBE_TOKEN: string; USER_ID: string; RUN_ID: string }) {
              if (request.method !== 'POST' || new URL(request.url).pathname !== '/diagnose') return new Response(null, { status: 404 })
              if (request.headers.get('x-probe-token') !== env.PROBE_TOKEN) return json({ status: 'DENY' }, 403)
              const session = await env.D1_01.prepare(
                'SELECT id FROM users_sessions WHERE CAST(_parent_id AS TEXT)=? ORDER BY created_at DESC LIMIT 1',
              ).bind(env.USER_ID).first<{ id: string }>()
              if (!session?.id) return json({ status: 'NO_NATIVE_SESSION' }, 409)

              const base = 'https://luckread-w02.internal'
              const resolveResponse = await env.W02_AUTH.fetch(new Request(base + '/internal/authz/resolve-layer', {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ subjectId: env.USER_ID, accountState: 'ACTIVE' }),
              }))
              const resolveRaw = await resolveResponse.text()
              let resolveBody: any = null
              try { resolveBody = resolveRaw ? JSON.parse(resolveRaw) : null } catch {}

              const establishResponse = await env.W02_AUTH.fetch(new Request(base + '/internal/auth/session/establish', {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({
                  sessionId: String(session.id),
                  userId: env.USER_ID,
                  deviceId: 'moderation-w02-diagnostic-' + env.RUN_ID,
                }),
              }))
              const establishRaw = await establishResponse.text()
              let establishBody: any = null
              try { establishBody = establishRaw ? JSON.parse(establishRaw) : null } catch {}

              const extension = await env.D1_01.prepare(
                'SELECT COUNT(*) AS count FROM auth_session_state WHERE user_id=?',
              ).bind(env.USER_ID).first<{ count: number }>()

              return json({
                status: 'DIAGNOSTIC',
                nativeSessionPresent: true,
                resolveLayer: { status: resolveResponse.status, body: safeBody(resolveBody) },
                establish: { status: establishResponse.status, body: safeBody(establishBody) },
                authSessionStateCount: Number(extension?.count ?? 0),
              })
            },
          }
          EOF
          npx --yes wrangler@$WRANGLER_VERSION dev --remote --config .w02-binding-diagnostic.wrangler.jsonc --ip 127.0.0.1 --port 8788 > w02-binding-diagnostic.log 2>&1 &
          echo $! > /tmp/w02-binding-diagnostic.pid
          ready=0
          for _ in $(seq 1 60); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:8788/diagnose || true)
            if [ "$code" != "000" ]; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat w02-binding-diagnostic.log || true
            echo "W02_ESTABLISH_BINDING_DIAGNOSTIC=HARNESS_START_FAILED"
            exit 0
          fi
          set +e
          curl_exit=0
          curl --silent --show-error --max-time 15 -X POST -H "x-probe-token: ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" http://127.0.0.1:8788/diagnose > artifacts/mapping-0/moderation-runtime-e2e/w02-establish-binding-diagnostic.json
          curl_exit=$?
          set -e
          cat artifacts/mapping-0/moderation-runtime-e2e/w02-establish-binding-diagnostic.json || true
          cp w02-binding-diagnostic.log artifacts/mapping-0/moderation-runtime-e2e/w02-binding-diagnostic.log || true
          echo "W02_ESTABLISH_BINDING_DIAGNOSTIC_CURL_EXIT=$curl_exit"


      - name: Setup fixture IDs
        run: |
          set -euo pipefail
          echo "CASE_ID=mod-e2e-$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          echo "CONTENT_ID=mod-e2e-$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          echo "CASE2_ID=mod-e2e-reuse-$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          echo "CONTENT2_ID=mod-e2e-reuse-$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          echo "IDEMPOTENCY_KEY=mod-e2e-key-$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          echo "REASON_CODE=E2E_SECURITY_PROBE" >> "$GITHUB_ENV"
          echo "NOW=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_ENV"

      - name: Verify remote schema before fixture
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID  }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN  }}
        run: |
          set -euo pipefail
          npx --yes wrangler@$WRANGLER_VERSION d1 execute "$DATABASE_NAME_W06" --remote --json --config workers/W06-governance/wrangler.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('moderation_cases','moderation_decisions','moderation_decision_idempotency','moderation_txn_guard') ORDER BY name;" > /tmp/mod-schema.json
          node -e "const r=require('/tmp/mod-schema.json'); const names=new Set((r[0]?.results||[]).map(x=>x.name)); for(const n of ['moderation_cases','moderation_decisions','moderation_decision_idempotency','moderation_txn_guard']) if(!names.has(n)) throw new Error('Missing '+n); console.log('REMOTE_MODERATION_SCHEMA=PASS')"

      - name: Seed controlled content fixture in D1-02
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID  }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN  }}
        run: |
          set -euo pipefail
          SQL="INSERT INTO contents (id,content_type,owner_user_id,creator_id,ip_id,state,version,revision,title,body_ref,media_refs_json,cover_ref,etag,created_at,updated_at) VALUES ('$CONTENT_ID','article','mod-e2e-owner-$GITHUB_RUN_ID',NULL,NULL,'PENDING_REVIEW',1,1,'Moderation E2E Fixture','r2://moderation-e2e/$GITHUB_RUN_ID','[]',NULL,'W/"1"','$NOW','$NOW');"
          npx --yes wrangler@$WRANGLER_VERSION d1 execute "$DATABASE_NAME_W03" --remote --yes --config workers/W03-content/wrangler.jsonc --command "$SQL"

      - name: Seed controlled moderation case in D1-03
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID  }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN  }}
        run: |
          set -euo pipefail
          SQL="INSERT INTO moderation_cases (case_id,target_type,target_id,target_version,policy_version,state,priority,assigned_reviewer_id,current_decision_id,evidence_bundle_ref,version,created_at,updated_at) VALUES ('$CASE_ID','content','$CONTENT_ID',1,'moderation-v1.0','UNDER_REVIEW',100,NULL,NULL,'e2e/$GITHUB_RUN_ID',1,'$NOW','$NOW');"
          npx --yes wrangler@$WRANGLER_VERSION d1 execute "$DATABASE_NAME_W06" --remote --yes --config workers/W06-governance/wrangler.jsonc --command "$SQL"

      - name: Verify queue access and case visibility
        run: |
          set -euo pipefail
          test -n "$MODERATION_TOKEN"
          curl --silent --show-error --fail-with-body -H "Authorization: Bearer $MODERATION_TOKEN" "$BASE_URL/api/v1/admin/moderation/queue" > /tmp/mod-queue.json
          curl --silent --show-error --fail-with-body -H "Authorization: Bearer $MODERATION_TOKEN" "$BASE_URL/api/v1/admin/moderation/cases/$CASE_ID" > /tmp/mod-case.json
          node -e "const r=require('/tmp/mod-case.json'); if(r.caseId!=='$CASE_ID'||r.version!==1) throw new Error('Case visibility assertion failed'); console.log('QUEUE_CASE_READ=PASS')"

      - name: Verify positive APPROVED decision and W06 to W03 transition
        run: |
          set -euo pipefail
          cat > /tmp/mod-decision.json <<EOF
          {"expectedVersion":1,"decision":"APPROVED","policyVersion":"moderation-v1.0","reasonCode":"$REASON_CODE","severity":"medium","scope":"content","effectiveAt":"$NOW","expiresAt":null}
          EOF
          curl --silent --show-error --fail-with-body             -X POST             -H "Authorization: Bearer $MODERATION_TOKEN"             -H "Content-Type: application/json"             -H "Idempotency-Key: $IDEMPOTENCY_KEY"             -H "If-Match: v1"             --data @/tmp/mod-decision.json             "$BASE_URL/api/v1/admin/moderation/cases/$CASE_ID/decision" > /tmp/mod-decision-response.json
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('/tmp/mod-decision-response.json','utf8'));
          if(r.caseId!==process.env.CASE_ID||r.outcome!=='APPROVED'||r.version!==2) throw new Error('Decision response assertion failed');
          console.log(JSON.stringify(r));
          NODE

      - name: Verify W06 decision persistence immediately after commit
        if: ${{ success() }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@$WRANGLER_VERSION d1 execute "$DATABASE_NAME_W06" --remote --json --config workers/W06-governance/wrangler.jsonc --command "SELECT case_id,version,state,current_decision_id FROM moderation_cases WHERE case_id='$CASE_ID' LIMIT 1; SELECT decision_id,case_id,case_version,outcome FROM moderation_decisions WHERE case_id='$CASE_ID' ORDER BY created_at DESC LIMIT 3; SELECT id,successful FROM moderation_txn_guard ORDER BY id DESC LIMIT 3; SELECT reviewer_id,case_id,idempotency_key,response_status FROM moderation_decision_idempotency WHERE case_id='$CASE_ID' ORDER BY created_at DESC LIMIT 3; SELECT COUNT(*) AS outbox_count FROM moderation_enforcement_outbox WHERE case_id='$CASE_ID';" > /tmp/mod-decision-state.json
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/mod-decision-state.json','utf8')); const all=x.flatMap(v=>v.results||[]); console.log('W06_DECISION_PERSISTENCE_STATE='+JSON.stringify(all));"
      - name: Verify replay and idempotency key-reuse rejection
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          replay="$(curl --silent --show-error --fail-with-body             -X POST             -H "Authorization: Bearer $MODERATION_TOKEN"             -H "Content-Type: application/json"             -H "Idempotency-Key: $IDEMPOTENCY_KEY"             -H "If-Match: v1"             --data @/tmp/mod-decision.json             "$BASE_URL/api/v1/admin/moderation/cases/$CASE_ID/decision")"
          printf '%s' "$replay" > /tmp/mod-replay.json
          node -e "const r=require('/tmp/mod-replay.json'), a=require('/tmp/mod-decision-response.json'); if(r.decisionId!==a.decisionId||r.version!==a.version) throw new Error('Idempotent replay mismatch'); console.log('IDEMPOTENT_REPLAY=PASS')"

          REUSE_KEY="mod-e2e-reuse-key-$GITHUB_RUN_ID"
          REUSE_DECISION_ID="dec_seed_reuse_$GITHUB_RUN_ID"
          REUSE_EXPIRES_AT="$(date -u -d '+1 hour' +%Y-%m-%dT%H:%M:%S.000Z)"
          CONTENT_REUSE_SQL="INSERT INTO contents (id,content_type,owner_user_id,creator_id,ip_id,state,version,revision,title,body_ref,media_refs_json,cover_ref,etag,created_at,updated_at) VALUES ('$CONTENT2_ID','article','mod-e2e-owner-$GITHUB_RUN_ID',NULL,NULL,'PENDING_REVIEW',1,1,'Moderation E2E Idempotency Reuse Fixture','r2://moderation-e2e/reuse/$GITHUB_RUN_ID','[]',NULL,'W/"1"','$NOW','$NOW');"
          CASE_REUSE_SQL="INSERT INTO moderation_cases (case_id,target_type,target_id,target_version,policy_version,state,priority,assigned_reviewer_id,current_decision_id,evidence_bundle_ref,version,created_at,updated_at) VALUES ('$CASE2_ID','content','$CONTENT2_ID',1,'moderation-v1.0','UNDER_REVIEW',80,NULL,NULL,'e2e/reuse/$GITHUB_RUN_ID',1,'$NOW','$NOW');"
          IDEM_REUSE_SQL="INSERT INTO moderation_decision_idempotency (id,reviewer_id,case_id,idempotency_key,request_hash,decision_id,response_status,response_json,created_at,expires_at) VALUES ('seed-idem-$GITHUB_RUN_ID','$MODERATION_AUTH_USER_ID','$CASE2_ID','$REUSE_KEY','seeded-hash-$GITHUB_RUN_ID','$REUSE_DECISION_ID',200,'{\"caseId\":\"$CASE2_ID\",\"decisionId\":\"$REUSE_DECISION_ID\",\"outcome\":\"APPROVED\",\"version\":2,\"effectiveAt\":\"$NOW\",\"requestId\":\"req_seed_reuse_$GITHUB_RUN_ID\"}','$NOW','$REUSE_EXPIRES_AT');"
          npx --yes wrangler@$WRANGLER_VERSION d1 execute "$DATABASE_NAME_W03" --remote --yes --config workers/W03-content/wrangler.jsonc --command "$CONTENT_REUSE_SQL"
          npx --yes wrangler@$WRANGLER_VERSION d1 execute "$DATABASE_NAME_W06" --remote --yes --config workers/W06-governance/wrangler.jsonc --command "$CASE_REUSE_SQL"
          npx --yes wrangler@$WRANGLER_VERSION d1 execute "$DATABASE_NAME_W06" --remote --yes --config workers/W06-governance/wrangler.jsonc --command "$IDEM_REUSE_SQL"
          npx --yes wrangler@$WRANGLER_VERSION d1 execute "$DATABASE_NAME_W06" --remote --json --config workers/W06-governance/wrangler.jsonc --command "SELECT reviewer_id,case_id,idempotency_key,request_hash,expires_at FROM moderation_decision_idempotency WHERE reviewer_id='$MODERATION_AUTH_USER_ID' AND case_id='$CASE2_ID' AND idempotency_key='$REUSE_KEY' LIMIT 1;" > /tmp/mod-idem-seed.json
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/mod-idem-seed.json')); const row=x[0]&&x[0].results&&x[0].results[0]; if(!row) throw new Error('Seeded idempotency row was not visible to remote W06'); console.log('IDEMPOTENCY_SEED_VISIBLE='+JSON.stringify({reviewerId:String(row.reviewer_id),caseId:String(row.case_id),idempotencyKey:String(row.idempotency_key),expiresAt:String(row.expires_at)}));"
          status="$(curl --silent --output /tmp/mod-conflict-response.json --write-out '%{http_code}'             -X POST             -H "Authorization: Bearer $MODERATION_TOKEN"             -H "Content-Type: application/json"             -H "Idempotency-Key: $REUSE_KEY"             -H "If-Match: v1"             --data '{"expectedVersion":1,"decision":"REJECTED","policyVersion":"moderation-v1.0","reasonCode":"E2E_SECURITY_CONFLICT","severity":"medium","scope":"content","effectiveAt":"'$NOW'","expiresAt":null}'             "$BASE_URL/api/v1/admin/moderation/cases/$CASE2_ID/decision")"
          if [ "$status" != "422" ]; then
            echo "IDEMPOTENCY_CONFLICT_STATUS=$status"
            cat /tmp/mod-conflict-response.json
            exit 1
          fi
          echo IDEMPOTENCY_CONFLICT=PASS

      - name: Verify 428 and 412 preconditions on a fresh case
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID  }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN  }}
        run: |
          set -euo pipefail
          echo "CASE2_ID=mod-e2e-stale-$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          echo "CONTENT2_ID=mod-e2e-stale-$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          SQL1="INSERT INTO contents (id,content_type,owner_user_id,creator_id,ip_id,state,version,revision,title,body_ref,media_refs_json,cover_ref,etag,created_at,updated_at) VALUES ('mod-e2e-stale-$GITHUB_RUN_ID','article','mod-e2e-owner-$GITHUB_RUN_ID',NULL,NULL,'PENDING_REVIEW',1,1,'Moderation E2E Stale Fixture','r2://moderation-e2e/stale/$GITHUB_RUN_ID','[]',NULL,'W/"1"','$NOW','$NOW');"
          npx --yes wrangler@$WRANGLER_VERSION d1 execute "$DATABASE_NAME_W03" --remote --yes --config workers/W03-content/wrangler.jsonc --command "$SQL1"
          SQL2="INSERT INTO moderation_cases (case_id,target_type,target_id,target_version,policy_version,state,priority,assigned_reviewer_id,current_decision_id,evidence_bundle_ref,version,created_at,updated_at) VALUES ('mod-e2e-stale-$GITHUB_RUN_ID','content','mod-e2e-stale-$GITHUB_RUN_ID',1,'moderation-v1.0','UNDER_REVIEW',90,NULL,NULL,'e2e/stale/$GITHUB_RUN_ID',1,'$NOW','$NOW');"
          npx --yes wrangler@$WRANGLER_VERSION d1 execute "$DATABASE_NAME_W06" --remote --yes --config workers/W06-governance/wrangler.jsonc --command "$SQL2"

          missing_status="$(curl --silent --output /tmp/missing-precondition.json --write-out '%{http_code}'             -X POST -H "Authorization: Bearer $MODERATION_TOKEN" -H "Content-Type: application/json"             --data '{"expectedVersion":1,"decision":"APPROVED","policyVersion":"moderation-v1.0","reasonCode":"E2E","severity":"medium","scope":"content","effectiveAt":"'$NOW'","expiresAt":null}'             "$BASE_URL/api/v1/admin/moderation/cases/$CASE2_ID/decision")"
          test "$missing_status" = 428

          stale_status="$(curl --silent --output /tmp/stale-precondition.json --write-out '%{http_code}'             -X POST -H "Authorization: Bearer $MODERATION_TOKEN" -H "Content-Type: application/json"             -H "Idempotency-Key: mod-e2e-stale-key-$GITHUB_RUN_ID" -H "If-Match: v99"             --data '{"expectedVersion":1,"decision":"APPROVED","policyVersion":"moderation-v1.0","reasonCode":"E2E","severity":"medium","scope":"content","effectiveAt":"'$NOW'","expiresAt":null}'             "$BASE_URL/api/v1/admin/moderation/cases/$CASE2_ID/decision")"
          test "$stale_status" = 412
          echo PRECONDITION_428_412=PASS

      - name: Wait for W06 outbox eventual W03 convergence
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/mapping-0/moderation-runtime-e2e
          converged=0
          for attempt in $(seq 1 20); do
            npx --yes wrangler@$WRANGLER_VERSION d1 execute "$DATABASE_NAME_W03" --remote --json --config workers/W03-content/wrangler.jsonc --command "SELECT id,state,version,etag FROM contents WHERE id='$CONTENT_ID' LIMIT 1;" > /tmp/convergence-content.json
            npx --yes wrangler@$WRANGLER_VERSION d1 execute "$DATABASE_NAME_W06" --remote --json --config workers/W06-governance/wrangler.jsonc --command "SELECT outbox_id,status,attempts,last_error,delivered_at,next_attempt_at FROM moderation_enforcement_outbox WHERE case_id='$CASE_ID' ORDER BY created_at DESC LIMIT 1;" > /tmp/convergence-outbox.json
            if node - <<'NODE'
          const fs=require('fs');
          const content=JSON.parse(fs.readFileSync('/tmp/convergence-content.json'))?.[0]?.results?.[0] ?? null;
          const outbox=JSON.parse(fs.readFileSync('/tmp/convergence-outbox.json'))?.[0]?.results?.[0] ?? null;
          console.log('CONVERGENCE_POLL='+JSON.stringify({content,outbox}));
          process.exit(content?.state === 'APPROVED' && Number(content?.version) === 2 && outbox?.status === 'DELIVERED' ? 0 : 1);
          NODE
            then
              converged=1
              break
            fi
            sleep 5
          done
          if [ "$converged" -ne 1 ]; then
            echo "W06_OUTBOX_EVENTUAL_W03_CONVERGENCE=TIMEOUT"
            cat /tmp/convergence-content.json || true
            cat /tmp/convergence-outbox.json || true
            exit 1
          fi
          echo "W06_OUTBOX_EVENTUAL_W03_CONVERGENCE=PASS"

      - name: Verify remote D1 evidence
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID  }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN  }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/mapping-0/moderation-runtime-e2e
          npx --yes wrangler@$WRANGLER_VERSION d1 execute "$DATABASE_NAME_W03" --remote --json --config workers/W03-content/wrangler.jsonc --command "SELECT id,state,version,etag FROM contents WHERE id IN ('$CONTENT_ID','mod-e2e-stale-$GITHUB_RUN_ID') ORDER BY id;" > artifacts/mapping-0/moderation-runtime-e2e/content-state.json
          npx --yes wrangler@$WRANGLER_VERSION d1 execute "$DATABASE_NAME_W06" --remote --json --config workers/W06-governance/wrangler.jsonc --command "SELECT case_id,state,version,current_decision_id FROM moderation_cases WHERE case_id IN ('$CASE_ID','mod-e2e-stale-$GITHUB_RUN_ID') ORDER BY case_id;" > artifacts/mapping-0/moderation-runtime-e2e/cases.json
          npx --yes wrangler@$WRANGLER_VERSION d1 execute "$DATABASE_NAME_W06" --remote --json --config workers/W06-governance/wrangler.jsonc --command "SELECT decision_id,case_id,case_version,outcome,policy_version,reviewer_id,reviewer_layer FROM moderation_decisions WHERE case_id='$CASE_ID';" > artifacts/mapping-0/moderation-runtime-e2e/decision.json
          npx --yes wrangler@$WRANGLER_VERSION d1 execute "$DATABASE_NAME_W06" --remote --json --config workers/W06-governance/wrangler.jsonc --command "SELECT outbox_id,decision_id,status,attempts,last_error,delivered_at FROM moderation_enforcement_outbox WHERE decision_id=(SELECT decision_id FROM moderation_decisions WHERE case_id='$CASE_ID');" > artifacts/mapping-0/moderation-runtime-e2e/outbox.json
          npx --yes wrangler@$WRANGLER_VERSION d1 execute "$DATABASE_NAME_W06" --remote --json --config workers/W06-governance/wrangler.jsonc --command "SELECT event_id,action,target_type,target_id,request_id,trace_id FROM audit_events WHERE target_type='ModerationCase' AND target_id='$CASE_ID';" > artifacts/mapping-0/moderation-runtime-e2e/audit.json
          node - <<'NODE'
          const fs=require('fs');
          const content=JSON.parse(fs.readFileSync('artifacts/mapping-0/moderation-runtime-e2e/content-state.json'))?.[0]?.results??[];
          const cases=JSON.parse(fs.readFileSync('artifacts/mapping-0/moderation-runtime-e2e/cases.json'))?.[0]?.results??[];
          const decisions=JSON.parse(fs.readFileSync('artifacts/mapping-0/moderation-runtime-e2e/decision.json'))?.[0]?.results??[];
          const outbox=JSON.parse(fs.readFileSync('artifacts/mapping-0/moderation-runtime-e2e/outbox.json'))?.[0]?.results??[];
          const audits=JSON.parse(fs.readFileSync('artifacts/mapping-0/moderation-runtime-e2e/audit.json'))?.[0]?.results??[];
          if(!content.some(x=>x.id===process.env.CONTENT_ID&&x.state==='APPROVED'&&x.version===2)) throw new Error('W03 content transition missing');
          if(!cases.some(x=>x.case_id===process.env.CASE_ID&&x.state==='ACTION_TAKEN'&&x.version===2)) throw new Error('W06 case transition missing');
          if(decisions.length!==1||decisions[0].outcome!=='APPROVED'||decisions[0].reviewer_id===null) throw new Error('Decision persistence missing');
          if(audits.length!==1||audits[0].action!=='moderation.decide') throw new Error('Audit binding missing');
          if(outbox.length!==1||outbox[0].decision_id!==decisions[0].decision_id||outbox[0].status!=='DELIVERED') throw new Error('Transactional outbox delivery missing');
          console.log('MODERATION_REMOTE_EVIDENCE=PASS');
          NODE

      - name: Capture evidence provenance
        run: |
          cat > artifacts/mapping-0/moderation-runtime-e2e/provenance.txt <<EOF
          workflow=Moderation Runtime Security E2E
          source_sha=$SOURCE_SHA
          base_url=$BASE_URL
          fixture_case=$CASE_ID
          fixture_content=$CONTENT_ID
          reviewer_layer=L6
          new_worker=0
          new_d1=0
          negative_tests=401-covered-by-source-boundary,428,412,422
          remote_d1_evidence=true
          immutable_audit_retained=true
          EOF

      - name: Cleanup controlled moderation fixtures
        if: always()
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          CASE2="mod-e2e-stale-$GITHUB_RUN_ID"
          CONTENT2="mod-e2e-stale-$GITHUB_RUN_ID"
          CASE1="mod-e2e-$GITHUB_RUN_ID"
          CONTENT1="mod-e2e-$GITHUB_RUN_ID"
          npx --yes wrangler@$WRANGLER_VERSION d1 execute "$DATABASE_NAME_W06" --remote --yes --config workers/W06-governance/wrangler.jsonc --command "DELETE FROM moderation_enforcement_outbox WHERE decision_id IN (SELECT decision_id FROM moderation_decisions WHERE case_id LIKE 'mod-e2e-%'); DELETE FROM moderation_decision_idempotency WHERE case_id LIKE 'mod-e2e-%'; DELETE FROM moderation_decisions WHERE case_id LIKE 'mod-e2e-%'; DELETE FROM moderation_cases WHERE case_id LIKE 'mod-e2e-%';"
          npx --yes wrangler@$WRANGLER_VERSION d1 execute "$DATABASE_NAME_W03" --remote --yes --config workers/W03-content/wrangler.jsonc --command "DELETE FROM contents WHERE id LIKE 'mod-e2e-%';"
          npx --yes wrangler@$WRANGLER_VERSION d1 execute luckread --remote --yes --config workers/W01-payload/wrangler.jsonc --command "DELETE FROM role_assignments WHERE id LIKE 'MODERATION-E2E-ROLE-%' OR subject_id IN (SELECT CAST(id AS TEXT) FROM users WHERE email LIKE 'moderation-e2e-MODL6-%@example.com');"
          npx --yes wrangler@$WRANGLER_VERSION d1 execute luckread --remote --yes --config workers/W01-payload/wrangler.jsonc --command "DELETE FROM auth_session_state WHERE user_id IN (SELECT CAST(id AS TEXT) FROM users WHERE email LIKE 'moderation-e2e-MODL6-%@example.com'); DELETE FROM users_sessions WHERE CAST(_parent_id AS TEXT) IN (SELECT CAST(id AS TEXT) FROM users WHERE email LIKE 'moderation-e2e-MODL6-%@example.com'); DELETE FROM consents WHERE CAST(actor_subject_id AS TEXT) IN (SELECT CAST(id AS TEXT) FROM users WHERE email LIKE 'moderation-e2e-MODL6-%@example.com') OR CAST(owner_subject_id AS TEXT) IN (SELECT CAST(id AS TEXT) FROM users WHERE email LIKE 'moderation-e2e-MODL6-%@example.com'); DELETE FROM auth_registration_envelopes WHERE idempotency_key LIKE 'MODERATION-E2E-%-register'; DELETE FROM users WHERE email LIKE 'moderation-e2e-MODL6-%@example.com';"

      - name: Upload moderation runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moderation-runtime-e2e-${{ env.SOURCE_SHA }}
          path: artifacts/mapping-0/moderation-runtime-e2e/
          if-no-files-found: error
          retention-days: 14
