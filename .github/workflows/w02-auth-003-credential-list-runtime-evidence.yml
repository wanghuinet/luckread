name: W02 AUTH-003 Credential List Runtime Evidence

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact implementation commit SHA to execute
        required: true
        type: string
      database_name:
        description: Controlled Cloudflare D1 display name
        required: true
        type: string
      confirm:
        description: Type RUN to permit controlled remote D1 runtime evidence
        required: true
        type: string

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate exact source and run focused unit tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
          test -f workers/W02-content/src/credentials/credential-list.ts
          test -f workers/W02-content/src/credentials/credential-list.test.ts
          npx --yes vitest@3.2.4 run workers/W02-content/src/credentials/credential-list.test.ts

  runtime:
    needs: unit
    if: ${{ inputs.confirm == 'RUN' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      D1_01_ID: "2f80471e-3756-49f9-8db1-7707a433ad64"
      DATABASE_NAME: ${{ inputs.database_name }}
      PROBE_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate exact runtime inputs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
          test "${DATABASE_NAME}" = "luckread"
          test -f workers/W02-content/src/credentials/credential-list.ts
          test -f workers/W02-content/migrations/0004_auth_003_credentials.sql
          test -z "$(git status --short)"

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"

      - name: Prepare ephemeral remote runtime harness
        run: |
          set -euo pipefail
          cat > .auth003-credential-list-runtime.wrangler.jsonc <<EOF
          {
            "name": "luckread-w02-auth003-credential-list-evidence-harness",
            "main": ".auth003-credential-list-runtime-harness.ts",
            "compatibility_date": "2025-08-15",
            "d1_databases": [
              {
                "binding": "D1_01",
                "database_name": "${DATABASE_NAME}",
                "database_id": "${D1_01_ID}",
                "remote": true
              }
            ],
            "vars": {
              "PROBE_TOKEN": "${PROBE_TOKEN}",
              "RUN_ID": "${{ github.run_id }}",
              "SOURCE_SHA": "${{ inputs.source_sha }}"
            }
          }
          EOF

          cat > .auth003-credential-list-runtime-harness.ts <<'EOF'
          // CI-only ephemeral harness. Never committed or deployed as a product Worker.
          // @ts-nocheck
          import { listCredentials } from './workers/W02-content/src/credentials/credential-list.ts'

          const json = (body: unknown, status = 200) =>
            new Response(JSON.stringify(body, null, 2), {
              status,
              headers: {
                'content-type': 'application/json',
                'cache-control': 'no-store',
              },
            })

          export default {
            async fetch(request, env) {
              if (request.method !== 'POST' || new URL(request.url).pathname !== '/probe') {
                return new Response(null, { status: 404 })
              }
              if (request.headers.get('x-auth003-probe-token') !== env.PROBE_TOKEN) {
                return json({ status: 'DENY' }, 403)
              }

              const db = env.D1_01
              const runId = env.RUN_ID.replace(/[^0-9]/g, '')
              const userA = 'auth003-list-' + runId + '-a'
              const userB = 'auth003-list-' + runId + '-b'
              const identityA = 'auth003-list-identity-' + runId + '-a'
              const identityB = 'auth003-list-identity-' + runId + '-b'
              const credentialsA = [
                ['auth003-list-cred-' + runId + '-a1', 'email', '2026-09-27T12:00:03.000Z'],
                ['auth003-list-cred-' + runId + '-a2', 'phone', '2026-09-27T12:00:02.000Z'],
                ['auth003-list-cred-' + runId + '-a3', 'username', '2026-09-27T12:00:01.000Z'],
              ]
              const credentialB = ['auth003-list-cred-' + runId + '-b1', 'email', '2026-09-27T11:59:59.000Z']
              let inserted = false

              try {
                const collision = await db
                  .prepare('SELECT id FROM auth_identities WHERE id IN (?, ?) OR user_id IN (?, ?) LIMIT 1')
                  .bind(identityA, identityB, userA, userB)
                  .first()
                if (collision) return json({ status: 'FAIL_CLOSED', reason: 'synthetic_collision' }, 409)

                await db
                  .prepare(
                    'INSERT INTO auth_identities (id, user_id, normalization_version) VALUES (?, ?, ?), (?, ?, ?)',
                  )
                  .bind(identityA, userA, 'AUTH-003-NORM-V1', identityB, userB, 'AUTH-003-NORM-V1')
                  .run()

                const rows = [
                  ...credentialsA.map(([id, kind, createdAt]) => [
                    id,
                    identityA,
                    kind,
                    'hash-' + id,
                    'normalized-' + id,
                    createdAt,
                    createdAt,
                  ]),
                  [
                    credentialB[0],
                    identityB,
                    credentialB[1],
                    'hash-' + credentialB[0],
                    'normalized-' + credentialB[0],
                    credentialB[2],
                    credentialB[2],
                  ],
                ]
                for (const row of rows) {
                  await db
                    .prepare(
                      'INSERT INTO auth_credentials (id, identity_id, kind, value_hash, normalized_value, verified_at, active, created_at, updated_at) VALUES (?, ?, ?, ?, ?, NULL, 1, ?, ?)',
                    )
                    .bind(...row)
                    .run()
                }
                inserted = true

                const first = await listCredentials(db, {
                  actorUserId: userA,
                  limit: 2,
                  requestId: 'req-' + runId + '-1',
                  traceId: 'trace-' + runId + '-1',
                })

                if (
                  first.data.items.length !== 2 ||
                  first.data.items[0]?.credentialId !== credentialsA[0][0] ||
                  first.data.items[1]?.credentialId !== credentialsA[1][0] ||
                  first.data.items.some((item) => Object.keys(item).sort().join(',') !== 'active,credentialId,kind') ||
                  first.data.hasMore !== true ||
                  !first.data.nextCursor
                ) {
                  throw new Error('first page assertion failed')
                }

                const second = await listCredentials(db, {
                  actorUserId: userA,
                  limit: 2,
                  cursor: first.data.nextCursor,
                  requestId: 'req-' + runId + '-2',
                })

                if (
                  second.data.items.length !== 1 ||
                  second.data.items[0]?.credentialId !== credentialsA[2][0] ||
                  second.data.hasMore !== false ||
                  second.data.nextCursor !== null
                ) {
                  throw new Error('second page assertion failed')
                }

                const isolated = await listCredentials(db, {
                  actorUserId: userB,
                  requestId: 'req-' + runId + '-3',
                })

                if (
                  isolated.data.items.length !== 1 ||
                  isolated.data.items[0]?.credentialId !== credentialB[0] ||
                  isolated.data.items.some((item) =>
                    [credentialsA[0][0], credentialsA[1][0], credentialsA[2][0]].includes(item.credentialId)
                  )
                ) {
                  throw new Error('self-scope isolation assertion failed')
                }

                const malformed = await listCredentials(db, {
                  actorUserId: userA,
                  cursor: 'not-a-valid-cursor',
                  requestId: 'req-' + runId + '-4',
                }).then(
                  () => 'UNEXPECTED_SUCCESS',
                  (error) => error?.code ?? 'UNKNOWN',
                )

                if (malformed !== 'INVALID_CURSOR') {
                  throw new Error('invalid cursor assertion failed')
                }

                const endpointMismatchCursor = btoa(
                  JSON.stringify({
                    v: 1,
                    endpoint: 'authOtherList',
                    ordering: 'createdAt DESC, credentialId DESC',
                    createdAt: credentialsA[0][2],
                    credentialId: credentialsA[0][0],
                  }),
                ).replace(/+/g, '-').replace(///g, '_').replace(/=+$/g, '')

                const mismatched = await listCredentials(db, {
                  actorUserId: userA,
                  cursor: endpointMismatchCursor,
                  requestId: 'req-' + runId + '-5',
                }).then(
                  () => 'UNEXPECTED_SUCCESS',
                  (error) => error?.code ?? 'UNKNOWN',
                )

                if (mismatched !== 'INVALID_CURSOR') {
                  throw new Error('cursor endpoint-binding assertion failed')
                }

                const tooLarge = await listCredentials(db, {
                  actorUserId: userA,
                  limit: 101,
                  requestId: 'req-' + runId + '-6',
                }).then(
                  () => 'UNEXPECTED_SUCCESS',
                  (error) => error?.code ?? 'UNKNOWN',
                )

                if (tooLarge !== 'VALIDATION_FAILED') {
                  throw new Error('max-limit assertion failed')
                }

                return json({
                  status: 'PASS',
                  environment: 'CONTROLLED_REMOTE_D1_AUTH003_CREDENTIAL_LIST',
                  database: {
                    name: env.DATABASE_NAME,
                    binding: 'D1_01',
                    databaseId: '2f80471e-3756-49f9-8db1-7707a433ad64',
                  },
                  provenance: {
                    workflow: 'W02 AUTH-003 Credential List Runtime Evidence',
                    runId: env.RUN_ID,
                    sourceSha: env.SOURCE_SHA,
                    productionWorkerDeployed: false,
                  },
                  results: {
                    firstPage: first.data,
                    secondPage: second.data,
                    selfScopeIsolation: isolated.data,
                    malformedCursorCode: malformed,
                    endpointMismatchCursorCode: mismatched,
                    overLimitCode: tooLarge,
                  },
                  checks: {
                    canonicalPublicProjectionOnly: first.data.items.every(
                      (item) => Object.keys(item).sort().join(',') === 'active,credentialId,kind',
                    ),
                    deterministicCreatedAtCredentialIdOrder:
                      first.data.items[0]?.credentialId === credentialsA[0][0] &&
                      first.data.items[1]?.credentialId === credentialsA[1][0] &&
                      second.data.items[0]?.credentialId === credentialsA[2][0],
                    cursorPaginationContinuesCorrectly:
                      first.data.hasMore === true &&
                      Boolean(first.data.nextCursor) &&
                      second.data.hasMore === false &&
                      second.data.nextCursor === null,
                    selfScopeIsolation:
                      isolated.data.items.length === 1 &&
                      isolated.data.items[0]?.credentialId === credentialB[0],
                    cursorEndpointBindingRejectsForeignEndpoint: mismatched === 'INVALID_CURSOR',
                    malformedCursorRejected: malformed === 'INVALID_CURSOR',
                    maxLimitEnforced: tooLarge === 'VALIDATION_FAILED',
                    requestTracePropagation:
                      first.requestId === 'req-' + runId + '-1' &&
                      first.traceId === 'trace-' + runId + '-1',
                  },
                })
              } catch (error) {
                return json({
                  status: 'RUNTIME_EXCEPTION',
                  environment: 'CONTROLLED_REMOTE_D1_AUTH003_CREDENTIAL_LIST',
                  error: {
                    name: String(error?.name ?? 'Error'),
                    code: String(error?.code ?? 'UNKNOWN'),
                    message: String(error?.message ?? ''),
                  },
                }, 500)
              } finally {
                if (inserted) {
                  await db
                    .prepare('DELETE FROM auth_identities WHERE id IN (?, ?)')
                    .bind(identityA, identityB)
                    .run()
                }
              }
            },
          }
          EOF

      - name: Start ephemeral remote Worker runtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.116.0 dev --remote --config .auth003-credential-list-runtime.wrangler.jsonc --ip 127.0.0.1 --port 8791 > auth003-credential-list-runtime.log 2>&1 &
          echo $! > auth003-credential-list-runtime.pid

          ready=0
          for _ in $(seq 1 90); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:8791/probe || true)
            if [ "$code" != "000" ]; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat auth003-credential-list-runtime.log
            exit 1
          fi

      - name: Execute controlled credential-list runtime probe
        env:
          PROBE_TOKEN: ${{ env.PROBE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/mapping-0/w02-auth003-credential-list-runtime

          set +e
          http_code=$(curl -sS -o artifacts/mapping-0/w02-auth003-credential-list-runtime/runtime-result.json -w '%{http_code}'             -X POST             -H "x-auth003-probe-token: ${PROBE_TOKEN}"             http://127.0.0.1:8791/probe)
          curl_exit=$?
          set -e

          echo "AUTH003_CREDENTIAL_LIST_REMOTE_RUNTIME_HTTP_STATUS=$http_code"
          echo "AUTH003_CREDENTIAL_LIST_REMOTE_RUNTIME_CURL_EXIT=$curl_exit"
          cat artifacts/mapping-0/w02-auth003-credential-list-runtime/runtime-result.json || true
          cat auth003-credential-list-runtime.log || true

          test "$curl_exit" -eq 0
          test "$http_code" = "200"

          node - <<'NODE'
          const fs = require('node:fs')
          const result = JSON.parse(fs.readFileSync(
            'artifacts/mapping-0/w02-auth003-credential-list-runtime/runtime-result.json',
            'utf8',
          ))
          if (result.status !== 'PASS') throw new Error('AUTH-003 credential-list runtime evidence did not PASS')
          for (const [name, ok] of Object.entries(result.checks || {})) {
            if (!ok) throw new Error('AUTH-003 credential-list assertion failed: ' + name)
          }
          console.log(JSON.stringify({
            status: result.status,
            environment: result.environment,
            provenance: result.provenance,
            checks: result.checks,
          }, null, 2))
          NODE

      - name: Capture reproducible provenance
        run: |
          set -euo pipefail
          cat > artifacts/mapping-0/w02-auth003-credential-list-runtime/provenance.txt <<EOF
          workflow=W02 AUTH-003 Credential List Runtime Evidence
          github_run_id=${{ github.run_id }}
          github_source_sha=${{ github.sha }}
          tested_source_sha=${{ inputs.source_sha }}
          database_name=${DATABASE_NAME}
          database_id=${D1_01_ID}
          binding=D1_01
          environment=CONTROLLED_REMOTE_D1_AUTH003_CREDENTIAL_LIST
          operation=authCredentialList
          production_worker_deployed=false
          synthetic_identity_rows_cleaned=true
          EOF
          cp auth003-credential-list-runtime.log artifacts/mapping-0/w02-auth003-credential-list-runtime/harness.log

      - name: Upload controlled remote runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: w02-auth003-credential-list-runtime-evidence-${{ github.run_id }}
          path: artifacts/mapping-0/w02-auth003-credential-list-runtime/
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup ephemeral harness
        if: ${{ always() }}
        run: |
          if [ -f auth003-credential-list-runtime.pid ]; then
            kill "$(cat auth003-credential-list-runtime.pid)" 2>/dev/null || true
          fi
          rm -f .auth003-credential-list-runtime-harness.ts .auth003-credential-list-runtime.wrangler.jsonc auth003-credential-list-runtime.pid
