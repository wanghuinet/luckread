name: W11 Analytics Runtime CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'workers/W11-growth-campaign-analytics-operations/**'
      - '.github/workflows/w11-analytics-runtime-ci.yml'
  push:
    branches: [main]
    paths:
      - 'workers/W11-growth-campaign-analytics-operations/**'
      - '.github/workflows/w11-analytics-runtime-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w11-analytics-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analytics-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked root dependencies
        run: npm ci

      - name: Run W11 event-quality unit tests
        run: npx vitest run workers/W11-growth-campaign-analytics-operations/src/analytics-event-quality.test.ts

      - name: Type-check W11 event-quality runtime
        run: >-
          npx tsc --noEmit --strict --skipLibCheck
          --target ES2022 --module ESNext --moduleResolution Bundler
          --lib ES2022,DOM
          workers/W11-growth-campaign-analytics-operations/src/analytics-event-quality.ts
          workers/W11-growth-campaign-analytics-operations/src/analytics-event-quality.test.ts
