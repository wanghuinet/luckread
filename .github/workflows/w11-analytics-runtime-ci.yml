name: W11 Analytics Runtime CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'workers/W11-growth-campaign-analytics-operations/**'
      - '.github/workflows/w11-analytics-runtime-ci.yml'
  push:
    branches: [main]
    paths:
      - 'workers/W11-growth-campaign-analytics-operations/**'
      - '.github/workflows/w11-analytics-runtime-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w11-analytics-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analytics-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_local_only
          POSTGRES_DB: w11_analytics_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d w11_analytics_runtime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      W11_PG_TEST_DATABASE_URL: postgresql://postgres:postgres_local_only@127.0.0.1:5432/w11_analytics_runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked root dependencies
        run: npm ci

      - name: Install W11 PostgreSQL Worker runtime dependency
        run: npm install --prefix workers/W11-growth-campaign-analytics-operations --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Run W11 analytics unit tests
        run: >-
          npx vitest run
          workers/W11-growth-campaign-analytics-operations/src/analytics-event-quality.test.ts
          workers/W11-growth-campaign-analytics-operations/src/analytics-aggregation.test.ts
          workers/W11-growth-campaign-analytics-operations/src/analytics-period.test.ts
          workers/W11-growth-campaign-analytics-operations/src/analytics-d1-store.test.ts
          workers/W11-growth-campaign-analytics-operations/src/analytics-postgres-store.test.ts
          workers/W11-growth-campaign-analytics-operations/src/analytics-postgres-ingest.test.ts
          workers/W11-growth-campaign-analytics-operations/src/analytics-ingest-postgres.test.ts
          workers/W11-growth-campaign-analytics-operations/src/analytics-postgres.integration.test.ts
          workers/W11-growth-campaign-analytics-operations/src/entry.test.ts
          workers/W11-growth-campaign-analytics-operations/src/analytics-reconciliation.test.ts
          workers/W11-growth-campaign-analytics-operations/src/analytics-ingest.test.ts
          workers/W11-growth-campaign-analytics-operations/src/worker.test.ts
          workers/W11-growth-campaign-analytics-operations/src/analytics-read-model.test.ts

      - name: Verify D1-05 migration and transactional aggregate SQL
        run: python3 workers/W11-growth-campaign-analytics-operations/scripts/test_analytics_schema.py

      - name: Type-check W11 analytics runtime
        run: >-
          npx tsc --noEmit --strict --skipLibCheck
          --target ES2022 --module ESNext --moduleResolution Bundler
          --lib ES2022,DOM
          workers/W11-growth-campaign-analytics-operations/src/analytics-event-quality.ts
          workers/W11-growth-campaign-analytics-operations/src/analytics-event-quality.test.ts
          workers/W11-growth-campaign-analytics-operations/src/analytics-aggregation.ts
          workers/W11-growth-campaign-analytics-operations/src/analytics-period.ts
          workers/W11-growth-campaign-analytics-operations/src/analytics-aggregation.test.ts
          workers/W11-growth-campaign-analytics-operations/src/analytics-d1-store.ts
          workers/W11-growth-campaign-analytics-operations/src/analytics-postgres-store.ts
          workers/W11-growth-campaign-analytics-operations/src/analytics-postgres-store.test.ts
          workers/W11-growth-campaign-analytics-operations/src/analytics-postgres-ingest.ts
          workers/W11-growth-campaign-analytics-operations/src/analytics-postgres-ingest.test.ts
          workers/W11-growth-campaign-analytics-operations/src/analytics-ingest-postgres.ts
          workers/W11-growth-campaign-analytics-operations/src/analytics-ingest-postgres.test.ts
          workers/W11-growth-campaign-analytics-operations/src/analytics-postgres.integration.test.ts
          workers/W11-growth-campaign-analytics-operations/src/analytics-postgres-runtime.ts
          workers/W11-growth-campaign-analytics-operations/src/entry.ts
          workers/W11-growth-campaign-analytics-operations/src/entry.test.ts
          workers/W11-growth-campaign-analytics-operations/src/analytics-reconciliation.ts
          workers/W11-growth-campaign-analytics-operations/src/analytics-reconciliation.test.ts
          workers/W11-growth-campaign-analytics-operations/src/analytics-d1-store.test.ts
          workers/W11-growth-campaign-analytics-operations/src/analytics-ingest.ts
          workers/W11-growth-campaign-analytics-operations/src/analytics-ingest.test.ts
          workers/W11-growth-campaign-analytics-operations/src/worker.ts
          workers/W11-growth-campaign-analytics-operations/src/worker.test.ts
          workers/W11-growth-campaign-analytics-operations/src/analytics-read-model.ts
          workers/W11-growth-campaign-analytics-operations/src/analytics-read-model.test.ts
