name: Sync verified Expo UI native Bun lockfile

on:
  push:
    branches:
      - feat/native-expo-ui-menu
    paths:
      - .github/workflows/sync-native-expo-ui-lockfile.yml

permissions:
  actions: read
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the one-time sync branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Download and verify the lockfile generated by this PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verified-bun-lock"
          gh run download 41748013211 \
            --repo "$GITHUB_REPOSITORY" \
            --name luckread-native-bun-lockfile \
            --dir "$RUNNER_TEMP/verified-bun-lock"
          LOCKFILE="$RUNNER_TEMP/verified-bun-lock/bun.lockb"
          test -s "$LOCKFILE"
          strings "$LOCKFILE" | grep -Fq '@expo/ui'
          strings "$LOCKFILE" | grep -Fq '~58.0.26'
          strings "$LOCKFILE" | grep -Fq 'expo-camera'
          strings "$LOCKFILE" | grep -Fq 'expo-image-manipulator'
          if strings "$LOCKFILE" | grep -Fq '@react-native-menu/menu'; then
            echo "::error::Legacy @react-native-menu/menu remains in generated lockfile."
            exit 1
          fi
          ACTUAL_SHA="$(sha256sum "$LOCKFILE" | cut -d' ' -f1)"
          EXPECTED_SHA="d10f882d41c8159f559ff5c82903f9e5911b709ef1058db7af4a69bb061903c8"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          cp "$LOCKFILE" app/bun.lockb
          echo "Verified SDK 58.0.26 lockfile SHA256: $ACTUAL_SHA"

      - name: Commit only the generated lockfile and remove this temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sync-native-expo-ui-lockfile.yml
          git add app/bun.lockb
          git diff --cached --check
          git commit -m "fix(native): sync Bun lockfile for Expo UI SDK 58 menu"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Re-run Native App CI against the lockfile commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run app-mobile-ci.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f run_native_builds=true

      - name: Re-run Android Beta APK build against the lockfile commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run app-android-beta-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f version_name=AUTO \
            -f version_code=0 \
            -f publish_release=false
