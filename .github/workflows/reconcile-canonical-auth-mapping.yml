name: Reconcile Canonical AUTH Mapping

on:
  push:
    branches: [main]
    paths:
      - 'scripts/reconcile-canonical-auth-mapping.mjs'
      - 'contracts/alignment/mapping-batches/AUTH-002-006-persistence-api-entity-field-mapping.v1.json'
      - '.github/workflows/reconcile-canonical-auth-mapping.yml'
  workflow_dispatch:

concurrency:
  group: canonical-auth-mapping-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Reconcile AUTH-002..006 contract entity bindings
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          node scripts/reconcile-canonical-auth-mapping.mjs

      - name: Commit and push reconciled mapping
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            if git diff --quiet -- contracts/alignment/cross-system-mapping.v1.json; then
              echo 'No canonical AUTH mapping changes required.'
              exit 0
            fi

            git add contracts/alignment/cross-system-mapping.v1.json
            git commit -m 'chore(mapping): reconcile AUTH contract entity bindings'

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push race detected on attempt ${attempt}; rebasing computation onto latest main."
            git fetch origin main
            git reset --hard origin/main
            node scripts/reconcile-canonical-auth-mapping.mjs
          done

          echo 'Unable to push canonical AUTH mapping after 3 attempts.'
          exit 1
