name: Contract CI

on:
  push:
    branches: [main, 'contract/**']
    paths:
      - 'contracts/**'
      - 'docs/**'
      - 'scripts/contract-ci.mjs'
      - '.github/workflows/contract-ci.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - 'docs/**'
      - 'scripts/contract-ci.mjs'
      - '.github/workflows/contract-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Contract CI is the CODE DEVELOPMENT ADMISSION gate.
  # This repository is contract-first: implementation is intentionally absent
  # until the contract/evidence gates are green. Payload is restored separately
  # from the pinned upstream version only after development admission.
  contract:
    name: Contract Admission Gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        domain: [common, enums, state-machines, authz, openapi]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Runner diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          printf 'PWD=%s\n' "$PWD"
          node --version
          npm --version
          test -d contracts
          test -f scripts/contract-ci.mjs
      - name: Validate contract domain (${{ matrix.domain }})
        shell: bash
        run: node scripts/contract-ci.mjs ${{ matrix.domain }}

  contract-full:
    name: Contract Admission Gate (full)
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate all contract domains
        shell: bash
        run: node scripts/contract-ci.mjs

  openapi-lint:
    name: OpenAPI Lint
    runs-on: ubuntu-latest
    needs: contract-full
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Lint OpenAPI
        shell: bash
        run: npx --yes @redocly/cli@1.34.2 lint contracts/openapi/v1/openapi.yaml
