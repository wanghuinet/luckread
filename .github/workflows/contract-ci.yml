name: Contract CI

on:
  push:
    branches: [main, 'contract/**']
    paths: ['package.json','package-lock.json','contracts/**','docs/**','scripts/**','.github/workflows/contract-ci.yml']
  pull_request:
    paths: ['package.json','package-lock.json','contracts/**','docs/**','scripts/**','.github/workflows/contract-ci.yml']
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: 'Exact commit SHA to validate'
        required: false
        type: string

permissions:
  contents: read

env:
  CHECKOUT_REF: ${{ github.event.inputs.checkout_ref || github.sha }}

jobs:
  contract:
    name: Contract Admission Gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        domain: [common, enums, state-machines, authz, openapi]
    steps:
      - uses: actions/checkout@v4
        with: {ref: ${{ env.CHECKOUT_REF }} }
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: node scripts/contract-ci.mjs ${{ matrix.domain }}

  contract-semantic:
    name: Semantic Cross-Contract Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: ${{ env.CHECKOUT_REF }} }
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: node scripts/contract-semantic-ci.mjs

  feature-inventory:
    name: Blueprint Feature Inventory Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: ${{ env.CHECKOUT_REF }} }
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: node scripts/build-feature-inventory.mjs
      - run: test -f contracts/alignment/feature-inventory.v1.json
      - run: git diff --exit-code -- contracts/alignment/feature-inventory.v1.json
      - run: test -z "$(git status --porcelain --untracked-files=all)"

  payload-reconciliation:
    name: Payload Contract Reconciliation Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: ${{ env.CHECKOUT_REF }} }
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: node scripts/payload-native-inventory.mjs
      - run: git diff --exit-code -- contracts/payload/payload-native-inventory.v1.json
      - run: node scripts/payload-contract-reconciliation-check.mjs

  capability-graph:
    name: Capability Contract Graph Gate
    runs-on: ubuntu-latest
    needs: [contract, contract-semantic, feature-inventory, payload-reconciliation]
    steps:
      - uses: actions/checkout@v4
        with: {ref: ${{ env.CHECKOUT_REF }} }
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: node scripts/build-capability-contract-graph.mjs
      - run: node scripts/capability-contract-graph-check.mjs
      - name: Audit historical L1-L4 reconciliation (non-blocking)
        continue-on-error: true
        run: node scripts/l1-l4-reconciliation-baseline-check.mjs
      - run: node scripts/entity-catalog-check.mjs
      - run: node scripts/entity-implementation-evidence-check.mjs
      - run: node scripts/entity-field-contract-check.mjs
      - run: node scripts/entity-field-schema-contract-check.mjs
      - name: Generate R4 evidence gap report
        run: node scripts/mapping-0-r4-evidence-gap-report.mjs
      - run: node scripts/feature-entity-persistence-registry-check.mjs
      - name: Validate canonical Mapping 0 Evidence Registry
        if: ${{ always() }}
        run: node scripts/mapping-0-evidence-registry-final-check.mjs
      - name: Upload R4 evidence gap report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mapping-0-r4-evidence-gap-${{ github.run_id }}
          path: artifacts/mapping-0/r4-evidence-gap-report.json
          if-no-files-found: error
          retention-days: 14
      - run: node scripts/r5-foundation-contract-check.mjs

  alignment:
    name: Five-Way Alignment Admission Gate
    runs-on: ubuntu-latest
    needs: [contract, contract-semantic, feature-inventory, payload-reconciliation]
    steps:
      - uses: actions/checkout@v4
        with: {ref: ${{ env.CHECKOUT_REF }} }
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: node scripts/consolidate-mapping-batches.mjs
      - run: node scripts/alignment-ci.mjs
      - run: git diff --exit-code -- contracts/alignment/feature-inventory.v1.json contracts/alignment/api-inventory.v1.json contracts/alignment/payload-inventory.v1.json contracts/alignment/code-evidence-inventory.v1.json contracts/alignment/five-way-reconciliation.v1.json contracts/alignment/change-impact.v1.json

  mapping-zero-final:
    name: Mapping 0 Structural/Contract Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: ${{ env.CHECKOUT_REF }} }
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - name: Generate Mapping 0 closure status snapshot
        if: ${{ always() }}
        run: node scripts/mapping-0-status-report.mjs
      - name: Publish Mapping 0 closure status snapshot
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mapping-0-status-${{ github.run_id }}
          path: artifacts/mapping-0/mapping-0-status-report.json
          if-no-files-found: error
          retention-days: 14
      - run: npm run mapping:0:verify

  contract-full:
    name: Contract Admission Gate (full)
    runs-on: ubuntu-latest
    needs: [contract, contract-semantic, capability-graph, alignment, mapping-zero-final]
    steps:
      - uses: actions/checkout@v4
        with: {ref: ${{ env.CHECKOUT_REF }} }
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: node scripts/contract-ci.mjs

  openapi-lint:
    name: OpenAPI Lint
    runs-on: ubuntu-latest
    needs: contract-full
    steps:
      - uses: actions/checkout@v4
        with: {ref: ${{ env.CHECKOUT_REF }} }
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npx --yes @redocly/cli@1.34.2 lint contracts/openapi/v1/openapi.yaml
