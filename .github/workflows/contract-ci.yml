name: Contract CI

on:
  push:
    branches: [main, 'contract/**']
    paths:
      - 'contracts/**'
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/contract-ci.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/contract-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Contract Admission Gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        domain: [common, enums, state-machines, authz, openapi]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Runner diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          printf 'PWD=%s\n' "$PWD"
          node --version
          npm --version
          test -d contracts
          test -f scripts/contract-ci.mjs
      - name: Validate contract domain (${{ matrix.domain }})
        shell: bash
        run: node scripts/contract-ci.mjs ${{ matrix.domain }}

  contract-semantic:
    name: Semantic Cross-Contract Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate cross-contract invariants
        shell: bash
        run: node scripts/contract-semantic-ci.mjs

  capability-graph:
    name: Capability Contract Graph Gate
    runs-on: ubuntu-latest
    needs: [contract, contract-semantic]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Recover and gate historical L1-L4 hierarchy
        shell: bash
        run: node scripts/l1-l4-recovery-gate.mjs
      - name: Build deterministic Feature L1-L4 exact crosswalk
        shell: bash
        run: node scripts/build-feature-l1-l4-exact-crosswalk.mjs
      - name: Enforce R3 Feature L1-L4 admission gate
        shell: bash
        run: node scripts/r3-feature-crosswalk-gate.mjs
      - name: Validate Blueprint-to-Registry reconciliation
        shell: bash
        run: node scripts/capability-contract-graph-check.mjs
      - name: Validate L1-L4 reconciliation baseline
        shell: bash
        run: node scripts/l1-l4-reconciliation-baseline-check.mjs
      - name: Enforce R4 Feature Entity Persistence ownership gate
        shell: bash
        run: node scripts/feature-entity-persistence-registry-check.mjs

  contract-full:
    name: Contract Admission Gate (full)
    runs-on: ubuntu-latest
    needs: [contract, contract-semantic, capability-graph]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate all contract domains
        shell: bash
        run: node scripts/contract-ci.mjs

  openapi-lint:
    name: OpenAPI Lint
    runs-on: ubuntu-latest
    needs: contract-full
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Lint OpenAPI
        shell: bash
        run: npx --yes @redocly/cli@1.34.2 lint contracts/openapi/v1/openapi.yaml
