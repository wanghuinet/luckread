name: Contract CI

on:
  push:
    branches: [main, 'contract/**']
    paths:
      - 'contracts/**'
      - 'docs/**'
      - 'scripts/contract-ci.mjs'
      - 'scripts/contract-evidence.mjs'
      - 'scripts/contract-admission.mjs'
      - '.github/workflows/contract-ci.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - 'docs/**'
      - 'scripts/contract-ci.mjs'
      - 'scripts/contract-evidence.mjs'
      - 'scripts/contract-admission.mjs'
      - '.github/workflows/contract-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Contract Admission Gate (${{ matrix.domain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        domain: [common, enums, state-machines, authz, openapi]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Runner diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          printf 'PWD=%s\n' "$PWD"
          node --version
          npm --version
          test -d contracts
          test -f scripts/contract-ci.mjs
      - name: Validate contract domain (${{ matrix.domain }})
        shell: bash
        run: node scripts/contract-ci.mjs ${{ matrix.domain }}
      - name: Generate exact-commit evidence
        shell: bash
        env:
          CONTRACT_DOMAIN: ${{ matrix.domain }}
          CONTRACT_CI_RESULT: PASS
          CONTRACT_VALIDATOR_VERSION: 1.0.0
        run: node scripts/contract-evidence.mjs
      - name: Upload contract evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: contract-evidence-${{ matrix.domain }}
          path: contract-evidence/${{ matrix.domain }}.json
          if-no-files-found: error

  contract-full:
    name: Contract Admission Gate (full)
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate all contract domains
        shell: bash
        run: node scripts/contract-ci.mjs
      - name: Generate full-validation evidence
        if: success()
        shell: bash
        env:
          CONTRACT_DOMAIN: full
          CONTRACT_CI_RESULT: PASS
          CONTRACT_VALIDATOR_VERSION: 1.0.0
        run: node scripts/contract-evidence.mjs
      - name: Upload full-validation evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: contract-evidence-full
          path: contract-evidence/full.json
          if-no-files-found: error

  openapi-lint:
    name: OpenAPI Lint
    runs-on: ubuntu-latest
    needs: contract-full
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Lint OpenAPI
        shell: bash
        run: npx --yes @redocly/cli@1.34.2 lint contracts/openapi/v1/openapi.yaml
      - name: Generate OpenAPI lint evidence
        if: success()
        shell: bash
        env:
          CONTRACT_DOMAIN: openapi-lint
          CONTRACT_CI_RESULT: PASS
          CONTRACT_VALIDATOR_VERSION: redocly-cli@1.34.2
        run: node scripts/contract-evidence.mjs
      - name: Upload OpenAPI lint evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: contract-evidence-openapi-lint
          path: contract-evidence/openapi-lint.json
          if-no-files-found: error

  development-admission:
    name: Development Admission (fail-closed)
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [contract, contract-full, openapi-lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download matrix evidence
        if: ${{ needs.contract.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          pattern: contract-evidence-*
          path: contract-evidence
          merge-multiple: true
      - name: Verify job results
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.contract.result }}" = success
          test "${{ needs.contract-full.result }}" = success
          test "${{ needs.openapi-lint.result }}" = success
      - name: Verify exact-commit evidence
        shell: bash
        run: node scripts/contract-admission.mjs contract-evidence
