name: Contract CI

on:
  push:
    branches: [main, 'contract/**']
    paths:
      - 'contracts/**'
      - 'scripts/contract-ci.mjs'
      - '.github/workflows/contract-ci.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - 'scripts/contract-ci.mjs'
      - '.github/workflows/contract-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  common-schema:
    name: Common Schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Runner diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          printf 'PWD=%s\n' "$PWD"
          node --version
          npm --version
          test -d contracts/schemas/common
          find contracts/schemas/common -maxdepth 1 -type f -name '*.json' -print | sort
          test -f scripts/contract-ci.mjs
      - name: Validate common schemas
        shell: bash
        run: node scripts/contract-ci.mjs common

  openapi-foundation:
    name: OpenAPI Foundation
    runs-on: ubuntu-latest
    needs: common-schema
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate OpenAPI
        shell: bash
        run: npx --yes @redocly/cli@1.34.2 lint contracts/openapi/v1/openapi.yaml
