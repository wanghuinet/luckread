name: W02 AUTH-013 Runtime Source Verification

on:
  workflow_dispatch:
  push:
    paths:
      - 'workers/luck01-identity/src/account/**'
      - 'contracts/state-machines/account.json'
      - 'workers/luck01-identity/wrangler.jsonc'
      - 'workers/luck01-identity/src/index.ts'
      - '.github/workflows/w02-auth-013-runtime-source-verification.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install W02 runtime dependencies
        working-directory: workers/luck01-identity
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Typecheck W02
        run: npx tsc -p workers/luck01-identity/tsconfig.json --noEmit

      - name: Prepare AUTH-013 source evidence
        run: mkdir -p artifacts/mapping-0/auth-013-runtime-source

      - name: Run AUTH-013 source tests
        run: |
          set -o pipefail
          npx vitest run workers/luck01-identity/src/account/account-state-transition.test.ts workers/luck01-identity/src/account/publication-journal-publisher.test.ts 2>&1 | tee artifacts/mapping-0/auth-013-runtime-source/test-output.txt

      - name: Capture AUTH-013 source provenance
        run: |
          {
            echo "workflow=W02 AUTH-013 Runtime Source Verification"
            echo "source_sha=${GITHUB_SHA}"
            echo "worker=W02"
            echo "persistence=D1-01/users"
            echo "test=account-state-transition + publication-journal-publisher"
            echo "typescript_check=PASS"
            echo "scope=SOURCE_IMPLEMENTATION_ONLY"
          } > artifacts/mapping-0/auth-013-runtime-source/provenance.txt
          git show -s --format='%H%n%s%n%aI' "${GITHUB_SHA}" > artifacts/mapping-0/auth-013-runtime-source/commit.txt

      - name: Upload AUTH-013 source evidence
        uses: actions/upload-artifact@v4
        with:
          name: auth-013-runtime-source-${{ github.run_id }}
          path: artifacts/mapping-0/auth-013-runtime-source/
          if-no-files-found: error
          retention-days: 14