name: Recover L1-L4 Historical Hierarchy

on:
  push:
    branches: [main]
    paths:
      - 'docs/archive/1.0-reuse/RECOVERED-36-FOURTH-LEVEL-CAPABILITY-MASTER-MATRIX-v1.0.md'
      - 'scripts/recover-l1-l4-hierarchy.mjs'
      - '.github/workflows/recover-l1-l4-hierarchy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Parse historical hierarchy
        run: node scripts/recover-l1-l4-hierarchy.mjs

      - name: Validate deterministic output
        run: |
          test -s contracts/capability/recovery/l1-l4-historical-hierarchy.parsed.json
          node -e "const fs=require('fs'); const p='contracts/capability/recovery/l1-l4-historical-hierarchy.parsed.json'; const x=JSON.parse(fs.readFileSync(p,'utf8')); if(x.status!=='RECOVERED_NON_AUTHORITATIVE') process.exit(1); if(!Array.isArray(x.nodes)||x.nodes.length===0) process.exit(1); const orders=x.nodes.map(n=>n.order); if(new Set(orders).size!==orders.length) process.exit(1); for(const n of x.nodes){if(!/^L[1-4]$/.test(n.level)||!Number.isInteger(n.sourceLine)||n.sourceLine<1) process.exit(1); if(n.level==='L1' && (n.l2!==null||n.l3!==null||n.l4!==null)) process.exit(1); if(n.level==='L2' && (!n.l1||n.l3!==null||n.l4!==null)) process.exit(1); if(n.level==='L3' && (!n.l1||!n.l2||n.l4!==null)) process.exit(1); if(n.level==='L4' && (!n.l1||!n.l2||!n.l3||!n.l4)) process.exit(1);}"

      - name: Commit recovered hierarchy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contracts/capability/recovery/l1-l4-historical-hierarchy.parsed.json
          if git diff --cached --quiet; then
            echo 'No hierarchy changes to commit.'
            exit 0
          fi
          git commit -m 'contract: persist recovered L1-L4 hierarchy'
          git push
