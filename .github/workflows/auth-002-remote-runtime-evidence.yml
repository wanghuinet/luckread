name: AUTH-002 Remote Runtime Evidence

on:
  workflow_run:
    workflows:
      - W01 W02 Auth Binding Deploy
    types: [completed]
  workflow_dispatch:
    inputs:
      tested_commit:
        description: Exact W01/W02 deployment commit to test
        required: true
        type: string
      w01_base_url:
        description: Controlled W01 URL
        required: true
        default: https://luckread-w01-payload.wanghui-79b.workers.dev
        type: string
      database_name:
        description: Controlled D1 database name
        required: true
        default: luckread
        type: string
      deployment_run_id:
        description: Optional W01 W02 Auth Binding Deploy run ID; auto-discovered from tested_commit when empty
        required: false
        type: string

permissions:
  contents: read
  actions: read

env:
  WRANGLER_VERSION: 4.116.0
  W01_BASE_URL: ${{ github.event_name == 'workflow_run' && 'https://luckread-w01-payload.wanghui-79b.workers.dev' || inputs.w01_base_url }}
  DATABASE_NAME: ${{ github.event_name == 'workflow_run' && 'luckread' || inputs.database_name }}
  DEPLOYMENT_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.deployment_run_id }}
  DEPLOYMENT_HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.tested_commit }}

jobs:
  runtime-evidence:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact deployed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.tested_commit }}
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Enable pnpm 11
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install locked W01 dependencies
        working-directory: workers/W01-payload
        run: pnpm install --frozen-lockfile

      - name: Materialize current runtime probe harness
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git show origin/main:scripts/auth-002-session-runtime-probe-remote.mjs > scripts/auth-002-session-runtime-probe-remote.mjs
          test -s scripts/auth-002-session-runtime-probe-remote.mjs

      - name: Verify runtime evidence admission
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${DEPLOYMENT_HEAD_SHA}"
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          if [ -z "${DEPLOYMENT_RUN_ID}" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/w01-w02-binding-deploy.yml/runs?branch=main&status=success&per_page=100" > /tmp/auth-002-deployment-runs.json
            DEPLOYMENT_HEAD_SHA="${DEPLOYMENT_HEAD_SHA}" GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" node --input-type=module > /tmp/auth-002-deployment-run-id <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { readFileSync } from 'node:fs'
          const data = JSON.parse(readFileSync('/tmp/auth-002-deployment-runs.json', 'utf8'))
          const sha = process.env.DEPLOYMENT_HEAD_SHA
          const repo = process.env.GITHUB_REPOSITORY
          const expectedArtifact = `w01-w02-binding-deployment-${sha}`
          const candidates = (data.workflow_runs ?? [])
            .filter((run) =>
              run?.name === 'W01 W02 Auth Binding Deploy' &&
              run?.head_branch === 'main' &&
              run?.conclusion === 'success'
            )
            .sort((a, b) => String(b?.created_at ?? '').localeCompare(String(a?.created_at ?? '')))
          for (const run of candidates) {
            const artifacts = JSON.parse(execFileSync('gh', [
              'api',
              `repos/${repo}/actions/runs/${run.id}/artifacts?per_page=100`,
            ], { encoding: 'utf8' }))
            const matchedArtifact = (artifacts.artifacts ?? []).find(
              (artifact) => artifact?.name === expectedArtifact && artifact?.expired_at == null
            )
            if (matchedArtifact) {
              process.stdout.write(String(run.id))
              break
            }
          }
          NODE
            DEPLOYMENT_RUN_ID="$(cat /tmp/auth-002-deployment-run-id")
            rm -f /tmp/auth-002-deployment-runs.json /tmp/auth-002-deployment-run-id
            if [ -z "${DEPLOYMENT_RUN_ID}" ]; then
              throw="runtime evidence admission: no successful W01 W02 Auth Binding Deploy run contains artifact w01-w02-binding-deployment-${DEPLOYMENT_HEAD_SHA}"
              echo "${throw}" >&2
              exit 1
            fi
            echo "DEPLOYMENT_RUN_ID=${DEPLOYMENT_RUN_ID}" >> "${GITHUB_ENV}"
            echo "Runtime evidence admission: auto-discovered W01 W02 Auth Binding Deploy run ${DEPLOYMENT_RUN_ID} by exact source artifact for SHA ${DEPLOYMENT_HEAD_SHA}"
          fi
          test -n "${DEPLOYMENT_RUN_ID}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${DEPLOYMENT_RUN_ID}" > /tmp/auth-002-deployment.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${DEPLOYMENT_RUN_ID}/artifacts?per_page=100" > /tmp/auth-002-artifacts.json
          DEPLOYMENT_HEAD_SHA="${DEPLOYMENT_HEAD_SHA}" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const data = JSON.parse(readFileSync('/tmp/auth-002-deployment.json', 'utf8'))
          const artifacts = JSON.parse(readFileSync('/tmp/auth-002-artifacts.json', 'utf8'))
          if (data.name !== 'W01 W02 Auth Binding Deploy') throw new Error('runtime evidence admission: deployment run is not W01 W02 Auth Binding Deploy')
          if (data.conclusion !== 'success') throw new Error('runtime evidence admission: deployment run conclusion is not success')
          if (data.head_branch !== 'main') throw new Error('runtime evidence admission: deployment run is not on main')
          const expectedArtifact = `w01-w02-binding-deployment-${process.env.DEPLOYMENT_HEAD_SHA}`
          const matchedArtifact = (artifacts.artifacts ?? []).find((artifact) => artifact?.name === expectedArtifact && artifact?.expired_at == null)
          if (!matchedArtifact) {
            throw new Error(`runtime evidence admission: deployment artifact for source SHA ${process.env.DEPLOYMENT_HEAD_SHA} was not found in run ${data.id}`)
          }
          console.log(`Runtime evidence admission: deployment run ${data.id} SUCCESS on main; deployed source artifact=${expectedArtifact}; workflow run head_sha=${data.head_sha}; source admission is bound to exact artifact name`)
          NODE
          rm -f /tmp/auth-002-deployment.json /tmp/auth-002-artifacts.json
          node scripts/auth-session-schema-evidence-probe.mjs --gate1

      - name: Capture W01 dependency provenance
        working-directory: workers/W01-payload
        run: |
          set -euo pipefail
          mkdir -p ../../artifacts/evidence/auth-002/runtime
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFileSync, writeFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          const packageJson = JSON.parse(readFileSync('package.json', 'utf8'))
          const lockfile = readFileSync('pnpm-lock.yaml')
          const testedCommitSha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim()
          const gitVersion = execFileSync('git', ['--version'], { encoding: 'utf8' }).trim()
          const artifact = {
            repository: 'wanghuinet/luckread',
            testedCommitSha,
            workerPath: 'workers/W01-payload',
            payloadVersion: packageJson.dependencies?.payload,
            d1AdapterVersion: packageJson.dependencies?.['@payloadcms/db-d1-sqlite'],
            nodeVersion: process.version,
            lockfileReference: 'workers/W01-payload/pnpm-lock.yaml',
            lockfileSha256: createHash('sha256').update(lockfile).digest('hex'),
            gitVersion,
          }
          writeFileSync('../../artifacts/evidence/auth-002/runtime/runtime-dependency.json', JSON.stringify(artifact, null, 2) + '\n')
          NODE

      - name: Capture W01 worker runtime diagnostics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NODE_OPTIONS: --no-deprecation
        run: |
          set +e
          mkdir -p artifacts/evidence/auth-002/worker-diagnostic

          npx --yes "wrangler@${WRANGLER_VERSION}" secret list \
            --name luckread-w01-payload \
            --format json \
            > artifacts/evidence/auth-002/worker-diagnostic/secret-names.json 2>&1
          secret_list_status=$?
          printf '{"secretListExitCode":%s}\n' "${secret_list_status}" \
            > artifacts/evidence/auth-002/worker-diagnostic/secret-list-status.json

          tail_raw="artifacts/evidence/auth-002/worker-diagnostic/.tail-raw.log"
          tail_sanitized="artifacts/evidence/auth-002/worker-diagnostic/worker-error-tail.json"
          npx --yes "wrangler@${WRANGLER_VERSION}" tail luckread-w01-payload \
            --format json \
            --status error \
            --sampling-rate 1 \
            > "${tail_raw}" 2>&1 &
          tail_pid=$!

          sleep 5
          node scripts/auth-002-session-runtime-probe-remote.mjs
          probe_status=$?

          sleep 4
          kill "${tail_pid}" >/dev/null 2>&1 || true
          wait "${tail_pid}" >/dev/null 2>&1 || true

          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const raw = readFileSync('artifacts/evidence/auth-002/worker-diagnostic/.tail-raw.log', 'utf8')
          const events = []
          for (const line of raw.split(/\\r?\\n/)) {
            const trimmed = line.trim()
            if (!trimmed) continue
            try {
              const value = JSON.parse(trimmed)
              events.push({
                eventTimestamp: value.eventTimestamp ?? null,
                outcome: value.outcome ?? null,
                exceptions: Array.isArray(value.exceptions)
                  ? value.exceptions.map((item) => ({
                      name: item?.name ?? null,
                      message: item?.message ?? null,
                    }))
                  : [],
                logs: Array.isArray(value.logs)
                  ? value.logs.map((item) => ({
                      level: item?.level ?? null,
                      message: item?.message ?? null,
                    }))
                  : [],
              })
            } catch {
              // Keep only parseable structured Worker events in the evidence.
            }
          }
          const artifact = {
            worker: 'luckread-w01-payload',
            deploymentHeadSha: process.env.DEPLOYMENT_HEAD_SHA,
            deploymentRunId: Number(process.env.DEPLOYMENT_RUN_ID || 0),
            capturedAt: new Date().toISOString(),
            eventCount: events.length,
            events,
          }
          writeFileSync('artifacts/evidence/auth-002/worker-diagnostic/worker-error-tail.json', JSON.stringify(artifact, null, 2) + '\\n')
          NODE
          rm -f "${tail_raw}"

          exit "${probe_status}"

      - name: Validate runtime evidence package
        if: always()
        run: node scripts/auth-session-runtime-evidence-validate.mjs

      - name: Upload AUTH-002 runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-002-runtime-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence/auth-002/runtime/
          if-no-files-found: error
          retention-days: 30

      - name: Upload W01 worker runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-002-worker-runtime-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence/auth-002/worker-diagnostic/
          if-no-files-found: warn
          retention-days: 30
