name: W06 Governance Deploy

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit to deploy
        required: true
        type: string
      confirm:
        description: Type DEPLOY to permit this controlled W06 deployment
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: ${{ inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact implementation commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify required admission gates for the exact source SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail

          for workflow in mapping-0-structural-ci.yml ensure-feature-inventory.yml auth-013-persistence-schema-evidence.yml w06-audit-event-source-ci.yml; do
            conclusion="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --commit "$SOURCE_SHA" --limit 1 --json conclusion --jq '.[0].conclusion // empty')"
            test "$conclusion" = "success" || {
              echo "Required workflow $workflow is not SUCCESS for $SOURCE_SHA (observed: ${conclusion:-none})"
              exit 1
            }
          done

          contract_run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow contract-ci.yml --commit "$SOURCE_SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          test -n "$contract_run" || {
            echo "No Contract CI run found for $SOURCE_SHA"
            exit 1
          }

          required_jobs=(
            "Blueprint Feature Inventory Gate"
            "Contract Admission Gate (state-machines)"
            "Contract Admission Gate (openapi)"
            "Mapping 0 Structural/Contract Gate"
            "Contract Admission Gate (authz)"
            "Contract Admission Gate (common)"
            "Semantic Cross-Contract Gate"
            "Payload Contract Reconciliation Gate"
            "Contract Admission Gate (enums)"
            "Capability Contract Graph Gate"
          )

          jobs_json="$(gh run view "$contract_run" --repo "$GITHUB_REPOSITORY" --json jobs)"
          for job in "${required_jobs[@]}"; do
            conclusion="$(jq -r --arg name "$job" '.jobs[] | select(.name == $name) | .conclusion // empty' <<< "$jobs_json")"
            test "$conclusion" = "success" || {
              echo "Required Contract CI core job failed or is missing: $job (observed: ${conclusion:-none})"
              exit 1
            }
          done

      - name: Verify W06 physical binding configuration
        working-directory: workers/W06-governance
        run: |
          test -f wrangler.jsonc
          node - <<'NODE'
          const fs = require('fs')
          const text = fs.readFileSync('wrangler.jsonc', 'utf8')
          const required = [
            '"name": "luckread-w06"',
            '"binding": "D1_03"',
            '"database_id": "bda1d247-a371-4244-91ae-aef96034db7f"'
          ]
          for (const value of required) {
            if (!text.includes(value)) throw new Error(`Missing required binding assertion: ${value}`)
          }
          NODE

      - name: Install repository dependencies
        run: npm ci

      - name: TypeScript verification
        run: npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler --strict --skipLibCheck workers/W06-governance/src/index.ts

      - name: Deploy W06 with pinned Wrangler
        working-directory: workers/W06-governance
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.116.0 deploy --config wrangler.jsonc
