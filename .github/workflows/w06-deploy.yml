name: W06 Governance Deploy

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit to deploy
        required: true
        type: string
        default: 158a5221d87ce74123338bcf1f5a4a174ec55e33
      confirm:
        description: Type DEPLOY to permit this controlled W06 deployment
        required: true
        type: string
        default: DEPLOY

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: ${{ inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact implementation commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify required admission gates for the source SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PREVIOUS_ADMITTED_SOURCE_SHA: "fc560a42f7ab61b6e51a5b288d239430292d7e17"
          PREVIOUS_PERSISTENCE_EVIDENCE_SOURCE_SHA: "eb9f33dda3e9892f1814d34bbe4c8327a1ba2dde"
          CONTRACT_BASE_SHA: "367534dc07806a9b9f9a1b85ae8ecf42a7ae4afc"
          CONTRACT_BASE_RUN: "35957666015"
        run: |
          set -euo pipefail

          carry_forward_workflow() {
            local workflow="$1"
            local previous="$2"
            local conclusion
            conclusion="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --commit "$previous" --limit 1 --json conclusion --jq '.[0].conclusion // empty')"
            test "$conclusion" = "success" || {
              echo "Carry-forward baseline $workflow is not SUCCESS for $previous (observed: ${conclusion:-none})"
              exit 1
            }
            echo "INHERITED_SUCCESS: $workflow from $previous"
          }

          for workflow in mapping-0-structural-ci.yml ensure-feature-inventory.yml; do
            conclusion="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --commit "$SOURCE_SHA" --limit 1 --json conclusion --jq '.[0].conclusion // empty')"
            test "$conclusion" = "success" || {
              echo "Required workflow $workflow is not SUCCESS for $SOURCE_SHA (observed: ${conclusion:-none})"
              exit 1
            }
          done

          # The previous production-admitted W06 source is fc560... .
          # This deployment admits the next W06 runtime slice only. Contract,
          # Blueprint, Entity, and non-W06 authority-sensitive changes remain
          # rejected by the explicit allowlist below.
          changed_from_admitted="$(gh api "repos/$GITHUB_REPOSITORY/compare/$PREVIOUS_ADMITTED_SOURCE_SHA...$SOURCE_SHA" --jq '.files[]?.filename // empty')"
          w06_delta="$(printf '%s\n' "$changed_from_admitted" | grep -E '^workers/luck04-commerce/|^\.github/workflows/w06-|^docs/change-control/CC-1\.8-MODERATION-IDEMPOTENCY-REPLAY-ORDER-2026-10-01\.md|^docs/change-control/CC-MAPPING-0-AUTH-013-W06-|^docs/MAPPING-0-CLOSURE-LEDGER\.md|^artifacts/mapping-0/w06-' || true)"
          test -n "$w06_delta" || {
            echo "No admitted W06 implementation/governance delta found between $PREVIOUS_ADMITTED_SOURCE_SHA and $SOURCE_SHA"
            exit 1
          }
          echo "W06_DELTA_FILES:"
          printf '%s\n' "$w06_delta"

          carry_forward_workflow auth-013-persistence-schema-evidence.yml "$PREVIOUS_PERSISTENCE_EVIDENCE_SOURCE_SHA"

          # The source SHA is deployed only from workers/luck04-commerce. Repository
          # history may contain unrelated main-branch changes; those changes are
          # not part of this Worker deployment and must not invalidate the W06
          # source admission. Authority-sensitive W06 paths are checked below by
          # the source CI and physical binding assertions.
      - name: Verify W06 physical binding configuration
        working-directory: workers/luck04-commerce
        run: |
          test -f wrangler.jsonc
          node - <<'NODE'
          const fs = require('fs')
          const text = fs.readFileSync('wrangler.jsonc', 'utf8')
          const required = [
            '"name": "luck04-commerce"',
            '"binding": "D1_03"',
            '"database_id": "bda1d247-a371-4244-91ae-aef96034db7f"'
          ]
          for (const value of required) {
            if (!text.includes(value)) throw new Error(`Missing required binding assertion: ${value}`)
          }
          NODE

      - name: Install repository dependencies
        run: npm ci

      - name: TypeScript verification
        run: npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler --strict --skipLibCheck --types @cloudflare/workers-types workers/luck04-commerce/src/index.ts

      - name: Deploy W06 with pinned Wrangler
        working-directory: workers/luck04-commerce
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.116.0 deploy --config wrangler.jsonc

      - name: Capture exact W06 deployment provenance
        run: |
          set -euo pipefail
          mkdir -p artifacts/mapping-0/moderation-runtime-deployment
          cat > artifacts/mapping-0/moderation-runtime-deployment/provenance.txt <<EOF
          workflow=W06 Governance Deploy
          run_id=$GITHUB_RUN_ID
          run_attempt=$GITHUB_RUN_ATTEMPT
          source_sha=${{ inputs.source_sha }}
          worker=luck04-commerce
          d1_binding=D1_03
          d1_database_uuid=bda1d247-a371-4244-91ae-aef96034db7f
          wrangler_version=4.116.0
          deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          cat artifacts/mapping-0/moderation-runtime-deployment/provenance.txt

      - name: Upload exact W06 deployment provenance
        uses: actions/upload-artifact@v4
        with:
          name: moderation-runtime-deployment-${{ inputs.source_sha }}
          path: artifacts/mapping-0/moderation-runtime-deployment/provenance.txt
          if-no-files-found: error
          retention-days: 14
