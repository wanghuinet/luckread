name: AUTH-002 Session Schema Evidence

on:
  workflow_dispatch:
    inputs:
      database_name:
        description: 'Controlled D1 database name used only for evidence capture'
        required: true
        type: string
      environment_class:
        description: 'Evidence environment; must be a controlled environment'
        required: true
        default: CONTROLLED_REMOTE_D1
        type: choice
        options:
          - CONTROLLED_REMOTE_D1
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/collections/Users.ts'
      - 'src/payload.config.ts'
      - 'src/migrations/**'
      - 'scripts/auth-session-schema-evidence-probe.mjs'
      - 'scripts/auth-session-schema-evidence-validate.mjs'
      - '.github/workflows/auth-session-schema-evidence.yml'
      - 'workers/W01-payload/wrangler.jsonc'
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/collections/Users.ts'
      - 'src/payload.config.ts'
      - 'src/migrations/**'
      - 'scripts/auth-session-schema-evidence-probe.mjs'
      - 'scripts/auth-session-schema-evidence-validate.mjs'
      - '.github/workflows/auth-session-schema-evidence.yml'
      - 'workers/W01-payload/wrangler.jsonc'

permissions:
  contents: read

env:
  WRANGLER_VERSION: 4.33.1
  W01_WRANGLER_CONFIG: workers/W01-payload/wrangler.jsonc

jobs:
  schema-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Gate-1 capture preconditions
        run: node scripts/auth-session-schema-evidence-probe.mjs --gate1

      - name: Require controlled remote evidence target
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          EVIDENCE_ENVIRONMENT: ${{ inputs.environment_class }}
          DATABASE_NAME: ${{ inputs.database_name }}
        run: |
          set -euo pipefail
          test "$EVIDENCE_ENVIRONMENT" = "CONTROLLED_REMOTE_D1"
          test -n "$DATABASE_NAME"
          printf '%s' "$DATABASE_NAME" | grep -Eq '^[A-Za-z0-9_-]{1,64}$'

      - name: Capture remote D1 migration evidence
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_NAME: ${{ inputs.database_name }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/evidence/auth-002
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -f "$W01_WRANGLER_CONFIG"

          set +e
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 migrations list "$DATABASE_NAME" --remote --config "$W01_WRANGLER_CONFIG" > artifacts/evidence/auth-002/migration-status.txt 2>&1
          migration_exit=$?
          set -e

          MIGRATION_EXIT_CODE="$migration_exit" DATABASE_NAME="$DATABASE_NAME" WRANGLER_VERSION="$WRANGLER_VERSION" node -e '
            const fs = require("node:fs");
            const output = fs.readFileSync("artifacts/evidence/auth-002/migration-status.txt", "utf8");
            fs.writeFileSync(
              "artifacts/evidence/auth-002/migration-status.json",
              JSON.stringify({
                databaseName: process.env.DATABASE_NAME,
                command: `wrangler@${process.env.WRANGLER_VERSION} d1 migrations list <database> --remote --config workers/W01-payload/wrangler.jsonc`,
                exitCode: Number(process.env.MIGRATION_EXIT_CODE),
                output
              }, null, 2) + "\n"
            );
          '
          rm -f artifacts/evidence/auth-002/migration-status.txt
          test "$migration_exit" -eq 0

      - name: Capture remote D1 catalog evidence
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_NAME: ${{ inputs.database_name }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/evidence/auth-002
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -f "$W01_WRANGLER_CONFIG"

          npx --yes "wrangler@${WRANGLER_VERSION}" d1 info "$DATABASE_NAME" --json --config "$W01_WRANGLER_CONFIG" > artifacts/evidence/auth-002/d1-info.json
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "$DATABASE_NAME" --remote --json --config "$W01_WRANGLER_CONFIG" \
            --command 'SELECT type,name,tbl_name,sql FROM sqlite_schema WHERE type IN ("table","index","trigger") ORDER BY type,name;' \
            > artifacts/evidence/auth-002/catalog.json
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "$DATABASE_NAME" --remote --json --config "$W01_WRANGLER_CONFIG" \
            --command 'PRAGMA table_info("users");' \
            > artifacts/evidence/auth-002/users-schema.json
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "$DATABASE_NAME" --remote --json --config "$W01_WRANGLER_CONFIG" \
            --command 'PRAGMA index_list("users");' \
            > artifacts/evidence/auth-002/users-indexes.json
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "$DATABASE_NAME" --remote --json --config "$W01_WRANGLER_CONFIG" \
            --command 'PRAGMA foreign_key_list("users");' \
            > artifacts/evidence/auth-002/users-foreign-keys.json
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "$DATABASE_NAME" --remote --json --config "$W01_WRANGLER_CONFIG" \
            --command 'PRAGMA table_info("auth_session_state");' \
            > artifacts/evidence/auth-002/auth-session-state-schema.json
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "$DATABASE_NAME" --remote --json --config "$W01_WRANGLER_CONFIG" \
            --command 'PRAGMA index_list("auth_session_state");' \
            > artifacts/evidence/auth-002/auth-session-state-indexes.json
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "$DATABASE_NAME" --remote --json --config "$W01_WRANGLER_CONFIG" \
            --command 'PRAGMA foreign_key_list("auth_session_state");' \
            > artifacts/evidence/auth-002/auth-session-state-foreign-keys.json

      - name: Build reproducible evidence provenance
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DATABASE_NAME: ${{ inputs.database_name }}
          EVIDENCE_ENVIRONMENT: ${{ inputs.environment_class }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const provenance = {
            repository: process.env.GITHUB_REPOSITORY,
            workflow: process.env.GITHUB_WORKFLOW,
            workflowRef: process.env.GITHUB_WORKFLOW_REF,
            workflowSha: process.env.GITHUB_SHA,
            runId: Number(process.env.GITHUB_RUN_ID),
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            eventName: process.env.GITHUB_EVENT_NAME,
            databaseName: process.env.DATABASE_NAME,
            environmentClass: process.env.EVIDENCE_ENVIRONMENT,
          };
          fs.mkdirSync('artifacts/evidence/auth-002', { recursive: true });
          fs.writeFileSync('artifacts/evidence/auth-002/provenance.json', `${JSON.stringify(provenance, null, 2)}\n`);
          NODE

      - name: Build reproducible evidence manifest
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DATABASE_NAME: ${{ inputs.database_name }}
          EVIDENCE_ENVIRONMENT: ${{ inputs.environment_class }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const { execFileSync } = require('node:child_process');

          const dir = 'artifacts/evidence/auth-002';
          const evidenceFiles = [
            'd1-info.json',
            'migration-status.json',
            'catalog.json',
            'users-schema.json',
            'users-indexes.json',
            'users-foreign-keys.json',
            'auth-session-state-schema.json',
            'auth-session-state-indexes.json',
            'auth-session-state-foreign-keys.json',
            'provenance.json',
          ];
          const sha256 = (file) => crypto.createHash('sha256').update(fs.readFileSync(`${dir}/${file}`)).digest('hex');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const provenance = JSON.parse(fs.readFileSync(`${dir}/provenance.json`, 'utf8'));
          const manifest = {
            testedCommitSha: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            environmentClass: process.env.EVIDENCE_ENVIRONMENT,
            databaseName: process.env.DATABASE_NAME,
            payloadVersion: pkg.dependencies?.payload ?? null,
            payloadLockedVersion: lock.packages?.['node_modules/payload']?.version ?? null,
            d1AdapterVersion: pkg.dependencies?.['@payloadcms/db-d1-sqlite'] ?? null,
            d1AdapterLockedVersion: lock.packages?.['node_modules/@payloadcms/db-d1-sqlite']?.version ?? null,
            nodeVersion: process.version,
            wranglerVersion: process.env.WRANGLER_VERSION,
            executedAt: new Date().toISOString(),
            provenance,
            evidenceFiles: Object.fromEntries(evidenceFiles.map((file) => [file, sha256(file)])),
          };
          if (manifest.testedCommitSha !== process.env.GITHUB_SHA) throw new Error('GitHub SHA mismatch');
          if (provenance.workflowSha !== process.env.GITHUB_SHA) throw new Error('provenance workflow SHA mismatch');
          if (manifest.payloadVersion !== '3.87.1' || manifest.payloadLockedVersion !== '3.87.1') throw new Error('Payload dependency lock mismatch');
          if (manifest.d1AdapterVersion !== '3.87.1' || manifest.d1AdapterLockedVersion !== '3.87.1') throw new Error('D1 adapter dependency lock mismatch');
          fs.writeFileSync(`${dir}/manifest.json`, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Validate evidence package
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/auth-session-schema-evidence-validate.mjs

      - name: Upload schema evidence artifacts
        if: ${{ github.event_name == 'workflow_dispatch' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: auth-002-schema-evidence-${{ github.run_id }}
          path: artifacts/evidence/auth-002/
          if-no-files-found: error
          retention-days: 14
