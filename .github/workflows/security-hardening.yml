name: Security Hardening Gate

on:
  push:
    branches: [main]
    paths:
      - 'contracts/authz/**'
      - 'docs/19-P0-SECURITY-HARDENING-CONTRACT-v1.0.md'
      - 'scripts/security-hardening-check.mjs'
      - 'src/**'
      - 'app/**'
      - 'server/**'
      - 'workers/**'
      - 'packages/**'
      - 'collections/**'
      - 'payload/**'
      - 'lib/**'
      - 'routes/**'
  pull_request:
    paths:
      - 'contracts/authz/**'
      - 'docs/19-P0-SECURITY-HARDENING-CONTRACT-v1.0.md'
      - 'scripts/security-hardening-check.mjs'
      - 'src/**'
      - 'app/**'
      - 'server/**'
      - 'workers/**'
      - 'packages/**'
      - 'collections/**'
      - 'payload/**'
      - 'lib/**'
      - 'routes/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-hardening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify authorization decision source before gate
        run: |
          pwd
          git rev-parse HEAD
          node -e "const fs=require('node:fs'); const p='contracts/authz/authorization-decision.json'; const d=JSON.parse(fs.readFileSync(p,'utf8')); console.log('AUTHZ_DECISION_PATH='+require('node:path').resolve(p)); console.log('AUTHZ_CHECK_KEYS='+Object.keys(d.checks||{}).join(',')); console.log('AUTHZ_HAS_CHECKS='+String(Boolean(d.checks)));"
      - name: Security hardening static gate
        run: node scripts/security-hardening-check.mjs
