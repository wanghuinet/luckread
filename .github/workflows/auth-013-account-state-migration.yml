name: AUTH-013 Account State D1-01 Migration

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit containing the admitted AUTH-013 migration
        required: true
        type: string
      database_name:
        description: Current Cloudflare display name for the D1-01 UUID bound in W02 wrangler.jsonc
        required: true
        type: string
      confirm:
        description: Type APPLY to permit remote D1 mutation
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    if: ${{ inputs.confirm == 'APPLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact migration source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify W02 D1-01 binding
        working-directory: workers/W02-content
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const c = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const d = c.d1_databases?.find((x) => x.binding === 'D1_01');
          if (!d) throw new Error('D1_01 binding missing');
          if (d.database_name !== process.env.EXPECTED_DB_NAME) throw new Error('database_name input does not match W02 D1_01 binding');
          if (d.database_id !== process.env.EXPECTED_DB_ID) throw new Error('W02 D1_01 binding does not match controlled target UUID');
          console.log(JSON.stringify(d, null, 2));
          NODE
        env:
          EXPECTED_DB_NAME: ${{ inputs.database_name }}
          EXPECTED_DB_ID: 2f80471e-3756-49f9-8db1-7707a433ad64

      - name: Verify migration source
        run: |
          test -f workers/W02-content/migrations/0002_auth_013_account_state.sql
          test -z "$(git status --short)"

      - name: Preflight controlled target
        working-directory: workers/W02-content
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts/mapping-0/auth-013-migration"
          npx --yes wrangler@4.116.0 d1 execute "${{ inputs.database_name }}" --remote --json --config wrangler.jsonc --command 'SELECT COUNT(*) AS users_count FROM users;'  > "$GITHUB_WORKSPACE/artifacts/mapping-0/auth-013-migration/preflight-users-count.json"
          npx --yes wrangler@4.116.0 d1 execute "${{ inputs.database_name }}" --remote --json --config wrangler.jsonc --command 'PRAGMA table_info("users");'  > "$GITHUB_WORKSPACE/artifacts/mapping-0/auth-013-migration/preflight-users-schema.json"
          node - <<'NODE'
          const fs = require('node:fs');
          const count = JSON.parse(fs.readFileSync(process.env.GITHUB_WORKSPACE + '/artifacts/mapping-0/auth-013-migration/preflight-users-count.json', 'utf8'));
          const schema = JSON.parse(fs.readFileSync(process.env.GITHUB_WORKSPACE + '/artifacts/mapping-0/auth-013-migration/preflight-users-schema.json', 'utf8'));
          const usersCount = count?.[0]?.results?.[0]?.users_count;
          const columns = schema?.[0]?.results ?? [];
          if (usersCount !== 0) throw new Error('AUTH-013 fail-closed: non-empty target requires separate backfill admission');
          const forbidden = columns.filter((r) => ['account_state', 'account_state_version'].includes(r.name));
          if (forbidden.length) throw new Error('AUTH-013 target columns already exist; stop rather than applying a duplicate migration');
          console.log(JSON.stringify({ usersCount, targetColumnsPresent: false }));
          NODE

      - name: Apply AUTH-013 migration remotely
        working-directory: workers/W02-content
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.116.0 d1 migrations apply "${{ inputs.database_name }}" --remote --config wrangler.jsonc

      - name: Capture post-migration schema
        working-directory: workers/W02-content
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.116.0 d1 execute "${{ inputs.database_name }}" --remote --json --config wrangler.jsonc --command 'PRAGMA table_info("users");'  > "$GITHUB_WORKSPACE/artifacts/mapping-0/auth-013-migration/post-users-schema.json"
          npx --yes wrangler@4.116.0 d1 execute "${{ inputs.database_name }}" --remote --json --config wrangler.jsonc --command 'SELECT COUNT(*) AS users_count FROM users;'  > "$GITHUB_WORKSPACE/artifacts/mapping-0/auth-013-migration/post-users-count.json"
          npx --yes wrangler@4.116.0 d1 execute "${{ inputs.database_name }}" --remote --json --config wrangler.jsonc --command 'SELECT * FROM d1_migrations ORDER BY id;'  > "$GITHUB_WORKSPACE/artifacts/mapping-0/auth-013-migration/d1-migrations.json"
          node - <<'NODE'
          const fs = require('node:fs');
          const schema = JSON.parse(fs.readFileSync(process.env.GITHUB_WORKSPACE + '/artifacts/mapping-0/auth-013-migration/post-users-schema.json', 'utf8'));
          const count = JSON.parse(fs.readFileSync(process.env.GITHUB_WORKSPACE + '/artifacts/mapping-0/auth-013-migration/post-users-count.json', 'utf8'));
          const rows = schema?.[0]?.results ?? [];
          const usersCount = count?.[0]?.results?.[0]?.users_count;
          const state = rows.find((r) => r.name === 'account_state');
          const version = rows.find((r) => r.name === 'account_state_version');
          if (!state || state.notnull !== 1 || state.type !== 'TEXT' || state.dflt_value !== "'PENDING_VERIFICATION'") throw new Error('AUTH-013 post-schema account_state verification failed');
          if (!version || version.notnull !== 1 || version.type !== 'INTEGER' || version.dflt_value !== '1') throw new Error('AUTH-013 post-schema account_state_version verification failed');
          if (usersCount !== 0) throw new Error('Unexpected users_count after zero-row migration');
          console.log(JSON.stringify({ AUTH_013_MIGRATION: 'PASS', usersCount, accountState: state, accountStateVersion: version }));
          NODE

      - name: Capture migration provenance
        run: |
          cat > "$GITHUB_WORKSPACE/artifacts/mapping-0/auth-013-migration/provenance.txt" <<'EOF'
          workflow=AUTH-013 Account State D1-01 Migration
          source_sha=${{ inputs.source_sha }}
          database_name=${{ inputs.database_name }}
          database_id=2f80471e-3756-49f9-8db1-7707a433ad64
          migration=0002_auth_013_account_state.sql
          remote_mutation=true
          preflight_users_count=0
          scope=CONTROLLED_REMOTE_D1_ZERO_ROW_TARGET_ONLY
          EOF

      - name: Upload controlled migration evidence
        uses: actions/upload-artifact@v4
        with:
          name: auth-013-account-state-migration-${{ github.run_id }}
          path: ${{ github.workspace }}/artifacts/mapping-0/auth-013-migration/
          if-no-files-found: error
          retention-days: 14
