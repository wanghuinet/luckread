name: Dependency Lock Bootstrap

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/dependency-lock-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-lock-bootstrap-main
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Generate deterministic npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify lockfile
        run: test -s package-lock.json

      - name: Commit lockfile when required
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: bootstrap npm lockfile"
          git push origin main
