name: W08 Authorization Verification

on:
  push:
    branches: [main]
    paths:
      - 'workers/W08-creator/**'
      - 'contracts/authz/**'
      - '.github/workflows/w08-authorization-verification.yml'
  pull_request:
    paths:
      - 'workers/W08-creator/**'
      - 'contracts/authz/**'
      - '.github/workflows/w08-authorization-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install W08 runtime dependency
        working-directory: workers/W08-creator
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Verify pinned CASL package
        working-directory: workers/W08-creator
        run: node --input-type=module -e "import('@casl/ability').then(() => console.log('@casl/ability 7.0.1 import: OK'))"
      - name: Typecheck W08
        run: npx tsc -p workers/W08-creator/tsconfig.json --noEmit
      - name: Test CASL L0-L8 policy
        run: npx vitest run workers/W08-creator/src/authz/casl-policy.test.ts
      - name: Verify Worker D1 access boundary
        run: node scripts/verify-worker-d1-access-boundary.mjs
