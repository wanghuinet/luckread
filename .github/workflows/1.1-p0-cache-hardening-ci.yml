name: 1.1 P0 Cache Hardening CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'workers/W01-payload/src/lib/public-response-cache.ts'
      - 'workers/W01-payload/src/lib/public-response-cache.test.ts'
      - 'workers/W01-payload/src/lib/content-list-cache-guard.ts'
      - 'workers/W01-payload/src/lib/content-list-cache-guard.test.ts'
      - 'workers/W01-payload/src/app/api/v1/contents/**'
      - 'workers/W01-payload/src/app/api/v1/comments/**'
      - 'workers/W01-payload/src/social/w05-social-client.ts'
      - 'workers/W01-payload/src/app/api/v1/media/[mediaId]/route.ts'
      - 'contracts/resource-budget/1.0-d1-traffic-guard.v1.json'
      - '.github/workflows/1.1-p0-cache-hardening-ci.yml'
  push:
    branches: [main]
    paths:
      - 'workers/W01-payload/src/lib/public-response-cache.ts'
      - 'workers/W01-payload/src/lib/public-response-cache.test.ts'
      - 'workers/W01-payload/src/lib/content-list-cache-guard.ts'
      - 'workers/W01-payload/src/lib/content-list-cache-guard.test.ts'
      - 'workers/W01-payload/src/app/api/v1/contents/**'
      - 'workers/W01-payload/src/app/api/v1/comments/**'
      - 'workers/W01-payload/src/social/w05-social-client.ts'
      - 'workers/W01-payload/src/app/api/v1/media/[mediaId]/route.ts'
      - 'contracts/resource-budget/1.0-d1-traffic-guard.v1.json'
      - '.github/workflows/1.1-p0-cache-hardening-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.0
          run_install: false
      - name: Install W01 dependencies
        working-directory: workers/W01-payload
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Cache hardening unit tests
        working-directory: workers/W01-payload
        run: pnpm exec vitest run --config ./vitest.cache.config.mts
      - name: W01 typecheck
        working-directory: workers/W01-payload
        run: pnpm exec tsc --noEmit
      - name: Static boundary assertions
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          route = Path('workers/W01-payload/src/app/api/v1/contents/route.ts').read_text()
          cache = Path('workers/W01-payload/src/lib/public-response-cache.ts').read_text()
          detail = Path('workers/W01-payload/src/app/api/v1/contents/[contentId]/route.ts').read_text()
          media = Path('workers/W01-payload/src/app/api/v1/media/[mediaId]/route.ts').read_text()
          state = Path('workers/W01-payload/src/app/api/v1/contents/[contentId]/state/route.ts').read_text()
          guard = Path('workers/W01-payload/src/lib/content-list-cache-guard.ts').read_text()
          budget = __import__('json').loads(Path('contracts/resource-budget/1.0-d1-traffic-guard.v1.json').read_text())

          assert route.index('validateContentListQuery(url)') < route.index('return await cachedPublicGet')
          assert route.index('if (hasAuthenticatedSessionCredential(request))') < route.index('return await cachedPublicGet')
          assert 'resolveCookieContentPrincipal' in route
          assert 'invalidatePublicContentList' in route
          assert 'invalidatePublicContentList' in detail
          assert 'invalidatePublicContentList' in state
          assert 'invalidatePublicContentComments' in state
          assert 'invalidatePublicContentComments' in detail
          assert 'invalidatePublicContentComments' in cache
          comments_route = Path('workers/W01-payload/src/app/api/v1/contents/[contentId]/comments/route.ts').read_text()
          comment_item_route = Path('workers/W01-payload/src/app/api/v1/comments/[commentId]/route.ts').read_text()
          assert 'invalidatePublicContentComments' in comments_route
          assert 'invalidatePublicContentComments' in comment_item_route
          assert 'X-LuckRead-Content-Id' in comment_item_route
          assert 'X-LuckRead-Content-Id' in Path('workers/W01-payload/src/social/w05-social-client.ts').read_text()
          assert 'MAX_QUERY_LENGTH = 4096' in guard
          assert 'MAX_CURSOR_LENGTH = 2048' in guard
          assert '^[A-Za-z0-9_-]+$' in guard
          assert 'payload-token' in guard
          assert 'values.length > 1' in guard
          assert "content-list': ['creatorId', 'cursor', 'limit', 'type']" in cache
          assert 's-maxage=' in cache
          assert 'CACHE_MISS_LIMIT_PER_KEY = 5' in cache
          assert 'CACHE_MISS_MAX_KEYS = 1024' in cache
          assert budget['invariants']['cacheMissOriginFusePerKeyPerMinute'] == 5
          assert budget['invariants']['negativeCacheMaxTtlSeconds'] == 10
          assert "      30," in route
          assert "cache-control': 'private, no-store'" in media
          assert 'cachedPublicGet(' not in media

          cache_boundary_routes = [
            Path('workers/W01-payload/src/app/api/v1/contents/route.ts'),
            Path('workers/W01-payload/src/app/api/v1/contents/[contentId]/route.ts'),
            Path('workers/W01-payload/src/app/api/v1/contents/[contentId]/comments/route.ts'),
            Path('workers/W01-payload/src/app/api/v1/shares/[shareId]/route.ts'),
            Path('workers/W01-payload/src/app/api/v1/users/[userId]/followers/route.ts'),
            Path('workers/W01-payload/src/app/api/v1/users/[userId]/following/route.ts'),
            Path('workers/W01-payload/src/app/api/v1/users/[userId]/route.ts'),
            Path('workers/W01-payload/src/app/api/v1/users/by-username/[username]/route.ts'),
          ]
          for cache_route in cache_boundary_routes:
            source = cache_route.read_text()
            assert 'enforcePublicReadRateLimit' in source, f'{cache_route} missing public-read edge rate limit'
          for cache_route in [
            cache_boundary_routes[1],
            cache_boundary_routes[2],
            cache_boundary_routes[3],
            cache_boundary_routes[4],
            cache_boundary_routes[5],
          ]:
            assert 'hasAuthenticatedSessionCredential' in cache_route.read_text(), f'{cache_route} missing authenticated cache bypass'
          print('1.1_P0_CACHE_BOUNDARY_STATIC=PASS')
          PY
