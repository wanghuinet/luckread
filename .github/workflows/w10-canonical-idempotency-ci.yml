name: W10 Canonical Idempotency CI

on:
  pull_request:
    paths:
      - 'workers/W10-async/src/canonical-json-idempotency.ts'
      - 'workers/W10-async/src/canonical-json-idempotency.test.ts'
      - '.github/workflows/w10-canonical-idempotency-ci.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'workers/W10-async/src/canonical-json-idempotency.ts'
      - 'workers/W10-async/src/canonical-json-idempotency.test.ts'
      - '.github/workflows/w10-canonical-idempotency-ci.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  canonical-idempotency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --fund=false
      - name: Test W10 canonical JSON hashing
        run: npx vitest run workers/W10-async/src/canonical-json-idempotency.test.ts
      - name: Typecheck W10 canonical JSON hashing
        run: >-
          npx tsc --noEmit --strict --skipLibCheck
          --target ES2022 --module ESNext --moduleResolution Bundler
          --lib ES2022,DOM --types @cloudflare/workers-types,node
          workers/W10-async/src/canonical-json-idempotency.ts
          workers/W10-async/src/canonical-json-idempotency.test.ts
