name: AUTH-001 Native Hash Capture Probe
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/auth-001-native-hash-capture.yml"
      - "workers/luck02-content/scripts/auth-001-native-hash-capture-probe.mjs"
      - "workers/luck02-content/src/collections/Users.ts"
      - "workers/luck02-content/src/payload.config.ts"
      - "workers/luck02-content/package.json"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false
      - name: Install W01 dependencies
        working-directory: workers/luck02-content
        run: pnpm install --frozen-lockfile
      - name: Run Payload native hash capture probe
        working-directory: workers/luck02-content
        env:
          NODE_ENV: development
          PAYLOAD_SECRET: ignore
        run: node --import=tsx/esm scripts/auth-001-native-hash-capture-probe.mjs
