name: API Inventory Reconciliation

on:
  push:
    branches: [main]
    paths:
      - 'contracts/api/**'
      - 'contracts/openapi/**'
      - 'contracts/alignment/feature-inventory.v1.json'
      - 'contracts/alignment/api-inventory.v1.json'
      - 'contracts/alignment/code-evidence-inventory.v1.json'
      - 'contracts/capability/reconciliation-batches/V-governance-appeals.v1.json'
      - 'scripts/build-feature-inventory.mjs'
      - 'scripts/build-api-alignment-inventory.mjs'
      - 'scripts/verify-governance-feature-id-alignment.mjs'
      - 'scripts/verify-governance-feature-id-alignment.test.mjs'
      - 'scripts/api-inventory-reconciliation-check.mjs'
      - 'scripts/api-inventory-reconciliation-stage-test.mjs'
      - 'scripts/api-inventory-report-schema-check.mjs'
      - '.github/workflows/api-inventory-reconciliation.yml'
  pull_request:
    paths:
      - 'contracts/api/**'
      - 'contracts/openapi/**'
      - 'contracts/alignment/feature-inventory.v1.json'
      - 'contracts/alignment/api-inventory.v1.json'
      - 'contracts/alignment/code-evidence-inventory.v1.json'
      - 'contracts/capability/reconciliation-batches/V-governance-appeals.v1.json'
      - 'scripts/build-feature-inventory.mjs'
      - 'scripts/build-api-alignment-inventory.mjs'
      - 'scripts/verify-governance-feature-id-alignment.mjs'
      - 'scripts/verify-governance-feature-id-alignment.test.mjs'
      - 'scripts/api-inventory-reconciliation-check.mjs'
      - 'scripts/api-inventory-reconciliation-stage-test.mjs'
      - 'scripts/api-inventory-report-schema-check.mjs'
      - '.github/workflows/api-inventory-reconciliation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    name: Reconcile API inventory and policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify contract and production evidence stages stay separate
        run: node scripts/api-inventory-reconciliation-stage-test.mjs

      - name: Rebuild and verify canonical governance Feature ID mappings
        run: |
          node scripts/build-feature-inventory.mjs
          node scripts/build-api-alignment-inventory.mjs
          node scripts/verify-governance-feature-id-alignment.mjs
          node --test scripts/verify-governance-feature-id-alignment.test.mjs
          git diff --exit-code -- contracts/alignment/feature-inventory.v1.json contracts/alignment/api-inventory.v1.json

      - name: Run reconciliation
        id: reconciliation
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Production readiness is an explicit, strict operator-invoked gate.
            node scripts/api-inventory-reconciliation-check.mjs --stage=production
          else
            # PR and main push keep integration CI green while preserving every
            # production evidence finding in the report. This does not grant
            # production readiness or alter missing evidence to PASS/N/A.
            node scripts/api-inventory-reconciliation-check.mjs --stage=contract
          fi

      - name: Validate reconciliation report
        if: always()
        run: node scripts/api-inventory-report-schema-check.mjs

      - name: Upload reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-inventory-reconciliation-evidence
          path: artifacts/api-inventory/reconciliation-report.json
          if-no-files-found: error
