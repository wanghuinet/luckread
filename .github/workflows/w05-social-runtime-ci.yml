name: W05 Social Runtime CI

on:
  pull_request:
    paths:
      - 'workers/W05-social/**'
      - 'workers/W01-payload/src/app/api/v1/users/[userId]/followers/**'
      - 'workers/W01-payload/src/app/api/v1/users/[userId]/following/**'
      - 'workers/W01-payload/src/social/**'
      - 'workers/W01-payload/tests/int/social-followers-v1-adapter.int.spec.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'workers/W01-payload/src/app/api/v1/interactions/likes/**'
      - 'workers/W01-payload/src/app/(frontend)/content/[contentId]/page.tsx'
      - 'workers/W01-payload/tests/int/content-detail.int.spec.ts'
      - '.github/workflows/w05-social-runtime-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'workers/W05-social/**'
      - 'workers/W01-payload/src/app/api/v1/users/[userId]/followers/**'
      - 'workers/W01-payload/src/app/api/v1/users/[userId]/following/**'
      - 'workers/W01-payload/src/social/**'
      - 'workers/W01-payload/tests/int/social-followers-v1-adapter.int.spec.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'workers/W01-payload/src/app/api/v1/interactions/likes/**'
      - 'workers/W01-payload/src/app/(frontend)/content/[contentId]/page.tsx'
      - 'workers/W01-payload/tests/int/content-detail.int.spec.ts'
      - '.github/workflows/w05-social-runtime-ci.yml'

permissions:
  contents: read

jobs:
  social-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install W01 test dependencies from committed lockfile
        working-directory: workers/W01-payload
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run W05 Social and W01 adapter tests
        working-directory: workers/W01-payload
        run: pnpm exec vitest run --config ./vitest.config.mts ../../workers/W05-social/src/follow-runtime.test.ts ../../workers/W05-social/src/like-runtime.test.ts ../../workers/W05-social/src/index.test.ts tests/int/social-followers-v1-adapter.int.spec.ts tests/int/social-likes-v1-adapter.int.spec.ts tests/int/content-detail.int.spec.ts

      - name: Verify like migration shape
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(':memory:')
          sql = Path('workers/W05-social/migrations/20261002_002_social_003_like_v1.sql').read_text()
          db.executescript(sql)
          cols = db.execute('PRAGMA table_info("interaction_likes")').fetchall()
          if [r[1] for r in cols] != ['relationship_id','actor_user_id','target_type','target_id','created_at']:
              raise SystemExit('unexpected like schema')
          indexes = {r[1]: r[2] for r in db.execute('PRAGMA index_list("interaction_likes")').fetchall()}
          if indexes.get('uq_interaction_like_actor_target') != 1:
              raise SystemExit('like uniqueness boundary missing')
          print('SOCIAL_003_LIKE_MIGRATION_STATIC=PASS')
          PY
