  push:
    branches:
      - main
    paths:
      - 'workers/W05-social/**'
      - 'workers/W01-payload/src/app/api/v1/content/[contentId]/reposts/**'
      - 'workers/W01-payload/src/app/api/v1/content/[contentId]/pin/**'
      - 'workers/W01-payload/src/app/api/v1/users/[userId]/pinned-content/**'
      - 'workers/W01-payload/src/app/(frontend)/components/reuse/LuckReadSocialPostCard.tsx'
      - 'workers/W01-payload/src/app/(frontend)/users/[userId]/UserProfilePage.tsx'
      - 'workers/W01-payload/src/app/(twitter-clone)/users/[userId]/page.tsx'
      - 'workers/W01-payload/tests/int/social-reposts-v1-adapter.int.spec.ts'
      - 'workers/W01-payload/tests/int/social-profile-pins-v1-adapter.int.spec.ts'
      - 'workers/W01-payload/src/app/api/v1/users/[userId]/followers/**'
      - 'workers/W01-payload/src/app/api/v1/users/[userId]/following/**'
      - 'workers/W01-payload/src/app/api/v1/social/follows/**'
      - 'workers/W01-payload/src/social/**'
      - 'workers/W01-payload/tests/int/social-followers-v1-adapter.int.spec.ts'
      - 'workers/W01-payload/tests/int/social-follow-mutation-v1-adapter.int.spec.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'workers/W01-payload/src/app/api/v1/interactions/likes/**'
      - 'workers/W01-payload/src/app/api/v1/interactions/bookmarks/**'
      - 'workers/W01-payload/src/app/api/v1/content/**/shares/**'
      - 'workers/W01-payload/src/app/api/v1/shares/**'
      - 'workers/W01-payload/src/app/(frontend)/content/[contentId]/page.tsx'
      - 'workers/W01-payload/src/app/(twitter-clone)/content/[contentId]/page.tsx'
      - 'workers/W01-payload/tests/int/content-detail.int.spec.ts'
      - 'workers/W01-payload/tests/int/social-bookmarks-v1-adapter.int.spec.ts'
      - 'workers/W01-payload/tests/int/social-shares-v1-adapter.int.spec.ts'
      - 'workers/W01-payload/tests/int/social-shares-landing.int.spec.ts'
      - 'workers/W01-payload/src/app/api/v1/interactions/blocks/**'
      - 'workers/W01-payload/src/app/api/v1/interactions/mutes/**'
      - 'workers/W01-payload/src/app/(frontend)/users/[userId]/UserProfilePage.tsx'
      - 'workers/W01-payload/src/app/(twitter-clone)/users/[userId]/page.tsx'
      - 'workers/W01-payload/src/app/(frontend)/styles.css'
      - 'workers/W01-payload/tests/int/public-user-profile.int.spec.ts'
      - 'workers/W01-payload/tests/int/social-block-mute-v1-adapter.int.spec.ts'
      - '.github/workflows/w05-social-runtime-ci.yml'

permissions:
  contents: read

jobs:
  social-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install W01 test dependencies from committed lockfile
        working-directory: workers/W01-payload
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run W05 Social and W01 adapter tests
        working-directory: workers/W01-payload
        run: pnpm exec vitest run --config ./vitest.config.mts ../../workers/W05-social/src/follow-runtime.test.ts ../../workers/W05-social/src/following-feed.test.ts ../../workers/W05-social/src/like-runtime.test.ts ../../workers/W05-social/src/comment-runtime.test.ts ../../workers/W05-social/src/favorite-runtime.test.ts ../../workers/W05-social/src/share-runtime.test.ts ../../workers/W05-social/src/repost-runtime.test.ts ../../workers/W05-social/src/profile-pin-runtime.test.ts ../../workers/W05-social/src/block-policy.test.ts ../../workers/W05-social/src/relationship-graph-runtime.test.ts ../../workers/W05-social/src/block-mute-runtime.test.ts ../../workers/W05-social/src/index.test.ts ../../workers/W05-social/src/d1-traffic-guard.test.ts tests/int/social-followers-v1-adapter.int.spec.ts tests/int/social-follow-mutation-v1-adapter.int.spec.ts tests/int/social-likes-v1-adapter.int.spec.ts tests/int/social-comments-v1-adapter.int.spec.ts tests/int/social-reply-audience-v1-adapter.int.spec.ts tests/int/social-comment-likes-v1-adapter.int.spec.ts tests/int/social-bookmarks-v1-adapter.int.spec.ts tests/int/social-shares-v1-adapter.int.spec.ts tests/int/social-shares-landing.int.spec.ts tests/int/social-block-mute-v1-adapter.int.spec.ts tests/int/social-reposts-v1-adapter.int.spec.ts tests/int/social-profile-pins-v1-adapter.int.spec.ts tests/int/w05-social-response-forwarding.int.spec.ts tests/int/content-detail.int.spec.ts tests/int/content-detail-comments.int.spec.ts

      - name: Run W05 reply audience runtime and comment tests
        working-directory: workers/W01-payload
        run: pnpm exec vitest run --config ./vitest.w05-reply-audience.config.mts

      - name: Run W05 reply audience route tests
        working-directory: workers/W01-payload
        run: pnpm exec vitest run --config ./vitest.w05-reply-audience-route.config.mts --testNamePattern="sets and reads reply audience policy|rejects replies outside the configured audience"

      - name: Verify reply audience migration shape
        run: |
          python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(':memory:')
          migration = Path('workers/W05-social/migrations/20261019_015_social_reply_audience_v1.sql')
          db.executescript(migration.read_text())
          expected = ['content_id','owner_user_id','audience','mentioned_user_ids_json','created_at','updated_at']
          actual = [row[1] for row in db.execute('PRAGMA table_info("social_content_reply_policies")').fetchall()]
          if actual != expected:
              raise SystemExit(f'unexpected reply policy schema: {actual}')
          db.execute(
              'INSERT INTO social_content_reply_policies VALUES (?,?,?,?,?,?)',
              ('c1','u1','mentioned',json.dumps(['u2']),'now','now'),
          )
          invalid_rows = [
              ('c2','u1','anyone','[]','now','now'),
              ('c3','u1','mentioned',json.dumps({'user':'u2'}),'now','now'),
              ('c4','u1','mentioned',json.dumps([f'u{i}' for i in range(21)]),'now','now'),
          ]
          for row in invalid_rows:
              try:
                  db.execute('INSERT INTO social_content_reply_policies VALUES (?,?,?,?,?,?)', row)
              except sqlite3.IntegrityError:
                  continue
              raise SystemExit(f'reply policy constraint did not reject invalid row: {row[0]}')
          print('SOCIAL_015_REPLY_AUDIENCE_MIGRATION_STATIC=PASS')
          PY

      - name: Verify comment delete tombstone migration
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(':memory:')
          base = Path('workers/W05-social/migrations/20261002_003_social_004_comments_v1.sql').read_text()
          delete = Path('workers/W05-social/migrations/20261003_001_social_010_comment_delete_tombstone_v1.sql').read_text()
          db.executescript(base)
          db.executescript(delete)
          states = db.execute("SELECT sql FROM sqlite_master WHERE type='table' AND name='social_comments'").fetchone()[0]
          if 'AUTHOR_DELETED' not in states or 'DELETED' not in states:
              raise SystemExit('comment delete tombstone state boundary missing')
          print('SOCIAL_010_COMMENT_DELETE_TOMBSTONE_MIGRATION_STATIC=PASS')
          PY

      - name: Verify block mute migration shape
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(':memory:')
          sql = Path('workers/W05-social/migrations/20261002_006_social_009_block_mute_v1.sql').read_text()
          db.executescript(sql)
          cols = db.execute('PRAGMA table_info("social_user_interactions")').fetchall()
          expected = ['relationship_id','actor_user_id','target_user_id','relation_type','created_at','updated_at']
          if [r[1] for r in cols] != expected:
              raise SystemExit('unexpected block/mute schema')
          indexes = {r[1]: r[2] for r in db.execute('PRAGMA index_list("social_user_interactions")').fetchall()}
          if indexes.get('sqlite_autoindex_social_user_interactions_1') != 1:
              raise SystemExit('block/mute uniqueness boundary missing')
          print('SOCIAL_009_BLOCK_MUTE_MIGRATION_STATIC=PASS')
          PY


      - name: Verify share migration shape
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(':memory:')
          sql = Path('workers/W05-social/migrations/20261002_005_social_006_share_v1.sql').read_text()
          db.executescript(sql)
          cols = db.execute('PRAGMA table_info("social_share_links")').fetchall()
          if [r[1] for r in cols] != ['share_id','content_id','actor_user_id','idempotency_key','created_at']:
              raise SystemExit('unexpected share schema')
          indexes = {r[1]: r[2] for r in db.execute('PRAGMA index_list("social_share_links")').fetchall()}
          if indexes.get('sqlite_autoindex_social_share_links_1') != 1:
              raise SystemExit('share idempotency uniqueness boundary missing')
          print('SOCIAL_006_SHARE_MIGRATION_STATIC=PASS')
          PY


      - name: Verify repost and profile pin migration shape
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(':memory:')
          sql = Path('workers/W05-social/migrations/20261016_013_social_repost_pin_v1.sql').read_text()
          db.executescript(sql)
          repost_cols = [row[1] for row in db.execute('PRAGMA table_info("social_reposts")').fetchall()]
          if repost_cols != ['repost_id', 'content_id', 'actor_user_id', 'created_at']:
              raise SystemExit(f'unexpected repost schema: {repost_cols}')
          unique_actor_content = False
          for index in db.execute('PRAGMA index_list("social_reposts")').fetchall():
              if index[2] != 1:
                  continue
              columns = [row[2] for row in db.execute(f'PRAGMA index_info("{index[1]}")').fetchall()]
              if columns == ['actor_user_id', 'content_id']:
                  unique_actor_content = True
          if not unique_actor_content:
              raise SystemExit('repost actor/content uniqueness boundary missing')
          pin_cols = [row[1] for row in db.execute('PRAGMA table_info("social_profile_pins")').fetchall()]
          if pin_cols != ['user_id', 'content_id', 'pinned_at']:
              raise SystemExit(f'unexpected profile pin schema: {pin_cols}')
          user_key = next((row for row in db.execute('PRAGMA table_info("social_profile_pins")').fetchall() if row[1] == 'user_id'), None)
          if user_key is None or user_key[5] != 1:
              raise SystemExit('single-pin-per-profile primary key missing')
          print('SOCIAL_REPOST_PROFILE_PIN_MIGRATION_STATIC=PASS')
          PY

      - name: Verify favorite migration shape
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(':memory:')
          sql = Path('workers/W05-social/migrations/20261002_004_social_005_favorite_v1.sql').read_text()
          db.executescript(sql)
          cols = db.execute('PRAGMA table_info("interaction_favorites")').fetchall()
          if [r[1] for r in cols] != ['relationship_id','actor_user_id','target_type','target_id','created_at']:
              raise SystemExit('unexpected favorite schema')
          indexes = {r[1]: r[2] for r in db.execute('PRAGMA index_list("interaction_favorites")').fetchall()}
          if indexes.get('uq_interaction_favorite_actor_target') != 1:
              raise SystemExit('favorite uniqueness boundary missing')
          print('SOCIAL_005_FAVORITE_MIGRATION_STATIC=PASS')
          PY


      - name: Verify like migration shape
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(':memory:')
          sql = Path('workers/W05-social/migrations/20261002_002_social_003_like_v1.sql').read_text()
          db.executescript(sql)
          cols = db.execute('PRAGMA table_info("interaction_likes")').fetchall()
          if [r[1] for r in cols] != ['relationship_id','actor_user_id','target_type','target_id','created_at']:
              raise SystemExit('unexpected like schema')
          indexes = {r[1]: r[2] for r in db.execute('PRAGMA index_list("interaction_likes")').fetchall()}
          if indexes.get('uq_interaction_like_actor_target') != 1:
              raise SystemExit('like uniqueness boundary missing')
          print('SOCIAL_003_LIKE_MIGRATION_STATIC=PASS')
          PY


      - name: Verify comment migration shape
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(':memory:')
          sql = Path('workers/W05-social/migrations/20261002_003_social_004_comments_v1.sql').read_text()
          db.executescript(sql)
          cols = db.execute('PRAGMA table_info("social_comments")').fetchall()
          expected = ['id','content_id','author_user_id','parent_id','body','state','depth','idempotency_key','created_at','updated_at']
          if [r[1] for r in cols] != expected:
              raise SystemExit('unexpected comment schema')
          indexes = {r[1]: r[2] for r in db.execute('PRAGMA index_list("social_comments")').fetchall()}
          if indexes.get('sqlite_autoindex_social_comments_1') != 1:
              raise SystemExit('comment idempotency uniqueness boundary missing')
          print('SOCIAL_004_COMMENT_MIGRATION_STATIC=PASS')
          PY

      - name: Verify poll migration shape
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(':memory:')
          sql = Path('workers/W05-social/migrations/20261017_014_social_polls_v1.sql').read_text()
          db.executescript(sql)
          expected = {
              'social_polls': ['poll_id','content_id','owner_user_id','duration_hours','ends_at','created_at','updated_at'],
              'social_poll_options': ['option_id','poll_id','option_text','position'],
              'social_poll_votes': ['vote_id','poll_id','option_id','user_id','created_at'],
          }
          for table, columns in expected.items():
              actual = [row[1] for row in db.execute(f'PRAGMA table_info("{table}")').fetchall()]
              if actual != columns:
                  raise SystemExit(f'unexpected {table} schema: {actual}')
          db.execute("INSERT INTO social_polls VALUES ('p1','c1','u1',24,NULL,'now','now')")
          db.execute("INSERT INTO social_poll_options VALUES ('o1','p1','Yes',0)")
          db.execute("INSERT INTO social_poll_options VALUES ('o2','p1','No',1)")
          db.execute("INSERT INTO social_poll_votes VALUES ('v1','p1','o1','u2','now')")
          try:
              db.execute("INSERT INTO social_poll_votes VALUES ('v2','p1','o2','u2','now')")
          except sqlite3.IntegrityError:
              pass
          else:
              raise SystemExit('one-vote-per-user uniqueness boundary missing')
          try:
              db.execute("INSERT INTO social_polls VALUES ('p2','c1','u1',24,NULL,'now','now')")
          except sqlite3.IntegrityError:
              pass
          else:
              raise SystemExit('one-poll-per-content uniqueness boundary missing')
          print('SOCIAL_008_POLL_MIGRATION_STATIC=PASS')
          PY

      - name: Verify unified social closure migration shape
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(':memory:')
          base = Path('workers/W05-social/migrations/20261002_002_social_003_like_v1.sql').read_text()
          comment_likes = Path('workers/W05-social/migrations/20261002_005_social_005_comment_likes_v1.sql').read_text()
          closure = Path('workers/W05-social/migrations/20261008_011_social_closure_v1.sql').read_text()
          db.executescript(base)
          db.executescript(comment_likes)
          db.executescript(closure)
          like_sql = db.execute("SELECT sql FROM sqlite_master WHERE type='table' AND name='interaction_likes'").fetchone()[0]
          if "target_type" not in like_sql or "'comment'" not in like_sql:
              raise SystemExit('comment-like target boundary missing after closure migration')
          for table in ['social_topics','social_target_topics','social_mentions','social_notifications','social_notification_preferences']:
              if db.execute("SELECT 1 FROM sqlite_master WHERE type='table' AND name=?", (table,)).fetchone() is None:
                  raise SystemExit(f'missing {table}')
          print('SOCIAL_CLOSURE_V1_MIGRATION_STATIC=PASS')
          PY

      - name: Run unified social closure runtime and adapter tests
        working-directory: workers/W01-payload
        run: pnpm exec vitest run --config ./vitest.config.mts ../../workers/W05-social/src/poll-runtime.test.ts ../../workers/W05-social/src/index.test.ts ../../workers/W05-social/src/social-closure-runtime.test.ts tests/int/social-closure-v1-adapter.int.spec.ts
