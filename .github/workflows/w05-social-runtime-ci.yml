      - 'workers/W01-payload/src/app/(twitter-clone)/content/[contentId]/page.tsx'
      - 'workers/W01-payload/src/app/(frontend)/users/[userId]/UserProfilePage.tsx'
      - 'workers/W01-payload/src/app/(twitter-clone)/users/[userId]/page.tsx'
      - 'workers/W01-payload/tests/int/content-detail.int.spec.ts'
      - 'workers/W01-payload/tests/int/public-user-profile.int.spec.ts'
      - 'workers/W01-payload/src/app/api/v1/contents/[contentId]/comments/**'
      - 'workers/W01-payload/src/app/api/v1/contents/[contentId]/reply-audience/**'
      - 'workers/W01-payload/tests/int/social-reply-audience-v1-adapter.int.spec.ts'
      - 'workers/W01-payload/vitest.w05-reply-audience.config.mts'
      - 'workers/W01-payload/vitest.w05-reply-audience-route.config.mts'
      - 'workers/W01-payload/src/content/w03-content-client.ts'
      - 'workers/W01-payload/src/app/(frontend)/publish/PublishComposer.tsx'
