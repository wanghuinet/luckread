name: W05 Social Runtime CI

on:
  pull_request:
    paths:
      - 'workers/W05-social/**'
      - 'workers/W01-payload/src/app/api/v1/users/[userId]/followers/**'
      - 'workers/W01-payload/src/app/api/v1/users/[userId]/following/**'
      - 'workers/W01-payload/src/social/**'
      - 'workers/W01-payload/src/social/social-token-parser.ts'
      - 'workers/W01-payload/src/social/social-token-parser.test.ts'
      - 'workers/W01-payload/tests/int/social-followers-v1-adapter.int.spec.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'workers/W01-payload/src/app/api/v1/interactions/likes/**'
      - 'workers/W01-payload/src/app/api/v1/interactions/bookmarks/**'
      - 'workers/W01-payload/src/app/api/v1/interactions/blocks/**'
      - 'workers/W01-payload/src/app/api/v1/interactions/mutes/**'
      - 'workers/W01-payload/src/app/api/v1/content/**/shares/**'
      - 'workers/W01-payload/src/app/api/v1/shares/**'
      - 'workers/W01-payload/src/app/(frontend)/content/[contentId]/page.tsx'
      - 'workers/W01-payload/src/app/(frontend)/users/[userId]/page.tsx'
      - 'workers/W01-payload/tests/int/content-detail.int.spec.ts'
      - 'workers/W01-payload/tests/int/public-user-profile.int.spec.ts'
      - 'workers/W01-payload/src/app/api/v1/contents/[contentId]/comments/**'
      - 'workers/W01-payload/src/app/(frontend)/content/[contentId]/ContentComments.tsx'
      - 'workers/W01-payload/tests/int/social-comments-v1-adapter.int.spec.ts'
      - 'workers/W01-payload/tests/int/social-bookmarks-v1-adapter.int.spec.ts'
      - 'workers/W01-payload/tests/int/social-block-mute-v1-adapter.int.spec.ts'
      - 'workers/W01-payload/tests/int/social-shares-v1-adapter.int.spec.ts'
      - 'workers/W01-payload/tests/int/social-shares-landing.int.spec.ts'
      - 'workers/W01-payload/tests/int/content-detail-comments.int.spec.ts'
      - '.github/workflows/w05-social-runtime-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'workers/W05-social/**'
      - 'workers/W01-payload/src/app/api/v1/users/[userId]/followers/**'
      - 'workers/W01-payload/src/app/api/v1/users/[userId]/following/**'
      - 'workers/W01-payload/src/app/api/v1/social/follows/**'
      - 'workers/W01-payload/src/social/**'
      - 'workers/W01-payload/tests/int/social-followers-v1-adapter.int.spec.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'workers/W01-payload/src/app/api/v1/interactions/likes/**'
      - 'workers/W01-payload/src/app/api/v1/interactions/bookmarks/**'
      - 'workers/W01-payload/src/app/api/v1/content/**/shares/**'
      - 'workers/W01-payload/src/app/api/v1/shares/**'
      - 'workers/W01-payload/src/app/(frontend)/content/[contentId]/page.tsx'
      - 'workers/W01-payload/tests/int/content-detail.int.spec.ts'
      - 'workers/W01-payload/tests/int/social-bookmarks-v1-adapter.int.spec.ts'
      - 'workers/W01-payload/tests/int/social-shares-v1-adapter.int.spec.ts'
      - 'workers/W01-payload/tests/int/social-shares-landing.int.spec.ts'
      - 'workers/W01-payload/src/app/api/v1/interactions/blocks/**'
      - 'workers/W01-payload/src/app/api/v1/interactions/mutes/**'
      - 'workers/W01-payload/src/app/(frontend)/users/[userId]/page.tsx'
      - 'workers/W01-payload/src/app/(frontend)/styles.css'
      - 'workers/W01-payload/tests/int/public-user-profile.int.spec.ts'
      - 'workers/W01-payload/tests/int/social-block-mute-v1-adapter.int.spec.ts'
      - '.github/workflows/w05-social-runtime-ci.yml'

permissions:
  contents: read

jobs:
  social-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install W01 test dependencies from committed lockfile
        working-directory: workers/W01-payload
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run W05 Social and W01 adapter tests
        working-directory: workers/W01-payload
        run: pnpm exec vitest run --config ./vitest.config.mts ../../workers/W05-social/src/follow-runtime.test.ts ../../workers/W05-social/src/like-runtime.test.ts ../../workers/W05-social/src/comment-runtime.test.ts ../../workers/W05-social/src/favorite-runtime.test.ts ../../workers/W05-social/src/share-runtime.test.ts ../../workers/W05-social/src/block-policy.test.ts ../../workers/W05-social/src/relationship-graph-runtime.test.ts ../../workers/W05-social/src/block-mute-runtime.test.ts ../../workers/W05-social/src/index.test.ts tests/int/social-followers-v1-adapter.int.spec.ts tests/int/social-likes-v1-adapter.int.spec.ts tests/int/social-comments-v1-adapter.int.spec.ts tests/int/social-bookmarks-v1-adapter.int.spec.ts tests/int/social-shares-v1-adapter.int.spec.ts tests/int/social-shares-landing.int.spec.ts tests/int/social-block-mute-v1-adapter.int.spec.ts tests/int/content-detail.int.spec.ts tests/int/content-detail-comments.int.spec.ts

      - name: Verify block mute migration shape
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(':memory:')
          sql = Path('workers/W05-social/migrations/20261002_006_social_009_block_mute_v1.sql').read_text()
          db.executescript(sql)
          cols = db.execute('PRAGMA table_info("social_user_interactions")').fetchall()
          expected = ['relationship_id','actor_user_id','target_user_id','relation_type','created_at','updated_at']
          if [r[1] for r in cols] != expected:
              raise SystemExit('unexpected block/mute schema')
          indexes = {r[1]: r[2] for r in db.execute('PRAGMA index_list("social_user_interactions")').fetchall()}
          if indexes.get('sqlite_autoindex_social_user_interactions_1') != 1:
              raise SystemExit('block/mute uniqueness boundary missing')
          print('SOCIAL_009_BLOCK_MUTE_MIGRATION_STATIC=PASS')
          PY


      - name: Verify share migration shape
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(':memory:')
          sql = Path('workers/W05-social/migrations/20261002_005_social_006_share_v1.sql').read_text()
          db.executescript(sql)
          cols = db.execute('PRAGMA table_info("social_share_links")').fetchall()
          if [r[1] for r in cols] != ['share_id','content_id','actor_user_id','idempotency_key','created_at']:
              raise SystemExit('unexpected share schema')
          indexes = {r[1]: r[2] for r in db.execute('PRAGMA index_list("social_share_links")').fetchall()}
          if indexes.get('sqlite_autoindex_social_share_links_1') != 1:
              raise SystemExit('share idempotency uniqueness boundary missing')
          print('SOCIAL_006_SHARE_MIGRATION_STATIC=PASS')
          PY


      - name: Verify favorite migration shape
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(':memory:')
          sql = Path('workers/W05-social/migrations/20261002_004_social_005_favorite_v1.sql').read_text()
          db.executescript(sql)
          cols = db.execute('PRAGMA table_info("interaction_favorites")').fetchall()
          if [r[1] for r in cols] != ['relationship_id','actor_user_id','target_type','target_id','created_at']:
              raise SystemExit('unexpected favorite schema')
          indexes = {r[1]: r[2] for r in db.execute('PRAGMA index_list("interaction_favorites")').fetchall()}
          if indexes.get('uq_interaction_favorite_actor_target') != 1:
              raise SystemExit('favorite uniqueness boundary missing')
          print('SOCIAL_005_FAVORITE_MIGRATION_STATIC=PASS')
          PY


      - name: Verify like migration shape
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(':memory:')
          sql = Path('workers/W05-social/migrations/20261002_002_social_003_like_v1.sql').read_text()
          db.executescript(sql)
          cols = db.execute('PRAGMA table_info("interaction_likes")').fetchall()
          if [r[1] for r in cols] != ['relationship_id','actor_user_id','target_type','target_id','created_at']:
              raise SystemExit('unexpected like schema')
          indexes = {r[1]: r[2] for r in db.execute('PRAGMA index_list("interaction_likes")').fetchall()}
          if indexes.get('uq_interaction_like_actor_target') != 1:
              raise SystemExit('like uniqueness boundary missing')
          print('SOCIAL_003_LIKE_MIGRATION_STATIC=PASS')
          PY


      - name: Verify comment migration shape
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(':memory:')
          sql = Path('workers/W05-social/migrations/20261002_003_social_004_comments_v1.sql').read_text()
          db.executescript(sql)
          cols = db.execute('PRAGMA table_info("social_comments")').fetchall()
          expected = ['id','content_id','author_user_id','parent_id','body','state','depth','idempotency_key','created_at','updated_at']
          if [r[1] for r in cols] != expected:
              raise SystemExit('unexpected comment schema')
          indexes = {r[1]: r[2] for r in db.execute('PRAGMA index_list("social_comments")').fetchall()}
          if indexes.get('sqlite_autoindex_social_comments_1') != 1:
              raise SystemExit('comment idempotency uniqueness boundary missing')
          print('SOCIAL_004_COMMENT_MIGRATION_STATIC=PASS')
          PY
