name: Repair OpenAPI Idempotency Declarations

on:
  push:
    paths:
      - 'contracts/openapi/v1/operation-policy.json'
      - '.github/workflows/repair-idempotency.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore canonical OpenAPI and repair required declarations
        shell: bash
        run: |
          set -euo pipefail
          git show e80433de0b99599a13fc5aab40231a5c4f60414d:contracts/openapi/v1/openapi.yaml > contracts/openapi/v1/openapi.yaml
          python3 - <<'PY'
          from pathlib import Path
          ops = {
              'blockUser','unblockUser','muteUser','unmuteUser','createReport','createAppeal',
              'rollbackContentRevision','createShare','createSubscription','cancelSubscription',
              'inviteOrganizationMember','removeOrganizationMember','changeOrganizationMemberRole'
          }
          p = Path('contracts/openapi/v1/openapi.yaml')
          lines = p.read_text().splitlines()
          out = []
          current_op = None
          param_section = False
          for line in lines:
              if line.startswith('      operationId: '):
                  current_op = line.split(': ',1)[1].strip()
                  param_section = False
                  out.append(line)
                  continue
              if line.startswith('      parameters:') and current_op in ops:
                  param_section = True
                  out.append(line)
                  continue
              if current_op in ops and param_section and line.startswith('      requestBody:'):
                  if not any("IdempotencyKeyRequired" in x for x in out[-8:]):
                      out.append("        - $ref: '#/components/parameters/IdempotencyKeyRequired'")
                  param_section = False
                  out.append(line)
                  continue
              if current_op in ops and param_section and line.startswith('      responses:'):
                  if not any("IdempotencyKeyRequired" in x for x in out[-8:]):
                      out.append("        - $ref: '#/components/parameters/IdempotencyKeyRequired'")
                  param_section = False
                  out.append(line)
                  continue
              if current_op in ops and param_section and "#/components/parameters/IdempotencyKey" in line:
                  if "IdempotencyKeyRequired" not in line:
                      out.append("        - $ref: '#/components/parameters/IdempotencyKeyRequired'")
                  continue
              out.append(line)
          p.write_text('\n'.join(out) + '\n')
          PY
      - name: Validate and verify OpenAPI
        shell: bash
        run: |
          python3 - <<'PY'
          import yaml
          import re
          from pathlib import Path
          s = Path('contracts/openapi/v1/openapi.yaml').read_text()
          yaml.safe_load(s)
          ops = ['blockUser','unblockUser','muteUser','unmuteUser','createReport','createAppeal','rollbackContentRevision','createShare','createSubscription','cancelSubscription','inviteOrganizationMember','removeOrganizationMember','changeOrganizationMemberRole']
          for op in ops:
              m = re.search(r'(?ms)^  /[^\n]+:\n.*?^      operationId:\s*'+re.escape(op)+r'\s*$.*?(?=^  /[^\n]+:\n|^components:\n)', s)
              if not m or "#/components/parameters/IdempotencyKeyRequired" not in m.group(0):
                  raise SystemExit(f'missing required declaration: {op}')
          print('OpenAPI YAML parse: PASS')
          print('Required idempotency verification: PASS')
          PY
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet -- contracts/openapi/v1/openapi.yaml; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contracts/openapi/v1/openapi.yaml
          git commit -m 'fix(contract): restore canonical OpenAPI idempotency declarations'
          git push