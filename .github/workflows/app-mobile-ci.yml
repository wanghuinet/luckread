name: LuckRead Native App CI

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app-mobile-ci.yml"
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/app-mobile-ci.yml"
  workflow_dispatch:
    inputs:
      run_native_builds:
        description: Run long Android Debug and iOS simulator builds for final native validation
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: app-mobile-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: "1"
  CI: "1"

jobs:
  dependency-compatibility:
    name: Expo install, doctor and typecheck
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      EXPO_PROJECT_ID: "00000000-0000-4000-8000-000000000001"
      EXPO_UPDATE_CHANNEL: preview
      LUCKREAD_REQUIRE_OTA_CONFIG: "1"
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.13.1"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.38"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Expo app dependencies
        run: bun install
      - name: Export generated Bun lockfile for the reviewed PR
        uses: actions/upload-artifact@v4
        with:
          name: luckread-native-bun-lockfile
          path: app/bun.lockb
          if-no-files-found: error
          retention-days: 1

      - name: Commit generated Bun lockfile to same-repository PR branch
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          LOCKFILE_COPY="${RUNNER_TEMP}/luckread-generated-bun.lockb"
          cp bun.lockb "$LOCKFILE_COPY"
          cd ..
          test -n "$PR_BRANCH"
          test -n "$PR_HEAD_SHA"
          git fetch origin "$PR_HEAD_SHA"
          git checkout --detach "$PR_HEAD_SHA"
          install -D -m 0644 "$LOCKFILE_COPY" app/bun.lockb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/bun.lockb
          if git diff --cached --quiet; then
            echo "Generated Bun lockfile already matches the PR branch."
            exit 0
          fi
          git commit -m "chore(app): update generated Bun lockfile"
          git push origin "HEAD:refs/heads/$PR_BRANCH"
      - name: Apply and verify Hyperswitch React Native 0.88 compatibility
        run: |
          node scripts/apply-hyperswitch-rn88-compat.mjs
          bun run test:hyperswitch-compat
      - name: Verify versions bundled for the Expo SDK
        run: bunx expo install --check
      - name: Run Expo compatibility doctor
        run: bunx expo-doctor@latest
      - name: Check public Expo config with OTA test project
        run: bunx expo config --type public
      - name: Test EAS Update configuration and runtime guards
        run: bun test tests/ota-config.test.mjs
      - name: Test Android OTA build provenance verification
        run: bun test tests/ota-build-provenance.test.mjs
      - name: Verify Expo UI native menu dependencies
        run: bun run test:native-menu
      - name: Test native reusable Button component
        run: bun run test:ui-button
      - name: Test Expo Network offline status behavior
        run: bun run test:network-status
      - name: Verify generated Android Release signing configuration
        run: |
          bunx expo prebuild --platform android --clean --no-install
          node <<'NODE'
          const fs = require("node:fs");
          const gradle = fs.readFileSync("android/app/build.gradle", "utf8");
          const buildTypesStart = gradle.indexOf("\n    buildTypes {");
          const releaseBlockStart = buildTypesStart >= 0 ? gradle.indexOf("\n        release {", buildTypesStart) : -1;
          const releaseSuffix = releaseBlockStart >= 0 ? gradle.slice(releaseBlockStart) : "";
          if (!releaseSuffix.includes("signingConfig signingConfigs.release")) {
            throw new Error("Android Release build is not configured to use the stable Release keystore.");
          }
          if (!gradle.includes('System.getenv("ANDROID_KEYSTORE_PATH")')) {
            throw new Error("Android Release build is missing environment-based keystore configuration.");
          }
          console.log("Android Release signing configuration is generated correctly.");
          NODE

      - name: Prepare temporary Android signing for native Codegen
        run: |
          SIGNING_DIR="${RUNNER_TEMP}/luckread-android-codegen-signing"
          mkdir -p "$SIGNING_DIR"
          STORE_PASSWORD="$(openssl rand -hex 16)"
          KEY_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          KEY_ALIAS="luckread-codegen-check"
          KEYSTORE_PATH="$SIGNING_DIR/luckread-codegen.keystore"
          keytool -genkeypair -noprompt -v \
            -keystore "$KEYSTORE_PATH" \
            -storetype JKS \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=LuckRead CI Codegen, OU=CI, O=LuckRead, L=NA, ST=NA, C=US"
          chmod 600 "$KEYSTORE_PATH"
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Generate and verify Hyperswitch native module Codegen
        run: |
          test -f android/gradle.properties
          grep -Fxq "newArchEnabled=true" android/gradle.properties
          WRAPPER_PROPERTIES="android/gradle/wrapper/gradle-wrapper.properties"
          if grep -q '^networkTimeout=' "$WRAPPER_PROPERTIES"; then
            sed -i 's/^networkTimeout=.*/networkTimeout=120000/' "$WRAPPER_PROPERTIES"
          else
            printf '\nnetworkTimeout=120000\n' >> "$WRAPPER_PROPERTIES"
          fi
          grep -Fxq 'networkTimeout=120000' "$WRAPPER_PROPERTIES"
          chmod +x android/gradlew
          cd android
          ./gradlew generateCodegenArtifactsFromSchema --no-daemon
          cd ..
          SPEC_ROOT="node_modules/@juspay-tech/react-native-hyperswitch/android/build/generated/source/codegen"
          MODULE_SPEC="$(find "$SPEC_ROOT" -type f -name 'NativeHyperswitchModuleSpec.java' -print -quit)"
          HEADLESS_SPEC="$(find "$SPEC_ROOT" -type f -name 'NativeHyperHeadlessSpec.java' -print -quit)"
          test -n "$MODULE_SPEC" || { echo "Hyperswitch NativeHyperswitchModuleSpec was not generated" >&2; exit 1; }
          test -n "$HEADLESS_SPEC" || { echo "Hyperswitch NativeHyperHeadlessSpec was not generated" >&2; exit 1; }
          echo "Verified generated Hyperswitch specs:"
          echo "$MODULE_SPEC"
          echo "$HEADLESS_SPEC"
      - name: TypeScript 7 native compiler typecheck
        run: bun run typecheck
      - name: TypeScript 6 compiler API compatibility typecheck
        run: bun run typecheck:ts6
      - name: Test PostHog APP crash-diagnostics configuration
        run: bun test tests/posthog-diagnostics.test.mjs
      - name: Test unified native API client rules
        run: bun run test:api-client
      - name: Test native media reference host and credential boundaries
        run: bun test tests/content-adapter-media-reference.test.mjs
      - name: Test native authenticated image gallery and multi-photo preview
        run: bun run test:media-gallery
      - name: Test native camera photo capture and composer upload integration
        run: bun test tests/camera-capture.test.mjs
      - name: Test native share sheet and clipboard copy-link actions
        run: bun test tests/content-share-actions.test.mjs
      - name: Test native Expo push endpoint registration, permission lifecycle and logout cleanup
        run: bun run test:push-notifications
      - name: Test native publishing and media upload contracts
        run: bun run test:publish-api
      - name: Test native image upload preparation and fallback behavior
        run: bun run test:image-upload-preparation
      - name: Test native publishing flow and owner-only post actions
        run: bun run test:publish-flow
      - name: Test native notifications, bookmarks, relationships and discovery API routes
        run: bun run test:social-screen-api
      - name: Test native subscription management API
        run: bun run test:subscriptions-api
      - name: Test native paid-content entitlement and paywall closure
        run: bun run test:paid-content
      - name: Test native billing history and refunds API
        run: bun run test:billing-api
      - name: Test native Settings and privacy home navigation
        run: bun test tests/settings-home.test.mjs
      - name: Test shared appearance preference hydration and persistence
        run: bun test tests/theme-preference-store.test.mjs
      - name: Test native Help and About page
        run: bun test tests/settings-about.test.mjs
      - name: Test native session management API and settings entry
        run: bun test tests/session-management-api.test.mjs
      - name: Test native block and mute management
        run: bun test tests/block-mute-management.test.mjs
      - name: Test native video feed API requests
        run: bun run test:video-feed-api
      - name: Test native video-feed autoplay preference
        run: bun test tests/video-feed-autoplay.test.mjs
      - name: Test native device-local image cache management
        run: bun test tests/image-cache-management.test.mjs
      - name: Test native bottom tab navigation visibility
        run: bun test tests/tab-navigation-ui.test.mjs
      - name: Test native feed comment navigation
        run: bun run test:comment-navigation
      - name: Test native TanStack Query feed cache and pagination
        run: bun run test:feed-query
      - name: Test native public content search
        run: bun run test:content-search
      - name: Test native profile pin and unpin actions
        run: bun test tests/profile-pin.test.mjs
      - name: Test native post reporting
        run: bun test tests/report-api.test.mjs
      - name: Test native post interaction API contracts
        run: bun test tests/post-interactions-api.test.mjs
      - name: Test native comment like API and UI wiring
        run: bun test tests/comment-likes-api.test.mjs
      - name: Test native comment reporting API and UI wiring
        run: bun test tests/comment-report-api.test.mjs
      - name: Test native registration, verification and recovery API contracts
        run: bun run test:auth-flow
      - name: Enforce shared API client boundary
        run: bun run check:api-boundary

  android-build:
    name: Android debug build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_native_builds }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.13.1"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.38"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure preinstalled Android SDK and install required components
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools not found under $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "cmake;3.22.1" "ndk;27.1.12297006"
      - name: Install Expo app dependencies
        run: bun install
      - name: Apply and verify Hyperswitch React Native 0.88 compatibility
        run: |
          node scripts/apply-hyperswitch-rn88-compat.mjs
          bun run test:hyperswitch-compat
      - name: Generate Android native project
        run: bunx expo prebuild --platform android --clean --no-install
      - name: Compile debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: luckread-android-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios-build:
    name: iOS simulator build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_native_builds }}
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.13.1"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.38"
      - name: Install Expo app dependencies
        run: bun install
      - name: Apply and verify Hyperswitch React Native 0.88 compatibility
        run: |
          node scripts/apply-hyperswitch-rn88-compat.mjs
          bun run test:hyperswitch-compat
      - name: Generate iOS native project
        run: bunx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods dependencies
        run: cd ios && pod install
      - name: Compile iOS simulator app
        run: |
          WORKSPACE_PATH="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [ -z "$WORKSPACE_PATH" ]; then
            echo "Expo prebuild did not generate an Xcode workspace" >&2
            exit 1
          fi
          SCHEME="$(basename "$WORKSPACE_PATH" .xcworkspace)"
          xcodebuild \
            -workspace "$WORKSPACE_PATH" \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - uses: actions/upload-artifact@v4
        with:
          name: luckread-ios-simulator-app
          path: app/ios/build/Build/Products/Debug-iphonesimulator/
          if-no-files-found: error
          retention-days: 7
