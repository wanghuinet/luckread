name: AUTH-007 Rollout Environment Preflight (Read-only)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact immutable implementation SHA already contained in protected main
        required: true
        type: string

permissions:
  actions: read
  contents: read
  deployments: read
  pull-requests: read

jobs:
  preflight:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout protected main for source validation
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate source SHA is an immutable commit on main
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if ! [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_sha must be a full 40-character commit SHA"
            exit 1
          fi
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main || {
            echo "source_sha must already be contained in protected main"
            exit 1
          }

      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify AUTH-007 rollout environment configuration without production mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
          AUTH007_ROLLOUT_ENVIRONMENT: auth-mfa-rollout
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: node scripts/verify-auth-007-rollout-admission.mjs --read-only-config-preflight

      - name: Assert preflight is read-only
        run: |
          echo "productionMutationPerformed=false"
          echo "workerDeploymentPerformed=false"
          echo "l8GenesisGrantAllowed=false"
