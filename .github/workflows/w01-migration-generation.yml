name: W01 Payload Migration Generation

on:
  push:
    branches: [main]
    paths:
      - 'workers/W01-payload/src/collections/Users.ts'
      - 'workers/W01-payload/src/payload.config.ts'
      - 'workers/W01-payload/package.json'
      - 'workers/W01-payload/pnpm-lock.yaml'
      - 'workers/W01-payload/src/migrations/**'
      - '.github/workflows/w01-migration-generation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.34.5 --activate

      - name: Install W01 locked dependencies
        working-directory: workers/W01-payload
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Verify generation preconditions
        run: node scripts/auth-002-migration-generation-admission.mjs

      - name: Generate migration with Payload CLI
        working-directory: workers/W01-payload
        env:
          NODE_ENV: production
          PAYLOAD_SECRET: migration-generation-only
        run: pnpm run payload -- migrate:create MIG-ENT-USER-PROFILE-V1

      - name: Audit generated migration
        run: node scripts/auth-002-migration-static-audit.mjs

      - name: Upload generated migration
        uses: actions/upload-artifact@v4
        with:
          name: w01-payload-generated-migration-${{ github.sha }}
          path: workers/W01-payload/src/migrations/
          if-no-files-found: error
          retention-days: 14
