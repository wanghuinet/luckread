name: W05 D1-03 Push Endpoint Binding Deploy

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact merged main SHA containing the W05 D1-03 binding
        required: true
        type: string
      confirm:
        description: Type DEPLOY_W05_D1_03_PUSH_ENDPOINT to deploy the scoped binding
        required: true
        type: string

permissions:
  contents: read

env:
  EXPECTED_WORKER: luckread-w05
  EXPECTED_D1_02: 6c342634-97f6-4248-9f4a-85772af4f22c
  EXPECTED_D1_03: bda1d247-a371-4244-91ae-aef96034db7f

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY_W05_D1_03_PUSH_ENDPOINT' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate exact source SHA
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'

      - name: Checkout exact merged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Verify main ancestry and binding set
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          python - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('workers/W05-social/wrangler.jsonc').read_text())
          assert c['name'] == 'luckread-w05'
          bindings = c['d1_databases']
          assert len(bindings) == 2
          actual = {item['binding']: item for item in bindings}
          assert actual['DB']['database_id'] == '6c342634-97f6-4248-9f4a-85772af4f22c'
          assert actual['DB']['database_name'] == 'luckreadpro'
          assert actual['D1_03']['database_id'] == 'bda1d247-a371-4244-91ae-aef96034db7f'
          assert actual['D1_03']['database_name'] == 'secondary'
          assert actual['D1_03'].get('migrations_dir') is None
          assert len(c.get('services', [])) == 1
          assert c['services'][0]['binding'] == 'W03_CONTENT'
          assert 'queues' not in c
          assert c.get('vars', {}).get('PUSH_DELIVERY_ENABLED') == 'false'
          assert 'nodejs_compat' in c.get('compatibility_flags', [])
          workflows = c.get('workflows', [])
          assert workflows == [{
              'name': 'luckread-w05-notification-push',
              'binding': 'NOTIFICATION_PUSH_WORKFLOW',
              'class_name': 'NotificationPushWorkflow',
              'schedules': ['* * * * *'],
          }]
          print('W05_D1_03_BINDING_AND_DISABLED_PUSH_WORKFLOW_SOURCE=PASS')
          PY

      - name: Verify W05 D1-02 notification push delivery migration before deploying W05
        working-directory: workers/W05-social
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.116.0 d1 execute luckreadpro --remote --json --config wrangler.jsonc --command "SELECT name FROM d1_migrations WHERE name IN ('20261104_017_notification_push_delivery_v1.sql','20261104_017_notification_push_delivery_v1');" > /tmp/w05-notify-003-ready.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/w05-notify-003-ready.json'))
          rows = [r for item in data for r in item.get('results', [])] if isinstance(data, list) else data.get('results', [])
          if len(rows) != 1:
              raise SystemExit('W05 D1-02 NOTIFY-003 migration must be applied before W05 delivery deployment')
          print('W05_NOTIFY_003_D1_02_MIGRATION_PREREQUISITE=PASS')
          PY

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify W09-owned migrated D1-03 target before deployment
        working-directory: workers/W09-platform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.116.0 d1 execute secondary --remote --json --config wrangler.d1-03-migrations.jsonc --command "SELECT name FROM d1_migrations WHERE name IN ('0001_notification_push_endpoints.sql','0001_notification_push_endpoints');" > /tmp/w05-push-migration-ready.json
          python - <<'PY'
          import json
          value = json.load(open('/tmp/w05-push-migration-ready.json'))
          rows = [r for item in value for r in item.get('results', [])] if isinstance(value, list) else value.get('results', [])
          if len(rows) != 1:
              raise SystemExit('D1-03 push endpoint migration must be applied before W05 deployment')
          print('W05_D1_03_MIGRATION_PREREQUISITE=PASS')
          PY

      - name: Install W05 Expo SDK dependency from committed lockfile
        working-directory: workers/W05-social
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Deploy W05 with existing D1-02 and scoped D1-03 bindings
        working-directory: workers/W05-social
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.116.0 deploy --config wrangler.jsonc

      - name: Verify live Worker D1 bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl -fsS             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$EXPECTED_WORKER/settings"             > /tmp/w05-d1-bindings.json
          jq -e --arg db "$EXPECTED_D1_02" '.. | objects | select(.id? == $db)' /tmp/w05-d1-bindings.json >/dev/null
          jq -e --arg db "$EXPECTED_D1_03" '.. | objects | select(.id? == $db)' /tmp/w05-d1-bindings.json >/dev/null

      - name: Upload exact-SHA binding provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w05-d1-03-push-endpoint-binding-${{ github.run_id }}
          path: /tmp/w05-d1-bindings.json
          if-no-files-found: ignore
          retention-days: 30
