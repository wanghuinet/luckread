name: One-Time DELETE All LuckRead Workers (Manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DELETE_ALL_LUCKREAD_WORKERS"
        required: true
        type: string
      force:
        description: "Force-delete Workers that have references"
        required: true
        type: choice
        options:
          - "true"
          - "false"
        default: "true"

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Validate explicit confirmation and credentials
        run: |
          set -euo pipefail
          test "${{ inputs.confirm }}" = "DELETE_ALL_LUCKREAD_WORKERS"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          echo "Explicit deletion confirmation accepted."

      - name: Discover known LuckRead Worker scripts
        env:
          EXPECTED_WORKERS: |
            luckread-w01-payload
            luckread-w02
            luckread-w03
            luckread-w04
            luckread-w05
            luckread-w06
            luckread-w07
            luckread-w08
            luckread-w09
            luckread-w10
            luckread-w11
            luckread-w12
            luck01-identity
            luck02-content
            luck03-social
            luck04-commerce
            luck05-creator
            luck06-async
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            > /tmp/workers.json
          jq -e '.success == true' /tmp/workers.json >/dev/null
          printf '%s\n' "$EXPECTED_WORKERS" | awk 'NF' | sort -u > /tmp/expected-workers.txt
          jq -r '.result[]?.id' /tmp/workers.json | sort -u > /tmp/current-workers.txt
          comm -12 /tmp/expected-workers.txt /tmp/current-workers.txt | tee /tmp/matched-workers.txt
          echo "Expected-but-missing scripts:"
          comm -23 /tmp/expected-workers.txt /tmp/current-workers.txt || true

      - name: Delete matched Worker scripts
        run: |
          set -euo pipefail
          deleted=0
          failed=0
          while IFS= read -r worker; do
            [ -n "$worker" ] || continue
            echo "Deleting $worker"
            encoded="$(python - "$worker" <<'PY'
import sys
import urllib.parse
print(urllib.parse.quote(sys.argv[1], safe=""))
PY
)"
            code="$(curl --silent --show-error \
              -o "/tmp/delete-${deleted}.json" \
              -w '%{http_code}' \
              -X DELETE \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$encoded?force=${{ inputs.force }}" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json")"
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              echo "DELETED $worker"
              deleted=$((deleted + 1))
            else
              echo "FAILED $worker HTTP $code"
              cat "/tmp/delete-${deleted}.json" || true
              failed=$((failed + 1))
            fi
          done < /tmp/matched-workers.txt
          echo "deleted=$deleted failed=$failed"
          test "$failed" -eq 0

      - name: Verify all known LuckRead Workers are absent
        env:
          EXPECTED_WORKERS: |
            luckread-w01-payload
            luckread-w02
            luckread-w03
            luckread-w04
            luckread-w05
            luckread-w06
            luckread-w07
            luckread-w08
            luckread-w09
            luckread-w10
            luckread-w11
            luckread-w12
            luck01-identity
            luck02-content
            luck03-social
            luck04-commerce
            luck05-creator
            luck06-async
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            > /tmp/workers-after.json
          jq -e '.success == true' /tmp/workers-after.json >/dev/null
          jq -r '.result[]?.id' /tmp/workers-after.json | sort -u > /tmp/current-after.txt
          printf '%s\n' "$EXPECTED_WORKERS" | awk 'NF' | sort -u > /tmp/expected-workers.txt
          remaining="$(comm -12 /tmp/expected-workers.txt /tmp/current-after.txt)"
          test -z "$remaining"
          echo "LUCKREAD_ALL_KNOWN_WORKERS_DELETED=PASS"