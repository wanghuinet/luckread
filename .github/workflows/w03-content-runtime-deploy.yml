name: W03 Content Runtime Deploy

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact W03 source commit to deploy
        required: true
        type: string
      confirm:
        description: Type DEPLOY_W03 to permit this controlled deployment
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirm == 'DEPLOY_W03' && github.ref == 'refs/heads/main' && github.ref_protected == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Require exact source SHA to belong to protected main
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/neon/assert-production-cutover-authorized.mjs D1-02

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify admitted W03 moderation adapter source
        run: |
          set -euo pipefail
          test -f workers/W03-content/src/index.ts
          test -f workers/W03-content/src/entry.ts
          test -f workers/W03-content/src/content-runtime.ts
          grep -q 'contentMutationStoreProvider' workers/W03-content/src/entry.ts
          grep -q 'getW03ContentMutationStore' workers/W03-content/src/entry.ts
          grep -q 'contentContextReadStoreProvider' workers/W03-content/src/entry.ts
          grep -q 'getW03ContentContextReadStore' workers/W03-content/src/entry.ts
          grep -q 'HYPERDRIVE_CONTENT_PG' workers/W03-content/src/neon/runtime.ts
          grep -q 'applyModerationContentTransition' workers/W03-content/src/content-runtime.ts
          grep -q 'X-LuckRead-Caller.*W06' workers/W03-content/src/index.ts
          echo W03_MODERATION_ADAPTER_SOURCE=PASS

      - name: Verify admitted W03 physical binding
        working-directory: workers/W03-content
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          if (c.name !== 'luckread-w03') throw new Error('W03 worker name mismatch');
          if (c.main !== 'src/entry.ts') throw new Error('W03 entrypoint mismatch');
          if ((c.d1_databases || []).length !== 0) throw new Error('W03 production config must not declare D1');
          const postgres = (c.hyperdrive || []).find(x => x.binding === 'HYPERDRIVE_CONTENT_PG');
          if (!postgres || postgres.id !== 'c55183e1cc3446409c9c1075832c6615') {
            throw new Error('Existing Neon Hyperdrive binding mismatch');
          }
          if (c.vars?.W03_CONTENT_READ_DRIVER !== 'neon') throw new Error('W03 must use the Neon runtime driver');
          console.log(JSON.stringify({worker:c.name, main:c.main, d1BindingCount:0, hyperdriveBinding:postgres.binding}));
          NODE

      - name: Install repository dependencies
        run: npm ci

      - name: Install W03 PostgreSQL Worker runtime dependency
        working-directory: workers/W03-content
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Validate W03 Neon bundle without deployment
        working-directory: workers/W03-content
        run: npx --yes wrangler@4.116.0 deploy --dry-run --config wrangler.jsonc --outdir /tmp/w03-neon-runtime-dry-run

      - name: Typecheck and unit-test W03
        run: |
          npx --no-install tsc --noEmit --strict --skipLibCheck             --target ES2022 --module ESNext --moduleResolution Bundler             --lib ES2022,DOM --types @cloudflare/workers-types             workers/W03-content/src/content-runtime.ts             workers/W03-content/src/publish-preflight.ts             workers/W03-content/src/index.ts
          npx --yes vitest@3.2.4 run workers/W03-content/src/content-runtime.test.ts workers/W03-content/src/content-snowflake-id.test.ts workers/W03-content/src/publish-preflight.test.ts

      - name: Verify W03 traffic guard bindings
        working-directory: workers/W03-content
        run: |
          node - <<'NODE'
          const fs=require('fs')
          const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'))
          const required=['CONTENT_ORIGIN_GLOBAL_LIMITER','CONTENT_PUBLIC_READ_LIMITER','CONTENT_MUTATION_LIMITER']
          const names=new Set((c.ratelimits||[]).map(x=>x.name))
          for(const name of required) if(!names.has(name)) throw new Error('missing rate limiter: '+name)
          console.log(JSON.stringify({rateLimitBindings:[...names].sort()}))
          NODE

      - name: Deploy W03 without migration execution
        working-directory: workers/W03-content
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.116.0 deploy --config wrangler.jsonc

      - name: Write deployment provenance
        run: |
          mkdir -p artifacts/mapping-0
          cat > artifacts/mapping-0/w03-content-deploy-provenance.txt <<EOF
          workflow=W03 Content Runtime Deploy
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          source_sha=${{ inputs.source_sha }}
          confirmation=DEPLOY_W03
          worker=luckread-w03
          database_driver=neon
          d1_binding_count=0
          hyperdrive_binding=HYPERDRIVE_CONTENT_PG
          migration_execution=false
          EOF

      - name: Upload deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: w03-content-deployment-${{ inputs.source_sha }}
          path: artifacts/mapping-0/w03-content-deploy-provenance.txt

          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REF_PROTECTED" = "true"
          git fetch origin main --no-tags
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          echo W03_DEPLOY_SOURCE_IS_PROTECTED_MAIN=PASS

      - name: Require approved D1-02 business-data import and production cutover evidence
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/neon/assert-production-cutover-authorized.mjs D1-02

