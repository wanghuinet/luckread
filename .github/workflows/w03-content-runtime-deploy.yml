name: W03 Content Runtime Deploy

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact W03 source commit to deploy
        required: true
        type: string
        default: 386669f9f20d018523ff390d61c54e79b956224a
      confirm:
        description: Type DEPLOY_W03 to permit this controlled deployment
        required: true
        type: string
        default: DEPLOY_W03

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirm == 'DEPLOY_W03' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify admitted W03 moderation adapter source
        run: |
          set -euo pipefail
          test -f workers/W03-feed/src/index.ts
          test -f workers/W03-feed/src/content-runtime.ts
          grep -q 'applyModerationContentTransition' workers/W03-feed/src/content-runtime.ts
          grep -q 'X-LuckRead-Caller.*W06' workers/W03-feed/src/index.ts
          echo W03_MODERATION_ADAPTER_SOURCE=PASS

      - name: Verify admitted W03 physical binding
        working-directory: workers/W03-feed
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          if (c.name !== 'luckread-w03') throw new Error('W03 worker name mismatch');
          if (c.main !== 'src/index.ts') throw new Error('W03 entrypoint mismatch');
          const d1 = (c.d1_databases || []).find(x => x.binding === 'D1_02');
          if (!d1 || d1.database_id !== '6c342634-97f6-4248-9f4a-85772af4f22c') {
            throw new Error('D1_02 physical binding mismatch');
          }
          console.log(JSON.stringify({worker:c.name, main:c.main, d1Binding:d1}));
          NODE

      - name: Install repository dependencies
        run: npm ci

      - name: Typecheck and unit-test W03
        run: |
          npx --no-install tsc --noEmit --strict --skipLibCheck             --target ES2022 --module ESNext --moduleResolution Bundler             --lib ES2022,DOM --types @cloudflare/workers-types             workers/W03-feed/src/content-runtime.ts             workers/W03-feed/src/publish-preflight.ts             workers/W03-feed/src/index.ts
          npx --yes vitest@3.2.4 run workers/W03-feed/src/content-runtime.test.ts workers/W03-feed/src/publish-preflight.test.ts

      - name: Deploy W03 without migration execution
        working-directory: workers/W03-feed
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.116.0 deploy --config wrangler.jsonc

      - name: Write deployment provenance
        run: |
          mkdir -p artifacts/mapping-0
          cat > artifacts/mapping-0/w03-content-deploy-provenance.txt <<EOF
          workflow=W03 Content Runtime Deploy
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          source_sha=${{ inputs.source_sha }}
          confirmation=DEPLOY_W03
          worker=luckread-w03
          d1_binding=D1_02
          d1_database_id=6c342634-97f6-4248-9f4a-85772af4f22c
          migration_execution=false
          EOF

      - name: Upload deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: w03-content-deployment-${{ inputs.source_sha }}
          path: artifacts/mapping-0/w03-content-deploy-provenance.txt
