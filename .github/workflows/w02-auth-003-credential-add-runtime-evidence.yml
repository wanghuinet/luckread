name: W02 AUTH-003 Credential Add Runtime Evidence

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact implementation commit SHA to execute
        required: true
        type: string
      database_name:
        description: Controlled Cloudflare D1 display name
        required: true
        type: string
      confirm:
        description: Type RUN to permit controlled remote D1 runtime evidence
        required: true
        type: string

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate exact source and run focused unit tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
          test -f workers/W02-identity/src/credentials/credential-add.ts
          test -f workers/W02-identity/src/credentials/credential-add.test.ts
          npx --yes vitest@3.2.4 run workers/W02-identity/src/credentials/credential-add.test.ts

  runtime:
    needs: unit
    if: ${{ inputs.confirm == 'RUN' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      D1_01_ID: "2f80471e-3756-49f9-8db1-7707a433ad64"
      DATABASE_NAME: ${{ inputs.database_name }}
      PROBE_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate exact runtime inputs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
          test "${DATABASE_NAME}" = "luckread"
          test -f workers/W02-identity/src/credentials/credential-add.ts
          test -f workers/W02-identity/migrations/0004_auth_003_credentials.sql
          test -f workers/W02-identity/wrangler.jsonc
          test -z "$(git status --short)"

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"

      - name: Prepare ephemeral remote runtime harness
        run: |
          set -euo pipefail
          cat > .auth003-credential-add-runtime.wrangler.jsonc <<EOF
          {
            "name": "luckread-w02-auth003-credential-add-evidence-harness",
            "main": ".auth003-credential-add-runtime-harness.ts",
            "compatibility_date": "2025-08-15",
            "d1_databases": [
              {
                "binding": "D1_01",
                "database_name": "${DATABASE_NAME}",
                "database_id": "${D1_01_ID}",
                "remote": true
              }
            ],
            "vars": {
              "PROBE_TOKEN": "${PROBE_TOKEN}",
              "RUN_ID": "${{ github.run_id }}",
              "SOURCE_SHA": "${{ inputs.source_sha }}"
            }
          }
          EOF

          cat > .auth003-credential-add-runtime-harness.ts <<'EOF'
          // CI-only ephemeral harness. Never committed or deployed as a product Worker.
          // @ts-nocheck

          import { addCredential } from './workers/W02-identity/src/credentials/credential-add.ts'

          const json = (body: unknown, status = 200) =>
            new Response(JSON.stringify(body, null, 2), {
              status,
              headers: {
                'content-type': 'application/json',
                'cache-control': 'no-store',
              },
            })

          function countByIdentity(db, identityId) {
            return db
              .prepare('SELECT COUNT(*) AS count FROM auth_credentials WHERE identity_id = ?')
              .bind(identityId)
              .first()
          }

          function countByNormalized(db, kind, normalizedValue) {
            return db
              .prepare('SELECT COUNT(*) AS count FROM auth_credentials WHERE kind = ? AND normalized_value = ?')
              .bind(kind, normalizedValue)
              .first()
          }

          export default {
            async fetch(request, env) {
              if (request.method !== 'POST' || new URL(request.url).pathname !== '/probe') {
                return new Response(null, { status: 404 })
              }

              if (request.headers.get('x-auth003-probe-token') !== env.PROBE_TOKEN) {
                return json({ status: 'DENY' }, 403)
              }

              const db = env.D1_01
              const runId = env.RUN_ID
              const suffix = runId.replace(/[^0-9]/g, '')
              const userA = 'auth003-user-' + suffix + '-a'
              const userB = 'auth003-user-' + suffix + '-b'
              const identityA = 'auth003-identity-' + suffix + '-a'
              const identityB = 'auth003-identity-' + suffix + '-b'
              const emailA = 'same-' + suffix + '@example.invalid'
              const now = new Date().toISOString()
              const secret = env.PROBE_TOKEN + '-secret-material-012345678901234567890123'
              let insertedFixtures = false

              try {
                const existing = await db
                  .prepare(
                    'SELECT id, user_id FROM auth_identities WHERE id IN (?, ?) OR user_id IN (?, ?) LIMIT 1',
                  )
                  .bind(identityA, identityB, userA, userB)
                  .first()

                if (existing) {
                  return json({
                    status: 'FAIL_CLOSED',
                    reason: 'synthetic_identity_or_user_already_exists',
                  }, 409)
                }

                await db
                  .prepare(
                    'INSERT INTO auth_identities (id, user_id, normalization_version) VALUES (?, ?, ?), (?, ?, ?)',
                  )
                  .bind(
                    identityA,
                    userA,
                    'AUTH-003-NORM-V1',
                    identityB,
                    userB,
                    'AUTH-003-NORM-V1',
                  )
                  .run()
                insertedFixtures = true

                const crossAccount = await addCredential(db, {
                  actorUserId: userA,
                  targetUserId: userB,
                  kind: 'email',
                  value: 'protected-' + suffix + '@example.invalid',
                  idempotencyKey: 'cross-account-' + runId,
                  secret,
                  now,
                }).then(
                  () => ({ code: 'UNEXPECTED_SUCCESS' }),
                  (error) => ({ code: error?.code ?? 'UNKNOWN' }),
                )

                const add = await addCredential(db, {
                  actorUserId: userA,
                  targetUserId: userA,
                  kind: 'email',
                  value: '  Test.' + suffix + '@Example.Invalid  ',
                  idempotencyKey: 'add-' + runId,
                  secret,
                  now,
                })

                const replay = await addCredential(db, {
                  actorUserId: userA,
                  targetUserId: userA,
                  kind: 'email',
                  value: '  Test.' + suffix + '@Example.Invalid  ',
                  idempotencyKey: 'add-' + runId,
                  secret,
                  now,
                })

                const replayConflict = await addCredential(db, {
                  actorUserId: userA,
                  targetUserId: userA,
                  kind: 'email',
                  value: 'other-' + suffix + '@Example.Invalid',
                  idempotencyKey: 'add-' + runId,
                  secret,
                  now,
                }).then(
                  () => ({ code: 'UNEXPECTED_SUCCESS' }),
                  (error) => ({ code: error?.code ?? 'UNKNOWN' }),
                )

                const concurrent = await Promise.allSettled([
                  addCredential(db, {
                    actorUserId: userA,
                    targetUserId: userA,
                    kind: 'email',
                    value: emailA,
                    idempotencyKey: 'concurrent-a-' + runId,
                    secret,
                    now,
                  }),
                  addCredential(db, {
                    actorUserId: userB,
                    targetUserId: userB,
                    kind: 'email',
                    value: emailA,
                    idempotencyKey: 'concurrent-b-' + runId,
                    secret,
                    now,
                  }),
                ])

                const concurrentSuccesses = concurrent.filter((entry) => entry.status === 'fulfilled')
                const concurrentFailures = concurrent.filter((entry) => entry.status === 'rejected')
                const uniquenessRow = await countByNormalized(db, 'email', emailA)
                const userARows = await countByIdentity(db, identityA)
                const userBRows = await countByIdentity(db, identityB)

                const publicShapeOnly =
                  Object.keys(add).sort().join(',') === 'active,credentialId,kind' &&
                  !Object.prototype.hasOwnProperty.call(add, 'value') &&
                  !Object.prototype.hasOwnProperty.call(add, 'normalizedValue') &&
                  !Object.prototype.hasOwnProperty.call(add, 'valueHash')

                const checks = {
                  crossAccountDeniedBeforeMutation: crossAccount.code === 'PERMISSION_DENIED',
                  addSucceededWithPublicProjectionOnly:
                    add.kind === 'email' && add.active === true && publicShapeOnly,
                  idempotentReplayReturnsSameProjection: JSON.stringify(replay) === JSON.stringify(add),
                  idempotencyConflictForDifferentRequest: replayConflict.code === 'CONFLICT',
                  concurrentUniquenessHasOneWinner:
                    concurrentSuccesses.length === 1 && concurrentFailures.length === 1,
                  concurrentLoserIsGenericConflict:
                    concurrentFailures.length === 1 &&
                    concurrentFailures[0]?.reason?.code === 'CONFLICT',
                  oneAuthoritativeNormalizedOwner:
                    Number(uniquenessRow?.count ?? -1) === 1,
                  syntheticRowsRemainBounded:
                    Number(userARows?.count ?? -1) >= 1 &&
                    Number(userBRows?.count ?? -1) <= 1,
                }

                for (const [name, ok] of Object.entries(checks)) {
                  if (!ok) throw new Error('AUTH-003 credential-add assertion failed: ' + name)
                }

                return json({
                  status: 'PASS',
                  environment: 'CONTROLLED_REMOTE_D1_AUTH003_CREDENTIAL_ADD',
                  database: {
                    name: env.DATABASE_NAME,
                    binding: 'D1_01',
                    databaseId: '2f80471e-3756-49f9-8db1-7707a433ad64',
                  },
                  provenance: {
                    workflow: 'W02 AUTH-003 Credential Add Runtime Evidence',
                    runId,
                    sourceSha: env.SOURCE_SHA,
                    productionWorkerDeployed: false,
                  },
                  results: {
                    addProjection: add,
                    replayProjection: replay,
                    crossAccountCode: crossAccount.code,
                    replayConflictCode: replayConflict.code,
                    concurrentSuccessCount: concurrentSuccesses.length,
                    concurrentFailureCount: concurrentFailures.length,
                    normalizedOwnerCount: Number(uniquenessRow?.count ?? -1),
                  },
                  checks,
                })
              } catch (error) {
                return json({
                  status: 'RUNTIME_EXCEPTION',
                  environment: 'CONTROLLED_REMOTE_D1_AUTH003_CREDENTIAL_ADD',
                  error: {
                    name: String(error?.name ?? 'Error'),
                    code: String(error?.code ?? 'UNKNOWN'),
                  },
                }, 500)
              } finally {
                if (insertedFixtures) {
                  await db
                    .prepare('DELETE FROM auth_identities WHERE id IN (?, ?)')
                    .bind(identityA, identityB)
                    .run()
                }

                const remaining = await db
                  .prepare('SELECT COUNT(*) AS count FROM auth_identities WHERE id IN (?, ?)')
                  .bind(identityA, identityB)
                  .first()

                if (Number(remaining?.count ?? -1) !== 0) {
                  throw new Error('AUTH-003 fixture cleanup failed')
                }
              }
            },
          }
          EOF

      - name: Start ephemeral remote Worker runtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.116.0 dev --remote --config .auth003-credential-add-runtime.wrangler.jsonc --ip 127.0.0.1 --port 8790 > auth003-credential-add-runtime.log 2>&1 &
          echo $! > auth003-credential-add-runtime.pid

          ready=0
          for _ in $(seq 1 90); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:8790/probe || true)
            if [ "$code" != "000" ]; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat auth003-credential-add-runtime.log
            exit 1
          fi

      - name: Execute controlled credential-add runtime probe
        env:
          PROBE_TOKEN: ${{ env.PROBE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/mapping-0/w02-auth003-credential-add-runtime

          set +e
          http_code=$(curl -sS -o artifacts/mapping-0/w02-auth003-credential-add-runtime/runtime-result.json -w '%{http_code}'             -X POST             -H "x-auth003-probe-token: ${PROBE_TOKEN}"             http://127.0.0.1:8790/probe)
          curl_exit=$?
          set -e

          echo "AUTH003_CREDENTIAL_ADD_REMOTE_RUNTIME_HTTP_STATUS=$http_code"
          echo "AUTH003_CREDENTIAL_ADD_REMOTE_RUNTIME_CURL_EXIT=$curl_exit"
          cat artifacts/mapping-0/w02-auth003-credential-add-runtime/runtime-result.json || true
          cat auth003-credential-add-runtime.log || true

          if [ "$curl_exit" -ne 0 ]; then
            exit "$curl_exit"
          fi
          if [ "$http_code" != "200" ]; then
            exit 1
          fi

          node - <<'NODE'
          const fs = require('node:fs')
          const result = JSON.parse(fs.readFileSync(
            'artifacts/mapping-0/w02-auth003-credential-add-runtime/runtime-result.json',
            'utf8',
          ))
          if (result.status !== 'PASS') throw new Error('AUTH-003 credential-add runtime evidence did not PASS')
          for (const [name, ok] of Object.entries(result.checks || {})) {
            if (!ok) throw new Error('AUTH-003 credential-add assertion failed: ' + name)
          }
          console.log(JSON.stringify({
            status: result.status,
            environment: result.environment,
            provenance: result.provenance,
            checks: result.checks,
            concurrentSuccessCount: result.results?.concurrentSuccessCount,
            concurrentFailureCount: result.results?.concurrentFailureCount,
            normalizedOwnerCount: result.results?.normalizedOwnerCount,
          }, null, 2))
          NODE

      - name: Capture reproducible provenance
        run: |
          set -euo pipefail
          cat > artifacts/mapping-0/w02-auth003-credential-add-runtime/provenance.txt <<EOF
          workflow=W02 AUTH-003 Credential Add Runtime Evidence
          github_run_id=${{ github.run_id }}
          github_source_sha=${{ github.sha }}
          tested_source_sha=${{ inputs.source_sha }}
          database_name=${DATABASE_NAME}
          database_id=${D1_01_ID}
          binding=D1_01
          environment=CONTROLLED_REMOTE_D1_AUTH003_CREDENTIAL_ADD
          operation=authCredentialAdd
          production_worker_deployed=false
          synthetic_identity_rows_cleaned=true
          EOF
          cp auth003-credential-add-runtime.log artifacts/mapping-0/w02-auth003-credential-add-runtime/harness.log

      - name: Upload controlled remote runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: w02-auth003-credential-add-runtime-evidence-${{ github.run_id }}
          path: artifacts/mapping-0/w02-auth003-credential-add-runtime/
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup ephemeral harness
        if: ${{ always() }}
        run: |
          if [ -f auth003-credential-add-runtime.pid ]; then
            kill "$(cat auth003-credential-add-runtime.pid)" 2>/dev/null || true
          fi
          rm -f .auth003-credential-add-runtime-harness.ts .auth003-credential-add-runtime.wrangler.jsonc auth003-credential-add-runtime.pid
