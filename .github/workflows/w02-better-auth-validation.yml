name: W02 Better Auth Package Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'workers/W02-identity/package.json'
      - '.github/workflows/w02-deploy.yml'
      - '.github/workflows/w02-better-auth-validation.yml'

permissions:
  contents: read

jobs:
  package-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install W02 runtime dependencies
        working-directory: workers/W02-identity
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Assert Better Auth is exactly 1.7.8 and imports
        working-directory: workers/W02-identity
        run: |
          node --input-type=module -e "import { readFile } from 'node:fs/promises'; const pkg = JSON.parse(await readFile('./node_modules/better-auth/package.json', 'utf8')); if (pkg.version !== '1.7.8') throw new Error('Expected better-auth 1.7.8, got ' + pkg.version); await import('better-auth'); console.log('better-auth ' + pkg.version + ' import: OK')"
          npm ls better-auth --depth=0
