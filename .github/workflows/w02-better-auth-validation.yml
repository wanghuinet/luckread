name: W02 Better Auth Package Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'workers/W02-identity/package.json'
      - '.github/workflows/w02-deploy.yml'
      - '.github/workflows/w02-better-auth-validation.yml'

permissions:
  contents: write

jobs:
  package-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install W02 runtime dependencies
        working-directory: workers/W02-identity
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Upload generated W02 npm lockfile for deterministic upgrade review
        uses: actions/upload-artifact@v4
        with:
          name: w02-better-auth-package-lock-1.7.27
          path: workers/W02-identity/package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Commit the generated lockfile to this same-repository upgrade branch
        if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'gpt/w02-better-auth-1.7.27-upgrade'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const path = 'workers/W02-identity/package-lock.json'
            const branch = context.payload.pull_request.head.ref
            const content = fs.readFileSync(path).toString('base64')
            let sha
            try {
              const current = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: branch,
              })
              if (current.data.content.replace(/\\s/g, '') === content) {
                core.info('W02 package-lock.json is already current')
                return
              }
              sha = current.data.sha
            } catch (error) {
              if (error.status !== 404) throw error
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'chore(w02): pin resolved Better Auth dependency graph',
              content,
              branch,
              ...(sha ? { sha } : {}),
            })
            core.info('Committed generated W02 package-lock.json')
      - name: Assert Better Auth is exactly 1.7.27 and imports
        working-directory: workers/W02-identity
        run: |
          node --input-type=module -e "import { readFile } from 'node:fs/promises'; const pkg = JSON.parse(await readFile('./node_modules/better-auth/package.json', 'utf8')); if (pkg.version !== '1.7.27') throw new Error('Expected better-auth 1.7.27, got ' + pkg.version); await import('better-auth'); console.log('better-auth ' + pkg.version + ' import: OK')"
          npm ls better-auth --depth=0
