name: AUTH-013 Public Transport HTTP E2E Evidence

on:
  workflow_dispatch:
    inputs:
      tested_commit:
        description: Exact W01 source commit used by the controlled binding deployment
        required: true
        type: string
      deployment_run_id:
        description: Successful W01 W02 Auth Binding Deploy run ID for that exact source
        required: true
        type: string
      w01_base_url:
        description: Controlled public W01 URL
        required: true
        default: https://luckread-w01-payload.wanghui-79b.workers.dev
        type: string
      database_name:
        description: Controlled D1 database name
        required: true
        default: luckread
        type: string
      confirm:
        description: Type RUN_AUTH013_E2E
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  WRANGLER_VERSION: 4.116.0

jobs:
  public-http-e2e:
    if: ${{ inputs.confirm == 'RUN_AUTH013_E2E' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Verify deployment provenance
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_COMMIT: ${{ inputs.tested_commit }}
          DEPLOYMENT_RUN_ID: ${{ inputs.deployment_run_id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${DEPLOYMENT_RUN_ID}" > /tmp/auth013-deploy.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${DEPLOYMENT_RUN_ID}/artifacts?per_page=100" > /tmp/auth013-artifacts.json
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const deployment = JSON.parse(readFileSync('/tmp/auth013-deploy.json', 'utf8'))
          const artifacts = JSON.parse(readFileSync('/tmp/auth013-artifacts.json', 'utf8'))
          const expected = process.env.TESTED_COMMIT
          if (deployment.name !== 'W01 W02 Auth Binding Deploy') throw new Error('wrong deployment workflow')
          if (deployment.conclusion !== 'success' || deployment.head_branch !== 'main') throw new Error('deployment is not a successful main run')
          const name = 'w01-w02-binding-deployment-' + expected
          const matches = (artifacts.artifacts ?? []).filter((a) => a.name === name && !a.expired)
          if (matches.length !== 1) throw new Error('exact deployment artifact not found')
          console.log(JSON.stringify({ deploymentRunId: deployment.id, testedCommit: expected, artifactId: matches[0].id }))
          NODE

      - name: Checkout exact deployed source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tested_commit }}
          path: deployed-source
          fetch-depth: 0

      - name: Checkout current evidence tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: evidence-tooling

      - name: Setup runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.0
          run_install: false

      - name: Install locked W01 dependencies
        working-directory: deployed-source/workers/W01-payload
        run: pnpm install --frozen-lockfile

      - name: Verify admitted W02 Better Auth baseline
        working-directory: deployed-source/workers/W02-identity
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          if (pkg.dependencies?.['better-auth'] !== '1.7.7') throw new Error('Better Auth version mismatch')
          NODE

      - name: Generate isolated fixture
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node evidence-tooling/scripts/auth-013-public-http-e2e-fixture.mjs

      - name: Preflight Better Auth fixture identity and collision
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "${{ inputs.database_name }}" --remote --json --config deployed-source/workers/W02-identity/wrangler.jsonc             --command "SELECT
              (SELECT COUNT(*) FROM "user" WHERE email IN ('${AUTH013_BASIC_EMAIL}', '${AUTH013_OPERATOR_EMAIL}', '${AUTH013_TARGET_EMAIL}')) AS email_collision,
              (SELECT COUNT(*) FROM "user" WHERE username IN ('${AUTH013_BASIC_USERNAME}', '${AUTH013_OPERATOR_USERNAME}', '${AUTH013_TARGET_USERNAME}')) AS username_collision,
              (SELECT COUNT(*) FROM "session" WHERE id IN ('${AUTH013_BASIC_SESSION_ID}', '${AUTH013_OPERATOR_SESSION_ID}')) AS session_collision,
              (SELECT COUNT(*) FROM role_assignments WHERE id IN ('${AUTH013_BASIC_ROLE_ID}', '${AUTH013_OPERATOR_ROLE_ID}')) AS role_collision" > /tmp/auth013-preflight.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const raw = JSON.parse(readFileSync('/tmp/auth013-preflight.json', 'utf8'))
          const row = Array.isArray(raw) ? (raw[0]?.results?.[0] ?? {}) : (raw?.result?.results?.[0] ?? raw?.results?.[0] ?? {})
          for (const key of ['email_collision','username_collision','session_collision','role_collision']) {
            if (Number(row[key] ?? -1) !== 0) throw new Error('fixture collision: ' + key)
          }
          NODE

      - name: Seed isolated fixture into D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "${{ inputs.database_name }}" --remote --yes --config deployed-source/workers/W02-identity/wrangler.jsonc --file=/tmp/auth013-seed.sql
          echo "AUTH013_FIXTURE_SEEDED=1" >> "$GITHUB_ENV"

      - name: Resolve Better Auth user IDs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "${{ inputs.database_name }}" --remote --json --config deployed-source/workers/W02-identity/wrangler.jsonc             --command "SELECT id, email FROM \"user\" WHERE email IN ('${AUTH013_BASIC_EMAIL}', '${AUTH013_OPERATOR_EMAIL}', '${AUTH013_TARGET_EMAIL}') ORDER BY email" > /tmp/auth013-user-ids.json
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'
          const raw = JSON.parse(readFileSync('/tmp/auth013-user-ids.json', 'utf8'))
          const rows = Array.isArray(raw) ? (raw[0]?.results ?? []) : (raw?.result?.results ?? raw?.results ?? [])
          if (rows.length !== 3) throw new Error('expected exactly three fixture users')
          const byEmail = new Map(rows.map((row) => [String(row.email), String(row.id)]))
          const basic = byEmail.get(process.env.AUTH013_BASIC_EMAIL)
          const operator = byEmail.get(process.env.AUTH013_OPERATOR_EMAIL)
          const target = byEmail.get(process.env.AUTH013_TARGET_EMAIL)
          if (!basic || !operator || !target || new Set([basic, operator, target]).size !== 3) throw new Error('fixture user id resolution failed')
          appendFileSync(process.env.GITHUB_ENV, `AUTH013_BASIC_USER_ID=${basic}\nAUTH013_OPERATOR_USER_ID=${operator}\nAUTH013_TARGET_USER_ID=${target}\n`)
          console.log(JSON.stringify({ userIdAllocation: 'better_auth_fixture_defined', resolved: true, secretMaterialIncluded: false }))
          NODE

      - name: Execute public transport E2E
        env:
          W01_BASE_URL: ${{ inputs.w01_base_url }}
          AUTH013_ARTIFACT_DIR: artifacts/mapping-0/auth-013-public-http-e2e
        run: node evidence-tooling/scripts/auth-013-public-transport-e2e.mjs

      - name: Revoke basic session for stale-session proof
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "${{ inputs.database_name }}" --remote --yes --config deployed-source/workers/W02-identity/wrangler.jsonc             --command "UPDATE auth_session_state
              SET revoked_at='${AUTH013_NOW}', last_seen_at='${AUTH013_NOW}', token_version=token_version+1
              WHERE session_id='${AUTH013_BASIC_SESSION_ID}' AND revoked_at IS NULL;"

      - name: Verify stale-session public denial
        env:
          W01_BASE_URL: ${{ inputs.w01_base_url }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs'
          const base = process.env.W01_BASE_URL.replace(/\/$/, '')
          const response = await fetch(base + '/v1/users/' + process.env.AUTH013_BASIC_USER_ID + '/account-state', {
            method: 'POST',
            headers: {
              accept: 'application/json',
              'content-type': 'application/json',
              authorization: 'Bearer ' + process.env.AUTH013_BASIC_ACCESS_TOKEN,
              'If-Match': '"1"',
            },
            body: JSON.stringify({ to: 'RESTRICTED', reason: 'AUTH-013 stale session denial' }),
          })
          const body = await response.json()
          if (response.status !== 401 || body?.error?.code !== 'UNAUTHENTICATED') {
            throw new Error('stale-session denial failed')
          }
          writeFileSync(
            'artifacts/mapping-0/auth-013-public-http-e2e/stale-session-result.json',
            JSON.stringify({ status: 'PASS', check: 'stale_session_denial', secretMaterialIncluded: false }, null, 2) + '\n',
          )
          console.log('AUTH-013 stale-session denial PASS')
          NODE

      - name: Verify D1 authoritative result
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "${{ inputs.database_name }}" --remote --json --config deployed-source/workers/W02-identity/wrangler.jsonc             --command "SELECT
              (SELECT account_state FROM "user" WHERE id=${AUTH013_OPERATOR_USER_ID}) AS operator_state,
              (SELECT account_state_version FROM "user" WHERE id=${AUTH013_OPERATOR_USER_ID}) AS operator_version,
              (SELECT COUNT(*) FROM auth_013_publication_journal WHERE resource_id='${AUTH013_OPERATOR_USER_ID}') AS operator_journal_count,
              (SELECT account_state FROM "user" WHERE id=${AUTH013_BASIC_USER_ID}) AS basic_state,
              (SELECT account_state_version FROM "user" WHERE id=${AUTH013_BASIC_USER_ID}) AS basic_version,
              (SELECT COUNT(*) FROM auth_013_publication_journal WHERE resource_id='${AUTH013_BASIC_USER_ID}') AS basic_journal_count,
              (SELECT revoked_at FROM auth_session_state WHERE session_id='${AUTH013_BASIC_SESSION_ID}') AS basic_revoked_at,
              (SELECT token_version FROM auth_session_state WHERE session_id='${AUTH013_BASIC_SESSION_ID}') AS basic_token_version,
              (SELECT account_state FROM "user" WHERE id=${AUTH013_TARGET_USER_ID}) AS target_state,
              (SELECT account_state_version FROM "user" WHERE id=${AUTH013_TARGET_USER_ID}) AS target_version,
              (SELECT COUNT(*) FROM auth_013_publication_journal WHERE resource_id='${AUTH013_TARGET_USER_ID}') AS target_journal_count,
              (SELECT source_version FROM auth_013_publication_journal WHERE resource_id='${AUTH013_TARGET_USER_ID}' LIMIT 1) AS target_journal_version,
              (SELECT event_type FROM auth_013_publication_journal WHERE resource_id='${AUTH013_TARGET_USER_ID}' LIMIT 1) AS target_event_type" > /tmp/auth013-final.json
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const raw = JSON.parse(readFileSync('/tmp/auth013-final.json', 'utf8'))
          const row = Array.isArray(raw) ? (raw[0]?.results?.[0] ?? {}) : (raw?.result?.results?.[0] ?? raw?.results?.[0] ?? {})
          const checks = {
            operatorStateUnchanged: row.operator_state === 'ACTIVE',
            operatorVersionUnchanged: Number(row.operator_version) === 1,
            operatorJournalEmpty: Number(row.operator_journal_count) === 0,
            basicStateUnchanged: row.basic_state === 'ACTIVE',
            basicVersionUnchanged: Number(row.basic_version) === 1,
            basicJournalEmpty: Number(row.basic_journal_count) === 0,
            basicSessionRevoked: typeof row.basic_revoked_at === 'string' && row.basic_revoked_at.length > 0,
            basicTokenVersion: Number(row.basic_token_version) === 2,
            targetState: row.target_state === 'RESTRICTED',
            targetVersion: Number(row.target_version) === 2,
            targetJournalExactlyOne: Number(row.target_journal_count) === 1,
            targetJournalVersion: Number(row.target_journal_version) === 2,
            targetJournalType: row.target_event_type === 'identity.account_state_changed',
          }
          for (const [name, ok] of Object.entries(checks)) if (!ok) throw new Error('AUTH-013 D1 check failed: ' + name)
          writeFileSync(
            'artifacts/mapping-0/auth-013-public-http-e2e/d1-result.json',
            JSON.stringify({ status: 'PASS', environment: 'CONTROLLED_REMOTE_D1', checks, secretMaterialIncluded: false }, null, 2) + '\n',
          )
          console.log(JSON.stringify({ status: 'PASS', checks }, null, 2))
          NODE

      - name: Record non-secret provenance
        if: always()
        run: |
          mkdir -p artifacts/mapping-0/auth-013-public-http-e2e
          cat > artifacts/mapping-0/auth-013-public-http-e2e/provenance.json <<EOF
          {
            "workflow": "AUTH-013 Public Transport HTTP E2E Evidence",
            "testedSourceSha": "${{ inputs.tested_commit }}",
            "deploymentRunId": "${{ inputs.deployment_run_id }}",
            "worker": "luckread-w01-payload",
            "publicPath": "/v1/users/{userId}/account-state",
            "operationId": "transitionAccountState",
            "database": "${{ inputs.database_name }}",
            "databaseId": "2f80471e-3756-49f9-8db1-7707a433ad64",
            "syntheticFixtureOnly": true,
            "tokenMaterialIncluded": false
          }
          EOF

      - name: Cleanup synthetic fixture
        if: ${{ always() && env.AUTH013_FIXTURE_SEEDED == '1' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          cat > /tmp/auth013-cleanup.sql <<SQL
          DELETE FROM auth_013_publication_journal
          WHERE resource_id IN (
            SELECT CAST(id AS TEXT) FROM "user" WHERE email IN ('${AUTH013_BASIC_EMAIL}','${AUTH013_OPERATOR_EMAIL}','${AUTH013_TARGET_EMAIL}')
          );
          DELETE FROM auth_session_state WHERE session_id IN ('${AUTH013_BASIC_SESSION_ID}','${AUTH013_OPERATOR_SESSION_ID}');
          DELETE FROM "session" WHERE id IN ('${AUTH013_BASIC_SESSION_ID}','${AUTH013_OPERATOR_SESSION_ID}');
          DELETE FROM role_assignments WHERE id IN ('${AUTH013_BASIC_ROLE_ID}','${AUTH013_OPERATOR_ROLE_ID}');
          DELETE FROM role_authorization_versions
          WHERE subject_id IN (
            SELECT CAST(id AS TEXT) FROM "user" WHERE email IN ('${AUTH013_BASIC_EMAIL}','${AUTH013_OPERATOR_EMAIL}','${AUTH013_TARGET_EMAIL}')
          );
          DELETE FROM "user" WHERE email IN ('${AUTH013_BASIC_EMAIL}','${AUTH013_OPERATOR_EMAIL}','${AUTH013_TARGET_EMAIL}');
          SQL
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "${{ inputs.database_name }}" --remote --yes --config deployed-source/workers/W02-identity/wrangler.jsonc --file=/tmp/auth013-cleanup.sql

      - name: Verify fixture cleanup
        if: ${{ always() && env.AUTH013_FIXTURE_SEEDED == '1' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "${{ inputs.database_name }}" --remote --json --config deployed-source/workers/W02-identity/wrangler.jsonc             --command "SELECT
              (SELECT COUNT(*) FROM "user" WHERE email IN ('${AUTH013_BASIC_EMAIL}','${AUTH013_OPERATOR_EMAIL}','${AUTH013_TARGET_EMAIL}')) AS users_remaining,
              (SELECT COUNT(*) FROM "session" WHERE id IN ('${AUTH013_BASIC_SESSION_ID}','${AUTH013_OPERATOR_SESSION_ID}')) AS sessions_remaining,
              (SELECT COUNT(*) FROM auth_session_state WHERE session_id IN ('${AUTH013_BASIC_SESSION_ID}','${AUTH013_OPERATOR_SESSION_ID}')) AS extensions_remaining,
              (SELECT COUNT(*) FROM role_assignments WHERE id IN ('${AUTH013_BASIC_ROLE_ID}','${AUTH013_OPERATOR_ROLE_ID}')) AS roles_remaining,
              (SELECT COUNT(*) FROM auth_013_publication_journal WHERE resource_id IN (
                SELECT CAST(id AS TEXT) FROM "user" WHERE email IN ('${AUTH013_BASIC_EMAIL}','${AUTH013_OPERATOR_EMAIL}','${AUTH013_TARGET_EMAIL}')
              )) AS journals_remaining" > /tmp/auth013-cleanup-check.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const raw = JSON.parse(readFileSync('/tmp/auth013-cleanup-check.json', 'utf8'))
          const row = Array.isArray(raw) ? (raw[0]?.results?.[0] ?? {}) : (raw?.result?.results?.[0] ?? raw?.results?.[0] ?? {})
          for (const key of ['users_remaining','sessions_remaining','extensions_remaining','roles_remaining','journals_remaining']) {
            if (Number(row[key] ?? -1) !== 0) throw new Error('cleanup incomplete: ' + key)
          }
          console.log('AUTH-013 fixture cleanup PASS')
          NODE

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-013-public-http-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mapping-0/auth-013-public-http-e2e/
          if-no-files-found: error
          retention-days: 30
