name: AUTH-013 Public Transport HTTP E2E Evidence

on:
  workflow_dispatch:
    inputs:
      tested_commit:
        description: Exact W01 source commit used by the controlled binding deployment
        required: true
        type: string
      deployment_run_id:
        description: Successful W01 W02 Auth Binding Deploy run ID for that exact source
        required: true
        type: string
      w01_base_url:
        description: Controlled public W01 URL
        required: true
        default: https://luckread-w01-payload.wanghui-79b.workers.dev
        type: string
      database_name:
        description: Controlled D1 database name
        required: true
        default: luckread
        type: string
      confirm:
        description: Type RUN_AUTH013_E2E
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  WRANGLER_VERSION: 4.116.0

jobs:
  public-http-e2e:
    if: ${{ inputs.confirm == 'RUN_AUTH013_E2E' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Verify deployment provenance
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_COMMIT: ${{ inputs.tested_commit }}
          DEPLOYMENT_RUN_ID: ${{ inputs.deployment_run_id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${DEPLOYMENT_RUN_ID}" > /tmp/auth013-deploy.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${DEPLOYMENT_RUN_ID}/artifacts?per_page=100" > /tmp/auth013-artifacts.json
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const deployment = JSON.parse(readFileSync('/tmp/auth013-deploy.json', 'utf8'))
          const artifacts = JSON.parse(readFileSync('/tmp/auth013-artifacts.json', 'utf8'))
          const expected = process.env.TESTED_COMMIT
          if (deployment.name !== 'W01 W02 Auth Binding Deploy') throw new Error('wrong deployment workflow')
          if (deployment.conclusion !== 'success' || deployment.head_branch !== 'main') throw new Error('deployment is not a successful main run')
          const name = 'w01-w02-binding-deployment-' + expected
          const matches = (artifacts.artifacts ?? []).filter((a) => a.name === name && !a.expired)
          if (matches.length !== 1) throw new Error('exact deployment artifact not found')
          console.log(JSON.stringify({ deploymentRunId: deployment.id, testedCommit: expected, artifactId: matches[0].id }))
          NODE

      - name: Checkout exact deployed source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tested_commit }}
          fetch-depth: 0

      - name: Setup runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.0
          run_install: false

      - name: Install locked W01 dependencies
        working-directory: workers/W01-payload
        run: pnpm install --frozen-lockfile

      - name: Verify admitted Payload baseline
        working-directory: workers/W01-payload
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          if (pkg.dependencies?.payload !== '3.90.2') throw new Error('Payload version mismatch')
          if (pkg.dependencies?.['@payloadcms/db-d1-sqlite'] !== '3.90.2') throw new Error('D1 adapter version mismatch')
          NODE

      - name: Generate isolated fixture
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node scripts/auth-013-public-http-e2e-fixture.mjs

      - name: Preflight fixture collision and journal availability
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "${{ inputs.database_name }}" --remote --json --config workers/W01-payload/wrangler.jsonc             --command "SELECT
              (SELECT COUNT(*) FROM users WHERE id IN (${AUTH013_BASIC_USER_ID}, ${AUTH013_OPERATOR_USER_ID})) AS user_collision,
              (SELECT COUNT(*) FROM users_sessions WHERE id IN ('${AUTH013_BASIC_SESSION_ID}', '${AUTH013_OPERATOR_SESSION_ID}')) AS session_collision,
              (SELECT COUNT(*) FROM role_assignments WHERE id IN ('${AUTH013_BASIC_ROLE_ID}', '${AUTH013_OPERATOR_ROLE_ID}')) AS role_collision,
              (SELECT COUNT(*) FROM auth_013_publication_journal WHERE resource_id IN ('${AUTH013_BASIC_USER_ID}', '${AUTH013_OPERATOR_USER_ID}')) AS journal_collision" > /tmp/auth013-preflight.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const raw = JSON.parse(readFileSync('/tmp/auth013-preflight.json', 'utf8'))
          const row = (raw?.result?.results ?? raw?.results ?? [])[0] ?? {}
          for (const key of ['user_collision','session_collision','role_collision','journal_collision']) {
            if (Number(row[key] ?? -1) !== 0) throw new Error('fixture collision: ' + key)
          }
          NODE

      - name: Seed isolated fixture into D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "${{ inputs.database_name }}" --remote --yes --config workers/W01-payload/wrangler.jsonc --file=/tmp/auth013-seed.sql

      - name: Execute public transport E2E
        env:
          W01_BASE_URL: ${{ inputs.w01_base_url }}
          AUTH013_ARTIFACT_DIR: artifacts/mapping-0/auth-013-public-http-e2e
        run: node scripts/auth-013-public-transport-e2e.mjs

      - name: Revoke basic session for stale-session proof
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "${{ inputs.database_name }}" --remote --yes --config workers/W01-payload/wrangler.jsonc             --command "UPDATE auth_session_state
              SET revoked_at='${AUTH013_NOW}', last_seen_at='${AUTH013_NOW}', token_version=token_version+1
              WHERE session_id='${AUTH013_BASIC_SESSION_ID}' AND revoked_at IS NULL;"

      - name: Verify stale-session public denial
        env:
          W01_BASE_URL: ${{ inputs.w01_base_url }}
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.W01_BASE_URL.replace(/\/$/, '')
          const response = await fetch(base + '/v1/users/' + process.env.AUTH013_BASIC_USER_ID + '/account-state', {
            method: 'POST',
            headers: {
              accept: 'application/json',
              'content-type': 'application/json',
              authorization: 'Bearer ' + process.env.AUTH013_BASIC_ACCESS_TOKEN,
              'If-Match': '"1"',
            },
            body: JSON.stringify({ to: 'RESTRICTED', reason: 'AUTH-013 stale session denial' }),
          })
          const body = await response.json()
          if (response.status !== 401 || body?.error?.code !== 'UNAUTHENTICATED') {
            throw new Error('stale-session denial failed')
          }
          console.log('AUTH-013 stale-session denial PASS')
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs'
          writeFileSync(
            'artifacts/mapping-0/auth-013-public-http-e2e/stale-session-result.json',
            JSON.stringify({ status: 'PASS', check: 'stale_session_denial', secretMaterialIncluded: false }, null, 2) + '\n',
          )
          NODE

      - name: Verify D1 authoritative result
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "${{ inputs.database_name }}" --remote --json --config workers/W01-payload/wrangler.jsonc             --command "SELECT
              (SELECT account_state FROM users WHERE id=${AUTH013_OPERATOR_USER_ID}) AS operator_state,
              (SELECT account_state_version FROM users WHERE id=${AUTH013_OPERATOR_USER_ID}) AS operator_version,
              (SELECT COUNT(*) FROM auth_013_publication_journal WHERE resource_id='${AUTH013_OPERATOR_USER_ID}') AS operator_journal_count,
              (SELECT source_version FROM auth_013_publication_journal WHERE resource_id='${AUTH013_OPERATOR_USER_ID}' LIMIT 1) AS operator_journal_version,
              (SELECT event_type FROM auth_013_publication_journal WHERE resource_id='${AUTH013_OPERATOR_USER_ID}' LIMIT 1) AS operator_event_type,
              (SELECT account_state FROM users WHERE id=${AUTH013_BASIC_USER_ID}) AS basic_state,
              (SELECT account_state_version FROM users WHERE id=${AUTH013_BASIC_USER_ID}) AS basic_version,
              (SELECT COUNT(*) FROM auth_013_publication_journal WHERE resource_id='${AUTH013_BASIC_USER_ID}') AS basic_journal_count,
              (SELECT revoked_at FROM auth_session_state WHERE session_id='${AUTH013_BASIC_SESSION_ID}') AS basic_revoked_at,
              (SELECT token_version FROM auth_session_state WHERE session_id='${AUTH013_BASIC_SESSION_ID}') AS basic_token_version" > /tmp/auth013-final.json
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const raw = JSON.parse(readFileSync('/tmp/auth013-final.json', 'utf8'))
          const row = (raw?.result?.results ?? raw?.results ?? [])[0] ?? {}
          const checks = {
            operatorState: row.operator_state === 'RESTRICTED',
            operatorVersion: Number(row.operator_version) === 2,
            operatorJournalExactlyOne: Number(row.operator_journal_count) === 1,
            operatorJournalVersion: Number(row.operator_journal_version) === 2,
            operatorJournalType: row.operator_event_type === 'identity.account_state_changed',
            basicStateUnchanged: row.basic_state === 'ACTIVE',
            basicVersionUnchanged: Number(row.basic_version) === 1,
            basicJournalEmpty: Number(row.basic_journal_count) === 0,
            basicSessionRevoked: typeof row.basic_revoked_at === 'string' && row.basic_revoked_at.length > 0,
            basicTokenVersion: Number(row.basic_token_version) === 2,
          }
          for (const [name, ok] of Object.entries(checks)) if (!ok) throw new Error('AUTH-013 D1 check failed: ' + name)
          writeFileSync(
            'artifacts/mapping-0/auth-013-public-http-e2e/d1-result.json',
            JSON.stringify({ status: 'PASS', environment: 'CONTROLLED_REMOTE_D1', checks, secretMaterialIncluded: false }, null, 2) + '\n',
          )
          console.log(JSON.stringify({ status: 'PASS', checks }, null, 2))
          NODE

      - name: Record non-secret provenance
        if: always()
        run: |
          mkdir -p artifacts/mapping-0/auth-013-public-http-e2e
          cat > artifacts/mapping-0/auth-013-public-http-e2e/provenance.json <<EOF
          {
            "workflow": "AUTH-013 Public Transport HTTP E2E Evidence",
            "testedSourceSha": "${{ inputs.tested_commit }}",
            "deploymentRunId": "${{ inputs.deployment_run_id }}",
            "worker": "luckread-w01-payload",
            "publicPath": "/v1/users/{userId}/account-state",
            "operationId": "transitionAccountState",
            "database": "${{ inputs.database_name }}",
            "databaseId": "2f80471e-3756-49f9-8db1-7707a433ad64",
            "syntheticFixtureOnly": true,
            "tokenMaterialIncluded": false
          }
          EOF

      - name: Cleanup synthetic fixture
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          cat > /tmp/auth013-cleanup.sql <<SQL
          DELETE FROM auth_013_publication_journal WHERE resource_id IN ('${AUTH013_BASIC_USER_ID}','${AUTH013_OPERATOR_USER_ID}');
          DELETE FROM auth_session_state WHERE session_id IN ('${AUTH013_BASIC_SESSION_ID}','${AUTH013_OPERATOR_SESSION_ID}');
          DELETE FROM users_sessions WHERE id IN ('${AUTH013_BASIC_SESSION_ID}','${AUTH013_OPERATOR_SESSION_ID}');
          DELETE FROM role_assignments WHERE id IN ('${AUTH013_BASIC_ROLE_ID}','${AUTH013_OPERATOR_ROLE_ID}');
          DELETE FROM role_authorization_versions WHERE subject_id IN ('${AUTH013_BASIC_USER_ID}','${AUTH013_OPERATOR_USER_ID}');
          DELETE FROM users WHERE id IN (${AUTH013_BASIC_USER_ID},${AUTH013_OPERATOR_USER_ID});
          SQL
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "${{ inputs.database_name }}" --remote --yes --config workers/W01-payload/wrangler.jsonc --file=/tmp/auth013-cleanup.sql

      - name: Verify fixture cleanup
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute "${{ inputs.database_name }}" --remote --json --config workers/W01-payload/wrangler.jsonc             --command "SELECT
              (SELECT COUNT(*) FROM users WHERE id IN (${AUTH013_BASIC_USER_ID},${AUTH013_OPERATOR_USER_ID})) AS users_remaining,
              (SELECT COUNT(*) FROM users_sessions WHERE id IN ('${AUTH013_BASIC_SESSION_ID}','${AUTH013_OPERATOR_SESSION_ID}')) AS sessions_remaining,
              (SELECT COUNT(*) FROM auth_session_state WHERE session_id IN ('${AUTH013_BASIC_SESSION_ID}','${AUTH013_OPERATOR_SESSION_ID}')) AS extensions_remaining,
              (SELECT COUNT(*) FROM role_assignments WHERE id IN ('${AUTH013_BASIC_ROLE_ID}','${AUTH013_OPERATOR_ROLE_ID}')) AS roles_remaining,
              (SELECT COUNT(*) FROM auth_013_publication_journal WHERE resource_id IN ('${AUTH013_BASIC_USER_ID}','${AUTH013_OPERATOR_USER_ID}')) AS journals_remaining" > /tmp/auth013-cleanup-check.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const raw = JSON.parse(readFileSync('/tmp/auth013-cleanup-check.json', 'utf8'))
          const row = (raw?.result?.results ?? raw?.results ?? [])[0] ?? {}
          for (const key of ['users_remaining','sessions_remaining','extensions_remaining','roles_remaining','journals_remaining']) {
            if (Number(row[key] ?? -1) !== 0) throw new Error('cleanup incomplete: ' + key)
          }
          console.log('AUTH-013 fixture cleanup PASS')
          NODE

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-013-public-http-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mapping-0/auth-013-public-http-e2e/
          if-no-files-found: error
          retention-days: 30
