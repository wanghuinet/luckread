name: W02 RoleAssignment Verification

on:
  push:
    branches: [main]
    paths:
      - 'workers/W02-identity/**'
      - 'contracts/authz/**'
      - 'contracts/entity/AUTHZ-role-assignment-authority.v1.json'
      - 'scripts/generate-role-assignment-migration.mjs'
      - 'scripts/generate-role-version-migration.mjs'
      - 'scripts/verify-role-version-mutation.mjs'
      - 'scripts/verify-admin-account-bootstrap-readiness.mjs'
      - 'scripts/l8-genesis-bootstrap-request.mjs'
      - 'scripts/l8-genesis-bootstrap-request.test.mjs'
      - '.github/workflows/w02-role-assignment-verification.yml'
  pull_request:
    paths:
      - 'workers/W02-identity/**'
      - 'contracts/authz/**'
      - 'contracts/entity/AUTHZ-role-assignment-authority.v1.json'
      - 'scripts/generate-role-assignment-migration.mjs'
      - 'scripts/generate-role-version-migration.mjs'
      - 'scripts/verify-role-version-mutation.mjs'
      - 'scripts/verify-admin-account-bootstrap-readiness.mjs'
      - 'scripts/l8-genesis-bootstrap-request.mjs'
      - 'scripts/l8-genesis-bootstrap-request.test.mjs'
      - '.github/workflows/w02-role-assignment-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Install W02 runtime dependencies
        working-directory: workers/W02-identity
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck W02
        run: npx tsc -p workers/W02-identity/tsconfig.json --noEmit
      - name: Verify generated migrations
        run: |
          node scripts/generate-role-assignment-migration.mjs
          node scripts/generate-role-version-migration.mjs
      - name: Assert generated migrations are committed
        run: |
          git diff --exit-code -- workers/W02-identity/migrations/0001_role_assignments.sql
          git diff --exit-code -- workers/W02-identity/migrations/0003_role_authorization_versions.sql
      - name: Verify role_version mutation trigger semantics
        run: node scripts/verify-role-version-mutation.mjs
      - name: Check AUTH-007 rollout admission script syntax
        run: node --check scripts/verify-auth-007-rollout-admission.mjs
      - name: Test L8 genesis request fail-closed validation
        run: node --test scripts/l8-genesis-bootstrap-request.test.mjs
      - name: Check L8 bootstrap readiness audit syntax
        run: node --check scripts/verify-admin-account-bootstrap-readiness.mjs
      - name: Verify logical table authority boundary
        run: node scripts/verify-logical-data-authority.mjs
      - name: Execute AUTH-007 outbox migration static audit (local SQLite only)
        run: node scripts/auth-007-mfa-journal-migration-static-audit.mjs
      - name: Run W02 authorization and session tests
        run: npx vitest run workers/W02-identity/src/authz/role-assignment.test.ts workers/W02-identity/src/authz/role-version.test.ts workers/W02-identity/src/authz/authorization-decision.test.ts workers/W02-identity/src/authz/l8-genesis-bootstrap-approval.test.ts workers/W02-identity/src/authz/l8-genesis-bootstrap-command.test.ts workers/W02-identity/src/authz/l8-genesis-bootstrap-readiness.test.ts workers/W02-identity/src/authz/l8-genesis-bootstrap-route.test.ts workers/W02-identity/src/auth/totp-replay-guard.test.ts workers/W02-identity/src/auth/mfa-audit-publication-journal.test.ts workers/W02-identity/src/auth/mfa-enrollment-start.test.ts workers/W02-identity/src/auth/mfa-enrollment-confirm.test.ts workers/W02-identity/src/session/session-runtime.test.ts
      - name: Run AUTH-007 MFA lifecycle hook and idempotent outbox tests
        run: npx vitest run workers/W02-identity/src/auth/mfa-audit-hooks.test.ts workers/W02-identity/src/auth/mfa-audit-events.test.ts
