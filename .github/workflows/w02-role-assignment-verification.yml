name: W02 RoleAssignment / W08 CASL Verification

on:
  push:
    branches: [main]
    paths:
      - 'workers/W02-identity/**'
      - 'workers/W08-creator/**'
      - 'contracts/authz/**'
      - 'contracts/entity/AUTHZ-role-assignment-authority.v1.json'
      - 'scripts/generate-role-assignment-migration.mjs'
      - 'scripts/generate-role-version-migration.mjs'
      - 'scripts/verify-role-version-mutation.mjs'
      - '.github/workflows/w02-role-assignment-verification.yml'
      - '.github/workflows/w08-authorization-verification.yml'
  pull_request:
    paths:
      - 'workers/W02-identity/**'
      - 'workers/W08-creator/**'
      - 'contracts/authz/**'
      - 'contracts/entity/AUTHZ-role-assignment-authority.v1.json'
      - 'scripts/generate-role-assignment-migration.mjs'
      - 'scripts/generate-role-version-migration.mjs'
      - 'scripts/verify-role-version-mutation.mjs'
      - '.github/workflows/w02-role-assignment-verification.yml'
      - '.github/workflows/w08-authorization-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Install W02 runtime dependencies
        working-directory: workers/W02-identity
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install W08 runtime dependency
        working-directory: workers/W08-creator
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Verify pinned CASL runtime dependency
        working-directory: workers/W08-creator
        run: node --input-type=module -e "import('@casl/ability').then(() => console.log('@casl/ability 7.0.1 import: OK'))"
      - name: Typecheck W08
        run: npx tsc -p workers/W08-creator/tsconfig.json --noEmit
      - name: Test CASL L0-L8 policy
        run: npx vitest run workers/W08-creator/src/authz/casl-policy.test.ts
      - name: Typecheck W02
        run: npx tsc -p workers/W02-identity/tsconfig.json --noEmit
      - name: Verify generated migrations
        run: |
          node scripts/generate-role-assignment-migration.mjs
          node scripts/generate-role-version-migration.mjs
      - name: Assert generated migrations are committed
        run: |
          git diff --exit-code -- workers/W02-identity/migrations/0001_role_assignments.sql
          git diff --exit-code -- workers/W02-identity/migrations/0003_role_authorization_versions.sql
      - name: Verify role_version mutation trigger semantics
        run: node scripts/verify-role-version-mutation.mjs
      - name: Run W02 authorization and session tests
        run: npx vitest run workers/W02-identity/src/authz/role-assignment.test.ts workers/W02-identity/src/authz/role-version.test.ts workers/W02-identity/src/authz/authorization-decision.test.ts workers/W02-identity/src/session/session-runtime.test.ts
