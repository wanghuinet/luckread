name: W02 RoleAssignment Verification

on:
  push:
    branches: [main]
    paths:
      - 'workers/W02-content/**'
      - 'contracts/authz/**'
      - 'contracts/entity/AUTHZ-role-assignment-authority.v1.json'
      - 'scripts/generate-role-assignment-migration.mjs'
      - 'scripts/generate-role-version-migration.mjs'
      - '.github/workflows/w02-role-assignment-verification.yml'
  pull_request:
    paths:
      - 'workers/W02-content/**'
      - 'contracts/authz/**'
      - 'contracts/entity/AUTHZ-role-assignment-authority.v1.json'
      - 'scripts/generate-role-assignment-migration.mjs'
      - '.github/workflows/w02-role-assignment-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck W02
        run: npx tsc -p workers/W02-content/tsconfig.json --noEmit
      - name: Verify generated migrations
        run: |
          node scripts/generate-role-assignment-migration.mjs
          node scripts/generate-role-version-migration.mjs
      - name: Assert generated migrations are committed
        run: |
          git diff --exit-code -- workers/W02-content/migrations/0001_role_assignments.sql
          git diff --exit-code -- workers/W02-content/migrations/0003_role_authorization_versions.sql
      - name: Run W02 authorization and session tests
        run: npx vitest run workers/W02-content/src/authz/role-assignment.test.ts workers/W02-content/src/authz/role-version.test.ts workers/W02-content/src/authz/authorization-decision.test.ts workers/W02-content/src/session/session-runtime.test.ts
