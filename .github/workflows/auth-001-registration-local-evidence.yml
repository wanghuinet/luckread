name: AUTH-001 Registration Local Runtime Evidence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/auth-001-registration-local-evidence.yml"
      - "workers/W01-payload/src/app/auth/register/**"
      - "workers/W01-payload/src/auth/w02-session-client.ts"
      - "workers/W02-identity/src/auth/**"
      - "workers/W02-identity/src/authz/**"
      - "workers/W02-identity/src/index.ts"
      - "workers/W02-identity/migrations/0005_better_auth_identity_core.sql"
      - "workers/W02-identity/migrations/0012_auth_010_session_revocation_journal.sql"
      - "workers/W01-payload/src/auth/w02-session-client.ts"
      - "workers/W02-identity/src/auth/**"
      - "workers/W02-identity/src/authz/**"
      - "workers/W02-identity/src/index.ts"
      - "workers/W02-identity/migrations/0005_better_auth_identity_core.sql"
      - "workers/W02-identity/migrations/0012_auth_010_session_revocation_journal.sql"
      - "workers/W01-payload/src/collections/Users.ts"
      - "workers/W01-payload/src/migrations/**"
      - "workers/W01-payload/src/payload.config.ts"
      - "workers/W01-payload/scripts/auth-001-registration-runtime-evidence-local.mjs"
      - "workers/W01-payload/tests/int/auth-registration-idempotency.int.spec.ts"
      - "workers/W01-payload/scripts/auth-010-session-list-runtime-evidence-local.mjs"
      - "artifacts/mapping-0/priv004-approved-policy-instance-2026-09-27.json"
  pull_request:
    paths:
      - ".github/workflows/auth-001-registration-local-evidence.yml"
      - "workers/W01-payload/src/app/auth/register/**"
      - "workers/W01-payload/src/auth/w02-session-client.ts"
      - "workers/W02-identity/src/auth/**"
      - "workers/W02-identity/src/authz/**"
      - "workers/W02-identity/src/index.ts"
      - "workers/W02-identity/migrations/0005_better_auth_identity_core.sql"
      - "workers/W02-identity/migrations/0012_auth_010_session_revocation_journal.sql"
      - "workers/W01-payload/src/collections/Users.ts"
      - "workers/W01-payload/src/migrations/**"
      - "workers/W01-payload/src/payload.config.ts"
      - "workers/W01-payload/scripts/auth-001-registration-runtime-evidence-local.mjs"
      - "workers/W01-payload/tests/int/auth-registration-idempotency.int.spec.ts"
      - "workers/W01-payload/scripts/auth-010-session-list-runtime-evidence-local.mjs"
      - "workers/W02-identity/wrangler.jsonc"
      - "artifacts/mapping-0/priv004-approved-policy-instance-2026-09-27.json"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source SHA to test
        required: true
        type: string

permissions:
  contents: read

jobs:
  runtime-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_postgres_only
          POSTGRES_DB: luckread_auth001
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d luckread_auth001"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: development
      PAYLOAD_SECRET: ignore
    steps:
      - name: Resolve exact source SHA
        id: source
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "sha=${{ inputs.source_sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout exact tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Verify exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.source.outputs.sha }}"
          test -s workers/W01-payload/src/app/auth/register/route.ts
          test -s workers/W01-payload/src/migrations/20260928_020000_MIG_AUTH_001_REGISTRATION_BATCH_V1.ts
          test -s workers/W01-payload/scripts/auth-001-registration-runtime-evidence-local.mjs
          test -z "$(git status --short)"

      - name: Install W02 dependencies
        working-directory: workers/W02-identity
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install W01 dependencies
        working-directory: workers/W01-payload
        run: pnpm install --frozen-lockfile

      # This evidence run intentionally remains isolated on local D1 even
      # though production W01 now selects Neon. getCloudflareContextFromWrangler()
      # reads the Wrangler vars, so override the local config as well as process env.
      - name: Force W01 local D1 driver and binding for registration evidence
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const path = 'workers/W01-payload/wrangler.jsonc'
          let config = fs.readFileSync(path, 'utf8')
          const remoteMarker = '"remote": true'
          const remoteCount = config.split(remoteMarker).length - 1
          if (remoteCount > 1) throw new Error('Expected at most one W01 remote D1 flag')
          if (remoteCount === 1) config = config.replace(remoteMarker, '"remote": false')
          const driverMarker = '"PAYLOAD_DATABASE_DRIVER": "neon"'
          const driverCount = config.split(driverMarker).length - 1
          if (driverCount !== 1) throw new Error('Expected exactly one W01 Neon production driver flag')
          config = config.replace(driverMarker, '"PAYLOAD_DATABASE_DRIVER": "d1"')
          if (!config.includes('"binding": "D1"')) throw new Error('W01 D1 binding is missing')
          fs.writeFileSync(path, config)
          NODE

      - name: Apply exact W01 local migrations
        working-directory: workers/W01-payload
        env:
          PAYLOAD_DATABASE_DRIVER: d1
          CLOUDFLARE_PERSIST_TO: /tmp/luckread-auth001-state
        run: pnpm payload migrate

      - name: Verify AUTH-001 registration idempotency source contract
        working-directory: workers/W01-payload
        run: pnpm exec vitest run tests/int/auth-registration-idempotency.int.spec.ts --config ./vitest.config.mts

      - name: Apply exact W02 Better Auth migrations
        working-directory: workers/W01-payload
        run: pnpm exec wrangler d1 migrations apply luckread --local --persist-to /tmp/luckread-auth001-state --config ../W02-identity/wrangler.jsonc

      - name: Build exact W01 OpenNext worker
        working-directory: workers/W01-payload
        env:
          NODE_ENV: production
          PAYLOAD_SECRET: ignore
        run: |
          set -euo pipefail
          pnpm exec opennextjs-cloudflare build > auth-001-open-next-build.log 2>&1

      - name: Start exact W02 local Worker runtime
        working-directory: workers/W02-identity
        env:
          NODE_ENV: development
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgresql://postgres:local_postgres_only@127.0.0.1:5432/luckread_auth001
        run: |
          set -euo pipefail
          pnpm --dir ../W01-payload exec wrangler dev --local --persist-to /tmp/luckread-auth001-state --config ../W02-identity/wrangler.jsonc --port 8788 --var "CLOUDFLARE_ENV:development" > auth-001-w02-preview.log 2>&1 &
          echo $! > auth-001-w02-preview.pid
          ready=0
          for _ in $(seq 1 120); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 2 http://127.0.0.1:8788/api/auth/get-session || true)
            if [ "$code" != "000" ]; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat auth-001-w02-preview.log
            exit 1
          fi

      - name: Start exact W01 local Worker runtime
        working-directory: workers/W01-payload
        env:
          NODE_ENV: production
          PAYLOAD_SECRET: ignore
        run: |
          set -euo pipefail
          pnpm exec wrangler dev --local --persist-to /tmp/luckread-auth001-state --port 8787 --var "PAYLOAD_SECRET:auth001-local-evidence-secret-20260928" --var "CLOUDFLARE_ENV:development" --var "PAYLOAD_DATABASE_DRIVER:d1" > auth-001-preview.log 2>&1 &
          sleep 5
          echo $! > auth-001-preview.pid
          ready=0
          for _ in $(seq 1 120); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 2 http://127.0.0.1:8787/ || true)
            if [ "$code" != "000" ]; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat auth-001-open-next-build.log
            cat auth-001-preview.log
            exit 1
          fi

      - name: Run AUTH-001 registration batch runtime evidence
        working-directory: workers/W01-payload
        env:
          AUTH001_BASE_URL: http://127.0.0.1:8787
          CLOUDFLARE_PERSIST_TO: /tmp/luckread-auth001-state
        run: |
          set -euo pipefail
          node --import=tsx/esm scripts/auth-001-registration-runtime-evidence-local.mjs
          test -s ../../artifacts/mapping-0/auth-001-runtime-local/runtime-result.json

      - name: Run AUTH-010 session list and revoke runtime evidence
        working-directory: workers/W01-payload
        env:
          AUTH001_BASE_URL: http://127.0.0.1:8787
          CLOUDFLARE_PERSIST_TO: /tmp/luckread-auth001-state
        run: |
          set -euo pipefail
          node --import=tsx/esm scripts/auth-010-session-list-runtime-evidence-local.mjs
          test -s ../../artifacts/mapping-0/auth-010-session-list-runtime-local/runtime-result.json

      - name: Dump W01 runtime log on evidence failure
        if: ${{ failure() }}
        working-directory: workers/W01-payload
        run: |
          echo "===== W01 OpenNext build log ====="
          tail -n 500 auth-001-open-next-build.log || true
          echo "===== W01 local preview log ====="
          tail -n 500 auth-001-preview.log || true
          echo "===== W02 local preview log ====="
          tail -n 500 ../W02-identity/auth-001-w02-preview.log || true

      - name: Upload same-SHA runtime evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: auth-001-registration-runtime-local-${{ steps.source.outputs.sha }}
          path: |
            artifacts/mapping-0/auth-001-runtime-local/
            artifacts/mapping-0/auth-010-session-list-runtime-local/
            workers/W01-payload/auth-001-open-next-build.log
            workers/W01-payload/auth-001-preview.log
            workers/W02-identity/auth-001-w02-preview.log
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup local runtime
        if: ${{ always() }}
        working-directory: workers/W01-payload
        run: |
          if [ -f auth-001-preview.pid ]; then kill "$(cat auth-001-preview.pid)" 2>/dev/null || true; fi
          if [ -f ../W02-identity/auth-001-w02-preview.pid ]; then kill "$(cat ../W02-identity/auth-001-w02-preview.pid)" 2>/dev/null || true; fi
          pkill -TERM -x workerd 2>/dev/null || true
          pkill -TERM -x esbuild 2>/dev/null || true