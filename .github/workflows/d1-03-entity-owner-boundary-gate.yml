name: D1-03 Entity Owner Boundary Gate

on:
  push:
    branches: [main]
    paths:
      - 'docs/09-D1-DOMAIN-MASTER-v1.0.md'
      - 'contracts/transport/d1-03-entity-owner-boundary.v1.json'
      - 'scripts/verify-d1-03-entity-owner-boundary.mjs'
      - '.github/workflows/d1-03-entity-owner-boundary-gate.yml'
  pull_request:
    paths:
      - 'docs/09-D1-DOMAIN-MASTER-v1.0.md'
      - 'contracts/transport/d1-03-entity-owner-boundary.v1.json'
      - 'scripts/verify-d1-03-entity-owner-boundary.mjs'
      - '.github/workflows/d1-03-entity-owner-boundary-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify D1-03 entity ownership
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify D1-03 entity ownership
        run: node scripts/verify-d1-03-entity-owner-boundary.mjs
