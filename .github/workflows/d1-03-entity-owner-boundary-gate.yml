name: D1-03 Entity Owner Boundary Gate

on:
  push:
    branches: [main]
    paths:
      - 'docs/09-D1-DOMAIN-MASTER-v1.0.md'
      - 'contracts/transport/d1-03-entity-owner-boundary.v1.json'
      - 'workers/W05-social/wrangler.jsonc'
      - 'workers/W05-social/src/index.ts'
      - 'workers/W05-social/src/push-endpoint-runtime.ts'
      - 'workers/W05-social/src/notification-push-delivery-runtime.ts'
      - 'contracts/transport/W05-W09-notification-push-delivery.v1.json'
      - 'workers/W09-platform/wrangler.d1-03-migrations.jsonc'
      - 'workers/W09-platform/migrations-d1-03/**'
      - 'contracts/schemas/common/audit-event.json'
      - 'contracts/database/neon-d1-03-w09-platform-schema.v1.json'
      - 'workers/W06-governance/README.md'
      - 'workers/W06-governance/migrations/README.md'
      - 'workers/W06-governance/migrations/0001_audit_event.sql'
      - 'workers/W09-platform/README.md'
      - 'workers/W09-platform/scripts/neon/**'
      - 'workers/W09-platform/src/neon-postgres-migrations/**'
      - '.github/workflows/neon-d1-03-w09-platform-postgres-rehearsal.yml'
      - 'scripts/verify-d1-03-entity-owner-boundary.mjs'
      - '.github/workflows/d1-03-entity-owner-boundary-gate.yml'
  pull_request:
    paths:
      - 'docs/09-D1-DOMAIN-MASTER-v1.0.md'
      - 'contracts/transport/d1-03-entity-owner-boundary.v1.json'
      - 'workers/W05-social/wrangler.jsonc'
      - 'workers/W05-social/src/index.ts'
      - 'workers/W05-social/src/push-endpoint-runtime.ts'
      - 'workers/W05-social/src/notification-push-delivery-runtime.ts'
      - 'contracts/transport/W05-W09-notification-push-delivery.v1.json'
      - 'workers/W09-platform/wrangler.d1-03-migrations.jsonc'
      - 'workers/W09-platform/migrations-d1-03/**'
      - 'contracts/schemas/common/audit-event.json'
      - 'contracts/database/neon-d1-03-w09-platform-schema.v1.json'
      - 'workers/W06-governance/README.md'
      - 'workers/W06-governance/migrations/README.md'
      - 'workers/W06-governance/migrations/0001_audit_event.sql'
      - 'workers/W09-platform/README.md'
      - 'workers/W09-platform/scripts/neon/**'
      - 'workers/W09-platform/src/neon-postgres-migrations/**'
      - '.github/workflows/neon-d1-03-w09-platform-postgres-rehearsal.yml'
      - 'scripts/verify-d1-03-entity-owner-boundary.mjs'
      - '.github/workflows/d1-03-entity-owner-boundary-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify D1-03 entity ownership
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify D1-03 entity ownership
        run: node scripts/verify-d1-03-entity-owner-boundary.mjs
