name: Actions Execution Probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - '.github/workflows/actions-execution-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    name: Actions Execution Probe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify runner execution
        shell: bash
        run: |
          set -euxo pipefail
          test -n "$GITHUB_SHA"
          test -d .git
          test -f AGENTS.md
          printf 'PROBE_SHA=%s\n' "$GITHUB_SHA"
          printf 'RUNNER_OS=%s\n' "$RUNNER_OS"
          node --version
          npm --version
      - name: Verify contract baseline
        shell: bash
        run: |
          set -euxo pipefail
          test -d contracts
          test -f scripts/contract-ci.mjs
