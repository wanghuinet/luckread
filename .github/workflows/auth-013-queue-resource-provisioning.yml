name: AUTH-013 Queue Resource Provisioning

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type CREATE to create the AUTH-013 queue and DLQ if missing"
        required: true
        type: string

permissions:
  contents: read

jobs:
  provision:
    if: ${{ inputs.confirm == 'CREATE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Install Wrangler
        run: npm install --global wrangler@4.116.0

      - name: Inspect existing queues
        run: wrangler queues list > queues-before.txt

      - name: Create AUTH-013 queue if missing
        run: |
          if grep -Fq 'luckread-auth013-account-state' queues-before.txt; then
            echo "AUTH013_QUEUE_EXISTS=true"
          else
            wrangler queues create luckread-auth013-account-state
          fi

      - name: Create AUTH-013 DLQ if missing
        run: |
          if grep -Fq 'luckread-auth013-account-state-dlq' queues-before.txt; then
            echo "AUTH013_DLQ_EXISTS=true"
          else
            wrangler queues create luckread-auth013-account-state-dlq
          fi

      - name: Verify queue inventory
        run: |
          wrangler queues list > queues-after.txt
          for name in luckread-auth013-account-state luckread-auth013-account-state-dlq; do
            grep -Fq "$name" queues-after.txt || { echo "Missing queue: $name"; exit 1; }
          done
          echo "AUTH-013_QUEUE_RESOURCES_GREEN"
