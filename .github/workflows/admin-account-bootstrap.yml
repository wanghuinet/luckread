name: Admin Account Bootstrap

on:
  workflow_dispatch:
    inputs:
      better_auth_user_id:
        description: Existing Better Auth user id to receive the one-time super_admin role binding
        required: true
        type: string
      confirm:
        description: Type APPLY_WANGHUI_L8 to permit the one-time admin role binding
        required: true
        default: APPLY_WANGHUI_L8
        type: string

permissions:
  contents: read

jobs:
  bootstrap:
    if: ${{ inputs.confirm == 'APPLY_WANGHUI_L8' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATABASE_NAME: luckread
      BETTER_AUTH_USER_ID: ${{ inputs.better_auth_user_id }}

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate Better Auth target
        run: |
          set -euo pipefail
          test "$DATABASE_NAME" = "luckread"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          node --input-type=module - <<'NODE'
          const id = process.env.BETTER_AUTH_USER_ID
          if (!/^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$/.test(id || '')) {
            throw new Error('BETTER_AUTH_USER_ID has an invalid format')
          }
          NODE

      - name: Preflight Better Auth identity
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          const id = process.env.BETTER_AUTH_USER_ID.replaceAll("'", "''")
          fs.writeFileSync('/tmp/admin-better-auth-preflight.sql',
            "SELECT u.id, u.email, u.username, u.account_state, " +
            "a.id AS credential_account_id, " +
            "CASE WHEN a.password IS NULL OR a.password = '' THEN 0 ELSE 1 END AS credential_password_present " +
            "FROM \"user\" AS u LEFT JOIN \"account\" AS a " +
            "ON a.user_id=u.id AND a.provider_id='credential' " +
            "WHERE u.id='" + id + "' LIMIT 1;"
          )
          NODE

          npx --yes wrangler@4.116.0 d1 execute "$DATABASE_NAME" --remote --json --config workers/W01-payload/wrangler.jsonc             --file=/tmp/admin-better-auth-preflight.sql > /tmp/admin-better-auth-preflight.json

          node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          const rows = JSON.parse(fs.readFileSync('/tmp/admin-better-auth-preflight.json','utf8'))?.[0]?.results ?? []
          if (rows.length !== 1) throw new Error('Better Auth target user does not exist exactly once')
          const user = rows[0]
          if (String(user.id) !== process.env.BETTER_AUTH_USER_ID) throw new Error('Better Auth target identity id mismatch')
          if (user.account_state !== 'ACTIVE') throw new Error('Better Auth target identity is not ACTIVE')
          if (!user.credential_account_id || Number(user.credential_password_present) !== 1) {
            throw new Error('Better Auth credential account/password is missing')
          }
          console.log(JSON.stringify({
            betterAuthUserId: user.id,
            email: user.email,
            username: user.username,
            accountState: user.account_state,
            credentialPasswordPresent: true,
          }))
          NODE

      - name: Prepare Better Auth admin role binding
        env:
          BETTER_AUTH_USER_ID: ${{ env.BETTER_AUTH_USER_ID }}
          ROLE_ASSIGNMENT_ID: admin-bootstrap-1-super-admin
        run: |
          set -euo pipefail
          node scripts/admin-account-bootstrap.mjs
          chmod 600 /tmp/luckread-admin-bootstrap.sql /tmp/luckread-admin-bootstrap-meta.json
          cat /tmp/luckread-admin-bootstrap-meta.json

      - name: Apply Better Auth admin role binding
        run: |
          set -euo pipefail
          npx --yes wrangler@4.116.0 d1 execute "$DATABASE_NAME" --remote --config workers/W01-payload/wrangler.jsonc             --file=/tmp/luckread-admin-bootstrap.sql

      - name: Verify Better Auth admin role binding
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          const id = process.env.BETTER_AUTH_USER_ID.replaceAll("'", "''")
          fs.writeFileSync('/tmp/admin-role-post.sql',
            "SELECT id,subject_id,role_id,scope_type,status,valid_from,valid_until " +
            "FROM role_assignments WHERE subject_id='" + id + "' " +
            "AND role_id='super_admin' AND scope_type='global' AND status='ACTIVE';"
          )
          NODE
          npx --yes wrangler@4.116.0 d1 execute "$DATABASE_NAME" --remote --json --config workers/W01-payload/wrangler.jsonc             --file=/tmp/admin-role-post.sql > /tmp/admin-role-post.json

          node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          const rows = JSON.parse(fs.readFileSync('/tmp/admin-role-post.json','utf8'))?.[0]?.results ?? []
          if (rows.length < 1) throw new Error('L8 super_admin role assignment missing for Better Auth admin identity')
          console.log(JSON.stringify({
            betterAuthUserId: rows[0].subject_id,
            activeSuperAdminAssignments: rows.length,
          }))
          NODE

      - name: Secure cleanup
        if: always()
        run: |
          rm -f /tmp/luckread-admin-bootstrap.sql /tmp/luckread-admin-bootstrap-meta.json             /tmp/admin-better-auth-preflight.sql /tmp/admin-better-auth-preflight.json             /tmp/admin-role-post.sql /tmp/admin-role-post.json
