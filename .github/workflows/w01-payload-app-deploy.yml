name: W01 Payload Application Deploy

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit already contained in protected main
        required: true
        type: string
      confirm:
        description: Type DEPLOY to publish W01 to the configured production routes
        required: true
        default: NO
        type: string

permissions:
  actions: read
  contents: read
  deployments: read
  pull-requests: read

concurrency:
  group: w01-payload-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm == 'DEPLOY' && github.ref == 'refs/heads/main' && github.ref_protected == true }}
    runs-on: ubuntu-latest
    environment: auth-mfa-rollout
    timeout-minutes: 30
    steps:
      - name: Checkout protected main for source validation
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate immutable source SHA is committed to protected main
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_sha must be a full 40-character commit SHA"
            exit 1
          fi
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main || {
            echo "source_sha must be an immutable commit already contained in protected main"
            exit 1
          }

      - name: Checkout exact approved source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Verify protected AUTH-007 rollout admission before W01 production deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
          AUTH007_ROLLOUT_ENVIRONMENT: auth-mfa-rollout
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: node scripts/verify-auth-007-rollout-admission.mjs

      - name: Record deployment source
        id: source
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          {
            echo "### W01 production application deployment"
            echo
            echo "- Source commit: `$source_sha`"
            echo "- Target Worker: `luckread-w01-payload`"
            echo "- Production route includes: `mp.luckread.com`"
            echo "- D1 migrations: not run"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install W01 dependencies
        working-directory: workers/W01-payload
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck W01
        working-directory: workers/W01-payload
        run: pnpm exec tsc --noEmit

      - name: Run W01 unit and security tests
        working-directory: workers/W01-payload
        run: pnpm exec vitest run --passWithNoTests --config ./vitest.config.mts

      - name: Lint W01
        working-directory: workers/W01-payload
        run: pnpm run lint

      - name: Deploy W01 application only
        working-directory: workers/W01-payload
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm run deploy:app
