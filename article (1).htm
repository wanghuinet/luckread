      .skeleton-warp .flow {
          position: relative;
      }

      .skeleton-warp .flow:after {
          content: '';
          position: absolute;
          left: 0;
          top: 5%;
          bottom: 5%;
          width: 50%;
          background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.49), rgba(255, 255, 255, 0));
          animation: flow 1s infinite linear alternate ;

                      contentWidth = 1283
                    }
                    const contentDom = document.getElementById('skeleton-content')
                    if (contentDom){
                      contentDom.style.width = contentWidth+'px'
                      for (let i = 0; i < 13; i++) {
                        const block = document.createElement('div')
                        block.setAttribute('class', 'block flow')
                        contentDom.appendChild(block)
                      }
                    }
                  </script>
