  /webhooks/revenuecat:
    post:
      tags: [Commerce]
      summary: Receive a RevenueCat provider webhook
      description: >-
        Public provider callback ingress has no browser-session authentication.
        W01 preserves the bounded raw payload and the configured RevenueCat
        Authorization value. W07 always validates Authorization and validates
        X-RevenueCat-Webhook-Signature HMAC-SHA256 over the exact raw body when
        HMAC signing is enabled for the integration. A durable receipt does not
        itself activate a LuckRead subscription or entitlement. New/duplicate
        events are acknowledged only after the inbox decision is durable.
      security: []
      operationId: receiveRevenueCatWebhook
      x-luckread-runtime-status: IMPLEMENTED_SOURCE_ONLY_PENDING_D1_04_MIGRATION_AND_REVENUECAT_CONFIGURATION
      x-luckread-max-body-bytes: 1048576
      parameters:
        - name: Authorization
          in: header
          required: true
          description: Exact Authorization header value configured for this RevenueCat webhook integration.
          schema:
            type: string
            minLength: 1
            maxLength: 5000
        - name: X-RevenueCat-Webhook-Signature
          in: header
          required: false
          description: Required whenever RevenueCat HMAC signing is enabled; t=Unix timestamp and v1=HMAC-SHA256 hex digest over timestamp dot exact raw request bytes.
          schema:
            type: string
            pattern: '^t=[0-9]{1,12},v1=[0-9a-f]{64}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_version, event]
              additionalProperties: true
      responses:
        '200':
          description: Durable receipt, duplicate, conflict, or RevenueCat dashboard TEST event acknowledged; no entitlement is granted by this endpoint.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400':
          description: Malformed or unsupported webhook envelope.
        '401':
          description: RevenueCat Authorization or enabled HMAC signature is invalid.
        '413':
          description: Webhook body exceeds 1 MiB.
        '503':
          description: Configuration or durable D1-04 receipt persistence is unavailable.

  /webhooks/hyperswitch:
    post:
      tags: [Commerce]
      summary: Receive a signed Hyperswitch provider webhook
      description: >-
        Provider callback ingress has no browser-session authentication. W01
        preserves the bounded raw payload and signature; W07 validates
        X-Webhook-Signature-512 using HMAC-SHA512 and durably deduplicates the
        provider event before acknowledging it. A recorded event does not by
        itself activate a subscription entitlement.
      security: []
      operationId: receiveHyperswitchPaymentWebhook
      x-luckread-runtime-status: IMPLEMENTED_SOURCE_ONLY_PENDING_D1_04_MIGRATION_AND_SECRETS
      x-luckread-max-body-bytes: 1048576
      parameters:
        - name: X-Webhook-Signature-512
          in: header
          required: true
          description: HMAC-SHA512 hexadecimal digest for the exact raw request bytes.
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{128}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Provider envelope; W01 forwards exact serialized bytes without parsing or re-serialization.
              additionalProperties: true
      responses:
        '200':
          description: Event receipt was applied or a previously processed event was recognized as a duplicate.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HyperswitchWebhookReceiptResponse' }
        '202':
          description: Event was durably recorded but was semantically rejected, requires reconciliation, or contains a payload conflict.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HyperswitchWebhookReceiptResponse' }
        '4XX': { $ref: '#/components/responses/ClientError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

