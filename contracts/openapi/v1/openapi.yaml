  /commerce/orders:
    post:
      tags: [Commerce]
      summary: Create a purchase order
      description: >-
        Contracted request and response shape only. Runtime creation remains blocked
        until PAY-002 authoritative offer resolution, D1-04 persistence, atomic
        idempotency, and security evidence are admitted. All item versions and
        prices are resolved by the server; client-supplied totals and payment state
        are never accepted.
      operationId: createCommerceOrder
      x-luckread-runtime-status: BLOCKED_PENDING_PAY002_EVIDENCE
      x-luckread-max-body-bytes: 16384
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommerceOrderCreateRequest'
      responses:
        '201':
          description: Order contract response; runtime creation is not yet enabled.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommerceOrderResponse' }
        '4XX': { $ref: '#/components/responses/ClientError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /commerce/orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
    get:
      tags: [Commerce]
      summary: Get an order owned by the current principal
      description: >-
        Owner-only order read contract. The runtime handler remains blocked
        until PAY-002 persistence and owner-isolation evidence are admitted.
      operationId: getCommerceOrder
      x-luckread-runtime-status: BLOCKED_PENDING_PAY002_EVIDENCE
      responses:
        '200':
          description: Order response.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommerceOrderResponse' }
        '4XX': { $ref: '#/components/responses/ClientError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /membership/plans:
    get:
      tags: [Creators]
      summary: List the authenticated creator's own membership plans
      operationId: listOwnMembershipPlans
      description: Requires membership.plan.read.own. W08 resolves the active creator identity; only that creator's plans, including private drafts, are returned.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 2048 }
      responses:
        '200':
          description: Creator-owned plan list.
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    required: [docs, limit, hasMore, nextCursor]
                    properties:
                      docs:
                        type: array
                        items:
                          type: object
                          required: [planId, creatorId, planVersion, name, tier, billingInterval, priceMinor, currency, benefits, status, visibility, version, createdAt, updatedAt, etag]
                          properties:
                            planId: { type: string }
                            creatorId: { type: string }
                            planVersion: { type: integer, minimum: 1 }
                            name: { type: string, minLength: 1, maxLength: 120 }
                            tier: { type: string, minLength: 1, maxLength: 64 }
                            billingInterval: { type: string, enum: [MONTHLY, YEARLY] }
                            priceMinor: { type: integer, minimum: 0, maximum: 2147483647 }
                            currency: { type: string, pattern: '^[A-Z]{3}$' }
                            benefits: { type: array, items: { type: string, minLength: 1, maxLength: 180 } }
                            status: { type: string, enum: [DRAFT, ACTIVE, PAUSED, RETIRED] }
                            visibility: { type: string, enum: [PRIVATE, PUBLIC] }
                            version: { type: integer, minimum: 1 }
                            createdAt: { type: string, format: date-time }
                            updatedAt: { type: string, format: date-time }
                            etag: { type: string }
                      limit: { type: integer, minimum: 1, maximum: 50 }
                      hasMore: { type: boolean }
                      nextCursor: { type: [string, 'null'], maxLength: 2048 }
                  requestId: { $ref: '#/components/schemas/RequestId' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        default: { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Creators]
      summary: Create a private membership plan draft
      operationId: createOwnMembershipPlanDraft
      description: Requires membership.plan.create.own. Creator ID, plan ID, version, status and visibility are server-controlled. No subscription, payment or entitlement is created.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, tier, billingInterval, priceMinor, currency, benefits]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                tier: { type: string, pattern: '^[a-z][a-z0-9_-]{0,63}$' }
                billingInterval: { type: string, enum: [MONTHLY, YEARLY] }
                priceMinor: { type: integer, minimum: 0, maximum: 2147483647 }
                currency: { type: string, pattern: '^[A-Z]{3}$' }
                benefits:
                  type: array
                  maxItems: 20
                  items: { type: string, minLength: 1, maxLength: 180 }
      responses:
        '201':
          description: Private draft created.
          headers:
            ETag:
              schema: { $ref: '#/components/schemas/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    required: [planId, creatorId, planVersion, name, tier, billingInterval, priceMinor, currency, benefits, status, visibility, version, createdAt, updatedAt, etag, replayed]
                    properties:
                      planId: { type: string }
                      creatorId: { type: string }
                      planVersion: { type: integer, const: 1 }
                      name: { type: string }
                      tier: { type: string }
                      billingInterval: { type: string, enum: [MONTHLY, YEARLY] }
                      priceMinor: { type: integer, minimum: 0, maximum: 2147483647 }
                      currency: { type: string, pattern: '^[A-Z]{3}$' }
                      benefits: { type: array, items: { type: string } }
                      status: { type: string, const: DRAFT }
                      visibility: { type: string, const: PRIVATE }
                      version: { type: integer, const: 1 }
                      createdAt: { type: string, format: date-time }
                      updatedAt: { type: string, format: date-time }
                      etag: { type: string }
                      replayed: { type: boolean, const: false }
                  requestId: { $ref: '#/components/schemas/RequestId' }
        '200':
          description: Idempotent replay of the original create result.
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    required: [planId, creatorId, planVersion, status, visibility, replayed]
                    properties:
                      planId: { type: string }
                      creatorId: { type: string }
                      planVersion: { type: integer, const: 1 }
                      status: { type: string, const: DRAFT }
                      visibility: { type: string, const: PRIVATE }
                      replayed: { type: boolean, const: true }
                  requestId: { $ref: '#/components/schemas/RequestId' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '409': { $ref: '#/components/responses/ClientError' }
        '428': { $ref: '#/components/responses/IdempotencyKeyRequired' }
        default: { $ref: '#/components/responses/ServiceUnavailable' }

