        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '503': { $ref: '#/components/responses/ClientError' }
    post:
      tags: [Creators]
      summary: Approve or reject a creator application
      operationId: decideCreatorApplication
      description: >-
        Requires global L7 or L8 authorization. A reviewer cannot decide their
        own application. If-Match and Idempotency-Key prevent stale and
        duplicate decisions. An APPROVED application is not active for L3
        capabilities until W02 confirms the L3 RoleAssignment.
      security:
        - sessionCookieAuth: []
        - bearerAuth: []
