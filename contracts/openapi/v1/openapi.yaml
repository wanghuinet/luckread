      responses:
        '201': { description: Prorated upgrade order created; subscription remains unchanged pending provider confirmation. }
        '200': { description: Idempotent replay of the same upgrade checkout order. }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '4XX': { $ref: '#/components/responses/ClientError' }
