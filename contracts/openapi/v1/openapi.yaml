      summary: Create a payment order for an immediate prorated subscription upgrade
      description: Creates an authoritative order for a same-interval upgrade. The existing subscription and its entitlements remain unchanged until W07 confirms the signed Hyperswitch payment-success webhook and applies the subscription version compare-and-set. The amount is finalized by the configured commerce pricing and tax pipeline.
      operationId: checkoutSubscriptionPlanUpgrade
