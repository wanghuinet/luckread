    parameters:
      - name: planId
        in: path
        required: true
        schema: { type: string, pattern: '^plan_[a-f0-9]{64}$' }
    post:
      tags: [Creators]
      summary: Publish the authenticated creator's membership plan draft
      operationId: publishOwnMembershipPlan
      description: >-
        Requires membership.plan.publish.own and an ACTIVE creator identity.
        If-Match must match the current plan ETag. W07 performs an owner-scoped
        version-CAS transition from DRAFT/PRIVATE to ACTIVE/PUBLIC only when an
        immutable current plan version exists. W01 confirms a durable W06
        publish-intent audit before calling W07 and the immutable published
        event afterward. Publishing does not create a subscription, order,
        payment, or entitlement.
      security:
        - sessionCookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
      responses:
        '200':
          description: Plan published or exact publication retry confirmed.
          headers:
            ETag:
              schema: { $ref: '#/components/schemas/ETag' }
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    required: [planId, creatorId, planVersion, status, visibility, version, etag, replayed, name, tier, billingInterval, priceMinor, currency, benefits, createdAt, updatedAt]
