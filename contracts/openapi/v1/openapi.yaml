openapi: 3.1.0
info:
  title: LuckRead API
  version: 1.0.0
  description: >-
    Contract-first public API for the LuckRead self-media platform.
    All endpoints are authorization-enforced. Cache is never an authorization
    boundary (see AUTHZ-CACHE-INVARIANT-001). Errors use the canonical error
    contract. List endpoints use opaque cursors, never offset, for large sets.
  license:
    name: Proprietary
    identifier: proprietary
servers:
  - url: https://api.luckread.com/v1
    description: Canonical public API v1
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Authentication and session lifecycle operations.
  - name: Users
    description: User profile and account lifecycle operations.
  - name: Contents
    description: Content creation, retrieval, updates, deletion, and lifecycle.
  - name: Media
    description: Media upload initiation and metadata operations.
  - name: Comments
    description: Content comment and discussion operations.
  - name: Interactions
    description: Likes, follows, and other social interactions.
  - name: Feed
    description: Personalized and discovery feed operations.
  - name: Search
    description: Content search operations.
  - name: Notifications
    description: User notification operations.
  - name: Commerce
    description: Purchase order contracts; runtime availability is separately gated.
  - name: Creators
    description: Creator profile and creator-facing operations.
  - name: IPs
    description: Intellectual-property center and membership operations.
  - name: Organizations
    description: Organization lifecycle operations.
  - name: Admin
    description: Administrative and moderation operations.
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new account
      security: []
      operationId: authRegister
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identityType, identity, credential, username, consent]
              properties:
                identityType: { enum: [email] }
                identity: { type: string }
                credential: { type: string, format: password }
                username: { type: string }
                consent:
                  $ref: '#/components/schemas/AuthRegistrationConsent'
      responses:
        '201':
          description: Registered. Account enters PENDING_VERIFICATION.
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId: { $ref: '#/components/schemas/ResourceId' }
                  accountState: { $ref: '#/components/schemas/AccountState' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and establish the canonical LuckRead session
      description: >-
        Browser clients retain the HttpOnly session cookie from Set-Cookie.
        Native clients read X-LuckRead-Session-Token and send it as
        Authorization: Bearer <token>. Both carriers address the same
        Better Auth server-side session. The opaque credential is never
        included in the JSON body; this operation does not issue refresh tokens.
      security: []
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identity, credential]
              additionalProperties: false
              properties:
                identity:
                  type: string
                  format: email
                  maxLength: 254
                credential:
                  type: string
                  format: password
                  minLength: 1
                  writeOnly: true
      responses:
        '200':
          description: Authenticated; a single native session is established.
          headers:
            X-LuckRead-Session-Token:
              required: true
              description: Opaque session credential for native clients. Send as Authorization Bearer; store only in platform secure storage.
              schema: { type: string, minLength: 1 }
            Set-Cookie:
              description: HttpOnly browser session cookie; clients should use a cookie jar and must not parse or construct the cookie manually.
              schema: { type: string }
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                additionalProperties: false
                properties:
                  data:
                    type: object
                    required: [user]
                    additionalProperties: false
                    properties:
                      user:
                        $ref: '#/components/schemas/AuthSessionUser'
                  requestId: { type: string }
        '202':
          description: MFA challenge required; no authenticated session is issued until the challenge is verified.
          headers:
            Set-Cookie:
              description: Short-lived HttpOnly MFA challenge cookie issued by W02.
              schema: { type: string }
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthMfaChallengeRequired' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '403':
          description: Email verification is required before sign-in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: Authentication service unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/principal:
    get:
      tags: [Auth]
      summary: Read the authenticated identity and authorization layer through W01
      description: >-
        Returns the minimal active W02 principal fields needed by server-rendered
        W01 pages. The endpoint never exposes session tokens or role-assignment records.
        Successful responses are never cached.
      operationId: authPrincipalGet
      security:
        - sessionCookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated principal.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                additionalProperties: false
                properties:
                  data:
                    type: object
                    required: [active, userId, email, username, layer]
                    additionalProperties: false
                    properties:
                      active: { type: boolean }
                      userId: { type: string, minLength: 1 }
                      email: { type: string, format: email }
                      username: { type: string, nullable: true }
                      layer: { type: string, nullable: true }
                  requestId: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: Authentication service unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/session:
    get:
      tags: [Auth]
      summary: Read and validate the current session
      description: >-
        Use either the browser session cookie or the opaque token returned in
        X-LuckRead-Session-Token as Authorization: Bearer <token>. Returns the
        same session and user for either carrier. No valid session returns 401.
        Successful responses are never cached.
      operationId: authSessionGet
      security:
        - sessionCookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Current session is valid.
          headers:
            X-LuckRead-Session-Token:
              description: Updated opaque session credential when the auth authority returns one.
              schema: { type: string, minLength: 1 }
            Set-Cookie:
              description: Session cookie update, if emitted by the auth authority.
              schema: { type: string }
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                additionalProperties: false
                properties:
                  data:
                    type: object
                    required: [session, user]
                    additionalProperties: false
                    properties:
                      session:
                        type: object
                        required: [id, expiresAt]
                        additionalProperties: false
                        properties:
                          id: { $ref: '#/components/schemas/ResourceId' }
                          expiresAt: { type: string, format: date-time }
                      user:
                        $ref: '#/components/schemas/AuthSessionUser'
                  requestId: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: Authentication service unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session
      description: >-
        Accepts the same browser cookie or native Bearer session credential
        used by protected APIs. Returns no body and clears the browser cookie
        when present. The revoked credential must not be reused.
      operationId: authLogout
      security:
        - sessionCookieAuth: []
        - bearerAuth: []
      responses:
        '204':
          description: Logged out; no response body.
          headers:
            Set-Cookie:
              description: Expired session cookie, when cookie authentication was used.
              schema: { type: string }
            Cache-Control:
              schema: { type: string, const: no-store }
        '503':
          description: Authentication service unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/password/change:
    post:
      tags: [Auth]
      summary: Change the current user's password
      security:
        - bearerAuth: []
      operationId: authPasswordChange
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              additionalProperties: false
              properties:
                currentPassword:
                  type: string
                  format: password
                  minLength: 15
                  maxLength: 128
                  writeOnly: true
                newPassword:
                  type: string
                  format: password
                  minLength: 15
                  maxLength: 128
                  writeOnly: true
                  description: Must satisfy the canonical password policy, including compromised-password screening.
      responses:
        '204':
          description: Password changed; no response body.
        '4XX': { $ref: '#/components/responses/ClientError' }

  /auth/password/reset/request:
    post:
      tags: [Auth]
      summary: Request a password recovery email or equivalent asynchronous delivery
      security: []
      operationId: authPasswordResetRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier]
              additionalProperties: false
              properties:
                identifier:
                  type: string
                  minLength: 1
                  description: Account/recovery identifier. Public semantics must not disclose whether an account exists.
      responses:
        '202':
          description: Recovery request accepted; no response body.
        '4XX': { $ref: '#/components/responses/ClientError' }

  /auth/password/reset/confirm:
    post:
      tags: [Auth]
      summary: Confirm a password recovery request
      security: []
      operationId: authPasswordResetConfirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recoveryToken, newPassword]
              additionalProperties: false
              properties:
                recoveryToken:
                  type: string
                  minLength: 1
                  writeOnly: true
                newPassword:
                  type: string
                  format: password
                  minLength: 15
                  maxLength: 128
                  writeOnly: true
                  description: Must satisfy the canonical password policy, including compromised-password screening.
      responses:
        '204':
          description: Password reset completed; no response body.
        '4XX': { $ref: '#/components/responses/ClientError' }

  /auth/credentials:
    get:
      tags: [Auth]
      summary: List current user's credentials
      operationId: authCredentialList
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Current user's credentials using the canonical cursor-paginated envelope; deterministic order is createdAt DESC, credentialId DESC.
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                additionalProperties: false
                properties:
                  data:
                    type: object
                    required: [items, nextCursor, hasMore]
                    additionalProperties: false
                    properties:
                      items:
                        type: array
                        maxItems: 100
                        items:
                          $ref: '#/components/schemas/Credential'
                      nextCursor:
                        anyOf:
                          - $ref: '#/components/schemas/Cursor'
                          - type: 'null'
                      hasMore:
                        type: boolean
                  requestId:
                    $ref: '#/components/schemas/RequestId'
                  traceId:
                    $ref: '#/components/schemas/TraceId'
        '400': { $ref: '#/components/responses/InvalidCursor' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '422': { $ref: '#/components/responses/ClientError' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Auth]
      summary: Add a credential for the current user
      operationId: authCredentialAdd
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, value]
              additionalProperties: false
              properties:
                kind:
                  type: string
                  enum: [username, email, phone]
                value:
                  type: string
                  minLength: 1
      responses:
        '201':
          description: Credential added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credential' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '409': { $ref: '#/components/responses/ClientError' }
        '422': { $ref: '#/components/responses/ClientError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/credentials/{credentialId}:
    parameters:
      - $ref: '#/components/parameters/CredentialId'
    put:
      tags: [Auth]
      summary: Replace a credential value for the current user
      operationId: authCredentialReplace
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              additionalProperties: false
              properties:
                value:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Credential replaced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Credential' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ClientError' }
        '422': { $ref: '#/components/responses/ClientError' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [Auth]
      summary: Remove a credential from the current user
      operationId: authCredentialRemove
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      responses:
        '204':
          description: Credential removed or already-retired for the current user.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ClientError' }
        '422': { $ref: '#/components/responses/ClientError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/sessions:
    get:
      tags: [Auth]
      summary: List current user's sessions
      operationId: authSessionList
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Current user's sessions.
          content:
            application/json:
              schema:
                type: object
                required: [items, currentSessionId]
                properties:
                  items:
                    type: array
                    maxItems: 50
                    items:
                      type: object
                      required: [sessionId, createdAt, expiresAt]
                      properties:
                        sessionId:
                          $ref: '#/components/schemas/ResourceId'
                        deviceId:
                          $ref: '#/components/schemas/ResourceId'
                        createdAt:
                          type: string
                          format: date-time
                        expiresAt:
                          type: string
                          format: date-time
                        lastSeenAt:
                          type: string
                          format: date-time
                          nullable: true
                  currentSessionId:
                    $ref: '#/components/schemas/ResourceId'
                  nextCursor:
                    type: string
                    nullable: true
        '4XX': { $ref: '#/components/responses/ClientError' }

  /auth/sessions/{sessionId}:
    delete:
      tags: [Auth]
      summary: Revoke one current user's session
      operationId: authSessionRevoke
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      responses:
        '204':
          description: Session revoked or already-revoked owned session.
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '4XX': { $ref: '#/components/responses/ClientError' }

  /auth/mfa:
    get:
      tags: [Auth]
      summary: Read the current user's MFA status
      operationId: authMfaStatus
      responses:
        '200':
          description: Factor state projected by W02; never includes factor secrets or internal lockout/replay data.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthMfaStatus' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/mfa/enrollment:
    post:
      tags: [Auth]
      summary: Start authenticated TOTP enrollment
      description: >-
        W01 validates the request and forwards it to W02. The secret-bearing
        TOTP URI and plaintext recovery codes are returned only in this
        no-store response and must never be logged or cached. Enrollment is
        pending until a separate valid TOTP confirmation succeeds.
      operationId: authMfaEnrollmentStart
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthMfaEnrollmentStartRequest' }
      responses:
        '200':
          description: Pending enrollment; TOTP URI and recovery codes disclosed once.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthMfaEnrollmentStartResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '409': { $ref: '#/components/responses/ClientError' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/mfa/enrollment/confirm:
    post:
      tags: [Auth]
      summary: Confirm TOTP enrollment with a valid one-time code
      operationId: authMfaEnrollmentConfirm
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthMfaEnrollmentConfirmRequest' }
      responses:
        '200':
          description: Enrollment confirmed and factor state updated by W02.
          headers:
            X-LuckRead-Session-Token:
              description: Rotated native session credential, when Better Auth refreshes the current session.
              schema: { type: string }
            Set-Cookie:
              description: Refreshed HttpOnly browser session cookie, when issued by W02.
              schema: { type: string }
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthMfaStatus' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '409': { $ref: '#/components/responses/ClientError' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/mfa/challenge/verify:
    post:
      tags: [Auth]
      summary: Complete a login MFA challenge
      description: >-
        This operation consumes a short-lived, identity-bound W02 challenge
        cookie created by authLogin. It accepts a TOTP or single-use recovery
        code, but never accepts trust-device flags or caller-supplied assurance.
      security: []
      operationId: authMfaChallengeVerify
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthMfaChallengeVerifyRequest' }
      responses:
        '200':
          description: Challenge consumed and authentication completed.
          headers:
            X-LuckRead-Session-Token:
              required: true
              description: Opaque native session credential; never returned in JSON.
              schema: { type: string, minLength: 1 }
            Set-Cookie:
              description: HttpOnly browser session cookie.
              schema: { type: string }
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthMfaChallengeVerifyResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/ClientError' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/mfa/disable:
    post:
      tags: [Auth]
      summary: Disable the current user's MFA factor after password and TOTP step-up
      description: Disabling MFA cannot rely on a password check alone; a valid TOTP step-up is required.
      operationId: authMfaDisable
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthMfaDisableRequest' }
      responses:
        '204':
          description: MFA disabled by W02; existing sessions are invalidated and privileged access fails closed.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '409': { $ref: '#/components/responses/ClientError' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/mfa/recovery-codes/rotate:
    post:
      tags: [Auth]
      summary: Rotate recovery codes after password and TOTP step-up
      description: Old recovery codes are atomically invalidated; new plaintext codes are disclosed once.
      operationId: authMfaRecoveryCodesRotate
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthMfaRecoveryCodesRotateRequest' }
      responses:
        '200':
          description: New one-time recovery codes; old recovery codes are no longer valid.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthMfaRecoveryCodesRotateResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '409': { $ref: '#/components/responses/ClientError' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      operationId: getMe
      responses:
        '200':
          description: Current user profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '4XX': { $ref: '#/components/responses/ClientError' }
    patch:
      tags: [Users]
      summary: Update current user profile
      operationId: updateMe
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /users/{userId}/account-state:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Users, Admin]
      summary: Transition account lifecycle state
      operationId: transitionAccountState
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, reason]
              properties:
                to: { $ref: '#/components/schemas/AccountState' }
                reason: { type: string, maxLength: 2048 }
      responses:
        '200':
          description: Transitioned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  from: { $ref: '#/components/schemas/AccountState' }
                  to: { $ref: '#/components/schemas/AccountState' }
                  auditEventId: { $ref: '#/components/schemas/ResourceId' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /contents:
    get:
      tags: [Contents]
      summary: List content
      operationId: listContents
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Content list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListResponse' }
        '4XX': { $ref: '#/components/responses/ClientError' }
    post:
      tags: [Contents]
      summary: Create content draft
      operationId: createContent
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentInput' }
      responses:
        '201':
          description: Created in DRAFT.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Content' }
        '403': { $ref: '#/components/responses/PermissionDenied' }

  /contents/{contentId}:
    parameters:
      - $ref: '#/components/parameters/ContentId'
    get:
      tags: [Contents]
      summary: Get content by ID
      operationId: getContent
      responses:
        '200':
          description: >-
            Content. Returns 404 rather than 403 when the caller may not access
            it, to avoid existence disclosure.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Content' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Contents]
      summary: Update content
      operationId: updateContent
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentInput' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Content' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      tags: [Contents]
      summary: Delete content
      operationId: deleteContent
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      responses:
        '204':
          description: Soft-deleted.
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /contents/{contentId}/state:
    parameters:
      - $ref: '#/components/parameters/ContentId'
    post:
      tags: [Contents]
      summary: Transition content lifecycle state
      operationId: transitionContentState
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { $ref: '#/components/schemas/ContentState' }
                scheduledAt: { type: string, format: date-time }
                reason: { type: string }
      responses:
        '200':
          description: Transitioned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  from: { $ref: '#/components/schemas/ContentState' }
                  to: { $ref: '#/components/schemas/ContentState' }
                  version: { type: integer }
                  etag: { $ref: '#/components/schemas/ETag' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /media:
    post:
      tags: [Media]
      summary: Initiate an upload (single or multipart)
      operationId: createMedia
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mimeType, size, checksum]
              properties:
                mimeType: { type: string }
                size: { type: integer, minimum: 1 }
                checksum:
                  type: string
                  description: SHA-256 of the object
                multipart: { type: boolean }
      responses:
        '201':
          description: Upload initiated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Media' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /media/{mediaId}:
    parameters:
      - $ref: '#/components/parameters/MediaId'
    get:
      tags: [Media]
      summary: Get media metadata
      operationId: getMedia
      responses:
        '200':
          description: Media metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Media' }
        '404': { $ref: '#/components/responses/NotFound' }

    delete:
      tags: [Media]
      summary: Discovery draft for DELETE undefined
      operationId: deleteMedia
      x-luckread-contract-status: DISCOVERY_DRAFT
      x-luckread-source: contracts/api/api-inventory.v1.json
      responses:
        default:
          description: Discovery-only operation; detailed response contract remains to be closed.
  /contents/{contentId}/comments:
    parameters:
      - $ref: '#/components/parameters/ContentId'
    get:
      tags: [Comments]
      summary: List content comments
      operationId: listComments
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: sort
          in: query
          required: false
          description: Stable comment order. relevant preserves the default order; recent sorts newest first; liked sorts by comment-like count then newest.
          schema:
            type: string
            enum: [relevant, recent, liked]
            default: relevant
      responses:
        '200':
          description: Comment thread (cursor paginated, depth-limited).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListResponse' }
        '4XX': { $ref: '#/components/responses/ClientError' }
    post:
      tags: [Comments]
      summary: Create content comment
      operationId: createComment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 10000 }
                parentId: { $ref: '#/components/schemas/ResourceId' }
      responses:
        '201':
          description: Created. May enter PENDING when moderation is required.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /contents/{contentId}/poll:
    parameters:
      - $ref: '#/components/parameters/ContentId'
    get:
      tags: [Interactions]
      summary: Read poll state for a published post
      description: >-
        Returns the active poll and aggregate vote counts. If a valid browser
        session cookie is supplied, viewerOptionId identifies that viewer's vote.
        Only published posts are public; an owner may read their own draft poll.
        The response varies by viewer and must not be shared-cached.
      operationId: getContentsContentIdPoll
      security:
        - sessionCookieAuth: []
        - {}
      responses:
        '200':
          description: Poll state, or null when the post has no poll.
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                additionalProperties: false
                properties:
                  data:
                    type: object
                    required: [poll]
                    additionalProperties: false
                    properties:
                      poll:
                        oneOf:
                          - $ref: '#/components/schemas/ContentPoll'
                          - type: 'null'
                  requestId: { type: string, minLength: 1 }
        '400': { $ref: '#/components/responses/ClientError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: Social poll service unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      tags: [Interactions]
      summary: Configure a poll on an owned post
      description: >-
        Creates a poll while the post is a draft. Once published, repeating the
        same configuration is allowed, but poll options and duration cannot be
        changed. Option labels are normalized and case-insensitive duplicates
        are rejected. Requires an authenticated eligible creator and Idempotency-Key.
      operationId: postContentsContentIdPoll
      security:
        - sessionCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [options]
              additionalProperties: false
              properties:
                options:
                  type: array
                  minItems: 2
                  maxItems: 4
                  uniqueItems: true
                  items: { type: string, minLength: 1, maxLength: 50 }
                durationHours:
                  type: integer
                  enum: [24, 72, 168]
                  default: 24
      responses:
        '200':
          description: Current poll configuration and results.
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                additionalProperties: false
                properties:
                  data:
                    type: object
                    required: [poll]
                    additionalProperties: false
                    properties:
                      poll: { $ref: '#/components/schemas/ContentPoll' }
                  requestId: { type: string, minLength: 1 }
        '400': { $ref: '#/components/responses/ClientError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/IdempotencyKeyRequired' }
        '503':
          description: Social poll service unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      tags: [Interactions]
      summary: Delete a poll before the post has votes
      description: Removing a poll is restricted by the W05 poll lifecycle and requires Idempotency-Key.
      operationId: deleteContentsContentIdPoll
      security:
        - sessionCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      responses:
        '204': { description: Poll removed. No response body. }
        '400': { $ref: '#/components/responses/ClientError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '428': { $ref: '#/components/responses/IdempotencyKeyRequired' }
        '503':
          description: Social poll service unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /contents/{contentId}/poll/votes:
    parameters:
      - $ref: '#/components/parameters/ContentId'
    post:
      tags: [Interactions]
      summary: Cast the current user's vote in a published post poll
      description: >-
        Each user may vote once. Requires an authenticated eligible interaction
        layer and Idempotency-Key. W05 validates the poll and W03 revalidates
