openapi: 3.1.0
info:
  title: LuckRead API
  version: 1.0.0
  description: >-
    Contract-first public API for the LuckRead self-media platform.
    All endpoints are authorization-enforced. Cache is never an authorization
    boundary (see AUTHZ-CACHE-INVARIANT-001). Errors use the canonical error
    contract. List endpoints use opaque cursors, never offset, for large sets.
  license:
    name: Proprietary
    identifier: proprietary
servers:
  - url: /api/v1
    description: API v1
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Authentication and session lifecycle operations.
  - name: Users
    description: User profile and account lifecycle operations.
  - name: Contents
    description: Content creation, retrieval, updates, deletion, and lifecycle.
  - name: Media
    description: Media upload initiation and metadata operations.
  - name: Comments
    description: Content comment and discussion operations.
  - name: Interactions
    description: Likes, follows, and other social interactions.
  - name: Feed
    description: Personalized and discovery feed operations.
  - name: Search
    description: Content search operations.
  - name: Notifications
    description: User notification operations.
  - name: Creators
    description: Creator profile and creator-facing operations.
  - name: IPs
    description: Intellectual-property center and membership operations.
  - name: Organizations
    description: Organization lifecycle operations.
  - name: Admin
    description: Administrative and moderation operations.
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new account
      security: []
      operationId: authRegister
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identityType, identity, credential]
              properties:
                identityType: { enum: [phone, email] }
                identity: { type: string }
                credential: { type: string, format: password }
                username: { type: string }
                consent: { type: object }
      responses:
        '201':
          description: Registered. Account enters PENDING_VERIFICATION.
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId: { $ref: '#/components/schemas/ResourceId' }
                  accountState: { $ref: '#/components/schemas/AccountState' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and issue tokens
      security: []
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identity, credential, deviceId]
              additionalProperties: false
              properties:
                identity: { type: string }
                credential: { type: string, format: password }
                deviceId:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: Opaque client-generated privacy-safe device reference; never derive from IP, User-Agent, fingerprinting, cookies, geolocation or hardware identifiers.
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  refreshToken: { type: string }
                  expiresIn: { type: integer }
                  layer: { type: string, pattern: '^L[0-8]$' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke current session and increment token version
      operationId: authLogout
      responses:
        '204':
          description: Logged out; token version incremented.
        '4XX': { $ref: '#/components/responses/ClientError' }

  /auth/sessions:
    get:
      tags: [Auth]
      summary: List current user's sessions
      operationId: authSessionList
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Current user's sessions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 50
                    items:
                      type: object
                      required: [sessionId, createdAt, expiresAt]
                      properties:
                        sessionId:
                          $ref: '#/components/schemas/ResourceId'
                        deviceId:
                          $ref: '#/components/schemas/ResourceId'
                        createdAt:
                          type: string
                          format: date-time
                        expiresAt:
                          type: string
                          format: date-time
                        lastSeenAt:
                          type: string
                          format: date-time
                          nullable: true
                  nextCursor:
                    type: string
                    nullable: true
        '4XX': { $ref: '#/components/responses/ClientError' }

  /auth/sessions/{sessionId}:
    delete:
      tags: [Auth]
      summary: Revoke one current user's session
      operationId: authSessionRevoke
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204':
          description: Session revoked or already-revoked owned session.
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '4XX': { $ref: '#/components/responses/ClientError' }

  /users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      operationId: getMe
      responses:
        '200':
          description: Current user profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '4XX': { $ref: '#/components/responses/ClientError' }
    patch:
      tags: [Users]
      summary: Update current user profile
      operationId: updateMe
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /users/{userId}/account-state:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Users, Admin]
      summary: Transition account lifecycle state
      operationId: transitionAccountState
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, reason]
              properties:
                to: { $ref: '#/components/schemas/AccountState' }
                reason: { type: string, maxLength: 2048 }
      responses:
        '200':
          description: Transitioned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  from: { $ref: '#/components/schemas/AccountState' }
                  to: { $ref: '#/components/schemas/AccountState' }
                  auditEventId: { $ref: '#/components/schemas/ResourceId' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /contents:
    get:
      tags: [Contents]
      summary: List content
      operationId: listContents
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Content list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListResponse' }
        '4XX': { $ref: '#/components/responses/ClientError' }
    post:
      tags: [Contents]
      summary: Create content draft
      operationId: createContent
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentInput' }
      responses:
        '201':
          description: Created in DRAFT.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Content' }
        '403': { $ref: '#/components/responses/PermissionDenied' }

  /contents/{contentId}:
    parameters:
      - $ref: '#/components/parameters/ContentId'
    get:
      tags: [Contents]
      summary: Get content by ID
      operationId: getContent
      responses:
        '200':
          description: >-
            Content. Returns 404 rather than 403 when the caller may not access
            it, to avoid existence disclosure.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Content' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Contents]
      summary: Update content
      operationId: updateContent
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentInput' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Content' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      tags: [Contents]
      summary: Delete content
      operationId: deleteContent
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
      responses:
        '204':
          description: Soft-deleted.
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /contents/{contentId}/state:
    parameters:
      - $ref: '#/components/parameters/ContentId'
    post:
      tags: [Contents]
      summary: Transition content lifecycle state
      operationId: transitionContentState
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { $ref: '#/components/schemas/ContentState' }
                scheduledAt: { type: string, format: date-time }
                reason: { type: string }
      responses:
        '200':
          description: Transitioned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  from: { $ref: '#/components/schemas/ContentState' }
                  to: { $ref: '#/components/schemas/ContentState' }
                  version: { type: integer }
                  etag: { $ref: '#/components/schemas/ETag' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /media:
    post:
      tags: [Media]
      summary: Initiate an upload (single or multipart)
      operationId: createMedia
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mimeType, size, checksum]
              properties:
                mimeType: { type: string }
                size: { type: integer, minimum: 1 }
                checksum:
                  type: string
                  description: SHA-256 of the object
                multipart: { type: boolean }
      responses:
        '201':
          description: Upload initiated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Media' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /media/{mediaId}:
    parameters:
      - $ref: '#/components/parameters/MediaId'
    get:
      tags: [Media]
      summary: Get media metadata
      operationId: getMedia
      responses:
        '200':
          description: Media metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Media' }
        '404': { $ref: '#/components/responses/NotFound' }

    delete:
      tags: [Media]
      summary: Discovery draft for DELETE undefined
      operationId: deleteMedia
      x-luckread-contract-status: DISCOVERY_DRAFT
      x-luckread-source: contracts/api/api-inventory.v1.json
      responses:
        default:
          description: Discovery-only operation; detailed response contract remains to be closed.
  /contents/{contentId}/comments:
    parameters:
      - $ref: '#/components/parameters/ContentId'
    get:
      tags: [Comments]
      summary: List content comments
      operationId: listComments
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Comment thread (cursor paginated, depth-limited).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListResponse' }
        '4XX': { $ref: '#/components/responses/ClientError' }
    post:
      tags: [Comments]
      summary: Create content comment
      operationId: createComment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 10000 }
                parentId: { $ref: '#/components/schemas/ResourceId' }
      responses:
        '201':
          description: Created. May enter PENDING when moderation is required.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /interactions/likes:
    post:
      tags: [Interactions]
      summary: Idempotent like. Repeating MUST NOT create a second like.
      operationId: like
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InteractionTarget' }
      responses:
        '200':
          description: Like recorded (idempotent).
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Interactions]
      summary: Idempotent unlike.
      operationId: unlike
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InteractionTarget' }
      responses:
        '204':
          description: Like removed (idempotent).
        '4XX': { $ref: '#/components/responses/ClientError' }

  /social/follows:
    post:
      tags: [Interactions]
      summary: Idempotent follow.
      operationId: follow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetUserId]
              properties:
                targetUserId: { $ref: '#/components/schemas/ResourceId' }
      responses:
        '200':
          description: Followed (idempotent).
        '4XX': { $ref: '#/components/responses/ClientError' }
    delete:
      tags: [Interactions]
      summary: Idempotent unfollow.
      operationId: unfollow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetUserId]
              properties:
                targetUserId: { $ref: '#/components/schemas/ResourceId' }
      responses:
        '204':
          description: Unfollowed (idempotent).
        '4XX': { $ref: '#/components/responses/ClientError' }

  /feed:
    get:
      tags: [Feed]
      summary: Get personalized feed
      operationId: getFeed
      parameters:
        - name: type
          in: query
          schema: { enum: [following, recommendation, creator, ip, topic, hot] }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: >-
            Feed page. Authorization-filtered server-side; never cached across
            viewers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListResponse' }
        '400': { $ref: '#/components/responses/InvalidCursor' }

  /search:
    get:
      tags: [Search]
      summary: Search content
      operationId: searchContent
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Search results. Permission-filtered before caching.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListResponse' }
        '4XX': { $ref: '#/components/responses/ClientError' }

  /notifications:
    get:
      tags: [Notifications]
      summary: List current user notifications
      operationId: listNotifications
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Notifications.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListResponse' }
        '4XX': { $ref: '#/components/responses/ClientError' }
    patch:
      tags: [Notifications]
      summary: Batch update notifications
      operationId: batchUpdateNotifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, action]
              properties:
                ids: { type: array, items: { $ref: '#/components/schemas/ResourceId' }, minItems: 1, maxItems: 100 }
                action: { enum: [read, unread] }
      responses:
        '204':
          description: Notifications updated.
        '4XX': { $ref: '#/components/responses/ClientError' }

  /creators/me:
    get:
      tags: [Creators]
      summary: Get current creator profile
      operationId: getMyCreator
      responses:
        '200':
          description: Creator profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Creator' }
        '4XX': { $ref: '#/components/responses/ClientError' }

  /ips:
    post:
      tags: [IPs]
      summary: Create an IP center
      operationId: createIp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '201':
          description: IP created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IP' }
        '4XX': { $ref: '#/components/responses/ClientError' }

  /ips/{ipId}/members:
    parameters:
      - $ref: '#/components/parameters/IpId'
    post:
      tags: [IPs]
      summary: Invite an IP member
      operationId: inviteIpMember
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { $ref: '#/components/schemas/ResourceId' }
      responses:
        '201':
          description: Invitation created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceId' }
        '4XX': { $ref: '#/components/responses/ClientError' }
    delete:
      tags: [IPs]
      summary: Remove an IP member
      operationId: removeIpMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { $ref: '#/components/schemas/ResourceId' }
      responses:
        '204':
          description: Membership removed.
        '4XX': { $ref: '#/components/responses/ClientError' }

  /organizations:
    post:
      tags: [Organizations]
      summary: Create an organization
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '201':
          description: Organization created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '4XX': { $ref: '#/components/responses/ClientError' }

  /admin/moderation:
    get:
      tags: [Admin]
      summary: List moderation cases
      operationId: listModerationCases
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Moderation cases.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListResponse' }
        '4XX': { $ref: '#/components/responses/ClientError' }
  /interactions/blocks:
    post:
      tags: [Interactions]
      summary: Block a user
      operationId: blockUser
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetUserId]
              properties:
                targetUserId: { $ref: '#/components/schemas/ResourceId' }
      responses:
        '200': { description: Blocked (idempotent). }
        '4XX': { $ref: '#/components/responses/ClientError' }

  /interactions/blocks/{targetUserId}:
    parameters:
      - name: targetUserId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ResourceId' }
    delete:
      tags: [Interactions]
      summary: Unblock a user
      operationId: unblockUser
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      responses:
        '204': { description: Unblocked (idempotent). }
        '4XX': { $ref: '#/components/responses/ClientError' }

  /interactions/mutes:
    post:
      tags: [Interactions]
      summary: Mute a user
      operationId: muteUser
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetUserId]
              properties:
                targetUserId: { $ref: '#/components/schemas/ResourceId' }
      responses:
        '200': { description: Muted (idempotent). }
        '4XX': { $ref: '#/components/responses/ClientError' }

  /interactions/mutes/{targetUserId}:
    parameters:
      - name: targetUserId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ResourceId' }
    delete:
      tags: [Interactions]
      summary: Unmute a user
      operationId: unmuteUser
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      responses:
        '204': { description: Unmuted (idempotent). }
        '4XX': { $ref: '#/components/responses/ClientError' }

  /reports:
    post:
      tags: [Admin]
      summary: Create a moderation report
      operationId: createReport
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetType, targetId, reasonCode]
              properties:
                targetType: { enum: [content, comment, creator, media, profile] }
                targetId: { $ref: '#/components/schemas/ResourceId' }
                reasonCode: { type: string, maxLength: 128 }
                description: { type: string, maxLength: 4000 }
                evidenceRefs: { type: array, maxItems: 20, items: { type: string, maxLength: 512 } }
      responses:
        '201': { description: Report created (idempotent). }
        '4XX': { $ref: '#/components/responses/ClientError' }

  /appeals:
    post:
      tags: [Admin]
      summary: Create a moderation appeal
      operationId: createAppeal
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [moderationCaseId, reason]
              properties:
                moderationCaseId: { $ref: '#/components/schemas/ResourceId' }
                reason: { type: string, minLength: 1, maxLength: 4000 }
                evidenceRefs: { type: array, maxItems: 20, items: { type: string, maxLength: 512 } }
      responses:
        '201': { description: Appeal created (idempotent). }
        '4XX': { $ref: '#/components/responses/ClientError' }

  /contents/{contentId}/revisions:
    parameters:
      - $ref: '#/components/parameters/ContentId'
    get:
      tags: [Contents]
      summary: List immutable content revisions
      operationId: listContentRevisions
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Content revisions. }
        '4XX': { $ref: '#/components/responses/ClientError' }

  /contents/{contentId}/revisions/{revisionId}:
    parameters:
      - $ref: '#/components/parameters/ContentId'
      - name: revisionId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ResourceId' }
    get:
      tags: [Contents]
      summary: Get an immutable content revision
      operationId: getContentRevision
      responses:
        '200': { description: Content revision. }
        '4XX': { $ref: '#/components/responses/ClientError' }

  /contents/{contentId}/revisions/{revisionId}/rollback:
    parameters:
      - $ref: '#/components/parameters/ContentId'
      - name: revisionId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ResourceId' }
    post:
      tags: [Contents]
      summary: Roll back content to a revision by creating a new revision
      operationId: rollbackContentRevision
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
