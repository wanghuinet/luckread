components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    sessionCookieAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Browser cookie carrier for the same current session used by bearerAuth.
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ResourceId' }
    ContentId:
      name: contentId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ResourceId' }
    MediaId:
      name: mediaId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ResourceId' }
    IpId:
      name: ipId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ResourceId' }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ResourceId' }
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ResourceId' }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 256 }
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 256 }
    IfMatchRequired:
      name: If-Match
      in: header
      required: true
      schema: { $ref: '#/components/schemas/ETag' }
  responses:
    Unauthenticated:
      description: Authentication required.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationFailed:
      description: Validation failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Rate limited.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PermissionDenied:
      description: Permission denied.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidState:
      description: Invalid lifecycle transition.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PreconditionFailed:
      description: If-Match does not match current ETag.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PreconditionRequired:
      description: If-Match is required for this operation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    IdempotencyKeyRequired:
      description: Idempotency-Key is required for this mutation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnsupportedMediaType:
      description: Unsupported media type.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidCursor:
      description: Invalid cursor.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ClientError:
      description: Client error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServiceUnavailable:
      description: Service unavailable.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    AuthMfaStatus:
      type: object
      required: [enabled, verified, enrolledAt]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        verified: { type: boolean }
        enrolledAt: { type: [string, 'null'], format: date-time }
    AuthMfaChallengeRequired:
      type: object
      required: [data, requestId]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [mfaRequired, availableMethods]
          additionalProperties: false
          properties:
            mfaRequired: { type: boolean, const: true }
            availableMethods:
              type: array
              uniqueItems: true
              items: { type: string, enum: [totp, recovery_code] }
        requestId: { type: string }
    AuthMfaEnrollmentStartRequest:
      type: object
      required: [currentPassword]
      additionalProperties: false
      properties:
        currentPassword: { type: string, minLength: 1, writeOnly: true }
    AuthMfaEnrollmentStartResponse:
      type: object
      required: [totpUri, recoveryCodes]
      additionalProperties: false
      properties:
        totpUri: { type: string, format: uri, writeOnly: true }
        recoveryCodes:
          type: array
          minItems: 1
          items: { type: string, minLength: 8, writeOnly: true }
    AuthMfaEnrollmentConfirmRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
    HyperswitchWebhookReceiptResponse:
      type: object
      required: [data, requestId]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [outcome, eventId, receiptId, state, payloadSha256]
          additionalProperties: false
          properties:
            outcome:
              type: string
              enum: [APPLIED, RECONCILIATION_REQUIRED, REJECTED, DUPLICATE, PAYLOAD_CONFLICT]
            eventId: { type: string, minLength: 1, maxLength: 255 }
            receiptId: { type: string, minLength: 1, maxLength: 255 }
            state:
              type: string
              enum: [RECEIVED, APPLIED, RECONCILIATION_REQUIRED, REJECTED]
            payloadSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
            conflictId: { type: string, minLength: 1, maxLength: 255 }
        requestId: { type: string, minLength: 1, maxLength: 256 }
    CommerceOrderCreateRequest:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [itemRef, quantity]
            additionalProperties: false
            properties:
              itemRef:
                type: string
                minLength: 1
                maxLength: 255
                description: Opaque item or offer reference; W07 must resolve an authoritative purchasable offer and price.
              quantity:
                type: integer
                minimum: 1
                maximum: 10000
    CommerceOrderData:
      type: object
      required: [orderId, status, version, currency, subtotalMinor, discountMinor, taxMinor, totalMinor, items, createdAt, updatedAt]
      additionalProperties: false
      properties:
        orderId: { type: string, minLength: 1, maxLength: 255 }
        status:
          type: string
          enum: [CREATED, PENDING_PAYMENT, CONFIRMED, PROCESSING, COMPLETED, CANCELLED, FAILED]
        version: { type: integer, minimum: 1 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        subtotalMinor: { type: integer, minimum: 0 }
        discountMinor: { type: integer, minimum: 0 }
        taxMinor: { type: integer, minimum: 0 }
        totalMinor:
          type: integer
          minimum: 0
          description: Must equal subtotalMinor minus discountMinor plus taxMinor.
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/CommerceOrderLineData' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CommerceOrderLineData:
      type: object
      required: [itemRef, quantity, unitAmountMinor, lineSubtotalMinor, lineDiscountMinor, lineTaxMinor, lineTotalMinor]
      additionalProperties: false
      properties:
        itemRef: { type: string, minLength: 1, maxLength: 255 }
        quantity: { type: integer, minimum: 1, maximum: 10000 }
        unitAmountMinor: { type: integer, minimum: 0 }
        lineSubtotalMinor:
          type: integer
          minimum: 0
          description: Must equal unitAmountMinor multiplied by quantity.
        lineDiscountMinor: { type: integer, minimum: 0 }
        lineTaxMinor: { type: integer, minimum: 0 }
        lineTotalMinor:
          type: integer
          minimum: 0
          description: Must equal lineSubtotalMinor minus lineDiscountMinor plus lineTaxMinor.
    CommerceOrderResponse:
      type: object
      required: [data, requestId]
      additionalProperties: false
      properties:
        data: { $ref: '#/components/schemas/CommerceOrderData' }
        requestId: { type: string, minLength: 1 }
    ResourceId:
      type: string
      minLength: 1
      maxLength: 128
    Credential:
      type: object
      required: [credentialId, kind, active]
      additionalProperties: false
      properties:
        credentialId:
          $ref: '#/components/schemas/ResourceId'
        kind:
          type: string
          enum: [username, email, phone]
        active:
          type: boolean
    Cursor:
      $ref: '../../schemas/common/cursor.json'
    RequestId:
      $ref: '../../schemas/common/request-id.json'
    TraceId:
      $ref: '../../schemas/common/trace-id.json'
    ETag:
      type: string
      minLength: 1
      maxLength: 256
    AuthRegistrationConsent:
      type: object
      required: [purpose, policyVersion]
      properties:
        purpose: { type: string, enum: [ACCOUNT_REGISTRATION] }
        policyVersion: { type: string }
      additionalProperties: false
    AccountState:
      $ref: '../../enums/account-state.json'
    ContentState:
      $ref: '../../enums/content-state.json'
    ErrorResponse:
      $ref: '../../schemas/common/error-response.json'
    ListResponse:
      $ref: '../../schemas/common/list-response.json'
    User:
      type: object
      required: [id, username, accountState, layer]
      properties:
        id: { $ref: '#/components/schemas/ResourceId' }
