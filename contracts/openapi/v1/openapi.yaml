  /payments/intents:
    post:
      tags: [Commerce]
      summary: Create a customer-bound Hyperswitch payment intent for an existing owned order
      description: >-
        W01 authenticates the customer session and authorizes order.read before forwarding
        the order ID to the existing private W07 service binding. Amount, currency, customer
        and provider credentials are server controlled. The browser receives only the scoped
        client secret needed by the hosted Hyperswitch Payment Element. Client callbacks and
        return URLs do not establish payment success or grant subscription entitlement.
      operationId: postPaymentsIntents
      x-luckread-contract-status: CONTRACTED_PARTIAL
      x-luckread-runtime-status: IMPLEMENTED_SOURCE_ONLY_PENDING_D1_04_MIGRATION_AND_SECRETS
      x-luckread-source: contracts/api/api-inventory.v1.json
      x-luckread-max-body-bytes: 16384
      security:
        - sessionCookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [orderId]
              properties:
                orderId: { type: string, pattern: '^ord_[A-Za-z0-9_-]{1,90}$' }
      responses:
        '201':
          description: New unconfirmed payment intent ready for hosted checkout.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [paymentId, orderId, amountMinor, currency, pricingMode, status, version, clientSecret]
                    properties:
                      paymentId: { type: string, pattern: '^pay_[a-f0-9]{26}$' }
                      orderId: { type: string, pattern: '^ord_[A-Za-z0-9_-]{1,90}$' }
                      amountMinor: { type: integer, minimum: 1, maximum: 2147483647 }
                      currency: { type: string, pattern: '^[A-Z]{3}$' }
                      pricingMode: { type: string, enum: [live, demo] }
                      status: { type: string, enum: [requires_payment_method, requires_confirmation] }
                      version: { type: integer, minimum: 1 }
                      clientSecret: { type: string, minLength: 1, maxLength: 4096 }
                  requestId: { $ref: '#/components/schemas/RequestId' }
        '200':
          description: Idempotent replay of the same unconfirmed payment intent.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
