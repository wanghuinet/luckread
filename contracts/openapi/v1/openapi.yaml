            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    required: [applicationId, status, grantState, version]
                    properties:
                      applicationId: { $ref: '#/components/schemas/ResourceId' }
                      status: { type: string, enum: [APPROVED, REJECTED] }
                      grantState: { type: string, enum: [PENDING, GRANTED, NOT_REQUESTED] }
                      version: { type: integer, minimum: 1 }
                  requestId: { $ref: '#/components/schemas/RequestId' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '503': { $ref: '#/components/responses/ClientError' }

