  /topics/{topicName}:
    get:
      tags: [Search]
      summary: Read an active public topic and its paginated published content
      description: >-
        Normalizes the topic name using Unicode NFKC and case-insensitive matching.
        Only ACTIVE topics are visible. W01 applies public-read rate limiting and
        a short-lived public response cache; W05 owns topic relationships, while
        W03 remains authoritative for published content fields. No session is
        required. Cursor values are opaque and must be returned unchanged.
      operationId: getTopicsTopicName
      security: []
      parameters:
        - name: topicName
          in: path
          required: true
          description: Topic display name or normalized name; an optional leading # is ignored.
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: limit
          in: query
          required: false
          description: Maximum number of visible published content items returned. Defaults to 20.
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          required: false
          description: Opaque continuation cursor returned by a previous page.
          schema: { type: string, minLength: 1, maxLength: 2048 }
      responses:
        '200':
          description: Active topic and a bounded page of currently published content.
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                additionalProperties: false
                properties:
                  data:
                    type: object
                    required: [topic, contents, hasMore, nextCursor]
                    additionalProperties: false
                    properties:
                      topic:
                        type: object
                        required: [topicId, name, displayName, status]
                        additionalProperties: false
                        properties:
                          topicId: { $ref: '#/components/schemas/ResourceId' }
                          name: { type: string, minLength: 1, maxLength: 64 }
                          displayName: { type: string, minLength: 1, maxLength: 64 }
                          status: { type: string, enum: [ACTIVE] }
                      contents:
                        type: array
                        maxItems: 50
                        items:
                          type: object
                          required: [id, contentType, title, updatedAt]
                          additionalProperties: false
                          properties:
                            id: { $ref: '#/components/schemas/ResourceId' }
                            contentType: { type: string, enum: [article, post, video] }
                            title: { type: string }
                            updatedAt: { type: string, format: date-time }
                      hasMore: { type: boolean }
                      nextCursor: { type: [string, 'null'], maxLength: 2048 }
                  requestId: { type: string, minLength: 1 }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: Social topic or W03 published-content service unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /users/by-username/{username}:
    get:
      tags: [Users]
      summary: Get a public user profile by username
      description: >-
        Returns the minimal public profile projection used to resolve a username
        to its canonical user ID. Email, locale, timezone, Better Auth identity
        identifiers and other private account fields are never included. This
        route is public, applies W01 public-read rate limiting, and caches the
        projection for 30 seconds with stale-while-revalidate support.
      operationId: getUsersByUsernameUsername
      security: []
      parameters:
        - name: username
          in: path
          required: true
          description: Username matching the canonical ASCII username format.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$'
      responses:
        '200':
          description: Public profile projection for the requested username.
          headers:
            Cache-Control:
              description: Public cache lifetime with bounded stale-while-revalidate.
              schema: { type: string, const: 'public, max-age=30, stale-while-revalidate=120' }
          content:
            application/json:
              schema:
                type: object
                required: [id, username, displayName, bio, avatar, requestId]
                additionalProperties: false
                properties:
                  id: { $ref: '#/components/schemas/ResourceId' }
                  username: { type: string, maxLength: 128 }
                  displayName: { type: [string, 'null'] }
                  bio: { type: [string, 'null'] }
                  avatar: { type: [string, 'null'] }
                  requestId: { type: string, minLength: 1 }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: Public profile service unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /membership/plans/{planId}:
    parameters:
      - name: planId
        in: path
        required: true
        schema: { type: string, pattern: '^plan_[a-f0-9]{64}$' }
    put:
      tags: [Creators]
      summary: Revise the authenticated creator's membership plan terms
      operationId: updateOwnMembershipPlan
      description: >-
        Requires membership.plan.update.own and an ACTIVE creator identity.
        If-Match must match the current plan ETag. W07 appends a new immutable
        plan version and conditionally advances the current pointer. Existing
        subscriptions retain their prior plan version and benefits snapshot.
        W01 confirms a durable W06 intent before mutation and the immutable
        update audit afterward. Retired plans cannot be revised.
      security:
        - sessionCookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, tier, billingInterval, priceMinor, currency, benefits]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                tier: { type: string, pattern: '^[a-z][a-z0-9_-]{0,63}$' }
                billingInterval: { type: string, enum: [MONTHLY, YEARLY] }
                priceMinor: { type: integer, minimum: 0, maximum: 2147483647 }
                currency: { type: string, pattern: '^[A-Z]{3}$' }
                benefits:
                  type: array
                  maxItems: 20
                  uniqueItems: true
                  items: { type: string, minLength: 1, maxLength: 180 }
      responses:
        '200':
          description: Updated current plan version or exact successful retry.
          headers:
            ETag:
              schema: { $ref: '#/components/schemas/ETag' }
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    required: [planId, creatorId, planVersion, name, tier, billingInterval, priceMinor, currency, benefits, status, visibility, version, etag, replayed, createdAt, updatedAt]
                    properties:
                      planId: { type: string, pattern: '^plan_[a-f0-9]{64}$' }
                      creatorId: { $ref: '#/components/schemas/ResourceId' }
                      planVersion: { type: integer, minimum: 1 }
                      name: { type: string, minLength: 1, maxLength: 120 }
                      tier: { type: string, pattern: '^[a-z][a-z0-9_-]{0,63}$' }
                      billingInterval: { type: string, enum: [MONTHLY, YEARLY] }
                      priceMinor: { type: integer, minimum: 0, maximum: 2147483647 }
                      currency: { type: string, pattern: '^[A-Z]{3}$' }
                      benefits:
                        type: array
                        maxItems: 20
                        items: { type: string, minLength: 1, maxLength: 180 }
                      status: { type: string, enum: [DRAFT, ACTIVE, PAUSED] }
                      visibility: { type: string, enum: [PRIVATE, PUBLIC] }
                      version: { type: integer, minimum: 1 }
                      etag: { $ref: '#/components/schemas/ETag' }
                      replayed: { type: boolean }
                      createdAt: { type: string, format: date-time }
                      updatedAt: { type: string, format: date-time }
                  requestId: { $ref: '#/components/schemas/RequestId' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /membership/plans/{planId}/lifecycle:
    parameters:
      - name: planId
        in: path
        required: true
        schema: { type: string, pattern: '^plan_[a-f0-9]{64}$' }
    post:
      tags: [Creators]
      summary: Pause, resume, or permanently retire an owned membership plan
      operationId: transitionOwnMembershipPlanLifecycle
      description: >-
        Requires membership.plan.lifecycle.own and an ACTIVE creator identity.
        If-Match must match the lifecycle ETag. Pause hides the plan from new
        sales; resume restores ACTIVE/PUBLIC visibility; retire permanently
        sets a PAUSED/PRIVATE plan to RETIRED/PRIVATE. An active plan must first
        be paused. No lifecycle action changes existing subscriptions or grants
        or revokes access. W01 confirms a durable W06 intent before W07's
        owner-scoped D1-01 CAS and confirms W06's immutable final audit.
      security:
        - sessionCookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action: { type: string, enum: [pause, resume, retire] }
      responses:
        '200':
          description: Plan lifecycle changed or exact retry/no-op was confirmed.
          headers:
            ETag:
              schema: { $ref: '#/components/schemas/ETag' }
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    required: [planId, creatorId, planVersion, status, visibility, version, etag, replayed]
                    properties:
                      planId: { type: string, pattern: '^plan_[a-f0-9]{64}$' }
