  /creator-applications:
    get:
      tags: [Creators]
      summary: Read the current user's creator qualification application
      operationId: getMyCreatorApplication
      security:
        - sessionCookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Current user's latest creator application, if any.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                additionalProperties: false
                properties:
                  data:
                    type: object
                    required: [application]
                    properties:
                      application:
                        anyOf:
                          - type: object
                            required: [application_id, creator_type, status, grant_state, version]
                            properties:
                              application_id: { $ref: '#/components/schemas/ResourceId' }
                              creator_type: { type: string, enum: [PERSONAL, WRITER, VIDEO_CREATOR, DEVELOPER, ARTIST, OTHER] }
                              statement: { type: string, maxLength: 2000 }
                              status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
                              grant_state: { type: string, enum: [NOT_REQUESTED, PENDING, GRANTED] }
                              version: { type: integer, minimum: 1 }
                              created_at: { type: string, format: date-time }
                              updated_at: { type: string, format: date-time }
                              decided_at: { type: [string, 'null'], format: date-time }
                              decision_reason: { type: [string, 'null'], maxLength: 500 }
                          - type: 'null'
                  requestId: { $ref: '#/components/schemas/RequestId' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/ClientError' }
    post:
      tags: [Creators]
      summary: Apply for a creator identity and L3 publishing eligibility
      description: >-
        Only an active, email-verified L2 account may apply. The client cannot
        choose roles, layers, creator identifiers, reviewer, scope or decision.
        Approval and the L3 RoleAssignment are committed as separate audited
        steps; a pending grant is not treated as active creator access.
      operationId: applyForCreator
      security:
        - sessionCookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [creatorType]
              additionalProperties: false
              properties:
                creatorType:
                  type: string
                  enum: [PERSONAL, WRITER, VIDEO_CREATOR, DEVELOPER, ARTIST, OTHER]
                statement:
                  type: string
                  maxLength: 2000
      responses:
        '201':
          description: Creator application recorded as pending review.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    required: [applicationId, status, grantState, version]
                    properties:
                      applicationId: { $ref: '#/components/schemas/ResourceId' }
                      status: { type: string, const: PENDING }
                      grantState: { type: string, const: NOT_REQUESTED }
                      version: { type: integer, const: 1 }
                  requestId: { $ref: '#/components/schemas/RequestId' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '503': { $ref: '#/components/responses/ClientError' }

