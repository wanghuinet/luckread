        '200':
          description: Bounded page of pending applications.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    required: [data, limit]
                    properties:
                      data: { type: array, items: { type: object } }
                      limit: { type: integer, minimum: 1, maximum: 50 }
