openapi: 3.1.0
info:
  title: LuckRead API
  version: 1.0.0
  description: >-
    Contract-first public API for the LuckRead self-media platform.
    All endpoints are authorization-enforced. Cache is never an authorization
    boundary (see AUTHZ-CACHE-INVARIANT-001). Errors use the canonical error
    contract. List endpoints use opaque cursors, never offset, for large sets.
  license:
    name: Proprietary
servers:
  - url: /api/v1
    description: API v1
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Authentication and session lifecycle operations.
  - name: Users
    description: User profile and account lifecycle operations.
  - name: Contents
    description: Content creation, retrieval, updates, deletion, and lifecycle.
  - name: Media
    description: Media upload initiation and metadata operations.
  - name: Comments
    description: Content comment and discussion operations.
  - name: Interactions
    description: Likes, follows, and other social interactions.
  - name: Feed
    description: Personalized and discovery feed operations.
  - name: Search
    description: Content search operations.
  - name: Notifications
    description: User notification operations.
  - name: Creators
    description: Creator profile and creator-facing operations.
  - name: IPs
    description: Intellectual-property center and membership operations.
  - name: Organizations
    description: Organization lifecycle operations.
  - name: Admin
    description: Administrative and moderation operations.
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new account
      security: []
      operationId: authRegister
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identityType, identity, credential]
              properties:
                identityType: { enum: [phone, email] }
                identity: { type: string }
                credential: { type: string, format: password }
                username: { type: string }
                consent: { type: object }
      responses:
        '201':
          description: Registered. Account enters PENDING_VERIFICATION.
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId: { $ref: '#/components/schemas/ResourceId' }
                  accountState: { $ref: '#/components/schemas/AccountState' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and issue tokens
      security: []
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identity, credential]
              properties:
                identity: { type: string }
                credential: { type: string, format: password }
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  refreshToken: { type: string }
                  expiresIn: { type: integer }
                  layer: { type: string, pattern: '^L[0-8]$' }
        '401':
          description: >-
            Invalid credentials. The response is identical whether or not the
            account exists, to prevent account enumeration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke current session and increment token version
      operationId: authLogout
      responses:
        '204':
          description: Logged out; token version incremented.
        '4XX': { $ref: '#/components/responses/ClientError' }

  /users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      operationId: getMe
      responses:
        '200':
          description: Current user profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '4XX': { $ref: '#/components/responses/ClientError' }
    patch:
      tags: [Users]
      summary: Update current user profile
      operationId: updateMe
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /users/{userId}/account-state:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Users, Admin]
      summary: Transition account lifecycle state
      operationId: transitionAccountState
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, reason]
              properties:
                to: { $ref: '#/components/schemas/AccountState' }
                reason: { type: string, maxLength: 2048 }
      responses:
        '200':
          description: Transitioned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  from: { $ref: '#/components/schemas/AccountState' }
                  to: { $ref: '#/components/schemas/AccountState' }
                  auditEventId: { $ref: '#/components/schemas/ResourceId' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /contents:
    get:
      tags: [Contents]
      summary: List content
      operationId: listContents
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Content list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListResponse' }
        '4XX': { $ref: '#/components/responses/ClientError' }
    post:
      tags: [Contents]
      summary: Create content draft
      operationId: createContent
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentInput' }
      responses:
        '201':
          description: Created in DRAFT.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Content' }
        '403': { $ref: '#/components/responses/PermissionDenied' }

  /contents/{contentId}:
    parameters:
      - $ref: '#/components/parameters/ContentId'
    get:
      tags: [Contents]
      summary: Get content by ID
      operationId: getContent
      responses:
        '200':
          description: >-
            Content. Returns 404 rather than 403 when the caller may not access
            it, to avoid existence disclosure.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Content' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Contents]
      summary: Update content
      operationId: updateContent
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentInput' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Content' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      tags: [Contents]
      summary: Delete content
      operationId: deleteContent
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
      responses:
        '204':
          description: Soft-deleted.
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /contents/{contentId}/state:
    parameters:
      - $ref: '#/components/parameters/ContentId'
    post:
      tags: [Contents]
      summary: Transition content lifecycle state
      operationId: transitionContentState
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { $ref: '#/components/schemas/ContentState' }
                scheduledAt: { type: string, format: date-time }
                reason: { type: string }
      responses:
        '200':
          description: Transitioned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  from: { $ref: '#/components/schemas/ContentState' }
                  to: { $ref: '#/components/schemas/ContentState' }
                  version: { type: integer }
                  etag: { $ref: '#/components/schemas/ETag' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /media:
    post:
      tags: [Media]
      summary: Initiate an upload (single or multipart)
      operationId: createMedia
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mimeType, size, checksum]
              properties:
                mimeType: { type: string }
                size: { type: integer, minimum: 1 }
                checksum:
                  type: string
                  description: SHA-256 of the object
                multipart: { type: boolean }
      responses:
        '201':
          description: Upload initiated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Media' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /media/{mediaId}:
    parameters:
      - $ref: '#/components/parameters/MediaId'
    get:
      tags: [Media]
      summary: Get media metadata
      operationId: getMedia
      responses:
        '200':
          description: Media metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Media' }
        '404': { $ref: '#/components/responses/NotFound' }

  /contents/{contentId}/comments:
    parameters:
      - $ref: '#/components/parameters/ContentId'
    get:
      tags: [Comments]
      summary: List content comments
      operationId: listComments
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Comment thread (cursor paginated, depth-limited).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListResponse' }
        '4XX': { $ref: '#/components/responses/ClientError' }
    post:
      tags: [Comments]
      summary: Create content comment
      operationId: createComment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 10000 }
                parentId: { $ref: '#/components/schemas/ResourceId' }
      responses:
        '201':
          description: Created. May enter PENDING when moderation is required.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /interactions/likes:
    post:
      tags: [Interactions]
      summary: Idempotent like. Repeating MUST NOT create a second like.
      operationId: like
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InteractionTarget' }
      responses:
        '200':
          description: Like recorded (idempotent).
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Interactions]
      summary: Idempotent unlike.
      operationId: unlike
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InteractionTarget' }
      responses:
        '204':
          description: Like removed (idempotent).
        '4XX': { $ref: '#/components/responses/ClientError' }

  /social/follows:
    post:
      tags: [Interactions]
      summary: Idempotent follow.
      operationId: follow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetUserId]
              properties:
                targetUserId: { $ref: '#/components/schemas/ResourceId' }
      responses:
        '200':
          description: Followed (idempotent).
        '4XX': { $ref: '#/components/responses/ClientError' }
    delete:
      tags: [Interactions]
      summary: Idempotent unfollow.
      operationId: unfollow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetUserId]
              properties:
                targetUserId: { $ref: '#/components/schemas/ResourceId' }
      responses:
        '204':
          description: Unfollowed (idempotent).
        '4XX': { $ref: '#/components/responses/ClientError' }

  /feed:
    get:
      tags: [Feed]
      summary: Get personalized feed
      operationId: getFeed
      parameters:
        - name: type
          in: query
          schema: { enum: [following, recommendation, creator, ip, topic, hot] }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: >-
            Feed page. Authorization-filtered server-side; never cached across
            viewers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListResponse' }
        '400': { $ref: '#/components/responses/InvalidCursor' }

  /search:
    get:
      tags: [Search]
      summary: Search content
      operationId: search
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Search results. Permission-filtered before caching.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListResponse' }
        '4XX': { $ref: '#/components/responses/ClientError' }

  /notifications:
    get:
      tags: [Notifications]
      summary: List current user notifications
      operationId: listNotifications
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Notifications.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListResponse' }
        '4XX': { $ref: '#/components/responses/ClientError' }
    patch:
      tags: [Notifications]
      summary: Batch update notifications
      operationId: batchUpdateNotifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, action]
              properties:
                ids: { type: array, items: { $ref: '#/components/schemas/ResourceId' }, minItems: 1, maxItems: 100 }
                action: { enum: [read, unread] }
      responses:
        '204':
          description: Notifications updated.
        '4XX': { $ref: '#/components/responses/ClientError' }

  /creators/me:
    get:
      tags: [Creators]
      summary: Get current creator profile
      operationId: getMyCreator
      responses:
        '200':
          description: Creator profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Creator' }
        '4XX': { $ref: '#/components/responses/ClientError' }

  /ips:
    post:
      tags: [IPs]
      summary: Create an IP center
      operationId: createIp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '201':
          description: IP created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IP' }
        '4XX': { $ref: '#/components/responses/ClientError' }

  /ips/{ipId}/members:
    parameters:
      - $ref: '#/components/parameters/IpId'
    post:
      tags: [IPs]
      summary: Invite an IP member
      operationId: inviteIpMember
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { $ref: '#/components/schemas/ResourceId' }
      responses:
        '201':
          description: Invitation created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceId' }
        '4XX': { $ref: '#/components/responses/ClientError' }
    delete:
      tags: [IPs]
      summary: Remove an IP member
      operationId: removeIpMember
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { $ref: '#/components/schemas/ResourceId' }
      responses:
        '204':
          description: Membership removed.
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '4XX': { $ref: '#/components/responses/ClientError' }

  /organizations:
    post:
      tags: [Organizations]
      summary: Create an organization
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '201':
          description: Organization created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '4XX': { $ref: '#/components/responses/ClientError' }

  /admin/moderation:
    get:
      tags: [Admin]
      summary: List moderation cases
      operationId: listModerationCases
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Moderation cases.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListResponse' }
        '4XX': { $ref: '#/components/responses/ClientError' }
  /interactions/blocks:
    post:
      tags: [Interactions]
      summary: Block a user
      operationId: blockUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetUserId]
              properties:
                targetUserId: { $ref: '#/components/schemas/ResourceId' }
      responses:
        '200': { description: Blocked (idempotent). }
        '4XX': { $ref: '#/components/responses/ClientError' }

  /interactions/blocks/{targetUserId}:
    parameters:
      - name: targetUserId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ResourceId' }
    delete:
      tags: [Interactions]
      summary: Unblock a user
      operationId: unblockUser
      responses:
        '204': { description: Unblocked (idempotent). }
        '4XX': { $ref: '#/components/responses/ClientError' }

  /interactions/mutes:
    post:
      tags: [Interactions]
      summary: Mute a user
      operationId: muteUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetUserId]
              properties:
                targetUserId: { $ref: '#/components/schemas/ResourceId' }
      responses:
        '200': { description: Muted (idempotent). }
        '4XX': { $ref: '#/components/responses/ClientError' }

  /interactions/mutes/{targetUserId}:
    parameters:
      - name: targetUserId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ResourceId' }
    delete:
      tags: [Interactions]
      summary: Unmute a user
      operationId: unmuteUser
      responses:
        '204': { description: Unmuted (idempotent). }
        '4XX': { $ref: '#/components/responses/ClientError' }

  /reports:
    post:
      tags: [Admin]
      summary: Create a moderation report
      operationId: createReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetType, targetId, reasonCode]
              properties:
                targetType: { enum: [content, comment, creator, media, profile] }
                targetId: { $ref: '#/components/schemas/ResourceId' }
                reasonCode: { type: string, maxLength: 128 }
                description: { type: string, maxLength: 4000 }
                evidenceRefs: { type: array, maxItems: 20, items: { type: string, maxLength: 512 } }
      responses:
        '201': { description: Report created (idempotent). }
        '4XX': { $ref: '#/components/responses/ClientError' }

  /appeals:
    post:
      tags: [Admin]
      summary: Create a moderation appeal
      operationId: createAppeal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [moderationCaseId, reason]
              properties:
                moderationCaseId: { $ref: '#/components/schemas/ResourceId' }
                reason: { type: string, minLength: 1, maxLength: 4000 }
                evidenceRefs: { type: array, maxItems: 20, items: { type: string, maxLength: 512 } }
      responses:
        '201': { description: Appeal created (idempotent). }
        '4XX': { $ref: '#/components/responses/ClientError' }

  /contents/{contentId}/revisions:
    parameters:
      - $ref: '#/components/parameters/ContentId'
    get:
      tags: [Contents]
      summary: List immutable content revisions
      operationId: listContentRevisions
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Content revisions. }
        '4XX': { $ref: '#/components/responses/ClientError' }

  /contents/{contentId}/revisions/{revisionId}:
    parameters:
      - $ref: '#/components/parameters/ContentId'
      - name: revisionId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ResourceId' }
    get:
      tags: [Contents]
      summary: Get an immutable content revision
      operationId: getContentRevision
      responses:
        '200': { description: Content revision. }
        '4XX': { $ref: '#/components/responses/ClientError' }
    post:
      tags: [Contents]
      summary: Roll back content to a revision by creating a new revision
      operationId: rollbackContentRevision
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 2048 }
      responses:
        '200': { description: Rollback completed and a new revision was created. }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '4XX': { $ref: '#/components/responses/ClientError' }

  /content/{contentId}/shares:
    post:
      tags: [Contents]
      summary: Create a share token for content
      operationId: createShare
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentId]
              properties:
                contentId: { $ref: '#/components/schemas/ResourceId' }
      responses:
        '201': { description: Share created. }
        '4XX': { $ref: '#/components/responses/ClientError' }

  /shares/{shareId}:
    parameters:
      - name: shareId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ResourceId' }
    get:
      tags: [Contents]
      summary: Resolve a share token
      security: []
      operationId: resolveShare
      responses:
        '200': { description: Share resolved. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }

  /memberships/subscriptions:
    post:
      tags: [Users]
      summary: Create a subscription
      operationId: createSubscription
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId]
              properties:
                planId: { $ref: '#/components/schemas/ResourceId' }
      responses:
        '201': { description: Subscription created. }
        '4XX': { $ref: '#/components/responses/ClientError' }

  /memberships/subscriptions/{subscriptionId}:
    parameters:
      - name: subscriptionId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ResourceId' }
    get:
      tags: [Users]
      summary: Get a subscription
      operationId: getSubscription
      responses:
        '200': { description: Subscription. }
        '4XX': { $ref: '#/components/responses/ClientError' }

  /memberships/subscriptions/{subscriptionId}/cancel:
    parameters:
      - name: subscriptionId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ResourceId' }
    post:
      tags: [Users]
      summary: Cancel a subscription
      operationId: cancelSubscription
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
      responses:
        '200': { description: Subscription canceled. }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '4XX': { $ref: '#/components/responses/ClientError' }

  /entitlements/{subjectId}:
    parameters:
      - name: subjectId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ResourceId' }
    get:
      tags: [Users]
      summary: Get effective entitlements
      operationId: getEntitlements
      responses:
        '200': { description: Effective server-derived entitlements. }
        '4XX': { $ref: '#/components/responses/ClientError' }

  /entitlements/check:
    post:
      tags: [Users]
      summary: Check an entitlement
      operationId: checkEntitlement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subjectId, entitlement]
              properties:
                subjectId: { $ref: '#/components/schemas/ResourceId' }
                entitlement: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '200': { description: Entitlement decision. }
        '4XX': { $ref: '#/components/responses/ClientError' }

  /organizations/{organizationId}/members:
    parameters:
      - name: organizationId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ResourceId' }
    get:
      tags: [Organizations]
      summary: List organization members
      operationId: listOrganizationMembers
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Organization members. }
        '4XX': { $ref: '#/components/responses/ClientError' }

  /organizations/{organizationId}/members/invitations:
    parameters:
      - name: organizationId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ResourceId' }
    post:
      tags: [Organizations]
      summary: Invite an organization member
      operationId: inviteOrganizationMember
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Organization invitation created. }
        '4XX': { $ref: '#/components/responses/ClientError' }

  /organizations/{organizationId}/members/{memberId}:
    parameters:
      - name: organizationId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ResourceId' }
      - name: memberId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ResourceId' }
    delete:
      tags: [Organizations]
      summary: Remove an organization member
      operationId: removeOrganizationMember
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
      responses:
        '204': { description: Organization member removed. }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '4XX': { $ref: '#/components/responses/ClientError' }

  /organizations/{organizationId}/members/{memberId}/role:
    parameters:
      - name: organizationId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ResourceId' }
      - name: memberId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ResourceId' }
    post:
      tags: [Organizations]
      summary: Change an organization member role
      operationId: changeOrganizationMemberRole
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200': { description: Organization member role changed. }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '4XX': { $ref: '#/components/responses/ClientError' }

  /ips/{ipId}/contents:
    parameters:
      - $ref: '#/components/parameters/IpId'
    get:
      tags: [IPs]
      summary: List content belonging to an IP projection
      operationId: listIpContents
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: IP content projection. }
        '4XX': { $ref: '#/components/responses/ClientError' }

  /ips/{ipId}/contents/{contentId}:
    parameters:
      - $ref: '#/components/parameters/IpId'
      - $ref: '#/components/parameters/ContentId'
    get:
      tags: [IPs]
      summary: Get an IP content projection
      operationId: getIpContent
      responses:
        '200': { description: IP content projection. }
        '4XX': { $ref: '#/components/responses/ClientError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ResourceId' }
    ContentId:
      name: contentId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ResourceId' }
    MediaId:
      name: mediaId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ResourceId' }
    IpId:
      name: ipId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ResourceId' }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 256 }
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 256 }
    IfMatchRequired:
      name: If-Match
      in: header
      required: true
      schema: { $ref: '#/components/schemas/ETag' }
  responses:
    ValidationFailed:
      description: Validation failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Rate limited.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PermissionDenied:
      description: Permission denied.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidState:
      description: Invalid lifecycle transition.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PreconditionFailed:
      description: If-Match does not match current ETag.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PreconditionRequired:
      description: If-Match is required for this operation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnsupportedMediaType:
      description: Unsupported media type.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidCursor:
      description: Invalid cursor.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ClientError:
      description: Client error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ResourceId:
      type: string
      minLength: 1
      maxLength: 128
    ETag:
      type: string
      minLength: 1
      maxLength: 256
    AccountState:
      $ref: '../../enums/account-state.json'
    ContentState:
      $ref: '../../enums/content-state.json'
    ErrorResponse:
      $ref: '../../schemas/common/error-response.json'
    ListResponse:
      $ref: '../../schemas/common/list-response.json'
    User:
      type: object
      required: [id, username, accountState, layer]
      properties:
        id: { $ref: '#/components/schemas/ResourceId' }
        username: { type: string }
        accountState: { $ref: '#/components/schemas/AccountState' }
        layer: { type: string, pattern: '^L[0-8]$' }
    Content:
      type: object
      required: [id, state, version, etag]
      properties:
        id: { $ref: '#/components/schemas/ResourceId' }
        state: { $ref: '#/components/schemas/ContentState' }
        version: { type: integer, minimum: 1 }
        etag: { $ref: '#/components/schemas/ETag' }
    ContentInput:
      type: object
      required: [title, bodyRef]
      properties:
        title: { type: string, minLength: 1, maxLength: 512 }
        bodyRef: { type: string, description: R2 object reference }
    Media:
      type: object
      required: [id, mimeType, size, checksum, status]
      properties:
        id: { $ref: '#/components/schemas/ResourceId' }
        mimeType: { type: string }
        size: { type: integer, minimum: 1 }
        checksum: { type: string }
        status: { enum: [INITIATED, UPLOADING, READY, FAILED, QUARANTINED] }
    Comment:
      type: object
      required: [id, body, state]
      properties:
        id: { $ref: '#/components/schemas/ResourceId' }
        body: { type: string }
        state: { enum: [PENDING, PUBLISHED, REJECTED] }
    InteractionTarget:
      type: object
      required: [targetType, targetId]
      properties:
        targetType: { enum: [content, comment, creator, ip] }
        targetId: { $ref: '#/components/schemas/ResourceId' }
    Creator:
      type: object
      required: [id, userId, displayName]
      properties:
        id: { $ref: '#/components/schemas/ResourceId' }
        userId: { $ref: '#/components/schemas/ResourceId' }
        displayName: { type: string }
    IP:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/ResourceId' }
        name: { type: string }
    Organization:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/ResourceId' }
        name: { type: string }
