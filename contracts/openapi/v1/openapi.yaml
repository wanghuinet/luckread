          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                additionalProperties: false
                properties:
                  data:
                    type: object
                    required: [poll]
                    additionalProperties: false
                    properties:
                      poll: { $ref: '#/components/schemas/ContentPoll' }
                  requestId: { type: string, minLength: 1 }
        '400': { $ref: '#/components/responses/ClientError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/IdempotencyKeyRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: Social poll service unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /interactions/likes:
    post:
