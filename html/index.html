<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="LuckRead 自媒体内容平台">
  <title>LuckRead — 自媒体内容平台</title>
  <link rel="stylesheet" href="./css/luckread-shell.css">
</head>
<body>
  <!-- Reusable header template -->
  <header class="lr-site-header">
    <div class="lr-header-inner">
      <a class="lr-brand" href="https://luckread.com/" aria-label="LuckRead 首页">
        <span class="lr-brand-mark" aria-hidden="true">L</span>
        <span class="lr-brand-name">LuckRead</span>
      </a>
      <button class="lr-nav-toggle" type="button" aria-expanded="false" aria-controls="lr-primary-nav">
        <span class="sr-only">打开导航</span>
        <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
      </button>
      <nav id="lr-primary-nav" class="lr-primary-nav" aria-label="主导航">
        <a href="https://luckread.com/">首页</a>
        <a href="https://luckread.com/articles">文章</a>
        <a href="https://luckread.com/posts">动态</a>
        <a href="https://luckread.com/videos">视频</a>
        <a href="https://luckread.com/shorts">短视频</a>
      </nav>
      <div class="lr-header-actions">
        <a class="lr-creator-link" href="https://mp.luckread.com/creator-center">创作者中心</a>
        <a class="lr-login-link" href="/login">登录</a>
        <a class="lr-register-button" href="/register">注册</a>
      </div>
    </div>
  </header>

  <main class="lr-demo-main">
    <h1>LuckRead</h1>
    <p>自媒体平台公共 Header / Footer 模板。实际业务页面接入时保留结构与 class contract，替换内容区域即可。</p>
  </main>

  <footer class="lr-site-footer">
    <div class="lr-footer-inner">
      <div class="lr-footer-brand">
        <a class="lr-brand lr-brand-footer" href="https://luckread.com/" aria-label="LuckRead 首页">
          <span class="lr-brand-mark" aria-hidden="true">L</span>
          <span class="lr-brand-name">LuckRead</span>
        </a>
        <p>让创作者持续表达，让优质内容被看见。</p>
      </div>
      <nav class="lr-footer-nav" aria-label="页脚导航">
        <a href="/articles">文章</a>
        <a href="/posts">动态</a>
        <a href="/videos">视频</a>
        <a href="/shorts">短视频</a>
        <a href="/about">关于 LuckRead</a>
        <a href="/help">帮助中心</a>
      </nav>
      <div class="lr-footer-meta">
        <span>© <span data-lr-year></span> LuckRead</span>
        <a href="/terms">用户协议</a>
        <a href="/privacy">隐私政策</a>
      </div>
    </div>
  </footer>
  <script src="./js/luckread-shell.js" defer></script>
</body>
</html>
